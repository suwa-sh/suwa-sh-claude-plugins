deviations:
  - id: "product-deviation-001"
    title: "職員向け面の閉域化を接続元 IP 制限で代替する"
    affected_requirements: ["REQ-IWD-001", "REQ-NET-002"]
    justification: "根拠となる NFR E.5.3.1 が important: false・confidence: low であり、館内ネットワーク設備の状況も未確定。product-decision-004 参照"
    risk: "medium"
    mitigation: "館内グローバル IP の固定性を確認し、必要なら Site-to-Site VPN + 内部 ALB へ移行する。移行時の変更範囲は ALB のスキームとサブネット配置に限定される"
    expires: "2026-12-31"

  - id: "product-deviation-002"
    title: "トークン検証をエッジではなくアプリケーション層で行う"
    affected_requirements: ["REQ-EDGE-001"]
    justification: "常駐コンテナ構成でのコスト効率を優先。product-decision-002 参照"
    risk: "low"
    mitigation: "WAF のレート制限で不正流入を抑制し、ALT-014（トークン検証失敗の急増）で監視する"
    expires: "2027-03-31"
