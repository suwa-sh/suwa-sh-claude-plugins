version: "1.0"
event_id: "20260412_140535_initial_build"
created_at: "2026-04-12T14:05:35"
source: "初期要望.txt"
system_name: "図書館蔵書管理システム"

requirements:
  - id: "REQ-001"
    requirement: "図書館の蔵書と利用者を一元管理できるシステムを構築する"
    reason: "蔵書と利用者の情報が分散しており、一元的に管理することで業務効率と利用者サービスを向上させるため"
    priority: "must"
    specifications:
      - id: "SPEC-001-01"
        specification: "書籍情報（タイトル、著者、ISBN、出版社、ジャンル等）を登録・編集・削除できる"
        acceptance_criteria:
          - "Given 司書がログイン済み When 書籍登録画面でISBN・タイトル・著者を入力して登録する Then 書籍が蔵書として登録され一覧に表示される"
          - "Given 登録済み書籍が存在する When 司書が書籍情報を編集する Then 変更内容が反映される"
        affected_models:
          - type: "information"
            action: "add"
            target: "書籍"
          - type: "actor"
            action: "add"
            target: "司書"
          - type: "buc"
            action: "add"
            target: "蔵書管理フロー"
      - id: "SPEC-001-02"
        specification: "利用者情報（氏名、連絡先、利用者番号等）を登録・編集・削除できる"
        acceptance_criteria:
          - "Given 司書がログイン済み When 利用者登録画面で氏名・連絡先を入力して登録する Then 利用者が登録され利用者番号が発行される"
        affected_models:
          - type: "information"
            action: "add"
            target: "利用者"
          - type: "buc"
            action: "add"
            target: "利用者管理フロー"
      - id: "SPEC-001-03"
        specification: "書籍をキーワード、タイトル、著者、ISBN、ジャンルで検索できる"
        acceptance_criteria:
          - "Given 利用者がシステムにアクセス済み When 検索条件を入力して検索する Then 条件に合致する書籍の一覧が表示される"
        affected_models:
          - type: "buc"
            action: "add"
            target: "蔵書検索フロー"
          - type: "actor"
            action: "add"
            target: "利用者"

  - id: "REQ-002"
    requirement: "書籍の貸出・返却・予約をWeb画面から行えるようにする"
    reason: "貸出・返却・予約業務をシステム化することで、手作業による管理の手間やミスを削減し、利用者の利便性を高めるため"
    priority: "must"
    specifications:
      - id: "SPEC-002-01"
        specification: "利用者が書籍の貸出手続きをWeb画面から行える"
        acceptance_criteria:
          - "Given 利用者が貸出可能な書籍を選択済み When 貸出ボタンを押す Then 貸出が記録され返却期限が設定される"
          - "Given 書籍が貸出中の場合 When 別の利用者が貸出を試みる Then 貸出不可のメッセージが表示される"
        affected_models:
          - type: "information"
            action: "add"
            target: "貸出"
          - type: "state"
            action: "add"
            target: "書籍貸出状態"
          - type: "buc"
            action: "add"
            target: "貸出管理フロー"
      - id: "SPEC-002-02"
        specification: "利用者が書籍の返却手続きをWeb画面から行える"
        acceptance_criteria:
          - "Given 利用者が貸出中の書籍を選択済み When 返却ボタンを押す Then 返却が記録され書籍が貸出可能になる"
        affected_models:
          - type: "information"
            action: "modify"
            target: "貸出"
          - type: "state"
            action: "modify"
            target: "書籍貸出状態"
      - id: "SPEC-002-03"
        specification: "利用者が貸出中の書籍に対して予約を行える"
        acceptance_criteria:
          - "Given 書籍が貸出中 When 利用者が予約ボタンを押す Then 予約が記録され予約順が設定される"
          - "Given 予約済み書籍が返却された When 予約順1位の利用者に通知する Then 利用者に予約可能通知が届く"
        affected_models:
          - type: "information"
            action: "add"
            target: "予約"
          - type: "state"
            action: "add"
            target: "予約状態"
          - type: "buc"
            action: "add"
            target: "予約管理フロー"

  - id: "REQ-003"
    requirement: "貸出期限の管理や延滞者への通知を自動化する"
    reason: "貸出期限の管理と延滞通知を手動で行うと漏れが発生しやすく、自動化により確実な運用と司書の負荷軽減を実現するため"
    priority: "must"
    specifications:
      - id: "SPEC-003-01"
        specification: "貸出時に返却期限を自動設定し、期限が近づいたら利用者にリマインド通知を送信する"
        acceptance_criteria:
          - "Given 貸出が記録済み When 返却期限3日前になる Then 利用者にリマインドメールが送信される"
        affected_models:
          - type: "condition"
            action: "add"
            target: "貸出期限ルール"
          - type: "external_system"
            action: "add"
            target: "メール送信サービス"
      - id: "SPEC-003-02"
        specification: "返却期限を超過した場合に延滞者へ督促通知を自動送信する"
        acceptance_criteria:
          - "Given 返却期限を超過した貸出が存在する When 日次バッチが実行される Then 延滞者にメールで督促通知が送信される"
        affected_models:
          - type: "state"
            action: "modify"
            target: "書籍貸出状態"
          - type: "buc"
            action: "add"
            target: "延滞管理フロー"

  - id: "REQ-004"
    requirement: "利用者が自分の貸出履歴や予約状況を確認できるようにする"
    reason: "利用者自身が貸出状況や予約状況をいつでも確認できることで、自己管理が可能になり問い合わせ対応の負荷も軽減されるため"
    priority: "must"
    specifications:
      - id: "SPEC-004-01"
        specification: "利用者が自分の貸出履歴（過去・現在）をWeb画面で確認できる"
        acceptance_criteria:
          - "Given 利用者がログイン済み When マイページの貸出履歴画面を開く Then 過去と現在の貸出一覧が表示される"
        affected_models:
          - type: "buc"
            action: "add"
            target: "利用者マイページフロー"
      - id: "SPEC-004-02"
        specification: "利用者が自分の予約状況をWeb画面で確認できる"
        acceptance_criteria:
          - "Given 利用者がログイン済み When マイページの予約状況画面を開く Then 現在の予約一覧と予約順が表示される"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "利用者マイページフロー"

  - id: "REQ-005"
    requirement: "司書が在庫状況や人気書籍の統計を把握できるようにする"
    reason: "在庫状況や貸出傾向を可視化することで、蔵書の補充計画や運営改善に役立てるため"
    priority: "should"
    specifications:
      - id: "SPEC-005-01"
        specification: "司書が書籍の在庫状況（貸出中・在庫あり・予約待ち）を一覧で確認できる"
        acceptance_criteria:
          - "Given 司書がログイン済み When 在庫状況画面を開く Then 全書籍の在庫状態が一覧表示される"
        affected_models:
          - type: "buc"
            action: "add"
            target: "統計・レポートフロー"
      - id: "SPEC-005-02"
        specification: "司書が人気書籍ランキングや貸出統計をレポートとして確認できる"
        acceptance_criteria:
          - "Given 司書がログイン済み When 統計レポート画面を開く Then 貸出回数ランキング・期間別統計が表示される"
        affected_models:
          - type: "information"
            action: "add"
            target: "統計情報"
          - type: "buc"
            action: "modify"
            target: "統計・レポートフロー"

  - id: "REQ-006"
    requirement: "将来的に電子書籍にも対応できるようにする"
    reason: "電子書籍への対応を見据えた設計にしておくことで、将来の拡張時に大規模な改修を避けるため"
    priority: "could"
    specifications:
      - id: "SPEC-006-01"
        specification: "書籍情報に資料種別（紙書籍・電子書籍）を持たせ、将来の電子書籍対応に備える"
        acceptance_criteria:
          - "Given 書籍登録画面 When 資料種別を選択できる Then 紙書籍として登録でき、将来電子書籍も選択可能な設計となっている"
        affected_models:
          - type: "variation"
            action: "add"
            target: "資料種別"

  - id: "REQ-007"
    requirement: "貸出手続きにおける利用者認証とアクセス制御の実装契約を明確化する"
    reason: "認証基盤（OAuth2/OIDCのリソースサーバー検証）の実装契約（利用者IDの受け渡し方法・エラー応答・ロール表現）が仕様のどこにも定義されておらず、S5 verifyでなりすまし・RBAC未実装がセキュリティ上のmajor findingとして継続指摘されているため"
    priority: "must"
    specifications:
      - id: "SPEC-007-01"
        specification: "状態変更を伴うAPIにおいて、利用者IDを受け渡す認証ヘッダをAPI仕様に定義する"
        acceptance_criteria:
          - "Given 認証基盤が未整備の暫定運用 When 状態変更を伴うAPIが呼び出される Then 利用者ID受け渡し用の認証ヘッダ（暫定: X-User-Id）がAPI仕様に定義されている"
          - "Given 認証ヘッダが欠落または不正な値である When APIが呼び出される Then 401エラー（RFC 7807形式）が返却される"
        affected_models:
          - type: "condition"
            action: "add"
            target: "利用者認証・アクセス制御ルール"
      - id: "SPEC-007-02"
        specification: "ロールベースアクセス制御（RBAC）のロール表現（claim名・値の集合）をAPI仕様に定義し、frontendのAPIクライアントが送信すべき認証情報をtier-frontend.mdに明記する"
        acceptance_criteria:
          - "Given RBACのロール値が仕様に定義されている When 状態変更APIが呼び出される Then ロールに応じたアクセス制御が判定できる"
          - "Given tier-frontend.mdに認証情報の送信方法が明記されている When frontendのAPIクライアントを実装する Then backend側の契約と一致する"
        affected_models:
          - type: "condition"
            action: "modify"
            target: "利用者認証・アクセス制御ルール"

  - id: "REQ-008"
    requirement: "予約状態モデルに完了状態を追加し、貸出可否判定における予約参照仕様を明確化する"
    reason: "予約者本人による貸出可否判定や予約完了処理をめぐって、状態モデル（予約状態）・条件（貸出可否判定ルール）・データストアスキーマの記述が不完全かつ相互に矛盾しており、実装のたびに独自解釈で埋め合わせが発生しているため"
    priority: "must"
    specifications:
      - id: "SPEC-008-01"
        specification: "予約状態モデルに、貸出完了に伴う「完了」状態と予約確保済からの遷移を追加する"
        acceptance_criteria:
          - "Given 予約確保済の予約が存在する When 予約者本人が書籍を貸出する Then 予約状態が完了に遷移する"
          - "Given 予約状態モデルに完了状態が定義されている When reservations.status を実装する Then pending/reserved/cancelled/fulfilledの4値が正式な値として一致する"
        affected_models:
          - type: "state"
            action: "modify"
            target: "予約状態"
      - id: "SPEC-008-02"
        specification: "貸出可否判定ルールに、予約者本人（予約確保済）の場合は貸出可能とする例外を明記し、貸出を申請するBUCアクティビティが予約情報を参照することを明示する"
        acceptance_criteria:
          - "Given その書籍に予約受付中の予約がある When 予約者本人以外が貸出を試みる Then 貸出不可と判定される"
          - "Given その書籍を予約確保済にしている利用者本人 When 貸出を試みる Then 貸出可能と判定される"
        affected_models:
          - type: "condition"
            action: "modify"
            target: "貸出可否判定ルール"
          - type: "buc"
            action: "modify"
            target: "貸出管理フロー"

  - id: "REQ-009"
    requirement: "API/イベント契約（openapi.yaml/asyncapi.yaml）の生成品質を担保し、機械的な型生成エラーを解消する"
    reason: "契約生成ツール（openapi-generator, asyncapi-cli）の制約により、日本語ラベルのenumやtitle欠落のpayloadスキーマから構文エラーや意味不明な型名（AnonymousSchema）が生成され、実装がbarrel importの迂回を強いられている。今後 searchBooks を利用するUC（書籍を検索する）は迂回策が使えず根本修正が必須であるため"
    priority: "should"
    specifications:
      - id: "SPEC-009-01"
        specification: "asyncapi.yaml の components.messages.*.payload スキーマに title を付与する"
        acceptance_criteria:
          - "Given payload スキーマに title が付与されている When 契約（TypeScript型）を再生成する Then AnonymousSchema_* でなく意味のある型名が生成される"
        affected_models:
          - type: "external_system"
            action: "modify"
            target: "メール送信サービス"
      - id: "SPEC-009-02"
        specification: "openapi.yaml の searchBooks genre/material_type enum に x-enum-varnames（英語識別子）を追加する"
        acceptance_criteria:
          - "Given enum に x-enum-varnames が定義されている When openapi-generator（typescript-fetch）で型生成する Then SearchBooksGenreEnum/SearchBooksMaterialTypeEnum が構文エラーなく生成される"
        affected_models:
          - type: "variation"
            action: "modify"
            target: "書籍ジャンル"
          - type: "variation"
            action: "modify"
            target: "資料種別"

  - id: "REQ-010"
    requirement: "冪等キー重複時のAPI応答仕様の矛盾を解消する"
    reason: "冪等キー重複時の挙動について、全API共通のkvs-schema.yamlの説明（キャッシュ済みレスポンスの返却を示唆）と、本UC個別のtier-backend-api.md（409エラーを明記しBDDで検証）が矛盾しており、他UCが同じidempotencyパターンを使う際に同じ解釈判断を都度行う必要が生じるため"
    priority: "should"
    specifications:
      - id: "SPEC-010-01"
        specification: "kvs-schema.yaml の value_description を実際の挙動に合わせて訂正するか、個別API仕様（tier-*.md のエラー表）を優先する旨を明記する"
        acceptance_criteria:
          - "Given 冪等キーが重複したリクエストを送信する When APIが応答する Then kvs-schema.yaml と tier-backend-api.md の記述が矛盾なく一致する"
        affected_models:
          - type: "condition"
            action: "add"
            target: "冪等リクエスト処理ルール"

  - id: "REQ-011"
    requirement: "貸出完了表示における返却期限フォーマットを統一する"
    reason: "tier-frontend.mdのプロース記述（スラッシュ区切り）とBDDシナリオ（ハイフン区切り）で返却期限の表記が食い違い、実装上「貸出前プレビュー」と「貸出完了後の確定表示」でユーザーへの表記が不統一なまま提供されているため"
    priority: "could"
    specifications:
      - id: "SPEC-011-01"
        specification: "tier-frontend.md の返却期限表記をスラッシュ/ハイフンいずれかに統一する"
        acceptance_criteria:
          - "Given 貸出前プレビューと貸出完了後の確定表示 When 返却期限を表示する Then 同一の区切り文字形式で表示される"
        affected_models:
          - type: "information"
            action: "modify"
            target: "貸出"

  - id: "REQ-012"
    requirement: "LoanConfirmationコンポーネントのonLoan戻り値型を仕様上明確化する"
    reason: "tier-frontend.mdのProps表でonLoanの戻り値をPromise<void>と定義する一方、状態表のloanResult（貸出結果）を描画するには戻り値からLoanResponseを取得する必要があり、Props表と状態表の間で値の受け渡し経路が仕様上閉じていないため"
    priority: "could"
    specifications:
      - id: "SPEC-012-01"
        specification: "tier-frontend.md の onLoan を () => Promise<LoanResponse> に修正するか、loanResult を親コンポーネントから渡すPropsとして設計を明確化する"
        acceptance_criteria:
          - "Given onLoanの戻り値型が仕様上明確化されている When LoanConfirmationコンポーネントを実装する Then 型定義と実装（貸出結果の取得経路）が整合する"
        affected_models:
          - type: "information"
            action: "modify"
            target: "貸出"
