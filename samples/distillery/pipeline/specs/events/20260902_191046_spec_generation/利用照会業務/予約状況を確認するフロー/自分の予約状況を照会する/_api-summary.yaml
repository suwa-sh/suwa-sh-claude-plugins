# _api-summary.yaml
uc: "自分の予約状況を照会する"
business: "利用照会業務"
buc: "予約状況を確認するフロー"
endpoints:
  - operation_id: "listMyReservations"
    method: "GET"
    path: "/api/v1/me/reservations"
    summary: "本人の予約一覧を予約状態で絞り込み、ページネーションつきで返す"
    response_schema: "MyReservationListResponse"
    tags: ["reservations", "me"]
async_events: []
# cross-UC API 依存（他 UC 所有 operation の利用）。形式は
# _cross-cutting/api/uc-api-dependencies.md「記録場所と形式」を正本とする。
# 本 UC は自 UC 所有の listMyReservations だけで成立する
# （予約順位確認画面・取置き中予約確認画面へは画面遷移のみで、本画面から API を呼ばない）。
consumes: []
schemas:
  - name: "MyReservationListResponse"
    properties:
      - name: "items"
        type: "array<MyReservationItem>"
        required: true
      - name: "total"
        type: "integer"
        required: true
      - name: "page"
        type: "integer"
        required: true
      - name: "size"
        type: "integer"
        required: true
      - name: "active_count"
        type: "integer"
        required: true
  - name: "MyReservationItem"
    properties:
      - name: "reservation_id"
        type: "string"
        required: true
      - name: "book_id"
        type: "string"
        required: true
      - name: "book_title"
        type: "string"
        required: true
      - name: "book_author"
        type: "string"
        required: true
      - name: "book_genre"
        type: "string"
        required: true
      - name: "book_material_type"
        type: "string"
        required: true
      - name: "reservation_status"
        type: "string"
        required: true
      - name: "priority"
        type: "integer"
        required: false
      - name: "applied_at"
        type: "string(date-time)"
        required: true
      - name: "hold_expires_at"
        type: "string(date-time)"
        required: false
