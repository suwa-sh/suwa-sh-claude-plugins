models:
  - name: "貸出履歴画面 / LoanTable + Pagination"
    tier: "tier-frontend-patron"
    layer: "view"
    type: "view-model"
    rdra_info: "貸出"
  - name: "ListMyLoanHistoryApiRequest"
    tier: "tier-frontend-patron"
    layer: "api-client"
    type: "request"
    rdra_info: "貸出"
  - name: "ListMyLoansRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "貸出"
  - name: "ListMyLoanHistoryQuery"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "query"
    rdra_info: "貸出"
  - name: "OwnerAccessPolicy"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "利用者アカウント"
  - name: "MyLoanHistoryItem"
    tier: "tier-backend-api"
    layer: "repository"
