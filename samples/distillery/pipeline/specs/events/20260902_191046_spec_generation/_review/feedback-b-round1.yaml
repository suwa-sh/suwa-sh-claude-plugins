round: 1
findings:
  - id: "S-001"
    viewpoint: "routing"
    severity: "major"
    target: "予約管理業務/書籍を予約するフロー/予約を取り消す/tier-frontend-staff.md"
    claim: "司書ティアの画面仕様が patron ポータル所属のルート id を宣言しており、AppShell が「ポータル外のルートを描画しない」規約と矛盾する"
    evidence: "- **ルート id**: `patron-reservation-cancel`（routes.ts では portal: 'patron'）"
    suggested_fix: "ルート id を staff ポータルのものへ改めるか（design 側に staff-reservation-cancel を追加）、本 UC の画面を tier-frontend-patron へ移すかを design ステージと合わせて 1 つに決める"

  - id: "S-002"
    viewpoint: "handoff"
    severity: "major"
    target: "貸出期限管理業務/延滞を督促するフロー/督促メールを送信する/tier-frontend-staff.md"
    claim: "受け渡し契約が完了結果型の正本を自 UC の _api-summary.yaml の response_schema と書いているが、当該 UC は endpoints: [] で response_schema を持たない（resendNotification は他 UC 所有の consumes）ため参照先が存在しない"
    evidence: "完了結果の型は `_api-summary.yaml` の `response_schema`（`NotificationResendResponse`）をそのまま使い"
    suggested_fix: "参照先を consumes[].contract（_cross-cutting/api/openapi.yaml の resendNotification）または所有 UC「取置き通知メールを送信する」の _api-summary.yaml に書き換える"

  - id: "S-003"
    viewpoint: "handoff"
    severity: "major"
    target: "貸出期限管理業務/返却期限をリマインドするフロー/リマインドメールを送信する/tier-frontend-staff.md"
    claim: "S-002 と同じく、endpoints: [] の UC で完了結果型の正本を自 UC の _api-summary.yaml の response_schema と記述しており参照先が存在しない"
    evidence: "完了結果の型は `_api-summary.yaml` の `response_schema`（`NotificationResendResponse`）をそのまま使い"
    suggested_fix: "参照先を consumes[].contract（openapi.yaml の resendNotification）または所有 UC「取置き通知メールを送信する」の _api-summary.yaml に書き換える"

  - id: "S-004"
    viewpoint: "date-format"
    severity: "minor"
    target: "貸出期限管理業務/延滞を督促するフロー/督促メールを送信する/spec.md"
    claim: "超過日数の文言が ui-design.md の統一表記 `{N}日超過` と異なる独自表記になっており、同 UC の tier-worker.md（件名「【図書館】返却期限を過ぎた本があります」／BDD 期待値 超過日数「1日」）とも一致しない"
    evidence: "| 通知タイミング区分 | 期限超過督促 | 「返却期限を N 日過ぎています」の文面を使う |"
    suggested_fix: "spec.md のルール記述を tier-worker.md の件名・本文要点に合わせ、超過日数の差し込みは `{N}日超過` 表記へ統一する（BDD 期待値も同一文字列にする）"

  - id: "S-005"
    viewpoint: "date-format"
    severity: "minor"
    target: "貸出期限管理業務/返却期限をリマインドするフロー/リマインドメールを送信する/spec.md"
    claim: "残日数の文言が `あと{N}日`（空白なし）ではなく「あと N 日」と空白入りで書かれており、ui-design.md の統一表記と一字一句一致しない"
    evidence: "| 通知タイミング区分 | 期限前リマインド | 「返却期限が近づいています（あと N 日）」の文面を使う |"
    suggested_fix: "`あと{N}日` の表記に揃え、tier-worker.md の本文要点（残日数）と同じ文字列で書く"

  - id: "S-006"
    viewpoint: "loading"
    severity: "minor"
    target: "予約管理業務/予約者へ通知するフロー/自分の取置き状況を照会する/tier-frontend-patron.md"
    claim: "同じ HoldPickupCard の取得待ちに対し本 UC は kind=\"line\" を指定しているが、「自分の取置き中の予約を照会する」は kind=\"card\" を指定しており、common-components.md「kind の選び方」（カード群の取得＝card / 例: 取置きカード）に照らして不統一"
    evidence: "`LoadingState`（`kind=\"line\"` / `label=\"取置き状況を読み込み中\"`）"
    suggested_fix: "取置きカードの取得待ちは kind=\"card\"（単一詳細とみなすなら detail）へ揃え、2 UC 間で同じ kind にする"

  - id: "S-007"
    viewpoint: "loading"
    severity: "minor"
    target: "予約管理業務/書籍を予約するフロー/予約を取り消す/tier-frontend-staff.md"
    claim: "対象予約（単一エンティティ）の詳細取得に kind=\"line\" を指定しているが、同型の確認→実行画面である「利用者を削除する」は kind=\"detail\" を使っており、kind の選び方（単一エンティティの詳細取得＝detail）と不整合"
    evidence: "`LoadingState`（`kind=\"line\"` / `label=\"取消対象の予約を読み込み中\"`）"
    suggested_fix: "対象予約の取得待ちを kind=\"detail\" に変更する（同様に「予約を登録する」の書籍取得も detail / line の使い分けを見直す）"

  - id: "S-008"
    viewpoint: "loading"
    severity: "minor"
    target: "予約管理業務/予約者へ通知するフロー/予約順1位の利用者を特定する/tier-frontend-staff.md"
    claim: "画面が予約待ち書籍一覧（listPendingHoldBooks）と候補（getHoldCandidate）の 2 つを取得するのに LoadingState が候補取得用の kind=\"line\" 1 つしか定義されておらず、一覧取得中の loading 表現（kind=\"list\"）が未定義"
    evidence: "| 読み込み中 | ローディング | `LoadingState`（`kind=\"line\"`, `label=\"取置き候補を読み込み中\"`） |"
    suggested_fix: "予約待ち書籍一覧の取得待ちに kind=\"list\" / label=\"予約待ちの書籍を読み込み中\" の LoadingState を追加し、2 系統の待機を区別する"

  - id: "S-009"
    viewpoint: "acceptance-criterion"
    severity: "minor"
    target: "_cross-cutting/traceability-matrix.md"
    claim: "「主担当 UC を持たない UC は `| — | 補助専任 | （当該 UC の E2E シナリオ全件） |` と書く」という記法ルールに対し、補助専任 UC の大半（自分の利用者情報を照会する / 自分の予約順位を照会する / 予約順1位の利用者を特定する / 自分の取置き状況を照会する / 延滞中の貸出を照会する / 期限超過の貸出を延滞にする / 自分の延滞中の貸出を照会する / 自分の返却期限を照会する）は SPEC-ID + 役割「補助」で記述しており、記法ルールに従っているのは「予約を取り消す」だけで不統一"
    evidence: "- 主担当を持たない UC は `| — | 補助専任 | （当該 UC の E2E シナリオ全件） |` と書く。"
    suggested_fix: "記法ルールを「補助として対応表に載る UC は SPEC-ID + 補助を書き、対応表に一切現れない UC のみ補助専任行を書く」へ改訂する（割り当て自体は対応表と一致しているため spec.md 側の修正は不要）"

resolved:
  - id: "S-001"
    resolution: "deferred"
    note: "画面のポータル所属は design ステージの所有物のため spec 側で変更しない。ねじれを UC 仕様へ明記し docs/todo.md（DIST-037）へ登録した"
    by: "orchestrator"
  - id: "S-002"
    resolution: "fixed"
    note: "型の正本を consumes[].contract（openapi.yaml の resendNotification）と所有 UC「取置き通知メールを送信する」へ書き換えた"
    by: "orchestrator"
  - id: "S-003"
    resolution: "fixed"
    note: "S-002 と同じ修正をリマインドメールを送信する へ適用した"
    by: "orchestrator"
  - id: "S-004"
    resolution: "fixed"
    note: "督促メール本文の超過日数を {N}日超過 表記（ui-design.md の規約参照）へ統一した"
    by: "orchestrator"
  - id: "S-005"
    resolution: "fixed"
    note: "リマインドメール本文の残日数を あと{N}日 表記へ統一した"
    by: "orchestrator"
  - id: "S-006"
    resolution: "fixed"
    note: "自分の取置き状況を照会する の LoadingState を kind=card へ揃えた"
    by: "orchestrator"
  - id: "S-007"
    resolution: "fixed"
    note: "予約を取り消す の対象予約取得を kind=detail へ変更した"
    by: "orchestrator"
  - id: "S-008"
    resolution: "fixed"
    note: "予約順1位の利用者を特定する に一覧取得用 LoadingState（kind=list）を追加し、候補取得を kind=detail として 2 系統を分離した"
    by: "orchestrator"
  - id: "S-009"
    resolution: "fixed"
    note: "A グループ S-002 と同一の記法規則改訂で解消した"
    by: "orchestrator"
