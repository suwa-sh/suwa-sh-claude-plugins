openapi: "3.1.0"
info:
  title: "Libra API"
  version: "1.0.0"
  summary: "図書館蔵書管理システム Libra の HTTP API"
  description: |
    Libra（図書館蔵書管理システム）の HTTP API 契約定義。

    - 全 41 UC の `_api-summary.yaml` を集約した Contract First 用の単一定義。
    - 認証は外部マネージド IdP（OAuth2/OIDC）に委譲し、API Gateway が検証した
      アクセストークン（JWT）を Bearer で受け取る。認可は RBAC（司書 / 利用者）+
      本人限定参照（所有者ベース判定）で行う。
    - `/api/v1/me/**` は「ログイン中の利用者本人」だけを対象とする本人限定参照エンドポイント。
    - `/api/v1/staff/**`、および利用者・蔵書の更新系は司書ロール限定。
    - 状態を変える POST は `X-Idempotency-Key` ヘッダによる冪等制御を必須とする。
    - 一覧系は `page` / `per_page` によるページネーションを共通化している。
    - 個人情報（氏名・メールアドレス）は既定でマスク値（`*_masked`）を返し、
      明示的な `reveal=true` 指定時にのみ生値を返す。
  contact:
    name: "Libra 開発チーム"
    url: "https://libra.example.com/support"
  license:
    name: "Proprietary"
    url: "https://libra.example.com/license"
servers:
  - url: "https://api.libra.example.com"
    description: "本番環境（仕様ドキュメント用プレースホルダ）"
  - url: "https://api.stg.libra.example.com"
    description: "ステージング環境（仕様ドキュメント用プレースホルダ）"
security:
  - bearerAuth: []
tags:
  - name: "books"
    description: "蔵書（書籍）の登録・編集・削除・照会・検索"
  - name: "users"
    description: "利用者の登録・編集・削除・照会（司書ロール限定）"
  - name: "me"
    description: "ログイン中の利用者本人に限定した照会（本人限定参照）"
  - name: "loans"
    description: "貸出の可否判定・登録・返却・照会"
  - name: "reservations"
    description: "予約の登録・取消・順位照会"
  - name: "holds"
    description: "取置き（予約順 1 位への取り置き）の候補特定と状況照会"
  - name: "overdues"
    description: "延滞判定と延滞中貸出の照会"
  - name: "duedates"
    description: "返却期限接近の貸出の判定・照会"
  - name: "notifications"
    description: "取置き案内 / 返却期限リマインド / 延滞督促の通知実績と再送"
  - name: "reports"
    description: "在庫状況・貸出統計の集計要求とレポート参照"
paths:
  /api/v1/books:
    get:
      operationId: "listBooks"
      tags: ["books"]
      summary: "蔵書一覧を照会する"
      description: |
        蔵書一覧をページングして照会する（司書ロール限定）。
        書籍状態・ジャンル・キーワードで絞り込める。
      parameters:
        - name: "keyword"
          in: "query"
          required: false
          description: "タイトル・著者・ISBN・出版社に対する部分一致キーワード"
          schema:
            type: "string"
            maxLength: 100
        - name: "genre"
          in: "query"
          required: false
          description: "ジャンルでの絞り込み"
          schema:
            $ref: "#/components/schemas/Genre"
        - name: "book_status"
          in: "query"
          required: false
          description: "書籍状態での絞り込み"
          schema:
            $ref: "#/components/schemas/BookStatus"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "蔵書一覧"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: "createBook"
      tags: ["books"]
      summary: "書籍を登録する"
      description: |
        書籍を受け入れて登録し、書籍状態を「在庫あり」で初期化する（司書ロール限定）。
        資料種別利用可否条件により、初期リリースでは資料種別「紙書籍」のみ登録できる。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookRequest"
      responses:
        "201":
          description: "登録された書籍"
          headers:
            Location:
              description: "作成された書籍リソースの URI"
              schema:
                type: "string"
                format: "uri-reference"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/BusinessRuleViolation"
  /api/v1/books/search:
    get:
      operationId: "searchBooks"
      tags: ["books"]
      summary: "書籍を検索する"
      description: |
        書籍検索条件に基づき、検索条件種別（キーワード / タイトル / 著者 / ISBN / ジャンル）で蔵書を検索し、
        一致した書籍に書籍状態から導出した在庫状況区分を併せて返す。
        利用者の蔵書検索と司書のレファレンス検索で同一エンドポイントを共有し、結果の出し分けは行わない。
      parameters:
        - name: "search_type"
          in: "query"
          required: true
          description: "検索条件種別"
          schema:
            $ref: "#/components/schemas/SearchType"
        - name: "q"
          in: "query"
          required: true
          description: |
            検索語。`search_type` が「ジャンル」のときはジャンルの値、
            「ISBN」のときは ISBN、それ以外は部分一致の検索文字列を指定する。
          schema:
            type: "string"
            minLength: 1
            maxLength: 100
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "検索結果（0 件の場合も 200 で空配列を返す）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/books/{book_id}:
    parameters:
      - $ref: "#/components/parameters/BookIdPath"
    get:
      operationId: "getBook"
      tags: ["books"]
      summary: "書籍を照会する"
      description: "書籍 1 件の書誌情報と書籍状態を取得する（編集画面の現行値取得に使う）。"
      responses:
        "200":
          description: "書籍"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: "updateBook"
      tags: ["books"]
      summary: "書籍情報を編集する"
      description: |
        書籍の書誌情報を訂正する（司書ロール限定）。書籍状態は変更しない。
        `version` による楽観ロックを行い、他者の更新と競合した場合は 409 を返す。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookRequest"
      responses:
        "200":
          description: "更新された書籍"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BusinessRuleViolation"
    delete:
      operationId: "deleteBook"
      tags: ["books"]
      summary: "書籍を削除する"
      description: |
        書籍を蔵書から削除（除籍）する（司書ロール限定）。
        蔵書削除可否条件（書籍状態が「在庫あり」かつ予約状態が「予約中」「取置き中」の予約が存在しない）
        を満たす場合のみ許可し、満たさない場合は 409 で未充足理由を返す。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "204":
          description: "削除完了（本文なし）"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BusinessRuleViolation"
  /api/v1/books/{book_id}/withdrawal-eligibility:
    parameters:
      - $ref: "#/components/parameters/BookIdPath"
    get:
      operationId: "getBookWithdrawalEligibility"
      tags: ["books"]
      summary: "蔵書削除可否を判定する"
      description: "蔵書削除可否条件の判定結果と未充足理由を取得する（司書ロール限定・永続化なし）。"
      responses:
        "200":
          description: "削除可否の判定結果"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalEligibilityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/books/{book_id}/availability:
    parameters:
      - $ref: "#/components/parameters/BookIdPath"
    get:
      operationId: "getBookAvailability"
      tags: ["books"]
      summary: "書籍詳細と在庫状況を照会する"
      description: |
        書籍 1 件の書誌情報と在庫状況区分・予約待ち件数・次の行動の案内を返す。
        予約可否条件により、書籍状態が「貸出中」のときだけ `reservable` が true になる。
      responses:
        "200":
          description: "書籍詳細と在庫状況"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookAvailabilityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/books/{book_id}/restock:
    parameters:
      - $ref: "#/components/parameters/BookIdPath"
    post:
      operationId: "restockBook"
      tags: ["books"]
      summary: "返却後の書籍状態を更新する"
      description: |
        返却後状態決定条件に基づき、返却された書籍の書籍状態を「在庫あり」または「予約待ち」へ更新する
        （司書ロール限定・冪等キー必須）。
        「予約待ち」となった場合は予約順 1 位の予約を取置き対象候補として返す。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestockBookRequest"
      responses:
        "200":
          description: "更新後の書籍状態と取置き候補"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestockResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BusinessRuleViolation"
  /api/v1/users:
    get:
      operationId: "listUsers"
      tags: ["users"]
      summary: "利用者一覧を照会する"
      description: |
        登録済み利用者を氏名・利用者番号・利用者状態とともに一覧取得する（司書ロール限定）。
        連絡先はマスク値のみを返す。
      parameters:
        - name: "keyword"
          in: "query"
          required: false
          description: "氏名・利用者番号に対する部分一致キーワード"
          schema:
            type: "string"
            maxLength: 100
        - name: "user_category"
          in: "query"
          required: false
          description: "利用者区分での絞り込み"
          schema:
            $ref: "#/components/schemas/UserCategory"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "利用者一覧"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: "createUser"
      tags: ["users"]
      summary: "利用者を登録する"
      description: |
        利用申込を受け付けて利用者を登録し、利用者番号を採番する（司書ロール限定・冪等キー必須）。
        同一の `X-Idempotency-Key` による再送には前回と同一の結果を返す。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: "登録された利用者"
          headers:
            Location:
              description: "作成された利用者リソースの URI"
              schema:
                type: "string"
                format: "uri-reference"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/BusinessRuleViolation"
  /api/v1/users/{user_no}:
    parameters:
      - $ref: "#/components/parameters/UserNoPath"
    get:
      operationId: "getUser"
      tags: ["users"]
      summary: "利用者を照会する"
      description: |
        編集対象の利用者の現在値を取得する（司書ロール限定）。
        既定では連絡先をマスクし、`reveal=true` を明示指定したときだけ生の `email` を返す。
      parameters:
        - $ref: "#/components/parameters/RevealQuery"
      responses:
        "200":
          description: "利用者詳細"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: "updateUser"
      tags: ["users"]
      summary: "利用者情報を編集する"
      description: |
        利用者の氏名・連絡先・利用者区分を更新する（司書ロール限定）。利用者状態は変更しない。
        他利用者と重複する `email` への更新は 409（`EMAIL_ALREADY_EXISTS`）を返す。
        `If-Match`（取得時の `updated_at`）による楽観ロックを行い、版が一致しない場合は 409 を返す。
      parameters:
        - $ref: "#/components/parameters/IfMatchHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: "更新された利用者"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BusinessRuleViolation"
    delete:
      operationId: "deleteUser"
      tags: ["users"]
      summary: "利用者を削除する"
      description: |
        退会する利用者を登録から外す（司書ロール限定）。
        利用者削除可否条件（貸出状態が「貸出中」「延滞」の貸出と、予約状態が「予約中」「取置き中」の
        予約がいずれも存在しない）を満たす場合のみ許可する。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "204":
          description: "削除完了（本文なし）"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BusinessRuleViolation"
  /api/v1/me:
    get:
      operationId: "getMyProfile"
      tags: ["me"]
      summary: "自分の利用者情報を照会する"
      description: |
        ログイン中の利用者本人の氏名・連絡先・利用者番号を取得する（本人限定参照）。
        既定では連絡先をマスクし、`reveal=true` を明示指定したときだけ生の `email` を返す。
      parameters:
        - $ref: "#/components/parameters/RevealQuery"
      responses:
        "200":
          description: "本人の利用者情報"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/me/card:
    get:
      operationId: "getMyCard"
      tags: ["me"]
      summary: "自分の利用者カード情報を照会する"
      description: |
        ログイン中の利用者本人の利用者カード情報（利用者番号・氏名・利用者区分・利用者状態）を取得する。
        窓口で利用者番号を提示するために使う。
      responses:
        "200":
          description: "本人の利用者カード情報"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanTargetResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/me/loans:
    get:
      operationId: "listMyLoans"
      tags: ["me", "loans"]
      summary: "自分の貸出を照会する"
      description: |
        ログイン中の利用者本人の貸出を照会する（本人限定参照）。
        個人情報参照可否条件により、他の利用者の貸出は返さない。

        - `status=current`: 貸出中・延滞の貸出を返却期限の昇順で返す
        - `status=history`: 返却済みの貸出を返却日の降順で返す
        - `returnable=true`: 返却対象（貸出中・延滞）を返却期限の昇順で返す
      parameters:
        - name: "status"
          in: "query"
          required: false
          description: "貸出の絞り込み区分。未指定時は `current` と同じ扱いにする"
          schema:
            type: "string"
            enum: ["current", "history"]
            default: "current"
        - name: "returnable"
          in: "query"
          required: false
          description: "true のとき返却対象（貸出状態が「貸出中」「延滞」）のみに絞り込む"
          schema:
            type: "boolean"
            default: false
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "本人の貸出一覧"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyLoanListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/me/loans/due:
    get:
      operationId: "listMyDueLoans"
      tags: ["me", "duedates"]
      summary: "自分の返却期限を照会する"
      description: |
        ログイン中の利用者本人の返却期限接近の貸出一覧を取得する（本人限定参照）。
        リマインド通知対象条件（貸出状態が「貸出中」かつ残日数が通知タイミング区分のリマインド基準日数以内）
        と同じ判定基準で抽出する。
      parameters:
        - $ref: "#/components/parameters/BaseDateQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "本人の返却期限接近の貸出一覧"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyDueLoanListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/me/loans/overdue:
    get:
      operationId: "listMyOverdueLoans"
      tags: ["me", "overdues"]
      summary: "自分の延滞中の貸出を照会する"
      description: |
        ログイン中の利用者本人の延滞中の貸出一覧を取得する（本人限定参照）。
        貸出状態が「延滞」の貸出を延滞日数の降順で返す。
      parameters:
        - $ref: "#/components/parameters/BaseDateQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "本人の延滞中の貸出一覧"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyOverdueLoanListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/me/loans/{loan_id}:
    parameters:
      - $ref: "#/components/parameters/LoanIdPath"
    get:
      operationId: "getMyLoan"
      tags: ["me", "loans"]
      summary: "自分の貸出内容と返却期限を照会する"
      description: |
        ログイン中の利用者本人の貸出 1 件の内容と返却期限・残日数を取得する（本人限定参照）。
        他の利用者の貸出 ID を指定した場合は 403 を返す。
      responses:
        "200":
          description: "本人の貸出 1 件"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/me/reservations:
    get:
      operationId: "listMyReservations"
      tags: ["me", "reservations"]
      summary: "自分の予約状況を照会する"
      description: |
        ログイン中の利用者本人の予約一覧を予約状態で絞り込み、ページネーションつきで返す（本人限定参照）。
        既定では予約申込日時の降順で返す。
      parameters:
        - name: "reservation_status"
          in: "query"
          required: false
          description: "予約状態での絞り込み。未指定時は全件を対象とする"
          schema:
            $ref: "#/components/schemas/ReservationStatus"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "本人の予約一覧"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyReservationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/me/reservations/holds:
    get:
      operationId: "listMyHolds"
      tags: ["me", "holds"]
      summary: "自分の取置き中の予約を照会する"
      description: |
        ログイン中の利用者本人の取置き中（予約状態が「取置き中」）の予約を取置き期限の昇順で一覧取得する
        （本人限定参照）。取置き期限が当日の件数を併せて返す。
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "本人の取置き中の予約一覧"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyHoldListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/me/reservations/{reservation_id}/rank:
    parameters:
      - $ref: "#/components/parameters/ReservationIdPath"
    get:
      operationId: "getMyReservationRank"
      tags: ["me", "reservations"]
      summary: "自分の予約順位を照会する"
      description: |
        ログイン中の利用者本人の予約 1 件について、予約順位・待ち人数・予約状態を返す（本人限定参照）。
        予約順位決定条件により、予約状態が「貸出済み」「キャンセル」の予約は順位の対象外となり
        `priority` は返さない。
      responses:
        "200":
          description: "本人の予約順位"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationRankResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/me/reservations/{reservation_id}/hold:
    parameters:
      - $ref: "#/components/parameters/ReservationIdPath"
    get:
      operationId: "getMyHoldStatus"
      tags: ["me", "holds"]
      summary: "自分の取置き状況を照会する"
      description: |
        ログイン中の利用者本人の予約 1 件の取置き状況（予約状態・取置き開始日時・取置き期限・残日数・
        窓口提示用の利用者番号）を返す（本人限定参照）。
      responses:
        "200":
          description: "本人の取置き状況"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/loans:
    get:
      operationId: "listLoans"
      tags: ["loans"]
      summary: "貸出を検索する"
      description: |
        司書が書籍 ID または利用者番号から貸出を検索する（司書ロール限定）。
        返却受付では `returnable=true` で返却対象（貸出状態が「貸出中」「延滞」）に絞り込む。
      parameters:
        - name: "book_id"
          in: "query"
          required: false
          description: "書籍 ID による絞り込み"
          schema:
            $ref: "#/components/schemas/BookId"
        - name: "user_no"
          in: "query"
          required: false
          description: "利用者番号による絞り込み"
          schema:
            $ref: "#/components/schemas/UserNo"
        - name: "loan_status"
          in: "query"
          required: false
          description: "貸出状態による絞り込み"
          schema:
            $ref: "#/components/schemas/LoanStatus"
        - name: "returnable"
          in: "query"
          required: false
          description: "true のとき返却対象（貸出状態が「貸出中」「延滞」）のみに絞り込む"
          schema:
            type: "boolean"
            default: false
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "貸出一覧（司書向け）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLoanListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: "createLoan"
      tags: ["loans"]
      summary: "貸出を登録する"
      description: |
        貸出記録を作成する（司書ロール限定・冪等キー必須）。

        - 返却期限設定条件により、貸出日を起点に貸出期間区分の日数を加算して返却期限を自動設定する
        - 書籍状態を「貸出中」へ、必要に応じて利用者状態・予約状態（取置き中 → 貸出済み）を遷移させる
        - 貸出可否条件・取置き中書籍貸出条件を満たさない場合は 409 を返す
        - `loan_period_type` は利用者区分ごとの選択可能集合（一般=標準/短期、学生・団体=長期/標準/短期）に含まれる値だけを受け付ける。集合外の指定は 409 `LOAN_PERIOD_TYPE_MISMATCH` を返す
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoanRequest"
      responses:
        "201":
          description: "登録された貸出"
          headers:
            Location:
              description: "作成された貸出リソースの URI"
              schema:
                type: "string"
                format: "uri-reference"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BusinessRuleViolation"
  /api/v1/loans/eligibility-checks:
    post:
      operationId: "checkLoanEligibility"
      tags: ["loans"]
      summary: "書籍の貸出可否を判定する"
      description: |
        書籍と利用者の組み合わせについて貸出可否を判定し、可否と根拠条件を返す
        （司書ロール限定・永続化なし）。
        貸出可否条件と取置き中書籍貸出条件を評価し、未充足の条件を `reasons` に列挙する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanEligibilityRequest"
      responses:
        "200":
          description: "貸出可否の判定結果"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanEligibilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/loans/{loan_id}/return:
    parameters:
      - $ref: "#/components/parameters/LoanIdPath"
    post:
      operationId: "registerLoanReturn"
      tags: ["loans"]
      summary: "返却を登録する"
      description: |
        返却を登録し、貸出状態を「返却済み」へ遷移させて返却日を記録する
        （司書ロール限定・冪等キー必須）。
        督促通知対象条件により督促を停止し、当該利用者に進行中の取引が無くなれば利用者状態を戻す。
        書籍状態の更新は後続の `POST /api/v1/books/{book_id}/restock` で行う。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterReturnRequest"
      responses:
        "200":
          description: "返却登録の結果"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BusinessRuleViolation"
  /api/v1/loan-targets/{user_no}:
    parameters:
      - $ref: "#/components/parameters/UserNoPath"
    get:
      operationId: "getLoanTarget"
      tags: ["loans"]
      summary: "利用者番号で貸出対象利用者を特定する"
      description: |
        窓口で提示された利用者番号から貸出対象利用者を特定する（司書ロール限定）。
        利用者登録ポリシーと利用者状態から貸出可否（`loanable`）と理由を併せて返す。
      responses:
        "200":
          description: "貸出対象利用者"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanTargetResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/reservations:
    post:
      operationId: "createReservation"
      tags: ["reservations"]
      summary: "予約を登録する"
      description: |
        貸出中の書籍に対する予約を登録し、予約状態を「予約中」として予約順位を付与する。
        予約可否条件（書籍状態が「貸出中」）と重複予約禁止条件を満たさない場合は 409 を返す。
        予約順位は予約順位決定条件に従い申込日時の昇順で採番する。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: "登録された予約"
          headers:
            Location:
              description: "作成された予約リソースの URI"
              schema:
                type: "string"
                format: "uri-reference"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BusinessRuleViolation"
  /api/v1/staff/reservations/{reservation_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ReservationIdPath"
    post:
      operationId: "cancelReservation"
      tags: ["reservations"]
      summary: "予約を取り消す"
      description: |
        司書が予約を取り消して予約状態を「キャンセル」へ遷移させ、
        予約順位決定条件に従い後続予約の予約順位を繰り上げる（司書ロール限定・冪等キー必須）。
        取り消しの結果、有効な予約が無くなった場合は書籍状態を併せて返す。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelReservationRequest"
      responses:
        "200":
          description: "取消の結果"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelReservationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BusinessRuleViolation"
  /api/v1/staff/overdues:
    get:
      operationId: "listOverdueLoans"
      tags: ["overdues"]
      summary: "延滞中の貸出を照会する"
      description: |
        延滞中（貸出状態が「延滞」）の貸出一覧と督促の実施状況を取得する（司書ロール限定）。
        督促未送信件数・送信失敗件数をサマリとして返す。
      parameters:
        - $ref: "#/components/parameters/BaseDateQuery"
        - name: "last_dun_status"
          in: "query"
          required: false
          description: "直近の督促通知の通知状態による絞り込み"
          schema:
            $ref: "#/components/schemas/NotificationStatus"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "延滞中の貸出一覧"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverdueLoanListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/staff/overdues/judgement:
    get:
      operationId: "getOverdueJudgement"
      tags: ["overdues"]
      summary: "期限超過の貸出を延滞にする"
      description: |
        督促通知対象条件に基づき、返却期限を経過した貸出を「貸出中」から「延滞」へ遷移させた結果の
        サマリと対象一覧を取得する（司書ロール限定）。
        `transitioned_count` は今回の判定で状態遷移した件数を表す。
      parameters:
        - $ref: "#/components/parameters/BaseDateQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "延滞判定の結果"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverdueJudgementResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/staff/duedates/upcoming:
    get:
      operationId: "listUpcomingDueLoans"
      tags: ["duedates"]
      summary: "返却期限接近の貸出を判定する"
      description: |
        リマインド通知対象条件に基づき、返却期限接近の貸出一覧を取得する（司書ロール限定）。
        残日数の昇順で返し、判定時点（`evaluated_at`）と基準日・リマインド基準日数を併せて返す。
      parameters:
        - $ref: "#/components/parameters/BaseDateQuery"
        - name: "timing_type"
          in: "query"
          required: false
          description: "通知タイミング区分。リマインド基準日数の決定に使う"
          schema:
            $ref: "#/components/schemas/NotificationTimingType"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "返却期限接近の貸出一覧"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUpcomingDueListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/staff/notifications:
    get:
      operationId: "listNotifications"
      tags: ["notifications"]
      summary: "通知の送信実績を照会する"
      description: |
        通知の送信実績一覧とサマリを取得する（司書ロール限定）。
        通知種別（取置き案内 / 返却期限リマインド / 延滞督促）・通知状態で絞り込める。
        宛先メールアドレスは常にマスク値で返す。
      parameters:
        - name: "notification_type"
          in: "query"
          required: false
          description: "通知種別による絞り込み"
          schema:
            $ref: "#/components/schemas/NotificationType"
        - name: "notification_status"
          in: "query"
          required: false
          description: "通知状態による絞り込み"
          schema:
            $ref: "#/components/schemas/NotificationStatus"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "通知の送信実績一覧"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationLogListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/staff/notifications/hold-notices:
    post:
      operationId: "sendHoldNotice"
      tags: ["notifications", "holds"]
      summary: "取置き通知メールを送信する"
      description: |
        取置き通知対象条件を満たす予約に対して取置き案内の通知を「送信待ち」で作成し、
        送信要求を非同期チャネル `notification.hold-notice.requested` へ発行する
        （司書ロール限定・冪等キー必須）。
        メール送信自体はワーカーが非同期に実施するため 202 を返す。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendHoldNoticeRequest"
      responses:
        "202":
          description: "送信要求を受け付けた"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldNoticeAcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BusinessRuleViolation"
  /api/v1/staff/notifications/{notification_id}/resend:
    parameters:
      - $ref: "#/components/parameters/NotificationIdPath"
    post:
      operationId: "resendNotification"
      tags: ["notifications"]
      summary: "通知を再送する"
      description: |
        通知状態が「送信失敗」の通知を再送受付する（司書ロール限定・冪等キー必須）。
        通知種別（`NotificationLogItem.notification_type`）に応じて再 publish 先チャネル
        （取置き案内 / 返却期限リマインド / 延滞督促）をサーバ側で決定する。
        ワーカーは既存の通知レコードを再利用し、新規の通知は作成しない。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendNotificationRequest"
      responses:
        "202":
          description: "再送要求を受け付けた"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResendResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BusinessRuleViolation"
  /api/v1/staff/books/{book_id}/hold-candidate:
    parameters:
      - $ref: "#/components/parameters/BookIdPath"
    get:
      operationId: "getHoldCandidate"
      tags: ["holds"]
      summary: "予約順 1 位の利用者を特定する"
      description: |
        取置き通知対象条件を評価し、予約順 1 位かつ予約状態が「予約中」の予約 1 件と申込者を
        取置き候補として返す（司書ロール限定）。
        宛先メールアドレスは既定でマスクし、`reveal_contact=true` の明示操作時にだけ生値を返す。
      parameters:
        - name: "reveal_contact"
          in: "query"
          required: false
          description: "true のとき取置き候補の生のメールアドレスを返す（明示操作時のみ）"
          schema:
            type: "boolean"
            default: false
      responses:
        "200":
          description: "取置き候補の判定結果"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldCandidateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/staff/holds/pending-books:
    get:
      operationId: "listPendingHoldBooks"
      tags: ["holds"]
      summary: "取置き候補照会の対象書籍を列挙する"
      description: |
        書籍状態が「予約待ち」の書籍を列挙し、取置き候補照会の対象 `book_id` を司書へ提示する
        （司書ロール限定）。
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "予約待ちの書籍一覧"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingHoldBookListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/reports/inventory:
    post:
      operationId: "createInventoryReport"
      tags: ["reports"]
      summary: "在庫状況を区分別に集計する"
      description: |
        在庫状況集計条件に基づく集計を要求し、統計レポートを「集計中」で作成する
        （司書ロール限定・冪等キー必須）。
        集計自体は集計要求イベント `report.aggregation.requested` を介してワーカーが非同期に実施する。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryReportRequest"
      responses:
        "202":
          description: "集計要求を受け付けた"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportAcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/reports/inventory/latest:
    get:
      operationId: "getLatestInventoryReport"
      tags: ["reports"]
      summary: "最新の在庫状況レポートを参照する"
      description: |
        最新の在庫状況レポート（区分別件数・ジャンル別件数・書籍一覧）を参照する（司書ロール限定）。
        統計レポート状態が「実績なし」のレポートは集計明細を空で返す。
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "在庫状況レポート"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/reports/inventory/{report_id}:
    parameters:
      - $ref: "#/components/parameters/ReportIdPath"
    get:
      operationId: "getInventoryReport"
      tags: ["reports"]
      summary: "指定した在庫状況レポートを参照する"
      description: "レポート ID を指定して在庫状況レポートを参照する（司書ロール限定）。"
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "在庫状況レポート"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/reports/loans:
    post:
      operationId: "createLoanStatsReport"
      tags: ["reports"]
      summary: "期間別貸出統計を集計する"
      description: |
        貸出統計集計条件に基づき、期間別貸出統計・人気書籍ランキングの集計を要求し、
        統計レポートを「集計中」で作成する（司書ロール限定・冪等キー必須）。
        対象期間に貸出実績が存在しない場合、ワーカーは統計レポート状態を「実績なし」で確定する。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoanStatsReportRequest"
      responses:
        "202":
          description: "集計要求を受け付けた"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportAcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/reports/loans/latest:
    get:
      operationId: "getLatestLoanStatsReport"
      tags: ["reports"]
      summary: "最新の貸出統計レポートを参照する"
      description: |
        最新の貸出統計レポート（貸出件数推移・人気書籍ランキング・区分別内訳）を参照する
        （司書ロール限定）。
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "貸出統計レポート"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanStatsReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/reports/loans/{report_id}:
    parameters:
      - $ref: "#/components/parameters/ReportIdPath"
    get:
      operationId: "getLoanStatsReport"
      tags: ["reports"]
      summary: "指定した貸出統計レポートを参照する"
      description: "レポート ID を指定して貸出統計レポートを参照する（司書ロール限定）。"
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: "貸出統計レポート"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanStatsReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: |
        外部マネージド IdP（OAuth2/OIDC）が発行したアクセストークン。
        API Gateway でトークンを検証し、`sub`（user_id）・役割（司書 / 利用者）・利用者番号を
        クレームとしてバックエンド API へ伝播する。
  parameters:
    PageQuery:
      name: "page"
      in: "query"
      required: false
      description: "ページ番号（1 始まり）"
      schema:
        type: "integer"
        minimum: 1
        default: 1
    PerPageQuery:
      name: "per_page"
      in: "query"
      required: false
      description: "1 ページあたりの件数"
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 20
    RevealQuery:
      name: "reveal"
      in: "query"
      required: false
      description: |
        true のときだけ生の連絡先（`email`）を返す明示操作フラグ。
        既定は false で、マスク値（`email_masked`）のみを返す。
      schema:
        type: "boolean"
        default: false
    BaseDateQuery:
      name: "base_date"
      in: "query"
      required: false
      description: "判定の基準日。未指定時はサーバの当日日付を使う"
      schema:
        type: "string"
        format: "date"
    IfMatchHeader:
      name: "If-Match"
      in: "header"
      required: true
      description: |
        楽観ロックの版。直前の取得応答が返した `updated_at` を版として指定する。
        サーバ側の現在値と一致しないときは 409（競合）を返す。
      schema:
        type: "string"
    IdempotencyKeyHeader:
      name: "X-Idempotency-Key"
      in: "header"
      required: true
      description: |
        冪等キー。同一キーによる再送には前回と同一の結果を返す。
        クライアントが UUID v4 で生成する。
      schema:
        type: "string"
        format: "uuid"
    BookIdPath:
      name: "book_id"
      in: "path"
      required: true
      description: "書籍 ID"
      schema:
        $ref: "#/components/schemas/BookId"
    UserNoPath:
      name: "user_no"
      in: "path"
      required: true
      description: "利用者番号"
      schema:
        $ref: "#/components/schemas/UserNo"
    LoanIdPath:
      name: "loan_id"
      in: "path"
      required: true
      description: "貸出 ID"
      schema:
        $ref: "#/components/schemas/LoanId"
    ReservationIdPath:
      name: "reservation_id"
      in: "path"
      required: true
      description: "予約 ID"
      schema:
        $ref: "#/components/schemas/ReservationId"
    NotificationIdPath:
      name: "notification_id"
      in: "path"
      required: true
      description: "通知 ID"
      schema:
        $ref: "#/components/schemas/NotificationId"
    ReportIdPath:
      name: "report_id"
      in: "path"
      required: true
      description: "レポート ID"
      schema:
        $ref: "#/components/schemas/ReportId"
  responses:
    BadRequest:
      description: "バリデーションエラー（入力値が不正）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "認証エラー（トークンが無効または未提示）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "認可エラー（ロール不足、または本人限定参照に違反）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "リソース未存在"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BusinessRuleViolation:
      description: "業務ルール違反（条件の未充足、状態の競合、楽観ロック競合）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BusinessRuleViolationResponse"
  schemas:
    ErrorResponse:
      type: "object"
      description: "エラー応答の共通形式"
      required: ["code", "message"]
      properties:
        code:
          type: "string"
          description: "エラーコード"
          examples: ["VALIDATION_ERROR"]
        message:
          type: "string"
          description: "利用者向けのエラーメッセージ"
        details:
          type: "array"
          description: "項目単位のエラー内訳"
          items:
            type: "object"
            required: ["field", "message"]
            properties:
              field:
                type: "string"
                description: "エラー対象の項目名"
              message:
                type: "string"
                description: "項目単位のエラーメッセージ"
        trace_id:
          type: "string"
          description: "リクエスト追跡 ID（問い合わせ時の識別子）"
    BusinessRuleViolationResponse:
      type: "object"
      description: "業務ルール違反の応答。未充足の条件を `reasons` に列挙する"
      required: ["code", "message", "reasons"]
      properties:
        code:
          type: "string"
          description: "違反した条件を示すエラーコード"
          examples: ["BOOK_NOT_DELETABLE"]
        message:
          type: "string"
          description: "利用者向けのエラーメッセージ"
        reasons:
          type: "array"
          description: "未充足の理由（条件名とその説明）"
          items:
            type: "string"
        trace_id:
          type: "string"
          description: "リクエスト追跡 ID"
    BookId:
      type: "string"
      description: "書籍を一意に識別する ID"
      minLength: 1
      maxLength: 36
      examples: ["BK-00000123"]
    UserNo:
      type: "string"
      description: "利用者を一意に識別する利用者番号"
      minLength: 1
      maxLength: 20
      examples: ["U-000123"]
    LoanId:
      type: "string"
      description: "貸出を一意に識別する ID"
      minLength: 1
      maxLength: 36
      examples: ["LN-00000456"]
    ReservationId:
      type: "string"
      description: "予約を一意に識別する ID"
      minLength: 1
      maxLength: 36
      examples: ["RS-00000789"]
    NotificationId:
      type: "string"
      description: "通知を一意に識別する ID"
      minLength: 1
      maxLength: 36
      examples: ["NT-00001234"]
    ReportId:
      type: "string"
      description: "統計レポートを一意に識別する ID"
      minLength: 1
      maxLength: 36
      examples: ["RP-00000012"]
    MaterialType:
      type: "string"
      description: |
        資料種別（バリエーション: 資料種別）。
        資料種別利用可否条件により、初期リリースでは「紙書籍」のみ登録・貸出の対象とする。
      enum: ["紙書籍", "電子書籍"]
    Genre:
      type: "string"
      description: "ジャンル（バリエーション: ジャンル）"
      enum: ["文学", "人文", "社会科学", "自然科学", "技術", "芸術", "児童", "その他"]
    SearchType:
      type: "string"
      description: "検索条件種別（バリエーション: 検索条件種別）"
      enum: ["キーワード", "タイトル", "著者", "ISBN", "ジャンル"]
    UserCategory:
      type: "string"
      description: "利用者区分（バリエーション: 利用者区分）"
      enum: ["一般", "学生", "団体"]
    LoanPeriodType:
      type: "string"
      description: |
        貸出期間区分（バリエーション: 貸出期間区分）。
        返却期限設定条件で、貸出日にこの区分の日数を加算して返却期限を決める。
      enum: ["標準", "短期", "長期"]
    NotificationType:
      type: "string"
      description: "通知種別（バリエーション: 通知種別）"
      enum: ["取置き案内", "返却期限リマインド", "延滞督促"]
    NotificationTimingType:
      type: "string"
      description: "通知タイミング区分（バリエーション: 通知タイミング区分）"
      enum: ["期限前リマインド", "期限当日", "期限超過督促"]
    ReportType:
      type: "string"
      description: "レポート種別（バリエーション: レポート種別）"
      enum: ["在庫状況", "人気書籍ランキング", "期間別貸出統計"]
    PeriodType:
      type: "string"
      description: "集計期間区分（バリエーション: 集計期間区分）"
      enum: ["日次", "月次", "年次"]
    BookStatus:
      type: "string"
      description: "書籍状態（状態モデル: 書籍状態）"
      enum: ["在庫あり", "貸出中", "予約待ち"]
    AvailabilityStatus:
      type: "string"
      description: "在庫状況区分。書籍検索条件により書籍状態から導出する"
      enum: ["在庫あり", "貸出中", "予約待ち"]
    LoanStatus:
      type: "string"
      description: "貸出状態（状態モデル: 貸出状態）"
      enum: ["貸出中", "返却済み", "延滞"]
    ReservationStatus:
      type: "string"
      description: "予約状態（状態モデル: 予約状態）"
      enum: ["予約中", "取置き中", "貸出済み", "キャンセル"]
    NotificationStatus:
      type: "string"
      description: "通知状態（状態モデル: 通知状態）"
      enum: ["送信待ち", "送信済み", "送信失敗"]
    ReportStatus:
      type: "string"
      description: "統計レポート状態（状態モデル: 統計レポート状態）"
      enum: ["集計中", "作成済み", "実績なし"]
    UserStatus:
      type: "string"
      description: |
        利用者状態（状態モデル: 利用者状態）。
        利用者登録で「登録済み」となり、貸出・予約の発生で「取引進行中」へ遷移する。
        返却・予約取消により進行中取引が無くなった利用者は「登録済み」へ戻り、
        「登録済み」の利用者のみ削除できる。
      enum: ["登録済み", "取引進行中"]
    Pagination:
      type: "object"
      description: "ページネーション情報"
      required: ["page", "per_page", "total", "total_pages"]
      properties:
        page:
          type: "integer"
          description: "現在のページ番号（1 始まり）"
          minimum: 1
        per_page:
          type: "integer"
          description: "1 ページあたりの件数"
          minimum: 1
        total:
          type: "integer"
          description: "総件数"
          minimum: 0
        total_pages:
          type: "integer"
          description: "総ページ数"
          minimum: 0
    BookBrief:
      type: "object"
      description: "書籍の最小情報（一覧の書誌表示用）"
      required: ["book_id", "title", "author"]
      properties:
        book_id:
          $ref: "#/components/schemas/BookId"
        title:
          type: "string"
          description: "タイトル"
        author:
          type: "string"
          description: "著者"
    BookSummary:
      type: "object"
      description: "書籍の要約情報（一覧・関連表示用）"
      required:
        ["book_id", "title", "author", "publisher", "genre", "material_type", "book_status"]
      properties:
        book_id:
          $ref: "#/components/schemas/BookId"
        title:
          type: "string"
          description: "タイトル"
          maxLength: 200
        author:
          type: "string"
          description: "著者"
          maxLength: 100
        isbn:
          type: ["string", "null"]
          description: "ISBN（13 桁または 10 桁。未設定の場合は null）"
        publisher:
          type: "string"
          description: "出版社"
          maxLength: 100
        genre:
          $ref: "#/components/schemas/Genre"
        material_type:
          $ref: "#/components/schemas/MaterialType"
        book_status:
          $ref: "#/components/schemas/BookStatus"
        registered_at:
          type: "string"
          format: "date-time"
          description: "登録日時"
        updated_at:
          type: "string"
          format: "date-time"
          description: "更新日時"
    BookResponse:
      type: "object"
      description: "書籍の詳細情報（楽観ロック用の version を含む）"
      required:
        - "book_id"
        - "title"
        - "author"
        - "publisher"
        - "genre"
        - "material_type"
        - "book_status"
        - "registered_at"
        - "updated_at"
        - "version"
      properties:
        book_id:
          $ref: "#/components/schemas/BookId"
        title:
          type: "string"
          description: "タイトル"
          maxLength: 200
        author:
          type: "string"
          description: "著者"
          maxLength: 100
        isbn:
          type: ["string", "null"]
          description: "ISBN（13 桁または 10 桁。未設定の場合は null）"
        publisher:
          type: "string"
          description: "出版社"
          maxLength: 100
        genre:
          $ref: "#/components/schemas/Genre"
        material_type:
          $ref: "#/components/schemas/MaterialType"
        book_status:
          $ref: "#/components/schemas/BookStatus"
        registered_at:
          type: "string"
          format: "date-time"
          description: "登録日時"
        updated_at:
          type: "string"
          format: "date-time"
          description: "更新日時"
        version:
          type: "integer"
          description: "楽観ロック用のバージョン番号"
          minimum: 1
    CreateBookRequest:
      type: "object"
      description: "書籍の受入登録リクエスト"
      required: ["title", "author", "publisher", "genre", "material_type"]
      properties:
        title:
          type: "string"
          description: "タイトル"
          minLength: 1
          maxLength: 200
        author:
          type: "string"
          description: "著者"
          minLength: 1
          maxLength: 100
        isbn:
          type: "string"
          description: "ISBN（13 桁または 10 桁のハイフンなし数字。ISBN-10 の末尾は X を許容）"
          pattern: "^(\\d{13}|\\d{9}[\\dXx])$"
        publisher:
          type: "string"
