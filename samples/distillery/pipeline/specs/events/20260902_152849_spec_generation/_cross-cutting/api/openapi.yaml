      required: ["book_id", "book_title", "book_status", "waiting_count"]
      properties:
        book_id:
          $ref: "#/components/schemas/BookId"
        book_title:
          type: "string"
          description: "タイトル"
        book_status:
          $ref: "#/components/schemas/BookStatus"
        waiting_count:
          type: "integer"
          description: "予約状態が「予約中」の待ち件数"
          minimum: 0
    PendingHoldBookListResponse:
      type: "object"
      description: "予約待ちの書籍一覧"
      required: ["items", "total", "page", "per_page"]
      properties:
        items:
          type: "array"
          description: "予約待ちの書籍一覧"
          items:
            $ref: "#/components/schemas/PendingHoldBook"
        total:
          type: "integer"
          description: "総件数"
          minimum: 0
        page:
          type: "integer"
          description: "現在のページ番号"
          minimum: 1
        per_page:
          type: "integer"
          description: "1 ページあたりの件数"
          minimum: 1
    NotificationSummary:
      type: "object"
      description: "通知状態別の件数サマリ"
      required: ["pending", "sent", "failed"]
      properties:
        pending:
          type: "integer"
          description: "通知状態が「送信待ち」の件数"
          minimum: 0
        sent:
          type: "integer"
          description: "通知状態が「送信済み」の件数"
          minimum: 0
        failed:
          type: "integer"
          description: "通知状態が「送信失敗」の件数"
          minimum: 0
    NotificationLogItem:
      type: "object"
      description: "通知の送信実績 1 件（宛先メールアドレスは常にマスク値）"
      required:
        - "notification_id"
        - "notification_type"
        - "recipient_user_no"
        - "recipient_email_masked"
        - "user_name"
        - "notification_status"
        - "requested_at"
        - "resendable"
      properties:
        notification_id:
          $ref: "#/components/schemas/NotificationId"
        notification_type:
          $ref: "#/components/schemas/NotificationType"
        timing_type:
          $ref: "#/components/schemas/NotificationTimingType"
        recipient_user_no:
          $ref: "#/components/schemas/UserNo"
        recipient_email_masked:
          type: "string"
          description: "マスク済みの宛先メールアドレス"
        user_name:
          type: "string"
          description: "宛先利用者の氏名"
        target_loan_id:
          oneOf:
            - $ref: "#/components/schemas/LoanId"
            - type: "null"
          description: "対象貸出 ID（返却期限リマインド / 延滞督促のとき）"
        target_reservation_id:
          oneOf:
            - $ref: "#/components/schemas/ReservationId"
            - type: "null"
          description: "対象予約 ID（取置き案内のとき）"
        book_title:
          type: "string"
          description: "対象書籍のタイトル"
        due_date:
          type: "string"
          format: "date"
          description: "対象貸出の返却期限"
        notification_status:
          $ref: "#/components/schemas/NotificationStatus"
        send_result:
          type: "string"
          description: "外部メール配信サービスからの送信結果（失敗理由を含む）"
        requested_at:
          type: "string"
          format: "date-time"
          description: "送信要求日時"
        sent_at:
          type: "string"
          format: "date-time"
          description: "送信日時（通知状態が「送信済み」のとき）"
        resendable:
          type: "boolean"
          description: "再送できるか（通知状態が「送信失敗」のときに true）"
    NotificationLogListResponse:
      type: "object"
      description: "通知の送信実績一覧"
      required: ["summary", "total", "page", "per_page", "items", "failure_count"]
      properties:
        summary:
          $ref: "#/components/schemas/NotificationSummary"
        total:
          type: "integer"
          description: "総件数"
          minimum: 0
        page:
          type: "integer"
          description: "現在のページ番号"
          minimum: 1
        per_page:
          type: "integer"
          description: "1 ページあたりの件数"
          minimum: 1
        failure_count:
          type: "integer"
          description: "絞り込み条件に一致する未達（送信失敗）の件数"
          minimum: 0
        items:
          type: "array"
          description: "通知の送信実績一覧"
          items:
            $ref: "#/components/schemas/NotificationLogItem"
    ResendNotificationRequest:
      type: "object"
      description: |
        通知の再送リクエスト（本文は任意。冪等キーはヘッダで渡す）。
        対象通知はパスパラメータ `{notification_id}` で一意に特定するため、本文には含めない。
      properties:
        reason:
          type: "string"
          maxLength: 200
          description: "再送理由（任意。運用記録用）"
    NotificationResendResponse:
      type: "object"
      description: "通知の再送受付結果"
      required: ["notification_id", "notification_status", "accepted_at"]
      properties:
        notification_id:
          $ref: "#/components/schemas/NotificationId"
        notification_status:
          $ref: "#/components/schemas/NotificationStatus"
        accepted_at:
          type: "string"
          format: "date-time"
          description: "再送要求を受け付けた日時"
    SendHoldNoticeRequest:
      type: "object"
      description: "取置き案内の送信リクエスト"
      required: ["reservation_id"]
      properties:
        reservation_id:
          $ref: "#/components/schemas/ReservationId"
    HoldNoticeAcceptedResponse:
      type: "object"
      description: "取置き案内の送信要求の受付結果"
      required:
        - "notification_id"
        - "notification_type"
        - "notification_status"
        - "target_reservation_id"
        - "recipient_user_no"
        - "requested_at"
      properties:
        notification_id:
          $ref: "#/components/schemas/NotificationId"
        notification_type:
          $ref: "#/components/schemas/NotificationType"
        notification_status:
          $ref: "#/components/schemas/NotificationStatus"
        target_reservation_id:
          $ref: "#/components/schemas/ReservationId"
        recipient_user_no:
          $ref: "#/components/schemas/UserNo"
        requested_at:
          type: "string"
          format: "date-time"
          description: "送信要求日時"
    CreateInventoryReportRequest:
      type: "object"
      description: "在庫状況レポートの集計要求"
      required: ["report_type", "period_type", "period_start", "period_end"]
      properties:
        report_type:
          $ref: "#/components/schemas/ReportType"
        period_type:
          $ref: "#/components/schemas/PeriodType"
        period_start:
          type: "string"
          format: "date"
          description: "集計開始日"
        period_end:
          type: "string"
          format: "date"
          description: "集計終了日（集計開始日以降であること）"
    CreateLoanStatsReportRequest:
      type: "object"
      description: "期間別貸出統計レポートの集計要求"
      required: ["report_type", "period_type", "period_start", "period_end"]
      properties:
        report_type:
          $ref: "#/components/schemas/ReportType"
        period_type:
          $ref: "#/components/schemas/PeriodType"
        period_start:
          type: "string"
          format: "date"
          description: "集計開始日"
        period_end:
          type: "string"
          format: "date"
          description: "集計終了日（集計開始日以降であること）"
    ReportAcceptedResponse:
      type: "object"
      description: "集計要求の受付結果（統計レポートを「集計中」で作成する）"
      required:
        - "report_id"
        - "report_type"
        - "period_type"
        - "period_start"
        - "period_end"
        - "report_status"
        - "aggregated_at"
      properties:
        report_id:
          $ref: "#/components/schemas/ReportId"
        report_type:
          $ref: "#/components/schemas/ReportType"
        period_type:
          $ref: "#/components/schemas/PeriodType"
        period_start:
          type: "string"
          format: "date"
          description: "集計開始日"
        period_end:
          type: "string"
          format: "date"
          description: "集計終了日"
        report_status:
          $ref: "#/components/schemas/ReportStatus"
        aggregated_at:
          type: "string"
          format: "date-time"
          description: "集計日時（受付時点では集計要求日時）"
    InventoryReportSummary:
      type: "object"
      description: "在庫状況レポートのサマリ"
      required: ["total_books"]
      properties:
        total_books:
          type: "integer"
          description: "蔵書の総件数"
          minimum: 0
        utilization_rate:
          type: "number"
          description: "稼働率（貸出中の書籍の割合。0.0〜1.0）"
          minimum: 0
          maximum: 1
        total_books_delta:
          type: "integer"
          description: "前回集計からの蔵書件数の増減"
    InventoryStatusCount:
      type: "object"
      description: "書籍状態別の件数"
      required: ["book_status", "count"]
      properties:
        book_status:
          $ref: "#/components/schemas/BookStatus"
        count:
          type: "integer"
          description: "件数"
          minimum: 0
        delta:
          type: "integer"
          description: "前回集計からの増減"
    InventoryGenreCount:
      type: "object"
      description: "ジャンル別の件数"
      required: ["genre", "count"]
      properties:
        genre:
          $ref: "#/components/schemas/Genre"
        count:
          type: "integer"
          description: "件数"
          minimum: 0
    InventoryReportBook:
      type: "object"
      description: "在庫状況レポートの明細（書籍 1 件）"
      required: ["book_id", "title", "author", "genre", "book_status"]
      properties:
        book_id:
          $ref: "#/components/schemas/BookId"
        title:
          type: "string"
          description: "タイトル"
        author:
          type: "string"
          description: "著者"
        genre:
          $ref: "#/components/schemas/Genre"
        book_status:
          $ref: "#/components/schemas/BookStatus"
    InventoryReportResponse:
      type: "object"
      description: "在庫状況レポート"
      required:
        - "report_id"
        - "report_type"
        - "period_type"
        - "period_start"
        - "period_end"
        - "aggregated_at"
        - "report_status"
        - "summary"
        - "status_counts"
        - "genre_counts"
        - "books"
        - "pagination"
      properties:
        report_id:
          $ref: "#/components/schemas/ReportId"
        report_type:
          $ref: "#/components/schemas/ReportType"
        period_type:
          $ref: "#/components/schemas/PeriodType"
        period_start:
          type: "string"
          format: "date"
          description: "集計開始日"
        period_end:
          type: "string"
          format: "date"
          description: "集計終了日"
        aggregated_at:
          type: "string"
          format: "date-time"
          description: "集計日時"
        report_status:
          $ref: "#/components/schemas/ReportStatus"
        summary:
          $ref: "#/components/schemas/InventoryReportSummary"
        status_counts:
          type: "array"
          description: "書籍状態別の集計明細"
          items:
            $ref: "#/components/schemas/InventoryStatusCount"
        genre_counts:
          type: "array"
          description: "ジャンル別の集計明細"
          items:
            $ref: "#/components/schemas/InventoryGenreCount"
        books:
          type: "array"
          description: "集計対象の書籍一覧（ページネーション対象）"
          items:
            $ref: "#/components/schemas/InventoryReportBook"
        pagination:
          $ref: "#/components/schemas/Pagination"
    LoanStatsSummary:
      type: "object"
      description: "貸出統計のサマリ"
      required: ["total_loans", "returned_count", "distinct_users"]
      properties:
        total_loans:
          type: "integer"
          description: "期間内の貸出件数"
          minimum: 0
        total_loans_delta_rate:
          type: "number"
          description: "前期間比の増減率（-1.0 以上）"
        returned_count:
          type: "integer"
          description: "期間内に返却された件数"
          minimum: 0
        distinct_users:
          type: "integer"
          description: "期間内に貸出を行った利用者の実数"
          minimum: 0
        loans_per_user:
          type: "number"
          description: "利用者 1 人あたりの平均貸出件数"
          minimum: 0
    LoanTrendPoint:
      type: "object"
      description: "集計期間区分ごとの貸出件数推移の 1 点"
      required: ["period_label", "loan_count"]
      properties:
        period_label:
          type: "string"
          description: "期間ラベル（集計期間区分に応じた表記）"
          examples: ["2026-08"]
        loan_count:
          type: "integer"
          description: "その期間の貸出件数"
          minimum: 0
    PopularBookRankingItem:
      type: "object"
      description: "人気書籍ランキングの 1 件"
      required: ["rank", "book_id", "title", "author", "genre", "loan_count"]
      properties:
        rank:
          type: "integer"
          description: "順位"
          minimum: 1
        book_id:
          $ref: "#/components/schemas/BookId"
        title:
          type: "string"
          description: "タイトル"
        author:
          type: "string"
          description: "著者"
        genre:
          $ref: "#/components/schemas/Genre"
        loan_count:
          type: "integer"
          description: "期間内の貸出回数"
          minimum: 0
    LoanStatsBreakdownItem:
      type: "object"
      description: "内訳の 1 件"
      required: ["label", "count"]
      properties:
        label:
          type: "string"
          description: "内訳のラベル（利用者区分またはジャンルの値）"
        count:
          type: "integer"
          description: "件数"
          minimum: 0
    LoanStatsBreakdowns:
      type: "object"
      description: "貸出統計の区分別内訳"
      required: ["user_category", "genre"]
      properties:
        user_category:
          type: "array"
          description: "利用者区分別の内訳"
          items:
            $ref: "#/components/schemas/LoanStatsBreakdownItem"
        genre:
          type: "array"
          description: "ジャンル別の内訳"
          items:
            $ref: "#/components/schemas/LoanStatsBreakdownItem"
    LoanStatsReportResponse:
      type: "object"
      description: "貸出統計レポート"
      required:
        - "report_id"
        - "report_type"
        - "period_type"
        - "period_start"
        - "period_end"
        - "aggregated_at"
        - "report_status"
        - "summary"
        - "trend"
        - "ranking"
        - "breakdowns"
        - "pagination"
      properties:
        report_id:
          $ref: "#/components/schemas/ReportId"
        report_type:
          $ref: "#/components/schemas/ReportType"
        period_type:
          $ref: "#/components/schemas/PeriodType"
        period_start:
          type: "string"
          format: "date"
          description: "集計開始日"
        period_end:
          type: "string"
          format: "date"
          description: "集計終了日"
        aggregated_at:
          type: "string"
          format: "date-time"
          description: "集計日時"
        report_status:
          $ref: "#/components/schemas/ReportStatus"
        summary:
          $ref: "#/components/schemas/LoanStatsSummary"
        trend:
          type: "array"
          description: "期間別の貸出件数推移"
          items:
            $ref: "#/components/schemas/LoanTrendPoint"
        ranking:
          type: "array"
          description: "人気書籍ランキング（ページネーション対象）"
          items:
            $ref: "#/components/schemas/PopularBookRankingItem"
        breakdowns:
          $ref: "#/components/schemas/LoanStatsBreakdowns"
        pagination:
          $ref: "#/components/schemas/Pagination"
