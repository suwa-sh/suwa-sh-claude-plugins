# _api-summary.yaml
uc: "返却期限接近の貸出を判定する"
business: "貸出期限管理業務"
buc: "返却期限をリマインドするフロー"
endpoints:
  - method: "GET"
    path: "/api/v1/staff/duedates/upcoming"
    summary: "返却期限接近の貸出一覧を取得する（司書向け）"
    response_schema: "StaffUpcomingDueListResponse"
    tags: ["duedates"]
async_events: []
schemas:
  - name: "StaffUpcomingDueListResponse"
    properties:
      - name: "evaluated_at"
        type: "string(date-time)"
        required: true
      - name: "base_date"
        type: "string(date)"
        required: true
      - name: "timing_type"
        type: "string"
        required: true
      - name: "remind_days"
        type: "integer"
        required: true
      - name: "total"
        type: "integer"
        required: true
      - name: "page"
        type: "integer"
        required: true
      - name: "per_page"
        type: "integer"
        required: true
      - name: "items"
        type: "array<StaffUpcomingDueItem>"
        required: true
  - name: "StaffUpcomingDueItem"
    properties:
      - name: "loan_id"
        type: "string"
        required: true
      - name: "book_id"
        type: "string"
        required: true
      - name: "book_title"
        type: "string"
        required: true
      - name: "author"
        type: "string"
        required: true
      - name: "user_no"
        type: "string"
        required: true
      - name: "user_name"
        type: "string"
        required: true
      - name: "loan_date"
        type: "string(date)"
        required: true
      - name: "loan_period_type"
        type: "string"
        required: true
      - name: "due_date"
        type: "string(date)"
        required: true
      - name: "days_remaining"
        type: "integer"
        required: true
      - name: "loan_status"
        type: "string"
        required: true
