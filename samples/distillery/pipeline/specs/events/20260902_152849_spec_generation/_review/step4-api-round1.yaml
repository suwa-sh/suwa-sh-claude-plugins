    fix: "`ResendNotificationRequest` から `notification_id` を削除し、再送理由など将来の任意項目のみを持つ空スキーマにするか、`POST /api/v1/staff/notifications/{notification_id}/resend` の requestBody 自体を削除して冪等キーヘッダのみで受け付ける契約にする。"
