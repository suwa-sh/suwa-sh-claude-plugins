    artifact: "asyncapi.yaml"
    file: "docs/specs/events/20260902_152849_spec_generation/_cross-cutting/api/asyncapi.yaml"
    line: null
    severity: major
    viewpoint: 2
    claim: "メッセージ payload の共通エンベロープが揃っていない。`HoldNoticeRequestedPayload` は `message_id` を持たず `notification_id` を required にする一方、`RemindNotificationRequestedPayload` / `DunNotificationRequestedPayload` は `message_id` を required にし `notification_id` を optional にしている。通知状態は publish 前に「送信待ち」で作成される設計なので、後者で `notification_id` が任意だと Worker が通知レコードを特定できない。"
    fix: "3 payload とも `message_id`（メッセージ一意 ID）と `notification_id`（通知レコード ID）の両方を持たせ、いずれも required に統一する。`HoldNoticeRequestedPayload` に `message_id: {type: string, format: uuid}` を追加し、Remind / Dun の required に `notification_id` を追加する。"
    source_refs:
