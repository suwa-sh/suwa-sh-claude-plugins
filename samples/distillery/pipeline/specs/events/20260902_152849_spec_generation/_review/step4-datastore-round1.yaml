  - id: S4-datastore-010
    artifact: "kvs-schema.yaml"
    file: "docs/specs/events/20260902_152849_spec_generation/_cross-cutting/datastore/kvs-schema.yaml"
    line: 21
    severity: minor
    viewpoint: 4
    claim: "ファイル冒頭のキー命名規則は『目的: session / idem / lock / cache』を第 1 階層に置くと宣言しているのに、idem: 接頭辞の 4 パターン（idem:api / idem:notification:loan / idem:notification:reservation / idem:mq:consumed）は purpose が \"lock（...）\" になっている。宣言した語彙と purpose の値が対応せず、purpose での分類（{目的}:* スキャン）が成り立たない"
    fix: "purpose の値を接頭辞と同じ語彙（session / idem / lock / cache）に統一し、補足説明は括弧書きではなく description 側に寄せる。lock を名乗るのは lock:job:* だけにする"
    source_refs:
