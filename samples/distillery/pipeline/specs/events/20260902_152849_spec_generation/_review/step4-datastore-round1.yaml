    claim: "user_events / loan_events / reservation_events の description は、いずれも『arch が RDRA 情報◯◯を model_type: event_snapshot と定義したことに由来し』を event ストリーム設置の根拠としている。しかし arch で event_snapshot なのは E-001 書籍・E-006 通知・E-007 統計レポートも同じで、これらには event テーブルが無い。実際の設置基準は『UC がイベントからの射影を必要とするか』であり、記載された根拠と一致しない"
