  - id: S4-datastore-008
    artifact: "rdb-schema.yaml"
    file: "docs/specs/events/20260902_152849_spec_generation/_cross-cutting/datastore/rdb-schema.yaml"
    line: 186
    severity: minor
    viewpoint: 3
    claim: "users.email は『保管時暗号化の対象（NFR E.6.1.1）』と description に書かれている一方で、uq_users_email によるユニーク制約が張られている。暗号化方式が非決定的（ランダム IV）だと同一アドレスでも暗号文が一致せず一意制約が機能しない。前提となる暗号化方式が schema に書かれていない"
    fix: "決定的暗号化を前提とする旨を uq_users_email の reason または email の description に明記するか、email_hash（正規化後のハッシュ）列を追加してそちらにユニーク制約を張る。notifications.recipient_email も同じ暗号化方針に揃える"
    source_refs:
      - "docs/specs/events/20260902_152849_spec_generation/利用者管理業務/利用者を管理するフロー/利用者を登録する/_model-summary.yaml"
  - id: S4-datastore-009
    artifact: "rdb-schema.yaml"
    file: "docs/specs/events/20260902_152849_spec_generation/_cross-cutting/datastore/rdb-schema.yaml"
    line: 573
    severity: minor
    viewpoint: 3
    claim: "notifications.target_loan_id / target_reservation_id はともに nullable で、『取置き案内なら予約ID、リマインド・督促なら貸出ID』という排他関係が description の文章にしかない。どちらも NULL の行、どちらも埋まった行を DB が受け入れる"
    fix: "notification_type と 2 つの対象 ID の排他関係を CHECK 制約として定義する（例: notification_type = '取置き案内' のとき target_reservation_id IS NOT NULL AND target_loan_id IS NULL、それ以外は逆）。テーブル定義に constraints 項目が無ければ _review_notes に制約方針として記録する"
    source_refs:
