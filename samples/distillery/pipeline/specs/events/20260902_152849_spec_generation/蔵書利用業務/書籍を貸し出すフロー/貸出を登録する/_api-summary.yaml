# _api-summary.yaml
uc: "貸出を登録する"
business: "蔵書利用業務"
buc: "書籍を貸し出すフロー"
endpoints:
  - method: "POST"
    path: "/api/v1/loans"
    summary: "貸出記録を作成し、返却期限を自動設定して書籍状態・利用者状態・予約状態を遷移させる（司書ロール限定・冪等キー必須）"
    request_schema: "CreateLoanRequest"
    response_schema: "LoanResponse"
    tags: ["貸出"]
async_events: []
schemas:
  - name: "CreateLoanRequest"
    properties:
      - name: "book_id"
        type: "string"
        required: true
      - name: "user_no"
        type: "string"
        required: true
      - name: "loan_period_type"
        type: "string"
        required: true
  - name: "LoanResponse"
    properties:
      - name: "loan_id"
        type: "string"
        required: true
      - name: "book_id"
        type: "string"
        required: true
      - name: "user_no"
        type: "string"
        required: true
      - name: "loan_date"
        type: "string(date)"
        required: true
      - name: "loan_period_type"
        type: "string"
        required: true
      - name: "due_date"
        type: "string(date)"
        required: true
      - name: "loan_status"
        type: "string"
        required: true
      - name: "book_status"
        type: "string"
        required: true
      - name: "reservation_id"
        type: "string"
        required: false
