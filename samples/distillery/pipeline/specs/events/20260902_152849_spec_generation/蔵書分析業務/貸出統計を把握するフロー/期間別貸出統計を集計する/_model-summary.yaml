tables:
  - name: "statistical_reports"
    rdra_info: "統計レポート"
    operations:
      - type: "INSERT"
        columns:
          - name: "report_id"
            value: "採番したレポートID"
          - name: "report_type"
            value: "期間別貸出統計 または 人気書籍ランキング"
          - name: "period_type"
            value: "集計期間区分（日次/月次/年次）"
          - name: "period_start"
            value: "集計開始日"
          - name: "period_end"
            value: "集計終了日"
          - name: "aggregated_at"
            value: "集計開始日時"
          - name: "detail"
            value: "空の JSON オブジェクトで初期化"
          - name: "report_status"
            value: "集計中（固定）"
        where: ""
      - type: "SELECT"
        columns: []
        where: "report_id = :report_id（Worker が集計対象レポートを取得）"
      - type: "UPDATE"
        columns:
          - name: "detail"
            value: "total_loans / returned_count / distinct_users / loans_per_user / trend[] / ranking[] / user_category_counts / genre_counts の JSON"
          - name: "report_status"
            value: "作成済み（実績あり）または実績なし（期間内貸出0件）"
          - name: "aggregated_at"
            value: "集計完了時刻"
        where: "report_id = :report_id AND report_status = '集計中'"
    indexes_needed:
      - columns: ["report_type", "aggregated_at"]
        reason: "レポート種別ごとに最新の統計レポートを取得するため"
        access_pattern: "report_type 等価 + aggregated_at 降順"
  - name: "loans"
    rdra_info: "貸出"
    operations:
      - type: "SELECT"
        columns: []
        where: "loan_date BETWEEN :period_start AND :period_end"
    indexes_needed:
      - columns: ["loan_date"]
        reason: "集計期間での範囲絞り込みを高速化するため（NFR B.2.1.3 ターンアラウンド 10 秒以内）"
        access_pattern: "loan_date の範囲検索"
      - columns: ["book_id", "loan_date"]
        reason: "書籍別貸出回数のランキング集計のため"
        access_pattern: "期間内で book_id ごとに GROUP BY"
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id IN (:period_book_ids)（期間内貸出の DISTINCT book_id 全件の書誌情報とジャンルを取得。ランキング表示は取得結果の上位 20 件に絞る）"
    indexes_needed:
      - columns: ["book_id"]
        reason: "期間内貸出対象書籍の書誌情報を主キーで引くため"
        access_pattern: "book_id の IN 検索"
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_no IN (:period_user_nos)（利用者区分別内訳のため利用者区分を取得）"
    indexes_needed:
      - columns: ["user_no"]
        reason: "期間内貸出の利用者区分を主キーで引くため"
        access_pattern: "user_no の IN 検索"

kvs:
  - key_pattern: "idem:api:createLoanStatsReport:{idempotency_key}"
    purpose: "idem"
    value_type: "処理済みの report_id"
    ttl: "24h"
    operations: ["GET", "SET"]
  - key: "idem:mq:consumed:{message_id}"
    purpose: "idem"
    value_type: "消費済みマーカー"
    ttl: "24h"
    operations: ["GET", "SET"]
object_storage: []
