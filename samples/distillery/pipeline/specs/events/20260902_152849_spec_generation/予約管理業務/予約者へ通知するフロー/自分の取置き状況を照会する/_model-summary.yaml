# _model-summary.yaml
uc: "自分の取置き状況を照会する"
business: "予約管理業務"
buc: "予約者へ通知するフロー"

bounded_context_id: "BC-005"

models:
  - name: "取置き受取案内画面 / HoldPickupView"
    tier: "tier-frontend-patron"
    layer: "view"
    type: "view-model"
    rdra_info: "予約"
  - name: "GetHoldStatusRequest"
    tier: "tier-frontend-patron"
    layer: "api-client"
    type: "request"
    rdra_info: "予約"
  - name: "GetHoldStatusRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "予約"
  - name: "GetMyHoldStatusQuery"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "query"
    rdra_info: "予約"
  - name: "予約(Reservation)"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "予約"
  - name: "書籍(Book)"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "書籍"
  - name: "ReservationRepository"
    tier: "tier-backend-api"
    layer: "repository"
    type: "entity"
    rdra_info: "予約"
  - name: "ReservationRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "予約"
  - name: "BookRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "書籍"
  - name: "UserRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "利用者"

tables:
  - name: "reservations"
    rdra_info: "予約"
    operations:
      - type: "SELECT"
        columns: []
        where: "reservation_id = :reservation_id AND user_no = :認証利用者番号（個人情報参照可否条件）。取置き開始日時は reservations.hold_started_at を直接参照する"
    indexes_needed:
      - columns: ["reservation_id", "user_no"]
        reason: "本人限定参照を索引段階で絞り込み、他利用者の予約に到達させない"
        access_pattern: "予約ID + 利用者番号の等値検索"
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = :book_id（取置き対象書籍の表示項目取得）"
    indexes_needed: []
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_no = :認証利用者番号（窓口提示用の利用者番号の確認）"
    indexes_needed: []

kvs: []
object_storage: []
