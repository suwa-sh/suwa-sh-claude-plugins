uc: 利用者を登録する
business: 利用者管理業務
buc: 利用者を管理するフロー
bounded_context_id: BC-002
models:
  - name: createUserRequest
    tier: tier-backend-api
    layer: presentation
    type: request-dto
  - name: createUserCommand
    tier: tier-backend-api
    layer: usecase
    type: command
  - name: User
    tier: tier-backend-api
    layer: domain
    type: entity
    rdra_info: 利用者
  - name: createUserPageState
    tier: tier-frontend-staff
    layer: state
    type: state
tables:
  - name: users
    rdra_info: 利用者
    operations:
      - type: INSERT
        columns:
          - name: name
            value: 契約入力のname
          - name: email
            value: 契約入力のemail
          - name: phone
            value: 契約入力のphone
          - name: address
            value: 契約入力のaddress
          - name: user_type
            value: 契約入力のuser_type
          - name: user_number
            value: サーバーで一意に採番
          - name: registered_at
            value: 処理のサーバー時刻
          - name: updated_at
            value: 同じサーバー時刻
          - name: version
            value: "0"
          - name: deleted
            value: "false"
        where: ""
    indexes_needed:
      - columns:
          - user_number
        reason: 対象の照会と排他取得
        access_pattern: user_number = 採番後のuser_number AND deleted = false
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-003.yaml
  - name: users_events
    rdra_info: 利用者
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-003.yaml
    operations:
      - type: SELECT
        columns:
          - name: actor_id
          - name: request_key
          - name: request_hash
          - name: response
        where: actor_id = 認証主体 AND request_key = operationとキーの結合
      - type: INSERT
        columns:
          - name: event_id
            value: 一意のイベントID
          - name: user_number
            value: 更新対象の識別子
          - name: version
            value: 更新後のversion
          - name: event_type
            value: createUser
          - name: occurred_at
            value: 業務更新と同じサーバー時刻
          - name: actor_id
            value: 認証主体の利用者番号
          - name: request_key
            value: operation + X-Idempotency-Key
          - name: request_hash
            value: TR-IDEMPの正規化要求SHA-256
          - name: payload
            value: 更新する属性と値のJSON
          - name: response
            value: HTTP statusとbodyのJSON
    indexes_needed:
      - columns:
          - actor_id
          - request_key
        reason: 同一主体の同一要求を一意にする
        access_pattern: TR-IDEMPの並行要求排他
  - name: audit_logs
    rdra_info: ""
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-003.yaml
    operations:
      - type: INSERT
        columns:
          - name: audit_id
            value: 一意の監査ID
          - name: occurred_at
            value: 現在時刻
          - name: actor_user_number
            value: 認証主体
          - name: action_type
            value: データ更新
          - name: target_entity
            value: E-003
          - name: target_id
            value: 対象識別子。検索はoperation名
          - name: result
            value: 成功
    indexes_needed: []
kvs:
  - key_pattern: idempotency:{actor}:{operation}:{key}
    purpose: 確定済み応答キャッシュ。TR-IDEMPに従いRDBを正本とする
    value_type: HTTP status/body
    ttl: 24h
    operations:
      - GET
      - SET
object_storage: []
