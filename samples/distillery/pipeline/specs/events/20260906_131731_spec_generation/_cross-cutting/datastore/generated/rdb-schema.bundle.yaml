      - uc: 延滞を判定する
        operations:
          - SELECT
          - UPDATE
      - uc: 延滞一覧を参照する
        operations:
          - SELECT
      - uc: 督促を送信する
        operations:
          - SELECT
      - uc: リマインドを送信する
        operations:
          - SELECT
      - uc: リマインド対象を抽出する
        operations:
          - SELECT
      - uc: 書籍を削除する
        operations:
          - SELECT
      - uc: 貸出を登録する
        operations:
          - SELECT
          - INSERT
      - uc: 返却を登録する
        operations:
          - SELECT
          - UPDATE
      - uc: 返却通知を送信する
        operations:
          - SELECT
