          - SELECT
      - uc: 書籍を編集する
        operations:
          - SELECT
      - uc: 書籍一覧を参照する
        operations:
          - SELECT
      - uc: 貸出を登録する
        operations:
          - SELECT
      - uc: 返却を登録する
        operations:
          - SELECT
      - uc: 返却通知を送信する
        operations:
          - SELECT
      - uc: 人気書籍ランキングを参照する
        operations:
          - SELECT
      - uc: 在庫状況一覧を参照する
        operations:
          - SELECT
  - name: loan_periods
    rdra_info: 貸出期間
    description: 貸出期間の永続化
    columns:
      - name: loan_period_id
        type: string
        nullable: false
        description: 貸出期間設定ID（世代ごとに採番）
      - name: loan_days
        type: integer
        nullable: false
        description: 貸出期間（日数）
      - name: valid_from
        type: date
        nullable: false
        description: 適用開始日
      - name: valid_to
        type: date
        nullable: true
        description: 適用終了日（現行世代は NULL）
      - name: updated_at
        type: datetime
        nullable: false
        description: 更新日時
    primary_key:
      - loan_period_id
    foreign_keys: []
    indexes: []
    used_by:
      - uc: 貸出を登録する
