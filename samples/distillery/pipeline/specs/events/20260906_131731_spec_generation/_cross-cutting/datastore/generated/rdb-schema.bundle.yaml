version: "1.0"
datastore: rdb
tables:
  - name: audit_logs
    rdra_info: ""
    description: 監査ログの永続化
    columns:
      - name: audit_id
        type: string
        nullable: false
        description: 監査ログID
      - name: occurred_at
        type: datetime
        nullable: false
        description: 発生日時
      - name: actor_user_number
        type: string
        nullable: false
        description: 操作者の利用者番号（バッチはタイマーの固定 ID）
      - name: action_type
        type: string
        nullable: false
        description: "操作種別（enum: ログイン・ログアウト・ログイン失敗・データ参照・データ更新）"
      - name: target_entity
        type: string
        nullable: false
        description: 対象エンティティ（E-xxx）
      - name: target_id
        type: string
        nullable: false
        description: 対象レコード ID（利用状況閲覧範囲判定の検証に使う）
      - name: result
        type: string
        nullable: false
        description: "結果（enum: 成功・拒否・失敗）"
    primary_key:
      - audit_id
    foreign_keys: []
    indexes: []
    used_by:
      - uc: 予約状況を参照する
