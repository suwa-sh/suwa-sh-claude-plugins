  - name: notifications
    rdra_info: 通知
    description: 通知の永続化
    columns:
      - name: notification_id
        type: string
        nullable: false
        description: 通知ID
      - name: user_number
        type: string
        nullable: false
        description: 利用者番号（E-003 への参照）
      - name: notification_type
        type: string
        nullable: false
        description: "通知種別（enum: 返却通知・リマインド・督促）"
      - name: recipient_email
        type: string
        nullable: false
        description: 送信先メールアドレス（送信時点の値のコピー。個人情報。NFR E.6.1.1）
      - name: subject
        type: string
        nullable: false
        description: 件名
      - name: body
        type: text
        nullable: false
        description: 本文
      - name: sent_at
        type: datetime
        nullable: false
        description: 送信日時（イベント発生日時 occurred_at）
      - name: send_result
        type: string
        nullable: false
        description: "送信結果（enum: 成功・失敗。メール配信サービスの応答を ACL で翻訳した値）"
      - name: target_loan_id
        type: string
        nullable: true
        description: 対象貸出ID（リマインド・督促のとき。E-004 への参照。返却通知では NULL）
      - name: target_reservation_id
        type: string
        nullable: true
        description: 対象予約ID（返却通知のとき。E-007 への参照。リマインド・督促では NULL）
    primary_key:
      - notification_id
    foreign_keys:
      - columns:
          - user_number
        references:
          table: users
          columns:
            - user_number
        on_delete: RESTRICT
      - columns:
          - target_loan_id
        references:
          table: loans
          columns:
            - loan_id
        on_delete: RESTRICT
      - columns:
          - target_reservation_id
        references:
          table: reservations
          columns:
            - reservation_id
        on_delete: RESTRICT
    indexes:
      - name: notifications_target_loan_id_notification_type_active
        columns:
          - target_loan_id
          - notification_type
        unique: true
        where: send_result = '成功' AND target_loan_id IS NOT NULL
      - name: notifications_target_reservation_id_notification_type_active
        columns:
          - target_reservation_id
          - notification_type
        unique: true
        where: send_result = '成功' AND target_reservation_id IS NOT NULL
    used_by:
      - uc: 延滞一覧を参照する
        operations:
          - SELECT
      - uc: 督促を送信する
        operations:
          - INSERT
      - uc: リマインドを送信する
        operations:
          - INSERT
      - uc: 返却通知を送信する
        operations:
          - SELECT
          - INSERT
