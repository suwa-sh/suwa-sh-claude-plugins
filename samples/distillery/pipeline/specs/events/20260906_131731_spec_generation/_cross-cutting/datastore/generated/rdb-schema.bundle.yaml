      - name: password_updated_at
        type: datetime
        nullable: false
        description: パスワード最終更新日時（有効期限ポリシーの判定基準）
      - name: failed_attempts
        type: integer
        nullable: false
        description: 連続ログイン失敗回数
      - name: locked_until
        type: datetime
        nullable: true
        description: アカウントロック解除日時（未ロックは NULL）
    primary_key:
      - user_number
    foreign_keys:
      - columns:
          - user_number
        references:
          table: users
          columns:
            - user_number
        on_delete: RESTRICT
    indexes: []
    used_by: []
  - name: genres
    rdra_info: ジャンル
