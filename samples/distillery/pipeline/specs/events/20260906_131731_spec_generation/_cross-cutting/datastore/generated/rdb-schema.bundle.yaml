      - uc: 書籍を検索する
        operations:
          - INSERT
      - uc: 書籍詳細を参照する
        operations:
          - INSERT
      - uc: 書籍を削除する
        operations:
          - INSERT
      - uc: 書籍を登録する
        operations:
          - INSERT
      - uc: 書籍を編集する
        operations:
          - INSERT
      - uc: 書籍一覧を参照する
        operations:
          - INSERT
      - uc: 予約を取り消す
        operations:
          - INSERT
      - uc: 予約を登録する
        operations:
          - INSERT
      - uc: 予約一覧を参照する
        operations:
          - INSERT
      - uc: 貸出を登録する
        operations:
          - INSERT
      - uc: 返却を登録する
        operations:
          - INSERT
      - uc: 返却通知を送信する
        operations:
          - INSERT
      - uc: 人気書籍ランキングを参照する
        operations:
          - INSERT
      - uc: 在庫状況一覧を参照する
        operations:
          - INSERT
      - uc: 期間別貸出統計を参照する
