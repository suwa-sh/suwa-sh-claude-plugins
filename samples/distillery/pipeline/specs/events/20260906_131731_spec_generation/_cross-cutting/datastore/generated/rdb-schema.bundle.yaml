      - uc: 貸出履歴を参照する
        operations:
          - SELECT
      - uc: 延滞を判定する
        operations:
          - SELECT
      - uc: 延滞一覧を参照する
        operations:
          - SELECT
      - uc: 督促を送信する
        operations:
          - SELECT
      - uc: リマインドを送信する
        operations:
          - SELECT
      - uc: リマインド対象を抽出する
        operations:
          - SELECT
      - uc: 書籍を検索する
        operations:
          - SELECT
      - uc: 書籍詳細を参照する
        operations:
          - SELECT
      - uc: 書籍を削除する
        operations:
          - SELECT
          - UPDATE
      - uc: 書籍を登録する
        operations:
          - INSERT
      - uc: 書籍を編集する
        operations:
          - SELECT
          - UPDATE
      - uc: 書籍一覧を参照する
        operations:
          - SELECT
      - uc: 予約を取り消す
        operations:
          - SELECT
          - UPDATE
      - uc: 予約を登録する
        operations:
          - SELECT
      - uc: 予約一覧を参照する
        operations:
          - SELECT
      - uc: 貸出を登録する
        operations:
          - SELECT
          - UPDATE
      - uc: 返却を登録する
        operations:
          - SELECT
          - UPDATE
      - uc: 返却通知を送信する
        operations:
          - SELECT
      - uc: 人気書籍ランキングを参照する
        operations:
          - SELECT
      - uc: 在庫状況一覧を参照する
        operations:
          - SELECT
  - name: books_events
    rdra_info: 書籍
    description: 書籍の変更イベント。INSERTのみ。
    columns:
      - name: event_id
        type: string
        nullable: false
        description: イベント識別子。新規追記時に生成するUUID。
      - name: book_id
        type: string
        nullable: false
        description: 対象書籍の識別子。
      - name: version
        type: integer
        nullable: false
        description: 対象集約の確定版。新規は1、変更ごとに1増加する。
      - name: event_type
        type: string
        nullable: false
        description: 発生した変更の種別。値とpayloadは当該UCのモデル操作を参照。
      - name: occurred_at
        type: datetime
        nullable: false
        description: イベント確定時刻。UTCの時刻を保存する。
      - name: actor_id
        type: string
        nullable: false
        description: 認証主体の利用者番号。日次・配信はサービス主体ID。
      - name: request_key
        type: string
        nullable: false
        description: operationとX-Idempotency-Keyの結合。日次・配信はTR-IDEMPの安定キー。
      - name: request_hash
        type: string
        nullable: false
        description: 本文・path・query・If-Match等の正規化SHA-256。TR-IDEMPを参照。
      - name: payload
        type: text
        nullable: false
        description: イベント別の変更値をJSONで保持
      - name: response
        type: text
        nullable: false
        description: 再送時のHTTP statusとbodyをJSONで保持
    primary_key:
      - event_id
    foreign_keys: []
    indexes:
      - name: books_events_version
        columns:
          - book_id
          - version
        unique: true
      - name: books_events_request
        columns:
          - actor_id
          - request_key
          - book_id
        unique: true
    used_by:
      - uc: 書籍を削除する
        operations:
          - SELECT
          - INSERT
      - uc: 書籍を登録する
        operations:
          - SELECT
          - INSERT
      - uc: 書籍を編集する
        operations:
          - SELECT
          - INSERT
      - uc: 予約を取り消す
        operations:
          - INSERT
      - uc: 貸出を登録する
        operations:
          - INSERT
      - uc: 返却を登録する
        operations:
          - INSERT
