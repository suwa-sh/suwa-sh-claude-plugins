          - SELECT
  - name: loan_statistics
    rdra_info: 貸出統計
    description: 貸出統計の永続化
    columns:
      - name: stat_id
        type: string
        nullable: false
        description: 集計ID
      - name: period_type
        type: string
        nullable: false
        description: "集計期間種別（enum: 日・月・年）"
      - name: period_start
        type: date
        nullable: false
        description: 集計対象期間 開始日
      - name: period_end
        type: date
        nullable: false
        description: 集計対象期間 終了日
      - name: book_id
        type: string
        nullable: false
        description: 書籍ID（E-001 への参照）
      - name: loan_count
        type: integer
        nullable: false
        description: 貸出回数（書籍ごと。人気書籍ランキングの基準）
      - name: loan_total
        type: integer
        nullable: false
        description: 貸出件数（集計期間内の合計）
      - name: ranking
        type: integer
        nullable: false
        description: ランキング順位
      - name: aggregated_at
        type: datetime
        nullable: false
        description: 集計日時（再集計のたびに更新）
    primary_key:
      - stat_id
    foreign_keys:
      - columns:
          - book_id
        references:
          table: books
          columns:
            - book_id
        on_delete: RESTRICT
    indexes:
      - name: loan_statistics_period_type_period_start_period_end_book_id
        columns:
          - period_type
          - period_start
          - period_end
          - book_id
        unique: true
    used_by:
      - uc: 人気書籍ランキングを参照する
        operations:
          - SELECT
          - INSERT
          - UPDATE
      - uc: 期間別貸出統計を参照する
        operations:
          - SELECT
          - INSERT
          - UPDATE
  - name: loans
    rdra_info: 貸出
    description: 貸出の現在状態の投影
    columns:
      - name: loan_id
        type: string
        nullable: false
        description: 貸出ID
      - name: book_id
        type: string
        nullable: false
        description: 書籍ID（E-001 への参照）
      - name: user_number
        type: string
        nullable: false
        description: 利用者番号（E-003 への参照。貸出履歴は要配慮情報に準じる NFR E.1.2.1 / E.6.1.1）
      - name: loaned_on
        type: date
        nullable: false
        description: 貸出日（貸出登録イベントの発生日。INSERT 時に確定）
      - name: due_date
        type: date
        nullable: false
        description: "返却期限（貸出日 + 貸出期間で自動設定。条件: 返却期限算出）"
      - name: current_status
        type: string
        nullable: false
        description: "貸出の状態（enum: 貸出中・延滞・返却済み）。返却日（情報.tsv）は nullable 日時のため排除し、返却登録イベントの occurred_at で管理する"
      - name: recorded_by
        type: string
        nullable: false
        description: 記録した司書（利用者区分=司書の利用者番号。E-003 への参照）
      - name: version
        type: integer
        nullable: false
        description: 楽観ロック用バージョン
      - name: updated_at
        type: datetime
        nullable: false
        description: スナップショット最終更新日時
      - name: returned_on
        type: date
        nullable: true
        description: 返却イベントから投影する返却日
    primary_key:
      - loan_id
    foreign_keys:
      - columns:
          - book_id
        references:
          table: books
          columns:
            - book_id
        on_delete: RESTRICT
      - columns:
          - user_number
        references:
          table: users
          columns:
            - user_number
        on_delete: RESTRICT
      - columns:
          - recorded_by
        references:
          table: users
          columns:
            - user_number
        on_delete: RESTRICT
    indexes:
      - name: loans_book_id_active
        columns:
          - book_id
        unique: true
        where: current_status IN ('貸出中','延滞')
      - name: loans_user_number_loaned_on
        columns:
          - user_number
          - loaned_on
        unique: false
      - name: loans_current_status_due_date
        columns:
          - current_status
          - due_date
        unique: false
    used_by:
