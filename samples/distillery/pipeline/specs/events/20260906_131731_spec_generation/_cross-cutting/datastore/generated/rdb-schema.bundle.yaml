        operations:
          - INSERT
      - uc: 貸出履歴を参照する
        operations:
          - INSERT
      - uc: 利用者を削除する
        operations:
          - INSERT
      - uc: 利用者を登録する
        operations:
          - INSERT
      - uc: 利用者を編集する
        operations:
          - INSERT
      - uc: 利用者一覧を参照する
        operations:
