  - name: books
    rdra_info: 書籍
    description: 書籍の現在状態の投影
    columns:
      - name: book_id
        type: string
        nullable: false
        description: 書籍ID
      - name: title
        type: string
        nullable: false
        description: タイトル
      - name: author
        type: string
        nullable: false
        description: 著者
      - name: isbn
        type: string
        nullable: true
        description: ISBN（移行時に重複・欠損を名寄せする。NFR D.4.1.3）
      - name: publisher
        type: string
        nullable: true
        description: 出版社
      - name: genre_id
        type: string
        nullable: false
        description: ジャンルID（E-002 への参照）
      - name: media_type
        type: string
        nullable: false
        description: "媒体種別（enum: 紙・電子。初期リリースは紙のみ貸出・予約対象）"
      - name: current_status
        type: string
        nullable: false
        description: "書籍の状態（enum: 在庫あり・貸出中・予約待ち）。スナップショットのキャッシュ的ステータス。遷移はイベント（登録・貸出・返却・予約取消・削除）で記録する"
      - name: version
        type: integer
        nullable: false
        description: 楽観ロック用バージョン
      - name: updated_at
        type: datetime
        nullable: false
        description: スナップショット最終更新日時。情報.tsv の登録日・更新日は登録イベント / 最新イベントの occurred_at で管理する
      - name: deleted
        type: boolean
        nullable: false
        description: 削除イベントでtrue。通常参照はfalseに限定。
      - name: registered_at
        type: datetime
        nullable: false
        description: 最初の登録イベントのoccurred_at。以後の編集で変更しない。
    primary_key:
      - book_id
    foreign_keys:
      - columns:
          - genre_id
        references:
          table: genres
          columns:
            - genre_id
        on_delete: RESTRICT
    indexes:
      - name: books_isbn
        columns:
          - isbn
        unique: false
      - name: books_title
        columns:
          - title
        unique: false
    used_by:
      - uc: 予約状況を参照する
