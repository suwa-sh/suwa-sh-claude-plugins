type: object
additionalProperties: false
required:
  - remind_days_id
  - remind_days
  - valid_from
  - valid_to
  - updated_at
properties:
  remind_days_id:
    type: string
    minLength: 1
    maxLength: 255
  remind_days:
    type: integer
    minimum: 0
  valid_from:
    type: string
    format: date
  valid_to:
    anyOf:
      - type: string
        format: date
      - type: "null"
  updated_at:
    type: string
    format: date-time
