get:
  operationId: listBooks
  summary: 書籍一覧を参照する
  tags:
    - 蔵書管理業務
  parameters:
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: genre_ids
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 255
    - name: states
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - 在庫あり
            - 貸出中
            - 予約待ち
    - name: kind
      in: query
      schema:
        type: string
        enum:
          - キーワード
          - タイトル
          - 著者
          - ISBN
          - ジャンル
        default: キーワード
    - name: query
      in: query
      schema:
        type: string
        maxLength: 255
  responses:
    "200":
      description: 処理結果
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - items
              - page
              - page_size
              - total
            properties:
              items:
                type: array
                items:
                  $ref: ../components/schemas/Book.yaml
              page:
                type: integer
              page_size:
                type: integer
              total:
                type: integer
    "400":
      description: 入力形式不正
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "401":
      description: 認証が必要
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "403":
      description: 権限または接続経路違反
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "404":
      description: 対象なし
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "409":
      description: 競合または冪等キー不一致
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "422":
      description: 業務条件不成立
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "503":
      description: 設定または依存先を利用不可
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
  x-allowed-roles:
    - 司書
  x-network: 館内
  x-authorization-rule: ロールと経路を検証する。
post:
  operationId: createBook
  summary: 書籍を登録する
  tags:
    - 蔵書管理業務
  parameters:
    - name: X-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "201":
      description: 処理結果
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Book.yaml
    "400":
      description: 入力形式不正
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "401":
      description: 認証が必要
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "403":
      description: 権限または接続経路違反
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "404":
      description: 対象なし
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "409":
      description: 競合または冪等キー不一致
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "422":
      description: 業務条件不成立
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "503":
      description: 設定または依存先を利用不可
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
  x-allowed-roles:
    - 司書
  x-network: 館内
  x-authorization-rule: ロールと経路を検証する。
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/BookInput.yaml
