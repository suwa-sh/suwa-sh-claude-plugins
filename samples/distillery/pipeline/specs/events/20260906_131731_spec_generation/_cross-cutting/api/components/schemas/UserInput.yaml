type: object
additionalProperties: false
required:
  - name
  - email
  - phone
  - address
  - user_type
properties:
  name:
    type: string
    minLength: 1
    maxLength: 255
  email:
    type: string
    format: email
    maxLength: 254
  phone:
    anyOf:
      - type: string
        minLength: 1
        maxLength: 255
      - type: "null"
  address:
    anyOf:
      - type: string
        minLength: 1
        maxLength: 255
      - type: "null"
  user_type:
    type: string
    enum:
      - 司書
      - 利用者
