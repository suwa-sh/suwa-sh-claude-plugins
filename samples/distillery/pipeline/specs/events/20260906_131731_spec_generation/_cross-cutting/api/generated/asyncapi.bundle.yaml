      },
      "ReturnNotificationRequest": {
        "contentType": "application/json",
        "correlationId": {
          "location": "$message.header#/message_id"
        },
        "headers": {
          "additionalProperties": false,
          "properties": {
            "message_id": {
              "maxLength": 255,
              "minLength": 1,
              "type": "string"
            }
