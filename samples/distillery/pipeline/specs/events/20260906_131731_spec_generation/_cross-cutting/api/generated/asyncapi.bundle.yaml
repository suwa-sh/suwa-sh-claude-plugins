            "message_id": {
              "maxLength": 255,
              "minLength": 1,
              "type": "string"
            }
          },
          "required": [
            "message_id"
          ],
          "type": "object"
        },
        "name": "DailyRun",
        "payload": {
          "$ref": "#/components/schemas/DailyRunPayload"
        },
        "title": "延滞を判定する"
      },
      "DunningRequest": {
        "contentType": "application/json",
        "correlationId": {
          "location": "$message.header#/message_id"
        },
        "headers": {
          "additionalProperties": false,
          "properties": {
            "message_id": {
              "maxLength": 255,
