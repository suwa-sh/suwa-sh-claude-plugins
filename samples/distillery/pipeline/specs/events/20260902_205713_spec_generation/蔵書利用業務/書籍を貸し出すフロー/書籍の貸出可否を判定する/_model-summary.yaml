    rdra_info: "予約"

tables:
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = :book_id"
    indexes_needed:
      - columns: ["book_id"]
        reason: "書籍IDでの単一検索。主キーで充足する"
        access_pattern: "判定対象書籍の 1 件取得"
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_no = :user_no"
    indexes_needed:
      - columns: ["user_no"]
        reason: "利用者番号での単一検索。主キーで充足する"
        access_pattern: "貸出対象利用者の 1 件取得"
  - name: "reservations"
    rdra_info: "予約"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = :book_id AND reservation_status IN ('予約中','取置き中') ORDER BY priority ASC"
    indexes_needed:
      - columns: ["book_id", "reservation_status", "priority"]
        reason: "取置き中書籍貸出条件で対象書籍の有効な予約を順位順に取得する。カーディナリティの高い book_id を先頭に置き、状態で絞って順位でソートする"
        access_pattern: "書籍ID + 予約状態（予約中/取置き中）で絞り込み、予約順位の昇順で先頭 1 件を判定に使う"

kvs: []
object_storage: []
