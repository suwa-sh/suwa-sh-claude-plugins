schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-003"
title: "RDB は 3NF を基本としつつ、loans に貸出時点の書誌スナップショットを非正規化して保持する"
status: "approved"
generated_at: "2026-09-02T16:42:47+09:00"
context: |
  `_cross-cutting/datastore/rdb-schema.yaml` を全 UC の `_model-summary.yaml` から統合する過程で、
  正規化レベルの方針を確定する必要が生じた。テーブル構成は 9 件
  （`books` / `users` / `user_accounts` / `loans` / `reservations` / `notifications` /
  `statistical_reports` / `notification_idempotency_keys` / `user_events`）。
  イベントテーブルは `user_events` のみで、`loan_events` / `reservation_events` は
  書き手となる UC が 1 つも無く行が生成されないため Step4-Review で廃止した
  （`_review_notes` の S4-datastore-003）。廃止に伴い、返却日は `loans.returned_at`、
  取置き開始日時は `reservations.hold_started_at` のスナップショット列から取得する。

  論点は `loans` である。`loans` は arch の E-004（model_type: `event_snapshot`）に対応する
  スナップショットテーブルで、貸出登録で「貸出中」として作成され、返却で「返却済み」へ遷移し、
  返却後も貸出統計の集計対象として保持される。ここで次の要求が衝突した。

  - **履歴の再現性**: 「自分の貸出履歴を照会する」「自分の返却済み貸出を照会する」
    「期間別貸出統計を集計する」は、**貸出当時の書誌**（タイトル・著者・ISBN・ジャンル）を
    表示・集計する必要がある。書籍が改題・訂正・削除されても過去の履歴が変わってはならない。
  - **3NF の厳格適用**: 書誌は `books` の属性であり、`loans` は `book_id` だけを持ち
    参照時に JOIN するのが第 3 正規形に忠実な設計になる。
  - **書籍削除の存在**: 「書籍を削除する」UC があるため、`books` から行が消えると
    JOIN では履歴の書誌が復元できない。
  - **集計軸**: 期間別貸出統計はジャンル別の集計を含み、集計時点ではなく
    貸出時点のジャンルで集計する必要がある。
decision: |
  **基本方針は 3NF（第 3 正規形）とし、非正規化は「時点の再現性が業務要件である箇所」に限定して
  意図的に導入する。**

  1. **非正規化を採用する箇所（1 箇所のみ）**: `loans` に貸出時点の書誌スナップショットとして
     `book_title` / `book_author` / `book_isbn` / `book_genre` を持たせる。
     値は貸出登録時に `books` からコピーし、以後は更新しない（`books` の変更を伝播させない）。
     `book_isbn` は `books.isbn` が NULL 許容であるため NULL を許容する。
  2. **非正規化しない箇所**: 上記以外は 3NF を維持する。
     - `reservations` は書誌を複製せず `book_id` の参照のみを持つ。
       予約は「これから借りる」対象であり、表示は常に現在の書誌が正しいため。
     - `notifications` は宛先の氏名・メールアドレスを複製せず、`recipient_user_no` の参照のみを持つ。
       個人情報の複製面を増やさないことを優先する（`spec-decision-002` の MQ 本文方針と同じ理由）。
     - `users` / `user_accounts` は利用者と認証アカウントを分離したまま保持する。
  3. **正本はスナップショットテーブル**: `loans` / `reservations` を業務データの正本として扱い、
     時点情報（`loans.returned_at` / `reservations.hold_started_at` など）も
     スナップショット列に直接保持する。イベントテーブルは
     「スナップショットに残らない事実を UC が必要とする」場合に限って置き、
     現行では `user_events` のみが該当する（利用者は物理削除方式のため、
     退会後も登録・変更・退会の監査証跡を残す必要がある）。
     `user_events` の範囲では `users` のスナップショットをイベント列から再構築できるが、
     `loans` / `reservations` には再構築元のイベント列が存在しないため、
     非正規化カラムの不整合はアプリケーション側の書き込み経路で防止する。
  4. **外部キーの扱い**: `notifications` の `recipient_user_no` / `target_loan_id` /
     `target_reservation_id` には外部キー制約を張らない。
     利用者削除・書籍削除の後も送信実績と未達追跡を保持する必要があるため、
     参照整合性はアプリケーション側で担保する。
  5. **インデックスは要求されたアクセスパスにのみ張る**。主キー 1 件取得で充足する
     本人限定参照のための冗長インデックス（例: `reservations` の
     `(reservation_id, user_no)`）は採用しない。
  6. **`books.isbn` にユニーク制約を張らない**。RDRA 情報「書籍」の定義では
     1 書籍 ID＝蔵書 1 冊であり、複本は別の書籍 ID で登録されるため、
     同一 ISBN の複数行が正常である。登録時の重複確認はアプリケーション側のチェックに留める。
consequences:
  positive:
    - "書籍が改題・訂正・削除されても、貸出履歴と貸出統計を貸出当時の書誌で再現できる"
    - "貸出履歴一覧・返却済み貸出一覧が `loans` 単独で引けるため、`books` との JOIN を伴わずページングでき、一覧のレイテンシとクエリ計画が安定する"
    - "期間別貸出統計のジャンル別集計が貸出時点のジャンルで実施でき、集計の再実行結果が過去に遡って変化しない"
    - "書籍削除 UC を「履歴が壊れる」懸念なく実行できる（履歴側が書誌を自己保持しているため）"
    - "非正規化を 1 テーブル 4 カラムに限定したため、更新異常のリスク範囲が明確で、レビュー時に把握しやすい"
  negative:
    - "`books` の書誌訂正が既存の `loans` 行へ伝播しない。単なる誤字訂正であっても過去履歴には反映されず、「履歴の表示が古い」という問い合わせが起こりうる"
    - "同じ書誌情報が `books` と `loans` に二重に存在するため、ストレージ使用量が増え、貸出件数の増加に比例して膨らむ"
    - "スナップショット値の書き込みが貸出登録処理の責務として増え、`loans` への INSERT が `books` の読み取りに依存する"
    - "3NF からの意図的な逸脱であるため、ORM の自動生成や素朴なスキーマレビューでは「冗長」と誤解されやすく、意図を本 Decision Record で明示し続ける必要がある"
    - "`notifications` に外部キーを張らないため、参照先が存在しない孤児行が発生しうる。整合性チェックが運用側の責務になる"
    - "貸出・予約にはイベント列が無いため、`loans` / `reservations` のスナップショットや非正規化カラムが壊れた場合に再構築できる原本が無い。監査証跡が必要になった時点でイベント列の新設が必要になる"
alternatives_considered:
  - name: "厳格な 3NF を貫き、loans は book_id のみを持ち、履歴表示は books を JOIN して解決する"
    reason_rejected: |
      書籍を削除する UC が存在するため、削除後に貸出履歴の書誌が復元できない。
      また改題・書誌訂正が過去の履歴と統計へ遡って反映され、
      「貸出当時の書誌で履歴と統計を再現する」という業務要件を満たせない。
      期間別貸出統計のジャンル別集計も、集計を再実行するたびに過去分の数値が変わりうる。
  - name: "貸出イベントテーブルを維持し、書誌スナップショットはその payload だけに残して loans には持たない"
    reason_rejected: |
      履歴一覧・返却済み貸出一覧・貸出統計という高頻度の読み取りが、
      すべてイベントテーブルの payload 展開に依存することになる。
      ページング・ソート・ジャンル別集計を payload 上で行うのは
      クエリの複雑さとコストが大きく、スナップショットテーブルを置いた意義が失われる。
      さらに貸出イベントは書き手となる UC が 1 つも無く行が生成されないため、
      テーブル自体を Step4-Review で廃止した（S4-datastore-003）。
      読み取りは `loans` のスナップショット列で充足させる方が責務分離として素直である。
  - name: "書籍を物理削除せず論理削除にして、JOIN で常に書誌を解決する"
    reason_rejected: |
      削除された書籍の行は残せるが、改題・書誌訂正が過去履歴へ伝播する問題は解決しない。
      さらに全ての書籍参照クエリに削除フラグの条件が必要になり、
      条件の付け忘れによる不具合を全 UC に対して作り込むリスクを持つ。
      時点再現性の要求に対しては、論理削除ではなくスナップショットが本質的な解になる。
  - name: "全テーブルで参照先の表示用属性を非正規化する（reservations や notifications にも複製する）"
    reason_rejected: |
      予約と通知は「現在の書誌・現在の連絡先」で表示・送信するのが正しく、
      時点再現性の要求がない。複製すれば更新異常の面が広がるだけで便益がない。
      特に `notifications` への氏名・メールアドレスの複製は、
      個人情報の保管箇所を増やし、既定マスク方針と整合しない。
  - name: "books.isbn にユニーク制約を張って重複登録を DB で防ぐ"
    reason_rejected: |
      1 書籍 ID＝蔵書 1 冊という RDRA 情報「書籍」の定義上、
      同一 ISBN の複本を別行として登録するのが正常な運用である。
      ユニーク制約は正常な複本登録を阻害するため採用しない。
