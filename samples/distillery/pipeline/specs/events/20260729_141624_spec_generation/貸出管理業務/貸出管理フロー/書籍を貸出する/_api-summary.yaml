uc: "書籍を貸出する"
business: "貸出管理業務"
buc: "貸出管理フロー"
endpoints:
  - method: "POST"
    path: "/api/v1/loans"
    summary: "書籍の貸出"
    request_schema: "CreateLoanRequest"
    response_schema: "LoanResponse"
    tags:
      - "貸出管理"
    security:
      scopes:
        - "user"
    headers:
      - name: "X-User-Id"
        required: true
        type: "string"
        format: "uuid"
        description: "貸出を申請する利用者ID（暫定認証契約。認証基盤導入後に正式なトークン検証へ置き換える）"
      - name: "X-Idempotency-Key"
        required: true
        type: "string"
        format: "uuid"
        description: "冪等キー"
    error_responses:
      - status: 400
        condition: "book_id未指定"
      - status: 401
        condition: "認証ヘッダ（X-User-Id）欠落または不正"
      - status: 404
        condition: "書籍が存在しない"
      - status: 409
        condition: "在庫なし/予約あり、または冪等キー重複"
async_events: []
schemas:
  - name: "CreateLoanRequest"
    properties:
      - name: "book_id"
        type: "string"
        required: true
        description: "貸出対象の書籍ID"
  - name: "LoanResponse"
    properties:
      - name: "id"
        type: "string"
        required: true
        description: "貸出ID"
      - name: "book_id"
        type: "string"
        required: true
        description: "書籍ID"
      - name: "book_title"
        type: "string"
        required: true
        description: "書籍タイトル"
      - name: "user_id"
        type: "string"
        required: true
        description: "利用者ID"
      - name: "loan_date"
        type: "string"
        required: true
        description: "貸出日"
      - name: "due_date"
        type: "string"
        required: true
        description: "返却期限"
