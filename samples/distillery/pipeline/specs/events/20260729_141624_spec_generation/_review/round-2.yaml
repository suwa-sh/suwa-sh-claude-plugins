round: 2
# F-007, F-008 は minor のため round-3 の再レビューは実施せず、修正内容をこの resolved に直接追記した
# （team-lead 指示: 「openapi を触るので Step6 の該当検証だけ再実行。round-3 は不要」）。
findings:
  - id: "F-007"
    viewpoint: "契約生成適性 | 一貫性"
    severity: "minor"
    target: "_cross-cutting/api/openapi.yaml (components.schemas.ReservationResponse.properties.status.enum, 約1067-1073行目) / _cross-cutting/datastore/rdb-schema.yaml (reservations.status のカラム説明, 約311-314行目)"
    claim: >
      rdb-schema.yaml の reservations.status は今回のdiffで pending/reserved/cancelled/fulfilled
      の4値に正式化されたが、同じ値を利用者向けに公開する openapi.yaml の
      components.schemas.ReservationResponse.status の enum には "fulfilled" が追加されておらず、
      pending/reserved/cancelled の3値のままである。
    evidence: >
      rdb-schema.yaml 314行目は
      「予約状態（pending/reserved/cancelled/fulfilled）。...fulfilled=完了（予約確保済の予約者本人が
      貸出を完了した場合に更新。予約レコードは履歴として保持される）」と明記し、fulfilled 状態の
      予約レコードは削除されずそのまま保持される設計になっている。この履歴レコードは
      GET /api/v1/reservations（listMyReservations）や GET /api/v1/users/me/reservations
      （getMyReservations）で ReservationResponse として利用者に返却され得るが、
      openapi.yaml の該当 enum（python yaml で実測確認: ['pending', 'reserved', 'cancelled']）には
      fulfilled が含まれていないため、fulfilled レコードを返すとスキーマ違反になり、
      openapi-generator が生成する型にも fulfilled の分岐が存在しない。
      これは今回のdiff前から存在する gap だが、reservations.status を4値として初めて正式化した
      本diffで顕在化した（F-001 と同じ「隣接編集で顕在化した pre-existing gap」のパターン）。
    suggested_fix: >
      openapi.yaml の ReservationResponse.status の enum に "fulfilled" を追加し、
      rdb-schema.yaml の4値定義と一致させる。

  - id: "F-008"
    viewpoint: "一貫性"
    severity: "minor"
    target: "_changes.md（cross-cutting 再生成セクション、28行目）"
    claim: >
      _changes.md は「traceability-matrix.md / ux-ui/*.md: 変更なし（latest の内容をそのまま引き継ぎ）」
      と記載しているが、F-002 の修正により traceability-matrix.md は実際には大きく更新されており、
      この変更履歴の記述が実態と食い違ったままになっている。
    evidence: >
      round-1 の F-002 修正で traceability-matrix.md の網羅率サマリー（条件 6/6・状態遷移パス 10/10）・
      条件マトリクス（6行）・状態遷移マトリクス（10行、「予約状態 | 予約確保済 | 完了 | 書籍を貸出する」を含む）
      が更新されたことを確認した（F-002 は resolved 判定）。しかし _changes.md 28行目は F-002 の修正後も
      「traceability-matrix.md ... 変更なし」のままであり、cross-cutting 再生成セクションの記述と
      実ファイルの内容が矛盾している。レビュー担当者や後続の生成イベントがこの変更履歴を正本として
      参照すると、traceability-matrix.md が未更新だと誤認するリスクがある。
    suggested_fix: >
      _changes.md 28行目を「traceability-matrix.md: 条件マトリクス（6件）・状態遷移マトリクス（10件）・
      網羅率サマリーを REQ-007〜REQ-012 差分に合わせて更新。ux-ui/*.md: 変更なし」のように分離し、
      実態と一致させる。

