round: 1
findings:
  - id: "F-001"
    viewpoint: "一貫性 | 契約生成適性"
    severity: "major"
    target: "_cross-cutting/api/openapi.yaml (paths./api/v1/loans.post.responses, 約293-311行目) / 貸出管理業務/貸出管理フロー/書籍を貸出する/tier-backend-api.md (37-43行目のエラーレスポンス表) / 同ディレクトリ _api-summary.yaml (26-34行目の error_responses)"
    claim: >
      openapi.yaml の POST /api/v1/loans の responses には 201・401・409 のみが定義されており、
      tier-backend-api.md と _api-summary.yaml が明記する 400（book_id未指定）・404（書籍が存在しない）
      の2つのエラーレスポンスが機械可読契約（openapi.yaml）に欠落している。今回のイベントは同じ
      POST /api/v1/loans の responses ブロックに 401 レスポンスを追加する編集を行っており、
      隣接するこの400/404欠落に触れる機会があったにもかかわらず解消されていない。
    evidence: >
      latest（差分前）の openapi.yaml でも responses は 201/409 のみで同様に欠落しており
      pre-existing の問題だが、今回のdiffで responses ブロックを編集した際も未修正のまま残った。
      一方 tier-backend-api.md 37-40行目は「400 | book_id未指定」「404 | 書籍が存在しない」
      「409 | 在庫なし/予約あり」「409 | 冪等キー重複」の4行を明記し、_api-summary.yaml 26-34行目の
      error_responses も status:400/401/404/409 の4件を宣言している。tier仕様と機械可読契約
      （openapi.yaml）の間でエラーレスポンスの集合が食い違っている。
    suggested_fix: >
      openapi.yaml の POST /api/v1/loans.responses に "400"（book_id未指定、ProblemDetails参照）と
      "404"（書籍が見つからない、ProblemDetails参照）を追加し、tier-backend-api.md / _api-summary.yaml
      と一致させる。同ファイル内の他エンドポイント（例: POST /api/v1/books の 400、GET /api/v1/books/{id}
      の 404）と同じパターンで定義できる。

  - id: "F-002"
    viewpoint: "一貫性 | トレーサビリティ"
    severity: "major"
    target: "_cross-cutting/traceability-matrix.md（網羅率サマリー 5-12行目 / 条件マトリクス 56-63行目 / 状態遷移マトリクス 82-94行目）"
    claim: >
      _changes.md は traceability-matrix.md を「変更なし（latest の内容をそのまま引き継ぎ）」と
      明記しているが、この判断が誤っており、今回のUSDM/RDRA差分（REQ-007〜REQ-012）で確定した
      内容がtraceability-matrix.mdに反映されていない。網羅率100%の表示が実態と食い違っている。
    evidence: >
      (1) 条件マトリクス（56-63行目）は4条件のみを列挙しているが、docs/rdra/latest/条件.tsv は
      今回の差分で6条件（利用者認証・アクセス制御ルール、冪等リクエスト処理ルールを含む）に増えている。
      buc-spec.md の「BUC 内共有条件一覧」にもこの2条件が今回追加されている。加えて条件マトリクスの
      「貸出可否判定ルール」行は「書籍が在庫ありかつ予約がない場合に貸出可能」という旧文言のままで、
      spec.md の分岐条件一覧・buc-spec.mdが今回追加した「ただし予約者本人（予約確保済）の場合は貸出可能
      とする」の例外が反映されていない。
      (2) 状態遷移マトリクス（82-94行目、9件）は docs/rdra/latest/状態.tsv 上の
      「予約状態: 予約確保済→完了（遷移UC: 書籍を貸出する）」を含んでおらず、件数も9のまま
      （実態は10）。この遷移は spec.md 状態遷移一覧・rdb-schema.yaml reservations.status の
      fulfilled 値として今回のdiffで正式化されたもの。
      網羅率サマリー（5-12行目）は「条件 4/4=100%」「状態遷移パス 9/9=100%」「未カバー要素一覧: なし」
      と表示しており、実態（未反映2条件・未反映1状態遷移）と矛盾する。
    suggested_fix: >
      traceability-matrix.md を今回のUSDM/RDRA差分に合わせて再生成する。条件マトリクスに
      利用者認証・アクセス制御ルール／冪等リクエスト処理ルールの2行を追加し、貸出可否判定ルールの
      説明文を最新の例外条件込みに更新する。状態遷移マトリクスに「予約状態 | 予約確保済 | 完了 |
      書籍を貸出する | covered」の1行を追加し、網羅率サマリーの条件(6/6)・状態遷移パス(10/10)の
      件数を訂正する。

  - id: "F-003"
    viewpoint: "一貫性"
    severity: "minor"
    target: "貸出管理業務/貸出管理フロー/buc-spec.md（情報CRUDマトリクス 28-33行目 / 状態遷移全体図 35-42行目 / 状態遷移UCマッピング 44-50行目）"
    claim: >
      buc-spec.md の「BUC 内共有条件一覧」は今回再生成されたが（_changes.md に明記）、同じ
      buc-spec.md内の「情報 CRUD マトリクス」と「状態遷移全体図／状態遷移UCマッピング」は
      pre-diff（docs/specs/latest）と完全に同一のまま据え置かれており、本UC（書籍を貸出する）が
      今回の差分で新たに持つ「予約」情報への参照/更新、および「予約状態: 予約確保済→完了」遷移が
      反映されていない。
    evidence: >
      情報CRUDマトリクス（28-33行目）は「書籍」「貸出」の2行のみで「予約」行が存在しない。一方
      spec.md（関連RDRAモデル表）は今回「情報 | 予約 | 予約者本人による貸出可否判定のため...を参照する」
      を明記し、_model-summary.yaml は reservations に対する SELECT/UPDATE を宣言している
      （本UCの予約に対するアクセスは RU 相当）。
      状態遷移全体図（stateDiagram-v2, 37-41行目）と状態遷移UCマッピング表（44-50行目）は
      「書籍貸出状態」の3遷移のみを描画し、同じ「貸出管理フロー」BUCに属するUC「書籍を貸出する」
      がトリガーする「予約状態: 予約確保済→完了」を含んでいない。_changes.md の「予約系UCへの波及確認」
      は予約管理フローBUCの buc-spec.md を検討対象としたが、本UCが属するこの貸出管理フローBUC自身の
      buc-spec.mdについては同種の検討が行われていない。
    suggested_fix: >
      情報CRUDマトリクスに「予約 | RU | - | -」相当の行を追加する。状態遷移全体図に
      `予約確保済 --> 完了 : 書籍を貸出する` を追記し、状態遷移UCマッピング表に
      「予約状態 | 予約確保済 | 完了 | 書籍を貸出する」の行を追加する。

  - id: "F-004"
    viewpoint: "依存の宣言"
    severity: "minor"
    target: "_changes.md / _inference.md（既知課題 cross_uc_api_dependency_undeclared の扱い）"
    claim: >
      tier-frontend.md（34行目）は「書籍情報を GET /api/v1/books/:id で取得」と明記しているが、
      _api-summary.yaml の endpoints には POST /api/v1/loans のみが宣言され、このcross-UC依存
      （GET /api/v1/books/:id は本UCが所有しない）は宣言されていない。これは
      docs/usdm/events/20260729_140044_impl_feedback_19ec0182/source.txt の
      cross_uc_api_dependency_undeclared として既知・スコープ外判定済みの課題だが、
      _changes.md にも _inference.md にも、この課題を本イベントでどう扱った（見送った）かの
      記載が無い。
    evidence: >
      source.txt「ファイル: 20260729_115504_cross_uc_api_dependency_undeclared.md」は
      dist-spec自体の生成ロジック改善要望としてUSDM化を見送ったと明記している一方、
      _changes.md・_inference.mdのどちらにも「cross_uc_api_dependency_undeclared」への言及がない。
      本イベントはまさにこのUC（書籍を貸出する）のSpecを再生成しており、既知課題が今回も
      未解消のまま持ち越されたことの確認記録が残っていない。
    suggested_fix: >
      _changes.md または _inference.md に一文（例:「cross_uc_api_dependency_undeclared
      （GET /api/v1/books/:id の宣言漏れ）はdist-spec生成ロジック自体の改善要望のため本イベントの
      スコープ外とし、今回は未対応」）を追記し、既知課題として意図的に持ち越したことを明示する。

  - id: "F-005"
    viewpoint: "契約生成適性"
    severity: "minor"
    target: "_cross-cutting/api/openapi.yaml（genre/material_type enum: searchBooks 29-60行目、CreateBookRequest 835-862行目、UpdateBookRequest 898-925行目）"
    claim: >
      genre・material_type の enum + x-enum-varnames が、searchBooks クエリパラメータ・
      CreateBookRequest・UpdateBookRequest の3箇所にそれぞれインラインで重複定義されている。
      共有スキーマ（$ref）に統合されていないため、将来enumの値やx-enum-varnamesを変更する際に
      1箇所の更新漏れでドリフトするリスクがある。
    evidence: >
      3箇所とも同一の enum 値（文学/理工/児童書/社会科学/自然科学/芸術/その他、紙書籍/電子書籍）と
      同一の x-enum-varnames（LITERATURE/SCIENCE/.../PAPER/EBOOK）を持つが、
      `#/components/schemas/Genre` 等の共有コンポーネントとして定義されておらず、
      openapi-generator は SearchBooksGenreEnum / CreateBookRequestGenreEnum /
      UpdateBookRequestGenreEnum という3つの別々の型を生成することになる。
    suggested_fix: >
      `components.schemas.Genre` / `components.schemas.MaterialType` として enum +
      x-enum-varnames を1箇所に定義し、searchBooks の genre/material_type パラメータ、
      CreateBookRequest、UpdateBookRequest の該当プロパティを `$ref` で参照する形に統合する。

  - id: "F-006"
    viewpoint: "gherkin品質"
    severity: "minor"
    target: "貸出管理業務/貸出管理フロー/書籍を貸出する/spec.md（E2E完了条件 Scenario「予約確保済書籍の貸出」180行目 `And 予約が完了状態になる`）"
    claim: >
      E2Eシナリオ「予約確保済書籍の貸出」のThen句「予約が完了状態になる」は、何を観測して
      判定するのか（UI表示／API応答／DBレコード）が特定できない。本UCの画面仕様
      （tier-frontend.md 表示要素表 17-23行目）には予約状態を表示する要素が存在しないため、
      この完了状態はこのUCの画面からは確認できない。
    evidence: >
      tier-backend-api.md 側のティア完了条件（BDD）は同じ事実を
      「reservations テーブルの該当レコードの status が "fulfilled" に更新されている」という
      具体的なDB検証で表現している（102-107行目）。一方 spec.md のE2Eシナリオは
      観測手段を明示しないまま「予約が完了状態になる」とだけ記載しており、S6 uc-bdd 相当の
      実装時に「この事実をどのUI/APIから確認するか」を実装者が独自解釈する必要が生じる
      （本UCの画面には予約状態表示が無いため、予約状況画面や予約系APIという他BUC/他UCの
      成果物への依存が必要になる可能性がある）。
    suggested_fix: >
      E2Eシナリオの検証手段を明示する（例: 「マイページの予約状況画面で予約「こころ」の状態が
      『完了』と表示される」といった観測可能な文言に変更する、または、この完了状態の検証は
      tier-backend-api.mdのBDD（DB検証）に委ね、E2Eシナリオでは貸出完了メッセージの表示のみを
      検証対象とするようスコープを明確化する）。
resolved: []
