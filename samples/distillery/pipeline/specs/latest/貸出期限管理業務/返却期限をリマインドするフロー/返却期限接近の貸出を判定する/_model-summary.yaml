# _model-summary.yaml
uc: "返却期限接近の貸出を判定する"
business: "貸出期限管理業務"
buc: "返却期限をリマインドするフロー"

bounded_context_id: "BC-005"

models:
  - name: "返却期限接近貸出一覧画面"
    tier: "tier-frontend-staff"
    layer: "view"
    type: "view-model"
    rdra_info: "貸出"
  - name: "UpcomingDueListState"
    tier: "tier-frontend-staff"
    layer: "state"
    type: "state"
    rdra_info: "貸出"
  - name: "StaffUpcomingDueListResponse"
    tier: "tier-frontend-staff"
    layer: "api-client"
    type: "view-model"
    rdra_info: "貸出"
  - name: "UpcomingDueListRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "貸出"
  - name: "ListUpcomingDueLoansQuery"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "query"
    rdra_info: "貸出"
  - name: "LoanFinder"
    tier: "tier-backend-api"
    layer: "repository"
    type: "record"
    rdra_info: "貸出"
  - name: "LoanRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "貸出"
  - name: "BookRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "書籍"
  - name: "UserRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "利用者"
  - name: "UpcomingDueJudgeJobHandler"
    tier: "tier-worker"
    layer: "presentation"
    type: "request"
    rdra_info: "貸出"
  - name: "JudgeUpcomingDueLoansUsecase"
    tier: "tier-worker"
    layer: "usecase"
    type: "command"
    rdra_info: "貸出"
  - name: "貸出"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "貸出"
  - name: "リマインド通知対象判定"
    tier: "tier-worker"
    layer: "domain"
    type: "value-object"
    rdra_info: "貸出"
  - name: "RemindNotificationRequested"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "通知"

tables:
  - name: "loans"
    rdra_info: "貸出"
    operations:
      - type: "SELECT"
        columns: []
        where: "loan_status = '貸出中' AND due_date BETWEEN :base_date AND :base_date + :remind_days"
      - type: "SELECT"
        columns: []
        where: "loan_status = '貸出中' AND due_date = :base_date（通知タイミング区分＝期限当日）"
    indexes_needed:
      - columns: ["loan_status", "due_date"]
        reason: "貸出全件（最大 10 万件）の日次走査と司書一覧照会が同一条件で絞り込むため"
        access_pattern: "貸出状態と返却期限の範囲による絞り込み・並び替え"
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = loans.book_id（一覧表示のタイトル・著者取得）"
    indexes_needed: []
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_no = loans.user_no（宛先利用者と司書向け表示名の取得）"
    indexes_needed: []

kvs:
  - key_pattern: "idem:notification:loan:{notification_type}:{target_loan_id}:{timing_type}:{base_date}"
    purpose: "idem"
    value_type: "送信要求の発行済みマーカー（通知ID未確定のため要求日時のみ）"
    ttl: "7d"
    operations: ["GET", "SET"]
  - key_pattern: "lock:job:upcoming-due-judge:{base_date}"
    purpose: "lock"
    value_type: "ジョブ実行 ID と実行状態（実行中 / 完了）"
    ttl: "7d"
    operations: ["GET", "SET"]

object_storage: []
