# _model-summary.yaml
uc: "リマインドメールを送信する"
business: "貸出期限管理業務"
buc: "返却期限をリマインドするフロー"

bounded_context_id: "BC-005"
aggregate_id: "AG-005"

models:
  - name: "リマインド送信画面"
    tier: "tier-frontend-staff"
    layer: "view"
    type: "view-model"
    rdra_info: "通知"
  - name: "NotificationLogState"
    tier: "tier-frontend-staff"
    layer: "state"
    type: "state"
    rdra_info: "通知"
  - name: "NotificationLogListResponse"
    tier: "tier-frontend-staff"
    layer: "api-client"
    type: "view-model"
    rdra_info: "通知"
  - name: "NotificationLogRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "通知"
  - name: "ResendNotificationRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "通知"
  - name: "ListNotificationsQuery"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "query"
    rdra_info: "通知"
  - name: "ResendNotificationCommand"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "command"
    rdra_info: "通知"
  - name: "通知"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "通知"
  - name: "NotificationRepository"
    tier: "tier-backend-api"
    layer: "repository"
    type: "record"
    rdra_info: "通知"
  - name: "NotificationRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "通知"
  - name: "RemindNotificationConsumer"
    tier: "tier-worker"
    layer: "presentation"
    type: "request"
    rdra_info: "通知"
  - name: "SendRemindNotificationUsecase"
    tier: "tier-worker"
    layer: "usecase"
    type: "command"
    rdra_info: "通知"
  - name: "通知"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "通知"
  - name: "宛先メールアドレス"
    tier: "tier-worker"
    layer: "domain"
    type: "value-object"
    rdra_info: "利用者"
  - name: "MailSendRequest"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "通知"

tables:
  - name: "notifications"
    rdra_info: "通知"
    operations:
      - type: "INSERT"
        columns:
          - name: "notification_id"
            value: "採番した通知ID"
          - name: "notification_type"
            value: "返却期限リマインド（固定）"
          - name: "timing_type"
            value: "送信要求の通知タイミング区分（期限前リマインド / 期限当日）"
          - name: "recipient_user_no"
            value: "対象貸出の利用者番号"
          - name: "recipient_email"
            value: "送信時点の利用者の連絡先をコピー"
          - name: "target_loan_id"
            value: "対象貸出ID"
          - name: "target_reservation_id"
            value: "NULL（取置き案内でのみ設定）"
          - name: "notification_status"
            value: "送信待ち（固定）"
        where: ""
      - type: "UPDATE"
        columns:
          - name: "notification_status"
            value: "送信済み（送信成功時）/ 送信失敗（恒久エラー・再試行上限超過時）"
          - name: "send_result"
            value: "メール配信サービスの応答コードとエラー内容（メールアドレスはマスク）"
          - name: "sent_at"
            value: "送信成功時の送信日時（送信失敗時は NULL のまま）"
        where: "notification_id = :notification_id AND notification_status = '送信待ち'"
      - type: "UPDATE"
        columns:
          - name: "notification_status"
            value: "送信待ち（司書による再送受付）"
        where: "notification_id = :notification_id AND notification_status = '送信失敗'"
      - type: "SELECT"
        columns: []
        where: "notification_type = :notification_type AND (timing_type = :timing_type) AND (notification_status = :notification_status) AND requested_at の日付 = :target_date"
    indexes_needed:
      - columns: ["notification_type", "notification_status", "requested_at"]
        reason: "司書の送信実績一覧が通知種別・通知状態・送信要求日で絞り込み、状態別件数を集計するため"
        access_pattern: "通知種別 + 通知状態での絞り込みと日付降順ソート"
      - columns: ["target_loan_id", "notification_type", "timing_type"]
        reason: "同一対象への重複送信抑止の検索（arch SR-018）"
        access_pattern: "対象貸出ID + 通知種別 + 通知タイミング区分の完全一致検索"
  - name: "loans"
    rdra_info: "貸出"
    operations:
      - type: "SELECT"
        columns: []
        where: "loan_id = :target_loan_id（送信時点のリマインド通知対象条件の再判定と返却期限の取得）"
    indexes_needed: []
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_no = :recipient_user_no（宛先メールアドレスと氏名の解決）"
    indexes_needed: []
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = loans.book_id（メール本文と一覧表示の書籍タイトル）"
    indexes_needed: []

kvs:
  - key_pattern: "idem:notification:loan:{notification_type}:{target_loan_id}:{timing_type}:{base_date}"
    purpose: "idem"
    value_type: "生成済みの通知ID"
    ttl: "7d"
    operations: ["GET", "SET"]
  - key_pattern: "idem:mq:consumed:{message_id}"
    purpose: "idem"
    value_type: "消費済みマーカー（処理結果コード）"
    ttl: "24h"
    operations: ["GET", "SET"]
  - key_pattern: "idem:api:resendNotification:{idempotency_key}"
    purpose: "idem"
    value_type: "再送 API の前回レスポンス（notification_id, notification_status）"
    ttl: "24h"
    operations: ["GET", "SET"]

object_storage: []
