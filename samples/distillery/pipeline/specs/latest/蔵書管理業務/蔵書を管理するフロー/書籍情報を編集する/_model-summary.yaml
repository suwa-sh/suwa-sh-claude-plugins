uc: "書籍情報を編集する"
business: "蔵書管理業務"
buc: "蔵書を管理するフロー"

bounded_context_id: "BC-001"
aggregate_id: "AG-001"

models:
  - name: "書誌情報訂正画面(BookEditForm)"
    tier: "tier-frontend-staff"
    layer: "view"
    type: "view-model"
    rdra_info: "書籍"
  - name: "BookEditFormState"
    tier: "tier-frontend-staff"
    layer: "state"
    type: "state"
    rdra_info: "書籍"
  - name: "UpdateBookApiClient"
    tier: "tier-frontend-staff"
    layer: "api-client"
    type: "request"
    rdra_info: "書籍"
  - name: "UpdateBookRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "書籍"
  - name: "GetBookQuery"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "query"
    rdra_info: "書籍"
  - name: "UpdateBookCommand"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "command"
    rdra_info: "書籍"
  - name: "Book"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "書籍"
  - name: "MaterialType"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "書籍"
  - name: "BookRepository"
    tier: "tier-backend-api"
    layer: "repository"
    type: "entity"
    rdra_info: "書籍"
  - name: "BookRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "書籍"

tables:
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = ?（編集対象の現行値と version の取得）"
      - type: "UPDATE"
        columns:
          - name: "title"
            value: "リクエストの title"
          - name: "author"
            value: "リクエストの author"
          - name: "isbn"
            value: "リクエストの isbn（未指定は NULL）"
          - name: "publisher"
            value: "リクエストの publisher"
          - name: "genre"
            value: "リクエストの genre"
          - name: "material_type"
            value: "リクエストの material_type（『紙書籍』のみ受理、『電子書籍』は 422 で拒否）"
          - name: "updated_at"
            value: "更新時刻"
          - name: "version"
            value: "version + 1"
        where: "book_id = ? AND version = ?（楽観ロック）"
    indexes_needed:
      - columns: ["book_id"]
        reason: "1 件取得と更新の主キーアクセス"
        access_pattern: "WHERE book_id = ? AND version = ?"

kvs:
  - key_pattern: "idem:api:updateBook:{idempotency_key}"
    purpose: "idem"
    description: "冪等キー検証（書籍情報更新の二重送信防止）"
    value_type: "前回処理結果（更新後の書籍情報と200レスポンス本文）"
    ttl: "24h"
    operations: ["GET", "SET"]
object_storage: []
