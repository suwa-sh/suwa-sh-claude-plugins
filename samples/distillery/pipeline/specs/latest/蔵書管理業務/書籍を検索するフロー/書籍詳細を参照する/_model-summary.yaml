uc: 書籍詳細を参照する
business: 蔵書管理業務
buc: 書籍を検索するフロー
bounded_context_id: BC-001
models:
  - name: getBookRequest
    tier: tier-backend-api
    layer: presentation
    type: request-dto
  - name: getBookQuery
    tier: tier-backend-api
    layer: usecase
    type: query
  - name: Book
    tier: tier-backend-api
    layer: domain
    type: entity
    rdra_info: 書籍
  - name: getBookPageState
    tier: tier-frontend-user
    layer: state
    type: state
tables:
  - name: books
    rdra_info: 書籍
    operations:
      - type: SELECT
        columns:
          - name: book_id
          - name: title
          - name: author
          - name: isbn
          - name: publisher
          - name: genre_id
          - name: media_type
          - name: current_status
          - name: version
          - name: registered_at
          - name: updated_at
          - name: deleted
            value: "false"
        where: book_id = path.book_id AND deleted = false
    indexes_needed:
      - columns:
          - book_id
        reason: 対象の照会と排他取得
        access_pattern: book_id = path.book_id AND deleted = false
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-002.yaml
  - name: genres
    rdra_info: ジャンル
    operations:
      - type: SELECT
        columns:
          - name: genre_id
          - name: genre_name
        where: genre_id IN (対象書籍のgenre_id)
    indexes_needed:
      - columns:
          - genre_id
        reason: 対象の照会と排他取得
        access_pattern: genre_id = 書籍のgenre_idまたは入力genre_id
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-002.yaml
  - name: reservations
    rdra_info: 予約
    operations:
      - type: SELECT
        columns:
          - name: reservation_id
          - name: book_id
          - name: user_number
          - name: current_status
          - name: queue_position
        where: book_id = path.book_id AND current_status IN (予約中, 通知済み)。総数を集計し、本人分はuser_number = 認証主体
    indexes_needed:
      - columns:
          - book_id
        reason: 対象の照会と排他取得
        access_pattern: book_id = 対象識別子 AND 有効な貸出または予約
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-001.yaml
  - name: audit_logs
    rdra_info: ""
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-003.yaml
    operations:
      - type: INSERT
        columns:
          - name: audit_id
            value: 一意の監査ID
          - name: occurred_at
            value: 現在時刻
          - name: actor_user_number
            value: 認証主体
          - name: action_type
            value: データ参照
          - name: target_entity
            value: E-001
          - name: target_id
            value: 対象識別子。検索はoperation名
          - name: result
            value: 成功
    indexes_needed: []
kvs: []
object_storage: []
