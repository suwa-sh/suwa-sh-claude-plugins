uc: リマインド対象を抽出する
business: 期限管理業務
buc: 返却期限を通知するフロー
models:
  - name: loans
    tier: tier-worker
    layer: repository
    type: read-model
  - name: books
    tier: tier-worker
    layer: repository
    type: read-model
  - name: remind_days
    tier: tier-worker
    layer: repository
    type: read-model
  - name: notification_outbox
    tier: tier-worker
    layer: repository
    type: record
  - name: audit_logs
    tier: tier-worker
    layer: repository
    type: record
tables:
  - name: loans
    rdra_info: 貸出
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-001.yaml
    operations:
      - type: SELECT
        columns:
          - name: loan_id
          - name: book_id
          - name: user_number
          - name: due_date
          - name: returned_on
          - name: current_status
          - name: version
        where: current_status = 貸出中 AND returned_on IS NULL AND business_date <= due_date AND due_date <= business_date + 有効remind_days。loan_id昇順のkeysetで100件ずつ
        purpose: 候補抽出後、同じloan_idをlockして状態と期限を再確認
        lock: TR-TXの書籍→貸出lock
    indexes_needed:
      - columns:
          - loan_id
        reason: 識別子による照会と条件付き更新
        unique: false
        access_pattern: 識別子による照会と条件付き更新
      - columns:
          - current_status
          - due_date
          - loan_id
        reason: 期限対象の絞り込みと安定走査
        unique: false
        access_pattern: 期限対象の絞り込みと安定走査
  - name: books
    rdra_info: 書籍
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-002.yaml
    operations:
      - type: SELECT
        columns:
          - name: book_id
        where: book_id = 候補貸出.book_id
        purpose: 返却と日次処理の更新順序を直列化
        lock: TR-TXの書籍lock
    indexes_needed:
      - columns:
          - book_id
        reason: 識別子による照会と条件付き更新
        unique: false
        access_pattern: 識別子による照会と条件付き更新
  - name: remind_days
    rdra_info: リマインド日数
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-001.yaml
    operations:
      - type: SELECT
        columns:
          - name: remind_days_id
          - name: remind_days
          - name: valid_from
          - name: valid_to
        where: valid_from <= business_date AND (valid_to IS NULL OR business_date < valid_to)
        purpose: TR-PARAM。有効世代がちょうど1件であることを確認
    indexes_needed:
      - columns:
          - valid_from
          - valid_to
        reason: 有効期間の検索と重複検査
        unique: false
        access_pattern: 有効期間の検索と重複検査
  - name: notification_outbox
    rdra_info: ""
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-005.yaml
    operations:
      - type: SELECT
        columns:
          - name: notification_id
          - name: cause_key
          - name: state
          - name: actor_id
          - name: request_key
          - name: request_hash
          - name: response
        where: cause_key = リマインドと対象loan_idの結合
        purpose: 同じ契機の既存通知IDと確定要求を照合し、重複INSERTを防ぐ
        lock: TR-IDEMP/書籍lockの下で読み、cause_keyの一意制約で競合を防止
      - type: INSERT
        columns:
          - name: notification_id
            value: 通知種別と対象IDに対応する一意の通知ID
          - name: cause_key
            value: リマインドとloan_idを結合
          - name: notification_type
            value: リマインド
          - name: target_loan_id
            value: 対象loan_id
          - name: target_reservation_id
            value: "null"
          - name: state
            value: queued
          - name: payload
            value: 対応AsyncAPI messageのnotification_idとloan_idを持つJSON
          - name: created_at
            value: 要求を確定するサーバー時刻
          - name: attempts
            value: "0"
          - name: next_attempt_at
            value: "null"
          - name: lease_until
            value: "null"
          - name: provider_message_id
            value: "null"
          - name: actor_id
            value: タイマーの固定ID
          - name: request_key
            value: TR-IDEMPの安定要求キー
          - name: request_hash
            value: 正規化した要求のSHA-256
          - name: response
            value: 対象ごとに確定する日次処理ACK結果のJSON。配信後も不変
        purpose: cause_keyが未登録の場合だけ業務取引に含める。既存時はその通知IDを使用
    indexes_needed:
      - columns:
          - cause_key
        reason: 同じ通知種別と対象IDの要求を一意にする
        unique: true
        access_pattern: 同じ通知種別と対象IDの要求を一意にする
  - name: audit_logs
    rdra_info: ""
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-003.yaml
    operations:
      - type: INSERT
        columns:
          - name: audit_id
            value: 一意の監査ID
          - name: occurred_at
            value: 操作結果を確定するサーバー時刻
          - name: actor_user_number
            value: タイマーの固定ID
          - name: action_type
            value: データ更新
          - name: target_entity
            value: E-004
          - name: target_id
            value: 当該取引で処理した対象ID
          - name: result
            value: 成功
        purpose: TR-AUDIT。更新では業務取引に含め、参照では応答前に確定
    indexes_needed: []
