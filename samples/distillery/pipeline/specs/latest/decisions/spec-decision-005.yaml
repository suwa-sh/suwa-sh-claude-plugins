schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-005"
title: "状態変更APIの暫定認証契約: X-User-Id ヘッダ + userスコープ限定RBAC"
status: "approved"
generated_at: "2026-07-29T14:16:24"
context: |
  「書籍を貸出する」UC の distillery-impl 実装フィードバック（REQ-007）により、状態変更を伴うAPI
  （POST /api/v1/loans 等）の認証・アクセス制御の実装契約が仕様のどこにも定義されておらず、
  S5 verify でなりすまし・RBAC未実装がセキュリティ上の major finding として継続指摘されていたことが判明した。
  本システムには認証基盤（OAuth2/OIDCのリソースサーバー検証）を担う tier がまだ存在せず、
  正式なトークン検証の実装は本イベントのスコープ外である。一方、実装は前進させる必要があり、
  何らかの暫定契約を仕様として明文化しないまま放置すると、UCごとに独自解釈のなりすまし対応が
  積み重なるリスクがある。
decision: |
  状態変更を伴うAPIは、利用者IDを `X-User-Id` ヘッダ（UUID形式）で受け渡す暫定契約とする。
  ロールベースアクセス制御（RBAC）は、既存の `oauth2` securityScheme に定義済みの scope
  （`user` / `librarian` / `system`）をそのまま流用し、エンドポイント単位で許可スコープを
  `security` に明記する（例: POST /api/v1/loans は `user` スコープのみ許可）。
  暫定運用中は `X-User-Id` ヘッダの値をリソースサーバー側でそのまま信頼し、正式な署名検証・
  scope クレーム判定は行わない。認証ヘッダの欠落・不正時は 401（RFC 7807形式）を返す。
consequences:
  positive:
    - "frontend/backend 双方の実装が同じ契約（ヘッダ名・スコープ）を参照できるようになり、UCごとの独自解釈によるなりすまし対応の分岐を防げる"
    - "認証基盤導入後は X-User-Id ヘッダをトークン検証結果への差し替えで対応でき、API 契約（パス・スキーマ）自体は変更不要"
  negative:
    - "暫定運用中は X-User-Id ヘッダを信頼する前提のため、クライアントが任意の利用者IDを詐称できるなりすましリスクが残る（認証基盤導入までの既知の技術的負債）"
    - "RBAC は scope 単位（user/librarian/system）の粗い粒度にとどまり、リソース単位のきめ細かい認可は未対応"
alternatives_considered:
  - name: "認証基盤tierの先行設計・実装を要求する"
    reason_rejected: "本イベントのスコープ（distillery-impl 実装フィードバックの反映）を超える大きな設計変更になり、既存UCの実装済み部分への影響が大きい。段階的移行を優先した"
  - name: "Bearerトークンをそのまま必須化し、暫定的にダミー検証ロジックを許容する"
    reason_rejected: "ヘッダ名・検証方式を仕様化しないまま『ダミー検証』とだけ書くと、実装ごとに異なる解釈が生まれるリスクが X-User-Id 方式と変わらない上、正式なOAuth2フローの一部だけを先取りする中途半端な契約になり誤解を招く"
