# _api-summary.yaml
uc: "期間別貸出統計を集計する"
business: "蔵書分析業務"
buc: "貸出統計を把握するフロー"
endpoints:
  - operation_id: "createLoanStatsReport"
    method: "POST"
    path: "/api/v1/reports/loans"
    summary: "期間別貸出統計・人気書籍ランキングの集計を要求し、統計レポートを集計中で作成する"
    request_schema: "CreateLoanStatsReportRequest"
    response_schema: "ReportAcceptedResponse"
    tags: ["reports"]
async_events:
  - name: "publishReportAggregationRequested"
    channel: "report.aggregation.requested"
    direction: "publish"
    message_schema: "LoanStatsReportAggregationRequested"
    summary: "期間別貸出統計の集計を Worker ティアへ委譲する集計要求イベント"
consumes:
  - operation_id: "getLatestLoanStatsReport"
    method: "GET"
    path: "/api/v1/reports/loans/latest"
    owner_uc: "貸出統計レポートを参照する"
    contract: "_cross-cutting/api/openapi.yaml"
    tier: "tier-frontend-staff"
    purpose: "集計期間指定画面の表示要素「直近の集計状態」と「実績なしの注意喚起」に直近レポートの統計レポート状態を表示する"
    required: false
  - operation_id: "getLoanStatsReport"
    method: "GET"
    path: "/api/v1/reports/loans/{report_id}"
    owner_uc: "貸出統計レポートを参照する"
    contract: "_cross-cutting/api/openapi.yaml"
    tier: "tier-frontend-staff"
    purpose: "HTTP 202 で受け取った report_id の集計完了（集計中 → 作成済み／実績なし）を確認する"
    required: false
schemas:
  - name: "CreateLoanStatsReportRequest"
    properties:
      - name: "report_type"
        type: "string"
        required: true
      - name: "period_type"
        type: "string"
        required: true
      - name: "period_start"
        type: "string"
        required: true
      - name: "period_end"
        type: "string"
        required: true
  - name: "ReportAcceptedResponse"
    properties:
      - name: "report_id"
        type: "string"
        required: true
      - name: "report_type"
        type: "string"
        required: true
      - name: "period_type"
        type: "string"
        required: true
      - name: "period_start"
        type: "string"
        required: true
      - name: "period_end"
        type: "string"
        required: true
      - name: "report_status"
        type: "string"
        required: true
      - name: "aggregated_at"
        type: "string"
        required: true
  - name: "LoanStatsReportAggregationRequested"
    properties:
      - name: "report_id"
        type: "string"
        required: true
      - name: "report_type"
        type: "string"
        required: true
      - name: "period_type"
        type: "string"
        required: true
      - name: "period_start"
        type: "string"
        required: true
      - name: "period_end"
        type: "string"
        required: true
      - name: "trace_id"
        type: "string"
        required: true
