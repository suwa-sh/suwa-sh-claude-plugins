uc: 予約一覧を参照する
business: 貸出業務
buc: 書籍を予約するフロー
models:
  - name: books
    tier: tier-backend-api
    layer: repository
    type: read-model
  - name: reservations
    tier: tier-backend-api
    layer: repository
    type: read-model
  - name: users
    tier: tier-backend-api
    layer: repository
    type: read-model
  - name: audit_logs
    tier: tier-backend-api
    layer: repository
    type: record
tables:
  - name: books
    rdra_info: 書籍
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-002.yaml
    operations:
      - type: SELECT
        columns:
          - name: book_id
          - name: title
          - name: author
          - name: deleted
        where: book_id = path.book_id AND deleted = false
        purpose: 対象書籍の存在と表示
    indexes_needed:
      - columns:
          - book_id
        reason: 識別子による照会と条件付き更新
        unique: false
        access_pattern: 識別子による照会と条件付き更新
  - name: reservations
    rdra_info: 予約
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-001.yaml
    operations:
      - type: SELECT
        columns:
          - name: reservation_id
          - name: book_id
          - name: user_number
          - name: accepted_at
          - name: queue_position
          - name: current_status
          - name: version
          - name: updated_at
        where: book_id = path.book_id AND current_status IN (予約中, 通知済み) ORDER BY queue_position, reservation_id LIMIT page_size OFFSET (page-1)*page_size
        purpose: 同じsnapshotでtotalを集計。totalはLIMIT/OFFSETを除く同じ述語のCOUNT(*)を同じ参照snapshotで求める
    indexes_needed:
      - columns:
          - reservation_id
        reason: 識別子による照会と条件付き更新
        unique: false
        access_pattern: 識別子による照会と条件付き更新
      - columns:
          - book_id
          - current_status
          - queue_position
        reason: 書籍ごとの有効予約と先頭/後続の照会
        unique: false
        access_pattern: 書籍ごとの有効予約と先頭/後続の照会
  - name: users
    rdra_info: 利用者
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-003.yaml
    operations:
      - type: SELECT
        columns:
          - name: user_number
          - name: name
        where: user_number IN (応答予約のuser_number)
        purpose: 司書向けuser_nameの結合
    indexes_needed:
      - columns:
          - user_number
        reason: 識別子による照会と条件付き更新
        unique: false
        access_pattern: 識別子による照会と条件付き更新
  - name: audit_logs
    rdra_info: ""
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-003.yaml
    operations:
      - type: INSERT
        columns:
          - name: audit_id
            value: 一意の監査ID
          - name: occurred_at
            value: 操作結果を確定するサーバー時刻
          - name: actor_user_number
            value: 認証主体の利用者番号
          - name: action_type
            value: データ参照
          - name: target_entity
            value: E-007
          - name: target_id
            value: 要求対象ID。全体照会はoperation名
          - name: result
            value: 成功
        purpose: TR-AUDIT。更新では業務取引に含め、参照では応答前に確定
    indexes_needed: []
