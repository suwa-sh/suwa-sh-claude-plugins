uc: 予約を登録する
business: 貸出業務
buc: 書籍を予約するフロー
models:
  - name: books
    tier: tier-backend-api
    layer: repository
    type: read-model
  - name: users
    tier: tier-backend-api
    layer: repository
    type: read-model
  - name: reservations
    tier: tier-backend-api
    layer: repository
    type: record
  - name: reservations_events
    tier: tier-backend-api
    layer: repository
    type: record
  - name: audit_logs
    tier: tier-backend-api
    layer: repository
    type: record
tables:
  - name: books
    rdra_info: 書籍
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-002.yaml
    operations:
      - type: SELECT
        columns:
          - name: book_id
          - name: title
          - name: author
          - name: media_type
          - name: current_status
          - name: deleted
        where: book_id = body.book_id AND deleted = false
        purpose: 媒体と予約可否をlock後に判定
        lock: TR-TXの書籍lock
    indexes_needed:
      - columns:
          - book_id
        reason: 識別子による照会と条件付き更新
        unique: false
        access_pattern: 識別子による照会と条件付き更新
  - name: users
    rdra_info: 利用者
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-003.yaml
    operations:
      - type: SELECT
        columns:
          - name: user_number
          - name: name
          - name: deleted
        where: user_number = 認証主体 AND deleted = false
        purpose: 本人の存在、予約応答の氏名を確認
        lock: TR-IDEMPのadvisory lock後、書籍lock前にuser_number昇順のFOR UPDATE。取得後にdeleted=falseを再確認し、削除済みは404
    indexes_needed:
      - columns:
          - user_number
        reason: 識別子による照会と条件付き更新
        unique: false
        access_pattern: 識別子による照会と条件付き更新
  - name: reservations
    rdra_info: 予約
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-001.yaml
    operations:
      - type: SELECT
        columns:
          - name: reservation_id
          - name: queue_position
          - name: current_status
          - name: user_number
        where: book_id = body.book_id AND current_status IN (予約中, 通知済み) ORDER BY queue_position, reservation_id
        purpose: 次の順位を決定
        lock: TR-TXの予約lock
      - type: INSERT
        columns:
          - name: reservation_id
            value: TR-IDEMPの決定的予約ID
          - name: book_id
            value: body.book_id
          - name: user_number
            value: 認証主体の利用者番号
          - name: accepted_at
            value: 書籍lock取得後のDB時刻
          - name: queue_position
            value: 有効予約数 + 1
          - name: current_status
            value: 予約中
          - name: version
            value: "0"
          - name: updated_at
            value: accepted_atと同じ時刻
        purpose: 本人予約を作成
    indexes_needed:
      - columns:
          - reservation_id
        reason: 識別子による照会と条件付き更新
        unique: false
        access_pattern: 識別子による照会と条件付き更新
      - columns:
          - book_id
          - current_status
          - queue_position
        reason: 書籍ごとの有効予約と先頭/後続の照会
        unique: false
        access_pattern: 書籍ごとの有効予約と先頭/後続の照会
  - name: reservations_events
    rdra_info: 予約
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-001.yaml
    operations:
      - type: SELECT
        columns:
          - name: reservation_id
          - name: actor_id
          - name: request_key
          - name: request_hash
          - name: response
        where: actor_id = 認証主体 AND request_key = operationと要求キーの結合
        purpose: TR-IDEMPのadvisory lock取得後に既存結果を照合
      - type: INSERT
        columns:
          - name: event_id
            value: 一意のイベントID
          - name: reservation_id
            value: 当該reservations行の識別子
          - name: version
            value: 同じ取引で確定するsnapshotのversion
          - name: event_type
            value: createReservation
          - name: occurred_at
            value: snapshot更新と同じサーバー時刻
          - name: actor_id
            value: 認証主体の利用者番号
          - name: request_key
            value: createReservationとX-Idempotency-Keyの結合
          - name: request_hash
            value: TR-IDEMPで定義する正規化要求のSHA-256
          - name: payload
            value: 書籍、本人、受付日時、順位
          - name: response
            value: 当該操作の確定HTTP status・headers・bodyのJSON
        purpose: 対象行の変更と同じRDB取引で追記
    indexes_needed:
      - columns:
          - reservation_id
          - version
        reason: 対象の版を一意に記録
        unique: true
        access_pattern: 対象の版を一意に記録
  - name: audit_logs
    rdra_info: ""
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-003.yaml
    operations:
      - type: INSERT
        columns:
          - name: audit_id
            value: 一意の監査ID
          - name: occurred_at
            value: 操作結果を確定するサーバー時刻
          - name: actor_user_number
            value: 認証主体の利用者番号
          - name: action_type
            value: データ更新
          - name: target_entity
            value: E-007
          - name: target_id
            value: 当該取引で処理した対象ID
          - name: result
            value: 成功
        purpose: TR-AUDIT。更新では業務取引に含め、参照では応答前に確定
    indexes_needed: []
