uc: 予約を取り消す
business: 貸出業務
buc: 書籍を予約するフロー
models:
  - name: reservations
    tier: tier-backend-api
    layer: repository
    type: record
  - name: books
    tier: tier-backend-api
    layer: repository
    type: record
  - name: users
    tier: tier-backend-api
    layer: repository
    type: read-model
  - name: notification_outbox
    tier: tier-backend-api
    layer: repository
    type: record
  - name: reservations_events
    tier: tier-backend-api
    layer: repository
    type: record
  - name: books_events
    tier: tier-backend-api
    layer: repository
    type: record
  - name: audit_logs
    tier: tier-backend-api
    layer: repository
    type: record
tables:
  - name: reservations
    rdra_info: 予約
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-001.yaml
    operations:
      - type: SELECT
        columns:
          - name: reservation_id
          - name: book_id
          - name: user_number
          - name: accepted_at
          - name: queue_position
          - name: current_status
          - name: version
          - name: updated_at
        where: reservation_id = path.reservation_id AND user_number = 認証主体。対象確定後は同じbook_idの有効予約を順位順に取得
        purpose: 本人予約と後続順位を取得
        lock: TR-TXの書籍→予約lock
      - type: UPDATE
        columns:
          - name: current_status
            value: 取消
          - name: queue_position
            value: "null"
          - name: version
            value: version + 1
          - name: updated_at
            value: 取消確定時刻
        where: reservation_id = path.reservation_id AND user_number = 認証主体 AND version = body.version AND current_status IN (予約中, 通知済み)
        purpose: 既に取消は変更なし200、終了は422
      - type: UPDATE
        columns:
          - name: queue_position
            value: 元のqueue_position - 1
          - name: version
            value: version + 1
          - name: updated_at
            value: 取消確定時刻
        where: book_id = 対象予約.book_id AND current_status IN (予約中, 通知済み) AND 元順位 > 取消予約の元順位
        purpose: 後続を繰上げ
    indexes_needed:
      - columns:
          - reservation_id
        reason: 識別子による照会と条件付き更新
        unique: false
        access_pattern: 識別子による照会と条件付き更新
      - columns:
          - book_id
          - current_status
          - queue_position
        reason: 書籍ごとの有効予約と先頭/後続の照会
        unique: false
        access_pattern: 書籍ごとの有効予約と先頭/後続の照会
  - name: books
    rdra_info: 書籍
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-002.yaml
    operations:
      - type: SELECT
        columns:
          - name: book_id
          - name: title
          - name: author
          - name: current_status
          - name: version
          - name: deleted
        where: book_id = 対象予約.book_id
        purpose: 最後の有効予約取消時に書籍を更新
        lock: TR-TXの書籍lock
      - type: UPDATE
        columns:
          - name: current_status
            value: 在庫あり
          - name: version
            value: version + 1
          - name: updated_at
            value: 取消確定時刻
        where: book_id = 対象予約.book_id AND current_status = 予約待ち AND 取消後有効予約数 = 0 AND version = lock後のversion
        purpose: 最後の予約取消時だけ書籍を変更
    indexes_needed:
      - columns:
          - book_id
        reason: 識別子による照会と条件付き更新
        unique: false
        access_pattern: 識別子による照会と条件付き更新
  - name: users
    rdra_info: 利用者
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-003.yaml
    operations:
      - type: SELECT
        columns:
          - name: user_number
          - name: name
        where: user_number = 認証主体
        purpose: 取消応答のuser_name
    indexes_needed:
      - columns:
          - user_number
        reason: 識別子による照会と条件付き更新
        unique: false
        access_pattern: 識別子による照会と条件付き更新
  - name: notification_outbox
    rdra_info: ""
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-005.yaml
    operations:
      - type: SELECT
        columns:
          - name: notification_id
          - name: cause_key
          - name: state
          - name: actor_id
          - name: request_key
          - name: request_hash
          - name: response
        where: cause_key = 返却通知と新しい先頭reservation_id
        purpose: 同じ契機の既存通知IDと確定要求を照合し、重複INSERTを防ぐ
        lock: TR-IDEMP/書籍lockの下で読み、cause_keyの一意制約で競合を防止
      - type: INSERT
        columns:
          - name: notification_id
            value: 通知種別と対象IDに対応する一意の通知ID
          - name: cause_key
            value: 返却通知とreservation_idを結合
          - name: notification_type
            value: 返却通知
          - name: target_loan_id
            value: "null"
          - name: target_reservation_id
            value: 対象reservation_id
          - name: state
            value: queued
          - name: payload
            value: 対応AsyncAPI messageのnotification_idとreservation_idを持つJSON
          - name: created_at
            value: 要求を確定するサーバー時刻
          - name: attempts
            value: "0"
          - name: next_attempt_at
            value: "null"
          - name: lease_until
            value: "null"
          - name: provider_message_id
            value: "null"
          - name: actor_id
            value: 認証主体の利用者番号
          - name: request_key
            value: TR-IDEMPの安定要求キー
          - name: request_hash
            value: 正規化した要求のSHA-256
          - name: response
            value: 要求確定時のHTTP status・headers・bodyのJSON。配信後も不変
        purpose: 書籍が予約待ちで先頭が交代し、後続が残る場合だけ通知要求を作成
    indexes_needed:
      - columns:
          - cause_key
        reason: 同じ通知種別と対象IDの要求を一意にする
        unique: true
        access_pattern: 同じ通知種別と対象IDの要求を一意にする
  - name: reservations_events
    rdra_info: 予約
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-001.yaml
    operations:
      - type: SELECT
        columns:
          - name: reservation_id
          - name: actor_id
          - name: request_key
          - name: request_hash
          - name: response
        where: actor_id = 認証主体 AND request_key = operationと要求キーの結合
        purpose: TR-IDEMPのadvisory lock取得後に既存結果を照合
      - type: INSERT
        columns:
          - name: event_id
            value: 一意のイベントID
          - name: reservation_id
            value: 当該reservations行の識別子
          - name: version
            value: 同じ取引で確定するsnapshotのversion
          - name: event_type
            value: cancelReservation
          - name: occurred_at
            value: snapshot更新と同じサーバー時刻
          - name: actor_id
            value: 認証主体の利用者番号
          - name: request_key
            value: cancelReservationとX-Idempotency-Keyの結合
          - name: request_hash
            value: TR-IDEMPで定義する正規化要求のSHA-256
          - name: payload
            value: 取消対象の状態/取消時刻または後続の更新順位
          - name: response
            value: 当該操作の確定HTTP status・headers・bodyのJSON
        purpose: 実際に変更した各予約へ追記
    indexes_needed:
      - columns:
          - reservation_id
          - version
        reason: 対象の版を一意に記録
        unique: true
        access_pattern: 対象の版を一意に記録
  - name: books_events
    rdra_info: 書籍
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-002.yaml
    operations:
      - type: INSERT
        columns:
          - name: event_id
            value: 一意のイベントID
          - name: book_id
            value: 当該books行の識別子
          - name: version
            value: 同じ取引で確定するsnapshotのversion
          - name: event_type
            value: cancelReservation
          - name: occurred_at
            value: snapshot更新と同じサーバー時刻
          - name: actor_id
            value: 認証主体の利用者番号
          - name: request_key
            value: cancelReservationとX-Idempotency-Keyの結合
          - name: request_hash
            value: TR-IDEMPで定義する正規化要求のSHA-256
          - name: payload
            value: 在庫ありへの変更
          - name: response
            value: 当該操作の確定HTTP status・headers・bodyのJSON
        purpose: 書籍状態が変わるときだけ追記
    indexes_needed:
      - columns:
          - book_id
          - version
        reason: 対象の版を一意に記録
        unique: true
        access_pattern: 対象の版を一意に記録
  - name: audit_logs
    rdra_info: ""
    schema_ref: ../../../_cross-cutting/datastore/domains/SD-003.yaml
    operations:
      - type: INSERT
        columns:
          - name: audit_id
            value: 一意の監査ID
          - name: occurred_at
            value: 操作結果を確定するサーバー時刻
          - name: actor_user_number
            value: 認証主体の利用者番号
          - name: action_type
            value: データ更新
          - name: target_entity
            value: E-007
          - name: target_id
            value: 当該取引で処理した対象ID
          - name: result
            value: 成功
        purpose: TR-AUDIT。更新では業務取引に含め、参照では応答前に確定
    indexes_needed: []
