get:
  operationId: getPopularBooks
  summary: 人気書籍ランキングを参照する
  tags:
    - 運営分析業務
  parameters:
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: period_type
      in: query
      required: true
      schema:
        type: string
        enum:
          - 日
          - 月
          - 年
    - name: period_start
      in: query
      required: true
      schema:
        type: string
        format: date
    - name: period_end
      in: query
      required: true
      schema:
        type: string
        format: date
  responses:
    "200":
      description: 処理結果
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - items
              - page
              - page_size
              - total
            properties:
              items:
                type: array
                items:
                  $ref: ../components/schemas/LoanStatistic.yaml
              page:
                type: integer
              page_size:
                type: integer
              total:
                type: integer
    "400":
      description: 入力形式不正
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "401":
      description: 認証が必要
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "403":
      description: 権限または接続経路違反
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "404":
      description: 対象なし
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "409":
      description: 競合または冪等キー不一致
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "422":
      description: 業務条件不成立
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "503":
      description: 設定または依存先を利用不可
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
  x-allowed-roles:
    - 司書
  x-network: 館内
  x-authorization-rule: ロールと経路を検証する。
