get:
  operationId: searchBooks
  summary: 書籍を検索する
  tags:
    - 蔵書管理業務
  parameters:
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: kind
      in: query
      required: true
      schema:
        type: string
        enum:
          - キーワード
          - タイトル
          - 著者
          - ISBN
          - ジャンル
    - name: query
      in: query
      required: false
      schema: &a1
        type: string
        minLength: 1
        maxLength: 255
      description: 省略時は検索語による制限なし。ジャンル・状態だけ、または全条件なしで照会できる。
    - name: genre_ids
      in: query
      style: form
      explode: true
      schema:
        type: array
        items: *a1
    - name: states
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - 在庫あり
            - 貸出中
            - 予約待ち
  responses:
    "200":
      description: 処理結果
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - items
              - page
              - page_size
              - total
            properties:
              items:
                type: array
                items:
                  $ref: ../components/schemas/Book.yaml
              page:
                type: integer
              page_size:
                type: integer
              total:
                type: integer
    "400":
      description: 入力形式不正
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "401":
      description: 認証が必要
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "403":
      description: 権限または接続経路違反
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "404":
      description: 対象なし
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "409":
      description: 競合または冪等キー不一致
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "422":
      description: 業務条件不成立
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    "503":
      description: 設定または依存先を利用不可
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
  x-allowed-roles:
    - 司書
    - 利用者
  x-network: 公開
  x-authorization-rule: ロールと経路を検証する。
