type: object
additionalProperties: false
required:
  - title
  - author
  - isbn
  - publisher
  - genre_id
  - media_type
properties:
  title:
    type: string
    minLength: 1
    maxLength: 255
  author:
    type: string
    minLength: 1
    maxLength: 255
  isbn:
    anyOf:
      - type: string
        pattern: ^(?:[0-9]{9}[0-9X]|[0-9]{13})$
      - type: "null"
  publisher:
    anyOf:
      - type: string
        minLength: 1
        maxLength: 255
      - type: "null"
  genre_id:
    type: string
    minLength: 1
    maxLength: 255
  media_type:
    type: string
    enum:
      - 紙
      - 電子
