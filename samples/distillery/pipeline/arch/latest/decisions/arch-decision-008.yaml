schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "architecture"
artifact_id: "arch-decision-008"
title: "コンテキストマップ統合方式: 自前 BC 間は Customer-Supplier、統計は Conformist、外部システムは ACL"
status: "approved"
generated_at: "2026-06-25T07:51:57"
context: |
  6 BC 間および外部システム（メール送信サービス）との統合パターンを決定する必要がある。
  自前 BC 間の対等関係、読取専用集約、外部システムとの隔離の 3 種類の関係性が混在する。
decision: |
  以下のパターンを採用する:
  - 自前 BC 間（CM-001〜CM-004, CM-006, CM-007）: Customer-Supplier
    - 下流（貸出/予約/通知）が上流（蔵書/利用者）に SLA を要求する協調関係
  - 統計 → 貸出（CM-005）: Conformist
    - 統計は貸出データの読取専用集約。影響力ゼロかつモデル受容可
  - 通知 BC → メール送信サービス: ACL（context_map には記載せず、tier-external の SP-010 アダプタで対応）
    - 外部システムの汚いモデルを内部に持ち込まない

  統合イベント（integration_events）は戦略段階では空配列 [] とし、具体的なイベント名は後続の dist-spec で UC 解析時に確定する。
consequences:
  positive:
    - "Customer-Supplier の協調関係により、Core BC（貸出）が周辺 BC の変更影響を受けにくい"
    - "Conformist による統計 BC は実装コスト最小"
    - "ACL により外部システム変更時の影響範囲を最小化（tier-external + SP-010 で隔離）"
  negative:
    - "Customer-Supplier は SLA 協議のオーバーヘッドが発生する。1 チーム運用ならコミュニケーションコストで吸収可"
    - "integration_events を後続スキルに委ねるため、戦略段階では BC 間連携の具体的シナリオが見えない"
alternatives_considered:
  - name: "全 BC 関係を Shared Kernel にする"
    reason_rejected: "Shared Kernel は両 BC の共同所有が必要で運用コストが高い。小規模システムでも避けるべき"
  - name: "通知を Conformist（メール送信サービスのモデルを受容）"
    reason_rejected: "外部 SaaS の API モデル変更で通知 BC の内部設計が影響を受けるリスクが高い。ACL で隔離する方が安全"
