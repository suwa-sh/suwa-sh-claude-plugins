              reason: "3 状態モデルが同期波及し、不整合は窓口混乱と復旧作業の負担に直結する。1 館規模で同時更新競合は小さい"
              source_model: "状態: 書籍の状態, 貸出の状態, 予約の状態, 条件: 返却後の書籍状態判定 / 予約順位決定, NFR A.4.1.1, NFR C.3.3.1"
