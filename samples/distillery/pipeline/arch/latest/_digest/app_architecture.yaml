              description: "返却通知の送信要求は usecase が通知レコード（送信待ち）を同一トランザクションで作成し、コミット後に gateway 経由で MQ へ発行する。外部メール配信サービスの結果は待たず、送信結果の反映はワーカーの責務とする"
