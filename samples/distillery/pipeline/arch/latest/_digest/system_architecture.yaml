    - id: "tier-idp"
      name: "IdP（アイデンティティプロバイダー）"
      description: "司書・利用者の認証、トークン発行、パスワードポリシー適用、アカウントロック、パスワードリセットを担う独立ティア。API Gateway はこのティアが発行したトークンを検証する"
