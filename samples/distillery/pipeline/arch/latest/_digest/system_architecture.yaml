    - id: "tier-backend-api"
      name: "バックエンド API"
      description: "6 つの境界づけられたコンテキスト（蔵書・利用者・貸出・予約・通知・蔵書分析）をモジュールとして内包するモジュラモノリスの API ティア。窓口業務と Web 照会の全 UC を処理する"
