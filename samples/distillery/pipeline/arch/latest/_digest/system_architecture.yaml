          reason: "WAF・アクセス制御・利用制限・全通信暗号化の要求を 1 箇所で満たすため"
          source_model: "NFR E.10.1.1, NFR E.5.2.1, NFR E.5.3.1, NFR E.6.1.2"
          confidence: "high"
        - id: "SP-009"
