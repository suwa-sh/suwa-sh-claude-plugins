          reason: "BC は 6 個あるがアクター 2 種・同時アクセス 100 以下・1 館運用の規模であり、マイクロサービス分割の運用コストが見合わない。一方でコンテキスト分割されたモジュラ構成が拡張性要件として明示されている"
