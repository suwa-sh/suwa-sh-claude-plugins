          reason: "利用制限とネットワーク分離の要求により、司書向け管理機能と利用者向け照会の露出面を分ける必要があるため"
          source_model: "NFR E.5.3.1, NFR E.8.3.1, アクター: 司書（社内）/ 利用者（社外）"
