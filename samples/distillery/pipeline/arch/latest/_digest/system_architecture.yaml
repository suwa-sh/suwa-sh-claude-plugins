          confidence: "high"
    - id: "tier-api-gateway"
      name: "API Gateway"
      description: "2 ポータルからのリクエストを受け、TLS 終端・WAF・IP 制限・トークン検証・粗粒度 RBAC・レート制限を集約する境界ティア（Gatekeeper / Gateway Offloading パターン）"
