# digest of arch/latest/arch-design.yaml section data_architecture (L1856-2404); source_sha256: 46834e61c919f9cd983aae0b6e149c7cc5b7ac1e448018bbd37c400fb295a321
# 派生物。正本は arch-design.yaml。編集しない
data_architecture:
  entities:
    - id: "E-001"
      name: "書籍"
      source_info: "情報: 書籍"
      model_type: "event_snapshot"
      attributes:
        - name: "book_id"
          type: "string"
          description: "書籍ID。蔵書1冊を一意に識別する"
          nullable: false
          primary_key: true
        - name: "title"
          type: "string"
          description: "タイトル"
          nullable: false
          primary_key: false
        - name: "author"
          type: "string"
          description: "著者"
          nullable: false
          primary_key: false
        - name: "isbn"
          type: "string"
          description: "ISBN。移行時のクレンジング対象（NFR D.4.1.3）"
          nullable: true
          primary_key: false
        - name: "publisher"
          type: "string"
          description: "出版社"
          nullable: false
          primary_key: false
        - name: "genre"
          type: "string"
          description: "ジャンル（バリエーション: 文学/人文/社会科学/自然科学/技術/芸術/児童/その他）"
          nullable: false
          primary_key: false
        - name: "material_type"
          type: "string"
          description: "資料種別（バリエーション: 紙書籍/電子書籍。初期リリースは紙書籍のみ有効）"
          nullable: false
          primary_key: false
        - name: "book_status"
          type: "string"
          description: "書籍状態（在庫あり/貸出中/予約待ち）。スナップショットが保持するキャッシュ的ステータス"
          nullable: false
          primary_key: false
        - name: "registered_at"
          type: "datetime"
          description: "登録日時。登録イベントの occurred_at をスナップショットへ射影した値"
          nullable: false
          primary_key: false
        - name: "updated_at"
          type: "datetime"
          description: "最終更新日時。最新イベントの occurred_at を射影する"
          nullable: false
          primary_key: false
      relationships: []
    - id: "E-002"
      name: "利用者"
      source_info: "情報: 利用者"
      model_type: "event_snapshot"
      attributes:
        - name: "user_no"
          type: "string"
          description: "利用者番号。利用者を一意に識別する"
          nullable: false
          primary_key: true
        - name: "name"
          type: "string"
          description: "氏名。個人情報のため保管時暗号化の対象（NFR E.6.1.1）"
          nullable: false
          primary_key: false
        - name: "email"
          type: "string"
          description: "連絡先（メールアドレス）。通知メールの宛先。保管時暗号化の対象（NFR E.6.1.1）"
          nullable: false
          primary_key: false
        - name: "user_category"
          type: "string"
          description: "利用者区分（バリエーション: 一般/学生/団体）。貸出期間の適用単位"
          nullable: false
          primary_key: false
        - name: "user_status"
          type: "string"
          description: "利用者状態（登録済み/取引進行中）。スナップショットが保持するキャッシュ的ステータス"
          nullable: false
          primary_key: false
        - name: "registered_at"
          type: "datetime"
          description: "登録日時。登録イベントの occurred_at を射影した値"
          nullable: false
          primary_key: false
        - name: "updated_at"
          type: "datetime"
          description: "最終更新日時。最新イベントの occurred_at を射影する"
          nullable: false
          primary_key: false
      relationships: []
    - id: "E-003"
      name: "利用者アカウント"
      source_info: "情報: 利用者アカウント"
      model_type: "resource_mutable"
      attributes:
        - name: "account_id"
          type: "string"
          description: "アカウントID"
          nullable: false
          primary_key: true
        - name: "user_no"
          type: "string"
          description: "利用者番号。利用者（E-002）への参照"
          nullable: false
          primary_key: false
        - name: "login_id"
          type: "string"
          description: "ログインID。認証情報の正データは IdP ティアが保持し、本エンティティは業務側の対応関係のみ保持する"
          nullable: false
          primary_key: false
        - name: "role"
          type: "string"
          description: "役割（司書/利用者）。RBAC のロール（NFR E.5.2.1）"
          nullable: false
          primary_key: false
        - name: "is_active"
          type: "boolean"
          description: "有効フラグ。ログイン失敗連続検知によるアカウントロックで false になる（NFR E.7.2.1）"
          nullable: false
          primary_key: false
      relationships:
        - target_entity: "E-002"
          type: "N:1"
          description: "利用者アカウントは1人の利用者に紐づく（実質 1:1。司書アカウントも利用者番号で識別する）"
    - id: "E-004"
      name: "貸出"
      source_info: "情報: 貸出"
      model_type: "event_snapshot"
      attributes:
        - name: "loan_id"
          type: "string"
          description: "貸出ID"
          nullable: false
          primary_key: true
        - name: "book_id"
          type: "string"
          description: "貸出対象の書籍ID"
          nullable: false
          primary_key: false
        - name: "user_no"
          type: "string"
          description: "貸出先の利用者番号"
          nullable: false
          primary_key: false
        - name: "loan_date"
          type: "date"
          description: "貸出日。貸出登録イベントの occurred_at を日付へ射影した値"
          nullable: false
          primary_key: false
        - name: "loan_period_type"
          type: "string"
          description: "貸出期間区分（バリエーション: 標準/短期/長期）。返却期限の算出単位"
          nullable: false
          primary_key: false
        - name: "due_date"
          type: "date"
          description: "返却期限。貸出日＋利用者区分に対応する貸出期間日数で自動設定する（条件: 返却期限設定条件）"
          nullable: false
          primary_key: false
        - name: "loan_status"
          type: "string"
          description: "貸出状態（貸出中/延滞/返却済み）。スナップショットが保持するキャッシュ的ステータス"
          nullable: false
          primary_key: false
      relationships:
        - target_entity: "E-001"
          type: "N:1"
          description: "1冊の書籍は時系列で複数の貸出を持つ（同時に有効な貸出は1件）"
        - target_entity: "E-002"
          type: "N:1"
          description: "1人の利用者は複数の貸出を持つ"
    - id: "E-005"
      name: "予約"
      source_info: "情報: 予約"
      model_type: "event_snapshot"
      attributes:
        - name: "reservation_id"
          type: "string"
          description: "予約ID"
          nullable: false
          primary_key: true
        - name: "book_id"
          type: "string"
          description: "予約対象の書籍ID"
          nullable: false
          primary_key: false
        - name: "user_no"
          type: "string"
          description: "予約申込者の利用者番号"
          nullable: false
          primary_key: false
        - name: "applied_at"
          type: "datetime"
          description: "予約申込日時。予約順位の昇順ソートキー（条件: 予約順位決定条件）"
          nullable: false
          primary_key: false
        - name: "priority"
          type: "integer"
          description: "予約順位。貸出済み・キャンセルを除外して繰り上げ再計算する"
          nullable: false
          primary_key: false
        - name: "reservation_status"
          type: "string"
          description: "予約状態（予約中/取置き中/貸出済み/キャンセル）。スナップショットが保持するキャッシュ的ステータス"
          nullable: false
          primary_key: false
        - name: "hold_expires_at"
          type: "datetime"
          description: "取置き期限。取置き期限切れの日次判定でインデックス検索するためスナップショットに保持する（イミュータブル原則の明示的例外。取置き開始日時は取置き遷移イベントの occurred_at で管理する）"
          nullable: true
          primary_key: false
      relationships:
        - target_entity: "E-001"
          type: "N:1"
          description: "1冊の書籍は複数の予約（予約待ち行列）を持つ"
        - target_entity: "E-002"
          type: "N:1"
          description: "1人の利用者は複数の予約を持つ"
    - id: "E-006"
      name: "通知"
      source_info: "情報: 通知"
      model_type: "event_snapshot"
      attributes:
        - name: "notification_id"
          type: "string"
          description: "通知ID"
          nullable: false
          primary_key: true
        - name: "notification_type"
          type: "string"
          description: "通知種別（バリエーション: 取置き案内/返却期限リマインド/延滞督促）"
          nullable: false
          primary_key: false
        - name: "timing_type"
          type: "string"
          description: "通知タイミング区分（バリエーション: 期限前リマインド/期限当日/期限超過督促）"
          nullable: false
          primary_key: false
        - name: "recipient_user_no"
          type: "string"
          description: "宛先利用者番号"
          nullable: false
          primary_key: false
        - name: "recipient_email"
          type: "string"
          description: "宛先メールアドレス。送信時点の値をコピーして保持する（利用者側の変更に追随させない）。保管時暗号化の対象（NFR E.6.1.1）"
          nullable: false
          primary_key: false
        - name: "target_loan_id"
          type: "string"
          description: "対象貸出ID。リマインド・督促のときに設定する"
          nullable: true
          primary_key: false
        - name: "target_reservation_id"
          type: "string"
          description: "対象予約ID。取置き案内のときに設定する"
          nullable: true
          primary_key: false
        - name: "send_result"
          type: "text"
          description: "送信結果。メール配信サービスの応答コード・エラー内容を記録し未達追跡に使う"
          nullable: true
          primary_key: false
        - name: "notification_status"
          type: "string"
          description: "通知状態（送信待ち/送信済み/送信失敗）。スナップショットが保持するキャッシュ的ステータス。送信日時は送信イベントの occurred_at で管理する"
          nullable: false
          primary_key: false
      relationships:
        - target_entity: "E-002"
          type: "N:1"
          description: "1人の利用者は複数の通知を受け取る"
        - target_entity: "E-004"
          type: "N:1"
          description: "1件の貸出に対しリマインド・督促の通知が複数回発生する"
        - target_entity: "E-005"
          type: "N:1"
          description: "1件の予約に対し取置き案内の通知が発生する"
    - id: "E-007"
      name: "統計レポート"
      source_info: "情報: 統計レポート"
      model_type: "event_snapshot"
      attributes:
        - name: "report_id"
          type: "string"
          description: "レポートID"
          nullable: false
          primary_key: true
        - name: "report_type"
          type: "string"
          description: "レポート種別（バリエーション: 在庫状況/人気書籍ランキング/期間別貸出統計）"
          nullable: false
          primary_key: false
        - name: "period_type"
          type: "string"
          description: "集計期間区分（バリエーション: 日次/月次/年次）"
          nullable: false
          primary_key: false
        - name: "period_start"
          type: "date"
          description: "集計開始日"
          nullable: false
          primary_key: false
        - name: "period_end"
          type: "date"
          description: "集計終了日"
          nullable: false
          primary_key: false
        - name: "aggregated_at"
          type: "datetime"
          description: "集計日時。集計開始イベントの occurred_at を射影した値"
          nullable: false
          primary_key: false
        - name: "detail"
          type: "text"
          description: "集計明細。書籍状態別件数・書籍別貸出回数・書籍一覧を構造化テキスト（JSON）で保持する導出データ"
          nullable: false
          primary_key: false
        - name: "report_status"
          type: "string"
          description: "統計レポート状態（集計中/作成済み/実績なし）。スナップショットが保持するキャッシュ的ステータス"
          nullable: false
          primary_key: false
      relationships:
        - target_entity: "E-001"
          type: "N:M"
          description: "集計明細は書籍を集計軸として参照する（読み取り専用の導出関係。外部キー制約は張らない）"
        - target_entity: "E-004"
          type: "N:M"
          description: "集計明細は期間内の貸出実績を集計する（読み取り専用の導出関係）"
    - id: "E-901"
      name: "セッション情報"
      source_info: "情報: なし（派生エンティティ。外部アクター + OAuth2/OIDC 認証から生成）"
      model_type: "resource_mutable"
      attributes:
        - name: "session_id"
          type: "string"
          description: "セッションID"
          nullable: false
          primary_key: true
        - name: "account_id"
          type: "string"
          description: "利用者アカウントID"
          nullable: false
          primary_key: false
        - name: "user_no"
          type: "string"
          description: "利用者番号。本人限定参照（条件: 個人情報参照可否条件）の判定に使う"
          nullable: false
          primary_key: false
        - name: "role"
          type: "string"
          description: "役割（司書/利用者）。RBAC の粗粒度判定に使う（NFR E.5.2.1）"
          nullable: false
          primary_key: false
        - name: "access_token"
          type: "string"
          description: "アクセストークン。IdP が発行する"
          nullable: false
          primary_key: false
        - name: "refresh_token"
          type: "string"
          description: "リフレッシュトークン"
          nullable: true
          primary_key: false
        - name: "expires_at"
          type: "datetime"
          description: "有効期限。TTL による自動失効の基準"
          nullable: false
          primary_key: false
      relationships:
        - target_entity: "E-003"
          type: "N:1"
          description: "1つの利用者アカウントは複数の同時セッションを持ちうる"
    - id: "E-902"
      name: "通知送信冪等キー"
      source_info: "情報: なし（派生エンティティ。条件「取置き通知対象条件」の重複送信抑止と MQ の at-least-once 配信から生成）"
      model_type: "resource_mutable"
      attributes:
        - name: "idempotency_key"
          type: "string"
          description: "冪等キー。通知種別＋対象貸出ID/対象予約ID＋通知タイミング区分から決定的に生成する"
          nullable: false
          primary_key: true
        - name: "notification_id"
          type: "string"
          description: "生成済みの通知ID"
          nullable: false
          primary_key: false
        - name: "requested_at"
          type: "datetime"
          description: "送信要求日時"
          nullable: false
          primary_key: false
        - name: "expires_at"
          type: "datetime"
          description: "キー保持期限。TTL で自動失効させる"
          nullable: false
          primary_key: false
      relationships:
        - target_entity: "E-006"
          type: "N:1"
          description: "冪等キーは1件の通知に対応する（実質 1:1）"
  storage_mapping:
    - entity_id: "E-001"
      storage_type: "rdb"
      reason: "状態モデル「書籍状態」を持ち、貸出・予約と在庫整合をとるトランザクションが必要。書籍検索は検索条件種別5種（キーワード/タイトル/著者/ISBN/ジャンル）に限られ、蔵書数万件・総容量100GB未満（NFR B.1.1.2 Lv1）のため RDB の全文索引でレスポンスタイム5秒以内（NFR B.2.1.1 Lv3）を満たせる"
      confidence: "high"
    - entity_id: "E-001"
      storage_type: "cache"
      reason: "利用者ポータルの書籍検索・書籍詳細照会が参照系の主要負荷であり、レスポンスタイム5秒以内（NFR B.2.1.1 Lv3）とピーク時2倍（NFR B.1.2.1 Lv2）の吸収に Cache-Aside を適用する。書籍状態は貸出・返却で変わるため、状態遷移イベントでキャッシュを無効化する（短 TTL 併用）"
      confidence: "high"
    - entity_id: "E-002"
      storage_type: "rdb"
      reason: "状態モデル「利用者状態」を持ち、貸出・予約との整合が必要。氏名・連絡先は個人情報のため保管時暗号化（NFR E.6.1.1 Lv1）を適用し、DB 層は内部セグメントに配置して外部から直接到達不可とする（NFR E.8.3.1 Lv2）"
      confidence: "high"
    - entity_id: "E-003"
      storage_type: "rdb"
      reason: "役割（司書/利用者）による RBAC 判定（NFR E.5.2.1 Lv2）と有効フラグによるアカウントロック（NFR E.7.2.1）で参照される業務データ。認証クレデンシャル自体は IdP ティアが保持するため本表の対象外"
      confidence: "high"
    - entity_id: "E-004"
      storage_type: "rdb"
      reason: "書籍状態・利用者状態と同一トランザクションで整合させる必要がある取引データ。RPO 数時間前まで（NFR A.4.1.1 Lv2）を満たすため RDB のポイントインタイムリカバリを前提とする"
      confidence: "high"
    - entity_id: "E-005"
      storage_type: "rdb"
      reason: "予約順位の一意性・重複予約禁止（条件: 重複予約禁止条件）を一意制約と行ロックで担保する必要があり、強整合が前提"
      confidence: "high"
    - entity_id: "E-006"
      storage_type: "rdb"
      reason: "通知状態の遷移と送信実績（未達追跡）を監査ログ相当の記録として保持する（NFR E.7.1.1 Lv2）。宛先メールアドレスは個人情報のため保管時暗号化の対象（NFR E.6.1.1 Lv1）"
      confidence: "high"
    - entity_id: "E-007"
      storage_type: "rdb"
      reason: "集計結果を Materialized View として RDB に永続化し、レポート参照のターンアラウンド10秒以内（NFR B.2.1.3 Lv2）を満たす。データ量100万件/年（NFR B.1.1.2 Lv1）の範囲では専用の分析ストアを設ける必要がない"
      confidence: "high"
    - entity_id: "E-901"
      storage_type: "cache"
      reason: "外部アクター（利用者）＋ID/パスワード認証（NFR E.5.1.1 Lv2）のセッション保持。TTL による自動失効とバックエンド API のスケールアウト（NFR B.3.1.1 Lv2）に伴うステートレス化のため KVS に置く"
      confidence: "high"
    - entity_id: "E-902"
      storage_type: "cache"
      reason: "MQ の at-least-once 配信に対する重複送信抑止（条件: 取置き通知対象条件）。短命かつ TTL 管理が前提で、業務データの整合対象ではないため KVS に置く"
      confidence: "high"
  diagram_mermaid: |
    erDiagram
      BOOK ||--o{ LOAN : "貸し出される"
      BOOK ||--o{ RESERVATION : "予約される"
      USER ||--|| USER_ACCOUNT : "認証情報を持つ"
      USER ||--o{ LOAN : "借りる"
      USER ||--o{ RESERVATION : "予約する"
      USER ||--o{ NOTIFICATION : "通知を受け取る"
      LOAN ||--o{ NOTIFICATION : "リマインド・督促の対象"
      RESERVATION ||--o{ NOTIFICATION : "取置き案内の対象"
      NOTIFICATION ||--|| NOTIFICATION_IDEMPOTENCY_KEY : "重複送信を抑止する"
      USER_ACCOUNT ||--o{ SESSION : "セッションを持つ"
      STATS_REPORT }o--o{ BOOK : "集計軸として参照(導出)"
      STATS_REPORT }o--o{ LOAN : "実績を集計(導出)"
      BOOK {
        string book_id PK
        string title
        string author
        string isbn
        string publisher
        string genre
        string material_type
        string book_status
        datetime registered_at
        datetime updated_at
      }
      USER {
        string user_no PK
        string name
        string email
        string user_category
        string user_status
        datetime registered_at
        datetime updated_at
      }
      USER_ACCOUNT {
        string account_id PK
        string user_no FK
        string login_id
        string role
        boolean is_active
      }
      LOAN {
        string loan_id PK
        string book_id FK
        string user_no FK
        date loan_date
        string loan_period_type
        date due_date
        string loan_status
      }
      RESERVATION {
        string reservation_id PK
        string book_id FK
        string user_no FK
        datetime applied_at
        integer priority
        string reservation_status
        datetime hold_expires_at
      }
