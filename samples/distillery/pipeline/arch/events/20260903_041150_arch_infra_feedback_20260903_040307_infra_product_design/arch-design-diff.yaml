system_architecture:
  cross_tier_policies:
    - id: "CTP-016"
      name: "IdP 実現手段の方針"
      description: "IdP ティアの責務（司書・利用者の単一 IdP 管理、OAuth2/OIDC 境界）は CTP-003 の通り維持しつつ、実現手段はマネージド IdP を第一候補、セルフホスト IdP を代替候補とする。パッチ適用・冗長化・認証ログ保全をマネージドサービスに委ね、小規模運用体制での負担を下げる"
      reason: "インフラ設計（MCL product-design）の結果に基づく: 運用要員が司書中心の小規模体制で、IdP のパッチ適用・可用性維持・認証ログ保全を自前で負うことが難しい。マネージド IdP は OIDC/OAuth2・パスワードポリシー・アカウントロック・監査イベント出力を標準機能で満たせる"
      source_model: "infra: product-decision-006 → decision.rationale"
      confidence: "medium"
    - id: "CTP-017"
      name: "API エッジの多層防御方針"
      description: "API エッジでの防御は WAF によるマネージドルール・レート制限を基本とし、トークン検証は Backend 最外周ミドルウェアで行う多層防御パターンを、エッジでの JWT 検証が構成上困難な場合の許容パターンとする。無効トークンの検証失敗率が閾値を超えた場合は WAF のレート制限を強化する"
      reason: "インフラ設計（MCL product-design）の結果に基づく: 常時稼働のコンテナ実行基盤と組み合わせた場合、リクエスト課金型のエッジ認証はベースライン負荷で割高になりうる。WAF のレート制限とマネージドルールで代替した際の残存リスク（無効トークンがバックエンドまで到達する）を明示し、監視・強化の運用方針とセットで許容する"
      source_model: "infra: product-decision-002 / product-mapping-aws.yaml → mappings[api_edge] (fidelity: partial)"
      confidence: "medium"
    - id: "CTP-018"
      name: "SLI/SLO ベースのオブザーバビリティ方針"
      description: "可用性（フロントエンド・API）、性能（API 応答時間）、信頼性（API エラー率・通知送信成功率・日次バッチ完遂率）の SLI を定義し、アラートしきい値を SLO から導出する。SLI/SLO は運用監視（CTP-010）とアラート通知（CTR-002）の判定基準として用いる"
      reason: "インフラ設計（MCL product-design）の結果に基づく: オブザーバビリティ仕様で SLI/SLO が具体化されており、アーキテクチャレベルの方針として横断的に採用する"
      source_model: "infra: product-observability.yaml → sli_slo / slo"
      confidence: "medium"
  tiers:
    - id: "tier-worker"
      policies:
        - id: "SP-030"
          name: "中断許容ワークロードとしてのコスト最適化"
          description: "キュー消費ワーカー・スケジュール実行ワーカーはスポット/プリエンプティブルインスタンスの利用を第一候補とする。中断時は SIGTERM 受信での可視性タイムアウト解放とリトライ、冪等消費（SR-013）・再実行可能性（SR-014）を前提に安全に再処理する"
          reason: "インフラ設計（MCL product-design）の結果に基づく: 通知送信・日次バッチは即時性要求が低く中断を許容できるため、コスト最適化の余地が大きい"
          source_model: "infra: product-cost-hints.yaml → spot_candidates[worker_consumer, worker_scheduled]"
          confidence: "medium"

