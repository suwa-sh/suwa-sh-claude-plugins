round: 1
reviewer: independent-read-only-context
scope: dist-spec-stories Step7。生成物を修正せず、最新の宣言と予定差分、全24presentation tier、全ページ実体と部品exportを静的に照合した。ビルド/ブラウザplayの成功はこのレビューで再実行していない。
findings:
- id: SSR-001
  severity: major
  title: 結果不明の更新要求を再読込後に復元できない
  status: open
  evidence:
  - file: docs/design/latest/storybook-app/src/stories/Pages/_circulation/view.ts
    line: 17
  - file: docs/design/latest/storybook-app/src/stories/Pages/司書ポータル/貸出受付画面.stories.tsx
    line: 25
  - file: docs/specs/latest/_cross-cutting/ux-ui/ui-design.md
    line: 60
  expected: UI-WRITEに従い、主体別sessionStorageから未確認の本文・対象・キーを復元し、照合完了まで入力変更や新キー発行を停止する。Error/再読込のStoryで同一要求を検証する。
  actual: useDemoActionはsessionStorage.setItemを実行するがgetItemを実行しない。Error初期状態のsnapshotも空で、結果確認のrunで新しいキーを作る。貸出と返却の入力変更はresetで保存要求を削除する。予約申込・取消・通知も同じhookを利用する。
- id: SSR-002
  severity: major
  title: ページ移動が欠けるか表示行に接続されていない
  status: open
  evidence:
  - file: docs/design/latest/storybook-app/src/stories/Pages/利用者ポータル/マイ予約状況画面.stories.tsx
    line: 15
  - file: docs/design/latest/storybook-app/src/stories/Pages/司書ポータル/人気書籍ランキング画面.stories.tsx
    line: 17
  - file: docs/design/latest/storybook-app/src/stories/Pages/司書ポータル/在庫状況一覧画面.stories.tsx
    line: 19
  expected: 3UCのtierに指定されたPaginationへpage/page_size/totalを渡し、ページ操作でURLと要求を更新して対象ページの行を表示する。21件以上のfixtureで2ページ目を確認する。
  actual: マイ予約状況にPagination JSXがない。人気書籍ランキングもPaginationがなくRankingList.limit=20固定。在庫一覧はpageを更新するがBookTableには常にitems全件を渡し、onChangeはURLも更新しない。
- id: SSR-003
  severity: major
  title: 選択した識別子を遷移先画面が受け取らない
  status: open
  evidence:
  - file: docs/design/latest/storybook-app/src/stories/Pages/司書ポータル/窓口蔵書検索画面.stories.tsx
    line: 37
  - file: docs/design/latest/storybook-app/src/stories/Pages/司書ポータル/貸出受付画面.stories.tsx
    line: 20
  - file: docs/design/latest/storybook-app/src/stories/Pages/利用者ポータル/マイ予約状況画面.stories.tsx
    line: 18
  - file: docs/design/latest/storybook-app/src/stories/Pages/利用者ポータル/予約取消画面.stories.tsx
    line: 20
  expected: 貸出受付はtierのquery.bookIdを初期入力へ渡す。予約取消は遷移元のreservationIdを対象へ使う。Storyではroute引数またはqueryを使い、固定fixtureとは異なるIDで引渡しを確認できるようにする。
  actual: 窓口検索がbookIdを渡しても貸出受付はapi.book.book_idを初期値とする。マイ予約状況がiframe queryにreservationIdを付与しても予約取消はapi.reservationを固定参照する。他の書籍詳細・編集・削除もrouteの識別子を受け取るProps/query処理がなく固定対象である。
- id: SSR-004
  severity: major
  title: 利用者登録の取得失敗回復が未検証の登録要求を発行する
  status: open
  evidence:
  - file: docs/design/latest/storybook-app/src/stories/Pages/司書ポータル/利用者登録画面.stories.tsx
    line: 43
  - file: docs/design/latest/storybook-app/src/stories/Pages/司書ポータル/利用者登録画面.stories.tsx
    line: 48
  expected: 取得回復でcreateUserを発行しない。送信結果不明の回復であれば保存済みの本文・キーを使う。初期入力へ戻すだけの場合は更新要求を通知しない。
  actual: Error Storyの再取得操作はretryReadからonRequest({operation:createUser,path:{}})を呼ぶ。bodyも冪等キーもなく、登録検証・送信スナップショットを迂回する。
- id: SSR-005
  severity: major
  title: 成功後の再取得先が契約のoperation名と異なる
  status: open
  evidence:
  - file: docs/design/latest/storybook-app/src/stories/Pages/利用者ポータル/予約申込画面.stories.tsx
    line: 27
  - file: docs/design/latest/storybook-app/src/stories/Pages/利用者ポータル/予約取消画面.stories.tsx
    line: 25
  - file: docs/design/latest/storybook-app/src/stories/Pages/司書ポータル/利用者編集画面.stories.tsx
    line: 34
  - file: docs/specs/latest/_cross-cutting/api/paths/me_reservations.yaml
    line: 2
  - file: docs/specs/latest/_cross-cutting/api/paths/staff_users__user_number__activity.yaml
    line: 2
  expected: 本人予約一覧の再取得はlistMyReservations、利用者利用状況の無効化はgetUserActivityに接続する。callbackの引数を実際の契約operationで検証する。
  actual: 予約申込/取消はgetMyReservationsという未定義operationをonRequestへ渡す。利用者登録/編集/削除はgetUserStatusという未定義の照会名をonInvalidateへ渡す。正しい契約名で接続すると更新後表示が再取得されない。
- id: SSR-006
  severity: minor
  title: レビュー中追加されたStory exportが予定差分に未反映
  status: open
  evidence:
  - file: docs/design/latest/storybook-app/src/stories/Pages/利用者ポータル/蔵書検索画面.stories.tsx
    exports: &id001
    - ISBNNormalized
  - file: docs/design/latest/storybook-app/src/stories/Pages/司書ポータル/蔵書一覧画面.stories.tsx
    exports: &id002
    - ISBNNormalized
  - file: docs/design/latest/storybook-app/src/stories/Pages/司書ポータル/窓口蔵書検索画面.stories.tsx
    exports: &id003
    - ISBNNormalized
  expected: イベント記録前にvariantsへ追加exportを反映して全数を再照合する。
  actual: ISBNNormalized等の追加は実装に存在するが現在の予定差分にない。
