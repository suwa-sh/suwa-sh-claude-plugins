round: 2
reviewer: independent-read-only-context
scope: round1全6指摘の再確認。生成物変更なし。実体の静的確認と保存済みvitest JSONの結果を照合。ブラウザplayをこのレビュー自身では再実行していない。
findings:
- id: SSR-001
  severity: major
  status: open
  title: 結果不明中の確認操作から未確認要求と表示入力が分離する
  evidence:
  - file: docs/design/latest/storybook-app/src/stories/Pages/司書ポータル/貸出受付画面.stories.tsx
    line: 26
  - file: docs/design/latest/storybook-app/src/stories/Pages/司書ポータル/返却受付画面.stories.tsx
    line: 30
  - file: docs/design/latest/storybook-app/src/components/domain/CounterPanels.tsx
    line: 60
  improved: hookは保存済みsnapshotを読み、4Error Storyで同一payload/key再送と保存解除を確認する。入力変更はError中にguardされた。
  actual: Loan/ReturnのonLookupはbusyだけをguardする。Error中の「確認する」でAllowed/Foundへ移りError
    guardが外れる。入力変更後にもhookのsnapshotは元要求を保持するため、表示した新入力と再送する元要求が異なる。
  expected: 未確認snapshotがある間はlookupと入力変更を停止する。確認操作を押しても状態・入力・snapshotを変更せず、結果照合操作だけを許可する。
resolved:
- id: SSR-002
  resolution: fixed
  verification: 3画面でPaginationを追加または修正。displayedにpage/pageSizeのsliceを使い、page/page_sizeをURLへ反映する。各Paged
    Storyは22件を用い21〜22件目の表示、1件目の非表示、URL page=2を検査している。
- id: SSR-003
  resolution: fixed
  verification: 貸出受付はbookId Props/queryを読み、DirectLinkでB-009999の確認要求を検査する。予約取消はreservationIdを取得/取消要求へ渡しR-009999で検査する。書籍詳細、書籍編集/削除、利用者編集/削除はtargetIdから別fixtureと識別子を選択し、5件のDirectLinkで別ID/If-Matchを確認する。
- id: SSR-004
  resolution: fixed
  verification: 利用者登録からretryReadとerror取得bannerを除去。Error Storyは検証済みsubmitでunknownへ進み、保存したbody/headerを持つ要求とexact同一の再送を行い、onRequestが2回だけであることを検査する。
- id: SSR-005
  resolution: fixed
  verification: ページ全ソースからgetMyReservations/getUserStatusの残存0を確認。予約側はlistMyReservations、利用者更新側はgetUserActivityへ置換した。
- id: SSR-006
  resolution: fixed
  verification: design-event+予定差分の24画面と全167exportの集合が一致。ISBNNormalized、DirectLink、Pagedの追加を含む。
