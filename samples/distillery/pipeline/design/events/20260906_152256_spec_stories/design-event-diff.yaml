screens:
  - name: 蔵書検索画面
    portal: patron
    route: /search
    uc: 書籍を検索する
    components:
      - PortalShell
      - BookSearchFilter
      - BookCard
      - Pagination
      - EmptyState
      - Skeleton
    variants:
      - Default
      - Empty
      - Loading
      - Error
      - ISBNNormalized
    story: Pages/利用者ポータル/蔵書検索画面
  - name: 書籍詳細・在庫状況画面
    portal: patron
    route: /books/:bookId
    uc: 書籍詳細を参照する
    components:
      - PortalShell
      - BookCard
      - BookStatusBadge
      - ReservationQueueTracker
      - Button
      - Alert
    variants:
      - Available
      - OnLoan
      - Reserved
      - OwnReservation
      - Electronic
      - Loading
      - Error
      - NotFound
      - DirectLink
    story: Pages/利用者ポータル/書籍詳細・在庫状況画面
  - name: 予約申込画面
    portal: patron
    route: /books/:bookId/reserve
    uc: 予約を登録する
    components:
      - PortalShell
      - BookCard
      - ReservationQueueTracker
      - ConfirmPanel
      - Alert
    variants:
      - OnLoan
      - AlreadyAvailable
      - Submitting
      - Done
      - Error
      - Loading
      - NotFound
      - Electronic
      - ReservationWaiting
    story: Pages/利用者ポータル/予約申込画面
  - name: 予約取消画面
    portal: patron
    route: /reservations/:reservationId/cancel
    uc: 予約を取り消す
    components:
      - PortalShell
      - ReservationStatusBadge
      - ConfirmPanel
    variants:
      - Default
      - Submitting
      - Done
      - Error
      - NotFound
      - Conflict
      - DirectLink
    story: Pages/利用者ポータル/予約取消画面
  - name: マイ貸出履歴画面
