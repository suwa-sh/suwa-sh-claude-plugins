schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "design_system"
artifact_id: "design-decision-002"
title: "ポータルを patron / staff の 2 つに分割し、プライマリ色で識別する"
status: "approved"
generated_at: "2026-09-02T15:12:00+09:00"
context: |
  RDRA のアクターは「司書（社内・提供者）」と「利用者（社外・受益者）」の 2 者。
  arch のシステムアーキテクチャも tier-frontend-patron と tier-frontend-staff の 2 フロントエンドティアに
  分かれており、司書ポータルは館内ネットワーク限定公開（SP-005 / NFR E.5.3.1）、
  利用者ポータルはインターネット公開かつ本人限定参照の UI 制約（SP-004）を持つ。
  BUC.tsv から抽出した画面は 41 件で、どちらのポータルに属するかを機械的に決める必要があった。
decision: |
  ポータルを patron（利用者ポータル）と staff（司書ポータル）の 2 つに分割し、
  ティア境界とポータル境界を一致させた。

  画面のポータル割当ルールは次のとおり。
  - UC が「自分の〜を照会する」、または利用者側アクティビティ
    （読みたい書籍を探す / 予約する / 利用者番号を提示する / 借りた書籍を窓口へ返す）→ patron（17 画面）
  - 上記以外（登録・編集・削除・窓口受付・通知送信・レポート）→ staff（24 画面）

  ポータル切替は CSS の `[data-portal="patron|staff"]` 属性セレクタで行い、
  プライマリ色を patron = Libra Blue #1D4ED8、staff = Stack Teal #0F766E に分けた。
  色を分けるのは装飾ではなく、司書が窓口で 2 ポータルを行き来する際の取り違えを
  一目で防ぐための機能要件である。
consequences:
  positive:
    - "arch のティア境界と一致するため、後段の spec / impl でポータル単位に分割しやすい"
    - "1 つのトークンセットで両ポータルを賄えるため、共通コンポーネントを二重実装しなくてよい"
    - "ポータルの取り違えを色で検知できる（NFR E.5.3.1 の運用リスク低減）"
  negative:
    - "ポータル固有の色に依存したスクリーンショットは、data-portal を切り替えると全て差分になる"
    - "色覚特性によっては青とティールの区別が付きにくい。ヘッダーのポータル名表示を必ず併記する必要がある"
alternatives_considered:
  - name: "単一ポータルでロールによる出し分け"
    reason_rejected: "arch がティアを分けており、館内ネットワーク限定公開（SP-005）を満たせない。ビルド成果物も分離できない"
  - name: "3 ポータル（利用者 / 司書 / 管理者）に分割"
    reason_rejected: "RDRA のアクターは 2 者のみ。管理者アクターは存在しないため、RDRA 整合性ルールにより追加しない"
  - name: "ポータル間で同一プライマリ色を使う"
    reason_rejected: "司書が両ポータルを行き来する運用で取り違えを検知できない。色による識別は誤操作防止の実利がある"
