artifact_id: "design-decision-001"
title: "ブランドアイデンティティを「信頼・堅実」路線の仮称 Libra とする"
status: "approved"
generated_at: "2026-09-02T15:12:00+09:00"
context: |
  RDRA / NFR / arch のいずれにもプロダクト名称・ブランドトーンの記述がない。
  一方でアクターは「司書（社内・提供者）」と「図書館利用者（社外・受益者）」の 2 者で、
  システム概要は「紙台帳と表計算ファイルに分散した情報を単一の正データに統合し、
  司書の管理の手間とミスを削減して利用者サービスを向上させる」という業務効率化を目的にしている。
  公共図書館の利用者は年齢層が広く、司書は窓口で利用者を待たせながら操作する（arch SP-006）。
  dialogue_policy が auto_adopt のため、3 案を作成した上で⭐推奨を自動採用する必要があった。
decision: |
  ブランド方針は「信頼・堅実」路線（Option A）を採用した。
  落ち着いたトーン・高い可読性・説明的な文言を優先し、装飾的な表現は使わない。
  ボイスの原則は次の 5 つとした。
  - 利用者には「できること」を先に伝える（在庫あり / 予約できます / あと N 日）
  - 司書には「判定結果と根拠」を並べて示す（貸出できません + 蔵書削除制限ポリシー）
  - 個人情報は既定で伏せ、必要なときだけ明示操作で開く
  - 色だけで意味を伝えない。必ず文言かアイコンを添える
  - 専門用語は RDRA の業務用語をそのまま使う（除籍 / 取置き / 督促）

  名称は仮称「Libra」（library / libra = 天秤・公正）とし、タグラインを「図書館蔵書管理システム」とした。
  名称は confidence low のため仮採用とし、docs/todo.md に確定依頼を登録した。
  差し替えコストを最小化するため、名称の露出はロゴ SVG のテキスト部と PortalShell のヘッダーに限定してある。
consequences:
  positive:
    - "公共図書館という文脈で幅広い年齢層に受け入れられるトーンになる"
    - "司書の高密度な窓口業務画面と利用者の照会画面を同じトーンで統一できる"
    - "館名が決まった時点でロゴのテキスト部だけを差し替えれば移行できる"
  negative:
    - "差別化・話題性は低い。対外的なプロモーション素材としては弱い"
    - "仮称のまま実装が進むと、後段の spec / impl に名称が伝播して差し替え箇所が増える恐れがある"
alternatives_considered:
  - name: "Option B: 革新・先進路線"
    reason_rejected: "DX 推進の訴求は強いが、公共施設の不特定利用者には硬質に映り、司書の業務効率という主目的とも噛み合わない"
  - name: "Option C: 親近・カジュアル路線"
    reason_rejected: "児童利用者には親しみやすいが、司書の窓口業務画面が軽く見え、除籍・督促といった重い操作の重みが伝わらない"
  - name: "館名をそのまま冠する（○○図書館 蔵書管理システム）"
    reason_rejected: "最も安全だが館名が RDRA に無く未確定。仮の館名を置くと実在の館と誤認される恐れがある"
