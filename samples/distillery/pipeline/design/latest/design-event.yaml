states:
  - model: 書籍の状態
    entries:
      - state: 在庫あり
        label: 在庫あり
        color: green
        actions:
          司書:
            - 貸出を登録する
            - 書籍を編集する
            - 書籍を削除する
          利用者:
            - 書籍詳細を参照する
      - state: 貸出中
        label: 貸出中
        color: blue
        actions:
          司書:
            - 返却を登録する
            - 書籍を編集する
          利用者:
            - 予約を登録する
      - state: 予約待ち
        label: 予約待ち
        color: orange
        actions:
          司書:
            - 貸出を登録する（予約順位 1 位）
            - 予約一覧を参照する
          利用者:
            - 予約を取り消す
  - model: 貸出の状態
    entries:
      - state: 貸出中
        label: 貸出中
        color: blue
        actions:
          司書:
            - 返却を登録する
          タイマー:
            - リマインドを送信する
            - 延滞を判定する
      - state: 延滞
        label: 延滞
        color: red
        actions:
          司書:
            - 返却を登録する
            - 延滞一覧を参照する
          タイマー:
            - 督促を送信する
      - state: 返却済み
        label: 返却済み
        color: gray
        actions:
          利用者:
            - 貸出履歴を参照する
  - model: 予約の状態
    entries:
      - state: 予約中
        label: 予約中
        color: amber
        actions:
          司書:
            - 返却通知を送信する
          利用者:
            - 予約を取り消す
      - state: 通知済み
        label: 通知済み
        color: violet
        actions:
          司書:
            - 貸出を登録する
          利用者:
            - 予約を取り消す
      - state: 取消
        label: 取消
        color: gray
nfr_decisions:
  - nfr: B.1.1.1 同時アクセス数 〜100 / B.2.1.1 レスポンス 5 秒
    decision: 仮想スクロールは採用せず、全一覧に 20 件/頁のページネーションと Skeleton を標準装備する
  - nfr: B.2.1.3 集計 10 秒以内
    decision: 統計 3 画面は Skeleton + 「集計中」文言で待ち時間を可視化し、PeriodSelector 変更ごとに再集計する
  - nfr: E.1.2.1 / E.6.1.1 個人情報・貸出履歴の要配慮性
    decision: 連絡先は PiiMaskedText で既定マスク。貸出履歴・予約状況は利用者ポータルでは本人分のみを前提に画面を構成する
  - nfr: E.5.3.1 利用制限（司書機能は館内限定）
    decision: PortalShell のナビをポータルごとに完全分離し、利用者ポータルに管理導線を一切出さない
  - nfr: arch SR-002 ブラウザ側に個人情報・認証情報を永続化しない
    decision: 「ログイン状態を保持」等の永続化を前提とする UI を設けない
  - nfr: arch SR-005 確認ステップとダブルサブミット防止
    decision: 削除・貸出・返却・通知送信は ConfirmPanel / Modal を経由し、submitting 中はボタンを disabled +
      Spinner にする
  - nfr: F.1.1.3 対応デバイス Lv2（PC + タブレット、スマホ要確認 / confidence low）
    decision: lg / md をフル設計、sm はハンバーガー + 1 カラムの簡易対応。スマホ対応の要否は todo.md に登録
  - nfr: F.3.1.2 アクセシビリティ JIS X 8341-3 AA 目標（confidence low）
    decision: コントラスト AA、色 + 文言/アイコン併用、focus-visible リング、prefers-reduced-motion
      尊重。addon-a11y を有効化
  - nfr: arch CTP-007 日本語のみ
    decision: i18n レイヤを設けず、ラベルは日本語リテラル。日付は YYYY/MM/DD 固定
storybook:
  framework: "@storybook/nextjs-vite"
  addons:
    - "@storybook/addon-docs"
    - "@storybook/addon-a11y"
    - "@storybook/addon-vitest"
    - "@chromatic-com/storybook"
    - "@storybook/addon-mcp"
  categories:
    Introduction: ブランド・原則・使い方
    Design Tokens: 3 層トークン一覧（CSS 変数名つき）
    Screen Mapping: RDRA 画面 → ルート → コンポーネント
    State Mapping: RDRA 状態 → Badge
    Brand: Logo / Icons
    UI: 汎用コンポーネント
    Domain: ドメインコンポーネント
