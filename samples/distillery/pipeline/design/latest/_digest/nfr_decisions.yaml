# digest of design/latest/design-event.yaml section nfr_decisions (L1616-1640); source_sha256: 7e4262e4b85411707038985f94bd47496eca0007f0389cf6fa4c3bec2389b6d5
# 派生物。正本は design-event.yaml。編集しない
nfr_decisions:
  - nfr: "F.1.1.2 対応ブラウザ Lv2（Chrome / Edge / Safari 最新版）"
    decision: "ベンダープレフィックスを前提にしない。CSS カスタムプロパティと flex/grid gap をそのまま使う"
  - nfr: "F.1.1.3 対応デバイス Lv2（PC + タブレット。スマホ要確認）"
    decision: "lg（12col / サイドバー展開）と md（8col / サイドバー 4rem 折りたたみ）をフル設計し、sm は崩れ防止の簡易対応に留める"
  - nfr: "F.3.1.2 アクセシビリティ Lv2（JIS X 8341-3:2016 AA 目標）"
    decision: "本文コントラスト 4.5:1 以上、キーボード操作、aria 属性、色以外の手掛かり（アイコン/文言/dot）を全コンポーネントの既定要件にする。適合宣言は行わない"
  - nfr: "B.1.1.1 同時アクセス 〜100 / 登録利用者 〜1,000"
    decision: "仮想スクロールは導入せず、Pagination（20 件/頁）で一覧を分割する"
  - nfr: "B.2.1.1 レスポンスタイム 5 秒以内"
    decision: "全一覧・詳細コンポーネントに Skeleton のローディング状態を用意する"
  - nfr: "E.1.2.1 個人情報保護 / arch SR-006 個人情報表示の最小化"
    decision: "UserProfileCard・UserTable・NotificationLogTable の連絡先を既定でマスクし、UserProfileCard のみ明示操作で開示できるようにする"
  - nfr: "E.5.3.1 司書向け機能は館内ネットワーク限定"
    decision: "司書ポータルを別プライマリ色（ティール）にし、公開ポータルとの取り違えを色でも防ぐ"
  - nfr: "A（可用性） / arch SP-004 本人限定参照の UI 制約"
    decision: "一覧系コンポーネントに EmptyState / Alert(destructive) / Skeleton の 3 状態を必須の Story として定義し、利用者ポータルには他利用者データへの導線を置かない"
  - nfr: "arch SR-002 冪等キーの付与と二重送信防止"
    decision: "Button に loading 状態を持たせ、送信中は disabled かつ aria-busy にする"
  - nfr: "B.2.1.1 レスポンスタイム 5 秒以内 / F.3.1.2 アクセシビリティ Lv2"
    decision: "loading 表現を LoadingState 1 か所に集約し、形が決まっている領域は Skeleton（list/card/detail/line）、レイアウトが変わらない待ちは Spinner（inline/overlay）に固定する。画面側に独自 loading UI を作らせず、常に aria-busy と読み上げラベルを伴わせる"
  - nfr: "E.5.3.1 司書向け機能は館内ネットワーク限定 / arch SP-004 本人限定参照の UI 制約"
    decision: "URL の正本を routes.ts に一元化し、AppShell がポータル外・未登録ルートを描画しない。実装リポは router アダプタ（onNavigate）とページ本体だけを所有する"
  - nfr: "arch SR-004 日本語単一ロケール"
    decision: "i18n リソースバンドルは導入せず、日付・数値は toLocaleDateString('ja-JP') / toLocaleString('ja-JP') で書式化する"
