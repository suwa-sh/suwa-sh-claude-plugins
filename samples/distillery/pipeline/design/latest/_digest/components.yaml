# digest of design/latest/design-event.yaml section components (L357-839); source_sha256: a7c591614e86518c64bedfab204693aecdd149bcc2c0a230692d585870a9e4cf
# 派生物。正本は design-event.yaml。編集しない
components:
  ui:
    - name: "Button"
      path: "src/components/ui/Button.tsx"
      exports: ["Button"]
      variants:
        - "default"
        - "secondary"
        - "outline"
        - "ghost"
        - "destructive"
      sizes:
        - "sm"
        - "md"
        - "lg"
    - name: "Badge"
      path: "src/components/ui/Badge.tsx"
      exports: ["Badge"]
      variants:
        - "default"
        - "success"
        - "warning"
        - "destructive"
        - "info"
        - "neutral"
        - "pending"
        - "analysis"
        - "outline"
    - name: "Card"
      path: "src/components/ui/Card.tsx"
      exports: ["Card","CardHeader"]
      variants:
        - "default"
        - "hoverable"
        - "flush"
    - name: "Input"
      path: "src/components/ui/Input.tsx"
      exports: ["Input"]
      variants:
        - "default"
        - "with-icon"
        - "with-suffix"
        - "error"
        - "disabled"
    - name: "ToggleGroup"
      path: "src/components/ui/ToggleGroup.tsx"
      exports: ["ToggleGroup"]
      variants:
        - "single"
        - "multi"
      sizes:
        - "sm"
        - "md"
    - name: "Table"
      path: "src/components/ui/Table.tsx"
      exports: ["Table"]
      variants:
        - "default"
        - "empty"
    - name: "Alert"
      path: "src/components/ui/Feedback.tsx"
      exports: ["Alert"]
      variants:
        - "info"
        - "success"
        - "warning"
        - "destructive"
    - name: "EmptyState"
      path: "src/components/ui/Feedback.tsx"
      exports: ["EmptyState"]
      variants:
        - "default"
        - "with-action"
    - name: "Skeleton"
      path: "src/components/ui/Feedback.tsx"
      exports: ["Skeleton","SkeletonTable","SkeletonCard","SkeletonDetail"]
      usage: "loading 中の領域形状プレースホルダ。画面から直接使わず common/LoadingState 経由で使う（kind=list/card/detail/line）"
      variants:
        - "line"
        - "table"
        - "card"
        - "detail"
    - name: "Spinner"
      path: "src/components/ui/Feedback.tsx"
      exports: ["Spinner"]
      usage: "loading 中の回転インジケータ。画面から直接使わず common/LoadingState 経由で使う（kind=action/page）"
      variants:
        - "inline"
        - "button"
        - "overlay"
      sizes:
        - "sm"
        - "md"
        - "lg"
    - name: "Pagination"
      path: "src/components/ui/Pagination.tsx"
      exports: ["Pagination"]
      variants:
        - "default"
        - "single-page"
    - name: "Modal"
      path: "src/components/ui/Modal.tsx"
      exports: ["Modal"]
      variants:
        - "confirm"
        - "destructive-confirm"
      sizes:
        - "sm"
        - "md"
    - name: "Icon"
      path: "src/components/ui/Icon.tsx"
      exports: ["Icon","iconNames"]
      variants:
        - "outlined"
    - name: "PortalShell"
      path: "src/components/ui/PortalShell.tsx"
      exports: ["PortalShell","staffNav","patronNav"]
      variants:
        - "patron"
        - "staff"
        - "collapsed"

