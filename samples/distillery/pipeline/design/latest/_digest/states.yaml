# 派生物。正本は design-event.yaml。編集しない
states:
  - model: 書籍の状態
    entries:
      - state: 在庫あり
        label: 在庫あり
        color: green
        actions:
          司書:
            - 貸出を登録する
            - 書籍を編集する
            - 書籍を削除する
          利用者:
            - 書籍詳細を参照する
      - state: 貸出中
        label: 貸出中
        color: blue
        actions:
          司書:
            - 返却を登録する
            - 書籍を編集する
          利用者:
            - 予約を登録する
      - state: 予約待ち
        label: 予約待ち
        color: orange
        actions:
          司書:
            - 貸出を登録する（予約順位 1 位）
            - 予約一覧を参照する
          利用者:
            - 予約を取り消す
  - model: 貸出の状態
    entries:
      - state: 貸出中
        label: 貸出中
        color: blue
        actions:
          司書:
            - 返却を登録する
          タイマー:
            - リマインドを送信する
            - 延滞を判定する
      - state: 延滞
        label: 延滞
        color: red
        actions:
          司書:
            - 返却を登録する
            - 延滞一覧を参照する
          タイマー:
            - 督促を送信する
      - state: 返却済み
        label: 返却済み
        color: gray
        actions:
          利用者:
            - 貸出履歴を参照する
  - model: 予約の状態
    entries:
      - state: 予約中
        label: 予約中
        color: amber
        actions:
          司書:
            - 返却通知を送信する
          利用者:
            - 予約を取り消す
      - state: 通知済み
        label: 通知済み
        color: violet
        actions:
          司書:
            - 貸出を登録する
          利用者:
            - 予約を取り消す
      - state: 取消
        label: 取消
        color: gray
