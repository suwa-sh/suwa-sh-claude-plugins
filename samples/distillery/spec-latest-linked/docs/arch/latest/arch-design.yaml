system_architecture:
  tiers:
    - id: "tier-frontend-patron"
      name: "利用者ポータル"
      description: "図書館利用者向けの Web UI。書籍検索・在庫状況照会・予約申込/取消・自分の貸出内容/返却期限/貸出履歴/予約状況/取置き状況の照会を提供する。インターネットへ公開する"
