        - id: "SP-001"
          name: "マルチデバイス対応"
          description: "PC とタブレットを主対象としたレスポンシブ UI を提供し、主要ブラウザ 3 種（最新版）で動作させる。スマートフォン対応の要否は別途確認する"
          reason: "利用者照会は PC/タブレットからの利用が想定され、NFR で対応ブラウザ 2-3 種が定義されている"
          source_model: "アクター: 利用者, NFR F.1.1.1, NFR F.1.1.2, NFR F.1.1.3"
          confidence: "medium"
        - id: "SP-002"
