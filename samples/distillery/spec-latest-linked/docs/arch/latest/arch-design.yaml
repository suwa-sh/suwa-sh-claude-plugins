  storage_mapping:
    - entity_id: "E-001"
      storage_type: "rdb"
      reason: "状態モデル「書籍状態」を持ち、貸出・予約と在庫整合をとるトランザクションが必要。書籍検索は検索条件種別5種（キーワード/タイトル/著者/ISBN/ジャンル）に限られ、蔵書数万件・総容量100GB未満（NFR B.1.1.2 Lv1）のため RDB の全文索引でレスポンスタイム5秒以内（NFR B.2.1.1 Lv3）を満たせる"
      confidence: "high"
    - entity_id: "E-001"
      storage_type: "cache"
      reason: "利用者ポータルの書籍検索・書籍詳細照会が参照系の主要負荷であり、レスポンスタイム5秒以内（NFR B.2.1.1 Lv3）とピーク時2倍（NFR B.1.2.1 Lv2）の吸収に Cache-Aside を適用する。書籍状態は貸出・返却で変わるため、状態遷移イベントでキャッシュを無効化する（短 TTL 併用）"
      confidence: "high"
    - entity_id: "E-002"
      storage_type: "rdb"
      reason: "状態モデル「利用者状態」を持ち、貸出・予約との整合が必要。氏名・連絡先は個人情報のため保管時暗号化（NFR E.6.1.1 Lv1）を適用し、DB 層は内部セグメントに配置して外部から直接到達不可とする（NFR E.8.3.1 Lv2）"
      confidence: "high"
    - entity_id: "E-003"
      storage_type: "rdb"
      reason: "役割（司書/利用者）による RBAC 判定（NFR E.5.2.1 Lv2）と有効フラグによるアカウントロック（NFR E.7.2.1）で参照される業務データ。認証クレデンシャル自体は IdP ティアが保持するため本表の対象外"
      confidence: "high"
    - entity_id: "E-004"
      storage_type: "rdb"
      reason: "書籍状態・利用者状態と同一トランザクションで整合させる必要がある取引データ。RPO 数時間前まで（NFR A.4.1.1 Lv2）を満たすため RDB のポイントインタイムリカバリを前提とする"
      confidence: "high"
    - entity_id: "E-005"
      storage_type: "rdb"
      reason: "予約順位の一意性・重複予約禁止（条件: 重複予約禁止条件）を一意制約と行ロックで担保する必要があり、強整合が前提"
      confidence: "high"
    - entity_id: "E-006"
      storage_type: "rdb"
      reason: "通知状態の遷移と送信実績（未達追跡）を監査ログ相当の記録として保持する（NFR E.7.1.1 Lv2）。宛先メールアドレスは個人情報のため保管時暗号化の対象（NFR E.6.1.1 Lv1）"
      confidence: "high"
    - entity_id: "E-007"
      storage_type: "rdb"
      reason: "集計結果を Materialized View として RDB に永続化し、レポート参照のターンアラウンド10秒以内（NFR B.2.1.3 Lv2）を満たす。データ量100万件/年（NFR B.1.1.2 Lv1）の範囲では専用の分析ストアを設ける必要がない"
      confidence: "high"
    - entity_id: "E-901"
      storage_type: "cache"
      reason: "外部アクター（利用者）＋ID/パスワード認証（NFR E.5.1.1 Lv2）のセッション保持。TTL による自動失効とバックエンド API のスケールアウト（NFR B.3.1.1 Lv2）に伴うステートレス化のため KVS に置く"
      confidence: "high"
    - entity_id: "E-902"
      storage_type: "cache"
      reason: "MQ の at-least-once 配信に対する重複送信抑止（条件: 取置き通知対象条件）。短命かつ TTL 管理が前提で、業務データの整合対象ではないため KVS に置く"
      confidence: "high"
  diagram_mermaid: |
    erDiagram
      BOOK ||--o{ LOAN : "貸し出される"
      BOOK ||--o{ RESERVATION : "予約される"
      USER ||--|| USER_ACCOUNT : "認証情報を持つ"
      USER ||--o{ LOAN : "借りる"
      USER ||--o{ RESERVATION : "予約する"
      USER ||--o{ NOTIFICATION : "通知を受け取る"
      LOAN ||--o{ NOTIFICATION : "リマインド・督促の対象"
      RESERVATION ||--o{ NOTIFICATION : "取置き案内の対象"
      NOTIFICATION ||--|| NOTIFICATION_IDEMPOTENCY_KEY : "重複送信を抑止する"
      USER_ACCOUNT ||--o{ SESSION : "セッションを持つ"
      STATS_REPORT }o--o{ BOOK : "集計軸として参照(導出)"
      STATS_REPORT }o--o{ LOAN : "実績を集計(導出)"
      BOOK {
        string book_id PK
        string title
        string author
        string isbn
        string publisher
        string genre
        string material_type
        string book_status
        datetime registered_at
        datetime updated_at
      }
      USER {
        string user_no PK
        string name
        string email
        string user_category
        string user_status
        datetime registered_at
        datetime updated_at
      }
      USER_ACCOUNT {
        string account_id PK
        string user_no FK
        string login_id
        string role
        boolean is_active
      }
      LOAN {
        string loan_id PK
        string book_id FK
        string user_no FK
        date loan_date
        string loan_period_type
        date due_date
        string loan_status
      }
      RESERVATION {
        string reservation_id PK
        string book_id FK
        string user_no FK
        datetime applied_at
        integer priority
        string reservation_status
        datetime hold_expires_at
      }
      NOTIFICATION {
        string notification_id PK
        string notification_type
        string timing_type
        string recipient_user_no FK
        string recipient_email
        string target_loan_id FK
        string target_reservation_id FK
        text send_result
        string notification_status
      }
      STATS_REPORT {
        string report_id PK
        string report_type
        string period_type
        date period_start
        date period_end
        datetime aggregated_at
        text detail
        string report_status
      }
      SESSION {
        string session_id PK
        string account_id FK
        string user_no
        string role
        string access_token
        string refresh_token
        datetime expires_at
      }
      NOTIFICATION_IDEMPOTENCY_KEY {
        string idempotency_key PK
        string notification_id FK
        datetime requested_at
        datetime expires_at
      }
