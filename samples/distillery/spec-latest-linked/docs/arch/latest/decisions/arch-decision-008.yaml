artifact_type: "decision_record"
skill_type: "architecture"
artifact_id: "arch-decision-008"
title: "フロントエンドを利用者ポータル / 司書ポータルの 2 アプリに分離"
status: "approved"
generated_at: "2026-09-02T14:11:27"
context: |
  アクターは司書（社内・提供者）と利用者（社外・受益者）の 2 種で、画面は 41 件が 2 系統に分かれる。
  NFR 制約は次のとおり。
  - E.5.3.1 Lv1: 司書機能は館内ネットワーク限定
  - E.8.3.1 Lv2: DMZ 分離
  - F.1.1.3 Lv2: スマートフォン対応（デバイス要件）
  - F.3.1.2 Lv2: アクセシビリティ JIS X 8341-3 AA
  単一アプリで役割により表示を切り替える構成でも機能要件は満たせるが、ネットワーク境界を構造で表現できない。
decision: |
  tier-frontend-patron（利用者ポータル、インターネット公開、SPA + CDN）と
  tier-frontend-staff（司書ポータル、館内 NW 限定、SPA）の 2 アプリに分離する。
  経路分離は tier-api-gateway で行い、司書ポータル経路には IP 制限を掛ける。
  レイヤリングは UC 数に応じて分け、司書ポータル（22 UC）は 3 層（view → state management → api client）、
  利用者ポータル（15 UC）は 2 層（view/component → api client）とする。
  重複する検索フォーム・検索結果一覧・書籍詳細・在庫状況表示は共有コンポーネントパッケージを 1 つ切り出し、
  両ポータルが依存する形とする（モノレポ構成）。
  利用者ポータルはレスポンシブでスマートフォン幅を含め、JIS X 8341-3 AA に対応する。
consequences:
  positive:
    - "公開面と館内限定面をアプリ単位で分離でき、NFR E.5.3.1 / E.8.3.1 を構造で満たす"
    - "利用者ポータルの攻撃面から司書機能のコードが物理的に排除される"
    - "ポータルごとに UC 数に応じた最適なレイヤリングを選べる"
    - "共有パッケージにより 5 検索軸の仕様変更が 1 箇所修正で済む"
  negative:
    - "ビルド・デプロイ対象が 2 つになる"
    - "2 ポータルでレイヤー構成が食い違う（3 層 / 2 層）ため、共通コンポーネントの前提が完全には揃わない"
    - "共有パッケージのバージョン管理とビルド構成が 1 段増える"
alternatives_considered:
  - name: "Option B: 単一 SPA で役割により画面を出し分ける"
    reason_rejected: "司書機能のコードが公開面のバンドルに含まれ、館内 NW 限定（E.5.3.1）をアプリ構造で保証できない"
  - name: "Option C: BFF ティアを置いてポータルごとに API を最適化する"
    reason_rejected: "アクター種別が 2 で UI 要件の乖離が小さく、モジュラモノリスの単一 API で足りる"
  - name: "共有せず各ポータルで個別実装する"
    reason_rejected: "5 検索軸の仕様変更が 2 箇所修正になり、書籍詳細・在庫状況表示の仕様が乖離しやすい"
