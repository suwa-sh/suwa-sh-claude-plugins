schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "architecture"
artifact_id: "arch-decision-010"
title: "データモデル戦略: RDB 単一正データ + 全文索引、KVS は派生エンティティのみ"
status: "approved"
generated_at: "2026-09-02T14:11:27"
context: |
  エンティティの model_type（event_snapshot / resource_mutable）とストレージ配置を決める必要があった。
  判断材料は次のとおり。
  - 情報.tsv 7 エンティティのうち 6 件が独立した状態モデルを持つ
  - 書籍検索は 5 検索軸（キーワード / タイトル / 著者 / ISBN / ジャンル）
  - NFR B.1.1.2 Lv1（総容量 100GB 未満）/ B.1.1.1 Lv1（同時アクセス〜100）/ B.2.1.1 Lv3（レスポンス 5 秒以内）
  - NFR E.6.1.1 Lv1（機密データ暗号化）/ E.7.1.1 Lv2（監査ログ）
  - 貸出・返却・予約の登録は書籍状態・利用者状態・予約順位まで整合が必要（トランザクション要件）
decision: |
  - 状態モデルを持つ 6 エンティティ（E-001 書籍 / E-002 利用者 / E-004 貸出 / E-005 予約 / E-006 通知 /
    E-007 統計レポート）を event_snapshot とし、状態遷移の履歴を保持する。
    E-003 利用者アカウントは状態モデルを持たない単純マスタのため resource_mutable とし、
    役割変更の履歴は監査ログ（NFR E.7.1.1 Lv2）側で担保する。E-002 : E-003 は 1:1。
  - 正データは RDB に単一集約する。書籍検索は RDB の全文索引 + ISBN / ジャンルの複合索引で実現し、
    専用検索エンジンティアは導入しない。
  - KVS（Cache）には派生エンティティのみを置く: E-901 セッション情報 / E-902 通知送信冪等キー。
    加えて E-001 の書誌情報に Cache-Aside を適用するが、書籍状態（在庫状況）は都度 RDB を参照して鮮度を落とさない。
  - 予約の取置き期限（hold_expires_at）は nullable でスナップショットに保持する
    （イミュータブル原則の明示的例外。日次判定をインデックス検索 1 本で処理するため）。
  - 貸出期間ルール（利用者区分 → 貸出日数）はエンティティ化せず External Configuration Store として保持し、KVS にキャッシュする。
  - Object Storage はバックアップ（日次フル + 差分・7 世代・遠隔地保管）と静的コンテンツに用いる。
consequences:
  positive:
    - "追加ミドルウェアなしで 5 検索軸を実現でき、レスポンスタイム 5 秒以内（B.2.1.1 Lv3）を満たせる"
    - "トランザクション整合が必要なエンティティが同一 RDB に収まり、単一トランザクションで処理できる"
    - "状態遷移の履歴が event_snapshot として残り、監査ログ要件（E.7.1.1 Lv2）と補完関係になる"
    - "在庫状況の鮮度を落とさずに検索一覧の描画コストを下げられる"
  negative:
    - "日本語形態素解析の検索精度は専用検索エンジンに劣る"
    - "hold_expires_at の nullable 保持はイミュータブル原則の例外であり、意味の説明を仕様に残す必要がある"
    - "貸出期間ルールを設定値として持つため、変更履歴が残らない"
    - "キャッシュヒット時も在庫状況取得のため RDB クエリが 1 本残る"
alternatives_considered:
  - name: "専用検索エンジンティアを導入する"
    reason_rejected: "蔵書数万件・総容量 100GB 未満・同時アクセス〜100 で、RDB の全文索引で目標性能を満たせる。運用対象を増やす価値がない"
  - name: "E-003 利用者アカウントを event_snapshot とし役割変更履歴を保持する"
    reason_rejected: "状態モデルを持たない単純マスタであり、履歴要求は監査ログで代替できる。実装が重くなるだけ"
  - name: "E-007 統計レポートを永続化せず都度集計する"
    reason_rejected: "状態.tsv の「統計レポート状態」に反し、ターンアラウンド 10 秒（B.2.1.3）を安定して満たせない"
  - name: "貸出期間ルールをエンティティ化して RDB に持つ"
    reason_rejected: "RDRA の情報.tsv に存在しないエンティティを増やすことになり、モデルと要件の対応が崩れる"
