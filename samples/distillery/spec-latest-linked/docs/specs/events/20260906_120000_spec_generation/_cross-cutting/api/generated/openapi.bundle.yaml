{
  "components": {
    "parameters": {
      "BookIdPath": {
        "description": "書籍 ID",
        "in": "path",
        "name": "book_id",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/BookId"
        }
      },
      "IdempotencyKeyHeader": {
        "description": "UUID v4を必須とする。欠落時400 IDEMPOTENCY_KEY_REQUIRED、不正時400 INVALID_REQUEST。同一キー再送時の原子性・保存期間・回復手順は未確定。元出力の24時間TTLを確定仕様として継承せず、spec内の技術判断対象とする。",
        "in": "header",
        "name": "X-Idempotency-Key",
        "required": true,
        "schema": {
          "format": "uuid",
          "type": "string"
        }
      },
      "UserNoPath": {
        "description": "利用者番号",
        "in": "path",
        "name": "user_no",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/UserNo"
        }
      }
    },
    "responses": {
      "BadRequest": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        },
        "description": "バリデーションエラー（入力値が不正）"
      },
      "BusinessRuleViolation": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/BusinessRuleViolationResponse"
            }
          }
        },
        "description": "業務ルール違反（条件の未充足、状態の競合、楽観ロック競合）"
      },
      "Forbidden": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        },
        "description": "認可エラー（ロール不足、または本人限定参照に違反）"
      },
      "NotFound": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        },
        "description": "リソース未存在"
      },
      "TemporarilyUnavailable": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/TemporarilyUnavailableResponse"
            }
          }
        },
        "description": "現在確定結果を返せない。一時的な接続障害・永続化失敗に対する技術応答。未更新を保証しない。クライアントは結果不明状態として扱い、CR006の回復規則確定まで自動再送しない。"
      },
      "Unauthorized": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/UnauthorizedResponse"
            }
          }
        },
        "description": "認証エラー。次の 3 条件のときだけ返す。\n`UNAUTHENTICATED`（`Authorization` ヘッダ欠落 / Bearer 以外 / 署名不正）、\n`TOKEN_EXPIRED`（`exp` 超過）、`IDENTITY_CLAIM_MISSING`（`sub` / `role` /\n`role = 利用者` のときの `user_no` が欠落）。\n認証は成立しておりロール・所有者が不足する場合は 403（`FORBIDDEN`）とする。\n",
        "headers": {
          "WWW-Authenticate": {
            "description": "RFC 6750 の challenge。常に `Bearer realm=\"libra\"` で始め、\n`error=\"invalid_token\"` と `error_description` にエラーコードを載せる。\n",
            "required": true,
            "schema": {
              "examples": [
                "Bearer realm=\"libra\", error=\"invalid_token\", error_description=\"TOKEN_EXPIRED\""
              ],
              "type": "string"
            }
          }
        }
      }
    },
    "schemas": {
      "AvailabilityStatus": {
        "description": "在庫状況区分のwire値。導出規則は docs/rdra/latest/条件.tsv の書籍検索条件を参照。",
        "enum": [
          "在庫あり",
          "貸出中",
          "予約待ち"
        ],
        "type": "string",
        "x-enum-varnames": [
          "AVAILABLE",
          "ON_LOAN",
          "RESERVED"
        ]
      },
      "BookAvailabilityResponse": {
        "description": "書籍詳細と在庫状況の応答",
        "properties": {
          "availability": {
            "$ref": "#/components/schemas/AvailabilityStatus"
          },
          "book": {
            "$ref": "#/components/schemas/BookSummary"
          },
          "guidance": {
            "description": "利用者への次の行動の案内文（貸出できます / 予約できます 等）",
            "type": "string"
          },
          "reservable": {
            "description": "予約可能か。正本は docs/rdra/latest/条件.tsv の予約可否条件。",
            "type": "boolean"
          },
          "reservation_count": {
            "description": "予約待ち件数。対象状態と集計条件は docs/rdra/latest/条件.tsv / docs/rdra/latest/状態.tsv を参照。",
            "minimum": 0,
            "type": "integer"
          }
        },
        "required": [
          "book",
          "availability",
          "reservation_count",
          "reservable",
          "guidance"
        ],
        "type": "object"
      },
      "BookId": {
        "description": "書籍を一意に識別する ID",
        "examples": [
          "BK-00000123"
        ],
        "maxLength": 36,
        "minLength": 1,
        "type": "string"
      },
      "BookStatus": {
        "description": "書籍状態のwire値。意味・遷移は docs/rdra/latest/状態.tsv の書籍状態を参照。CR002の分岐優先順位は未確定。",
        "enum": [
          "在庫あり",
          "貸出中",
          "予約待ち"
        ],
        "type": "string",
        "x-enum-varnames": [
          "AVAILABLE",
          "ON_LOAN",
          "RESERVED"
        ]
      },
      "BookSummary": {
        "description": "書籍の要約情報（一覧・関連表示用）",
        "properties": {
          "author": {
            "description": "著者",
            "maxLength": 100,
            "type": "string"
          },
          "book_id": {
            "$ref": "#/components/schemas/BookId"
          },
          "book_status": {
            "$ref": "#/components/schemas/BookStatus"
          },
          "genre": {
            "$ref": "#/components/schemas/Genre"
          },
          "isbn": {
            "description": "ISBN（13 桁または 10 桁。未設定の場合は null）",
            "type": [
              "string",
              "null"
            ]
          },
          "material_type": {
            "$ref": "#/components/schemas/MaterialType"
          },
          "publisher": {
            "description": "出版社",
            "maxLength": 100,
            "type": "string"
          },
          "registered_at": {
            "description": "登録日時",
            "format": "date-time",
            "type": "string"
          },
          "title": {
            "description": "タイトル",
            "maxLength": 200,
            "type": "string"
          },
          "updated_at": {
            "description": "更新日時",
            "format": "date-time",
            "type": "string"
          }
        },
        "required": [
          "book_id",
          "title",
          "author",
          "publisher",
          "genre",
          "material_type",
          "book_status"
        ],
        "type": "object"
      },
      "BusinessRuleViolationResponse": {
        "description": "業務ルール違反の応答。未充足の条件を `reasons` に列挙する",
        "properties": {
          "code": {
            "description": "違反した条件を示すエラーコード",
            "examples": [
              "BOOK_NOT_DELETABLE"
            ],
            "type": "string"
          },
          "message": {
            "description": "利用者向けのエラーメッセージ",
            "type": "string"
          },
          "reasons": {
            "description": "未充足の理由（条件名とその説明）",
            "items": {
              "type": "string"
            },
            "type": "array"
          },
          "trace_id": {
            "description": "リクエスト追跡 ID",
            "type": "string"
          }
        },
        "required": [
          "code",
          "message",
          "reasons"
        ],
        "type": "object"
      },
      "CreateLoanRequest": {
        "description": "貸出登録リクエスト",
        "properties": {
          "book_id": {
            "$ref": "#/components/schemas/BookId"
          },
          "loan_period_type": {
            "$ref": "#/components/schemas/LoanPeriodType"
          },
          "user_no": {
            "$ref": "#/components/schemas/UserNo"
          }
        },
        "required": [
          "book_id",
          "user_no",
          "loan_period_type"
        ],
        "type": "object"
      },
      "EligibilityReason": {
        "description": "貸出可否判定の根拠となる条件 1 件",
        "properties": {
          "condition_name": {
            "description": "条件名（貸出可否条件 / 取置き中書籍貸出条件 等）",
            "type": "string"
          },
          "detail": {
            "description": "判定の詳細説明",
            "type": "string"
          },
          "satisfied": {
            "description": "その条件を満たすか",
            "type": "boolean"
          }
        },
        "required": [
          "condition_name",
          "satisfied"
        ],
        "type": "object"
      },
      "ErrorResponse": {
        "description": "エラー応答の共通形式",
        "properties": {
          "code": {
            "description": "エラーコード",
            "examples": [
              "VALIDATION_ERROR"
            ],
            "type": "string"
          },
          "details": {
            "description": "項目単位のエラー内訳",
            "items": {
              "properties": {
                "field": {
                  "description": "エラー対象の項目名",
                  "type": "string"
                },
                "message": {
                  "description": "項目単位のエラーメッセージ",
                  "type": "string"
                }
              },
              "required": [
                "field",
                "message"
              ],
              "type": "object"
            },
            "type": "array"
          },
          "message": {
            "description": "利用者向けのエラーメッセージ",
            "type": "string"
          },
          "trace_id": {
            "description": "リクエスト追跡 ID（問い合わせ時の識別子）",
            "type": "string"
          }
        },
        "required": [
          "code",
          "message"
        ],
        "type": "object"
      },
      "Genre": {
        "description": "ジャンル（バリエーション: ジャンル）",
        "enum": [
          "文学",
          "人文",
          "社会科学",
          "自然科学",
          "技術",
          "芸術",
          "児童",
          "その他"
        ],
        "type": "string",
        "x-enum-varnames": [
          "LITERATURE",
          "HUMANITIES",
          "SOCIAL_SCIENCE",
          "NATURAL_SCIENCE",
          "TECHNOLOGY",
          "ART",
          "CHILDREN",
          "OTHER"
        ]
      },
      "HoldSummary": {
        "description": "対象書籍に取置き中の予約がある場合のその予約情報",
        "properties": {
          "hold_expires_at": {
            "description": "取置き期限",
            "format": "date-time",
            "type": "string"
          },
          "holder_user_no": {
            "$ref": "#/components/schemas/UserNo"
          },
          "priority": {
            "description": "予約順位",
            "minimum": 1,
            "type": "integer"
          },
          "reservation_id": {
            "$ref": "#/components/schemas/ReservationId"
          }
        },
        "required": [
          "reservation_id",
          "priority",
          "holder_user_no"
        ],
        "type": "object"
      },
      "LoanEligibilityRequest": {
        "description": "貸出可否判定リクエスト",
        "properties": {
          "book_id": {
            "$ref": "#/components/schemas/BookId"
          },
          "user_no": {
            "$ref": "#/components/schemas/UserNo"
          }
        },
        "required": [
          "book_id",
          "user_no"
        ],
        "type": "object"
      },
      "LoanEligibilityResponse": {
        "description": "貸出可否の判定結果（永続化しない）",
        "properties": {
          "book": {
            "$ref": "#/components/schemas/BookSummary"
          },
          "eligible": {
            "description": "貸出を許可できるか",
            "type": "boolean"
          },
          "hold": {
            "$ref": "#/components/schemas/HoldSummary"
          },
          "reasons": {
            "description": "評価した条件と充足状況",
            "items": {
              "$ref": "#/components/schemas/EligibilityReason"
            },
            "type": "array"
          },
          "user": {
            "$ref": "#/components/schemas/LoanTargetResponse"
          }
        },
        "required": [
          "eligible",
          "reasons",
          "book",
          "user"
        ],
        "type": "object"
      },
      "LoanId": {
        "description": "貸出を一意に識別する ID",
        "examples": [
          "LN-00000456"
        ],
        "maxLength": 36,
        "minLength": 1,
        "type": "string"
      },
      "LoanPeriodType": {
        "description": "貸出期間区分のwire値。正本は docs/rdra/latest/バリエーション.tsv の貸出期間区分。期間日数・利用者区分ごとの適用集合はCR001で未確定。",
        "enum": [
          "標準",
          "短期",
          "長期"
        ],
        "type": "string",
        "x-enum-varnames": [
          "STANDARD",
          "SHORT",
          "LONG"
        ]
      },
      "LoanResponse": {
        "description": "登録された貸出の応答型。期限計算は docs/rdra/latest/条件.tsv の返却期限設定条件を参照。CR001の未確定事項を補完しない。",
        "properties": {
          "book_id": {
            "$ref": "#/components/schemas/BookId"
          },
          "book_status": {
            "$ref": "#/components/schemas/BookStatus"
          },
          "due_date": {
            "description": "返却期限",
            "format": "date",
            "type": "string"
          },
          "loan_date": {
            "description": "貸出日",
            "format": "date",
            "type": "string"
          },
          "loan_id": {
            "$ref": "#/components/schemas/LoanId"
          },
          "loan_period_type": {
            "$ref": "#/components/schemas/LoanPeriodType"
          },
          "loan_status": {
            "$ref": "#/components/schemas/LoanStatus"
          },
          "reservation_id": {
            "description": "関連する予約ID。値を返す業務条件と状態遷移は docs/rdra/latest/条件.tsv / docs/rdra/latest/状態.tsv の予約モデルを参照（CR002）。",
            "oneOf": [
              {
                "$ref": "#/components/schemas/ReservationId"
              },
              {
                "type": "null"
              }
            ]
          },
          "user_no": {
            "$ref": "#/components/schemas/UserNo"
          }
        },
        "required": [
          "loan_id",
          "book_id",
          "user_no",
          "loan_date",
          "loan_period_type",
          "due_date",
          "loan_status",
          "book_status"
        ],
        "type": "object"
      },
      "LoanStatus": {
        "description": "貸出状態のwire値。意味・遷移は docs/rdra/latest/状態.tsv の貸出状態を参照。",
        "enum": [
          "貸出中",
          "返却済み",
          "延滞"
        ],
        "type": "string",
        "x-enum-varnames": [
          "ON_LOAN",
          "RETURNED",
          "OVERDUE"
        ]
      },
      "LoanTargetResponse": {
        "description": "貸出対象利用者（利用者カード情報）",
        "properties": {
          "loanable": {
            "description": "貸出可否条件の利用者側判定結果。docs/rdra/latest/条件.tsv を参照。CR003で未確定。",
            "type": "boolean"
          },
          "name": {
            "description": "氏名",
            "type": "string"
          },
          "reason": {
            "description": "`loanable` が false のときの理由",
            "type": "string"
          },
          "user_category": {
            "$ref": "#/components/schemas/UserCategory"
          },
          "user_no": {
            "$ref": "#/components/schemas/UserNo"
          },
          "user_status": {
            "$ref": "#/components/schemas/UserStatus"
          }
        },
        "required": [
          "user_no",
          "name",
          "user_category",
          "user_status",
          "loanable"
        ],
        "type": "object"
      },
      "MaterialType": {
        "description": "資料種別のwire値。正本は docs/rdra/latest/バリエーション.tsv の資料種別。利用可能範囲は docs/rdra/latest/条件.tsv の資料種別利用可否条件を参照。",
        "enum": [
          "紙書籍",
          "電子書籍"
        ],
        "type": "string",
        "x-enum-varnames": [
          "PAPER_BOOK",
          "EBOOK"
        ]
      },
      "ReservationId": {
        "description": "予約を一意に識別する ID",
        "examples": [
          "RS-00000789"
        ],
        "maxLength": 36,
        "minLength": 1,
        "type": "string"
      },
      "TemporarilyUnavailableResponse": {
        "allOf": [
          {
            "$ref": "#/components/schemas/ErrorResponse"
          },
          {
            "properties": {
              "code": {
                "const": "TEMPORARILY_UNAVAILABLE",
                "type": "string"
              }
            },
            "required": [
              "code"
            ],
            "type": "object"
          }
        ]
      },
      "UnauthorizedCode": {
        "description": "401 のエラーコード。\n`UNAUTHENTICATED` = ヘッダ欠落 / Bearer 以外 / 署名不正、\n`TOKEN_EXPIRED` = `exp` 超過、\n`IDENTITY_CLAIM_MISSING` = 必須クレーム欠落。\n",
        "enum": [
          "UNAUTHENTICATED",
          "TOKEN_EXPIRED",
          "IDENTITY_CLAIM_MISSING"
        ],
        "type": "string",
        "x-enum-varnames": [
          "UNAUTHENTICATED",
          "TOKEN_EXPIRED",
          "IDENTITY_CLAIM_MISSING"
        ]
      },
      "UnauthorizedResponse": {
        "description": "認証エラーの応答。`ErrorResponse` の `code` を 3 値に限定したもの。\n利用者識別情報の受け渡しは Bearer トークンのクレームだけであり、\n識別用の独自ヘッダが送られても認証結果は変わらない。\n",
        "properties": {
          "code": {
            "$ref": "#/components/schemas/UnauthorizedCode"
          },
          "message": {
            "description": "利用者向けのエラーメッセージ（識別子・トークンの中身を含めない）",
            "examples": [
              "再度ログインしてください"
            ],
            "type": "string"
          },
          "trace_id": {
            "description": "リクエスト追跡 ID",
            "type": "string"
          }
        },
        "required": [
          "code",
          "message"
        ],
        "type": "object"
      },
      "UserCategory": {
        "description": "利用者区分のwire値。正本は docs/rdra/latest/バリエーション.tsv の利用者区分。貸出期間との対応はCR001で未確定。",
        "enum": [
          "一般",
          "学生",
          "団体"
        ],
        "type": "string",
        "x-enum-varnames": [
          "GENERAL",
          "STUDENT",
          "GROUP"
        ]
      },
      "UserNo": {
        "description": "利用者を一意に識別する利用者番号",
        "examples": [
          "U-000123"
        ],
        "maxLength": 20,
        "minLength": 1,
        "type": "string"
      },
      "UserStatus": {
        "description": "利用者状態のwire値。意味・遷移は docs/rdra/latest/状態.tsv の利用者状態を参照。CR003の利用可能状態対応は未確定。",
        "enum": [
          "登録済み",
          "取引進行中"
        ],
        "type": "string",
        "x-enum-varnames": [
          "REGISTERED",
          "IN_TRANSACTION"
        ]
      }
    },
    "securitySchemes": {
      "bearerAuth": {
        "bearerFormat": "JWT",
        "description": "外部マネージド IdP（OAuth2/OIDC）が発行したアクセストークン。\nAPI Gateway でトークンを検証し、`sub`（user_id）・役割（司書 / 利用者）・利用者番号を\nクレームとしてバックエンド API へ伝播する。\n\n本 API における利用者識別情報の送信方法はこのスキームだけであり、識別用の独自ヘッダ\n（`X-User-No` 等）は定義しない。必須クレームと 401 の条件は `info.description`\n「利用者識別情報の送信方法」に従う。\n\n必須クレーム:\n\n| クレーム | 型 | 必須 | 説明 |\n|---|---|---|---|\n| `sub` | string | 常に必須 | IdP のアカウント ID。監査ログの操作者 ID に使う |\n| `role` | string | 常に必須 | `司書` または `利用者`。RBAC の粗粒度判定に使う |\n| `user_no` | string | `role = 利用者` のとき必須 | 本人限定参照の絞り込み条件の唯一の入力 |\n| `exp` | integer | 常に必須 | 失効時刻。超過時は `TOKEN_EXPIRED` |\n",
        "scheme": "bearer",
        "type": "http"
      }
    }
  },
  "info": {
    "contact": {
      "name": "Libra 開発チーム",
      "url": "https://libra.example.com/support"
    },
    "description": "DRAFT: 貸出登録と参照依存3操作の契約。現行pipeline出力から型・制約を移行。RDRA/latestの業務条件不足はpipeline還流リクエストで解決し、対応する分岐の実装は保留する。冪等性の保存方式・障害回復・保持期間も未決定であり、このbundleだけで実装可とは判定しない。",
    "license": {
      "name": "Proprietary",
