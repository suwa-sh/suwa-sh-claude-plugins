openapi: "3.1.0"
info:
  title: "Libro API"
  version: "1.0.0"
  summary: "図書館蔵書管理システム Libro の統合 REST API 仕様（全 27 UC 集約）"
  description: |
    図書館蔵書管理システム（brand: Libro）の Backend API を Contract First で定義する OpenAPI 3.1 仕様。
    全 UC の `_api-summary.yaml` を集約し、`_review/api-conventions.md` の規約に揃えている。

    ## 規約
    - パスは `/api/v1/` プレフィックス、リソース名は複数形 kebab-case、JSON フィールドは camelCase。
    - enum は英語 UPPER_SNAKE_CASE。description に RDRA の日本語表記を併記する。
    - エラーは RFC 9457 `application/problem+json`（`type` / `title` / `status` / `detail` / `instance` + 拡張 `code` / `traceId`）。
    - 一覧は `page`（1 始まり）/ `pageSize`（既定 20、上限 100）の offset ページネーション。レスポンスは `items[]` / `page` / `pageSize` / `totalCount`。
    - 状態変更操作（POST / PUT / DELETE）は `Idempotency-Key` ヘッダで冪等化する（tier-frontend-staff SR-005 ダブルサブミット防止）。
    - 楽観ロックはリクエストボディの `version` または `If-Match` ヘッダで行い、競合は 409 `OPTIMISTIC_LOCK_CONFLICT` を返す。
    - 500 `INTERNAL_ERROR` は全 operation 共通の横断エラー（共通エラーハンドラが返す）であり、operation ごとの `responses` にも
      UC 側 `_api-summary.yaml` の `errors` にも個別宣言しない。業務条件に紐づく 500（例: `POST /api/v1/loans` の
      `LOAN_PERIOD_NOT_CONFIGURED`）だけを明示宣言する。
    - `x-roles` と UC 側 `roles` は同じ語彙の 1 対 1 対応（STAFF=司書 / PATRON=利用者 / ANONYMOUS=匿名）で、
      UC 側は単一トークンのリストのみを使う。「本人のみ」は roles ではなく `_api-summary.yaml` の `ownership: self` で表す。

    ## 経路と認可
    - 公開経路（利用者向け）: `books` / `genres` の参照、`reservations` の登録・参照・取消、`me` 配下。API Gateway が IdP 発行トークンを検証する。
    - 館内経路（司書向け）: `users` / `loans` / `returns` / `notifications` / `reports`。館内ネットワークからのみ到達可能（SP-007）。
    - 各操作の `x-roles` に許可ロール（STAFF=司書 / PATRON=利用者 / ANONYMOUS=匿名）を記載する。本人限定判定（PATRON はトークンの利用者番号と一致するデータのみ）は Backend API が行う（SP-011）。
    - 連絡先マスク方針: 館内経路の一覧・登録系（`UserSummary` を返す `GET /loans` / `POST /loans` / `POST /loans/{loanId}/return` / `GET /returns/lookup`）は司書の窓口業務で本人確認に平文メールアドレスが必要なため平文固定とする。
      照会系（`UserUsageProfile` / `RecipientSummary` / `NotificationLogItem`）は既定でマスクし、`reveal=true` のときのみ平文を返して監査ログに記録する（意図的な差）。
    - 公開経路の全操作は API Gateway のレート制限対象であり 429 `TooManyRequests` を返しうる。館内経路にはレート制限を掛けない。
  license:
    name: "Proprietary"
    url: "https://libro.example.com/license"
  contact:
    name: "Libro API Team"
    email: "api@libro.example.com"
servers:
  - url: "https://api.libro.example.com"
    description: "本番環境（プレースホルダ）。公開経路 / 館内経路は API Gateway が接続元で分離する"
  - url: "https://api.stg.libro.example.com"
    description: "ステージング環境（プレースホルダ）"
  - url: "http://localhost:8080"
    description: "ローカル開発環境"
security:
  - bearerAuth: []
tags:
  - name: "books"
    description: "書籍（蔵書管理 BC）。検索・詳細・登録・編集・削除"
  - name: "genres"
    description: "ジャンル（蔵書管理 BC）。検索条件の選択肢"
  - name: "loans"
    description: "貸出（貸出管理 BC）。貸出可否照会・貸出登録・返却・延滞一覧"
  - name: "reservations"
    description: "予約（予約管理 BC）。予約可否照会・予約登録・予約詳細・取消・書籍別予約一覧"
  - name: "notifications"
    description: "通知（通知管理 BC）。返却通知の送信と送信記録"
  - name: "me"
    description: "本人限定の利用状況（利用者サービス）。トークンの利用者番号に紐づく貸出履歴・予約状況"
  - name: "users"
    description: "利用者（利用者管理 BC）。登録・編集・削除・一覧・利用状況照会"
  - name: "reports"
    description: "運営分析（運営分析 BC）。在庫状況一覧・人気書籍ランキング・期間別貸出統計"

paths:
  # ---------------------------------------------------------------- books
  /api/v1/books:
    get:
      tags: ["books"]
      operationId: "listBooks"
      summary: "書籍を検索・一覧取得する"
      description: |
        検索条件種別（`searchType`）に応じたストラテジーで書籍を照合し、offset ページネーションで返す。
        - `keyword`（既定）: タイトル・著者・ISBN・出版社を正規化した部分一致で横断検索
        - `title` / `author` / `isbn`: 該当属性のみ照合（`isbn` は `q` のハイフンを除去した部分一致。DB はハイフンなしの正規形で保存する）
        - `genre`: `genreId` と一致する書籍
        `status` で書籍の状態による絞り込みも可能。匿名アクセス可（公開経路）。

        UC: 書籍を検索する / 書籍一覧を参照する
      security:
        - {}
        - bearerAuth: []
      x-roles: ["STAFF", "PATRON", "ANONYMOUS"]
      parameters:
        - name: "searchType"
          in: "query"
          description: "検索条件種別: keyword（キーワード）/ title（タイトル）/ author（著者）/ isbn（ISBN）/ genre（ジャンル）。省略時 keyword"
          schema:
            $ref: "#/components/schemas/SearchType"
        - name: "q"
          in: "query"
          description: "検索語。`searchType` が genre 以外のときに使用。前後空白は除去して正規化する"
          schema:
            type: "string"
            maxLength: 200
            examples: ["夏目漱石"]
        - name: "genreId"
          in: "query"
          description: "ジャンル ID による絞り込み（`searchType=genre` のときは必須）"
          schema:
            type: "string"
            examples: ["literature"]
        - name: "status"
          in: "query"
          description: "書籍の状態による絞り込み"
          schema:
            $ref: "#/components/schemas/BookStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "検索結果（0 件のときも 200 で空の `items`）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: ["books"]
      operationId: "createBook"
      summary: "書籍を登録する"
      description: |
        書籍を登録し、書籍 ID を採番する。登録直後の状態は AVAILABLE（在庫あり）。
        媒体種別を省略した場合は PAPER（紙）。ELECTRONIC（電子）は登録のみ可能で貸出・予約は受け付けない（条件: 媒体種別判定）。

        UC: 書籍を登録する
      x-roles: ["STAFF"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookRequest"
      responses:
        "201":
          description: "登録完了。`Location` に登録した書籍の URL を返す"
          headers:
            Location:
              description: "登録した書籍のリソース URL"
              schema:
                type: "string"
                format: "uri-reference"
                examples: ["/api/v1/books/bk_01HZX0M4V8Q7K2N3R5T6Y7A8B9"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/books/{bookId}:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      tags: ["books"]
      operationId: "getBook"
      summary: "書籍詳細と在庫状況を取得する"
      description: |
        書籍 ID で書籍の詳細と在庫状況（書籍の状態・予約待ち人数）を返す。
        匿名アクセス可（公開経路）。`version` は司書経路のみ返却し、公開経路では省略する。

        UC: 書籍詳細を参照する / 書籍を編集する
      security:
        - {}
        - bearerAuth: []
      x-roles: ["STAFF", "PATRON", "ANONYMOUS"]
      responses:
        "200":
          description: "書籍詳細"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags: ["books"]
      operationId: "updateBook"
      summary: "書籍情報を更新する"
      description: |
        タイトル・著者・ISBN・出版社・ジャンル・媒体種別を更新する（全項目置換）。
        `version` による楽観ロックを行い、競合時は 409 `OPTIMISTIC_LOCK_CONFLICT`。書籍の状態は本 API では変更しない。

        UC: 書籍を編集する
      x-roles: ["STAFF"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookRequest"
      responses:
        "200":
          description: "更新後の書籍"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: ["books"]
      operationId: "deleteBook"
      summary: "書籍を削除する"
      description: |
        在庫あり（AVAILABLE）の書籍のみ削除できる。貸出中・予約待ちの書籍は 409 `BOOK_NOT_DELETABLE`。
        `If-Match` に `version` を指定した場合は楽観ロックを行う。

        UC: 書籍を削除する
      x-roles: ["STAFF"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: "削除完了"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/books/{bookId}/reservation-eligibility:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      tags: ["reservations"]
      operationId: "getReservationEligibility"
      summary: "予約可否を照会する"
      description: |
        書籍の状態・媒体種別・自分の有効予約の有無・待ち人数から予約可否を判定して返す。
        書籍が AVAILABLE（在庫あり）のときは予約できない（条件: 予約可否判定）。

        UC: 予約を登録する
      x-roles: ["PATRON", "STAFF"]
      responses:
        "200":
          description: "予約可否"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationEligibilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/books/{bookId}/reservations:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      tags: ["reservations"]
      operationId: "listBookReservations"
      summary: "書籍別の予約一覧を取得する"
      description: |
        指定書籍の予約を予約順位順に返す。既定では有効予約（RESERVED / NOTIFIED）のみ。
        `includeClosed=true` で取消・終了（CANCELLED / CLOSED）も含める。

        UC: 予約一覧を参照する
      x-roles: ["STAFF"]
      parameters:
        - $ref: "#/components/parameters/IncludeClosed"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "予約一覧"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookReservationPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --------------------------------------------------------------- genres
  /api/v1/genres:
    get:
      tags: ["genres"]
      operationId: "listGenres"
      summary: "ジャンル一覧を取得する"
      description: |
        書籍登録・検索条件の選択肢となるジャンル一覧を返す（文学・社会科学・自然科学・技術・芸術・歴史・児童書・その他）。
        匿名アクセス可（公開経路）。

        UC: 書籍を検索する / 書籍一覧を参照する
      security:
        - {}
        - bearerAuth: []
      x-roles: ["STAFF", "PATRON", "ANONYMOUS"]
      responses:
        "200":
          description: "ジャンル一覧"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreListResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------- loans
  /api/v1/loans:
    get:
      tags: ["loans"]
      operationId: "listLoans"
      summary: "貸出一覧を取得する（延滞・督促状況）"
      description: |
        貸出を条件で絞り込んで返す。延滞一覧では `status=OVERDUE` と `include=latestNotice` を指定し、
        各貸出の最新の督促送信記録と延滞日数を取得する。`summary` には延滞件数・督促失敗件数・送信待ち件数を返す。
        `reveal=true` のとき `items[].latestNotice.recipientEmail` を開示し、データアクセス監査ログに記録する（NFR E.1.2.1 / E.6.1.1）。

        UC: 延滞一覧を参照する
      x-roles: ["STAFF"]
      parameters:
        - $ref: "#/components/parameters/Reveal"
        - name: "status"
          in: "query"
          description: "貸出の状態による絞り込み"
          schema:
            $ref: "#/components/schemas/LoanStatus"
        - name: "userNumber"
          in: "query"
          description: "利用者番号による絞り込み"
          schema:
            type: "string"
            examples: ["U000123"]
        - name: "include"
          in: "query"
          description: "追加で含める関連情報。`latestNotice` で最新の通知記録を各項目に含める"
          schema:
            type: "string"
            description: "追加で含める関連情報: latestNotice（最新の通知記録）"
            enum: ["latestNotice"]
        - name: "sort"
          in: "query"
          description: "並び順: dueDate（返却期限昇順）/ overdueDays（延滞日数降順）/ lastNotice（最終督促日時降順）"
          schema:
            type: "string"
            description: "並び順: dueDate（返却期限昇順）/ overdueDays（延滞日数降順）/ lastNotice（最終督促日時降順）"
            enum: ["dueDate", "overdueDays", "lastNotice"]
            default: "dueDate"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "貸出一覧（延滞・督促状況つき）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverdueLoanListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: ["loans"]
      operationId: "createLoan"
      summary: "貸出を登録する"
      description: |
        利用者番号と書籍 ID で貸出を登録する。書籍を ON_LOAN（貸出中）に遷移させ、返却期限を「貸出日 + 貸出期間」で自動設定する。
        貸出可否判定（条件: 貸出可否判定）に反する場合は 409 を返す:
        - `BOOK_NOT_AVAILABLE`: 書籍が貸出中または予約待ち（予約順位 1 位の利用者を除く）
        - `RESERVATION_PRIORITY_MISMATCH`: 予約待ち書籍を予約順位 1 位以外の利用者に貸し出そうとした
        - `MEDIA_TYPE_NOT_LOANABLE`: 電子書籍は貸出対象外

        UC: 貸出を登録する
      x-roles: ["STAFF"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoanRequest"
      responses:
        "201":
          description: "貸出登録完了"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/loans/eligibility:
    get:
      tags: ["loans"]
      operationId: "getLoanEligibility"
      summary: "貸出可否を照会する"
      description: |
        利用者番号と書籍 ID から貸出可否を判定し、可能な場合は返却期限の予定日と貸出期間を返す。
        貸出登録前の確認画面で使用する（判定結果と根拠を同時に示す）。

        UC: 貸出を登録する
      x-roles: ["STAFF"]
      parameters:
        - name: "userNumber"
          in: "query"
          required: true
          description: "貸出先の利用者番号"
          schema:
            type: "string"
            examples: ["U000123"]
        - name: "bookId"
          in: "query"
          required: true
          description: "貸し出す書籍の書籍 ID"
          schema:
            type: "string"
            examples: ["bk_01HZX0M4V8Q7K2N3R5T6Y7A8B9"]
      responses:
        "200":
          description: "貸出可否"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanEligibilityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/loans/{loanId}/return:
    parameters:
      - $ref: "#/components/parameters/LoanId"
    post:
      tags: ["loans"]
      operationId: "returnLoan"
      summary: "返却を登録する"
      description: |
        貸出を RETURNED（返却済み）に遷移させる。ON_LOAN / OVERDUE のいずれからも遷移可能。
        返却後の書籍状態は、予約中の予約が 1 件以上あれば RESERVED（予約待ち）、なければ AVAILABLE（在庫あり）（条件: 返却後の書籍状態判定）。
        既に返却済みの貸出は 409 `LOAN_ALREADY_RETURNED`。返却通知の送信は別 API（`POST /api/v1/notifications/return-notices`）。

        UC: 返却を登録する
      x-roles: ["STAFF"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        description: "現時点で入力項目はない（将来拡張用の空オブジェクト）"
        content:
          application/json:
