            activeCount:
              type: "integer"
              minimum: 0
              description: "有効予約（RESERVED + NOTIFIED）の件数"
              examples: [1]

    # -------------------------------------------------------- notifications
    NotificationLogItem:
      type: "object"
      description: |
        通知の送信記録。UC「返却通知を送信する」の `NotificationLog`（recipientMasked / sendResult 3 値）と
        UC「延滞一覧を参照する」の `NotificationLogItem`（recipientEmail / failureReason / sendResult 4 値）を属性の多い側で統合した。
        送信先は既定でマスク（`recipientMasked`）し、平文（`recipientEmail`）は `reveal=true` の司書経路でのみ返す。
        `GET /loans`（include=latestNotice）/ `GET /loans/{loanId}/notifications` の `reveal` も `GET /loans/{loanId}/return-notice` と同じ扱い
      required: ["notificationId", "notificationType", "recipientMasked", "requestedOn", "sendResult"]
      properties:
        notificationId:
          type: "string"
          description: "通知 ID"
          examples: ["nt_01HZX3C4D5E6F7G8H9J0K1L2M3"]
        notificationType:
          $ref: "#/components/schemas/NotificationType"
        recipientMasked:
          type: "string"
          description: "マスク済み送信先メールアドレス"
          examples: ["t***@example.com"]
        recipientEmail:
          type: "string"
          format: "email"
          description: "平文の送信先メールアドレス（`reveal=true` のときのみ）"
          examples: ["taro.yamada@example.com"]
        requestedOn:
          type: "string"
          format: "date"
          description: "送信要求日"
          examples: ["2026-09-03"]
        sentAt:
          type: ["string", "null"]
          format: "date-time"
          description: "送信日時（未送信なら null）"
          examples: ["2026-09-03T06:05:12+09:00"]
        sendResult:
          $ref: "#/components/schemas/SendResult"
        failureReason:
          type: ["string", "null"]
          description: "送信失敗理由（FAILED のとき）"
          examples: ["MAIL_DELIVERY_REJECTED"]
    NotificationLogResponse:
      type: "object"
      required: ["items"]
      properties:
        items:
          type: "array"
          description: "新しい順"
          items:
            $ref: "#/components/schemas/NotificationLogItem"
    RecipientSummary:
      type: "object"
      description: "返却通知の送信先（有効予約（RESERVED / NOTIFIED）のうち予約順位 1 位の利用者）。連絡先は既定でマスク"
      required: ["userNumber", "name", "emailMasked"]
      properties:
        userNumber:
          type: "string"
          description: "送信先利用者の利用者番号"
          examples: ["U000456"]
        name:
          type: "string"
          description: "送信先利用者の氏名"
          examples: ["鈴木 花子"]
        emailMasked:
          type: "string"
          description: "マスク済みメールアドレス"
          examples: ["h***@example.com"]
        email:
          type: "string"
          format: "email"
          description: "平文メールアドレス（`reveal=true` のときのみ）"
    ReturnNoticePreviewResponse:
      type: "object"
      required: ["loanId", "book", "reservations", "notifications", "canSend"]
      properties:
        loanId:
          type: "string"
          description: "返却済み貸出の貸出 ID"
          examples: ["ln_01HZX1A2B3C4D5E6F7G8H9J0K1"]
        book:
          $ref: "#/components/schemas/BookSummary"
        reservation:
          $ref: "#/components/schemas/ReservationSummary"
          description: "通知対象の予約（有効予約（RESERVED / NOTIFIED）のうち順位 1 位。順位 1 位が NOTIFIED でも null にしない）"
        recipient:
          $ref: "#/components/schemas/RecipientSummary"
        reservations:
          type: "array"
          description: "書籍の予約一覧（順位順）"
          items:
            $ref: "#/components/schemas/ReservationListItem"
        notifications:
          type: "array"
          description: "この書籍・予約に関する通知記録（新しい順）"
          items:
            $ref: "#/components/schemas/NotificationLogItem"
        canSend:
          type: "boolean"
          description: "送信可否（有効予約（RESERVED / NOTIFIED）の予約順位 1 位が存在し、その予約 × RETURN_NOTICE × 当日の通知レコードが未作成のとき true）"
          examples: [true]
        blockedReason:
          type: "string"
          description: "送信不可の理由コード: NO_RESERVATION_TO_NOTIFY / RETURN_NOTICE_ALREADY_SENT / LOAN_NOT_RETURNED"
          enum: ["NO_RESERVATION_TO_NOTIFY", "RETURN_NOTICE_ALREADY_SENT", "LOAN_NOT_RETURNED"]
    SendReturnNoticeRequest:
      type: "object"
      required: ["loanId"]
      properties:
        loanId:
          type: "string"
          description: "返却済み貸出の貸出 ID"
          examples: ["ln_01HZX1A2B3C4D5E6F7G8H9J0K1"]
    ReturnNoticeResponse:
      type: "object"
      description: "返却通知の送信受理結果。notificationType は常に RETURN_NOTICE"
      required: ["notificationId", "notificationType", "reservationId", "userNumber", "recipientMasked", "requestedOn", "sendResult", "reservationStatus"]
      properties:
        notificationId:
          type: "string"
          description: "作成した通知レコードの通知 ID"
          examples: ["nt_01HZX3C4D5E6F7G8H9J0K1L2M3"]
        notificationType:
          $ref: "#/components/schemas/NotificationType"
        reservationId:
          type: "string"
          description: "通知対象の予約 ID（NOTIFIED に遷移済み）"
          examples: ["rs_01HZX2B3C4D5E6F7G8H9J0K1L2"]
        userNumber:
          type: "string"
          description: "送信先利用者の利用者番号"
          examples: ["U000456"]
        recipientMasked:
          type: "string"
          description: "マスク済み送信先メールアドレス"
          examples: ["h***@example.com"]
        requestedOn:
          type: "string"
          format: "date"
          description: "送信要求日"
          examples: ["2026-09-03"]
        sendResult:
          type: "string"
          description: "受理時点では常に PENDING。結果はワーカーが更新する"
          enum: ["PENDING"]
        reservationStatus:
          type: "string"
          description: "遷移後の予約の状態（常に NOTIFIED）"
          enum: ["NOTIFIED"]

