  /api/v1/notifications/return-notices:
    post:
      tags: ["notifications"]
      operationId: "sendReturnNotice"
      summary: "返却通知を送信する"
      description: |
        返却済み貸出の書籍に有効予約（状態『予約中』RESERVED または『通知済み』NOTIFIED）がある場合、そのうち予約順位 1 位の利用者を送信先として通知レコード（RETURN_NOTICE / PENDING）を作成し、
        予約を NOTIFIED（通知済み）に遷移させ、MQ チャネル `notifications.return-notice-requested` へ配信要求を発行する（SP-013 メール送信の非同期化）。
        API 応答はメール配信サービスの結果を待たず 202 を返す。送信結果はワーカーが通知レコードに反映する。
        - 有効予約がない場合: 409 `NO_RESERVATION_TO_NOTIFY`
        - 既に送信済み: 409 `RETURN_NOTICE_ALREADY_SENT`
        - 貸出が返却済みでない: 409 `LOAN_NOT_RETURNED`

        UC: 返却通知を送信する
      x-roles: ["STAFF"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendReturnNoticeRequest"
      responses:
        "202":
          description: "送信要求を受理した（送信結果は PENDING）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnNoticeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
