      summary: "人気書籍ランキングを取得する"
      description: |
        指定期間内の貸出回数を書籍ごとに集計し、多い順に順位を付与して上位 `limit` 件を返す（条件: 人気書籍ランキング判定 / 集計期間判定）。
        `from` > `to` は 400 `INVALID_PERIOD_RANGE`。

        UC: 人気書籍ランキングを参照する
      x-roles: ["STAFF"]
      parameters:
        - $ref: "#/components/parameters/PeriodType"
        - $ref: "#/components/parameters/PeriodFrom"
        - $ref: "#/components/parameters/PeriodTo"
        - name: "limit"
          in: "query"
          description: "取得する上位件数"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "人気書籍ランキング"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PopularBooksResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/reports/loan-statistics:
    get:
      tags: ["reports"]
      operationId: "getLoanStatisticsReport"
      summary: "期間別貸出統計を取得する"
      description: |
        集計期間種別（DAY / MONTH / YEAR）と期間を指定し、粒度ごとの貸出件数の時系列（`series`）と合計・前期間合計を返す（条件: 集計期間判定）。
        `from` > `to` は 400 `INVALID_PERIOD_RANGE`。

        UC: 期間別貸出統計を参照する
      x-roles: ["STAFF"]
      parameters:
        - $ref: "#/components/parameters/PeriodType"
        - $ref: "#/components/parameters/PeriodFrom"
        - $ref: "#/components/parameters/PeriodTo"
      responses:
        "200":
          description: "期間別貸出統計"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanStatisticsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: |
        IdP（OAuth2 / OIDC）が発行するアクセストークン。クレームに主体識別子（利用者番号 `sub`）と利用者区分（`userType`: STAFF / PATRON）を含み、
        API Gateway が署名検証と経路単位の粗粒度 RBAC を、Backend API が本人限定などの細粒度判定を行う。

  parameters:
    Page:
      name: "page"
      in: "query"
      description: "ページ番号（1 始まり）"
      schema:
        type: "integer"
        minimum: 1
        default: 1
    PageSize:
      name: "pageSize"
      in: "query"
      description: "1 ページの件数（既定 20、上限 100）"
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 20
    IncludeClosed:
      name: "includeClosed"
      in: "query"
      description: "取消（CANCELLED）・終了（CLOSED）の予約も含める"
      schema:
        type: "boolean"
        default: false
    Reveal:
      name: "reveal"
      in: "query"
      description: "true のとき、マスクされた連絡先を開示する。開示はデータアクセス監査ログに記録する（NFR E.1.2.1 / E.6.1.1）"
      schema:
        type: "boolean"
        default: false
    PeriodType:
      name: "periodType"
      in: "query"
      required: true
      description: "集計期間種別"
      schema:
        $ref: "#/components/schemas/PeriodType"
    PeriodFrom:
      name: "from"
      in: "query"
      required: true
      description: "集計対象期間の開始日（含む）"
      schema:
        type: "string"
        format: "date"
        examples: ["2026-08-01"]
    PeriodTo:
      name: "to"
      in: "query"
      required: true
      description: "集計対象期間の終了日（含む）。`from` 以降であること"
      schema:
        type: "string"
        format: "date"
        examples: ["2026-08-31"]
    BookId:
      name: "bookId"
      in: "path"
      required: true
      description: "書籍 ID"
      schema:
        type: "string"
        examples: ["bk_01HZX0M4V8Q7K2N3R5T6Y7A8B9"]
    UserNumber:
      name: "userNumber"
      in: "path"
      required: true
      description: "利用者番号"
      schema:
        type: "string"
        examples: ["U000123"]
    LoanId:
      name: "loanId"
      in: "path"
      required: true
      description: "貸出 ID"
      schema:
        type: "string"
        examples: ["ln_01HZX1A2B3C4D5E6F7G8H9J0K1"]
    ReservationId:
      name: "reservationId"
      in: "path"
      required: true
      description: "予約 ID"
      schema:
        type: "string"
        examples: ["rs_01HZX2B3C4D5E6F7G8H9J0K1L2"]
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      description: |
        クライアントが生成する冪等キー（UUID v4 推奨）。同一キーの再送には初回と同じ結果を返し、状態変更を重複させない。
        保持期間は 24 時間。同一キーで異なるリクエストボディを送った場合、および同一キーの処理が進行中の場合は 409 `IDEMPOTENCY_KEY_CONFLICT`
      schema:
        type: "string"
        format: "uuid"
        examples: ["6f1c2a3e-8b4d-4c5e-9f60-1a2b3c4d5e6f"]
    IfMatch:
      name: "If-Match"
      in: "header"
      required: false
      description: "楽観ロック用。対象リソースの `version` を指定する。不一致は 409 `OPTIMISTIC_LOCK_CONFLICT`"
      schema:
        type: "string"
        examples: ["\"3\""]

  responses:
    BadRequest:
      description: "入力不正（形式エラー・必須欠落・期間指定の不整合など）"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblemDetails"
          examples:
            validation:
              summary: "クエリ不正"
              value:
                type: "https://api.libro.example.com/problems/validation-error"
                title: "Bad Request"
                status: 400
                detail: "pageSize は 1〜100 の整数を指定してください"
                instance: "/api/v1/books?pageSize=500"
                code: "VALIDATION_ERROR"
                traceId: "0af7651916cd43dd8448eb211c80319c"
                errors:
                  - field: "pageSize"
                    message: "must be <= 100"
    Unauthorized:
      description: "未認証（トークン欠落・失効・署名不正）"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            unauthenticated:
              value:
                type: "https://api.libro.example.com/problems/unauthenticated"
                title: "Unauthorized"
                status: 401
                code: "UNAUTHENTICATED"
                traceId: "0af7651916cd43dd8448eb211c80319c"
    Forbidden:
      description: "権限なし（ロール不一致・本人以外のデータ参照）"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            forbidden:
              value:
                type: "https://api.libro.example.com/problems/forbidden"
                title: "Forbidden"
                status: 403
                detail: "この操作には司書権限が必要です"
                code: "FORBIDDEN"
                traceId: "0af7651916cd43dd8448eb211c80319c"
    NotFound:
      description: "リソース不在"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            bookNotFound:
              value:
                type: "https://api.libro.example.com/problems/not-found"
                title: "Not Found"
                status: 404
                detail: "書籍 bk_01HZX0M4V8Q7K2N3R5T6Y7A8B9 は存在しません"
                instance: "/api/v1/books/bk_01HZX0M4V8Q7K2N3R5T6Y7A8B9"
                code: "BOOK_NOT_FOUND"
                traceId: "0af7651916cd43dd8448eb211c80319c"
    Conflict:
      description: |
        業務ルール違反または楽観ロック競合。`code` で理由を判別する。
        例: BOOK_NOT_AVAILABLE / RESERVATION_PRIORITY_MISMATCH / MEDIA_TYPE_NOT_LOANABLE / BOOK_NOT_DELETABLE / BOOK_NOT_ON_LOAN /
        LOAN_ALREADY_RETURNED / NO_RESERVATION_TO_NOTIFY / RETURN_NOTICE_ALREADY_SENT / LOAN_NOT_RETURNED /
        BOOK_AVAILABLE_NOT_RESERVABLE / RESERVATION_ALREADY_EXISTS / MEDIA_TYPE_NOT_RESERVABLE / RESERVATION_NOT_CANCELLABLE /
        USER_NOT_DELETABLE / SELF_DELETE_NOT_ALLOWED / MEDIA_TYPE_CHANGE_NOT_ALLOWED / OPTIMISTIC_LOCK_CONFLICT /
        CONCURRENT_UPDATE / IDEMPOTENCY_KEY_CONFLICT
        （値の正本は `ProblemDetails.code` の enum）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            bookNotAvailable:
              summary: "貸出不可"
              value:
                type: "https://api.libro.example.com/problems/book-not-available"
                title: "Conflict"
                status: 409
                detail: "貸出できません: この書籍は貸出中です"
                instance: "/api/v1/loans"
                code: "BOOK_NOT_AVAILABLE"
                traceId: "0af7651916cd43dd8448eb211c80319c"
            optimisticLock:
              summary: "楽観ロック競合"
              value:
                type: "https://api.libro.example.com/problems/optimistic-lock-conflict"
                title: "Conflict"
                status: 409
                detail: "他の司書が先に更新しました。最新の内容を再取得してください"
                code: "OPTIMISTIC_LOCK_CONFLICT"
                traceId: "0af7651916cd43dd8448eb211c80319c"
    UnprocessableEntity:
      description: "検証エラー（項目単位のエラーを `errors` に列挙）"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblemDetails"
          examples:
            validation:
              value:
                type: "https://api.libro.example.com/problems/validation-error"
                title: "Unprocessable Entity"
                status: 422
                detail: "入力内容を確認してください"
                code: "VALIDATION_ERROR"
                traceId: "0af7651916cd43dd8448eb211c80319c"
                errors:
                  - field: "isbn"
                    message: "ISBN-10 または ISBN-13 の形式で入力してください"
                  - field: "genreId"
                    message: "存在しないジャンルです"
    TooManyRequests:
      description: "レート制限超過（公開経路。API Gateway が返す）"
      headers:
        Retry-After:
          description: "再試行までの秒数"
          schema:
            type: "integer"
            examples: [30]
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InternalServerError:
      description: "サーバ内部エラー（`traceId` で問い合わせる）"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

  schemas:
    # ------------------------------------------------------------- enums
    BookStatus:
      type: "string"
      description: "書籍の状態: AVAILABLE（在庫あり）/ ON_LOAN（貸出中）/ RESERVED（予約待ち）"
      enum: ["AVAILABLE", "ON_LOAN", "RESERVED"]
      examples: ["AVAILABLE"]
    MediaType:
      type: "string"
      description: "媒体種別: PAPER（紙）/ ELECTRONIC（電子）。初期リリースは紙のみ貸出・予約対象"
      enum: ["PAPER", "ELECTRONIC"]
      examples: ["PAPER"]
    UserType:
      type: "string"
      description: "利用者区分: PATRON（利用者）/ STAFF（司書）"
      enum: ["PATRON", "STAFF"]
      examples: ["PATRON"]
    LoanStatus:
      type: "string"
      description: "貸出の状態: ON_LOAN（貸出中）/ OVERDUE（延滞）/ RETURNED（返却済み）"
      enum: ["ON_LOAN", "OVERDUE", "RETURNED"]
      examples: ["ON_LOAN"]
    ReservationStatus:
      type: "string"
      description: "予約の状態: RESERVED（予約中）/ NOTIFIED（通知済み）/ CANCELLED（取消）/ CLOSED（終了）"
      enum: ["RESERVED", "NOTIFIED", "CANCELLED", "CLOSED"]
      examples: ["RESERVED"]
    NotificationType:
      type: "string"
      description: "通知種別: RETURN_NOTICE（返却通知）/ REMINDER（返却期限リマインド）/ OVERDUE_NOTICE（延滞督促）"
      enum: ["RETURN_NOTICE", "REMINDER", "OVERDUE_NOTICE"]
      examples: ["RETURN_NOTICE"]
    SendResult:
      type: "string"
      description: "送信結果: PENDING（送信待ち）/ SUCCEEDED（成功）/ FAILED（失敗）/ SKIPPED（スキップ）"
      enum: ["PENDING", "SUCCEEDED", "FAILED", "SKIPPED"]
      examples: ["SUCCEEDED"]
    PeriodType:
      type: "string"
      description: "集計期間種別: DAY（日）/ MONTH（月）/ YEAR（年）"
      enum: ["DAY", "MONTH", "YEAR"]
      examples: ["MONTH"]
    SearchType:
      type: "string"
      description: "検索条件種別: keyword（キーワード）/ title（タイトル）/ author（著者）/ isbn（ISBN）/ genre（ジャンル）"
      enum: ["keyword", "title", "author", "isbn", "genre"]
      default: "keyword"
    DueStatus:
      type: "string"
      description: "返却期限の表示区分: OK（余裕あり）/ SOON（リマインド日数以内）/ OVERDUE（期限超過）/ RETURNED（返却済み）"
      enum: ["OK", "SOON", "OVERDUE", "RETURNED"]
      examples: ["SOON"]

    # ---------------------------------------------------------- problems
    ProblemDetails:
      type: "object"
      description: "RFC 9457 Problem Details + 拡張（`code` / `traceId`）"
      required: ["type", "title", "status", "code"]
      properties:
        type:
          type: "string"
          format: "uri"
          description: "問題種別を識別する URI"
          examples: ["https://api.libro.example.com/problems/not-found"]
        title:
          type: "string"
          description: "問題種別の短い要約（HTTP reason phrase 相当）"
          examples: ["Not Found"]
        status:
          type: "integer"
          description: "HTTP ステータスコード"
          minimum: 400
          maximum: 599
          examples: [404]
        detail:
          type: "string"
          description: "この発生に固有の説明（画面表示可能な日本語）"
          examples: ["書籍 bk_01HZX0M4V8Q7K2N3R5T6Y7A8B9 は存在しません"]
        instance:
          type: "string"
          format: "uri-reference"
          description: "問題が発生したリクエストの URI"
          examples: ["/api/v1/books/bk_01HZX0M4V8Q7K2N3R5T6Y7A8B9"]
        code:
          type: "string"
          description: |
            業務エラーコード（UPPER_SNAKE_CASE）。本 enum が業務エラーコードの正本であり、
            UC 側 `_api-summary.yaml` の `error_codes` / `errors` はここに列挙された値だけを使う。
            - BAD_REQUEST: リクエストの形式不正（400）。JSON 構文不正・必須ヘッダ欠落（Idempotency-Key）・
              `If-Match` の形式不正など、項目単位の検証に到達する前に落ちるもの。項目単位の入力値エラーは VALIDATION_ERROR を使う
            - VALIDATION_ERROR: 入力検証エラー（400 / 422）
            - UNAUTHENTICATED: 未認証（401）
            - FORBIDDEN: 権限不足（403）
            - IDEMPOTENCY_KEY_CONFLICT: 同一 Idempotency-Key で異なるリクエスト本文、または同一キーの処理が進行中（409）
            - OPTIMISTIC_LOCK_CONFLICT: 楽観ロック競合（409。version 不一致）
            - CONCURRENT_UPDATE: 同時更新の競合（409）。貸出・予約系で version 不一致、
              または予約順位の採番が一意制約に違反して再試行が必要な場合に使う
            - RATE_LIMITED: レート制限超過（429）
            - INTERNAL_ERROR: サーバ内部エラー（500）
            - BOOK_NOT_FOUND / GENRE_NOT_FOUND / USER_NOT_FOUND / LOAN_NOT_FOUND / RESERVATION_NOT_FOUND: 対象が存在しない（404）
            - BOOK_NOT_DELETABLE: 貸出中・予約中の書籍は削除できない（409）
            - BOOK_NOT_AVAILABLE: 書籍が貸出可能状態でない（409）
            - BOOK_NOT_ON_LOAN: 書籍が貸出中でない（409）
            - BOOK_AVAILABLE_NOT_RESERVABLE: 貸出可能な書籍は予約できない（409）
            - MEDIA_TYPE_NOT_LOANABLE / MEDIA_TYPE_NOT_RESERVABLE: 媒体種別が貸出・予約の対象外（409）
            - MEDIA_TYPE_CHANGE_NOT_ALLOWED: 貸出・予約が存在する書籍の媒体種別は変更できない（409）
            - USER_NOT_DELETABLE: 貸出中・予約中の利用者は削除できない（409）
            - SELF_DELETE_NOT_ALLOWED: 自分自身は削除できない（409）
            - LOAN_ALREADY_RETURNED: 貸出が既に返却済み（409）
            - LOAN_NOT_RETURNED: 貸出が未返却（409）
            - LOAN_PERIOD_NOT_CONFIGURED: 貸出期間の設定が未登録（409）
            - RESERVATION_ALREADY_EXISTS: 同一利用者・同一書籍の有効な予約が既に存在する（409）
            - RESERVATION_NOT_CANCELLABLE: 予約が取消可能な状態でない（409）
            - RESERVATION_PRIORITY_MISMATCH: 予約の順位が繰り上げ対象と一致しない（409）
            - NO_RESERVATION_TO_NOTIFY: 通知対象の予約が存在しない（409）
            - RETURN_NOTICE_ALREADY_SENT: 返却通知が送信済み（409）
            - INVALID_PERIOD_RANGE: 期間指定が不正（400）
          enum:
            - "BAD_REQUEST"
            - "VALIDATION_ERROR"
            - "UNAUTHENTICATED"
            - "FORBIDDEN"
            - "IDEMPOTENCY_KEY_CONFLICT"
            - "OPTIMISTIC_LOCK_CONFLICT"
            - "CONCURRENT_UPDATE"
            - "RATE_LIMITED"
            - "INTERNAL_ERROR"
            - "BOOK_NOT_FOUND"
            - "GENRE_NOT_FOUND"
            - "USER_NOT_FOUND"
            - "LOAN_NOT_FOUND"
            - "RESERVATION_NOT_FOUND"
            - "BOOK_NOT_DELETABLE"
            - "BOOK_NOT_AVAILABLE"
            - "BOOK_NOT_ON_LOAN"
            - "BOOK_AVAILABLE_NOT_RESERVABLE"
            - "MEDIA_TYPE_NOT_LOANABLE"
            - "MEDIA_TYPE_NOT_RESERVABLE"
            - "MEDIA_TYPE_CHANGE_NOT_ALLOWED"
            - "USER_NOT_DELETABLE"
            - "SELF_DELETE_NOT_ALLOWED"
            - "LOAN_ALREADY_RETURNED"
            - "LOAN_NOT_RETURNED"
            - "LOAN_PERIOD_NOT_CONFIGURED"
            - "RESERVATION_ALREADY_EXISTS"
            - "RESERVATION_NOT_CANCELLABLE"
            - "RESERVATION_PRIORITY_MISMATCH"
            - "NO_RESERVATION_TO_NOTIFY"
            - "RETURN_NOTICE_ALREADY_SENT"
            - "INVALID_PERIOD_RANGE"
          examples: ["BOOK_NOT_FOUND"]
        traceId:
          type: "string"
          description: "API Gateway が付与する trace_id（問い合わせ用）"
          examples: ["0af7651916cd43dd8448eb211c80319c"]
    FieldError:
      type: "object"
      required: ["field", "message"]
      properties:
        field:
          type: "string"
          description: "エラーの対象フィールド（JSON Pointer 相当の camelCase 名。クエリパラメータ名も可）"
          examples: ["isbn"]
        message:
          type: "string"
          description: "エラー内容"
          examples: ["ISBN-10 または ISBN-13 の形式で入力してください"]
    ValidationProblemDetails:
      description: "検証エラー（400 / 422）。項目単位のエラーを `errors` に列挙する"
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: "object"
          required: ["errors"]
          properties:
            errors:
              type: "array"
              items:
                $ref: "#/components/schemas/FieldError"
    UserNotDeletableProblemDetails:
      description: "利用者削除不可（409 `USER_NOT_DELETABLE`）。有効な貸出・予約の理由と件数を含む"
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: "object"
          required: ["reasons"]
          properties:
            reasons:
              type: "array"
              description: "削除できない理由: ACTIVE_LOAN（貸出中・延滞あり）/ ACTIVE_RESERVATION（予約中・通知済みあり）"
              items:
                type: "string"
                description: "削除できない理由: ACTIVE_LOAN（貸出中・延滞あり）/ ACTIVE_RESERVATION（予約中・通知済みあり）"
                enum: ["ACTIVE_LOAN", "ACTIVE_RESERVATION"]
              examples: [["ACTIVE_LOAN"]]
            activeLoanCount:
              type: "integer"
              minimum: 0
              description: "有効な貸出件数（ON_LOAN + OVERDUE）"
              examples: [2]
            activeReservationCount:
              type: "integer"
              minimum: 0
              description: "有効な予約件数（RESERVED + NOTIFIED）"
              examples: [0]

    # ---------------------------------------------------------- pagination
    PageMeta:
      type: "object"
      description: "offset ページネーションの共通メタ情報"
      required: ["page", "pageSize", "totalCount"]
      properties:
        page:
          type: "integer"
          minimum: 1
          description: "現在のページ番号（1 始まり）"
          examples: [1]
        pageSize:
          type: "integer"
          minimum: 1
          maximum: 100
          description: "1 ページの件数"
          examples: [20]
        totalCount:
          type: "integer"
          minimum: 0
          description: "条件に一致する総件数"
          examples: [135]

    # ---------------------------------------------------------------- books
    Genre:
      type: "object"
      required: ["genreId", "genreName"]
      properties:
        genreId:
          type: "string"
          description: "ジャンル ID"
          examples: ["literature"]
        genreName:
