        nullable: false
        default: "1"
        description: "楽観ロック用バージョン（状態遷移・繰り上げの UPDATE ごとに +1）"
      - name: "updated_at"
        type: "datetime"
        nullable: false
        description: "スナップショット最終更新日時"
