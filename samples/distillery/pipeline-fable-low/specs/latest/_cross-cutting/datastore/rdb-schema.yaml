version: "1.0"
datastore: "rdb"

# 生成元: 全 27 UC の _model-summary.yaml（tables）+ docs/rdra/latest/情報.tsv + _inputs-digest.md（data_architecture.entities）
# 正規化方針: 第 3 正規形を基本。貸出統計（loan_statistics）のみ loans からの集計テーブル（非正規化）
# enum 格納値: _review/api-conventions.md の英語コードに揃える
# DDL には変換しない（抽象型のみ。RDB 製品固有の型名は使わない）

_review_notes:
  - "物理 FK は削除時に参照整合性を保証する必要がある関係のみ設定する（books→genres, credentials→users, *_events→親, notifications→loans/reservations）。loans / reservations / loan_statistics / audit_logs から books / users への参照は論理参照（FK なし）: 書籍削除（在庫あり条件）・利用者削除（有効貸出・予約 0 件条件）後も履歴・統計を保持し、人気書籍ランキングは削除済み書籍の表示名を置換する仕様のため"
  - "*_events テーブルの event_type は英語コード（api-conventions.md の 10 値: REGISTERED / UPDATED / DELETED / LOANED / RETURNED / OVERDUE / RESERVED / NOTIFIED / CANCELLED / CLOSED）に統一した。UC の _model-summary.yaml も同じ英語コードに揃えている"
  - "book_events は UC 間でカラム構成が異なっていた（蔵書管理: event_id / payload / recorded_by、貸出・予約: related_id）。両方を包含する構成（payload と related_id を nullable、actor_user_number を nullable）に統合した"
  - "notifications.sent_at は digest では非 NULL だが、送信待ち（PENDING）行を INSERT してワーカーが後から更新する運用のため nullable にした。requested_on（要求日）を重複送信防止キーの一部として追加した"
  - "notifications の重複送信防止ユニークキーは target_loan_id 系（REMINDER / OVERDUE_NOTICE）と target_reservation_id 系（RETURN_NOTICE）で別のインデックスとし、NULL を含む行は対象外とする部分一意インデックスを想定する"
  - "reservations の (book_id, queue_position) 一意制約は有効予約（RESERVED / NOTIFIED）に限定した部分一意インデックスとする。取消・終了済みの順位は再利用されるため全行一意にはできない"
  - "books.isbn はハイフンなしの正規形で保存するため、検索時に REPLACE は不要。isbn 単独の通常インデックスで足りる（部分一致検索の前方一致部分に効く）"
  - "ユニーク制約不要と判断: genres.genre_name（マスタは genre_id で識別。名称変更を許容）、users.email（同一メールアドレスを複数利用者番号で登録する運用を排除する要件が RDRA にないため。要確認）"
  - "loan_statistics は loans の集計結果（Materialized View 相当）。集計バッチが (period_type, period_start, book_id) をキーに UPSERT する。loans への FK は持たない"
  - "loan_statistics を UPSERT する集計バッチの UC が RDRA に無いため、本ファイルでは前提だけを定義する（R-006 / docs/todo.md に RDRA 追加要望として起票済み）。前提: (1) 実行周期は日次（前日分の DAY 行を確定し、当月・当年の MONTH / YEAR 行を再集計する。当日・当月の未確定分は参照 UC 側では補完しない）、(2) UPSERT キーは (period_type, period_start, book_id)、(3) loan_count = 期間内に当該書籍が貸し出された回数（loans.loaned_on が期間内の行数。返却済み・延滞も含む）、(4) loan_total = 当該行の貸出レコード数（期間別貸出統計は SUM(loan_total) で期間合計を得る）、(5) ranking は同一 (period_type, period_start) 内で loan_count 降順・同値は book_id 昇順の連番を集計バッチが付与する、(6) aggregated_at は再集計のたびに更新し、遅延到着（過去期間の貸出登録・訂正）は当該 period_start の行を再計算して上書きする、(7) 集計完了時に KVS の cache:report:* を無効化する"
  - "sessions（E-901）は KVS（kvs-schema.yaml の session:{sessionId}）で管理し RDB テーブルにしない"

tables:
  # ---------------------------------------------------------------------------
  # 蔵書管理
  # ---------------------------------------------------------------------------
  - name: "books"
    rdra_info: "書籍"
    description: "蔵書として一元管理する書籍のスナップショット（E-001, event_snapshot）。登録日・更新日は book_events の occurred_at から導出する"
    columns:
      - name: "book_id"
        type: "uuid"
        nullable: false
        description: "書籍ID（主キー。ULID 等で採番）。情報.tsv: 書籍ID"
      - name: "title"
        type: "string"
        nullable: false
        description: "タイトル。情報.tsv: タイトル"
      - name: "author"
        type: "string"
        nullable: false
        description: "著者。情報.tsv: 著者"
      - name: "isbn"
        type: "string"
        nullable: true
        description: "ISBN（ハイフンなしの正規形。フロントエンドが送信前にハイフンを除去し、API はハイフンなしのみ受理する。任意。移行時に重複・欠損を名寄せする NFR D.4.1.3）。情報.tsv: ISBN"
      - name: "publisher"
        type: "string"
        nullable: true
        description: "出版社（任意）。情報.tsv: 出版社"
      - name: "genre_id"
        type: "uuid"
        nullable: false
        description: "ジャンルID（genres への FK）。情報.tsv: ジャンル"
      - name: "media_type"
        type: "string"
        nullable: false
        default: "PAPER"
        description: "媒体種別。値: PAPER（紙）, ELECTRONIC（電子）。初期リリースは PAPER のみ運用。情報.tsv: 媒体種別"
      - name: "current_status"
        type: "string"
        nullable: false
        default: "AVAILABLE"
        description: "書籍の状態（スナップショット）。値: AVAILABLE（在庫あり）, ON_LOAN（貸出中）, RESERVED（予約待ち）。遷移は book_events で記録する。情報.tsv: 書籍の状態"
      - name: "title_normalized"
        type: "string"
        nullable: false
        description: "タイトルの NFKC 正規化 + 小文字化した検索用派生列（INSERT / UPDATE 時に再計算）"
      - name: "author_normalized"
        type: "string"
        nullable: false
        description: "著者の NFKC 正規化 + 小文字化した検索用派生列"
      - name: "publisher_normalized"
        type: "string"
        nullable: true
        description: "出版社の NFKC 正規化 + 小文字化した検索用派生列（publisher が NULL のとき NULL）"
      - name: "version"
        type: "integer"
        nullable: false
        default: "1"
        description: "楽観ロック用バージョン（UPDATE ごとに +1。If-Match / ETag と対応）"
      - name: "updated_at"
        type: "datetime"
        nullable: false
        description: "スナップショット最終更新日時（一覧の既定ソートキー）。情報.tsv: 更新日"
    primary_key: ["book_id"]
    foreign_keys:
      - columns: ["genre_id"]
        references:
          table: "genres"
          columns: ["genre_id"]
        on_delete: "RESTRICT"
    indexes:
      - name: "idx_books_genre_id_updated_at"
        columns: ["genre_id", "updated_at"]
        unique: false
        reason: "genres への FK 参照 + ジャンル絞り込み一覧の更新日時降順ページング"
        used_by: ["書籍を登録する", "書籍を検索する", "書籍一覧を参照する", "在庫状況一覧を参照する"]
      - name: "idx_books_current_status_updated_at"
        columns: ["current_status", "updated_at"]
        unique: false
        reason: "在庫状況で絞り込んだ一覧の更新日時降順ページング。状態別件数の GROUP BY にも利用"
        used_by: ["書籍を検索する", "書籍一覧を参照する", "在庫状況一覧を参照する"]
      - name: "idx_books_current_status_genre_id_title"
        columns: ["current_status", "genre_id", "title"]
        unique: false
        reason: "在庫状況一覧の 状態 × ジャンル 絞り込みとタイトル順ページング"
        used_by: ["在庫状況一覧を参照する"]
      - name: "idx_books_updated_at"
        columns: ["updated_at"]
        unique: false
        reason: "絞り込みなし一覧の更新日時降順ページング"
        used_by: ["書籍一覧を参照する"]
      - name: "idx_books_title_normalized"
        columns: ["title_normalized"]
        unique: false
        reason: "タイトル検索（前方一致時に利用。中間一致は LIKE 走査を許容: 1 館規模 NFR B.1.1.2）"
        used_by: ["書籍を検索する", "書籍一覧を参照する"]
      - name: "idx_books_author_normalized"
        columns: ["author_normalized"]
        unique: false
        reason: "著者検索（前方一致時に利用）"
        used_by: ["書籍を検索する"]
      - name: "idx_books_isbn"
        columns: ["isbn"]
        unique: false
        reason: "ISBN 検索。ユニーク制約: 不要（同一 ISBN の複本を別書籍 ID で登録するため一意にしない）"
        used_by: ["書籍を検索する", "書籍一覧を参照する"]
    used_by:
      - uc: "書籍を登録する"
        operations: ["INSERT"]
      - uc: "書籍を編集する"
        operations: ["SELECT", "UPDATE"]
      - uc: "書籍を削除する"
        operations: ["SELECT", "DELETE"]
      - uc: "書籍一覧を参照する"
        operations: ["SELECT"]
      - uc: "書籍を検索する"
        operations: ["SELECT"]
      - uc: "書籍詳細を参照する"
        operations: ["SELECT"]
      - uc: "貸出を登録する"
        operations: ["SELECT", "UPDATE"]
      - uc: "返却を登録する"
        operations: ["SELECT", "UPDATE"]
      - uc: "返却通知を送信する"
        operations: ["SELECT"]
      - uc: "予約を登録する"
        operations: ["SELECT"]
      - uc: "予約を取り消す"
        operations: ["SELECT", "UPDATE"]
      - uc: "予約一覧を参照する"
        operations: ["SELECT"]
      - uc: "貸出履歴を参照する"
        operations: ["SELECT"]
      - uc: "予約状況を参照する"
        operations: ["SELECT"]
      - uc: "利用者の利用状況を参照する"
        operations: ["SELECT"]
      - uc: "リマインド対象を抽出する"
        operations: ["SELECT"]
      - uc: "リマインドを送信する"
        operations: ["SELECT"]
      - uc: "延滞一覧を参照する"
        operations: ["SELECT"]
      - uc: "督促を送信する"
        operations: ["SELECT"]
      - uc: "在庫状況一覧を参照する"
        operations: ["SELECT"]
      - uc: "人気書籍ランキングを参照する"
        operations: ["SELECT"]

  - name: "book_events"
    rdra_info: "書籍"
    description: "書籍の状態遷移・属性変更イベント（E-001 の event ログ）。登録日 / 更新日 / 削除履歴の正本。書籍削除後も保持する"
    columns:
      - name: "event_id"
        type: "uuid"
        nullable: false
        description: "イベントID（主キー。UUID）"
      - name: "book_id"
        type: "uuid"
        nullable: false
        description: "対象書籍ID（論理参照。削除後も保持するため FK なし）"
      - name: "event_type"
        type: "string"
        nullable: false
        description: "イベント種別。値: REGISTERED（登録）, UPDATED（属性変更）, DELETED（削除）, LOANED（貸出）, RETURNED（返却）, CANCELLED（予約取消で在庫ありへ遷移）"
      - name: "occurred_at"
        type: "datetime"
        nullable: false
        description: "発生日時。REGISTERED の occurred_at が登録日、最新イベントの occurred_at が更新日"
      - name: "actor_user_number"
        type: "string"
        nullable: true
        description: "操作した司書の利用者番号。貸出・返却・予約取消に伴う自動遷移は NULL"
      - name: "related_id"
        type: "uuid"
        nullable: true
        description: "関連レコードID（LOANED / RETURNED は loan_id、CANCELLED は reservation_id。それ以外は NULL）"
      - name: "payload"
        type: "text"
        nullable: true
        description: "イベントペイロード（JSON。REGISTERED: 登録属性 + 遷移後状態、UPDATED: 変更前後差分、DELETED: 削除前の全属性 + 遷移前状態）"
    primary_key: ["event_id"]
    foreign_keys: []
    indexes:
      - name: "idx_book_events_book_id_occurred_at"
        columns: ["book_id", "occurred_at"]
        unique: false
        reason: "書籍ごとの履歴を時系列に取得（registeredAt / updatedAt の導出、監査）"
        used_by: ["書籍を登録する", "書籍を編集する", "書籍を削除する", "書籍詳細を参照する", "貸出を登録する", "返却を登録する", "予約を取り消す"]
    used_by:
      - uc: "書籍を登録する"
        operations: ["INSERT"]
      - uc: "書籍を編集する"
        operations: ["INSERT", "SELECT"]
      - uc: "書籍を削除する"
        operations: ["INSERT"]
      - uc: "書籍詳細を参照する"
        operations: ["SELECT"]
      - uc: "貸出を登録する"
        operations: ["INSERT"]
      - uc: "返却を登録する"
        operations: ["INSERT"]
      - uc: "予約を取り消す"
        operations: ["INSERT"]

  - name: "genres"
    rdra_info: "ジャンル"
    description: "書籍を分類するジャンルマスタ（E-002, resource_mutable）。検索条件および運営分析の集計単位"
    columns:
      - name: "genre_id"
        type: "uuid"
        nullable: false
        description: "ジャンルID（主キー）。情報.tsv: ジャンルID"
      - name: "genre_name"
        type: "string"
        nullable: false
        description: "ジャンル名（文学・社会科学・自然科学・技術・芸術・歴史・児童書・その他）。情報.tsv: ジャンル名"
      - name: "description"
        type: "text"
        nullable: true
        description: "ジャンルの説明。情報.tsv: 説明"
    primary_key: ["genre_id"]
    foreign_keys: []
    indexes: []
    used_by:
      - uc: "書籍を登録する"
        operations: ["SELECT"]
      - uc: "書籍を編集する"
        operations: ["SELECT"]
      - uc: "書籍一覧を参照する"
        operations: ["SELECT"]
      - uc: "書籍を検索する"
        operations: ["SELECT"]
      - uc: "書籍詳細を参照する"
        operations: ["SELECT"]
      - uc: "在庫状況一覧を参照する"
        operations: ["SELECT"]
      - uc: "人気書籍ランキングを参照する"
        operations: ["SELECT"]

  # ---------------------------------------------------------------------------
  # 利用者管理
  # ---------------------------------------------------------------------------
  - name: "users"
    rdra_info: "利用者"
    description: "図書館を利用する人（司書・利用者）のスナップショット（E-003, event_snapshot）。個人情報を含む（NFR E.6.1.1 保管時暗号化、E.6.2.1 テスト環境マスキング）"
    columns:
      - name: "user_number"
        type: "string"
        nullable: false
        description: "利用者番号（主キー。司書が登録時にシーケンス採番する一意の識別子）。情報.tsv: 利用者番号"
      - name: "name"
        type: "string"
        nullable: false
        description: "氏名（個人情報）。情報.tsv: 氏名"
      - name: "name_normalized"
        type: "string"
        nullable: false
        description: "氏名の NFKC 正規化 + 小文字化した検索用派生列（利用者一覧の部分一致検索）"
      - name: "email"
        type: "string"
        nullable: false
        description: "メールアドレス（通知の送信先。個人情報。移行時に欠損を補完する NFR D.4.1.3）。情報.tsv: 連絡先"
      - name: "phone"
        type: "string"
        nullable: true
        description: "電話番号（任意。個人情報）。情報.tsv: 連絡先"
      - name: "address"
        type: "string"
        nullable: true
        description: "住所（任意。個人情報）。情報.tsv: 連絡先"
      - name: "user_type"
        type: "string"
        nullable: false
        default: "PATRON"
        description: "利用者区分。値: PATRON（利用者）, STAFF（司書）。RBAC のロール源泉（NFR E.5.2.1）。情報.tsv: 利用者区分"
      - name: "version"
        type: "integer"
        nullable: false
        default: "1"
        description: "楽観ロック用バージョン（UPDATE ごとに +1）"
      - name: "updated_at"
        type: "datetime"
        nullable: false
        description: "スナップショット最終更新日時。登録日・更新日は user_events の occurred_at で管理する。情報.tsv: 更新日"
    primary_key: ["user_number"]
    foreign_keys: []
    indexes:
      - name: "idx_users_name_normalized"
        columns: ["name_normalized"]
        unique: false
        reason: "氏名部分一致検索（前方一致時に利用。中間一致は LIKE 走査を許容: 1 館規模）"
        used_by: ["利用者一覧を参照する"]
    used_by:
      - uc: "利用者を登録する"
        operations: ["INSERT"]
      - uc: "利用者を編集する"
        operations: ["SELECT", "UPDATE"]
      - uc: "利用者を削除する"
        operations: ["SELECT", "DELETE"]
      - uc: "利用者一覧を参照する"
        operations: ["SELECT"]
      - uc: "利用者の利用状況を参照する"
        operations: ["SELECT"]
      - uc: "貸出を登録する"
        operations: ["SELECT"]
      - uc: "返却を登録する"
        operations: ["SELECT"]
      - uc: "返却通知を送信する"
        operations: ["SELECT"]
      - uc: "予約を登録する"
        operations: ["SELECT"]
      - uc: "予約を取り消す"
        operations: ["SELECT"]
      - uc: "予約一覧を参照する"
        operations: ["SELECT"]
      - uc: "リマインド対象を抽出する"
        operations: ["SELECT"]
      - uc: "延滞を判定する"
        operations: ["SELECT"]
      - uc: "延滞一覧を参照する"
        operations: ["SELECT"]

  - name: "user_events"
    rdra_info: "利用者"
    description: "利用者の登録・属性変更・削除イベント（E-003 の event ログ）。登録日 / 更新日の正本。利用者削除後も保持する（削除イベントの payload に氏名・連絡先は含めない）"
    columns:
      - name: "event_id"
        type: "uuid"
        nullable: false
        description: "イベントID（主キー。UUID）"
      - name: "user_number"
        type: "string"
        nullable: false
        description: "対象利用者番号（論理参照。削除後も保持するため FK なし）"
      - name: "event_type"
        type: "string"
        nullable: false
        description: "イベント種別。値: REGISTERED（登録）, UPDATED（属性変更）, DELETED（削除）"
      - name: "occurred_at"
        type: "datetime"
        nullable: false
        description: "発生日時。REGISTERED の occurred_at が登録日、最新イベントの occurred_at が更新日"
      - name: "actor_user_number"
        type: "string"
        nullable: false
        description: "操作した司書の利用者番号"
      - name: "payload"
        type: "text"
        nullable: true
        description: "イベントペイロード（JSON。REGISTERED / UPDATED: 氏名・連絡先、DELETED: { reason: 利用終了 } のみ）"
    primary_key: ["event_id"]
    foreign_keys: []
    indexes:
      - name: "idx_user_events_user_number_occurred_at"
        columns: ["user_number", "occurred_at"]
        unique: false
        reason: "利用者ごとの履歴を時系列に取得（registeredAt / updatedAt の導出）"
        used_by: ["利用者を登録する", "利用者を編集する", "利用者を削除する"]
      - name: "idx_user_events_user_number_event_type"
        columns: ["user_number", "event_type"]
        unique: false
        reason: "一覧表示時の登録イベント一括取得（WHERE event_type = 'REGISTERED' AND user_number IN (...)）"
        used_by: ["利用者一覧を参照する"]
    used_by:
      - uc: "利用者を登録する"
        operations: ["INSERT"]
      - uc: "利用者を編集する"
        operations: ["INSERT"]
      - uc: "利用者を削除する"
        operations: ["INSERT"]
      - uc: "利用者一覧を参照する"
        operations: ["SELECT"]

  - name: "credentials"
    rdra_info: "利用者"
    description: "認証情報（E-903, 派生エンティティ。NFR E.5.1.1 ID/パスワード認証、E.7.2.1 ログイン失敗検知とアカウントロック、E.6.1.1 暗号化）。users と 1:1"
    columns:
      - name: "user_number"
        type: "string"
