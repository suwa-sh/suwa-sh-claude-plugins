  # ---------------------------------------------------------------------------
  # 貸出管理
  # ---------------------------------------------------------------------------
  - name: "loans"
    rdra_info: "貸出"
    description: "利用者に書籍を貸し出した記録のスナップショット（E-004, event_snapshot）。返却日は loan_events（RETURNED）の occurred_at で管理する。貸出履歴は要配慮情報に準じる（NFR E.1.2.1 / E.6.1.1）"
    columns:
      - name: "loan_id"
        type: "uuid"
        nullable: false
        description: "貸出ID（主キー。ULID 採番）。情報.tsv: 貸出ID"
      - name: "book_id"
        type: "uuid"
        nullable: false
        description: "書籍ID（books への論理参照。書籍削除後も履歴を保持するため FK なし）。情報.tsv: 書籍ID"
      - name: "user_number"
        type: "string"
        nullable: false
        description: "利用者番号（users への論理参照。利用者削除後も履歴を保持するため FK なし）。情報.tsv: 利用者番号"
      - name: "loaned_on"
        type: "date"
        nullable: false
        description: "貸出日（貸出登録時に確定）。情報.tsv: 貸出日"
      - name: "due_date"
        type: "date"
        nullable: false
        description: "返却期限（loaned_on + 貸出時点で有効な loan_periods.loan_days）。情報.tsv: 返却期限"
      - name: "current_status"
        type: "string"
        nullable: false
        default: "ON_LOAN"
        description: "貸出の状態。値: ON_LOAN（貸出中）, OVERDUE（延滞）, RETURNED（返却済み）。情報.tsv: 貸出の状態"
      - name: "recorded_by"
        type: "string"
        nullable: false
        description: "記録した司書の利用者番号（users への論理参照）。情報.tsv: 記録した司書"
      - name: "version"
        type: "integer"
        nullable: false
        default: "1"
        description: "楽観ロック用バージョン（返却・延滞判定の UPDATE ごとに +1）"
      - name: "updated_at"
        type: "datetime"
        nullable: false
        description: "スナップショット最終更新日時"
    primary_key: ["loan_id"]
    foreign_keys: []
    indexes:
      - name: "idx_loans_book_id_current_status"
        columns: ["book_id", "current_status"]
        unique: false
        reason: "書籍ごとの貸出中 / 延滞レコード検索（返却対象の特定・貸出可否判定）。ユニーク制約: 貸出中は書籍の状態（books.current_status）と FOR UPDATE で直列化するため一意インデックスは設けない"
        used_by: ["貸出を登録する", "返却を登録する"]
      - name: "idx_loans_user_number_current_status_due_date"
        columns: ["user_number", "current_status", "due_date"]
        unique: false
        reason: "利用者ごとの現在の貸出を返却期限順に取得。有効貸出件数（削除可否判定）・延滞一覧の利用者絞り込みにも利用"
        used_by: ["貸出履歴を参照する", "利用者の利用状況を参照する", "利用者を削除する", "延滞一覧を参照する", "貸出を登録する"]
      - name: "idx_loans_user_number_loaned_on"
        columns: ["user_number", "loaned_on"]
        unique: false
        reason: "利用者ごとの貸出履歴を貸出日降順に取得"
        used_by: ["貸出履歴を参照する", "利用者の利用状況を参照する"]
      - name: "idx_loans_current_status_due_date"
        columns: ["current_status", "due_date"]
        unique: false
        reason: "貸出中 × 返却期限範囲の日次走査（リマインド対象抽出・延滞判定。〜10 万件、8 時間枠）と延滞一覧の返却期限順ページング"
        used_by: ["リマインド対象を抽出する", "延滞を判定する", "延滞一覧を参照する"]
      - name: "idx_loans_loaned_on"
        columns: ["loaned_on"]
        unique: false
        reason: "貸出日範囲の件数集計（未集計区切りのリアルタイム COUNT・集計バッチ）"
        used_by: ["期間別貸出統計を参照する"]
    used_by:
      - uc: "貸出を登録する"
        operations: ["INSERT"]
      - uc: "返却を登録する"
        operations: ["SELECT", "UPDATE"]
      - uc: "返却通知を送信する"
        operations: ["SELECT"]
      - uc: "貸出履歴を参照する"
        operations: ["SELECT"]
      - uc: "利用者の利用状況を参照する"
        operations: ["SELECT"]
      - uc: "利用者を削除する"
        operations: ["SELECT"]
      - uc: "リマインド対象を抽出する"
        operations: ["SELECT"]
      - uc: "リマインドを送信する"
        operations: ["SELECT"]
      - uc: "延滞を判定する"
        operations: ["SELECT", "UPDATE"]
      - uc: "延滞一覧を参照する"
        operations: ["SELECT"]
      - uc: "督促を送信する"
        operations: ["SELECT"]
      - uc: "期間別貸出統計を参照する"
        operations: ["SELECT"]

