        reason: "書籍ごとの有効予約（RESERVED / NOTIFIED）を順位順に取得・件数集計・繰り上げ更新"
        used_by: ["予約を登録する", "予約を取り消す", "予約一覧を参照する", "貸出を登録する", "返却を登録する", "返却通知を送信する", "書籍詳細を参照する", "予約状況を参照する", "利用者の利用状況を参照する"]
      - name: "uq_reservations_book_id_queue_position"
        columns: ["book_id", "queue_position"]
        unique: true
        reason: "ユニーク制約: 有効予約内の順位一意（部分一意インデックス: current_status IN ('RESERVED','NOTIFIED')）"
        used_by: ["予約を登録する"]
      - name: "idx_reservations_user_number_book_id_current_status"
        columns: ["user_number", "book_id", "current_status"]
        unique: false
        reason: "同一利用者の同一書籍への重複予約判定。ユニーク制約: 実装時に部分一意インデックス（有効予約に限定）へ昇格可能"
        used_by: ["予約を登録する"]
