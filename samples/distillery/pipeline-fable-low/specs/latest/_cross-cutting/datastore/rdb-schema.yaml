      - uc: "返却を登録する"
        operations: ["SELECT"]
      - uc: "返却通知を送信する"
        operations: ["SELECT", "UPDATE"]
      - uc: "書籍詳細を参照する"
        operations: ["SELECT"]
      - uc: "予約状況を参照する"
