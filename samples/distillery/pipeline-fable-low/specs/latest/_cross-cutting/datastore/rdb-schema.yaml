  - name: "notifications"
    rdra_info: "通知"
    description: "利用者に送信する返却通知・リマインド・督促のメール記録（E-008, event）。送信待ち行を INSERT し、ワーカーが送信結果を反映する。重複送信防止（SR-013）の正本"
    columns:
      - name: "notification_id"
        type: "uuid"
        nullable: false
        description: "通知ID（主キー。ULID 採番。MQ の MessageId と同値）。情報.tsv: 通知ID"
      - name: "user_number"
        type: "string"
        nullable: false
        description: "送信先利用者の利用者番号（users への論理参照）。情報.tsv: 利用者番号"
      - name: "notification_type"
        type: "string"
        nullable: false
        description: "通知種別。値: RETURN_NOTICE（返却通知）, REMINDER（返却期限リマインド）, OVERDUE_NOTICE（延滞督促）。情報.tsv: 通知種別"
      - name: "recipient_email"
        type: "string"
        nullable: false
        description: "送信先メールアドレス（要求時点の users.email のコピー。個人情報 NFR E.6.1.1）。情報.tsv: 送信先メールアドレス"
      - name: "subject"
        type: "string"
        nullable: false
        description: "件名（テンプレート展開後）。情報.tsv: 件名"
      - name: "body"
        type: "text"
        nullable: false
        description: "本文（テンプレート展開後。書籍名・返却期限・延滞日数・来館案内）。情報.tsv: 本文"
      - name: "requested_on"
        type: "date"
        nullable: false
        description: "送信要求日（バッチの asOf / 返却登録の当日）。同一対象・同一種別・同一日の重複送信防止キー"
      - name: "send_result"
        type: "string"
        nullable: false
        default: "PENDING"
        description: "送信結果。値: PENDING（送信待ち）, SUCCEEDED（成功）, FAILED（失敗）, SKIPPED（スキップ: 送信直前の再確認で対象外）。情報.tsv: 送信結果"
      - name: "sent_at"
        type: "datetime"
        nullable: true
        description: "送信日時（SUCCEEDED 時のみ設定。PENDING / FAILED / SKIPPED は NULL）。情報.tsv: 送信日時"
      - name: "failure_reason"
        type: "string"
        nullable: true
        description: "失敗理由コード（FAILED 時のみ。メール配信サービスの応答を ACL で翻訳した値）"
      - name: "external_message_id"
        type: "string"
        nullable: true
        description: "メール配信サービス側のメッセージID（SUCCEEDED 時のみ）"
      - name: "target_loan_id"
        type: "uuid"
        nullable: true
        description: "対象貸出ID（REMINDER / OVERDUE_NOTICE のとき。loans への FK。RETURN_NOTICE は NULL）。情報.tsv: 対象貸出ID"
      - name: "target_reservation_id"
        type: "uuid"
        nullable: true
        description: "対象予約ID（RETURN_NOTICE のとき。reservations への FK。REMINDER / OVERDUE_NOTICE は NULL）。情報.tsv: 対象予約ID"
    primary_key: ["notification_id"]
    foreign_keys:
      - columns: ["target_loan_id"]
        references:
          table: "loans"
          columns: ["loan_id"]
        on_delete: "RESTRICT"
      - columns: ["target_reservation_id"]
        references:
          table: "reservations"
          columns: ["reservation_id"]
        on_delete: "RESTRICT"
    indexes:
      - name: "uq_notifications_target_loan_id_notification_type_requested_on"
        columns: ["target_loan_id", "notification_type", "requested_on"]
        unique: true
        reason: "ユニーク制約: 貸出対象通知の重複送信防止（SR-013。target_loan_id IS NOT NULL の部分一意インデックス）。貸出別の最新督促・通知記録の取得にも利用"
        used_by: ["リマインド対象を抽出する", "延滞を判定する", "延滞一覧を参照する"]
      - name: "uq_notifications_target_reservation_id_notification_type_requested_on"
        columns: ["target_reservation_id", "notification_type", "requested_on"]
        unique: true
        reason: "ユニーク制約: 予約対象通知の重複送信防止（SR-013。target_reservation_id IS NOT NULL の部分一意インデックス）。予約ごとの通知記録取得・同日重複判定にも利用"
        used_by: ["返却通知を送信する", "予約を取り消す"]
      - name: "idx_notifications_send_result_notification_type_requested_on"
        columns: ["send_result", "notification_type", "requested_on"]
        unique: false
        reason: "送信待ち（PENDING）通知の再発行スイープ（種別別・全種別）"
        used_by: ["リマインドを送信する", "督促を送信する", "返却通知を送信する"]
    used_by:
      - uc: "返却通知を送信する"
        operations: ["INSERT", "SELECT", "UPDATE"]
      - uc: "予約を取り消す"
        operations: ["INSERT"]
      - uc: "リマインド対象を抽出する"
        operations: ["INSERT"]
      - uc: "リマインドを送信する"
        operations: ["SELECT", "UPDATE"]
      - uc: "延滞を判定する"
        operations: ["INSERT"]
      - uc: "延滞一覧を参照する"
        operations: ["SELECT"]
      - uc: "督促を送信する"
        operations: ["SELECT", "UPDATE"]

  # ---------------------------------------------------------------------------
  # 運営分析管理
  # ---------------------------------------------------------------------------
  - name: "loan_statistics"
    rdra_info: "貸出統計"
    description: "loans を集計期間種別 × 期間 × 書籍で集計した非正規化テーブル（E-009, resource_mutable。Materialized View 相当）。集計バッチが UPSERT し、人気書籍ランキングと期間別貸出統計の参照元になる"
    columns:
      - name: "stat_id"
        type: "uuid"
        nullable: false
        description: "集計ID（主キー）。情報.tsv: 集計ID"
      - name: "period_type"
        type: "string"
        nullable: false
        description: "集計期間種別。値: DAY（日）, MONTH（月）, YEAR（年）。情報.tsv: 集計期間種別"
      - name: "period_start"
        type: "date"
        nullable: false
        description: "集計対象期間 開始日。情報.tsv: 集計対象期間（開始日）"
      - name: "period_end"
        type: "date"
        nullable: false
        description: "集計対象期間 終了日。情報.tsv: 集計対象期間（終了日）"
      - name: "book_id"
        type: "uuid"
        nullable: false
        description: "書籍ID（books への論理参照。削除済み書籍の統計も保持し、表示時に名称を置換する）。情報.tsv: 書籍ID"
      - name: "loan_count"
        type: "integer"
        nullable: false
        default: "0"
        description: "貸出回数（期間内の当該書籍の貸出件数。人気書籍ランキングの基準）。情報.tsv: 貸出回数"
      - name: "loan_total"
        type: "integer"
        nullable: false
        default: "0"
        description: "貸出件数（当該行 = 期間 × 書籍の貸出レコード数。loan_count は利用者ののべ借用回数、loan_total は貸出レコード数として区別する。期間別貸出統計 UC は GROUP BY period_start, period_end の SUM(loan_total) で期間合計を得る）。情報.tsv: 貸出件数"
      - name: "ranking"
        type: "integer"
        nullable: false
        description: "期間内の書籍ランキング順位（loan_count 降順。集計バッチが付与）。情報.tsv: ランキング順位"
      - name: "aggregated_at"
        type: "datetime"
        nullable: false
        description: "集計日時（再集計のたびに更新）。情報.tsv: 集計日時"
    primary_key: ["stat_id"]
    foreign_keys: []
    indexes:
      - name: "uq_loan_statistics_period_type_period_start_book_id"
        columns: ["period_type", "period_start", "book_id"]
        unique: true
        reason: "ユニーク制約: 期間種別 × 期間 × 書籍で 1 行（集計バッチの UPSERT キー）。期間範囲 × 書籍の貸出回数合算（ランキング）にも利用"
        used_by: ["期間別貸出統計を参照する", "人気書籍ランキングを参照する"]
      - name: "idx_loan_statistics_period_type_period_start"
        columns: ["period_type", "period_start"]
        unique: false
        reason: "集計期間種別 × 期間範囲の集約参照（期間別貸出統計・前期比）"
        used_by: ["期間別貸出統計を参照する"]
    used_by:
      - uc: "期間別貸出統計を参照する"
        operations: ["SELECT"]
      - uc: "人気書籍ランキングを参照する"
        operations: ["SELECT"]

  # ---------------------------------------------------------------------------
  # 横断（監査）
  # ---------------------------------------------------------------------------
  - name: "audit_logs"
    rdra_info: ""
    description: "監査ログ（E-902, 派生エンティティ。NFR E.7.1.1 Lv2: ログイン / ログアウト + データアクセスログ）。個人情報の参照・更新と利用状況閲覧範囲判定の検証に用いる"
    columns:
      - name: "audit_id"
        type: "uuid"
        nullable: false
        description: "監査ログID（主キー。UUID / ULID 採番）"
      - name: "occurred_at"
        type: "datetime"
        nullable: false
        description: "発生日時"
      - name: "actor_user_number"
        type: "string"
        nullable: false
        description: "操作者の利用者番号（バッチはタイマーの固定 ID。users への論理参照）"
      - name: "action_type"
        type: "string"
        nullable: false
        description: "操作種別。値: LOGIN（ログイン）, LOGOUT（ログアウト）, LOGIN_FAILED（ログイン失敗）, DATA_READ（データ参照）, DATA_WRITE（データ更新）"
      - name: "target_entity"
        type: "string"
        nullable: false
        description: "対象エンティティID（E-001 / E-003 / E-004 / E-007 等）"
      - name: "target_id"
        type: "string"
        nullable: false
        description: "対象レコードID（書籍ID・利用者番号等。一覧参照は応答に含めた ID の一覧）"
      - name: "result"
        type: "string"
        nullable: false
        description: "結果。値: SUCCEEDED（成功）, DENIED（拒否）, FAILED（失敗）"
      - name: "detail"
        type: "text"
        nullable: true
        description: "付記（JSON。連絡先開示 reveal=true の記録等）"
    primary_key: ["audit_id"]
    foreign_keys: []
    indexes:
      - name: "idx_audit_logs_target_entity_target_id_occurred_at"
        columns: ["target_entity", "target_id", "occurred_at"]
        unique: false
        reason: "対象エンティティ・レコード単位の監査ログ検索（利用者ごとのアクセス履歴追跡 NFR E.7.1.1）"
        used_by: ["書籍を削除する", "利用者を削除する", "利用者の利用状況を参照する"]
      - name: "idx_audit_logs_actor_user_number_occurred_at"
        columns: ["actor_user_number", "occurred_at"]
        unique: false
        reason: "操作者単位の監査ログ検索"
        used_by: ["利用者一覧を参照する"]
    used_by:
      - uc: "書籍を削除する"
        operations: ["INSERT"]
      - uc: "利用者一覧を参照する"
        operations: ["INSERT"]
      - uc: "利用者を削除する"
        operations: ["INSERT"]
      - uc: "利用者の利用状況を参照する"
        operations: ["INSERT"]

