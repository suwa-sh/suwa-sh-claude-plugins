# _api-summary.yaml
uc: "予約を登録する"
business: "貸出業務"
buc: "書籍を予約するフロー"
endpoints:
  - method: "GET"
    path: "/api/v1/books/{bookId}/reservation-eligibility"
    summary: "予約可否を照会する（書籍の状態・媒体種別・自分の有効予約・待ち人数）"
    response_schema: "ReservationEligibilityResponse"
    tags: ["reservations"]
    security: ["bearer"]
    roles: ["利用者", "司書"]
    parameters:
      - name: "bookId"
        in: "path"
        type: "string"
        required: true
    responses:
      "200": "ReservationEligibilityResponse"
      "400": "ValidationProblemDetails"
      "401": "ProblemDetails"
      "404": "ProblemDetails"
      "429": "ProblemDetails"
    errors:
      - status: "400"
        code: "VALIDATION_ERROR"
      - status: "401"
        code: "UNAUTHENTICATED"
      - status: "404"
        code: "BOOK_NOT_FOUND"
      - status: "429"
        code: "RATE_LIMITED"
  - method: "POST"
    path: "/api/v1/reservations"
    summary: "予約を登録する（受付順の予約順位つきで予約中として作成。予約主体はトークンの利用者番号）"
    request_schema: "CreateReservationRequest"
    response_schema: "ReservationResponse"
    tags: ["reservations"]
    security: ["bearer"]
    roles: ["利用者"]
    headers:
      - name: "Idempotency-Key"
        required: true
    responses:
      "201": "ReservationResponse"
      "400": "ValidationProblemDetails"
      "401": "ProblemDetails"
      "403": "ProblemDetails"
      "404": "ProblemDetails"
      "409": "ProblemDetails"
      "429": "ProblemDetails"
    errors:
      - status: "400"
        code: "VALIDATION_ERROR"
      - status: "401"
        code: "UNAUTHENTICATED"
      - status: "403"
        code: "FORBIDDEN"
      - status: "404"
        code: "BOOK_NOT_FOUND"
      - status: "409"
        code: "BOOK_AVAILABLE_NOT_RESERVABLE"
      - status: "409"
        code: "CONCURRENT_UPDATE"
      - status: "409"
        code: "IDEMPOTENCY_KEY_CONFLICT"
      - status: "409"
        code: "MEDIA_TYPE_NOT_RESERVABLE"
      - status: "409"
        code: "RESERVATION_ALREADY_EXISTS"
      - status: "429"
        code: "RATE_LIMITED"
async_events: []
schemas:
  - name: "CreateReservationRequest"
    properties:
      - name: "bookId"
        type: "string"
        required: true
  - name: "ReservationEligibilityResponse"
    properties:
      - name: "allowed"
        type: "boolean"
        required: true
      - name: "reasonCode"
        type: "string"
        required: false
        enum: ["BOOK_AVAILABLE_NOT_RESERVABLE", "RESERVATION_ALREADY_EXISTS", "MEDIA_TYPE_NOT_RESERVABLE"]
      - name: "reasonMessage"
        type: "string"
        required: false
      - name: "waitingCount"
        type: "integer"
        required: true
      - name: "expectedQueuePosition"
        type: "integer"
        required: false
      - name: "book"
        type: "BookSummary"
        required: true
      - name: "existingReservation"
        type: "ReservationSummary"
        required: false
  - name: "ReservationResponse"
    properties:
      - name: "reservationId"
        type: "string"
        required: true
      - name: "bookId"
        type: "string"
        required: true
      - name: "userNumber"
        type: "string"
        required: true
      - name: "acceptedAt"
        type: "string"
        format: "date-time"
        required: true
      - name: "queuePosition"
        type: "integer"
        required: true
      - name: "waitingCount"
        type: "integer"
        required: true
      - name: "status"
        type: "string"
        enum: ["RESERVED", "NOTIFIED", "CANCELLED", "CLOSED"]
        required: true
      - name: "book"
        type: "BookSummary"
        required: true
  - name: "BookSummary"
    properties:
      - name: "bookId"
        type: "string"
        required: true
      - name: "title"
        type: "string"
        required: true
      - name: "author"
        type: "string"
        required: true
      - name: "mediaType"
        type: "string"
        enum: ["PAPER", "ELECTRONIC"]
        required: true
      - name: "status"
        type: "string"
        enum: ["AVAILABLE", "ON_LOAN", "RESERVED"]
        required: true
  - name: "ReservationSummary"
    properties:
      - name: "reservationId"
        type: "string"
        required: true
      - name: "queuePosition"
        type: "integer"
        required: true
      - name: "status"
        type: "string"
        enum: ["RESERVED", "NOTIFIED", "CANCELLED", "CLOSED"]
        required: true
