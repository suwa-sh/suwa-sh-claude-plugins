# _api-summary.yaml
uc: "予約一覧を参照する"
business: "貸出業務"
buc: "書籍を予約するフロー"
endpoints:
  - method: "GET"
    path: "/api/v1/books/{bookId}/reservations"
    summary: "書籍別の予約一覧を取得する（有効予約を順位順、includeClosed で取消・終了を含める。offset ページネーション）"
    request_schema: "ListBookReservationsQueryParams"
    response_schema: "BookReservationPageResponse"
    tags: ["reservations"]
    security: ["bearer"]
    roles: ["司書"]
    parameters:
      - name: "bookId"
        in: "path"
        type: "string"
        required: true
      - name: "includeClosed"
        in: "query"
        type: "boolean"
        required: false
        default: false
        description: "終了・取消済みの予約を含めるか"
      - name: "page"
        in: "query"
        type: "integer"
        required: false
        default: 1
        minimum: 1
      - name: "pageSize"
        in: "query"
        type: "integer"
        required: false
        default: 20
        maximum: 100
    responses:
      "200": "BookReservationPageResponse"
      "400": "ValidationProblemDetails"
      "401": "ProblemDetails"
      "403": "ProblemDetails"
      "404": "ProblemDetails"
    errors:
      - status: "400"
        code: "VALIDATION_ERROR"
      - status: "401"
        code: "UNAUTHENTICATED"
      - status: "403"
        code: "FORBIDDEN"
      - status: "404"
        code: "BOOK_NOT_FOUND"
async_events: []
schemas:
  - name: "ListBookReservationsQueryParams"
    properties:
      - name: "includeClosed"
        type: "boolean"
        required: false
      - name: "page"
        type: "integer"
        required: false
      - name: "pageSize"
        type: "integer"
        required: false
  - name: "BookReservationPageResponse"
    properties:
      - name: "book"
        type: "BookSummary"
        required: true
      - name: "items"
        type: "array"
        items: "ReservationListItem"
        required: true
      - name: "page"
        type: "integer"
        required: true
      - name: "pageSize"
        type: "integer"
        required: true
      - name: "totalCount"
        type: "integer"
        required: true
      - name: "waitingCount"
        type: "integer"
        required: true
  - name: "ReservationListItem"
    properties:
      - name: "reservationId"
        type: "string"
        required: true
      - name: "queuePosition"
        type: "integer"
        required: true
      - name: "userNumber"
        type: "string"
        required: true
      - name: "userName"
        type: "string"
        required: true
      - name: "acceptedAt"
        type: "string"
        format: "date-time"
        required: true
      - name: "status"
        type: "string"
        enum: ["RESERVED", "NOTIFIED", "CANCELLED", "CLOSED"]
        required: true
      - name: "notifiedAt"
        type: "string"
        format: "date-time"
        required: false
      - name: "cancelledAt"
        type: "string"
        format: "date-time"
        required: false
  - name: "BookSummary"
    properties:
      - name: "bookId"
        type: "string"
        required: true
      - name: "title"
        type: "string"
        required: true
      - name: "author"
        type: "string"
        required: true
      - name: "mediaType"
        type: "string"
        enum: ["PAPER", "ELECTRONIC"]
        required: true
      - name: "status"
        type: "string"
        enum: ["AVAILABLE", "ON_LOAN", "RESERVED"]
        required: true
