# _api-summary.yaml
uc: "在庫状況一覧を参照する"
business: "運営分析業務"
buc: "蔵書の利用状況を分析するフロー"
endpoints:
  - method: "GET"
    path: "/api/v1/reports/inventory"
    summary: "書籍の状態別件数と、状態・ジャンルで絞り込んだ書籍一覧（ページネーション）を取得する"
    response_schema: "InventoryResponse"
    tags: ["reports"]
    security: ["bearer"]
    roles: ["司書"]
    parameters:
      - name: "status"
        in: "query"
        type: "string"
        required: false
        enum: ["AVAILABLE", "ON_LOAN", "RESERVED"]
        description: "書籍の状態: AVAILABLE（在庫あり）/ ON_LOAN（貸出中）/ RESERVED（予約待ち）"
      - name: "genreId"
        in: "query"
        type: "string"
        required: false
      - name: "page"
        in: "query"
        type: "integer"
        required: false
        default: 1
        minimum: 1
      - name: "pageSize"
        in: "query"
        type: "integer"
        required: false
        default: 20
        maximum: 100
    responses:
      "200": "InventoryResponse"
      "400": "ValidationProblemDetails"
      "401": "ProblemDetails"
      "403": "ProblemDetails"
    errors:
      - status: "400"
        code: "VALIDATION_ERROR"
      - status: "401"
        code: "UNAUTHENTICATED"
      - status: "403"
        code: "FORBIDDEN"
async_events: []
schemas:
  - name: "InventoryResponse"
    properties:
      - name: "summary"
        type: "object"
        schema: "InventorySummary"
        required: true
      - name: "items"
        type: "array"
        items: "InventoryBookItem"
        required: true
      - name: "page"
        type: "integer"
        required: true
      - name: "pageSize"
        type: "integer"
        required: true
      - name: "totalCount"
        type: "integer"
        required: true
  - name: "InventorySummary"
    properties:
      - name: "available"
        type: "integer"
        required: true
      - name: "onLoan"
        type: "integer"
        required: true
      - name: "reserved"
        type: "integer"
        required: true
      - name: "total"
        type: "integer"
        required: true
  - name: "InventoryBookItem"
    properties:
      - name: "bookId"
        type: "string"
        required: true
      - name: "title"
        type: "string"
        required: true
      - name: "author"
        type: "string"
        required: true
      - name: "isbn"
        type: "string"
        required: true
      - name: "publisher"
        type: "string"
        required: true
      - name: "genreId"
        type: "string"
        required: true
      - name: "genreName"
        type: "string"
        required: true
      - name: "mediaType"
        type: "string"
        required: true
        enum: ["PAPER", "ELECTRONIC"]
        description: "媒体種別: PAPER（紙）/ ELECTRONIC（電子）"
      - name: "status"
        type: "string"
        required: true
        enum: ["AVAILABLE", "ON_LOAN", "RESERVED"]
        description: "書籍の状態: AVAILABLE（在庫あり）/ ON_LOAN（貸出中）/ RESERVED（予約待ち）"
