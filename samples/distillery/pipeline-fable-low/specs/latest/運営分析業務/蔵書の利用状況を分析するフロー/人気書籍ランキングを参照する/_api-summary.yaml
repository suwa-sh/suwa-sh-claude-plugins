# _api-summary.yaml
uc: "人気書籍ランキングを参照する"
business: "運営分析業務"
buc: "蔵書の利用状況を分析するフロー"
endpoints:
  - method: "GET"
    path: "/api/v1/reports/popular-books"
    summary: "期間内の貸出回数が多い順の書籍ランキング（上位 N 件）を取得する"
    response_schema: "PopularBooksResponse"
    tags: ["reports"]
    security: ["bearer"]
    roles: ["司書"]
    parameters:
      - name: "periodType"
        in: "query"
        type: "string"
        required: true
        enum: ["DAY", "MONTH", "YEAR"]
        description: "集計期間種別: DAY（日）/ MONTH（月）/ YEAR（年）"
      - name: "from"
        in: "query"
        type: "string"
        format: "date"
        required: true
      - name: "to"
        in: "query"
        type: "string"
        format: "date"
        required: true
      - name: "limit"
        in: "query"
        type: "integer"
        required: false
        default: 20
        maximum: 100
    responses:
      "200": "PopularBooksResponse"
      "400": "ValidationProblemDetails"
      "401": "ProblemDetails"
      "403": "ProblemDetails"
    errors:
      - status: "400"
        code: "INVALID_PERIOD_RANGE"
      - status: "400"
        code: "VALIDATION_ERROR"
      - status: "401"
        code: "UNAUTHENTICATED"
      - status: "403"
        code: "FORBIDDEN"
async_events: []
schemas:
  - name: "PopularBooksResponse"
    properties:
      - name: "periodType"
        type: "string"
        required: true
        enum: ["DAY", "MONTH", "YEAR"]
        description: "集計期間種別: DAY（日）/ MONTH（月）/ YEAR（年）"
      - name: "from"
        type: "string"
        format: "date"
        required: true
      - name: "to"
        type: "string"
        format: "date"
        required: true
      - name: "totalLoans"
        type: "integer"
        required: true
      - name: "items"
        type: "array"
        items: "PopularBookItem"
        required: true
      - name: "aggregatedAt"
        type: "string"
        format: "date-time"
        required: true
  - name: "PopularBookItem"
    properties:
      - name: "ranking"
        type: "integer"
        required: true
      - name: "bookId"
        type: "string"
        required: true
      - name: "title"
        type: "string"
        required: true
      - name: "author"
        type: "string"
        required: true
      - name: "genreName"
        type: "string"
        required: true
      - name: "loanCount"
        type: "integer"
        required: true
