# _api-summary.yaml
uc: "リマインドを送信する"
business: "期限管理業務"
buc: "返却期限を通知するフロー"
endpoints: []   # タイマー UC（MQ コンシューマ）。外部公開 API なし（内部ユースケース SendReminderMail のみ）
async_events:
  - name: "ReminderMailRequested"
    channel: "notifications.reminder-mail-requested"
    direction: "subscribe"
    message_schema: "ReminderMailRequested"
    summary: "日次リマインド抽出バッチが発行した返却期限リマインドメール配信要求を消費し、メール配信サービス経由で送信して送信結果を通知レコードに反映する"
  - name: "ReminderMailRequested"
    channel: "notifications.reminder-mail-requested"
    direction: "publish"
    message_schema: "ReminderMailRequested"
    summary: "PENDING 滞留の再発行スイープ（tier-worker の ReminderSendSweepJob）が同一チャネルへ再発行する"
  - name: "ReminderMailRequestedDead"
    channel: "notifications.reminder-mail-requested.dlq"
    direction: "publish"
    message_schema: "ReminderMailRequestedDead"
    summary: "再配信上限（5 回）を超過したリマインド配信要求の退避先（手動再処理用）。退避ヘッダ 4 項目を付与する"
schemas:
  - name: "ReminderMailRequested"
    properties:
      - name: "notificationId"
        type: "string"
        required: true
      - name: "notificationType"
        type: "string"
        required: true
        enum: ["REMINDER"]
      - name: "targetLoanId"
        type: "string"
        required: true
      - name: "userNumber"
        type: "string"
        required: true
      - name: "requestedOn"
        type: "string"
        format: "date"
        required: true
      - name: "traceId"
        type: "string"
        required: true
  - name: "ReminderMailRequestedDead"
    description: "DLQ 退避メッセージ（asyncapi の ReminderMailRequestedDead）。ペイロードは ReminderMailRequested と同一。退避ヘッダ 4 項目（attemptCount / lastFailureReason / lastFailedAt / originalChannel）を必須で付与する"
    payload_schema: "ReminderMailRequested"
    headers:
      - name: "attemptCount"
        type: "integer"
        required: true
        description: "配信試行回数（再配信上限 5 回を超過した値。初回退避は 6）"
      - name: "lastFailureReason"
        type: "string"
        required: true
        description: "最後の失敗理由コード"
      - name: "lastFailedAt"
        type: "string"
        format: "date-time"
        required: true
        description: "最後に失敗した日時"
      - name: "originalChannel"
        type: "string"
        required: true
        description: "退避元のチャネル名"
