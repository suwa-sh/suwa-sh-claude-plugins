# _model-summary.yaml
uc: "延滞を判定する"
business: "期限管理業務"
buc: "延滞者に督促するフロー"

bounded_context_id: "BC-003"
aggregate_id: "AG-003"

models:
  - name: "OverdueDetectionJob"
    tier: "tier-worker"
    layer: "presentation"
    type: "request"
    rdra_info: ""
  - name: "DetectOverdueLoansCommand"
    tier: "tier-worker"
    layer: "usecase"
    type: "command"
    rdra_info: ""
  - name: "Loan"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "貸出"
  - name: "OverduePolicy"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "貸出"
  - name: "LoanOverdueEvent"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "貸出"
  - name: "Notification"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "通知"
  - name: "LoanRecord"
    tier: "tier-backend-api"
    layer: "repository"
    type: "record"
    rdra_info: "貸出"
  - name: "LoanEventRecord"
    tier: "tier-backend-api"
    layer: "repository"
    type: "record"
    rdra_info: "貸出"
  - name: "UserRecord"
    tier: "tier-backend-api"
    layer: "repository"
    type: "record"
    rdra_info: "利用者"
  - name: "NotificationRecord"
    tier: "tier-backend-api"
    layer: "repository"
    type: "record"
    rdra_info: "通知"
  - name: "OverdueNoticeRequested"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "value-object"
    rdra_info: "通知"

tables:
  - name: "loans"
    rdra_info: "貸出"
    operations:
      - type: "SELECT"
        columns: []
        where: "current_status = 'ON_LOAN' AND due_date < :asOf ORDER BY loan_id LIMIT :chunkSize（カーソル）"
      - type: "UPDATE"
        columns:
          - name: "current_status"
            value: "OVERDUE"
          - name: "version"
            value: "version + 1"
          - name: "updated_at"
            value: "現在時刻"
        where: "loan_id = :loanId AND version = :expectedVersion（楽観ロック）"
    indexes_needed:
      - columns: ["current_status", "due_date"]
        reason: "貸出中 × 返却期限超過の日次走査（〜10 万件、8 時間枠。リマインド抽出と共有）"
        access_pattern: "日次バッチのチャンク抽出"
  - name: "loan_events"
    rdra_info: "貸出"
    operations:
      - type: "INSERT"
        columns:
          - name: "loan_event_id"
            value: "ULID 採番"
          - name: "loan_id"
            value: "貸出.貸出ID"
          - name: "event_type"
            value: "OVERDUE"
          - name: "occurred_at"
            value: "判定時刻"
          - name: "actor_user_number"
            value: "system:{jobRunId}"
          - name: "from_status"
            value: "貸出中"
          - name: "to_status"
            value: "延滞"
        where: ""
    indexes_needed:
      - columns: ["loan_id", "occurred_at"]
        reason: "貸出履歴の時系列参照"
        access_pattern: "貸出履歴画面・監査"
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_number = :userNumber（送信先メールアドレスのコピー用）"
    indexes_needed: []
  - name: "notifications"
    rdra_info: "通知"
    operations:
      - type: "INSERT"
        columns:
          - name: "notification_id"
            value: "ULID 採番"
          - name: "user_number"
            value: "貸出.利用者番号"
          - name: "notification_type"
            value: "OVERDUE_NOTICE"
          - name: "recipient_email"
            value: "利用者の現在のメールアドレス"
          - name: "subject"
            value: "督促テンプレートの件名"
          - name: "body"
            value: "督促テンプレートの本文（書籍名・返却期限・延滞日数）"
          - name: "requested_on"
            value: ":asOf"
          - name: "send_result"
            value: "PENDING"
          - name: "sent_at"
            value: "NULL"
          - name: "target_loan_id"
            value: "貸出.貸出ID"
          - name: "target_reservation_id"
            value: "NULL"
        where: ""
    indexes_needed:
      - columns: ["target_loan_id", "notification_type", "requested_on"]
        reason: "重複送信防止の一意キー（SR-013）"
        access_pattern: "INSERT 時の一意制約 / 再実行時の既処理判定"
        unique: true

kvs:
  - key_pattern: "lock:job:overdue-detection:{asOf}"
    purpose: "再実行スキップ（対象日単位の完了マーカー。ジョブ実行 ID はキーに含めない）"
    value_type: "ジョブ完了フラグ + 完了させたジョブ実行 ID + 処理件数サマリ"
    ttl: "72h"
    operations: ["GET", "SET"]

object_storage: []
