tables:
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_number = :userNumber"
      - type: "UPDATE"
        columns:
          - name: "name"
            value: "入力値"
          - name: "email"
            value: "入力値"
          - name: "phone"
            value: "入力値（任意）"
          - name: "address"
            value: "入力値（任意）"
          - name: "version"
            value: "version + 1"
          - name: "updated_at"
            value: "現在日時"
        where: "user_number = :userNumber AND version = :expectedVersion"
    indexes_needed:
      - columns: ["user_number"]
        reason: "主キー参照"
        access_pattern: "利用者番号による 1 件取得・更新"
  - name: "user_events"
    rdra_info: "利用者"
    operations:
      - type: "INSERT"
        columns:
          - name: "event_id"
            value: "UUID"
          - name: "user_number"
            value: "対象利用者番号"
          - name: "event_type"
            value: "UPDATED"
          - name: "payload"
            value: "変更後の氏名・連絡先"
          - name: "occurred_at"
            value: "現在日時（更新日の正本）"
          - name: "actor_user_number"
            value: "操作した司書の利用者番号"
        where: ""
    indexes_needed:
      - columns: ["user_number", "occurred_at"]
        reason: "利用者ごとの履歴参照（registeredAt / updatedAt 導出）"
        access_pattern: "user_number で絞り occurred_at 順に取得"

