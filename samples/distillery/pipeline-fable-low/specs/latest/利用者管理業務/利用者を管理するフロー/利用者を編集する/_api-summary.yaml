# _api-summary.yaml
uc: "利用者を編集する"
business: "利用者管理業務"
buc: "利用者を管理するフロー"
endpoints:
  - method: "GET"
    path: "/api/v1/users/{userNumber}"
    summary: "利用者番号で利用者を取得する"
    response_schema: "UserResponse"
    tags: ["users"]
    security: ["bearer"]
    roles: ["司書"]
    parameters:
      - name: "userNumber"
        in: "path"
        type: "string"
        required: true
      - name: "include"
        in: "query"
        type: "string"
        required: false
        enum: ["activeCounts"]
    responses:
      "200": "UserResponse"
      "401": "ProblemDetails"
      "403": "ProblemDetails"
      "404": "ProblemDetails"
    errors:
      - status: "401"
        code: "UNAUTHENTICATED"
      - status: "403"
        code: "FORBIDDEN"
      - status: "404"
        code: "USER_NOT_FOUND"
  - method: "PUT"
    path: "/api/v1/users/{userNumber}"
    summary: "利用者情報（氏名・連絡先）を更新する（楽観ロック）"
    request_schema: "UpdateUserRequest"
    response_schema: "UserResponse"
    tags: ["users"]
    security: ["bearer"]
    roles: ["司書"]
    parameters:
      - name: "userNumber"
        in: "path"
        type: "string"
        required: true
    headers:
      - name: "Idempotency-Key"
        required: true
    responses:
      "200": "UserResponse"
      "400": "ValidationProblemDetails"
      "401": "ProblemDetails"
      "403": "ProblemDetails"
      "404": "ProblemDetails"
      "409": "ProblemDetails"
      "422": "ValidationProblemDetails"
    errors:
      - status: "400"
        code: "BAD_REQUEST"
      - status: "401"
        code: "UNAUTHENTICATED"
      - status: "403"
        code: "FORBIDDEN"
      - status: "404"
        code: "USER_NOT_FOUND"
      - status: "409"
        code: "OPTIMISTIC_LOCK_CONFLICT"
      - status: "422"
        code: "VALIDATION_ERROR"
async_events: []
schemas:
  - name: "UpdateUserRequest"
    properties:
      - name: "name"
        type: "string"
        required: true
      - name: "email"
        type: "string"
        format: "email"
        required: true
      - name: "phone"
        type: "string"
        required: false
      - name: "address"
        type: "string"
        required: false
      - name: "version"
        type: "integer"
        required: true
  - name: "UserResponse"
    properties:
      - name: "userNumber"
        type: "string"
        required: true
      - name: "name"
        type: "string"
        required: true
      - name: "email"
        type: "string"
        required: true
      - name: "phone"
        type: "string"
        required: false
      - name: "address"
        type: "string"
        required: false
      - name: "userType"
        type: "string"
        enum: ["PATRON", "STAFF"]
        description: "利用者区分（PATRON=利用者 / STAFF=司書）"
        required: true
      - name: "version"
        type: "integer"
        required: true
      - name: "registeredAt"
        type: "string"
        format: "date-time"
        required: true
      - name: "updatedAt"
        type: "string"
        format: "date-time"
        required: true
      - name: "activeLoanCount"
        type: "integer"
        description: "有効な貸出件数（include=activeCounts 指定時のみ）"
        required: false
      - name: "activeReservationCount"
        type: "integer"
        description: "有効な予約件数（include=activeCounts 指定時のみ）"
        required: false
  - name: "ProblemDetails"
    properties:
      - name: "type"
        type: "string"
        required: true
      - name: "title"
        type: "string"
        required: true
      - name: "status"
        type: "integer"
        required: true
      - name: "detail"
        type: "string"
        required: false
      - name: "code"
        type: "string"
        required: true
      - name: "traceId"
        type: "string"
        required: false
  - name: "ValidationProblemDetails"
    properties:
      - name: "code"
        type: "string"
        required: true
      - name: "errors"
        type: "array"
        items: "FieldError"
        required: true
  - name: "FieldError"
    properties:
      - name: "field"
        type: "string"
        required: true
      - name: "message"
        type: "string"
        required: true
