schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-004"
title: "横断関心事の解決方針: エラーハンドリング / ページネーション / 認証伝播 / 共通コンポーネント / トレーサビリティ"
status: "approved"
generated_at: "2026-09-03T08:48:37Z"
context: |
  2 ポータル（patron 6 画面 / staff 18 画面）の 24 tier-frontend から共通パターンを抽出した。
  RDRA トレーサビリティの網羅率は 98.2%（情報属性 56/58、その他のカテゴリは 100%）。
  UC ごとに独自のエラー表現・一覧 UI・確認 UI を持つと、UC 間の不整合と Story 生成時の重複が生じる。
decision: |
  横断関心事を次のとおり統一する。
  - エラー: RFC 9457 + 業務コード（400 / 401 / 403 / 404 / 409 / 422）。フロントは ErrorAlert / AsyncStateView で統一表示
  - ページネーション: offset 方式（page / pageSize）+ PaginatedListFrame
  - 認証伝播: IdP が発行した OIDC トークンを API Gateway で検証し、利用者区分クレームで粗粒度 RBAC を行う。本人限定判定（自分の貸出・予約のみ）は Backend API が行う
  - 共通コンポーネント: 17 件 + hooks 6 件を @/components/common に配置し、各 UC の tier-frontend が参照する
  - 確認ステップ: ConfirmPage（tone ∈ {destructive, primary} + blocked）に統一し、Modal は使わない
  - トレーサビリティ: 網羅率未達 2 件（貸出期間.更新日 / リマインド日数.更新日）は仕様側で補うのではなく、rdra-feedback.md で RDRA 側の属性削除を提案する
consequences:
  positive:
    - "UC 間で UI・エラー表現が一貫し、利用者・司書の学習コストが下がる"
    - "後段の Story 生成で共通コンポーネントをそのまま再利用できる"
    - "認可判定の責務が Gateway（粗粒度）と Backend（本人限定）で明確に分かれる"
  negative:
    - "共通コンポーネントの変更が 24 tier-frontend に波及し、影響範囲が広い"
    - "design-system への差分（ReservationQueueTracker の preview variant 追加）が必要"
    - "網羅率未達 2 件は RDRA 側の対応が完了するまで 100% にならない"
alternatives_considered:
  - name: "エラーを HTTP 200 の封筒レスポンスで返す"
    reason_rejected: "監視や Gateway で HTTP ステータスによる異常判定ができない"
  - name: "カーソルページネーション"
    reason_rejected: "ページ番号を表示する一覧 UI と不整合になり、司書向け画面の要件に合わない"
  - name: "UC ごとに独自コンポーネントを実装"
    reason_rejected: "24 画面で重複が生じ、UI・エラー表現の不整合を招く"
