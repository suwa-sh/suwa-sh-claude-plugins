schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-001"
title: "API スタイル選定: REST + OpenAPI 3.1 / RFC 9457"
status: "approved"
generated_at: "2026-09-03T08:48:37Z"
context: |
  27 UC のうち 22 UC が同期 API を持つ。
  2 系統の SPA（利用者向けポータル / 司書向けポータル）が API Gateway 経由で同一の Backend API を呼び出す。
  technology_context はフレームワーク未定・ベンダーニュートラルであり、特定言語や特定ミドルウェアに依存しない契約表現が必要。
  匿名アクセス可の公開経路（蔵書検索・予約待ち状況の照会など）と、司書ロール限定の経路を同一契約上で区別できることが求められる。
decision: |
  リソース指向 REST を採用し、OpenAPI 3.1 で Contract First に定義する。
  - パス: /api/v1/{複数形リソース名}。状態遷移は POST .../{id}/{action}、照会用は .../eligibility / .../lookup
  - エラー: RFC 9457 application/problem+json に code / traceId 拡張メンバーを追加
  - 一覧: offset ページネーション（page / pageSize、既定 20、上限 100）
  - 状態変更: Idempotency-Key ヘッダ（IETF draft の標準名。X- プレフィックスは RFC 6648 で非推奨のため使わない）+ version による楽観ロック
  - 表現: JSON プロパティは camelCase、enum は英語 UPPER_SNAKE_CASE
  - 経路制御: 公開経路と司書経路を security / x-roles で明示し、API Gateway での粗粒度 RBAC に対応させる
  理由: 22 UC の同期 API を 1 つの契約に統合でき、フレームワーク未定の状況でもクライアント / サーバー双方の型生成に使える。
consequences:
  positive:
    - "同一契約（openapi.yaml）から利用者向け SPA・司書向け SPA・Backend API の型を生成できる"
    - "匿名可の公開経路と司書経路を security / x-roles で明示し、API Gateway の経路制御と整合する"
    - "RFC 9457 + code / traceId により、エラーの機械判定とログ相関が UC 横断で統一される"
    - "Idempotency-Key + version により、再送と競合更新の扱いが全状態変更 API で一貫する"
  negative:
    - "offset ページネーションはデータが大規模化した場合にカーソル方式への移行が必要になる"
    - "状態遷移を POST .../{id}/{action} で表現するため、純粋な CRUD より endpoint 数が増える"
alternatives_considered:
  - name: "GraphQL"
    reason_rejected: "API Gateway での粗粒度 RBAC による経路分離（公開 / 司書）と相性が悪く、27 UC 規模のシステムには過剰"
  - name: "gRPC"
    reason_rejected: "ブラウザ SPA からの直接呼び出しに不向きで、別途プロキシ層が必要になる"
  - name: "RPC 風 REST（動詞ベースの endpoint）"
    reason_rejected: "リソースの一貫性が崩れ、API Gateway でのパス単位の経路制御が困難になる"
