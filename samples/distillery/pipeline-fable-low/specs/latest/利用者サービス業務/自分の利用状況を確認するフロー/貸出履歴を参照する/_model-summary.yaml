# _model-summary.yaml
uc: "貸出履歴を参照する"
business: "利用者サービス業務"
buc: "自分の利用状況を確認するフロー"

bounded_context_id: "BC-003"

models:
  - name: "MyLoansPageState"
    tier: "tier-frontend-user"
    layer: "view"
    type: "view-model"
    rdra_info: "貸出"
  - name: "MyLoanPage（api-client）"
    tier: "tier-frontend-user"
    layer: "api-client"
    type: "request"
    rdra_info: "貸出"
  - name: "ListMyLoansQueryParams"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "貸出"
  - name: "ListMyLoansQuery"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "query"
    rdra_info: "貸出"
  - name: "Loan"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "貸出"
  - name: "DueDatePolicy"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "リマインド日数"
  - name: "LoanRecord / LoanEventRecord / BookRecord / RemindDaysRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "貸出"

tables:
  - name: "loans"
    rdra_info: "貸出"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_number = :tokenUserNumber AND current_status IN ('ON_LOAN','OVERDUE') ORDER BY due_date LIMIT :pageSize OFFSET :offset（current）"
      - type: "SELECT"
        columns: []
        where: "user_number = :tokenUserNumber AND current_status = 'RETURNED' ORDER BY loaned_on DESC LIMIT/OFFSET（history）"
      - type: "SELECT"
        columns: []
        where: "COUNT(*) WHERE user_number = :tokenUserNumber AND current_status IN (...)（totalCount / overdueCount）"
    indexes_needed:
      - columns: ["user_number", "current_status", "due_date"]
        reason: "利用者ごとの現在の貸出を返却期限順に取得"
        access_pattern: "WHERE user_number = ? AND current_status IN (...) ORDER BY due_date"
      - columns: ["user_number", "loaned_on"]
        reason: "利用者ごとの履歴を貸出日降順に取得"
        access_pattern: "WHERE user_number = ? ORDER BY loaned_on DESC"
  - name: "loan_events"
    rdra_info: "貸出"
    operations:
      - type: "SELECT"
        columns: []
        where: "loan_id IN (...) AND event_type = 'RETURNED'（返却日の導出）"
    indexes_needed:
      - columns: ["loan_id", "occurred_at"]
        reason: "貸出ごとのイベント履歴（返却日の導出）"
        access_pattern: "WHERE loan_id IN (...) ORDER BY occurred_at"
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id IN (...)（書籍要約の結合）"
    indexes_needed: []
  - name: "remind_days_settings"
    rdra_info: "リマインド日数"
    operations:
      - type: "SELECT"
        columns: []
        where: "valid_from <= :today AND (valid_to IS NULL OR valid_to >= :today)（現行世代）"
    indexes_needed:
      - columns: ["valid_from", "valid_to"]
        reason: "本日時点の有効世代の解決"
        access_pattern: "WHERE valid_from <= ? AND (valid_to IS NULL OR valid_to >= ?)"

kvs:
  - key_pattern: "cache:loans:me:{userNumber}:{scope}:{page}:{pageSize}"
    purpose: "cache"
    value_type: "MyLoanPageResponse（Cache-Aside。貸出の状態遷移で無効化）"
    ttl: "5m"
    operations: ["GET", "SET", "DEL"]

object_storage: []
