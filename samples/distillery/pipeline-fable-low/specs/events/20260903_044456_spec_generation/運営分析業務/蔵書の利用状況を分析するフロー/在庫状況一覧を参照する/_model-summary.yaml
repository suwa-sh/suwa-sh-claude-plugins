# _model-summary.yaml
uc: "在庫状況一覧を参照する"
business: "運営分析業務"
buc: "蔵書の利用状況を分析するフロー"

bounded_context_id: "BC-006"

models:
  - name: "InventoryReportPage"
    tier: "tier-frontend-staff"
    layer: "view"
    type: "view-model"
    rdra_info: "書籍"
  - name: "InventoryQueryParams"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "書籍"
  - name: "GetInventoryQuery"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "query"
    rdra_info: "書籍"
  - name: "Book"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "書籍"
  - name: "InventorySummary"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "書籍"
  - name: "BookRecord"
    tier: "tier-backend-api"
    layer: "repository"
    type: "record"
    rdra_info: "書籍"
  - name: "GenreRecord"
    tier: "tier-backend-api"
    layer: "repository"
    type: "record"
    rdra_info: "ジャンル"
  - name: "InventoryResponse"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "view-model"
    rdra_info: "書籍"

tables:
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "GROUP BY current_status（状態別件数）"
      - type: "SELECT"
        columns: []
        where: "(:status IS NULL OR current_status = :status) AND (:genreId IS NULL OR genre_id = :genreId) ORDER BY title, book_id LIMIT :pageSize OFFSET :offset / COUNT(*)"
    indexes_needed:
      - columns: ["current_status", "genre_id", "title"]
        reason: "状態 × ジャンル絞り込みとタイトル順ページング"
        access_pattern: "一覧画面のページ切替ごとに 1 回"
      - columns: ["current_status"]
        reason: "状態別件数の GROUP BY（キャッシュミス時）"
        access_pattern: "60 秒に 1 回程度"
  - name: "genres"
    rdra_info: "ジャンル"
    operations:
      - type: "SELECT"
        columns: []
        where: "genre_id IN (:genreIds)（ジャンル名の付与）"
    indexes_needed: []

kvs:
  - key_pattern: "cache:report:inventory-summary"
    purpose: "cache"
    value_type: "InventorySummary（JSON）"
    ttl: "60s"
    operations: ["GET", "SET", "DEL"]

object_storage: []
