schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-002"
title: "イベント駆動パターン: 通知配信の MQ 非同期化 + Competing Consumers + DLQ"
status: "approved"
generated_at: "2026-09-03T08:48:37Z"
context: |
  メール配信サービスは外部サービスであり、遅延や失敗が発生しうる。
  通知の契機は 3 系統ある。返却通知は司書の返却操作、リマインド通知と督促通知は日次バッチが契機となる。
  NFR で通知の重複防止・漏れ防止と、バッチの再実行可能性が要求されている。
  technology_context はベンダーニュートラルであり、特定のメッセージブローカーに依存しない契約（AsyncAPI）で表現する必要がある。
decision: |
  通知配信のみを MQ で非同期化する。
  - 発行: 通知レコード（status = PENDING）を RDB に作成するのと同一トランザクション内で、notifications.{種別}-requested チャネルへ配信要求を発行する
  - 消費: 通知ワーカーが Competing Consumers として消費し、メール送信と結果（SENT / FAILED）の反映を行う
  - 失敗: 指数バックオフで最大 5 回リトライし、超過分は notifications.{種別}-requested.dlq へ退避して手動再処理する
  - ペイロード: PII を載せず notificationId / userNumber のみを運び、本文はワーカーが RDB から引く
  - 契約: AsyncAPI 3.0.0 で定義し、プロトコルは代表として amqp を記載するがベンダーニュートラルに保つ
  理由: 外部メール配信の遅延・障害を窓口操作やバッチから切り離しつつ、notificationId による冪等消費で重複・漏れを防げる。
consequences:
  positive:
    - "API 応答（返却処理）とバッチがメール送信の完了を待たない"
    - "notificationId をキーとした冪等消費により、再配信やバッチ再実行でも通知が重複しない"
    - "ワーカーを水平スケールでき、DLQ で失敗通知を取りこぼさない"
    - "メッセージに PII を含めないため、ブローカー側のデータ保護要件が軽くなる"
  negative:
    - "PENDING の滞留と DLQ の監視・アラートが運用上必須になる"
    - "RDB 書き込みとメッセージ発行の原子性（Outbox 相当の順序保証）を実装側で守る必要がある"
    - "ドメインイベントの汎用配信は行わないため、他の非同期連携が必要になれば別途設計する"
alternatives_considered:
  - name: "同期送信（API / バッチ内でメール配信 API を直接呼ぶ）"
    reason_rejected: "外部メール配信サービスの障害・遅延が窓口操作を止め、バッチの再実行可能性も損なう"
  - name: "ドメインイベント発行 + 通知 BC による購読"
    reason_rejected: "モジュラモノリス構成には過剰で、イベント設計とスキーマ進化の負担が大きい"
  - name: "DB ポーリングのみ（MQ を使わない）"
    reason_rejected: "配信遅延と RDB への定期負荷が生じ、ワーカーの水平スケールが困難"
