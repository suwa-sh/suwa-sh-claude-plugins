tables:
  - name: "loans"
    rdra_info: "貸出"
    operations:
      - type: "SELECT"
        columns: []
        where: "current_status = 'OVERDUE' AND (:userNumber IS NULL OR user_number = :userNumber) ORDER BY due_date, loan_id LIMIT :pageSize OFFSET :offset / COUNT(*)"
    indexes_needed:
      - columns: ["current_status", "due_date"]
        reason: "延滞 × 返却期限順のページング（リマインド抽出と共有）"
        access_pattern: "延滞一覧のページ切替ごとに 1 回"
      - columns: ["user_number", "current_status"]
        reason: "利用者番号での絞り込み"
        access_pattern: "利用者指定時"
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_number IN (:userNumbers)（氏名・メールアドレスの付与）"
    indexes_needed: []
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id IN (:bookIds)（タイトルの付与）"
    indexes_needed: []
  - name: "notifications"
    rdra_info: "通知"
    operations:
      - type: "SELECT"
        columns: []
        where: "target_loan_id IN (:loanIds) AND notification_type = 'OVERDUE_NOTICE'（貸出ごとに requested_on 最大の 1 件 + COUNT）"
      - type: "SELECT"
        columns: []
        where: "target_loan_id = :loanId ORDER BY requested_on DESC, notification_id DESC"
    indexes_needed:
      - columns: ["target_loan_id", "notification_type", "requested_on"]
        reason: "貸出別の最新督促・通知記録の取得（UNIQUE と兼用）"
        access_pattern: "一覧 1 ページにつき 1 回（IN 句）/ 行展開ごとに 1 回"
        unique: true

kvs: []

object_storage: []
