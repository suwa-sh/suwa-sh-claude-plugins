# _model-summary.yaml
uc: "督促を送信する"
business: "期限管理業務"
buc: "延滞者に督促するフロー"

bounded_context_id: "BC-005"
aggregate_id: "AG-006"

models:
  - name: "OverdueNoticeConsumer"
    tier: "tier-worker"
    layer: "presentation"
    type: "request"
    rdra_info: "通知"
  - name: "OverdueNoticeSweepJob"
    tier: "tier-worker"
    layer: "presentation"
    type: "request"
    rdra_info: "通知"
  - name: "SendOverdueNoticeCommand"
    tier: "tier-worker"
    layer: "usecase"
    type: "command"
    rdra_info: "通知"
  - name: "Notification"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "通知"
  - name: "Loan"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "貸出"
  - name: "Book"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "書籍"
  - name: "OverduePolicy"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "貸出"
  - name: "NotificationRecord"
    tier: "tier-backend-api"
    layer: "repository"
    type: "record"
    rdra_info: "通知"
  - name: "LoanRecord"
    tier: "tier-backend-api"
    layer: "repository"
    type: "record"
    rdra_info: "貸出"
  - name: "BookRecord"
    tier: "tier-backend-api"
    layer: "repository"
    type: "record"
    rdra_info: "書籍"
  - name: "MailDeliveryRequest"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "value-object"
    rdra_info: "通知"
  - name: "MailDeliveryResult"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "value-object"
    rdra_info: "通知"
  - name: "OverdueNoticeRequested"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "value-object"
    rdra_info: "通知"

tables:
  - name: "notifications"
    rdra_info: "通知"
    operations:
      - type: "SELECT"
        columns: []
        where: "notification_id = :notificationId"
      - type: "SELECT"
        columns: []
        where: "send_result = 'PENDING' AND notification_type = 'OVERDUE_NOTICE' AND requested_on <= :asOf（再発行スイープ）"
      - type: "UPDATE"
        columns:
          - name: "send_result"
            value: "成功 / 失敗 / スキップ"
          - name: "sent_at"
            value: "送信日時（成功時のみ）"
          - name: "failure_reason"
            value: "失敗理由コード（失敗時のみ）"
          - name: "external_message_id"
            value: "外部メッセージ ID（成功時のみ）"
        where: "notification_id = :notificationId AND send_result = 'PENDING'（条件付き UPDATE）"
    indexes_needed:
      - columns: ["send_result", "notification_type", "requested_on"]
        reason: "送信待ちの再発行スイープ"
        access_pattern: "日次督促送信バッチで 1 回"
  - name: "loans"
    rdra_info: "貸出"
    operations:
      - type: "SELECT"
        columns: []
        where: "loan_id = :targetLoanId（送信直前の延滞再確認）"
    indexes_needed: []
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = :bookId（本文の書籍名）"
    indexes_needed: []

kvs:
  - key_pattern: "lock:notification:{notificationId}"
    purpose: "lock"
    value_type: "処理済みフラグ + 処理結果（SENT / FAILED / SKIPPED）"
    ttl: "72h"
    operations: ["GET", "SET"]

object_storage: []
