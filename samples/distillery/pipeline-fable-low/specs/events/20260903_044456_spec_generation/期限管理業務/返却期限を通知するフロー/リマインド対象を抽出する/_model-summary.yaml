# _model-summary.yaml
uc: "リマインド対象を抽出する"
business: "期限管理業務"
buc: "返却期限を通知するフロー"

bounded_context_id: "BC-003"
aggregate_id: "AG-003"

models:
  - name: "ReminderExtractionJob"
    tier: "tier-worker"
    layer: "presentation"
    type: "request"
    rdra_info: ""
  - name: "ExtractReminderTargetsCommand"
    tier: "tier-worker"
    layer: "usecase"
    type: "command"
    rdra_info: ""
  - name: "Loan"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "貸出"
  - name: "ReminderPolicy"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "リマインド日数"
  - name: "Notification"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "通知"
  - name: "LoanRecord"
    tier: "tier-backend-api"
    layer: "repository"
    type: "record"
    rdra_info: "貸出"
  - name: "RemindDaysRecord"
    tier: "tier-backend-api"
    layer: "repository"
    type: "record"
    rdra_info: "リマインド日数"
  - name: "NotificationRecord"
    tier: "tier-backend-api"
    layer: "repository"
    type: "record"
    rdra_info: "通知"
  - name: "ReminderMailRequested"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "value-object"
    rdra_info: "通知"

tables:
  - name: "loans"
    rdra_info: "貸出"
    operations:
      - type: "SELECT"
        columns: []
        where: "current_status = 'ON_LOAN' AND due_date BETWEEN :asOf AND :asOf + :remindDays ORDER BY loan_id LIMIT :chunkSize（カーソル）"
    indexes_needed:
      - columns: ["current_status", "due_date"]
        reason: "貸出中 × 返却期限範囲の日次走査（〜10 万件、8 時間枠）"
        access_pattern: "日次バッチのチャンク抽出"
  - name: "remind_days_settings"
    rdra_info: "リマインド日数"
    operations:
      - type: "SELECT"
        columns: []
        where: "valid_from <= :asOf AND (valid_to IS NULL OR valid_to >= :asOf)"
    indexes_needed:
      - columns: ["valid_from", "valid_to"]
        reason: "asOf 時点の有効世代の解決"
        access_pattern: "バッチ開始時に 1 回"
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_number = :userNumber（送信先メールアドレスのコピー用）"
    indexes_needed: []
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = :bookId（本文の書籍名）"
    indexes_needed: []
  - name: "notifications"
    rdra_info: "通知"
    operations:
      - type: "INSERT"
        columns:
          - name: "notification_id"
            value: "ULID 採番"
          - name: "user_number"
            value: "貸出.利用者番号"
          - name: "notification_type"
            value: "REMINDER"
          - name: "recipient_email"
            value: "利用者の現在のメールアドレス"
          - name: "subject"
            value: "リマインドテンプレートの件名"
          - name: "body"
            value: "リマインドテンプレートの本文（書籍名・返却期限）"
          - name: "requested_on"
            value: ":asOf"
          - name: "send_result"
            value: "PENDING"
          - name: "sent_at"
            value: "NULL"
          - name: "target_loan_id"
            value: "貸出.貸出ID"
          - name: "target_reservation_id"
            value: "NULL"
        where: ""
    indexes_needed:
      - columns: ["target_loan_id", "notification_type", "requested_on"]
        reason: "重複送信防止の一意キー（SR-013）"
        access_pattern: "INSERT 時の一意制約 / 再実行時の既処理判定"
        unique: true

kvs:
  - key_pattern: "lock:job:reminder-extraction:{asOf}"
    purpose: "再実行スキップ（対象日単位の完了マーカー。ジョブ実行 ID はキーに含めない）"
    value_type: "ジョブ完了フラグ + 完了させたジョブ実行 ID + 処理件数サマリ"
    ttl: "72h"
    operations: ["GET", "SET"]

object_storage: []
