round: 1
group: datastore
findings:
  # ---- rdb-schema.yaml ----
  - id: S4-datastore-001
    artifact: "rdb-schema.yaml"
    file: "docs/specs/events/20260903_044456_spec_generation/_cross-cutting/datastore/rdb-schema.yaml"
    line: 186
    severity: major
    viewpoint: 3
    claim: "*_events.event_type の格納値が正本（api-conventions.md）から逸脱している。book_events に正本に無い RESERVATION_CANCELLED を追加し、reservation_events の予約登録イベントを正本の RESERVED（予約）ではなく REGISTERED としている。_review_notes（L11）の一覧も正本と食い違う（RESERVED / CLOSED が無く RESERVATION_CANCELLED がある）"
    fix: "book_events.event_type（L186）の RESERVATION_CANCELLED を正本の CANCELLED（予約取消で在庫ありへ遷移）に置換する。reservation_events.event_type（L780）の予約登録を REGISTERED から RESERVED（予約）に変更し、description に「_model-summary.yaml の '登録' は RESERVED に対応」と注記する。_review_notes（L11）の一覧を api-conventions.md の 10 値（REGISTERED / UPDATED / DELETED / LOANED / RETURNED / OVERDUE / RESERVED / NOTIFIED / CANCELLED / CLOSED）に揃える。正本側に値を追加したい場合は api-conventions.md を先に更新する"
    source_refs:
      - "docs/specs/events/20260903_044456_spec_generation/_review/api-conventions.md#enum（イベント種別 event_type 行）"
      - "docs/specs/events/20260903_044456_spec_generation/貸出業務/書籍を予約するフロー/予約を取り消す/_model-summary.yaml（book_events.event_type: 予約取消）"
      - "docs/specs/events/20260903_044456_spec_generation/貸出業務/書籍を予約するフロー/予約を登録する/_model-summary.yaml（reservation_events.event_type: 登録）"
  - id: S4-datastore-002
    artifact: "rdb-schema.yaml"
    file: "docs/specs/events/20260903_044456_spec_generation/_cross-cutting/datastore/rdb-schema.yaml"
    line: 965
    severity: major
    viewpoint: 3
    claim: "loan_statistics.loan_total の description が「期間内の全書籍の貸出合計」となっており、期間 × 書籍で 1 行のテーブルで各行に全体合計を持つと、期間別貸出統計 UC の集計（GROUP BY period_start, period_end で SUM(loan_total)）が書籍行数分だけ過大になる。情報.tsv の「貸出回数」「貸出件数」との対応も曖昧"
    fix: "loan_total の意味を UC のアクセスパターンと矛盾しない形に確定する。案 A: loan_total を「当該行（期間 × 書籍）の貸出件数（loan_count と同義。貸出回数 = 利用者ののべ借用回数、貸出件数 = 貸出レコード数、として区別する場合は定義を明記）」とし SUM で期間合計を得る。案 B: 全体合計を保持するなら期間 × 書籍行から分離した loan_statistics_periods（period_type, period_start, period_end, loan_total）に正規化し、UC の SUM(loan_total) を当該テーブル参照に置換する旨を _review_notes に記す。いずれも description に「期間別貸出統計 UC は SUM(loan_total) で集計する」と整合する一文を追加する"
    source_refs:
      - "docs/specs/events/20260903_044456_spec_generation/運営分析業務/蔵書の利用状況を分析するフロー/期間別貸出統計を参照する/_model-summary.yaml（loan_statistics SELECT GROUP BY period_start, period_end（SUM(loan_total)））"
      - "docs/rdra/latest/情報.tsv#貸出統計（貸出回数、貸出件数）"
  - id: S4-datastore-003
    artifact: "rdb-schema.yaml"
    file: "docs/specs/events/20260903_044456_spec_generation/_cross-cutting/datastore/rdb-schema.yaml"
    line: 625
    severity: minor
    viewpoint: 3
    claim: "loan_periods / remind_days_settings のユニーク制約 uq_*_valid_from が (valid_from, valid_to) の複合だが、valid_to に NULL を含む行は多くの RDB で一意判定の対象外になるため「同一適用開始日の世代重複防止」を保証できない。インデックス名も valid_from 単独を示していて実体と一致しない"
    fix: "ユニーク制約を valid_from 単独（uq_loan_periods_valid_from: [valid_from], uq_remind_days_settings_valid_from: [valid_from]）にし、現行世代取得用に非ユニークの (valid_to, valid_from) を別インデックスとして分ける。または reason に「valid_to が NULL の行は一意判定対象外なので、現行世代 1 件の保証はアプリ側の直列化で行う」と明記する（remind_days_settings L661 も同様）"
    source_refs:
      - "docs/specs/events/20260903_044456_spec_generation/貸出業務/書籍を貸し出すフロー/貸出を登録する/_model-summary.yaml（loan_periods indexes_needed [valid_from, valid_to]）"
      - "docs/specs/events/20260903_044456_spec_generation/期限管理業務/返却期限を通知するフロー/リマインド対象を抽出する/_model-summary.yaml（remind_days_settings indexes_needed）"
  - id: S4-datastore-004
    artifact: "rdb-schema.yaml"
    file: "docs/specs/events/20260903_044456_spec_generation/_cross-cutting/datastore/rdb-schema.yaml"
    line: 92
    severity: minor
    viewpoint: 3
    claim: "books のインデックス名 fk_books_genres だけが他の idx_ / uq_ 接頭辞の命名規則から外れている（実体は (genre_id, updated_at) の検索用複合インデックスで FK 制約名ではない）"
    fix: "name を idx_books_genre_id_updated_at に改名する（reason の「genres への FK 参照」は残してよい）"
    source_refs:
      - "docs/specs/events/20260903_044456_spec_generation/蔵書管理業務/書籍を検索するフロー/書籍を検索する/_model-summary.yaml（books indexes_needed [genre_id, updated_at]）"

  # ---- kvs-schema.yaml ----
  - id: S4-datastore-005
    artifact: "kvs-schema.yaml"
    file: "docs/specs/events/20260903_044456_spec_generation/_cross-cutting/datastore/kvs-schema.yaml"
    line: 51
    severity: minor
    viewpoint: 4
    claim: "キー命名規則「{目的}:{種別}:{識別子} のコロン区切り階層」に対し、cache 系が cache:books:detail:{bookId}（コロン階層）と cache:book-reservations:{bookId} / cache:me-loans:{userNumber} / cache:user-usage:{userNumber}（ハイフン結合で 1 階層）の 2 流儀で混在している。lock 系も job: / dedupe: / consumer: と purpose ごとに接頭辞が 3 種あり、purpose=lock からキーを逆引きできない"
    fix: "cache 系を cache:{リソース}:{サブ種別}:{識別子} に統一する（例: cache:reservations:book:{bookId}:..., cache:loans:me:{userNumber}:..., cache:reservations:me:{userNumber}:..., cache:users:usage:{userNumber}:{loanScope}）。lock 系は lock:{種別}:{識別子} に寄せる（lock:job:reminder-extraction:..., lock:notification:{notificationId}, lock:consumer:return-notice:{notificationId}）か、ヘッダコメントに「lock 系は job / dedupe / consumer の 3 接頭辞を用いる」と例外を明記する。改名した場合は該当 UC の _model-summary.yaml / tier md の追随を Step7 の TODO に記す"
    source_refs:
      - "docs/specs/events/20260903_044456_spec_generation/貸出業務/書籍を予約するフロー/予約一覧を参照する/_model-summary.yaml（kvs cache:book-reservations）"
      - "docs/specs/events/20260903_044456_spec_generation/利用者サービス業務/自分の利用状況を確認するフロー/貸出履歴を参照する/_model-summary.yaml（kvs cache:me-loans）"
      - "docs/specs/events/20260903_044456_spec_generation/期限管理業務/延滞者に督促するフロー/督促を送信する/_model-summary.yaml（kvs dedupe:notification）"
  - id: S4-datastore-006
    artifact: "kvs-schema.yaml"
    file: "docs/specs/events/20260903_044456_spec_generation/_cross-cutting/datastore/kvs-schema.yaml"
    line: 20
    severity: minor
    viewpoint: 4
    claim: "session:{sessionId} の ttl が「IdP のセッション設定に従う」で具体値が無く、唯一 TTL が未確定のキーになっている"
    fix: "ttl に既定値を書く（例: \"8h（IdP の絶対有効期限に同期。IdP 側設定を正とし、ここは既定値）\"）。NFR に該当項目があればその値を引用する"
    source_refs:
      - "docs/specs/events/20260903_044456_spec_generation/利用者管理業務/利用者を管理するフロー/利用者を削除する/_model-summary.yaml（kvs session:{sessionId} ttl: IdP 設定に従う）"
