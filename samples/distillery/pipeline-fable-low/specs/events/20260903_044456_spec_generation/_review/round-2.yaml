      (2) roles: 単一トークン列に限定（`利用者(本人)` / `利用者(本人)|司書` / `利用者|司書` を解消）。openapi の x-roles（STAFF / PATRON / ANONYMOUS）と 1 対 1 対応の順序で生成。
          「本人のみ」は新キー ownership: self で表現（GET /me/loans, GET /me/reservations, GET /reservations/{reservationId}, POST /reservations/{reservationId}/cancel）。
      (3) security: x-roles に ANONYMOUS を含む operation のみ ["bearer", "anonymous"]。同一エンドポイントの UC 間の割れ（GET /api/v1/books/{bookId} 等）を解消。
      (4) レスポンス表現を responses に一本化（response_status を廃止し、全 30 operation で responses マップを openapi から生成）。
      あわせて openapi.yaml の規約セクションに 500 の宣言方針と roles / x-roles 語彙・ownership の対応を明記した。
