    evidence: "(1) errors の 500: 16 endpoint が `status: '500' / code: INTERNAL_ERROR` を宣言するが、openapi.yaml で 500 を宣言する operation は POST /api/v1/loans の 1 件のみ（InternalServerError の出現は定義 + 参照の 2 箇所）。(2) 逆向きの欠落: openapi が 429 RATE_LIMITED を宣言する 8 operation（GET /api/v1/books・/genres・/books/{bookId}・/me/loans・/me/reservations・/reservations/{reservationId}・POST /api/v1/reservations 等）で UC 側 errors に 429 が 0 件。POST /api/v1/users と PUT /api/v1/users/{userNumber} は openapi が 400 を宣言するのに UC 側 errors に 400 が無い（書籍側 POST /api/v1/books は 400 BAD_REQUEST を宣言しており非対称）。GET /api/v1/genres は UC 側が 401 / 403 を宣言するが openapi には無い（anonymous 許可の公開エンドポイント）。GET /api/v1/books/{bookId} は UC 側が 403 を宣言するが openapi には無い。(3) roles の語彙: 単一トークンのリストになっておらず `利用者(本人)`（予約状況を参照する / 貸出履歴を参照する / 予約を取り消す）、`利用者(本人)|司書`・`利用者|司書`（予約を取り消す / 予約を登録する）のように 1 要素に 2 ロールと限定子を詰め込んだ値がある。匿名は UC 側が `匿名`、openapi の x-roles が `ANONYMOUS` で対応表が無い。(4) 同一エンドポイントの宣言が UC 間で割れる: GET /api/v1/books/{bookId} は 書籍詳細を参照する が security [bearer, anonymous] / roles [司書, 利用者, 匿名]、書籍を編集する が security [bearer] / roles [司書, 利用者]。(5) レスポンス表現は依然 3 系統: responses（蔵書管理・利用者管理の 15 endpoint）/ response_status（貸出系 5 endpoint）/ どちらも無し（12 UC の 14 endpoint）"
    suggested_fix: "openapi の各 operation の responses を正として errors を機械生成する（500 と 429 の宣言方針をどちらかに統一し、GET /api/v1/genres の 401 / 403 と GET /api/v1/books/{bookId} の 403 は openapi 側に追加するか UC 側から削除する）。roles は `[司書]` `[利用者]` `[匿名]` の単一トークン列に限定し、「本人のみ」は roles ではなく別キー（例: ownership: self）で表現する。openapi の x-roles と同じ語彙に揃える。レスポンス表現は responses に一本化する"

