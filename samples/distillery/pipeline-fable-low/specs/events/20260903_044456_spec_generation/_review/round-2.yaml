    note: |
      openapi.yaml の各 operation の responses / x-roles を正として、23 UC の _api-summary.yaml（30 operation）を機械生成で揃えた。
      (1) errors: 汎用 500 INTERNAL_ERROR の個別宣言を全 UC から削除（業務条件の 500 は POST /api/v1/loans の LOAN_PERIOD_NOT_CONFIGURED のみ残す）。
