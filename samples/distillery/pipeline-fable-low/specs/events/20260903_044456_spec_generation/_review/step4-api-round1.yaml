  # ---- 観点1: 連絡先マスク（reveal）の契約不整合 ----
  - id: S4-api-004
    artifact: "openapi.yaml"
    file: "docs/specs/events/20260903_044456_spec_generation/_cross-cutting/api/openapi.yaml"
    line: 543
    severity: major
    viewpoint: 1
    claim: "NotificationLogItem.recipientEmail（L2614）は「`reveal=true` のときのみ返す」と定義されているが、それを返す `GET /api/v1/loans/{loanId}/notifications`（L543）と `GET /api/v1/loans`（include=latestNotice で latestNotice に同スキーマを含む: L337）のどちらにも `Reveal` パラメータが無く、平文を要求する手段が契約上存在しない。UC「延滞一覧を参照する」の _api-summary.yaml は NotificationLogItem.recipientEmail を required としており、統合時に既定マスクへ変更した意図がパスに反映されていない"
    fix: "listLoanNotifications と listLoans の parameters に `$ref: \"#/components/parameters/Reveal\"` を追加し、description に「reveal=true のとき latestNotice.recipientEmail / items[].recipientEmail を開示し監査ログに記録する（NFR E.1.2.1 / E.6.1.1）」を追記する。あわせて NotificationLogItem の description（L2598-2601）に「`GET /loans` / `GET /loans/{loanId}/notifications` の reveal も同じ扱い」と明記する"
    source_refs:
      - "docs/specs/events/20260903_044456_spec_generation/期限管理業務/延滞者に督促するフロー/延滞一覧を参照する/_api-summary.yaml#schemas.NotificationLogItem.recipientEmail"
      - "docs/specs/events/20260903_044456_spec_generation/貸出業務/書籍を返却するフロー/返却通知を送信する/_api-summary.yaml#endpoints[0].query_params.reveal"
  - id: S4-api-005
    artifact: "openapi.yaml"
    file: "docs/specs/events/20260903_044456_spec_generation/_cross-cutting/api/openapi.yaml"
    line: 1786
    severity: minor
    viewpoint: 1
    claim: "UserSummary は `email`（平文）を required としており LoanResponse / ReturnResponse / OverdueLoanItem.user で無条件に返るが、同じ司書経路の UserUsageProfile（L1946）と RecipientSummary（L2645）は「既定でマスク・reveal=true で平文」に統一されている。同一仕様内で連絡先マスク方針が二重化している"
    fix: "UserSummary を `emailMasked`（required）+ `email`（reveal=true のときのみ）に揃え、UserSummary を返す listLoans / createLoan / returnLoan / lookupReturn に Reveal パラメータを追加する。もしくは方針として「一覧・登録系は司書経路のため平文固定」を info.description の規約節に明記して意図的な差であることを示す"
    source_refs:
      - "docs/specs/events/20260903_044456_spec_generation/期限管理業務/延滞者に督促するフロー/延滞一覧を参照する/_api-summary.yaml#schemas.UserSummary.email"
      - "docs/specs/events/20260903_044456_spec_generation/利用者サービス業務/自分の利用状況を確認するフロー/利用者の利用状況を参照する/_api-summary.yaml"

