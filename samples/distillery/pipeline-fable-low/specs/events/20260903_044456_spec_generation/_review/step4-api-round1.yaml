  - id: S4-api-008
    artifact: "asyncapi.yaml"
    file: "docs/specs/events/20260903_044456_spec_generation/_cross-cutting/api/asyncapi.yaml"
    line: 47
    severity: minor
    viewpoint: 2
    claim: "DLQ チャネル（returnNoticeRequestedDlq / reminderMailRequestedDlq / overdueNoticeRequestedDlq）は元チャネルと同一メッセージを再利用しており、手動再処理に必要な退避情報（再配信回数・最終失敗理由・最終失敗日時・元チャネル名）がペイロードにもヘッダにも定義されていない。「再配信上限 5 回超過で退避して手動再処理」という運用（L15）に対しスキーマが具体化されていない"
    fix: "components.messageTraits に `dlqHeaders`（`attemptCount` integer / `lastFailureReason` string / `lastFailedAt` date-time / `originalChannel` string を required）を追加し、DLQ 3 チャネルのメッセージを `traits: [commonHeaders, dlqHeaders]` を持つ `*RequestedDead` メッセージとして定義する。もしくは MQ 製品の x-death 相当ヘッダに委ねる旨を共通規約に明記する"
    source_refs:
