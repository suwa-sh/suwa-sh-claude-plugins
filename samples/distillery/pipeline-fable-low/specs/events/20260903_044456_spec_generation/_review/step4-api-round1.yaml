    line: 650
    severity: minor
    viewpoint: 1
    claim: "429 TooManyRequests（Retry-After 付き）は公開経路のうち `GET /api/v1/books` / `GET /api/v1/books/{bookId}` / `GET /api/v1/genres` にしか宣言されておらず、同じ公開経路（API Gateway 経由）の `POST /api/v1/reservations`（L650）/ `GET /api/v1/reservations/{reservationId}` / `POST .../cancel` / `GET /api/v1/me/loans`（L758）/ `GET /api/v1/me/reservations`（L793）には無い。info.description の経路区分（L19）と整合しない"
    fix: "公開経路の全操作に `\"429\": $ref: \"#/components/responses/TooManyRequests\"` を追加する。館内経路にはレート制限を掛けない方針であれば、その旨を info.description の「経路と認可」節に明記する"
    source_refs:
      - "docs/specs/events/20260903_044456_spec_generation/蔵書管理業務/書籍を検索するフロー/書籍を検索する/_api-summary.yaml#endpoints[0].errors"
