# _model-summary.yaml
uc: "書籍を削除する"
business: "蔵書管理業務"
buc: "蔵書を管理するフロー"

bounded_context_id: "BC-001"
aggregate_id: "AG-001"

models:
  - name: "BookDeleteState"
    tier: "tier-frontend-staff"
    layer: "view"
    type: "state"
    rdra_info: "書籍"
  - name: "DeleteBookRequest（api-client）"
    tier: "tier-frontend-staff"
    layer: "api-client"
    type: "request"
    rdra_info: "書籍"
  - name: "DeleteBookRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "書籍"
  - name: "GetBookQuery"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "query"
    rdra_info: "書籍"
  - name: "DeleteBookCommand"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "command"
    rdra_info: "書籍"
  - name: "Book"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "書籍"
  - name: "BookStatus"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "書籍"
  - name: "BookRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "書籍"
  - name: "BookEventRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "書籍"

tables:
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = :bookId（確認画面表示 / 削除前の状態取得）"
      - type: "DELETE"
        columns: []
        where: "book_id = :bookId AND current_status = 'AVAILABLE'（If-Match 指定時は AND version = :expectedVersion）"
    indexes_needed:
      - columns: ["book_id"]
        reason: "主キー参照（1 件取得・削除）"
        access_pattern: "書籍 ID による 1 件取得・削除"
  - name: "book_events"
    rdra_info: "書籍"
    operations:
      - type: "INSERT"
        columns:
          - name: "event_id"
            value: "UUID"
          - name: "book_id"
            value: "対象書籍 ID"
          - name: "event_type"
            value: "DELETED"
          - name: "payload"
            value: "削除前の全属性 + 遷移前状態 AVAILABLE"
          - name: "occurred_at"
            value: "現在日時"
          - name: "actor_user_number"
            value: "操作した司書の利用者番号"
        where: ""
    indexes_needed:
      - columns: ["book_id", "occurred_at"]
        reason: "書籍ごとの履歴参照（削除後も履歴を保持）"
        access_pattern: "book_id で絞り occurred_at 順に取得"
  - name: "audit_logs"
    rdra_info: "書籍"
    operations:
      - type: "INSERT"
        columns:
          - name: "audit_id"
            value: "UUID"
          - name: "occurred_at"
            value: "現在日時"
          - name: "actor_user_number"
            value: "操作した司書の利用者番号"
          - name: "action_type"
            value: "データ更新"
          - name: "target_entity"
            value: "E-001"
          - name: "target_id"
            value: "書籍 ID"
          - name: "result"
            value: "成功 / 拒否"
        where: ""
    indexes_needed:
      - columns: ["target_entity", "target_id", "occurred_at"]
        reason: "対象エンティティ単位の監査ログ検索"
        access_pattern: "target で絞り occurred_at 順に取得"

kvs:
  - key_pattern: "cache:books:*"
    purpose: "cache"
    value_type: "参照系キャッシュ（一覧 / 詳細）"
    ttl: "60s"
    operations: ["DEL"]
  - key_pattern: "idempotency:{idempotencyKey}"
    purpose: "idempotency"
    value_type: "最初の応答（status）"
    ttl: "24h"
    operations: ["GET", "SET"]

object_storage: []
