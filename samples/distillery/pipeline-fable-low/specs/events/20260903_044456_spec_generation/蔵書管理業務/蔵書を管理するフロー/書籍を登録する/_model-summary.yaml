# _model-summary.yaml
uc: "書籍を登録する"
business: "蔵書管理業務"
buc: "蔵書を管理するフロー"

bounded_context_id: "BC-001"
aggregate_id: "AG-001"

models:
  - name: "BookCreateState"
    tier: "tier-frontend-staff"
    layer: "view"
    type: "state"
    rdra_info: "書籍"
  - name: "CreateBookRequest（api-client）"
    tier: "tier-frontend-staff"
    layer: "api-client"
    type: "request"
    rdra_info: "書籍"
  - name: "CreateBookRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "書籍"
  - name: "RegisterBookCommand"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "command"
    rdra_info: "書籍"
  - name: "Book"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "書籍"
  - name: "Genre"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "ジャンル"
  - name: "MediaType"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "書籍"
  - name: "BookRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "書籍"
  - name: "BookEventRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "書籍"
  - name: "GenreRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "ジャンル"
  - name: "BookDetailResponse"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "view-model"
    rdra_info: "書籍"

tables:
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "INSERT"
        columns:
          - name: "book_id"
            value: "採番（ULID 等）"
          - name: "title"
            value: "入力値"
          - name: "author"
            value: "入力値"
          - name: "isbn"
            value: "入力値（任意）"
          - name: "publisher"
            value: "入力値（任意）"
          - name: "genre_id"
            value: "入力値（genres に存在）"
          - name: "media_type"
            value: "入力値（既定 PAPER）"
          - name: "current_status"
            value: "AVAILABLE（在庫あり）"
          - name: "title_normalized"
            value: "title の NFKC 正規化 + 小文字化"
          - name: "author_normalized"
            value: "author の NFKC 正規化 + 小文字化"
          - name: "publisher_normalized"
            value: "publisher の NFKC 正規化 + 小文字化（任意）"
          - name: "version"
            value: "1"
          - name: "updated_at"
            value: "現在日時"
        where: ""
    indexes_needed:
      - columns: ["book_id"]
        reason: "主キー（一意性保証）"
        access_pattern: "書籍 ID による一意制約"
      - columns: ["genre_id"]
        reason: "genres への外部キー参照"
        access_pattern: "FK 制約 / ジャンル絞り込み"
  - name: "book_events"
    rdra_info: "書籍"
    operations:
      - type: "INSERT"
        columns:
          - name: "event_id"
            value: "UUID"
          - name: "book_id"
            value: "採番した書籍 ID"
          - name: "event_type"
            value: "REGISTERED"
          - name: "payload"
            value: "登録属性 + 遷移後状態 AVAILABLE"
          - name: "occurred_at"
            value: "現在日時（登録日の正本）"
          - name: "actor_user_number"
            value: "操作した司書の利用者番号"
        where: ""
    indexes_needed:
      - columns: ["book_id", "occurred_at"]
        reason: "書籍ごとの履歴参照（registeredAt / updatedAt 導出）"
        access_pattern: "book_id で絞り occurred_at 順に取得"
  - name: "genres"
    rdra_info: "ジャンル"
    operations:
      - type: "SELECT"
        columns: []
        where: "genre_id = :genreId（存在確認 + genre_name 取得）"
    indexes_needed: []

kvs:
  - key_pattern: "cache:books:*"
    purpose: "cache"
    value_type: "BookPageResponse / BookDetailResponse JSON（参照系キャッシュ）"
    ttl: "60s"
    operations: ["DEL"]
  - key_pattern: "idempotency:{idempotencyKey}"
    purpose: "idempotency"
    value_type: "最初の応答（status, body）"
    ttl: "24h"
    operations: ["GET", "SET"]

object_storage: []
