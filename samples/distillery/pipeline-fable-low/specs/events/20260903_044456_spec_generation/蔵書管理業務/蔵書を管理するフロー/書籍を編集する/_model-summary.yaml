  - name: "BookEditState"
    tier: "tier-frontend-staff"
    layer: "view"
    type: "state"
    rdra_info: "書籍"
  - name: "UpdateBookRequest（api-client）"
    tier: "tier-frontend-staff"
    layer: "api-client"
    type: "request"
    rdra_info: "書籍"
  - name: "UpdateBookRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "書籍"
  - name: "GetBookQuery"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "query"
    rdra_info: "書籍"
  - name: "UpdateBookCommand"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "command"
    rdra_info: "書籍"
  - name: "Book"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "書籍"
  - name: "Genre"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "ジャンル"
  - name: "MediaType"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "書籍"
  - name: "BookRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "書籍"
  - name: "BookEventRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "書籍"
  - name: "GenreRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "ジャンル"
  - name: "BookDetailResponse"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "view-model"
    rdra_info: "書籍"

tables:
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = :bookId（genres JOIN で genre_name 取得）"
      - type: "UPDATE"
        columns:
          - name: "title"
            value: "入力値"
          - name: "author"
            value: "入力値"
          - name: "isbn"
            value: "入力値（任意）"
          - name: "publisher"
            value: "入力値（任意）"
          - name: "genre_id"
            value: "入力値（genres に存在）"
          - name: "media_type"
            value: "入力値（貸出中・予約待ちは ELECTRONIC 不可）"
          - name: "title_normalized"
            value: "title の再正規化"
          - name: "author_normalized"
            value: "author の再正規化"
          - name: "publisher_normalized"
            value: "publisher の再正規化"
          - name: "version"
            value: "version + 1"
          - name: "updated_at"
            value: "現在日時"
        where: "book_id = :bookId AND version = :expectedVersion"
    indexes_needed:
      - columns: ["book_id"]
        reason: "主キー参照（1 件取得・楽観ロック更新）"
        access_pattern: "書籍 ID による 1 件取得・更新"
  - name: "book_events"
    rdra_info: "書籍"
    operations:
      - type: "INSERT"
        columns:
          - name: "event_id"
            value: "UUID"
          - name: "book_id"
            value: "対象書籍 ID"
          - name: "event_type"
            value: "UPDATED"
          - name: "payload"
            value: "変更前後の属性差分"
          - name: "occurred_at"
            value: "現在日時（更新日の正本）"
          - name: "actor_user_number"
            value: "操作した司書の利用者番号"
        where: ""
      - type: "SELECT"
        columns: []
        where: "book_id = :bookId AND event_type = 'REGISTERED'（registeredAt 導出）"
    indexes_needed:
      - columns: ["book_id", "occurred_at"]
        reason: "書籍ごとの履歴参照（registeredAt / updatedAt 導出）"
        access_pattern: "book_id で絞り occurred_at 順に取得"
  - name: "genres"
    rdra_info: "ジャンル"
    operations:
      - type: "SELECT"
        columns: []
        where: "genre_id = :genreId（存在確認）"
    indexes_needed: []

kvs:
  - key_pattern: "cache:books:*"
    purpose: "cache"
    value_type: "参照系キャッシュ（一覧 / 詳細）"
    ttl: "60s"
    operations: ["DEL"]
  - key_pattern: "idempotency:{idempotencyKey}"
    purpose: "idempotency"
    value_type: "最初の応答（status, body）"
    ttl: "24h"
    operations: ["GET", "SET"]

object_storage: []
