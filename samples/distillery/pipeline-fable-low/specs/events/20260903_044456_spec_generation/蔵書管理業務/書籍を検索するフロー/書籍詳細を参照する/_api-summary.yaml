# _api-summary.yaml
uc: "書籍詳細を参照する"
business: "蔵書管理業務"
buc: "書籍を検索するフロー"
endpoints:
  - method: "GET"
    path: "/api/v1/books/{bookId}"
    summary: "書籍詳細と在庫状況（予約待ち人数つき）を取得する（書籍取得と共有。公開経路は匿名可）"
    response_schema: "BookDetailResponse"
    tags: ["books"]
    security: ["bearer", "anonymous"]
    roles: ["司書", "利用者", "匿名"]
    parameters:
      - name: "bookId"
        in: "path"
        type: "string"
        required: true
    responses:
      "200": "BookDetailResponse"
      "400": "ValidationProblemDetails"
      "401": "ProblemDetails"
      "404": "ProblemDetails"
      "429": "ProblemDetails"
    errors:
      - status: "400"
        code: "VALIDATION_ERROR"
      - status: "401"
        code: "UNAUTHENTICATED"
      - status: "404"
        code: "BOOK_NOT_FOUND"
      - status: "429"
        code: "RATE_LIMITED"
async_events: []
schemas:
  - name: "BookDetailResponse"
    properties:
      - name: "bookId"
        type: "string"
        required: true
      - name: "title"
        type: "string"
        required: true
      - name: "author"
        type: "string"
        required: true
      - name: "isbn"
        type: "string"
        required: false
      - name: "publisher"
        type: "string"
        required: false
      - name: "genreId"
        type: "string"
        required: true
      - name: "genreName"
        type: "string"
        required: true
      - name: "mediaType"
        type: "string"
        enum: ["PAPER", "ELECTRONIC"]
        required: true
      - name: "status"
        type: "string"
        enum: ["AVAILABLE", "ON_LOAN", "RESERVED"]
        required: true
      - name: "waitingCount"
        type: "integer"
        required: true
      - name: "version"
        type: "integer"
        required: false
      - name: "registeredAt"
        type: "string"
        format: "date-time"
        required: true
      - name: "updatedAt"
        type: "string"
        format: "date-time"
        required: true
  - name: "ProblemDetails"
    properties:
      - name: "type"
        type: "string"
        required: true
      - name: "title"
        type: "string"
        required: true
      - name: "status"
        type: "integer"
        required: true
      - name: "detail"
        type: "string"
        required: false
      - name: "code"
        type: "string"
        required: true
      - name: "traceId"
        type: "string"
        required: false
