    rdra_info: "書籍"
  - name: "ListBooksQueryParams（patron api-client）"
    tier: "tier-frontend-user"
    layer: "api-client"
    type: "request"
    rdra_info: "書籍"
  - name: "CounterBookSearchState"
    tier: "tier-frontend-staff"
    layer: "view"
    type: "state"
    rdra_info: "書籍"
  - name: "ListBooksQueryParams（staff api-client）"
    tier: "tier-frontend-staff"
    layer: "api-client"
    type: "request"
    rdra_info: "書籍"
  - name: "ListBooksRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "書籍"
  - name: "SearchBooksQuery"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "query"
    rdra_info: "書籍"
  - name: "BookSearchCriteria"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "書籍"
  - name: "SearchTypeStrategy"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "書籍"
  - name: "Book"
    tier: "tier-backend-api"
    layer: "domain"
