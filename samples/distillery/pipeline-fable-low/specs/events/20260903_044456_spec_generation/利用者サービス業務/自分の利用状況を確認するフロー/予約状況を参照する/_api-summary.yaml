# _api-summary.yaml
uc: "予約状況を参照する"
business: "利用者サービス業務"
buc: "自分の利用状況を確認するフロー"
endpoints:
  - method: "GET"
    path: "/api/v1/me/reservations"
    summary: "自分の予約一覧を取得する（本人限定。予約順位・待ち人数・状態・取消可否、includeClosed で取消・終了を含める。offset ページネーション）"
    request_schema: "ListMyReservationsQueryParams"
    response_schema: "MyReservationPageResponse"
    tags: ["me"]
    security: ["bearer"]
    roles: ["利用者"]
    ownership: "self"  # 利用者ロールはトークンの利用者番号と一致するデータのみ（SP-011）
    parameters:
      - name: "includeClosed"
        in: "query"
        type: "boolean"
        required: false
        default: false
        description: "終了・取消済みの予約を含めるか"
      - name: "page"
        in: "query"
        type: "integer"
        required: false
        default: 1
        minimum: 1
      - name: "pageSize"
        in: "query"
        type: "integer"
        required: false
        default: 20
        maximum: 100
    responses:
      "200": "MyReservationPageResponse"
      "400": "ValidationProblemDetails"
      "401": "ProblemDetails"
      "403": "ProblemDetails"
      "429": "ProblemDetails"
    errors:
      - status: "400"
        code: "VALIDATION_ERROR"
      - status: "401"
        code: "UNAUTHENTICATED"
      - status: "403"
        code: "FORBIDDEN"
      - status: "429"
        code: "RATE_LIMITED"
async_events: []
schemas:
  - name: "ListMyReservationsQueryParams"
    properties:
      - name: "includeClosed"
        type: "boolean"
        required: false
      - name: "page"
        type: "integer"
        required: false
      - name: "pageSize"
        type: "integer"
        required: false
  - name: "MyReservationPageResponse"
    properties:
      - name: "items"
        type: "array"
        items: "MyReservationItem"
        required: true
      - name: "page"
        type: "integer"
        required: true
      - name: "pageSize"
        type: "integer"
        required: true
      - name: "totalCount"
        type: "integer"
        required: true
      - name: "activeCount"
        type: "integer"
        required: true
  - name: "MyReservationItem"
    properties:
      - name: "reservationId"
        type: "string"
        required: true
      - name: "book"
        type: "BookSummary"
        required: true
      - name: "acceptedAt"
        type: "string"
        format: "date-time"
        required: true
      - name: "queuePosition"
        type: "integer"
        required: true
      - name: "totalWaiting"
        type: "integer"
        required: true
      - name: "status"
        type: "string"
        enum: ["RESERVED", "NOTIFIED", "CANCELLED", "CLOSED"]
        required: true
      - name: "notifiedAt"
        type: "string"
        format: "date-time"
        required: false
      - name: "cancelledAt"
        type: "string"
        format: "date-time"
        required: false
      - name: "canCancel"
        type: "boolean"
        required: true
  - name: "BookSummary"
    properties:
      - name: "bookId"
        type: "string"
        required: true
      - name: "title"
        type: "string"
        required: true
      - name: "author"
        type: "string"
        required: true
      - name: "mediaType"
        type: "string"
        enum: ["PAPER", "ELECTRONIC"]
        required: true
      - name: "status"
        type: "string"
        enum: ["AVAILABLE", "ON_LOAN", "RESERVED"]
        required: true
