# _api-summary.yaml
uc: "利用者を削除する"
business: "利用者管理業務"
buc: "利用者を管理するフロー"
endpoints:
  - method: "GET"
    path: "/api/v1/users/{userNumber}"
    summary: "利用者番号で利用者を取得する（include=activeCounts で有効な貸出・予約件数を含む）"
    response_schema: "UserResponse"
    tags: ["users"]
    security: ["bearer"]
    roles: ["司書"]
    parameters:
      - name: "userNumber"
        in: "path"
        type: "string"
        required: true
      - name: "include"
        in: "query"
        type: "string"
        required: false
        enum: ["activeCounts"]
    responses:
      "200": "UserResponse"
      "401": "ProblemDetails"
      "403": "ProblemDetails"
      "404": "ProblemDetails"
    errors:
      - status: "401"
        code: "UNAUTHENTICATED"
      - status: "403"
        code: "FORBIDDEN"
      - status: "404"
        code: "USER_NOT_FOUND"
  - method: "DELETE"
    path: "/api/v1/users/{userNumber}"
    summary: "利用者を削除する（貸出中・延滞・予約中・通知済みがあれば 409）"
    response_schema: ""
    tags: ["users"]
    security: ["bearer"]
    roles: ["司書"]
    parameters:
      - name: "userNumber"
        in: "path"
        type: "string"
        required: true
    headers:
      - name: "Idempotency-Key"
        required: true
      - name: "If-Match"
        required: false
    responses:
      "204": ""
      "400": "ValidationProblemDetails"
      "401": "ProblemDetails"
      "403": "ProblemDetails"
      "404": "ProblemDetails"
      "409": "oneOf: [ProblemDetails, UserNotDeletableProblemDetails]  # code=USER_NOT_DELETABLE のみ UserNotDeletableProblemDetails（reasons 必須）。SELF_DELETE_NOT_ALLOWED / OPTIMISTIC_LOCK_CONFLICT は reasons を持たない ProblemDetails"
    errors:
      - status: "400"
        code: "BAD_REQUEST"
      - status: "401"
        code: "UNAUTHENTICATED"
      - status: "403"
        code: "FORBIDDEN"
      - status: "404"
        code: "USER_NOT_FOUND"
      - status: "409"
        code: "OPTIMISTIC_LOCK_CONFLICT"
      - status: "409"
        code: "SELF_DELETE_NOT_ALLOWED"
      - status: "409"
        code: "USER_NOT_DELETABLE"
async_events: []
schemas:
  - name: "UserResponse"
    properties:
      - name: "userNumber"
        type: "string"
        required: true
      - name: "name"
        type: "string"
        required: true
      - name: "email"
        type: "string"
        required: true
      - name: "phone"
        type: "string"
        required: false
      - name: "address"
        type: "string"
        required: false
      - name: "userType"
        type: "string"
        enum: ["PATRON", "STAFF"]
        description: "利用者区分（PATRON=利用者 / STAFF=司書）"
        required: true
      - name: "version"
        type: "integer"
        required: true
      - name: "registeredAt"
        type: "string"
        format: "date-time"
        required: true
      - name: "updatedAt"
        type: "string"
        format: "date-time"
        required: true
      - name: "activeLoanCount"
        type: "integer"
        required: false
      - name: "activeReservationCount"
        type: "integer"
        required: false
  - name: "UserNotDeletableProblemDetails"
    properties:
      - name: "code"
        type: "string"
        required: true
      - name: "reasons"
        type: "array"
        items: "string"
        enum: ["ACTIVE_LOAN", "ACTIVE_RESERVATION"]
        required: true
      - name: "activeLoanCount"
        type: "integer"
        required: false
      - name: "activeReservationCount"
        type: "integer"
        required: false
  - name: "ProblemDetails"
    properties:
      - name: "type"
        type: "string"
        required: true
      - name: "title"
        type: "string"
        required: true
      - name: "status"
        type: "integer"
        required: true
      - name: "detail"
        type: "string"
        required: false
      - name: "code"
        type: "string"
        required: true
      - name: "traceId"
        type: "string"
        required: false
