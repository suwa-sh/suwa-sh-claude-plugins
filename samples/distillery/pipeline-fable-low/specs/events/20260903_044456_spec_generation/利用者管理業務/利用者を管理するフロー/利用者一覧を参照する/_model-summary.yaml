tables:
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "任意: (user_number LIKE :q% OR name_normalized LIKE %:qNormalized%) ORDER BY user_number ASC LIMIT ? OFFSET ?"
      - type: "SELECT"
        columns: []
        where: "同条件の COUNT(*)"
    indexes_needed:
      - columns: ["user_number"]
        reason: "主キー（前方一致検索・並び順）"
        access_pattern: "WHERE user_number LIKE ?% ORDER BY user_number"
      - columns: ["name_normalized"]
        reason: "氏名部分一致（前方一致時に利用。中間一致は LIKE 走査を許容: 1 館規模）"
        access_pattern: "WHERE name_normalized LIKE ?"
  - name: "user_events"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "event_type = 'REGISTERED' AND user_number IN (:userNumbers)（registeredAt 導出）"
    indexes_needed:
      - columns: ["user_number", "event_type"]
        reason: "登録イベントの一括取得"
        access_pattern: "WHERE event_type = 'REGISTERED' AND user_number IN (...)"
  - name: "audit_logs"
    rdra_info: "利用者"
    operations:
      - type: "INSERT"
        columns:
          - name: "audit_id"
            value: "UUID"
          - name: "occurred_at"
            value: "現在日時"
          - name: "actor_user_number"
            value: "操作した司書の利用者番号"
          - name: "action_type"
            value: "データ参照"
          - name: "target_entity"
            value: "E-003"
          - name: "target_id"
            value: "応答に含めた利用者番号の一覧"
          - name: "result"
            value: "成功 / 拒否"
        where: ""
    indexes_needed:
      - columns: ["actor_user_number", "occurred_at"]
        reason: "操作者単位の監査ログ検索"
        access_pattern: "actor で絞り occurred_at 順に取得"

kvs: []
object_storage: []
