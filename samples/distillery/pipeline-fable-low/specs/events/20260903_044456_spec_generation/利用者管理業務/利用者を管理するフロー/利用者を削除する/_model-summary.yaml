# _model-summary.yaml
uc: "利用者を削除する"
business: "利用者管理業務"
buc: "利用者を管理するフロー"

bounded_context_id: "BC-002"
aggregate_id: "AG-002"

models:
  - name: "UserDeleteState"
    tier: "tier-frontend-staff"
    layer: "view"
    type: "state"
    rdra_info: "利用者"
  - name: "DeleteUserRequest（api-client）"
    tier: "tier-frontend-staff"
    layer: "api-client"
    type: "request"
    rdra_info: "利用者"
  - name: "DeleteUserRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "利用者"
  - name: "GetUserQuery"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "query"
    rdra_info: "利用者"
  - name: "DeleteUserCommand"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "command"
    rdra_info: "利用者"
  - name: "User"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "利用者"
  - name: "ActiveUsage"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "貸出"
  - name: "UserSnapshotRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "利用者"
  - name: "UserEventRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "利用者"
  - name: "LoanCountRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "貸出"
  - name: "ReservationCountRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "予約"
  - name: "UserResponse"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "view-model"
    rdra_info: "利用者"

tables:
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_number = :userNumber（確認画面表示 / 削除前取得）"
      - type: "DELETE"
        columns: []
        where: "user_number = :userNumber（If-Match 指定時は AND version = :expectedVersion）"
    indexes_needed:
      - columns: ["user_number"]
        reason: "主キー参照（1 件取得・削除）"
        access_pattern: "利用者番号による 1 件取得・削除"
  - name: "user_events"
    rdra_info: "利用者"
    operations:
      - type: "INSERT"
        columns:
          - name: "event_id"
            value: "UUID"
          - name: "user_number"
            value: "対象利用者番号"
          - name: "event_type"
            value: "DELETED"
          - name: "payload"
            value: "{ reason: 利用終了 }（氏名・連絡先は含めない）"
          - name: "occurred_at"
            value: "現在日時"
          - name: "actor_user_number"
            value: "操作した司書の利用者番号"
        where: ""
    indexes_needed:
      - columns: ["user_number", "occurred_at"]
        reason: "利用者ごとの履歴参照（削除後も保持）"
        access_pattern: "user_number で絞り occurred_at 順に取得"
  - name: "credentials"
    rdra_info: "利用者"
    operations:
      - type: "DELETE"
        columns: []
        where: "user_number = :userNumber（利用者削除と同一トランザクション）"
    indexes_needed:
      - columns: ["user_number"]
        reason: "主キー（E-003 と 1:1）"
        access_pattern: "利用者番号による削除"
  - name: "loans"
    rdra_info: "貸出"
    operations:
      - type: "SELECT"
        columns: []
        where: "COUNT(*) WHERE user_number = :userNumber AND current_status IN ('ON_LOAN', 'OVERDUE')（貸出 BC 公開 IF 経由）"
    indexes_needed:
      - columns: ["user_number", "current_status"]
        reason: "利用者ごとの有効貸出件数（削除可否判定・利用状況照会）"
        access_pattern: "WHERE user_number = ? AND current_status IN (...)"
  - name: "reservations"
    rdra_info: "予約"
    operations:
      - type: "SELECT"
        columns: []
        where: "COUNT(*) WHERE user_number = :userNumber AND current_status IN ('RESERVED', 'NOTIFIED')（予約 BC 公開 IF 経由）"
    indexes_needed:
      - columns: ["user_number", "current_status"]
        reason: "利用者ごとの有効予約件数（削除可否判定・予約状況照会）"
        access_pattern: "WHERE user_number = ? AND current_status IN (...)"
  - name: "audit_logs"
    rdra_info: "利用者"
    operations:
      - type: "INSERT"
        columns:
          - name: "audit_id"
            value: "UUID"
          - name: "occurred_at"
            value: "現在日時"
          - name: "actor_user_number"
            value: "操作した司書の利用者番号"
          - name: "action_type"
            value: "データ参照（GET）/ データ更新（DELETE）"
          - name: "target_entity"
            value: "E-003"
          - name: "target_id"
            value: "利用者番号"
          - name: "result"
            value: "成功 / 拒否"
        where: ""
    indexes_needed:
      - columns: ["target_entity", "target_id", "occurred_at"]
        reason: "対象エンティティ単位の監査ログ検索"
        access_pattern: "target で絞り occurred_at 順に取得"

kvs:
  - key_pattern: "idempotency:{idempotencyKey}"
    purpose: "idempotency"
    value_type: "最初の応答（status）"
    ttl: "24h"
    operations: ["GET", "SET"]
  - key_pattern: "session:{sessionId}"
    purpose: "session"
    value_type: "セッション（E-901）"
    ttl: "IdP 設定に従う"
    operations: ["DEL"]

object_storage: []
