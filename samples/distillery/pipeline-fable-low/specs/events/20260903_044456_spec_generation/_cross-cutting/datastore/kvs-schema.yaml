version: "1.0"
datastore: "kvs"

# 生成元: 全 27 UC の _model-summary.yaml（kvs）。同一パターンは統合し、UC ごとの TTL 差は最長を採用して description に注記する
# キー命名: {目的}:{種別}:{識別子} のコロン区切り階層。プレースホルダは {変数名}

_review_notes:
  - "書籍系の参照キャッシュはキー体系が UC 間で 2 系統あった（cache:books:list / cache:books:detail と cache:book:{bookId}）。cache:books:detail:{bookId} に統一し、貸出・返却・予約の状態遷移時は cache:books:* をまとめて無効化する"
  - "cache:books:* の TTL は蔵書管理 UC の 60s を採用した（貸出系 UC の 10m より短い方に揃え、在庫状況の鮮度を優先）"
  - "session:{sessionId} の TTL は既定 8h（IdP の絶対有効期限に同期し、IdP 側設定を正とする。利用者削除時に明示的に DEL する）"
  - "キー命名を cache:{リソース}:{サブ種別}:{識別子} / lock:{種別}:{識別子} に統一した（旧: cache:book-reservations / cache:me-loans / cache:me-reservations / cache:user-usage / job:* / dedupe:notification / consumer:return-notice）。該当 12 UC の _model-summary.yaml / tier md も新命名へ追随済み（Step6.5 round 1 / R-008）"
  - "バッチの実行記録キー（lock:job:*）は asOf のみをキーに持ち、jobRunId はキーに含めない（含めるとジョブ実行 ID が変わるたびに別キーとなり再実行スキップが効かないため）。完了させたジョブ実行 ID は値側に保持する（R-015）"
  - "idempotency:{idempotencyKey} は API ゲートウェイ層の共通機構。貸出・予約系 UC は loan_events / reservation_events の idempotency_key 列（RDB）でも再送検出する"

key_patterns:
  # ---------------------------------------------------------------------------
  # session（E-901）
  # ---------------------------------------------------------------------------
  - pattern: "session:{sessionId}"
    purpose: "session"
    value_type: "セッション（E-901: user_number, role, issued_at, expires_at）JSON"
    ttl: "8h（IdP の絶対有効期限に同期。IdP 側設定を正とし、ここは既定値）"
    used_by: ["利用者を削除する"]
    description: "ログインセッション。RBAC のロール（PATRON / STAFF）を保持する。利用者削除時に当該利用者のセッションを DEL して即時失効させる"

  # ---------------------------------------------------------------------------
  # idempotency（API 共通機構）
  # ---------------------------------------------------------------------------
  - pattern: "idempotency:{idempotencyKey}"
    purpose: "idempotency"
    value_type: "最初の応答（status, body）JSON"
    ttl: "24h"
    used_by: ["書籍を登録する", "書籍を編集する", "書籍を削除する", "利用者を削除する"]
    description: "Idempotency-Key ヘッダ付き更新 API の再送に対して最初の応答を返す。GET でヒットすれば処理せず応答を再送、SET は処理完了時"

  # ---------------------------------------------------------------------------
  # cache（Cache-Aside。参照系）
  # ---------------------------------------------------------------------------
  - pattern: "cache:books:list:{queryHash}"
    purpose: "cache"
    value_type: "BookPageResponse JSON"
    ttl: "60s"
    used_by: ["書籍一覧を参照する", "書籍を検索する", "書籍を登録する", "書籍を編集する", "書籍を削除する"]
    description: "書籍一覧・検索結果のページキャッシュ（検索条件 + ページングのハッシュをキーにする）。書籍の登録・編集・削除と貸出・返却・予約の状態遷移で cache:books:* を無効化する"

  - pattern: "cache:books:detail:{bookId}"
    purpose: "cache"
    value_type: "BookDetailResponse JSON（書籍詳細 + 在庫状況 + 予約待ち人数）"
    ttl: "60s"
    used_by: ["書籍詳細を参照する", "書籍を登録する", "書籍を編集する", "書籍を削除する", "貸出を登録する", "返却を登録する", "予約を登録する", "予約を取り消す"]
    description: "書籍詳細のキャッシュ。書籍の編集・削除および貸出・返却・予約登録・予約取消で DEL する（UC 側の cache:book:{bookId} を統合）"

  - pattern: "cache:reservations:book:{bookId}:{includeClosed}:{page}:{pageSize}"
    purpose: "cache"
    value_type: "BookReservationPageResponse JSON"
    ttl: "5m"
    used_by: ["予約一覧を参照する"]
    description: "書籍ごとの予約一覧ページキャッシュ。予約の状態遷移（登録・通知・取消・終了）で当該 bookId のキーを無効化する"

  - pattern: "cache:loans:me:{userNumber}:{scope}:{page}:{pageSize}"
    purpose: "cache"
    value_type: "MyLoanPageResponse JSON"
    ttl: "5m"
    used_by: ["貸出履歴を参照する"]
    description: "利用者本人の貸出履歴ページキャッシュ（scope: current / history）。貸出の状態遷移（登録・返却・延滞）で当該 userNumber のキーを無効化する"

  - pattern: "cache:reservations:me:{userNumber}:{includeClosed}:{page}:{pageSize}"
    purpose: "cache"
    value_type: "MyReservationPageResponse JSON"
    ttl: "5m"
    used_by: ["予約状況を参照する"]
    description: "利用者本人の予約状況ページキャッシュ。予約の状態遷移で当該 userNumber のキーを無効化する"

  - pattern: "cache:users:usage:{userNumber}:{loanScope}"
    purpose: "cache"
    value_type: "UserUsageResponse JSON（連絡先マスク済みのみ）"
    ttl: "2m"
    used_by: ["利用者の利用状況を参照する"]
    description: "司書が参照する利用者の利用状況キャッシュ。reveal=true（連絡先開示）の応答はキャッシュしない。貸出・予約の状態遷移で無効化する"

  - pattern: "cache:report:inventory-summary"
    purpose: "cache"
    value_type: "InventorySummary JSON（状態別件数）"
    ttl: "60s"
    used_by: ["在庫状況一覧を参照する"]
    description: "在庫状況の状態別件数サマリ。書籍の状態遷移で DEL するか TTL で失効させる"

  - pattern: "cache:report:loan-statistics:{periodType}:{from}:{to}"
    purpose: "cache"
    value_type: "LoanStatisticsResponse JSON"
    ttl: "10m"
    used_by: ["期間別貸出統計を参照する"]
    description: "期間別貸出統計の応答キャッシュ（periodType: DAY / MONTH / YEAR）。集計バッチ完了時に cache:report:* を無効化する"

  - pattern: "cache:report:popular-books:{periodType}:{from}:{to}:{limit}"
    purpose: "cache"
    value_type: "PopularBooksResponse JSON"
    ttl: "10m"
    used_by: ["人気書籍ランキングを参照する"]
    description: "人気書籍ランキングの応答キャッシュ。集計バッチ完了時に cache:report:* を無効化する"

  # ---------------------------------------------------------------------------
  # lock（バッチ・ワーカーの冪等制御）
  # ---------------------------------------------------------------------------
  - pattern: "lock:job:reminder-extraction:{asOf}"
    purpose: "lock"
    value_type: "ジョブ完了フラグ + 処理件数サマリ JSON"
    ttl: "72h"
    used_by: ["リマインド対象を抽出する"]
    description: "日次リマインド対象抽出バッチの実行記録。同一 asOf の再実行で既処理を判定する"

  - pattern: "lock:job:overdue-detection:{asOf}"
    purpose: "lock"
    value_type: "ジョブ完了フラグ + 処理件数サマリ JSON"
    ttl: "72h"
    used_by: ["延滞を判定する"]
    description: "日次延滞判定バッチの実行記録。同一 asOf の再実行で既処理を判定する"

  - pattern: "lock:notification:{notificationId}"
    purpose: "lock"
    value_type: "処理済みフラグ + 処理結果（SENT / FAILED / SKIPPED）"
    ttl: "72h"
    used_by: ["リマインドを送信する", "督促を送信する"]
    description: "送信ワーカーの重複処理防止。MQ の at-least-once 配信で同一通知を 2 回処理しないよう、処理結果を保持する"

  - pattern: "lock:consumer:return-notice:{notificationId}"
    purpose: "lock"
    value_type: "処理中フラグ"
    ttl: "5m"
    used_by: ["返却通知を送信する"]
    description: "返却通知ワーカー（Competing Consumers）の同時処理防止ロック。処理完了時に DEL する"
