# _model-summary.yaml
uc: "返却通知を送信する"
business: "貸出業務"
buc: "書籍を返却するフロー"

bounded_context_id: "BC-005"
aggregate_id: "AG-006"

models:
  - name: "ReturnNoticeConfirmPage 状態（preview / phase）"
    tier: "tier-frontend-staff"
    layer: "view"
    type: "view-model"
    rdra_info: "通知"
  - name: "ReturnNoticePreview / ReturnNoticeResult"
    tier: "tier-frontend-staff"
    layer: "api-client"
    type: "request"
    rdra_info: "通知"
  - name: "ReturnNoticePreviewQuery"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "通知"
  - name: "SendReturnNoticeRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "通知"
  - name: "PreviewReturnNoticeQuery"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "query"
    rdra_info: "通知"
  - name: "SendReturnNoticeCommand"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "command"
    rdra_info: "通知"
  - name: "Notification"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "通知"
  - name: "Reservation"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "予約"
  - name: "ReturnNoticePolicy"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "予約"
  - name: "NotificationTemplate（返却通知）"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "通知"
  - name: "NotificationRecord / ReservationRecord / ReservationEventRecord / UserRecord / LoanRecord / BookRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "通知"
  - name: "ReturnNoticeRequested"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "value-object"
    rdra_info: "通知"
  - name: "ReturnNoticeConsumer"
    tier: "tier-worker"
    layer: "presentation"
    type: "request"
    rdra_info: "通知"
  - name: "SendReturnNoticeMailCommand"
    tier: "tier-worker"
    layer: "usecase"
    type: "command"
    rdra_info: "通知"
  - name: "MailDeliveryRequest（ACL）"
    tier: "tier-worker"
    layer: "gateway"
    type: "value-object"
    rdra_info: "通知"

tables:
  - name: "notifications"
    rdra_info: "通知"
    operations:
      - type: "INSERT"
        columns:
          - name: "notification_id"
            value: "ULID 採番（MQ MessageId）"
          - name: "user_number"
            value: "予約順位 1 位の利用者番号"
          - name: "notification_type"
            value: "RETURN_NOTICE"
          - name: "recipient_email"
            value: "利用者の現在のメールアドレス"
          - name: "subject"
            value: "返却通知テンプレートの件名"
          - name: "body"
            value: "返却通知テンプレートの本文（書籍名・来館案内）"
          - name: "requested_on"
            value: "当日"
          - name: "send_result"
            value: "PENDING"
          - name: "sent_at"
            value: "NULL"
          - name: "target_loan_id"
            value: "NULL"
          - name: "target_reservation_id"
            value: "予約.予約ID"
        where: ""
      - type: "SELECT"
        columns: []
        where: "target_reservation_id = ? AND notification_type = 'RETURN_NOTICE' ORDER BY requested_on DESC（通知記録 / 同日重複判定）"
      - type: "SELECT"
        columns: []
        where: "notification_id = ?（ワーカーの既処理照合・送信内容取得）"
      - type: "UPDATE"
        columns:
          - name: "send_result"
            value: "成功 / 失敗（ワーカーが反映）"
          - name: "sent_at"
            value: "送信完了日時"
        where: "notification_id = ? AND send_result = 'PENDING'"
    indexes_needed:
      - columns: ["target_reservation_id", "notification_type", "requested_on"]
        reason: "重複送信防止の一意キー（SR-013）と予約ごとの通知記録取得"
        access_pattern: "INSERT 時の一意制約 / WHERE target_reservation_id = ? AND notification_type = ?"
        unique: true
      - columns: ["send_result", "requested_on"]
        reason: "送信待ちかつ未発行の通知の再発行走査"
        access_pattern: "WHERE send_result = 'PENDING' AND requested_on <= ?"
  - name: "reservations"
    rdra_info: "予約"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = ? AND current_status IN ('RESERVED','NOTIFIED') ORDER BY queue_position（順位 1 位の特定・予約一覧）"
      - type: "SELECT"
        columns: []
        where: "reservation_id = ? FOR UPDATE"
      - type: "UPDATE"
        columns:
          - name: "current_status"
            value: "NOTIFIED"
          - name: "version"
            value: "version + 1"
          - name: "updated_at"
            value: "現在時刻"
        where: "reservation_id = ? AND version = ? AND current_status = 'RESERVED'"
    indexes_needed:
      - columns: ["book_id", "current_status", "queue_position"]
        reason: "書籍ごとの有効予約を順位順に取得"
        access_pattern: "WHERE book_id = ? AND current_status IN (...) ORDER BY queue_position"
  - name: "reservation_events"
    rdra_info: "予約"
    operations:
      - type: "INSERT"
        columns:
          - name: "reservation_id"
            value: "予約 ID"
          - name: "event_type"
            value: "NOTIFIED"
          - name: "occurred_at"
            value: "現在時刻"
          - name: "actor_user_number"
            value: "司書の利用者番号"
          - name: "related_id"
            value: "notification_id"
          - name: "idempotency_key"
            value: "Idempotency-Key ヘッダ"
        where: ""
      - type: "SELECT"
        columns: []
        where: "idempotency_key = ?（冪等キー検査）"
    indexes_needed:
      - columns: ["idempotency_key"]
        reason: "冪等キーの一意性と再送検出"
        access_pattern: "UNIQUE WHERE idempotency_key = ?"
      - columns: ["reservation_id", "occurred_at"]
        reason: "予約ごとのイベント履歴（通知日時の導出）"
        access_pattern: "WHERE reservation_id = ? ORDER BY occurred_at"
  - name: "loans"
    rdra_info: "貸出"
    operations:
      - type: "SELECT"
        columns: []
        where: "loan_id = ?（返却済み判定・書籍 ID の取得）"
    indexes_needed: []
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = ?（書籍要約・予約待ち判定）"
    indexes_needed: []
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_number = ?（送信先氏名・メールアドレス）"
    indexes_needed: []

kvs:
  - key_pattern: "lock:consumer:return-notice:{notificationId}"
    purpose: "lock"
    value_type: "処理中フラグ（Competing Consumers の同時処理防止）"
    ttl: "5m"
    operations: ["SET", "DEL"]

object_storage: []
