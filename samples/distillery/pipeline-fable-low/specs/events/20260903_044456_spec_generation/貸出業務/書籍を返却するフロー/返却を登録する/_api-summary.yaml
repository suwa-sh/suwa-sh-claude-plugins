# _api-summary.yaml
uc: "返却を登録する"
business: "貸出業務"
buc: "書籍を返却するフロー"
endpoints:
  - method: "GET"
    path: "/api/v1/returns/lookup"
    summary: "返却対象を照会する（書籍 ID から貸出中 / 延滞の貸出と返却後の書籍状態を返す）"
    response_schema: "ReturnLookupResponse"
    tags: ["loans"]
    security: ["bearer"]
    roles: ["司書"]
    parameters:
      - name: "bookId"
        in: "query"
        type: "string"
        required: false
    responses:
      "200": "ReturnLookupResponse"
      "400": "ValidationProblemDetails"
      "401": "ProblemDetails"
      "403": "ProblemDetails"
      "404": "ProblemDetails"
      "409": "ProblemDetails"
    errors:
      - status: "400"
        code: "VALIDATION_ERROR"
      - status: "401"
        code: "UNAUTHENTICATED"
      - status: "403"
        code: "FORBIDDEN"
      - status: "404"
        code: "BOOK_NOT_FOUND"
      - status: "409"
        code: "BOOK_NOT_ON_LOAN"
  - method: "POST"
    path: "/api/v1/loans/{loanId}/return"
    summary: "返却を登録する（貸出を返却済みに、書籍を在庫あり / 予約待ちに遷移）"
    request_schema: "ReturnLoanRequest"
    response_schema: "ReturnResponse"
    tags: ["loans"]
    security: ["bearer"]
    roles: ["司書"]
    parameters:
      - name: "loanId"
        in: "path"
        type: "string"
        required: true
    headers:
      - name: "Idempotency-Key"
        required: true
    responses:
      "200": "ReturnResponse"
      "400": "ValidationProblemDetails"
      "401": "ProblemDetails"
      "403": "ProblemDetails"
      "404": "ProblemDetails"
      "409": "ProblemDetails"
    errors:
      - status: "400"
        code: "VALIDATION_ERROR"
      - status: "401"
        code: "UNAUTHENTICATED"
      - status: "403"
        code: "FORBIDDEN"
      - status: "404"
        code: "LOAN_NOT_FOUND"
      - status: "409"
        code: "CONCURRENT_UPDATE"
      - status: "409"
        code: "IDEMPOTENCY_KEY_CONFLICT"
      - status: "409"
        code: "LOAN_ALREADY_RETURNED"
async_events: []
schemas:
  - name: "ReturnLoanRequest"
    properties: []
  - name: "ReturnLookupResponse"
    properties:
      - name: "loan"
        type: "LoanSummary"
        required: true
      - name: "book"
        type: "BookSummary"
        required: true
      - name: "user"
        type: "UserSummary"
        required: true
      - name: "nextBookStatus"
        type: "string"
        enum: ["AVAILABLE", "RESERVED"]
        required: true
      - name: "reservationCount"
        type: "integer"
        required: true
      - name: "overdueDays"
        type: "integer"
        required: true
  - name: "ReturnResponse"
    properties:
      - name: "loanId"
        type: "string"
        required: true
      - name: "bookId"
        type: "string"
        required: true
      - name: "userNumber"
        type: "string"
        required: true
      - name: "returnedOn"
        type: "string"
        format: "date"
        required: true
      - name: "status"
        type: "string"
        enum: ["RETURNED"]
        required: true
      - name: "bookStatus"
        type: "string"
        enum: ["AVAILABLE", "RESERVED"]
        required: true
      - name: "hasReservation"
        type: "boolean"
        required: true
      - name: "reservationCount"
        type: "integer"
        required: true
      - name: "nextReservation"
        type: "ReservationSummary"
        required: false
      - name: "book"
        type: "BookSummary"
        required: true
      - name: "user"
        type: "UserSummary"
        required: true
  - name: "LoanSummary"
    properties:
      - name: "loanId"
        type: "string"
        required: true
      - name: "bookId"
        type: "string"
        required: true
      - name: "userNumber"
        type: "string"
        required: true
      - name: "loanedOn"
        type: "string"
        format: "date"
        required: true
      - name: "dueDate"
        type: "string"
        format: "date"
        required: true
      - name: "status"
        type: "string"
        enum: ["ON_LOAN", "OVERDUE", "RETURNED"]
        required: true
  - name: "BookSummary"
    properties:
      - name: "bookId"
        type: "string"
        required: true
      - name: "title"
        type: "string"
        required: true
      - name: "author"
        type: "string"
        required: true
      - name: "mediaType"
        type: "string"
        enum: ["PAPER", "ELECTRONIC"]
        required: true
      - name: "status"
        type: "string"
        enum: ["AVAILABLE", "ON_LOAN", "RESERVED"]
        required: true
  - name: "UserSummary"
    properties:
      - name: "userNumber"
        type: "string"
        required: true
      - name: "name"
        type: "string"
        required: true
  - name: "ReservationSummary"
    properties:
      - name: "reservationId"
        type: "string"
        required: true
      - name: "queuePosition"
        type: "integer"
        required: true
      - name: "status"
        type: "string"
        enum: ["RESERVED", "NOTIFIED", "CANCELLED", "CLOSED"]
        required: true
