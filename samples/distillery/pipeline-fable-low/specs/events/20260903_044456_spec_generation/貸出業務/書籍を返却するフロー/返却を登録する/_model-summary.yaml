# _model-summary.yaml
uc: "返却を登録する"
business: "貸出業務"
buc: "書籍を返却するフロー"

bounded_context_id: "BC-003"
aggregate_id: "AG-003"

models:
  - name: "ReturnRegisterPanel 入力 / 照会結果"
    tier: "tier-frontend-staff"
    layer: "view"
    type: "view-model"
    rdra_info: "貸出"
  - name: "ReturnLookup / ReturnResult"
    tier: "tier-frontend-staff"
    layer: "api-client"
    type: "request"
    rdra_info: "貸出"
  - name: "ReturnLookupQuery"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "貸出"
  - name: "ReturnLoanRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "貸出"
  - name: "LookupReturnQuery"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "query"
    rdra_info: "貸出"
  - name: "RegisterReturnCommand"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "command"
    rdra_info: "貸出"
  - name: "Loan"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "貸出"
  - name: "Book"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "書籍"
  - name: "Reservation"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "予約"
  - name: "ReturnedBookStatusPolicy"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "書籍"
  - name: "LoanRecord / LoanEventRecord / BookRecord / BookEventRecord / ReservationRecord / UserRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "貸出"

tables:
  - name: "loans"
    rdra_info: "貸出"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = ? AND current_status IN ('ON_LOAN','OVERDUE')（返却対象の特定）"
      - type: "SELECT"
        columns: []
        where: "loan_id = ? FOR UPDATE"
      - type: "UPDATE"
        columns:
          - name: "current_status"
            value: "RETURNED"
          - name: "version"
            value: "version + 1"
          - name: "updated_at"
            value: "現在時刻"
        where: "loan_id = ? AND version = ?"
    indexes_needed:
      - columns: ["book_id", "current_status"]
        reason: "書籍ごとの貸出中 / 延滞レコード検索（返却対象の特定）"
        access_pattern: "WHERE book_id = ? AND current_status IN ('ON_LOAN','OVERDUE')"
  - name: "loan_events"
    rdra_info: "貸出"
    operations:
      - type: "INSERT"
        columns:
          - name: "loan_id"
            value: "返却した貸出 ID"
          - name: "event_type"
            value: "RETURNED"
          - name: "occurred_at"
            value: "現在時刻（返却日の導出元）"
          - name: "actor_user_number"
            value: "司書の利用者番号"
          - name: "idempotency_key"
            value: "Idempotency-Key ヘッダ"
        where: ""
      - type: "SELECT"
        columns: []
        where: "idempotency_key = ?（冪等キー検査）"
    indexes_needed:
      - columns: ["idempotency_key"]
        reason: "冪等キーの一意性と再送検出"
        access_pattern: "UNIQUE WHERE idempotency_key = ?"
      - columns: ["loan_id", "occurred_at"]
        reason: "貸出ごとのイベント履歴（返却日の導出）"
        access_pattern: "WHERE loan_id = ? ORDER BY occurred_at"
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = ? FOR UPDATE"
      - type: "UPDATE"
        columns:
          - name: "current_status"
            value: "在庫あり（予約中 0 件）/ 予約待ち（予約中 1 件以上）"
          - name: "version"
            value: "version + 1"
          - name: "updated_at"
            value: "現在時刻"
        where: "book_id = ? AND version = ?"
    indexes_needed: []
  - name: "book_events"
    rdra_info: "書籍"
    operations:
      - type: "INSERT"
        columns:
          - name: "book_id"
            value: "書籍 ID"
          - name: "event_type"
            value: "RETURNED"
          - name: "occurred_at"
            value: "現在時刻"
          - name: "related_id"
            value: "loan_id"
        where: ""
    indexes_needed:
      - columns: ["book_id", "occurred_at"]
        reason: "書籍ごとのイベント履歴"
        access_pattern: "WHERE book_id = ? ORDER BY occurred_at"
  - name: "reservations"
    rdra_info: "予約"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = ? AND current_status = 'RESERVED' ORDER BY queue_position（件数と順位 1 位の取得）"
    indexes_needed:
      - columns: ["book_id", "current_status", "queue_position"]
        reason: "書籍ごとの予約中件数と順位 1 位の取得"
        access_pattern: "WHERE book_id = ? AND current_status = 'RESERVED' ORDER BY queue_position"
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_number = ?（貸出先の氏名表示）"
    indexes_needed: []

kvs:
  - key_pattern: "cache:books:detail:{bookId}"
    purpose: "cache"
    value_type: "書籍詳細 / 在庫状況の参照キャッシュ（返却時に無効化）"
    ttl: "10m"
    operations: ["DEL"]

object_storage: []
