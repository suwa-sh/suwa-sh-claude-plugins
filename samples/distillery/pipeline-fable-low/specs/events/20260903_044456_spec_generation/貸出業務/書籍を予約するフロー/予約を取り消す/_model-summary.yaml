# _model-summary.yaml
uc: "予約を取り消す"
business: "貸出業務"
buc: "書籍を予約するフロー"

bounded_context_id: "BC-004"
aggregate_id: "AG-005"

models:
  - name: "ReservationCancelPage 状態（reservation / phase）"
    tier: "tier-frontend-user"
    layer: "view"
    type: "view-model"
    rdra_info: "予約"
  - name: "ReservationDetail / ReservationCancelResult"
    tier: "tier-frontend-user"
    layer: "api-client"
    type: "request"
    rdra_info: "予約"
  - name: "ReservationDetailQuery"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "予約"
  - name: "CancelReservationRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "予約"
  - name: "GetMyReservationQuery"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "query"
    rdra_info: "予約"
  - name: "CancelReservationCommand"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "command"
    rdra_info: "予約"
  - name: "Reservation"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "予約"
  - name: "ReservationQueue"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "予約"
  - name: "Book"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "書籍"
  - name: "Notification"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "通知"
  - name: "ReturnNoticePolicy"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "予約"
  - name: "ReservationRecord / ReservationEventRecord / BookRecord / BookEventRecord / NotificationRecord / UserRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "予約"
  - name: "ReturnNoticeRequested"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "value-object"
    rdra_info: "通知"

tables:
  - name: "reservations"
    rdra_info: "予約"
    operations:
      - type: "SELECT"
        columns: []
        where: "reservation_id = ?（詳細参照・本人限定判定）/ reservation_id = ? FOR UPDATE（取消）"
      - type: "SELECT"
        columns: []
        where: "book_id = ? AND current_status IN ('RESERVED','NOTIFIED') ORDER BY queue_position（有効予約数・後続・次順位）"
      - type: "UPDATE"
        columns:
          - name: "current_status"
            value: "CANCELLED"
          - name: "version"
            value: "version + 1"
          - name: "updated_at"
            value: "現在時刻"
        where: "reservation_id = ? AND version = ? AND current_status IN ('RESERVED','NOTIFIED')"
      - type: "UPDATE"
        note: "順位繰り上げ。部分一意インデックス uq_reservations_book_id_queue_position（book_id, queue_position / current_status IN ('RESERVED','NOTIFIED')）との衝突を避けるため、一括 UPDATE ではなく queue_position 昇順に 1 行ずつ更新する（ORDER BY queue_position ASC のカーソル、または同順の CTE で 1 行ずつ）"
        columns:
          - name: "queue_position"
            value: "queue_position - 1"
          - name: "version"
            value: "version + 1"
          - name: "updated_at"
            value: "現在時刻"
        where: "reservation_id = ?（book_id = ? AND current_status IN ('RESERVED','NOTIFIED') AND queue_position > ? を queue_position 昇順に走査して 1 行ずつ）"
      - type: "UPDATE"
        columns:
          - name: "current_status"
            value: "NOTIFIED（条件付き: 通知済み取消時の次順位）"
          - name: "version"
            value: "version + 1"
          - name: "updated_at"
            value: "現在時刻"
        where: "reservation_id = ?（次順位の予約）AND current_status = 'RESERVED'"
    indexes_needed:
      - columns: ["book_id", "current_status", "queue_position"]
        reason: "書籍ごとの有効予約を順位順に取得・繰り上げ更新"
        access_pattern: "WHERE book_id = ? AND current_status IN (...) AND queue_position > ?"
      - columns: ["user_number", "current_status"]
        reason: "本人限定判定と利用者ごとの予約取得"
        access_pattern: "WHERE user_number = ?"
  - name: "reservation_events"
    rdra_info: "予約"
    operations:
      - type: "INSERT"
        columns:
          - name: "reservation_id"
            value: "取消した予約 ID（および条件付きで次順位の予約 ID）"
          - name: "event_type"
            value: "CANCELLED（次順位は NOTIFIED）"
          - name: "occurred_at"
            value: "現在時刻（取消日時の導出元）"
          - name: "actor_user_number"
            value: "利用者本人の利用者番号"
          - name: "related_id"
            value: "通知イベントのとき notification_id"
          - name: "idempotency_key"
            value: "Idempotency-Key ヘッダ（取消イベントのみ）"
        where: ""
      - type: "SELECT"
        columns: []
        where: "idempotency_key = ?（冪等キー検査）/ reservation_id = ? ORDER BY occurred_at（通知日時・取消日時の導出）"
    indexes_needed:
      - columns: ["idempotency_key"]
        reason: "冪等キーの一意性と再送検出"
        access_pattern: "UNIQUE WHERE idempotency_key = ?"
      - columns: ["reservation_id", "occurred_at"]
        reason: "予約ごとのイベント履歴"
        access_pattern: "WHERE reservation_id = ? ORDER BY occurred_at"
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = ? FOR UPDATE"
      - type: "UPDATE"
        columns:
          - name: "current_status"
            value: "在庫あり（条件付き: 有効予約 0 件かつ予約待ち）"
          - name: "version"
            value: "version + 1"
          - name: "updated_at"
            value: "現在時刻"
        where: "book_id = ? AND version = ? AND current_status = 'RESERVED'"
    indexes_needed: []
  - name: "book_events"
    rdra_info: "書籍"
    operations:
      - type: "INSERT"
        columns:
          - name: "book_id"
            value: "書籍 ID"
          - name: "event_type"
            value: "CANCELLED（書籍が在庫ありへ遷移したときのみ）"
          - name: "occurred_at"
            value: "現在時刻"
          - name: "related_id"
            value: "reservation_id"
        where: ""
    indexes_needed:
      - columns: ["book_id", "occurred_at"]
        reason: "書籍ごとのイベント履歴"
        access_pattern: "WHERE book_id = ? ORDER BY occurred_at"
  - name: "notifications"
    rdra_info: "通知"
    operations:
      - type: "INSERT"
        columns:
          - name: "notification_id"
            value: "ULID 採番（MQ MessageId）"
          - name: "user_number"
            value: "次順位の利用者番号"
          - name: "notification_type"
            value: "RETURN_NOTICE"
          - name: "recipient_email"
            value: "次順位の利用者の現在のメールアドレス"
          - name: "subject"
            value: "返却通知テンプレートの件名"
          - name: "body"
            value: "返却通知テンプレートの本文"
          - name: "requested_on"
            value: "当日"
          - name: "send_result"
            value: "PENDING"
          - name: "sent_at"
            value: "NULL"
          - name: "target_loan_id"
            value: "NULL"
          - name: "target_reservation_id"
            value: "次順位の予約 ID"
        where: "（条件付き: 通知済み取消 かつ 書籍が予約待ち かつ 次順位の予約中が存在）"
    indexes_needed:
      - columns: ["target_reservation_id", "notification_type", "requested_on"]
        reason: "重複送信防止の一意キー（SR-013）"
        access_pattern: "INSERT 時の一意制約"
        unique: true
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_number = ?（次順位の利用者の送信先メールアドレス）"
    indexes_needed: []

kvs:
  - key_pattern: "cache:books:detail:{bookId}"
    purpose: "cache"
    value_type: "書籍詳細 / 在庫状況の参照キャッシュ（予約取消時に無効化）"
    ttl: "10m"
    operations: ["DEL"]

object_storage: []
