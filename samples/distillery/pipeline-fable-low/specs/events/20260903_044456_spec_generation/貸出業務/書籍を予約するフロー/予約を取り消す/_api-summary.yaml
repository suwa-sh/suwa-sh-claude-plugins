# _api-summary.yaml
uc: "予約を取り消す"
business: "貸出業務"
buc: "書籍を予約するフロー"
endpoints:
  - method: "GET"
    path: "/api/v1/reservations/{reservationId}"
    summary: "予約詳細を参照する（利用者は本人の予約のみ。取消可否を含む）"
    response_schema: "ReservationDetailResponse"
    tags: ["reservations"]
    security: ["bearer"]
    roles: ["利用者", "司書"]
    ownership: "self"  # 利用者ロールはトークンの利用者番号と一致するデータのみ（SP-011）
    parameters:
      - name: "reservationId"
        in: "path"
        type: "string"
        required: true
    responses:
      "200": "ReservationDetailResponse"
      "400": "ValidationProblemDetails"
      "401": "ProblemDetails"
      "403": "ProblemDetails"
      "404": "ProblemDetails"
      "429": "ProblemDetails"
    errors:
      - status: "400"
        code: "VALIDATION_ERROR"
      - status: "401"
        code: "UNAUTHENTICATED"
      - status: "403"
        code: "FORBIDDEN"
      - status: "404"
        code: "RESERVATION_NOT_FOUND"
      - status: "429"
        code: "RATE_LIMITED"
  - method: "POST"
    path: "/api/v1/reservations/{reservationId}/cancel"
    summary: "予約を取り消す（取消に遷移、後続順位を繰り上げ、条件付きで書籍を在庫ありに戻し次順位へ返却通知）"
    request_schema: "CancelReservationRequest"
    response_schema: "ReservationCancelResponse"
    tags: ["reservations"]
    security: ["bearer"]
    roles: ["利用者"]
    ownership: "self"  # 利用者ロールはトークンの利用者番号と一致するデータのみ（SP-011）
    parameters:
      - name: "reservationId"
        in: "path"
        type: "string"
        required: true
    headers:
      - name: "Idempotency-Key"
        required: true
    responses:
      "200": "ReservationCancelResponse"
      "400": "ValidationProblemDetails"
      "401": "ProblemDetails"
      "403": "ProblemDetails"
      "404": "ProblemDetails"
      "409": "ProblemDetails"
      "429": "ProblemDetails"
    errors:
      - status: "400"
        code: "VALIDATION_ERROR"
      - status: "401"
        code: "UNAUTHENTICATED"
      - status: "403"
        code: "FORBIDDEN"
      - status: "404"
        code: "RESERVATION_NOT_FOUND"
      - status: "409"
        code: "CONCURRENT_UPDATE"
      - status: "409"
        code: "IDEMPOTENCY_KEY_CONFLICT"
      - status: "409"
        code: "RESERVATION_NOT_CANCELLABLE"
      - status: "429"
        code: "RATE_LIMITED"
async_events:
  - name: "ReturnNoticeRequested"
    channel: "notifications.return-notice-requested"
    direction: "publish"
    message_schema: "ReturnNoticeRequested"
    summary: "通知済みの予約を取り消したとき、次順位の予約中の利用者に対する返却通知メール配信要求を条件付きで発行する（スキーマは UC「返却通知を送信する」と同一）"
    condition: "取消対象が通知済み かつ 書籍が予約待ち かつ 次順位の予約中が存在"
schemas:
  - name: "CancelReservationRequest"
    properties: []
  - name: "ReservationDetailResponse"
    properties:
      - name: "reservationId"
        type: "string"
        required: true
      - name: "bookId"
        type: "string"
        required: true
      - name: "userNumber"
        type: "string"
        required: true
      - name: "acceptedAt"
        type: "string"
        format: "date-time"
        required: true
      - name: "queuePosition"
        type: "integer"
        required: true
      - name: "totalWaiting"
        type: "integer"
        required: true
      - name: "status"
        type: "string"
        enum: ["RESERVED", "NOTIFIED", "CANCELLED", "CLOSED"]
        required: true
      - name: "notifiedAt"
        type: "string"
        format: "date-time"
        required: false
      - name: "cancelledAt"
        type: "string"
        format: "date-time"
        required: false
      - name: "canCancel"
        type: "boolean"
        required: true
      - name: "blockedReason"
        type: "string"
        enum: ["RESERVATION_NOT_CANCELLABLE"]
        required: false
      - name: "book"
        type: "BookSummary"
        required: true
  - name: "ReservationCancelResponse"
    properties:
      - name: "reservationId"
        type: "string"
        required: true
      - name: "bookId"
        type: "string"
        required: true
      - name: "status"
        type: "string"
        enum: ["CANCELLED"]
        required: true
      - name: "cancelledAt"
        type: "string"
        format: "date-time"
        required: true
      - name: "previousStatus"
        type: "string"
        enum: ["RESERVED", "NOTIFIED"]
        required: true
      - name: "promotedCount"
        type: "integer"
        required: true
      - name: "bookStatus"
        type: "string"
        enum: ["AVAILABLE", "ON_LOAN", "RESERVED"]
        required: true
      - name: "nextNotified"
        type: "ReservationSummary"
        required: false
  - name: "BookSummary"
    properties:
      - name: "bookId"
        type: "string"
        required: true
      - name: "title"
        type: "string"
        required: true
      - name: "author"
        type: "string"
        required: true
      - name: "mediaType"
        type: "string"
        enum: ["PAPER", "ELECTRONIC"]
        required: true
      - name: "status"
        type: "string"
        enum: ["AVAILABLE", "ON_LOAN", "RESERVED"]
        required: true
  - name: "ReservationSummary"
    properties:
      - name: "reservationId"
        type: "string"
        required: true
      - name: "queuePosition"
        type: "integer"
        required: true
      - name: "status"
        type: "string"
        enum: ["RESERVED", "NOTIFIED", "CANCELLED", "CLOSED"]
        required: true
  - name: "ReturnNoticeRequested"
    properties:
      - name: "notificationId"
        type: "string"
        required: true
      - name: "notificationType"
        type: "string"
        required: true
        enum: ["RETURN_NOTICE"]
      - name: "targetReservationId"
        type: "string"
        required: true
      - name: "userNumber"
        type: "string"
        required: true
      - name: "bookId"
        type: "string"
        required: true
      - name: "requestedOn"
        type: "string"
        format: "date"
        required: true
      - name: "traceId"
        type: "string"
        required: true
