# _model-summary.yaml
uc: "予約一覧を参照する"
business: "貸出業務"
buc: "書籍を予約するフロー"

bounded_context_id: "BC-004"

models:
  - name: "BookReservationsPageState"
    tier: "tier-frontend-staff"
    layer: "view"
    type: "view-model"
    rdra_info: "予約"
  - name: "BookReservationPage（api-client）"
    tier: "tier-frontend-staff"
    layer: "api-client"
    type: "request"
    rdra_info: "予約"
  - name: "ListBookReservationsQueryParams"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "予約"
  - name: "ListBookReservationsQuery"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "query"
    rdra_info: "予約"
  - name: "Reservation"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "予約"
  - name: "Book"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "書籍"
  - name: "ReservationRecord / ReservationEventRecord / BookRecord / UserRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "予約"

tables:
  - name: "reservations"
    rdra_info: "予約"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = ? AND current_status IN ('RESERVED','NOTIFIED') ORDER BY queue_position LIMIT :pageSize OFFSET :offset（既定）"
      - type: "SELECT"
        columns: []
        where: "book_id = ?（includeClosed）ORDER BY CASE current_status 有効=0 / 終端=1, queue_position, accepted_at DESC"
      - type: "SELECT"
        columns: []
        where: "COUNT(*) WHERE book_id = ? AND current_status IN (...)（totalCount / waitingCount）"
    indexes_needed:
      - columns: ["book_id", "current_status", "queue_position"]
        reason: "書籍ごとの有効予約を順位順に取得"
        access_pattern: "WHERE book_id = ? AND current_status IN (...) ORDER BY queue_position"
      - columns: ["book_id", "accepted_at"]
        reason: "取消・終了を含む一覧の受付日時順"
        access_pattern: "WHERE book_id = ? ORDER BY accepted_at DESC"
  - name: "reservation_events"
    rdra_info: "予約"
    operations:
      - type: "SELECT"
        columns: []
        where: "reservation_id IN (...) AND event_type IN ('NOTIFIED','CANCELLED')（通知日時・取消日時の導出）"
    indexes_needed:
      - columns: ["reservation_id", "occurred_at"]
        reason: "予約ごとのイベント履歴"
        access_pattern: "WHERE reservation_id IN (...) ORDER BY occurred_at"
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = ?（書籍要約・存在確認）"
    indexes_needed: []
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_number IN (...)（氏名のみ結合。連絡先は取得しない）"
    indexes_needed: []

kvs:
  - key_pattern: "cache:reservations:book:{bookId}:{includeClosed}:{page}:{pageSize}"
    purpose: "cache"
    value_type: "BookReservationPageResponse（Cache-Aside。予約の状態遷移で無効化）"
    ttl: "5m"
    operations: ["GET", "SET", "DEL"]

object_storage: []
