# _api-summary.yaml
uc: "貸出を登録する"
business: "貸出業務"
buc: "書籍を貸し出すフロー"
endpoints:
  - method: "GET"
    path: "/api/v1/loans/eligibility"
    summary: "貸出可否を照会する（利用者番号 + 書籍 ID）"
    response_schema: "LoanEligibilityResponse"
    tags: ["loans"]
    security: ["bearer"]
    roles: ["司書"]
    parameters:
      - name: "userNumber"
        in: "query"
        type: "string"
        required: true
      - name: "bookId"
        in: "query"
        type: "string"
        required: true
    responses:
      "200": "LoanEligibilityResponse"
      "400": "ValidationProblemDetails"
      "401": "ProblemDetails"
      "403": "ProblemDetails"
      "404": "ProblemDetails"
    errors:
      - status: "400"
        code: "VALIDATION_ERROR"
      - status: "401"
        code: "UNAUTHENTICATED"
      - status: "403"
        code: "FORBIDDEN"
      - status: "404"
        code: "BOOK_NOT_FOUND"
      - status: "404"
        code: "USER_NOT_FOUND"
  - method: "POST"
    path: "/api/v1/loans"
    summary: "貸出を登録する（書籍を貸出中に遷移、返却期限を自動設定）"
    request_schema: "CreateLoanRequest"
    response_schema: "LoanResponse"
    tags: ["loans"]
    security: ["bearer"]
    roles: ["司書"]
    headers:
      - name: "Idempotency-Key"
        required: true
    responses:
      "201": "LoanResponse"
      "400": "ValidationProblemDetails"
      "401": "ProblemDetails"
      "403": "ProblemDetails"
      "404": "ProblemDetails"
      "409": "ProblemDetails"
      "500": "ProblemDetails"
    errors:
      - status: "400"
        code: "VALIDATION_ERROR"
      - status: "401"
        code: "UNAUTHENTICATED"
      - status: "403"
        code: "FORBIDDEN"
      - status: "404"
        code: "BOOK_NOT_FOUND"
      - status: "404"
        code: "USER_NOT_FOUND"
      - status: "409"
        code: "BOOK_NOT_AVAILABLE"
      - status: "409"
        code: "CONCURRENT_UPDATE"
      - status: "409"
        code: "IDEMPOTENCY_KEY_CONFLICT"
      - status: "409"
        code: "MEDIA_TYPE_NOT_LOANABLE"
      - status: "409"
        code: "RESERVATION_PRIORITY_MISMATCH"
      - status: "500"
        code: "LOAN_PERIOD_NOT_CONFIGURED"
async_events: []
schemas:
  - name: "CreateLoanRequest"
    properties:
      - name: "userNumber"
        type: "string"
        required: true
      - name: "bookId"
        type: "string"
        required: true
  - name: "LoanEligibilityResponse"
    properties:
      - name: "allowed"
        type: "boolean"
        required: true
      - name: "reasonCode"
        type: "string"
        required: false
        enum: ["BOOK_NOT_AVAILABLE", "RESERVATION_PRIORITY_MISMATCH", "MEDIA_TYPE_NOT_LOANABLE"]
      - name: "reasonMessage"
        type: "string"
        required: false
      - name: "dueDate"
        type: "string"
        format: "date"
        required: false
      - name: "loanDays"
        type: "integer"
        required: false
      - name: "book"
        type: "BookSummary"
        required: true
      - name: "user"
        type: "UserSummary"
        required: true
      - name: "reservation"
        type: "ReservationSummary"
        required: false
  - name: "LoanResponse"
    properties:
      - name: "loanId"
        type: "string"
        required: true
      - name: "bookId"
        type: "string"
        required: true
      - name: "userNumber"
        type: "string"
        required: true
      - name: "loanedOn"
        type: "string"
        format: "date"
        required: true
      - name: "dueDate"
        type: "string"
        format: "date"
        required: true
      - name: "status"
        type: "string"
        enum: ["ON_LOAN", "OVERDUE", "RETURNED"]
        required: true
      - name: "recordedBy"
        type: "string"
        required: true
      - name: "bookStatus"
        type: "string"
        enum: ["AVAILABLE", "ON_LOAN", "RESERVED"]
        required: true
      - name: "book"
        type: "BookSummary"
        required: true
      - name: "user"
        type: "UserSummary"
        required: true
  - name: "BookSummary"
    properties:
      - name: "bookId"
        type: "string"
        required: true
      - name: "title"
        type: "string"
        required: true
      - name: "author"
        type: "string"
        required: true
      - name: "mediaType"
        type: "string"
        enum: ["PAPER", "ELECTRONIC"]
        required: true
      - name: "status"
        type: "string"
        enum: ["AVAILABLE", "ON_LOAN", "RESERVED"]
        required: true
  - name: "UserSummary"
    properties:
      - name: "userNumber"
        type: "string"
        required: true
      - name: "name"
        type: "string"
        required: true
  - name: "ReservationSummary"
    properties:
      - name: "reservationId"
        type: "string"
        required: true
      - name: "queuePosition"
        type: "integer"
        required: true
      - name: "status"
        type: "string"
        enum: ["RESERVED", "NOTIFIED", "CANCELLED", "CLOSED"]
        required: true
