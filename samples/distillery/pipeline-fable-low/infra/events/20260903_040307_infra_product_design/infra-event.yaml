      id: "CTP-017"
      description: "API エッジでの認証は WAF によるレート制限・マネージドルールでの防御を基本とし、トークン検証は Backend 最外周ミドルウェアで行う多層防御方針とする（エッジでの JWT 検証が困難な構成を採る場合の代替パターン）"
      source: "product-decision-002 / product-mapping-aws.yaml（api_edge fidelity: partial）"
