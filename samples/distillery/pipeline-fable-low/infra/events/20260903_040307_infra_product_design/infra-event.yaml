      id: "CTP-018"
      description: "SLI/SLO ベースのオブザーバビリティ方針（可用性・応答時間・エラー率・送信成功率・バッチ完遂率の SLI を定義し、アラートしきい値を SLO から導出する）を採用する"
      source: "product-observability.yaml（sli_slo[]）"
