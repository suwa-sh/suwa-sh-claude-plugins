artifact_id: "arch-decision-002"
title: "BC 設計: 情報.tsv のコンテキスト列に沿った 6 境界づけられたコンテキスト"
status: "approved"
generated_at: "2026-09-03T03:51:01"
context: |
  9 情報・3 状態モデル・27 UC の小規模システムに対して、境界づけられたコンテキスト（BC）の分割単位を決める必要がある。
  BC の分割はユビキタス言語の境界とチーム境界（Conway の法則）というドメイン判断を含み、RDRA からは仮説生成に留まる。
  同名異義語の検出では「書籍の状態」「利用者」「通知」がコンテキストを跨いで登場するが、いずれも属性集合が同一で厳密な同名異義語は無かった。
  分割根拠は情報.tsv のコンテキスト列 6 区分 + 状態モデル 3 本の独立性 + 貸出（司書主導）/ 予約（利用者主導）/ 通知（外部連携）のアクター集合の違いである。
  チーム編成は RDRA に無く、team_ownership は推論できない。
decision: |
  情報.tsv のコンテキスト列に沿って 6 BC に分割する（confidence: medium。BC 分割は medium 上限）。
  - BC-001 蔵書コンテキスト（SD-002）: E-001 書籍, E-002 ジャンル。書籍の状態モデルを所有
  - BC-002 利用者コンテキスト（SD-003）: E-003 利用者。個人情報の保護境界。利用状況閲覧範囲判定を所有
  - BC-003 貸出コンテキスト（SD-001）: E-004 貸出, E-005 貸出期間, E-006 リマインド日数。貸出の状態モデル + 業務パラメータ + 日次バッチ
  - BC-004 予約コンテキスト（SD-001）: E-007 予約。予約の状態モデルと予約順位決定
  - BC-005 通知コンテキスト（SD-005）: E-008 通知。メール配信サービスとの連携領域を隔離
  - BC-006 運営分析コンテキスト（SD-004）: E-009 貸出統計。読み取り専用の集計
  各 BC に核語彙（ubiquitous_language）を 2〜5 件定義した。team_ownership はすべて null（未定）とする（confidence: low、DIST-019）。
  NFR 由来の派生エンティティ（E-901 セッション / E-902 監査ログ / E-903 認証情報）は横断的な認証・監査基盤として扱い、BC の owned_entity_ids には含めない。
consequences:
  positive:
    - "モジュラモノリスのモジュール境界にそのまま使え、将来の分割（マイクロサービス化・電子書籍対応）の余地を残せる"
    - "個人情報の正本（利用者）と外部連携（通知）を独立 BC に隔離し、認可の厳格化と ACL の適用範囲を明確にできる"
    - "BC の owned_entity_ids が data_architecture.entities と 1:1 に対応し、validator でクロスリファレンスを機械検証できる"
  negative:
    - "貸出・予約・蔵書の 3 BC が状態遷移で密に連動するため、貸出登録・返却登録は BC をまたぐ越境トランザクションになる"
    - "team_ownership 未定のため Conway の法則に基づく境界検証ができていない。チーム編成確定後に再確認が必要"
    - "1 館・9 エンティティに対して 6 BC は粒度が細かく、モジュール境界の規律維持にコストがかかる"
alternatives_considered:
  - name: "4 BC に統合（蔵書 / 利用者 / 貸出+予約 / 通知+運営分析）（Option B）"
    reason_rejected: "貸出と予約の統合で越境トランザクションは回避できるが、予約（利用者主導）と貸出（司書主導）の言語が混在し、通知（個人情報）と運営分析（集計）の感度が異なるデータが同居する"
  - name: "1 BC（モノリス）（Option C）"
    reason_rejected: "統合コストは最小だが、将来の電子書籍対応や外部連携追加時に境界を引き直す負担が大きく、NFR F.2.2.1「コンテキスト分割されたモジュラ構成」に反する"
  - name: "team_ownership をユーザー指定 / 全 BC を 1 チーム所有とする"
    reason_rejected: "チーム情報が RDRA に無く auto_adopt では確定できない。null のまま進め、後から追記可能とした（DIST-019）"
