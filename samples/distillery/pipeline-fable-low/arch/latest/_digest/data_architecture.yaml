# digest of arch/latest/arch-design.yaml section data_architecture (L1677-2332); source_sha256: 00ef834d62946ecc806f3ac1755b4250fecff62244405745e1a7df4ef94c91d4
# 派生物。正本は arch-design.yaml。編集しない
data_architecture:
  entities:
    - id: "E-001"
      name: "書籍"
      source_info: "情報: 書籍"
      model_type: "event_snapshot"
      attributes:
        - name: "book_id"
          type: "string"
          description: "書籍ID"
          nullable: false
          primary_key: true
        - name: "title"
          type: "string"
          description: "タイトル"
          nullable: false
          primary_key: false
        - name: "author"
          type: "string"
          description: "著者"
          nullable: false
          primary_key: false
        - name: "isbn"
          type: "string"
          description: "ISBN（移行時に重複・欠損を名寄せする。NFR D.4.1.3）"
          nullable: true
          primary_key: false
        - name: "publisher"
          type: "string"
          description: "出版社"
          nullable: true
          primary_key: false
        - name: "genre_id"
          type: "string"
          description: "ジャンルID（E-002 への参照）"
          nullable: false
          primary_key: false
        - name: "media_type"
          type: "string"
          description: "媒体種別（enum: 紙・電子。初期リリースは紙のみ貸出・予約対象）"
          nullable: false
          primary_key: false
        - name: "current_status"
          type: "string"
          description: "書籍の状態（enum: 在庫あり・貸出中・予約待ち）。スナップショットのキャッシュ的ステータス。遷移はイベント（登録・貸出・返却・予約取消・削除）で記録する"
          nullable: false
          primary_key: false
        - name: "version"
          type: "integer"
          description: "楽観ロック用バージョン"
          nullable: false
          primary_key: false
        - name: "updated_at"
          type: "datetime"
          description: "スナップショット最終更新日時。情報.tsv の登録日・更新日は登録イベント / 最新イベントの occurred_at で管理する"
          nullable: false
          primary_key: false
      relationships:
        - target_entity: "E-002"
          type: "N:1"
          description: "書籍はジャンルに属する（ジャンルは複数書籍から参照されるマスタ）"
        - target_entity: "E-004"
          type: "1:N"
          description: "書籍は複数の貸出記録を持つ"
        - target_entity: "E-007"
          type: "1:N"
          description: "書籍は複数の予約を持つ（受付順に予約順位を付与）"
        - target_entity: "E-009"
          type: "1:N"
          description: "書籍ごとに集計期間別の貸出統計を持つ"
    - id: "E-002"
      name: "ジャンル"
      source_info: "情報: ジャンル"
      model_type: "resource_mutable"
      attributes:
        - name: "genre_id"
          type: "string"
          description: "ジャンルID"
          nullable: false
          primary_key: true
        - name: "genre_name"
          type: "string"
          description: "ジャンル名（文学・社会科学・自然科学・技術・芸術・歴史・児童書・その他）"
          nullable: false
          primary_key: false
        - name: "description"
          type: "text"
          description: "説明"
          nullable: true
          primary_key: false
      relationships:
        - target_entity: "E-001"
          type: "1:N"
          description: "ジャンルは複数の書籍を分類する"
    - id: "E-003"
      name: "利用者"
      source_info: "情報: 利用者"
      model_type: "event_snapshot"
      attributes:
        - name: "user_number"
          type: "string"
          description: "利用者番号（司書が登録時に付与する一意の識別子）"
          nullable: false
          primary_key: true
        - name: "name"
          type: "string"
          description: "氏名（個人情報。保管時暗号化対象 NFR E.6.1.1、テスト環境マスキング対象 NFR E.6.2.1）"
          nullable: false
          primary_key: false
        - name: "email"
          type: "string"
          description: "メールアドレス（通知の送信先。移行時に欠損を補完する NFR D.4.1.3。個人情報）"
          nullable: false
          primary_key: false
        - name: "phone"
          type: "string"
          description: "電話番号（個人情報）"
          nullable: true
          primary_key: false
        - name: "address"
          type: "string"
          description: "住所（個人情報）"
          nullable: true
          primary_key: false
        - name: "user_type"
          type: "string"
          description: "利用者区分（enum: 司書・利用者）。RBAC のロール源泉（NFR E.5.2.1）"
          nullable: false
          primary_key: false
        - name: "version"
          type: "integer"
          description: "楽観ロック用バージョン"
          nullable: false
          primary_key: false
        - name: "updated_at"
          type: "datetime"
          description: "スナップショット最終更新日時。登録日・更新日は登録 / 属性変更イベントの occurred_at で管理する"
          nullable: false
          primary_key: false
      relationships:
        - target_entity: "E-004"
          type: "1:N"
          description: "利用者は複数の貸出を持つ"
        - target_entity: "E-007"
          type: "1:N"
          description: "利用者は複数の予約を持つ"
        - target_entity: "E-008"
          type: "1:N"
          description: "利用者は複数の通知の送信先になる"
        - target_entity: "E-903"
          type: "1:1"
          description: "利用者は 1 件の認証情報を持つ（派生エンティティ。NFR E.5.1.1）"
    - id: "E-004"
      name: "貸出"
      source_info: "情報: 貸出"
      model_type: "event_snapshot"
      attributes:
        - name: "loan_id"
          type: "string"
          description: "貸出ID"
          nullable: false
          primary_key: true
        - name: "book_id"
          type: "string"
          description: "書籍ID（E-001 への参照）"
          nullable: false
          primary_key: false
        - name: "user_number"
          type: "string"
          description: "利用者番号（E-003 への参照。貸出履歴は要配慮情報に準じる NFR E.1.2.1 / E.6.1.1）"
          nullable: false
          primary_key: false
        - name: "loaned_on"
          type: "date"
          description: "貸出日（貸出登録イベントの発生日。INSERT 時に確定）"
          nullable: false
          primary_key: false
        - name: "due_date"
          type: "date"
          description: "返却期限（貸出日 + 貸出期間で自動設定。条件: 返却期限算出）"
          nullable: false
          primary_key: false
        - name: "current_status"
          type: "string"
          description: "貸出の状態（enum: 貸出中・延滞・返却済み）。返却日（情報.tsv）は nullable 日時のため排除し、返却登録イベントの occurred_at で管理する"
          nullable: false
          primary_key: false
        - name: "recorded_by"
          type: "string"
          description: "記録した司書（利用者区分=司書の利用者番号。E-003 への参照）"
          nullable: false
          primary_key: false
        - name: "version"
          type: "integer"
          description: "楽観ロック用バージョン"
          nullable: false
          primary_key: false
        - name: "updated_at"
          type: "datetime"
          description: "スナップショット最終更新日時"
          nullable: false
          primary_key: false
      relationships:
        - target_entity: "E-001"
          type: "N:1"
          description: "貸出は 1 冊の書籍に紐づく"
        - target_entity: "E-003"
          type: "N:1"
          description: "貸出は 1 人の利用者に紐づく（記録した司書も E-003 を参照）"
        - target_entity: "E-008"
          type: "1:N"
          description: "貸出はリマインド・督促の通知を複数持つ"
        - target_entity: "E-009"
          type: "1:N"
          description: "貸出記録は貸出統計の集計元（FK ではなく派生関係）"
        - target_entity: "E-005"
          type: "N:1"
          description: "貸出日時点で有効な貸出期間を返却期限算出に適用する（世代参照）"
        - target_entity: "E-006"
          type: "N:1"
          description: "判定日時点で有効なリマインド日数をリマインド対象判定に適用する（世代参照）"
    - id: "E-005"
      name: "貸出期間"
      source_info: "情報: 貸出期間"
      model_type: "resource_scd2"
      attributes:
        - name: "loan_period_id"
          type: "string"
          description: "貸出期間設定ID（世代ごとに採番）"
          nullable: false
          primary_key: true
        - name: "loan_days"
          type: "integer"
          description: "貸出期間（日数）"
          nullable: false
          primary_key: false
        - name: "valid_from"
          type: "date"
          description: "適用開始日"
          nullable: false
          primary_key: false
        - name: "valid_to"
          type: "date"
          description: "適用終了日（現行世代は NULL）"
          nullable: true
          primary_key: false
        - name: "updated_at"
          type: "datetime"
          description: "更新日時"
          nullable: false
          primary_key: false
      relationships:
        - target_entity: "E-004"
          type: "1:N"
          description: "適用期間内に登録された貸出の返却期限算出に用いる"
    - id: "E-006"
      name: "リマインド日数"
      source_info: "情報: リマインド日数"
      model_type: "resource_scd2"
      attributes:
        - name: "remind_days_id"
          type: "string"
          description: "リマインド日数設定ID（世代ごとに採番）"
          nullable: false
          primary_key: true
        - name: "remind_days"
          type: "integer"
          description: "リマインド日数（返却期限の何日前か）"
          nullable: false
          primary_key: false
        - name: "valid_from"
          type: "date"
          description: "適用開始日"
          nullable: false
          primary_key: false
        - name: "valid_to"
          type: "date"
          description: "適用終了日（現行世代は NULL）"
          nullable: true
          primary_key: false
        - name: "updated_at"
          type: "datetime"
          description: "更新日時"
          nullable: false
          primary_key: false
      relationships:
        - target_entity: "E-004"
          type: "1:N"
          description: "日次バッチのリマインド対象判定で貸出に適用する"
    - id: "E-007"
      name: "予約"
      source_info: "情報: 予約"
      model_type: "event_snapshot"
      attributes:
        - name: "reservation_id"
          type: "string"
          description: "予約ID"
          nullable: false
          primary_key: true
        - name: "book_id"
          type: "string"
          description: "書籍ID（E-001 への参照）"
          nullable: false
          primary_key: false
        - name: "user_number"
          type: "string"
          description: "利用者番号（E-003 への参照）"
          nullable: false
          primary_key: false
        - name: "accepted_at"
          type: "datetime"
          description: "受付日時（予約登録イベントの発生日時。予約順位の決定基準）"
          nullable: false
          primary_key: false
        - name: "queue_position"
          type: "integer"
          description: "予約順位（同一書籍内の受付順。取消時に繰り上げる。条件: 予約順位決定）"
          nullable: false
          primary_key: false
        - name: "current_status"
          type: "string"
          description: "予約の状態（enum: 予約中・通知済み・取消・終了）。取消日時（情報.tsv）は nullable 日時のため排除し、取消イベントの occurred_at で管理する"
          nullable: false
          primary_key: false
        - name: "version"
          type: "integer"
          description: "楽観ロック用バージョン"
          nullable: false
          primary_key: false
        - name: "updated_at"
          type: "datetime"
          description: "スナップショット最終更新日時"
          nullable: false
          primary_key: false
      relationships:
        - target_entity: "E-001"
          type: "N:1"
          description: "予約は 1 冊の書籍に紐づく"
        - target_entity: "E-003"
          type: "N:1"
          description: "予約は 1 人の利用者に紐づく"
        - target_entity: "E-008"
          type: "1:N"
          description: "予約は返却通知を持つ（取消・繰り上げで複数回送られうる）"
    - id: "E-008"
      name: "通知"
      source_info: "情報: 通知"
      model_type: "event"
      attributes:
        - name: "notification_id"
          type: "string"
          description: "通知ID"
          nullable: false
          primary_key: true
        - name: "user_number"
          type: "string"
          description: "利用者番号（E-003 への参照）"
          nullable: false
          primary_key: false
        - name: "notification_type"
          type: "string"
          description: "通知種別（enum: 返却通知・リマインド・督促）"
          nullable: false
          primary_key: false
        - name: "recipient_email"
          type: "string"
          description: "送信先メールアドレス（送信時点の値のコピー。個人情報。NFR E.6.1.1）"
          nullable: false
          primary_key: false
        - name: "subject"
          type: "string"
          description: "件名"
          nullable: false
          primary_key: false
        - name: "body"
          type: "text"
          description: "本文"
          nullable: false
          primary_key: false
        - name: "sent_at"
          type: "datetime"
          description: "送信日時（イベント発生日時 occurred_at）"
          nullable: false
          primary_key: false
        - name: "send_result"
          type: "string"
          description: "送信結果（enum: 成功・失敗。メール配信サービスの応答を ACL で翻訳した値）"
          nullable: false
          primary_key: false
        - name: "target_loan_id"
          type: "string"
          description: "対象貸出ID（リマインド・督促のとき。E-004 への参照。返却通知では NULL）"
          nullable: true
          primary_key: false
        - name: "target_reservation_id"
          type: "string"
          description: "対象予約ID（返却通知のとき。E-007 への参照。リマインド・督促では NULL）"
          nullable: true
          primary_key: false
      relationships:
        - target_entity: "E-003"
          type: "N:1"
          description: "通知は 1 人の利用者に送信される"
        - target_entity: "E-004"
          type: "N:1"
          description: "リマインド・督促は対象貸出に紐づく"
        - target_entity: "E-007"
          type: "N:1"
          description: "返却通知は対象予約に紐づく"
    - id: "E-009"
      name: "貸出統計"
      source_info: "情報: 貸出統計"
      model_type: "resource_mutable"
      attributes:
        - name: "stat_id"
          type: "string"
          description: "集計ID"
          nullable: false
          primary_key: true
        - name: "period_type"
          type: "string"
          description: "集計期間種別（enum: 日・月・年）"
          nullable: false
          primary_key: false
        - name: "period_start"
          type: "date"
          description: "集計対象期間 開始日"
          nullable: false
          primary_key: false
        - name: "period_end"
          type: "date"
          description: "集計対象期間 終了日"
          nullable: false
          primary_key: false
        - name: "book_id"
          type: "string"
          description: "書籍ID（E-001 への参照）"
          nullable: false
          primary_key: false
        - name: "loan_count"
          type: "integer"
          description: "貸出回数（書籍ごと。人気書籍ランキングの基準）"
          nullable: false
          primary_key: false
        - name: "loan_total"
          type: "integer"
          description: "貸出件数（集計期間内の合計）"
          nullable: false
          primary_key: false
        - name: "ranking"
          type: "integer"
          description: "ランキング順位"
          nullable: false
          primary_key: false
        - name: "aggregated_at"
          type: "datetime"
          description: "集計日時（再集計のたびに更新）"
          nullable: false
          primary_key: false
      relationships:
        - target_entity: "E-001"
          type: "N:1"
          description: "貸出統計は書籍ごとに集計する"
        - target_entity: "E-004"
          type: "N:1"
          description: "貸出記録を集計した派生データ（Materialized View。FK ではない）"
    - id: "E-901"
      name: "セッション"
      source_info: "情報: なし（派生。アクター: 利用者（社外）/ 司書、NFR E.5.1.1 認証方式、NFR E.7.1.1 監査ログ）"
      model_type: "resource_mutable"
      attributes:
        - name: "session_id"
          type: "string"
          description: "セッションID"
          nullable: false
          primary_key: true
        - name: "user_number"
          type: "string"
          description: "ログイン利用者の利用者番号（E-003 への参照）"
          nullable: false
          primary_key: false
        - name: "role"
          type: "string"
          description: "ロール（利用者区分のコピー: 司書・利用者。RBAC 判定用）"
          nullable: false
          primary_key: false
        - name: "issued_at"
          type: "datetime"
          description: "発行日時"
          nullable: false
          primary_key: false
        - name: "expires_at"
          type: "datetime"
          description: "有効期限（TTL で失効）"
          nullable: false
          primary_key: false
      relationships:
        - target_entity: "E-003"
          type: "N:1"
          description: "セッションはログイン中の利用者に紐づく"
    - id: "E-902"
      name: "監査ログ"
      source_info: "情報: なし（派生。NFR E.7.1.1 監査ログ Lv2: ログイン/ログアウト + データアクセスログ、条件: 利用状況閲覧範囲判定）"
      model_type: "event"
      attributes:
        - name: "audit_id"
          type: "string"
          description: "監査ログID"
          nullable: false
          primary_key: true
        - name: "occurred_at"
          type: "datetime"
          description: "発生日時"
          nullable: false
          primary_key: false
        - name: "actor_user_number"
          type: "string"
          description: "操作者の利用者番号（バッチはタイマーの固定 ID）"
          nullable: false
          primary_key: false
        - name: "action_type"
          type: "string"
          description: "操作種別（enum: ログイン・ログアウト・ログイン失敗・データ参照・データ更新）"
          nullable: false
          primary_key: false
        - name: "target_entity"
          type: "string"
          description: "対象エンティティ（E-xxx）"
          nullable: false
          primary_key: false
        - name: "target_id"
          type: "string"
          description: "対象レコード ID（利用状況閲覧範囲判定の検証に使う）"
          nullable: false
          primary_key: false
        - name: "result"
          type: "string"
          description: "結果（enum: 成功・拒否・失敗）"
          nullable: false
          primary_key: false
      relationships:
        - target_entity: "E-003"
          type: "N:1"
          description: "監査ログは操作者（利用者）に紐づく"
    - id: "E-903"
      name: "認証情報"
      source_info: "情報: なし（派生。NFR E.5.1.1 ID/パスワード認証 + パスワードポリシー、NFR E.7.2.1 ログイン失敗の連続検知とアカウントロック、NFR E.6.1.1 認証情報の暗号化）"
      model_type: "resource_mutable"
      attributes:
        - name: "user_number"
          type: "string"
          description: "利用者番号（E-003 と 1:1）"
          nullable: false
          primary_key: true
        - name: "password_hash"
          type: "string"
          description: "パスワードハッシュ（平文保持禁止。ソルト付きハッシュ）"
          nullable: false
          primary_key: false
        - name: "password_updated_at"
          type: "datetime"
          description: "パスワード最終更新日時（有効期限ポリシーの判定基準）"
          nullable: false
          primary_key: false
        - name: "failed_attempts"
          type: "integer"
          description: "連続ログイン失敗回数"
          nullable: false
          primary_key: false
        - name: "locked_until"
          type: "datetime"
          description: "アカウントロック解除日時（未ロックは NULL）"
          nullable: true
          primary_key: false
      relationships:
        - target_entity: "E-003"
          type: "1:1"
          description: "認証情報は利用者と 1:1"
  storage_mapping:
    - entity_id: "E-001"
      storage_type: "rdb"
