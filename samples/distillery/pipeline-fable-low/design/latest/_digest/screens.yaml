# 派生物。正本は design-event.yaml。編集しない
screens:
  - name: "蔵書検索画面"
    portal: "patron"
    route: "/search"
    uc: "書籍を検索する"
    components:
      - "PortalShell"
      - "BookSearchFilter"
      - "BookCard"
      - "Pagination"
      - "EmptyState"
      - "Skeleton"
    variants:
      - "Default"
      - "Empty"
      - "Loading"
    story: "Pages/利用者ポータル/蔵書検索画面"
