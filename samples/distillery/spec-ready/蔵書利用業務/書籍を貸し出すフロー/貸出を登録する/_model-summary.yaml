tables:
  - name: loans
    rdra_info: 貸出
    operations:
      - type: INSERT
        columns:
          - name: loan_id
            value: 採番した貸出ID
          - name: book_id
            value: 要求の book_id
          - name: user_no
            value: 要求の user_no
          - name: loan_date
            value: 貸出登録日（本日）
          - name: loan_period_type
            value: 要求の loan_period_type（標準/短期/長期）
          - name: due_date
            value: loan_date + 貸出期間区分の日数（返却期限設定条件）
          - name: loan_status
            value: 貸出中
          - name: book_title
            value: 貸出時点の books.title のスナップショット
          - name: book_author
            value: 貸出時点の books.author のスナップショット
          - name: book_isbn
            value: 貸出時点の books.isbn のスナップショット
          - name: book_genre
            value: 貸出時点の books.genre のスナップショット
          - name: returned_at
            value: 'NULL'
        where: ''
    indexes_needed:
      - columns:
          - book_id
          - loan_status
        reason: 同一書籍に有効な貸出（貸出中/延滞）が重複しないことの確認と、返却時の対象貸出特定に使う
        access_pattern: 書籍IDと貸出状態で有効な貸出の存在確認
      - columns:
          - user_no
          - loan_status
        reason: 利用者ごとの進行中貸出の有無確認（利用者状態の遷移判定・利用者削除可否条件）に使う
        access_pattern: 利用者番号と貸出状態での絞り込み
  - name: books
    rdra_info: 書籍
    operations:
      - type: SELECT
        columns: []
        where: book_id = :book_id FOR UPDATE NOWAIT
      - type: UPDATE
        columns:
          - name: book_status
            value: 貸出中
          - name: updated_at
            value: 貸出登録イベントの発生時刻
          - name: version
            value: version + 1
        where: book_id = :book_id AND book_status IN ('在庫あり','予約待ち')
    indexes_needed:
      - columns:
          - book_id
        reason: 貸出対象書籍の取得と更新。主キーで充足する
        access_pattern: 書籍IDによる 1 件取得・更新
  - name: users
    rdra_info: 利用者
    operations:
      - type: SELECT
        columns: []
        where: user_no = :user_no FOR UPDATE NOWAIT
      - type: UPDATE
        columns:
          - name: user_status
            value: 取引進行中
          - name: updated_at
            value: 貸出登録イベントの発生時刻
        where: user_no = :user_no AND user_status = '登録済み'
    indexes_needed:
      - columns:
          - user_no
        reason: 貸出先利用者の取得と更新。主キーで充足する
        access_pattern: 利用者番号による 1 件取得・更新
  - name: reservations
    rdra_info: 予約
    operations:
      - type: SELECT
        columns: []
        where: book_id = :book_id AND reservation_status = '取置き中' ORDER BY priority ASC
      - type: UPDATE
        columns:
          - name: reservation_status
            value: 貸出済み
          - name: hold_expires_at
            value: NULL（取置きが成立して終了したため保持期限を残さない。reservation_status と同一 UPDATE 文で更新する）
        where: reservation_id = :reservation_id AND reservation_status = '取置き中'
      - type: UPDATE
        columns:
          - name: priority
            value: applied_at ASC, reservation_id ASCで1始まりの連番
        where: book_id = :book_id AND reservation_status IN ('予約中','取置き中')。貸出済みへの遷移後に同じ取引内で実行
    indexes_needed:
      - columns:
          - book_id
          - reservation_status
          - priority
        reason: 取置き中書籍貸出条件で対象書籍の取置き中予約を順位順に特定する
        access_pattern: 書籍ID + 予約状態で絞り込み、予約順位の昇順で先頭 1 件を取得
  - name: api_operation_results
    operations:
      - type: SELECT
        where: actor_sub + operation_id + idempotency_key
      - type: INSERT
        columns:
          - name: actor_sub
            value: JWT sub
          - name: operation_id
            value: createLoan
          - name: idempotency_key
            value: 要求ヘッダ
          - name: request_fingerprint
            value: loan-commit.mdの規則
          - name: response_status
            value: '201'
          - name: response_body
            value: 確定LoanResponse
          - name: location
            value: /api/v1/loans/{loan_id}
          - name: committed_at
            value: 貸出登録時刻
kvs: []
object_storage: []
