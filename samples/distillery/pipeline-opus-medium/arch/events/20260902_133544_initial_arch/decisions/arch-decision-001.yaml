artifact_id: "arch-decision-001"
title: "SD-001「蔵書貸出・予約」を Core サブドメインに分類"
status: "approved"
generated_at: "2026-09-02T14:11:27"
context: |
  サブドメイン分類（Core / Supporting / Generic）は「どこに開発投資を集中させるか」という経営判断を含むため、
  RDRA モデルから自動推論しきれない。本システムの RDRA には以下のシグナルがある。
  - システム概要が「貸出・返却・予約を Web 画面から行えるようにする」ことを目的として明示
  - 条件.tsv 17 件のうち、貸出可否条件 / 予約可否条件 / 予約順位決定条件 / 重複予約禁止条件 /
    返却期限設定条件 / 返却後状態決定条件 / 取置き中書籍貸出条件 の 7 件が貸出・予約に集中
  - 状態モデル 6 件のうち貸出状態・予約状態の遷移が最も複雑
  一方でシステム概要に「競争優位」「差別化」という明示的キーワードは存在せず、
  図書館サービスとしての戦略的位置づけは経営判断に属する。
decision: |
  SD-001「蔵書貸出・予約」を type: core と分類し、investment_policy を
  「最優先で深いモデリングと継続的リファクタリングに投資。チーム最強の人材を配置」とする。
  対象 BUC は BUC-004（貸出）/ BUC-005（返却）/ BUC-006（予約）/ BUC-010（貸出履歴確認）/ BUC-011（予約状況確認）の 5 件。
  confidence は medium（Core サブドメインは自動推論で high を付与しない仕様上の上限）。
  同時に SD-002 蔵書目録 / SD-003 利用者管理 / SD-005 蔵書分析を supporting、
  SD-004 通知配信を generic（メール送信基盤は外部サービスを利用し自作しない）と分類した。
consequences:
  positive:
    - "業務ルール密度の最も高い領域に開発リソースとモデリング工数を集中できる"
    - "貸出・予約のドメイン層をリファクタリング可能な状態に保つ投資判断が明確になる"
    - "Generic 分類の通知配信を外部サービスへ委譲する判断（BC-007 / tier-external-gateway）と整合する"
  negative:
    - "Core 領域の初期実装コストが概算 +20〜30% 増える"
    - "システム概要に差別化の明示がないため、経営判断で Supporting へ再分類される可能性が残る"
alternatives_considered:
  - name: "Option B: supporting（貸出・返却・予約を既存業務の電子化と位置づける）"
    reason_rejected: "業務ルールの密度（条件 7 件・最も複雑な状態遷移）が Supporting の投資水準に見合わず、good enough 品質では貸出可否・予約順位の整合性を維持できない"
  - name: "Option C: 蔵書貸出と予約を別サブドメインに分割し、貸出のみ core とする"
    reason_rejected: "取置き中書籍貸出条件・予約順位決定条件が貸出と予約を横断しており、投資方針を分けると条件の実装が 2 サブドメインに割れる"
