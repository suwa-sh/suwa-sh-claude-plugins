tables:
  - name: "loans"
    rdra_info: "貸出"
    operations:
      - type: "SELECT"
        columns: []
        where: "loan_status = '貸出中' AND due_date < :base_date（チャンク走査）"
      - type: "UPDATE"
        columns:
          - name: "loan_status"
            value: "延滞（貸出中からの遷移のみ）"
        where: "loan_id IN (:chunk) AND loan_status = '貸出中'"
      - type: "SELECT"
        columns: []
        where: "loan_id IN (:日次ジョブ実行結果の遷移対象貸出ID一覧)（判定日に遷移した貸出の一覧。返却期限からの逆算はしない）"
      - type: "SELECT"
        columns: []
        where: "loan_status = '延滞'（overdue_total の集計）"
    indexes_needed:
      - columns: ["loan_status", "due_date"]
        reason: "貸出全件（最大 10 万件）の日次走査と、延滞の絞り込みが同一条件で行われるため"
        access_pattern: "貸出状態 + 返却期限の範囲・完全一致による絞り込み"
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = loans.book_id（一覧表示のタイトル・著者取得）"
    indexes_needed: []
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_no = loans.user_no（宛先利用者と司書向け表示名の取得）"
    indexes_needed: []

kvs:
  - key_pattern: "idem:notification:loan:{notification_type}:{target_loan_id}:{timing_type}:{base_date}"
    purpose: "idem"
    value_type: "送信要求の発行済みマーカー"
    ttl: "7d"
    operations: ["GET", "SET"]
  - key_pattern: "lock:job:overdue-judge:{base_date}"
    purpose: "lock"
    value_type: "ジョブ実行 ID・実行状態（実行中 / 完了）・遷移件数・遷移対象貸出ID一覧（当日遷移件数の正本）"
    ttl: "7d"
    operations: ["GET", "SET"]

object_storage: []
