    rdra_info: "貸出"
  - name: "OverdueJudgementResponse"
    tier: "tier-frontend-staff"
    layer: "api-client"
    type: "view-model"
    rdra_info: "貸出"
  - name: "OverdueJudgementRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "貸出"
  - name: "GetOverdueJudgementQuery"
    tier: "tier-backend-api"
