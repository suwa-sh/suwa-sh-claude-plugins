title: "横断関心事（エラー・ページネーション・認証伝播・冪等性・楽観ロック）を全 41 UC 共通の規約として一元化する"
status: "approved"
generated_at: "2026-09-02T16:42:47+09:00"
context: |
  全 41 UC の Spec を統合した結果、UC ごとに個別最適されると設計が発散し、
  実装・レビュー・テストのコストが UC 数に比例して増える横断関心事が 5 つ特定された。

  - **エラー表現**: 41 UC すべてがエラー表示を持つが、UC 単位の Spec では
    HTTP ステータスの使い分けとフロントエンドの表示先が揃っていなかった。
  - **ページネーション**: 一覧系エンドポイントが 20 以上あり、方式が統一されていないと
    共通コンポーネント `DataListSection`（15 UC で利用）と共通フック `useListQueryState`（7 UC）が成立しない。
  - **認証伝播**: 認証は外部マネージド IdP（OAuth2/OIDC）へ委譲済みだが、
    バックエンドが誰として処理しているかを解決する方式が未確定だった。
    RBAC（司書 / 利用者）に加え本人限定参照の判定が必要。
  - **冪等性**: 更新系 POST は窓口業務での二重送信・ネットワーク再送・MQ の at-least-once 配信という
    3 経路で重複しうる。
  - **同時更新**: 書籍情報編集・利用者情報編集は司書が複数人で同時に操作しうる。
decision: |
  横断関心事を次の 5 規約として一元化し、UC 単位 Spec からは規約を参照するだけとする。

  ## 1. エラーハンドリング戦略と HTTP ステータスポリシー

  ステータスコードの意味を全エンドポイントで固定し、フロントエンドは共通フック
  `useApiErrorPresenter`（全 41 UC で利用）で 4 分類（通信 / 認可 / 業務ルール違反 / 競合）へ
  正規化してから表示する。

  | ステータス | 意味 | 分類 | 表示 | 追加導線 |
  |-----------|------|------|------|---------|
  | 400 / 422 | リクエスト形式・値の不正 | 入力エラー | `Input(error)` + フィールド直下メッセージ | 最初のエラー欄へフォーカス |
  | 401 | 未認証・トークン失効 | 認可 | `Alert(destructive)` | 再ログイン導線 |
  | 403 | ロール不足・本人限定参照の違反 | 認可 | `Alert(destructive)` | 前画面へ戻る（他ポータルの画面へリンクしない） |
  | 404 | 対象リソースが存在しない | 業務 | `Alert(destructive)` | 一覧へ戻る導線 |
  | 409 | 業務ルール違反 / 楽観ロック競合 | 競合・業務ルール違反 | 再実行で解消しうるものは `Alert(warning)`、対象の再特定が必要なものは `Alert(destructive)` | 最新の再取得 or 再読込 |
  | 5xx | サーバ・依存先の障害 | 通信 | `Alert(destructive)` | 同じ位置に再試行ボタン |

  - **業務ルール違反は 409（`BusinessRuleViolation`）に統一する**。
    貸出上限超過・貸出中の書籍への貸出・削除不可条件など、リクエスト自体は妥当だが
    現在の状態では実行できないものを 400 と混ぜない。
  - **リトライは冪等な操作にのみ許す**。GET と `X-Idempotency-Key` を伴う POST は再試行可、
    それ以外はユーザー操作による明示的な再実行とする。
  - 非同期側（Worker）のリトライ上限超過は例外を握り潰さず DLQ へ退避し、
    通知状態「送信失敗」として観測可能にする（`spec-decision-002`）。
  - すべてのエラー通知は `role="alert"` で行い、色だけで重篤度を伝えない。

  ## 2. ページネーション方式

  **オフセット方式（`page` / `per_page`）に統一する。**

  - `page`: 1 始まりの整数、既定 1
  - `per_page`: 1〜100 の整数、既定 20
  - 一覧レスポンスは件数メタを伴い、フロントエンドは共通コンポーネント `Pagination` で
    ページ番号を直接指定できる。
  - 検索条件とページ番号は `useListQueryState` により URL クエリパラメータと同期し、
    画面をまたぐ共有状態を持たない（ブックマーク・リロード・戻る操作でページが再現できる）。

  ## 3. 認証伝播方式（外部 IdP + RBAC + 本人限定参照）

  - 認証は**外部マネージド IdP（OAuth2/OIDC）へ委譲**し、システム内でパスワードを保持しない。
  - クライアントは IdP 発行のアクセストークン（JWT）を `Authorization: Bearer` で送る
    （OpenAPI の `bearerAuth`、`security` はドキュメント全体の既定として適用）。
  - **API Gateway がトークンを検証**し、`sub`（利用者アカウント ID）・役割（司書 / 利用者）・
    利用者番号をクレームとしてバックエンドへ伝播する。バックエンドは署名検証を再実装しない。
  - **認可は 2 段構え**にする。
    1. 粗粒度: パスプレフィックス単位の RBAC。`/api/v1/staff/**` と更新系・`/users` 系は司書ロール限定。
    2. 細粒度: 本人限定参照。`/api/v1/me/**` は URL に他人の ID を取らず、
       トークンの利用者番号クレームで対象を絞る（`spec-decision-001`）。
  - セッション情報は KVS の `session:account:{session_id}`（TTL は IdP のアクセストークン有効期限、既定 1h）に
    保持し、RDB へ永続化しない。
  - **個人情報は既定でマスクする**。氏名・メールアドレスは既定でマスク値（`*_masked`）を返し、
    `reveal=true` の明示指定時にのみ生値を返す。UI 側は `PiiMaskedText`（11 UC）で
    明示操作を伴う開示として表現する。

  ## 4. 冪等性（X-Idempotency-Key）

  - **状態を変える更新系（POST / PUT / DELETE）は `X-Idempotency-Key`（UUID v4、必須）を受け取る**。
    対象は `users` / `books` / `loans` / `reservations` / `notifications` / `reports` の更新系オペレーション全体で、
    OpenAPI では `IdempotencyKeyHeader` を各オペレーションに宣言する。参照系（GET）には付与しない。
    フロントエンドは共通フック `useIdempotentMutation`（16 UC）で画面表示時に UUID を発行し、
    送信・再送で同一キーを維持する。
  - サーバは KVS の `idem:api:{operation_id}:{idempotency_key}`（TTL 24h）に前回結果
    （採番した ID とレスポンス本文またはステータス）を保存し、同一キーの再送には前回結果をそのまま返す。
  - **キーの名前空間には OpenAPI の `operationId` を使い、HTTP メソッドとパスを埋め込まない**。
    パス変更が冪等制御へ波及しないようにするため。
  - 非同期側の冪等はメッセージ消費マーカーと業務単位キーの多層で担保する（`spec-decision-002`）。
  - 日次バッチは `lock:job:{job_name}:{base_date}`（TTL 7d）で同一基準日の多重起動を防ぎ、
    実行結果（遷移件数・遷移対象 ID 一覧）の正本も兼ねる。

  ## 5. 楽観ロック

  - **更新系は楽観ロックを標準とし、悲観ロック（行ロック保持）を業務トランザクションにまたがって行わない。**
  - 競合時は **409** を返し、UI は「最新を再取得して再実行」の導線を出す
    （`useApiErrorPresenter` の競合分類、`Alert(warning)`）。
  - 標準方式は**`version` カラムによるバージョン番号方式**とする（`books` が該当）。
    `users` は現状 `updated_at` を `If-Match` で比較する方式で定義されており、
    同一システム内に 2 方式が併存している。これは既知の逸脱として記録し、
    `users.version` の追加による標準方式への統一を後続の是正対象とする。
consequences:
  positive:
    - "エラー表現が 6 ステータス × 4 分類に固定されたため、41 UC 分のエラー UI を共通フック 1 つで賄え、UC 単位 Spec からエラー表示の記述を削減できた"
    - "ページネーションが単一方式に揃ったことで、共通コンポーネント `DataListSection`（15 UC）と `useListQueryState`（7 UC）が成立し、一覧画面ごとの実装差分がなくなった"
    - "URL クエリと同期する一覧状態により、ブックマーク・リロード・ブラウザバックでページと検索条件が再現できる"
    - "認証を外部 IdP へ委譲したため、パスワードハッシュ・多要素認証・パスワードリセットを自前実装せずに済み、資格情報の保管責任を負わない"
    - "トークン検証を API Gateway に集約したため、バックエンドの各サービスが署名検証と鍵ローテーションを個別実装しない"
    - "`/me/**` が他人の ID を URL に取らない構造のため、本人限定参照の担保がレビューで検証しやすい"
    - "個人情報の既定マスク + `reveal=true` の明示開示により、画面キャプチャ・ログ経由の意図しない個人情報露出を減らせる"
    - "`X-Idempotency-Key` を必須にしたことで、窓口業務での二重送信（貸出・返却の二重登録）を仕様レベルで排除できる"
    - "冪等キーの名前空間を `operationId` にしたため、URL のリファクタリングが冪等制御を壊さない"
    - "楽観ロックにより、司書が編集画面を開いたままでも DB のロックを保持せず、長時間トランザクションを避けられる"
  negative:
    - "オフセット方式は深いページで走査コストが増え、ページ送り中に追加・削除があるとレコードの重複表示・取りこぼしが起こりうる"
    - "409 に業務ルール違反と楽観ロック競合の両方を載せたため、クライアントはエラーボディの内容を見て `warning` と `destructive` を出し分ける必要がある"
    - "外部 IdP への依存が可用性の単一障害点になり、IdP 障害時は全 UC がログイン不能になる"
    - "IdP のクレーム設計（役割・利用者番号）とアプリの `user_accounts` を同期させる責務が発生する"
    - "`X-Idempotency-Key` を全更新系で必須にしたため、クライアントに UUID 生成とキー保持の責務が生じ、キー未送出は 400 として弾かれる"
    - "冪等結果を KVS に TTL 24h で保持するため、KVS 障害時は冪等保証が失われる（通知系のみ RDB へ二重化して最終防御を持つ）"
    - "楽観ロックの方式が `books`（version 列）と `users`（updated_at + If-Match）で不統一のまま残っており、実装側で 2 通りの競合検出を書く必要がある。統一までの間は誤用リスクを持つ"
alternatives_considered:
  - name: "ページネーションをカーソル方式（キーセットページング）にする"
    reason_rejected: |
      司書業務の一覧画面（蔵書一覧・利用者一覧・延滞一覧）は「何ページ目」「全何件」を
      直接指定・確認する使い方が中心で、任意ページへのジャンプが必要になる。
      カーソル方式は総件数と任意ページ移動を素直に表現できず、
      `Pagination` コンポーネントの操作性が落ちる。
      データ規模も無限スクロールを要する水準ではないため、
      深いページの走査コストという既知の欠点を許容した。
  - name: "業務ルール違反を 400 Bad Request で返す"
    reason_rejected: |
      400 は「リクエストの形式・値が不正」で、クライアント側の入力修正で解消するものを指す。
      貸出上限超過や貸出中の書籍への貸出は、リクエスト自体は妥当で「現在の状態では実行できない」
      ものであり、修正先が異なる。同じ 400 に混ぜると、フロントエンドが
      フィールドエラー表示と業務メッセージ表示を出し分けられない。
  - name: "業務ルール違反に 422 Unprocessable Content を割り当てる"
    reason_rejected: |
      422 は本仕様ではリクエストボディのバリデーションエラー（400 と同じ扱い）に割り当てており、
      入力エラー系として `Input(error)` へフィールド単位で表示する。
      状態競合を意味する 409 と役割を分けたほうが、
      「再取得して再実行」という復旧導線の判断が単純になる。
  - name: "認証を自前実装する（パスワードハッシュ・セッション管理を内製）"
    reason_rejected: |
      資格情報の保管・多要素認証・パスワードリセット・漏洩対応という
      継続的なセキュリティ責任を負うことになる。図書館蔵書管理システムの
      差別化領域ではなく、外部マネージド IdP へ委譲したほうが
      セキュリティ水準と運用コストの両面で有利。
  - name: "サーバ側セッション（不透明なセッション ID を Cookie で往復）を主方式にする"
    reason_rejected: |
      外部 IdP（OAuth2/OIDC）から受け取るアクセストークンをそのまま Bearer で扱うほうが、
      Gateway での検証・クレーム伝播が単純になる。
      セッション情報は KVS に TTL 付きで保持するが、これは解決済みコンテキストのキャッシュであり、
      認可の正本はトークンのクレームに置く。
  - name: "認可を ABAC / ReBAC のポリシーエンジンで実装する"
    reason_rejected: |
      本システムの認可要件は「司書 / 利用者」の 2 ロールと「本人か否か」の所有者判定に尽きる。
      ポリシー言語・ポリシー配布・評価基盤を導入する複雑さが、
      表現力の必要量に対して過大。パスプレフィックス RBAC + 所有者判定で充足する。
  - name: "冪等キーをサーバ側で自動生成する（クライアントに要求しない）"
    reason_rejected: |
      サーバ生成では、クライアントの再送とサーバの新規要求を区別できない。
      二重送信の抑止は「同じ操作意図であること」をクライアントが表明することで初めて成立するため、
      キーの生成責務はクライアントに置く必要がある。
  - name: "冪等キーに HTTP メソッドとパスを埋め込む（idempotency:POST:/api/v1/users:{key}）"
    reason_rejected: |
      UC 単位 Spec の元表記はこの形式だったが、パスの変更やバージョン移行のたびに
      キー空間が変わり、移行中に冪等が破れる。
      `operationId` は API のバージョンをまたいで安定した論理操作 ID として扱えるため、
      名前空間として適している。
  - name: "更新系を悲観ロック（SELECT ... FOR UPDATE を編集開始から保持）で保護する"
    reason_rejected: |
      司書が編集画面を開いてから保存するまでの時間はユーザー操作に依存し、
      その間 DB の行ロックを保持することになる。
      ロック保持時間が予測できず、放置された編集画面が他の司書の作業を止める。
      競合頻度も低いため、楽観ロック + 409 での再実行が適切。
  - name: "楽観ロックを updated_at + If-Match に全面統一する（books も version をやめる）"
    reason_rejected: |
      時刻ベースの比較は、同一時刻内の複数更新や時刻精度・時刻同期に依存して
      競合を取りこぼす可能性がある。単調増加するバージョン番号のほうが
      競合検出として厳密であるため、統一方向は `version` 列側とする。
