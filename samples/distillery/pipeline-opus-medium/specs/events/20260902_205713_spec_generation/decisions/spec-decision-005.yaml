artifact_id: "spec-decision-005"
title: "貸出期間区分の適用方式 — 利用者区分ごとの「既定 + 選択可能集合」で検証する"
status: "approved"
generated_at: "2026-09-02T18:05:00"
context: |
  RDRA の条件「返却期限設定条件」は「貸出日を起点として利用者区分に対応する貸出期間区分の日数を
  加算した日を返却期限として自動設定する」と定める。一方 RDRA バリエーション「貸出期間区分」は
  標準 / 短期 / 長期の 3 値を有効値として定義している。

  反証レビュー R-006 の修正で「利用者区分 → 貸出期間区分」を 1:1 対応（一般=標準 / 学生=長期 /
  団体=長期）としてバックエンド検証（不一致は 409 LOAN_PERIOD_TYPE_MISMATCH）にしたところ、
  R-015 で「バリエーション値『短期』がどの利用者区分にも対応せず到達不能になる」「フロントエンドは
  3 区分を自由に選択できるまま 409 を扱っていない」という矛盾が検出された。

  この項目は RDRA からの一意な導出ができない confidence: low の設計判断であり、
  dialogue_policy: auto_adopt に従って⭐推奨案を採用した。
decision: |
  利用者区分ごとに「既定の貸出期間区分」と「選択可能な貸出期間区分の集合」を定義し、
  バックエンド（domain 層）を検証の正本とする。

  | 利用者区分 | 既定 | 選択可能 |
  |-----------|------|---------|
  | 一般 | 標準 | 標準 / 短期 |
  | 学生 | 長期 | 長期 / 標準 / 短期 |
  | 団体 | 長期 | 長期 / 標準 / 短期 |

  - 要求の loan_period_type が選択可能集合に含まれないときは 409 LOAN_PERIOD_TYPE_MISMATCH で拒否する
    （一般利用者の「長期」だけが該当する）
  - loan_period_type は CreateLoanRequest の required を維持し、既定区分はフロントエンドの初期選択で提示する
  - 窓口貸出受付画面の ToggleGroup は既定区分を初期選択し、選択可能集合に含まれない区分を disabled にする。
    409 LOAN_PERIOD_TYPE_MISMATCH は ToggleGroup 直下のインラインエラーとして表示する

  採用理由: RDRA のバリエーション 3 値をすべて到達可能に保ちつつ、RDRA 条件「利用者区分に対応する
  貸出期間区分」のサーバ側検証（API 直叩きでも任意区分では貸し出せない）を維持できる唯一の案であるため。
consequences:
  positive:
    - "RDRA バリエーション「貸出期間区分」の 3 値がすべて到達可能になる（短期の死に値を解消）"
    - "検証の正本がバックエンドにあり、API を直接呼ばれても選択可能集合外の区分では貸し出せない"
    - "選択不可の区分を UI で disabled にするため、司書が 409 を踏む導線が原則発生しない"
  negative:
    - "対応表が「既定」と「選択可能集合」の 2 要素になり、FE / BE の双方で同じ表を保持する重複が生じる"
    - "一般利用者に長期を認めない根拠は運用ポリシーであり、RDRA には明示されていない（運用変更時は本 decision の更新が必要）"
alternatives_considered:
  - name: "1:1 対応を貫き、CreateLoanRequest から loan_period_type を落としてサーバ導出にする"
    reason_rejected: "司書が貸出期間を選ぶ運用余地が完全に失われ、バリエーション『短期』が仕様上到達不能のまま残るため"
  - name: "フロントエンドの初期選択だけで対応表を担保し、バックエンドは任意区分を受け付ける"
    reason_rejected: "API を直接呼べば任意区分で貸し出せてしまい、RDRA 条件『利用者区分に対応する貸出期間区分』の逸脱になるため（R-006 の指摘そのもの）"
  - name: "RDRA のバリエーション『貸出期間区分』から短期を削除する"
    reason_rejected: "RDRA 整合性ルールにより本スキルは RDRA モデルを変更できない。RDRA 側の見直しが必要なら docs/todo.md 経由で起票する方針としたため"
