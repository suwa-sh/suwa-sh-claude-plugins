tables:
  - name: "loans"
    rdra_info: "貸出"
    operations:
      - type: "INSERT"
        columns:
          - name: "loan_id"
            value: "採番した貸出ID"
          - name: "book_id"
            value: "要求の book_id"
          - name: "user_no"
            value: "要求の user_no"
          - name: "loan_date"
            value: "貸出登録日（本日）"
          - name: "loan_period_type"
            value: "要求の loan_period_type（標準/短期/長期）"
          - name: "due_date"
            value: "loan_date + 貸出期間区分の日数（返却期限設定条件）"
          - name: "loan_status"
            value: "貸出中"
          - name: "book_title"
            value: "貸出時点の books の当該値のスナップショット"
          - name: "book_author"
            value: "貸出時点の books の当該値のスナップショット"
          - name: "book_isbn"
            value: "貸出時点の books の当該値のスナップショット"
          - name: "book_genre"
            value: "貸出時点の books の当該値のスナップショット"
        where: ""
    indexes_needed:
      - columns: ["book_id", "loan_status"]
        reason: "同一書籍に有効な貸出（貸出中/延滞）が重複しないことの確認と、返却時の対象貸出特定に使う"
        access_pattern: "書籍IDと貸出状態で有効な貸出の存在確認"
      - columns: ["user_no", "loan_status"]
        reason: "利用者ごとの進行中貸出の有無確認（利用者状態の遷移判定・利用者削除可否条件）に使う"
        access_pattern: "利用者番号と貸出状態での絞り込み"
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = :book_id FOR UPDATE"
      - type: "UPDATE"
        columns:
          - name: "book_status"
            value: "貸出中"
          - name: "updated_at"
            value: "貸出登録イベントの発生時刻"
        where: "book_id = :book_id AND book_status IN ('在庫あり','予約待ち')"
    indexes_needed:
      - columns: ["book_id"]
        reason: "貸出対象書籍の取得と更新。主キーで充足する"
        access_pattern: "書籍IDによる 1 件取得・更新"
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_no = :user_no"
      - type: "UPDATE"
        columns:
          - name: "user_status"
            value: "取引進行中"
          - name: "updated_at"
            value: "貸出登録イベントの発生時刻"
        where: "user_no = :user_no AND user_status = '登録済み'"
    indexes_needed:
      - columns: ["user_no"]
        reason: "貸出先利用者の取得と更新。主キーで充足する"
        access_pattern: "利用者番号による 1 件取得・更新"
  - name: "reservations"
    rdra_info: "予約"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = :book_id AND reservation_status = '取置き中' ORDER BY priority ASC"
      # 予約状態遷移規則（_cross-cutting/datastore/rdb-schema.yaml の state_transition_rules
      # 「予約状態遷移規則」の 取置き中 → 貸出済み）に従う。同時更新列を分割しない。
      - type: "UPDATE"
        columns:
          - name: "reservation_status"
            value: "貸出済み"
          - name: "hold_expires_at"
            value: "NULL（取置きが成立して終了したため保持期限を残さない。reservation_status と同一 UPDATE 文で更新する）"
        where: "reservation_id = :reservation_id AND reservation_status = '取置き中'"
    indexes_needed:
      - columns: ["book_id", "reservation_status", "priority"]
        reason: "取置き中書籍貸出条件で対象書籍の取置き中予約を順位順に特定する"
        access_pattern: "書籍ID + 予約状態で絞り込み、予約順位の昇順で先頭 1 件を取得"

kvs:
  - key_pattern: "idem:api:createLoan:{idempotency_key}"
    purpose: "idem"
    description: "冪等キー検証（二重登録防止）"
    value_type: "処理済みの貸出ID"
    ttl: "24h"
    operations: ["GET", "SET"]

object_storage: []
