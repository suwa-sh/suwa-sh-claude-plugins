# _api-summary.yaml
uc: "在庫状況を区分別に集計する"
business: "蔵書分析業務"
buc: "在庫状況を把握するフロー"
endpoints:
  - method: "POST"
    path: "/api/v1/reports/inventory"
    summary: "在庫状況レポートの集計を要求し、統計レポートを集計中で作成する"
    request_schema: "CreateInventoryReportRequest"
    response_schema: "ReportAcceptedResponse"
    tags: ["reports"]
async_events:
  - name: "publishReportAggregationRequested"
    channel: "report.aggregation.requested"
    direction: "publish"
    message_schema: "InventoryReportAggregationRequested"
    summary: "在庫状況の集計を Worker ティアへ委譲する集計要求イベント"
schemas:
  - name: "CreateInventoryReportRequest"
    properties:
      - name: "report_type"
        type: "string"
        required: true
      - name: "period_type"
        type: "string"
        required: true
      - name: "period_start"
        type: "string"
        required: true
      - name: "period_end"
        type: "string"
        required: true
  - name: "ReportAcceptedResponse"
    properties:
      - name: "report_id"
        type: "string"
        required: true
      - name: "report_type"
        type: "string"
        required: true
      - name: "period_type"
        type: "string"
        required: true
      - name: "period_start"
        type: "string"
        required: true
      - name: "period_end"
        type: "string"
        required: true
      - name: "report_status"
        type: "string"
        required: true
      - name: "aggregated_at"
        type: "string"
        required: true
  - name: "InventoryReportAggregationRequested"
    properties:
      - name: "report_id"
        type: "string"
        required: true
      - name: "report_type"
        type: "string"
        required: true
      - name: "period_type"
        type: "string"
        required: true
      - name: "period_start"
        type: "string"
        required: true
      - name: "period_end"
        type: "string"
        required: true
      - name: "trace_id"
        type: "string"
        required: true
