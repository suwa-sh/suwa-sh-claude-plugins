schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "architecture"
artifact_id: "arch-decision-006"
title: "サブドメイン分類: 貸出管理を Core、通知を Generic、その他を Supporting"
status: "approved"
generated_at: "2026-06-25T07:51:57"
context: |
  図書館管理システムの戦略的 DDD 設計として、6 業務（蔵書管理/貸出管理/予約管理/利用者管理/閲覧/統計）と
  外部システム連携（メール送信）をサブドメインに分類し、投資配分の方針を決定する必要がある。
  Core/Supporting/Generic の判定は経営判断を含むため、自動推論結果はユーザー確認が必須となる。
decision: |
  貸出管理を Core サブドメインとし、最優先で深いモデリングと継続的リファクタリングに投資する。
  通知（メール送信）を Generic とし、外部 SaaS 採用を前提とする。
  その他（蔵書管理/予約管理/利用者管理/閲覧/統計）を Supporting とし、good enough な品質で安定運用する。
  貸出管理は図書館の本質的業務であり、貸出期限/貸出可否/延滞判定の各ビジネスルールが図書館固有の価値を提供する。
  Core を 1 つに集中することで投資効率を最大化する。
consequences:
  positive:
    - "Core への投資集中により貸出管理のドメインモデルを深く育てられる"
    - "Generic（通知）は外部サービス採用でコスト効率と運用負荷を最小化できる"
    - "Supporting は標準的な実装で十分なため初期コストを抑えられる"
  negative:
    - "閲覧（蔵書検索）が利用者接点として重要だが Supporting 扱いとしたため、UX 改善投資の優先度が下がる"
    - "Core サブドメインの判定は medium confidence のため、運用後の経営判断見直しが必要になる可能性がある"
alternatives_considered:
  - name: "蔵書管理も Core に含める"
    reason_rejected: "書籍登録/編集/削除は標準的な CRUD であり差別化要因とまでは言えない"
  - name: "閲覧（蔵書検索）を Core に昇格"
    reason_rejected: "利用者接点としての重要性は認めるが、競争優位の源泉とは判定できない。検索性能改善は CTP-016 レスポンスタイム方針でカバー"
