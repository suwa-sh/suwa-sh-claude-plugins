version: "1.0"
event_id: "20260924_064509_initial_build"
created_at: "2026-09-24T06:45:09"
source: "docs/input/初期要望.txt"
system_name: "図書館蔵書管理システム"

requirements:
  - id: "REQ-001"
    requirement: "図書館の蔵書と利用者の情報を一元管理できるようにしたい"
    reason: "蔵書と利用者の情報が紙台帳と表計算ファイルに分散しており、管理の手間とミスが発生しているため"
    priority: "must"
    specifications:
      - id: "SPEC-001-01"
        specification: "司書が書籍情報（タイトル、著者、ISBN、出版社、ジャンル等）を登録・編集・削除できる"
        acceptance_criteria:
          - "Given 司書が書籍登録画面を開いている When タイトル・著者・ISBN・出版社・ジャンルを入力して登録する Then 書籍が蔵書として登録され検索結果に表示される"
          - "Given 登録済みの書籍がある When 司書が書籍情報を編集して保存する Then 変更後の書籍情報が表示される"
          - "Given 貸出中でない登録済みの書籍がある When 司書が書籍を削除する Then その書籍は検索結果に表示されなくなる"
        affected_models:
          - type: "actor"
            action: "add"
            target: "司書"
          - type: "information"
            action: "add"
            target: "書籍"
          - type: "buc"
            action: "add"
            target: "蔵書を管理する"
      - id: "SPEC-001-02"
        specification: "司書が利用者情報（氏名、連絡先、利用者番号等）を登録・編集・削除できる"
        acceptance_criteria:
          - "Given 司書が利用者登録画面を開いている When 氏名と連絡先を入力して登録する Then 利用者番号が付与された利用者が登録される"
          - "Given 登録済みの利用者がいる When 司書が連絡先を編集して保存する Then 変更後の利用者情報が表示される"
          - "Given 貸出中の書籍を持たない利用者がいる When 司書が利用者を削除する Then その利用者は利用者一覧に表示されなくなる"
        affected_models:
          - type: "actor"
            action: "add"
            target: "司書"
          - type: "actor"
            action: "add"
            target: "利用者"
          - type: "information"
            action: "add"
            target: "利用者"
          - type: "buc"
            action: "add"
            target: "利用者を管理する"
      - id: "SPEC-001-03"
        specification: "書籍をキーワード、タイトル、著者、ISBN、ジャンルで検索できる"
        acceptance_criteria:
          - "Given 蔵書が登録されている When キーワードで検索する Then タイトルまたは著者などにキーワードを含む書籍が一覧表示される"
          - "Given 蔵書が登録されている When タイトル・著者・ISBN・ジャンルのいずれかを条件に検索する Then 条件に一致する書籍だけが一覧表示される"
        affected_models:
          - type: "information"
            action: "add"
            target: "書籍"
          - type: "buc"
            action: "add"
            target: "書籍を検索する"

  - id: "REQ-002"
    requirement: "書籍の貸出・返却・予約を Web 画面から行えるようにしたい"
    reason: "貸出・返却・予約の管理を司書が手作業で行っており、手間とミスを減らして利用者サービスを向上させたいため"
    priority: "must"
    specifications:
      - id: "SPEC-002-01"
        specification: "司書が Web 画面から利用者への書籍の貸出を登録できる"
        acceptance_criteria:
          - "Given 在庫ありの書籍と登録済みの利用者がいる When 司書が利用者番号と書籍を指定して貸出を登録する Then 貸出が記録され書籍の状態が貸出中になる"
          - "Given 貸出中の書籍がある When 司書が同じ書籍の貸出を登録しようとする Then 貸出できない旨が表示され貸出は記録されない"
        affected_models:
          - type: "information"
            action: "add"
            target: "貸出"
          - type: "state"
            action: "add"
            target: "書籍状態"
          - type: "condition"
            action: "add"
            target: "貸出可否条件"
          - type: "buc"
            action: "add"
            target: "書籍を貸し出す"
      - id: "SPEC-002-02"
        specification: "司書が Web 画面から書籍の返却を登録できる"
        acceptance_criteria:
          - "Given 貸出中の書籍がある When 司書が返却を登録する Then 貸出に返却日が記録され書籍の状態が在庫ありになる"
          - "Given 予約がある貸出中の書籍がある When 司書が返却を登録する Then 書籍の状態が予約待ち（取置）になる"
        affected_models:
          - type: "information"
            action: "modify"
            target: "貸出"
          - type: "state"
            action: "modify"
            target: "書籍状態"
          - type: "buc"
            action: "add"
            target: "書籍の返却を受け付ける"
      - id: "SPEC-002-03"
        specification: "利用者が Web 画面から貸出中の書籍を予約できる"
        acceptance_criteria:
          - "Given 利用者がログインしており書籍が貸出中である When 利用者がその書籍を予約する Then 予約が予約順付きで登録され状態が予約中になる"
          - "Given 書籍が在庫ありである When 利用者がその書籍を予約しようとする Then 予約できない旨が表示される"
        affected_models:
          - type: "information"
            action: "add"
            target: "予約"
          - type: "state"
            action: "add"
            target: "予約状態"
          - type: "condition"
            action: "add"
            target: "予約可否条件"
          - type: "buc"
            action: "add"
            target: "書籍を予約する"
      - id: "SPEC-002-04"
        specification: "予約のある書籍が返却されたら、予約順 1 位の利用者に通知する"
        acceptance_criteria:
          - "Given 書籍に複数の予約がある When その書籍が返却される Then 予約順 1 位の利用者にだけ取置の通知が送信される"
        affected_models:
          - type: "information"
            action: "add"
            target: "通知"
          - type: "external_system"
            action: "add"
            target: "メール配信サービス"
          - type: "state"
            action: "modify"
            target: "予約状態"
          - type: "buc"
            action: "add"
            target: "書籍の返却を受け付ける"

  - id: "REQ-003"
    requirement: "貸出期限の管理や延滞者への通知を自動化したい"
    reason: "期限管理と延滞者への連絡を司書が手作業で行っており、手間と連絡漏れを減らしたいため"
    priority: "must"
    specifications:
      - id: "SPEC-003-01"
        specification: "貸出時に返却期限を自動設定する"
        acceptance_criteria:
          - "Given 司書が貸出を登録する When 貸出が記録される Then 貸出日と貸出期間から算出した返却期限が自動で設定される"
        affected_models:
          - type: "information"
            action: "modify"
            target: "貸出"
          - type: "variation"
            action: "add"
            target: "貸出期間"
          - type: "condition"
            action: "add"
            target: "返却期限算出"
      - id: "SPEC-003-02"
        specification: "返却期限が近づいた貸出の利用者にリマインドメールを自動送信する"
        acceptance_criteria:
          - "Given 返却期限まで所定日数の未返却の貸出がある When 日次の期限チェックが実行される Then 利用者にリマインドメールが自動送信される"
        affected_models:
          - type: "information"
            action: "add"
            target: "通知"
          - type: "external_system"
            action: "add"
            target: "メール配信サービス"
          - type: "condition"
            action: "add"
            target: "リマインド送信条件"
          - type: "buc"
            action: "add"
            target: "返却期限を通知する"
      - id: "SPEC-003-03"
        specification: "返却期限を超過した貸出の利用者に督促メールを自動送信する"
        acceptance_criteria:
          - "Given 返却期限を超過した未返却の貸出がある When 日次の期限チェックが実行される Then 貸出が延滞となり利用者に督促メールが自動送信される"
        affected_models:
          - type: "information"
            action: "add"
            target: "通知"
          - type: "state"
            action: "add"
            target: "貸出状態"
          - type: "condition"
            action: "add"
            target: "延滞判定条件"
          - type: "buc"
            action: "add"
            target: "延滞を督促する"

  - id: "REQ-004"
    requirement: "利用者が自分の貸出履歴や予約状況を Web 画面で確認できるようにしたい"
    reason: "利用者が司書に問い合わせずに自分の利用状況を把握できるようにし、利用者サービスを向上させるため"
    priority: "should"
    specifications:
      - id: "SPEC-004-01"
        specification: "利用者が自分の過去と現在の貸出履歴を Web 画面で確認できる"
        acceptance_criteria:
          - "Given 利用者に返却済みと貸出中の貸出がある When 利用者が貸出履歴画面を開く Then 過去の貸出と現在の貸出が返却期限付きで一覧表示される"
          - "Given 利用者がログインしている When 貸出履歴画面を開く Then 他の利用者の貸出は表示されない"
        affected_models:
          - type: "information"
            action: "modify"
            target: "貸出"
          - type: "buc"
            action: "add"
            target: "自分の利用状況を確認する"
      - id: "SPEC-004-02"
        specification: "利用者が自分の予約状況を Web 画面で確認できる"
        acceptance_criteria:
          - "Given 利用者に予約がある When 利用者が予約状況画面を開く Then 予約中の書籍と予約順と予約の状態が一覧表示される"
        affected_models:
          - type: "information"
            action: "modify"
            target: "予約"
          - type: "buc"
            action: "add"
            target: "自分の利用状況を確認する"

  - id: "REQ-005"
    requirement: "司書が在庫状況や人気書籍、貸出統計をレポートとして把握できるようにしたい"
    reason: "蔵書の利用状況を把握し、図書館運営と利用者サービスの改善に役立てるため"
    priority: "should"
    specifications:
      - id: "SPEC-005-01"
        specification: "司書が書籍ごとの在庫状況（貸出中・在庫あり・予約待ち）を確認できる"
        acceptance_criteria:
          - "Given 貸出中・在庫あり・予約待ちの書籍がある When 司書が在庫状況レポートを開く Then 状態ごとの書籍と件数が表示される"
        affected_models:
          - type: "state"
            action: "modify"
            target: "書籍状態"
          - type: "buc"
            action: "add"
            target: "蔵書の利用状況を分析する"
      - id: "SPEC-005-02"
        specification: "司書が人気書籍のランキングを確認できる"
        acceptance_criteria:
          - "Given 期間内の貸出記録がある When 司書が人気書籍ランキングを表示する Then 貸出回数の多い順に書籍が並んで表示される"
        affected_models:
          - type: "information"
            action: "add"
            target: "貸出統計"
          - type: "buc"
            action: "add"
            target: "蔵書の利用状況を分析する"
      - id: "SPEC-005-03"
        specification: "司書が期間を指定して貸出統計を確認できる"
        acceptance_criteria:
          - "Given 貸出記録がある When 司書が開始日と終了日を指定して貸出統計を表示する Then 指定期間内の貸出件数が集計されて表示される"
        affected_models:
          - type: "information"
            action: "add"
            target: "貸出統計"
          - type: "variation"
            action: "add"
            target: "集計期間"
          - type: "buc"
            action: "add"
            target: "蔵書の利用状況を分析する"

  - id: "REQ-006"
    requirement: "将来的に電子書籍にも対応できるようにしておきたい"
    reason: "将来の電子書籍の導入時に、蔵書管理の仕組みを作り直さずに拡張できるようにするため"
    priority: "could"
    specifications:
      - id: "SPEC-006-01"
        specification: "書籍情報に媒体種別（紙・電子）を持たせ、紙書籍以外の媒体を追加できるようにする"
        acceptance_criteria:
          - "Given 司書が書籍を登録する When 媒体種別に紙を指定する Then 媒体種別付きで書籍が登録される"
          - "Given 媒体種別に電子が定義されている When 書籍を検索する Then 媒体種別が検索結果に表示される"
        affected_models:
          - type: "information"
            action: "modify"
            target: "書籍"
          - type: "variation"
            action: "add"
            target: "媒体種別"
