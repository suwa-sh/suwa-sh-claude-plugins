version: "1.0"
event_id: "20260925_092303_initial_build"
created_at: "2026-09-25T09:23:03"
source: "docs/input/初期要望.txt"
system_name: "図書館蔵書管理システム"

requirements:
  - id: "REQ-001"
    requirement: "図書館の蔵書(書籍情報)を一元管理できるようにしたい"
    reason: "蔵書情報が紙台帳と表計算ファイルに分散しており、司書の管理の手間とミスが発生しているため"
    priority: "must"
    specifications:
      - id: "SPEC-001-01"
        specification: "司書は書籍情報(タイトル、著者、ISBN、出版社、ジャンル等)を登録できる"
        acceptance_criteria:
          - "Given 司書がログイン済み When タイトル・著者・ISBN・出版社・ジャンルを入力して書籍を登録する Then 書籍が蔵書として登録され一覧に表示される"
          - "Given 同じ ISBN の書籍が既に登録済み When 同じ ISBN で新しい書籍を登録する Then 蔵書は別の所蔵資料として追加され既存の書籍情報と紐づく"
          - "Given 司書がログイン済み When 必須項目のタイトルを空にして登録する Then 登録されず入力エラーが表示される"
        affected_models:
          - type: "actor"
            action: "add"
            target: "司書"
          - type: "information"
            action: "add"
            target: "書籍"
          - type: "buc"
            action: "add"
            target: "蔵書を管理する"
      - id: "SPEC-001-02"
        specification: "司書は登録済みの書籍情報を編集できる"
        acceptance_criteria:
          - "Given 書籍が登録済み When 司書が出版社とジャンルを変更して保存する Then 書籍情報が更新され検索結果にも反映される"
        affected_models:
          - type: "information"
            action: "modify"
            target: "書籍"
          - type: "buc"
            action: "add"
            target: "蔵書を管理する"
      - id: "SPEC-001-03"
        specification: "司書は書籍を削除できる。貸出中または予約がある書籍は削除できない"
        acceptance_criteria:
          - "Given 貸出中でも予約中でもない書籍がある When 司書が書籍を削除する Then 書籍は蔵書から除かれ検索結果に表示されない"
          - "Given 貸出中の書籍がある When 司書が書籍を削除する Then 削除できない旨のエラーが表示される"
        affected_models:
          - type: "information"
            action: "modify"
            target: "書籍"
          - type: "condition"
            action: "add"
            target: "書籍削除可否"
          - type: "state"
            action: "add"
            target: "書籍の状態"

  - id: "REQ-002"
    requirement: "図書館の利用者情報を一元管理できるようにしたい"
    reason: "利用者情報が紙台帳と表計算ファイルに分散しており、貸出や連絡の際に照合の手間とミスが発生しているため"
    priority: "must"
    specifications:
      - id: "SPEC-002-01"
        specification: "司書は利用者情報(氏名、連絡先、利用者番号等)を登録できる。利用者番号はシステムが一意に採番する"
        acceptance_criteria:
          - "Given 司書がログイン済み When 氏名・連絡先(メールアドレス)を入力して利用者を登録する Then 一意の利用者番号が採番され利用者が登録される"
          - "Given 司書がログイン済み When メールアドレスの形式が不正なまま利用者を登録する Then 登録されず入力エラーが表示される"
        affected_models:
          - type: "actor"
            action: "add"
            target: "利用者"
          - type: "information"
            action: "add"
            target: "利用者"
          - type: "buc"
            action: "add"
            target: "利用者を管理する"
      - id: "SPEC-002-02"
        specification: "司書は利用者情報を編集できる"
        acceptance_criteria:
          - "Given 利用者が登録済み When 司書が連絡先を変更して保存する Then 利用者情報が更新され以後の通知は新しい連絡先に送られる"
        affected_models:
          - type: "information"
            action: "modify"
            target: "利用者"
      - id: "SPEC-002-03"
        specification: "司書は利用者を削除できる。貸出中の書籍がある利用者は削除できない"
        acceptance_criteria:
          - "Given 貸出中の書籍が無い利用者がいる When 司書が利用者を削除する Then 利用者は削除され貸出の対象にできなくなる"
          - "Given 貸出中の書籍がある利用者がいる When 司書が利用者を削除する Then 削除できない旨のエラーが表示される"
        affected_models:
          - type: "information"
            action: "modify"
            target: "利用者"
          - type: "condition"
            action: "add"
            target: "利用者削除可否"

  - id: "REQ-003"
    requirement: "書籍を様々な条件で検索できるようにしたい"
    reason: "利用者と司書が目的の書籍と所在(在庫状況)を素早く見つけられるようにするため"
    priority: "must"
    specifications:
      - id: "SPEC-003-01"
        specification: "書籍をキーワード、タイトル、著者、ISBN、ジャンルで検索でき、結果に在庫状況を表示する"
        acceptance_criteria:
          - "Given タイトルに 図書館 を含む書籍が登録済み When キーワード 図書館 で検索する Then その書籍が検索結果に表示される"
          - "Given 書籍が登録済み When ISBN を指定して検索する Then ISBN が一致する書籍だけが表示される"
          - "Given 複数ジャンルの書籍が登録済み When ジャンルを指定して検索する Then 指定ジャンルの書籍だけが在庫状況付きで表示される"
          - "Given 条件に一致する書籍が無い When 検索する Then 該当なしのメッセージが表示される"
        affected_models:
          - type: "information"
            action: "modify"
            target: "書籍"
          - type: "variation"
            action: "add"
            target: "検索条件種別"
          - type: "buc"
            action: "add"
            target: "書籍を探す"

  - id: "REQ-004"
    requirement: "書籍の貸出・返却を Web 画面から行えるようにしたい"
    reason: "司書が手作業で行っている貸出・返却管理の手間とミスを減らすため"
    priority: "must"
    specifications:
      - id: "SPEC-004-01"
        specification: "司書は利用者と書籍を指定して貸出を登録できる。貸出可能な書籍(在庫あり、またはその利用者向けに取り置き中)だけが貸出できる"
        acceptance_criteria:
          - "Given 在庫ありの書籍と登録済みの利用者がいる When 司書が貸出を登録する Then 貸出が記録され書籍の状態が貸出中になる"
          - "Given 貸出中の書籍がある When 司書がその書籍の貸出を登録する Then 貸出できない旨のエラーが表示される"
          - "Given 利用者 A 向けに取り置き中の書籍がある When 司書が利用者 B への貸出を登録する Then 貸出できない旨のエラーが表示される"
        affected_models:
          - type: "information"
            action: "add"
            target: "貸出"
          - type: "state"
            action: "add"
            target: "書籍の状態"
          - type: "condition"
            action: "add"
            target: "貸出可否"
          - type: "buc"
            action: "add"
            target: "書籍を貸し出す"
      - id: "SPEC-004-02"
        specification: "司書は貸出中の書籍の返却を登録できる。予約が無ければ書籍は在庫ありに戻り、予約があれば予約順 1 位の利用者向けの取り置きになる"
        acceptance_criteria:
          - "Given 予約の無い貸出中の書籍がある When 司書が返却を登録する Then 貸出に返却日が記録され書籍の状態が在庫ありになる"
          - "Given 予約のある貸出中の書籍がある When 司書が返却を登録する Then 書籍の状態が取り置き中になり予約順 1 位の予約が取り置き中になる"
        affected_models:
          - type: "information"
            action: "modify"
            target: "貸出"
          - type: "state"
            action: "modify"
            target: "書籍の状態"
          - type: "buc"
            action: "add"
            target: "書籍の返却を受け付ける"

  - id: "REQ-005"
    requirement: "貸出中の書籍を予約でき、返却時に予約者へ知らせたい"
    reason: "貸出中の書籍を借りたい利用者の待ち順を公平に管理し、司書の連絡作業をなくすため"
    priority: "must"
    specifications:
      - id: "SPEC-005-01"
        specification: "利用者は Web 画面から貸出中の書籍を予約できる。予約は受付順に予約順位が付く"
        acceptance_criteria:
          - "Given 貸出中の書籍がある When 利用者が予約する Then 予約が受け付けられ予約順位が表示される"
          - "Given 在庫ありの書籍がある When 利用者が予約しようとする Then 予約できない旨が表示される"
          - "Given 利用者が既にその書籍を予約済み When 同じ書籍を再度予約する Then 重複予約できない旨が表示される"
        affected_models:
          - type: "actor"
            action: "add"
            target: "利用者"
          - type: "information"
            action: "add"
            target: "予約"
          - type: "state"
            action: "add"
            target: "予約の状態"
          - type: "condition"
            action: "add"
            target: "予約可否"
          - type: "buc"
            action: "add"
            target: "書籍を予約する"
      - id: "SPEC-005-02"
        specification: "利用者は待機中の自分の予約を取り消せる。取り消すと後続の予約順位が繰り上がる"
        acceptance_criteria:
          - "Given 利用者の待機中の予約がある When 利用者が予約を取り消す Then 予約は取消済みになり後続の予約順位が 1 つ繰り上がる"
        affected_models:
          - type: "information"
            action: "modify"
            target: "予約"
          - type: "state"
            action: "modify"
            target: "予約の状態"
      - id: "SPEC-005-03"
        specification: "書籍が返却されたら、予約順 1 位の利用者に取り置き(受取可能)をメールで自動通知する"
        acceptance_criteria:
          - "Given 予約のある書籍が返却された When 返却が登録される Then 予約順 1 位の利用者に受取可能のメールが送信される"
          - "Given 予約の無い書籍が返却された When 返却が登録される Then 予約通知メールは送信されない"
        affected_models:
          - type: "external_system"
            action: "add"
            target: "メール配信サービス"
          - type: "information"
            action: "add"
            target: "通知"
          - type: "buc"
            action: "add"
            target: "予約者に通知する"

  - id: "REQ-006"
    requirement: "貸出期限の管理と延滞者への通知を自動化したい"
    reason: "司書が手作業で行っている期限管理と督促連絡の手間と漏れをなくすため"
    priority: "must"
    specifications:
      - id: "SPEC-006-01"
        specification: "貸出登録時に、貸出日に貸出期間を加えた返却期限を自動設定する"
        acceptance_criteria:
          - "Given 貸出期間が 14 日に設定されている When 9 月 1 日に貸出を登録する Then 返却期限が 9 月 15 日に設定される"
        affected_models:
          - type: "information"
            action: "modify"
            target: "貸出"
          - type: "business_policy"
            action: "add"
            target: "返却期限算出"
      - id: "SPEC-006-02"
        specification: "返却期限が近づいた(期限の所定日数前になった)未返却の貸出について、利用者にリマインドメールを自動送信する"
        acceptance_criteria:
          - "Given リマインド日数が 2 日で返却期限が 9 月 15 日の未返却の貸出がある When 9 月 13 日の定時処理が動く Then 利用者にリマインドメールが送信される"
          - "Given 返却済みの貸出がある When リマインドの定時処理が動く Then その貸出にはリマインドメールが送信されない"
        affected_models:
          - type: "external_system"
            action: "add"
            target: "メール配信サービス"
          - type: "information"
            action: "add"
            target: "通知"
          - type: "buc"
            action: "add"
            target: "返却期限を通知する"
      - id: "SPEC-006-03"
        specification: "返却期限を超過した未返却の貸出を延滞として扱い、利用者に督促メールを自動送信する"
        acceptance_criteria:
          - "Given 返却期限が 9 月 15 日の未返却の貸出がある When 9 月 16 日の定時処理が動く Then 貸出が延滞になり利用者に督促メールが送信される"
          - "Given 督促済みの延滞中の貸出がある When 同じ日に定時処理が再度動く Then 同じ日に督促メールは重複送信されない"
        affected_models:
          - type: "external_system"
            action: "add"
            target: "メール配信サービス"
          - type: "information"
            action: "add"
            target: "通知"
          - type: "state"
            action: "add"
            target: "貸出の状態"
          - type: "buc"
            action: "add"
            target: "延滞を督促する"

  - id: "REQ-007"
    requirement: "利用者が自分の貸出履歴と予約状況を Web 画面で確認できるようにしたい"
    reason: "利用者が司書に問い合わせずに自分の状況を把握できるようにし、利用者サービスを向上させるため"
    priority: "should"
    specifications:
      - id: "SPEC-007-01"
        specification: "利用者は自分の現在の貸出(返却期限・延滞有無)と過去の貸出履歴を Web 画面で確認できる"
        acceptance_criteria:
          - "Given 利用者に貸出中の書籍と返却済みの書籍がある When 利用者が貸出状況画面を開く Then 現在の貸出が返却期限付きで、過去の貸出が返却日付きで表示される"
          - "Given 他の利用者の貸出がある When 利用者が貸出状況画面を開く Then 他の利用者の貸出は表示されない"
        affected_models:
          - type: "actor"
            action: "add"
            target: "利用者"
          - type: "information"
            action: "modify"
            target: "貸出"
          - type: "buc"
            action: "add"
            target: "自分の利用状況を確認する"
      - id: "SPEC-007-02"
        specification: "利用者は自分の予約状況(予約順位・取り置き中かどうか)を Web 画面で確認できる"
        acceptance_criteria:
          - "Given 利用者に待機中と取り置き中の予約がある When 利用者が予約状況画面を開く Then 待機中の予約は予約順位付きで、取り置き中の予約は受取可能として表示される"
        affected_models:
          - type: "information"
            action: "modify"
            target: "予約"
          - type: "buc"
            action: "add"
            target: "自分の利用状況を確認する"

  - id: "REQ-008"
    requirement: "司書が蔵書の在庫状況と利用傾向をレポートで把握できるようにしたい"
    reason: "蔵書の運用状況や人気の傾向を把握し、選書や運営の判断に活かすため"
    priority: "should"
    specifications:
      - id: "SPEC-008-01"
        specification: "司書は書籍ごとの在庫状況(貸出中・在庫あり・予約待ち)を一覧で確認できる"
        acceptance_criteria:
          - "Given 貸出中・在庫あり・予約待ちの書籍がある When 司書が在庫状況レポートを開く Then 各書籍が在庫状況別に集計・表示される"
        affected_models:
          - type: "information"
            action: "add"
            target: "在庫状況"
          - type: "buc"
            action: "add"
            target: "蔵書の利用状況を分析する"
      - id: "SPEC-008-02"
        specification: "司書は指定期間の貸出回数に基づく人気書籍ランキングを確認できる"
        acceptance_criteria:
          - "Given 指定期間に貸出回数の異なる書籍がある When 司書が期間を指定してランキングを開く Then 書籍が貸出回数の多い順に表示される"
        affected_models:
          - type: "information"
            action: "add"
            target: "貸出統計"
          - type: "buc"
            action: "add"
            target: "蔵書の利用状況を分析する"
      - id: "SPEC-008-03"
        specification: "司書は期間別(日・月・年)の貸出統計を確認できる"
        acceptance_criteria:
          - "Given 複数月にわたる貸出記録がある When 司書が月単位で期間を指定して貸出統計を開く Then 月ごとの貸出件数が表示される"
        affected_models:
          - type: "information"
            action: "add"
            target: "貸出統計"
          - type: "variation"
            action: "add"
            target: "集計期間単位"
          - type: "buc"
            action: "add"
            target: "蔵書の利用状況を分析する"

  - id: "REQ-009"
    requirement: "将来的に電子書籍にも対応できるようにしておきたい"
    reason: "電子書籍の普及に備え、将来の拡張時に大きな作り直しを避けるため"
    priority: "could"
    specifications:
      - id: "SPEC-009-01"
        specification: "書籍情報に媒体種別(紙・電子)を持たせる。当面の運用は紙の書籍のみとし、電子書籍の貸出方法は将来決める"
        acceptance_criteria:
          - "Given 司書がログイン済み When 書籍を登録する Then 媒体種別が記録され、未指定の場合は紙として登録される"
        affected_models:
          - type: "information"
            action: "modify"
            target: "書籍"
          - type: "variation"
            action: "add"
            target: "媒体種別"

  - id: "REQ-010"
    requirement: "利用者と司書が自分の役割に応じた機能だけを使えるようにしたい"
    reason: "利用者は図書館の利用者と司書の 2 種類であり、蔵書・利用者の管理は司書だけが行う必要があるため"
    priority: "must"
    specifications:
      - id: "SPEC-010-01"
        specification: "利用者と司書は Web 画面にログインして利用する。管理機能(蔵書・利用者管理、貸出・返却登録、レポート)は司書だけが使える"
        acceptance_criteria:
          - "Given 利用者がログイン済み When 書籍登録画面を開こうとする Then アクセスが拒否される"
          - "Given 司書がログイン済み When 書籍登録画面を開く Then 書籍登録画面が表示される"
        affected_models:
          - type: "actor"
            action: "add"
            target: "利用者"
          - type: "actor"
            action: "add"
            target: "司書"
          - type: "condition"
            action: "add"
            target: "操作権限"
