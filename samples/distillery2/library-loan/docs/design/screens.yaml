# 画面 ↔ Story ↔ UC ↔ コンポーネントの対応 (Story = 画面構造の正)。
# story / components / tokens.file は docs/design/storybook-app/src からの相対。
# RDRA のメール 3 種 (返却のお知らせ・返却期限のお知らせ・延滞返却のお願い) は Web 画面ではないため載せない。
screens:
  # ---- 利用者ポータル (data-portal=user) ----
  - name: BookSearch
    route: /books
    uc_slugs: [search-books]
    story: stories/BookSearch.stories.tsx
    variants: [Default, Empty, Loading, Error]
    components: [AppShell, PageHeader, BookSearchFilter, BookCard, BookStatusBadge, MediaTypeBadge, Pagination, EmptyState, Spinner, Alert]
  - name: BookDetail
    route: /books/:bookId
    uc_slugs: [view-book-detail]
    story: stories/BookDetail.stories.tsx
    variants: [Default, OnLoan, Loading, Error]
    components: [AppShell, PageHeader, BookDetailPanel, BookStatusBadge, MediaTypeBadge, Button, Alert, Spinner]
  - name: ReservationApply
    route: /books/:bookId/reserve
    uc_slugs: [reserve-book]
    story: stories/ReservationApply.stories.tsx
    variants: [Default, Completed, NotReservable, Error]
    components: [AppShell, PageHeader, Card, BookStatusBadge, Button, Alert]
  - name: MyLoanHistory
    route: /my/loans
    uc_slugs: [view-my-loan-history]
    story: stories/MyLoanHistory.stories.tsx
    variants: [Default, Past, Empty, Loading, Error]
    components: [AppShell, PageHeader, Card, Tabs, LoanTable, DueDateDisplay, LoanStatusBadge, EmptyState, Spinner, Alert]
  - name: MyReservations
    route: /my/reservations
    uc_slugs: [view-my-reservations]
    story: stories/MyReservations.stories.tsx
    variants: [Default, Empty, Loading, Error]
    components: [AppShell, PageHeader, Card, ReservationStatusBadge, ReservationTracker, Button, EmptyState, Spinner, Alert]
  - name: ReservationCancel
    route: /my/reservations/:reservationId/cancel
    uc_slugs: [cancel-reservation]
    story: stories/ReservationCancel.stories.tsx
    variants: [Default, Completed, Error]
    components: [AppShell, PageHeader, ConfirmPanel, ReservationTracker, Alert]

