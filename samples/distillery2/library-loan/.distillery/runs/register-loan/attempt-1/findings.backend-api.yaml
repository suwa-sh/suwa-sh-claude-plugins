      どこにも無い。issue 20260924_120001_loan-limit-count.md が open。値が存在しないため実装も検証も
      不能で、機械的に「spec_absent」に該当する。severity は category (input_validation) がルール上
      security/persistence でないため minor だが、貸出可否条件の一部が未実装のまま恒久化しないよう
      人レビューでの優先確認を推奨する。
