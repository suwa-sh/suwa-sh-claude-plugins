    evidence: "docs/rules/tier-frontend.md:8 (API 呼び出しは packages/contracts の生成クライアント経由。fetch / axios の直書き禁止), docs/rules/tier-frontend.md:6 (入力は自ティアが consumer の契約の生成物); packages/contracts/api/ には stubs/createLoan.*.json しかなく TypeScript 型・クライアントの生成物が無い (packages/contracts に package.json も無く workspace パッケージとして import不可); apps/frontend-staff/src/api-client/loan-api-types.ts:1-8, loan-api.ts:1-8 のコメントで契約生成物が無いための暫定writeと明記。.distillery/runs/register-loan/issues/20260924_130000_frontend-api-client-missing.md (kind: contract) に事実・暫定対応・確認事項を起票済み。実体としては fetch/axios を直接呼んではおらず (ApiTransport 注入に隔離)、packages/contracts/ の生成物自体も書き換えていない (common.md #1 は非違反)ため、ルール全体を無視した実装ではなく、生成物が届くまでの一時代替であることが issue で追跡可能。ゲート (contract.frontend-staff) は passWithNoTests のため機械では検出できない。要求・契約の内容自体には違反しておらず (型・パス・コードは契約と一致、下記 F-002〜F-009 で個別確認)、機能は成立しているため『修正なしで先に進めない』状態ではなく、d2-contract 側でのフロント向け生成物追加の要否を人レビューで判断する必要がある。"
