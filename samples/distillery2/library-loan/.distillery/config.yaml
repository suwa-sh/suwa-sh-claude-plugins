schema_version: "2.0"
docs_root: docs
tiers:
  - id: frontend-patron
    dir: apps/frontend-patron
    kind: frontend
    lang: typescript
    provides: []
    consumes:
      - api
    commands:
      format_check: "npm run format:check -w apps/frontend-patron"
      lint: npm run lint -w apps/frontend-patron
      typecheck: npm run typecheck -w apps/frontend-patron
      unit: "npm run test -w apps/frontend-patron -- --run --reporter=json --outputFile={report}"
      contract: "npm run test:contract -w apps/frontend-patron -- --run --reporter=json --outputFile={report}"
  - id: frontend-staff
    dir: apps/frontend-staff
    kind: frontend
    lang: typescript
    provides: []
    consumes:
      - api
    commands:
      format_check: "npm run format:check -w apps/frontend-staff"
      lint: npm run lint -w apps/frontend-staff
      typecheck: npm run typecheck -w apps/frontend-staff
      unit: "npm run test -w apps/frontend-staff -- --run --reporter=json --outputFile={report}"
      contract: "npm run test:contract -w apps/frontend-staff -- --run --reporter=json --outputFile={report}"
  - id: backend-api
    dir: apps/backend-api
    kind: backend
    lang: typescript
    provides:
      - api
    consumes:
      - db
      - mail
    commands:
      format_check: "npm run format:check -w apps/backend-api"
      lint: npm run lint -w apps/backend-api
      typecheck: npm run typecheck -w apps/backend-api
      unit: "npm run test -w apps/backend-api -- --run --reporter=json --outputFile={report}"
      contract: "npm run test:contract -w apps/backend-api -- --run --reporter=json --outputFile={report}"
  - id: worker
    dir: apps/worker
    kind: worker
    lang: typescript
    provides: []
    consumes:
      - db
      - mail
    commands:
      format_check: "npm run format:check -w apps/worker"
      lint: npm run lint -w apps/worker
      typecheck: npm run typecheck -w apps/worker
      unit: "npm run test -w apps/worker -- --run --reporter=json --outputFile={report}"
      contract: "npm run test:contract -w apps/worker -- --run --reporter=json --outputFile={report}"
datastore_owner: backend-api
contracts:
  - id: api
    type: openapi
    source: openapi/openapi.yaml
    provider: backend-api
    consumers:
      - frontend-patron
      - frontend-staff
  - id: db
    type: rdb-schema
    source: db/rdb-schema.yaml
    provider: backend-api
    consumers:
      - worker
commands:
  arch_test: npx depcruise --config .dependency-cruiser.cjs --output-type err apps packages
  uc_bdd: "npx cucumber-js --tags \"@uc:{slug}\" --format json:{report}"
  acceptance_api: "npx cucumber-js --tags \"@uc:{slug} and @acceptance and not @browser\" --format json:{report}"
  acceptance_browser: "npx cucumber-js --tags \"@uc:{slug} and @acceptance and @browser\" --format json:{report}"
capabilities:
  browser: false
  has_asyncapi: false
  has_kvs: false
  has_design_system: true
models:
  implementer: null
  verifier: claude-opus-5