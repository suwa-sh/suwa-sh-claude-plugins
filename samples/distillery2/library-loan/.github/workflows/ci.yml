name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run format:check -w apps/frontend-patron
      - run: npm run lint -w apps/frontend-patron
      - run: npm run typecheck -w apps/frontend-patron
      - run: npm run format:check -w apps/frontend-staff
      - run: npm run lint -w apps/frontend-staff
      - run: npm run typecheck -w apps/frontend-staff
      - run: npm run format:check -w apps/backend-api
      - run: npm run lint -w apps/backend-api
      - run: npm run typecheck -w apps/backend-api
      - run: npm run format:check -w apps/worker
      - run: npm run lint -w apps/worker
      - run: npm run typecheck -w apps/worker
      - run: npx depcruise --config .dependency-cruiser.cjs --output-type err apps packages
  unit:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test -w apps/frontend-patron -- --run
      - run: npm run test -w apps/frontend-staff -- --run
      - run: npm run test -w apps/backend-api -- --run
      - run: npm run test -w apps/worker -- --run
  contract:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:contract -w apps/frontend-patron -- --run
      - run: npm run test:contract -w apps/frontend-staff -- --run
      - run: npm run test:contract -w apps/backend-api -- --run
      - run: npm run test:contract -w apps/worker -- --run
  uc-bdd:
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx cucumber-js --tags "not @browser"
  acceptance:
    runs-on: ubuntu-latest
    needs: uc-bdd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx cucumber-js --tags "@acceptance and not @browser"
