# basis: requirements@d1987660054f32fca4d1af3a7f36b312eb6e6518 adr@481506aca70dae9b5b64cefa6ea032e220651c7d
# UC register-loan (貸出を登録する)。出典: SPEC-003-01 / SPEC-005-01、RDRA 条件 (貸出可否条件・返却期限算出条件)。
# シナリオ: features/貸出業務/register-loan.feature
post:
  tags:
    - loan
  operationId: registerLoan
  summary: "貸出を登録する"
  description: |
    司書が利用者番号と書籍IDを指定して貸出を登録する。librarian ロールだけが呼べる。
    貸出日はサーバーの当日の日付とし、返却期限は貸出日に貸出期間を加えた日を自動で設定する (返却期限算出条件)。
    貸出期間の日数は要求に値が無く、この契約では固定しない。example の dueDate は形を示すための値である。
    貸出可否条件:
    - 書籍状態が在庫あり (available) なら、登録済みの利用者に貸し出せる。
    - 書籍状態が予約待ち (awaiting_pickup) なら、予約順 1 位 (通知済) の利用者にだけ貸し出せる。このとき その予約を完了 (completed) にする。
    - 書籍状態が貸出中 (on_loan) の書籍は貸し出せない。
    - 登録されていない (論理削除済みを含む) 利用者には貸し出せない。
    貸し出せないときは 409 を返し、貸出を記録せず、書籍状態と予約状態を変えない。
    成功すると書籍状態を貸出中 (on_loan) にする。
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/RegisterLoanRequest"
        examples:
          success:
            summary: "在庫ありの書籍を登録済みの利用者に貸し出す"
            value:
              patronNumber: "P-00000001"
              bookId: "0b6f3c1e-2a4d-4e8f-9b1a-3c5d7e9f1a2b"
          successFromReservation:
            summary: "予約待ちの書籍を予約順 1 位 (通知済) の利用者に貸し出す"
            value:
              patronNumber: "P-00000001"
              bookId: "5d2e8a41-7c3b-4f60-8e1d-9a2b4c6d8e0f"
          badRequest:
            summary: "書籍IDが無い"
            value:
              patronNumber: "P-00000001"
          bookOnLoan:
            summary: "貸出中の書籍を貸し出そうとする"
            value:
              patronNumber: "P-00000001"
              bookId: "9e4a1c7b-3d5f-4a2e-8b6c-1f3e5a7c9b0d"
          notFirstInReservationQueue:
            summary: "予約待ちの書籍を予約順 1 位以外の利用者に貸し出そうとする"
            value:
              patronNumber: "P-00000001"
              bookId: "2c7f9b3e-6a1d-4c8e-9f2b-7d4a1e6c3b5f"
          patronNotRegistered:
            summary: "登録されていない利用者に貸し出そうとする"
            value:
              patronNumber: "P-99999999"
              bookId: "0b6f3c1e-2a4d-4e8f-9b1a-3c5d7e9f1a2b"
  responses:
    "201":
      description: "貸出を記録し、返却期限を設定し、書籍を貸出中にした"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/LoanRegistration"
          examples:
            success:
              summary: "在庫ありの書籍の貸出"
              value:
                loan:
                  loanId: "3f8a2d6c-1b4e-4a7f-9c2d-5e8b1a4d7c0e"
                  patronNumber: "P-00000001"
                  bookId: "0b6f3c1e-2a4d-4e8f-9b1a-3c5d7e9f1a2b"
                  reservationId: null
                  loanedOn: "2026-10-01"
                  dueDate: "2026-10-15"
                  returnedOn: null
                  status: on_loan
                bookStatus: on_loan
            successFromReservation:
              summary: "予約順 1 位の利用者への貸出。予約は完了になる"
              value:
                loan:
                  loanId: "6a1c4e8b-2d5f-4b9a-8e3c-7f1a3d5b9c2e"
                  patronNumber: "P-00000001"
                  bookId: "5d2e8a41-7c3b-4f60-8e1d-9a2b4c6d8e0f"
                  reservationId: "8b3d5f7a-4c2e-4d1b-9a6f-2e8c4a6b1d3f"
                  loanedOn: "2026-10-01"
                  dueDate: "2026-10-15"
                  returnedOn: null
                  status: on_loan
                bookStatus: on_loan
    "400":
      description: "入力が不正 (必須項目の欠落・形式違反)"
      content:
        application/problem+json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/Problem"
          examples:
            badRequest:
              value:
                type: "https://library.example/problems/validation-error"
                title: "入力内容に誤りがあります"
                status: 400
                code: validation_error
                errors:
                  - field: bookId
                    message: "書籍IDは必須です"
    "409":
      description: "貸出可否条件を満たさないため貸し出せない。貸出は記録されず、書籍状態と予約状態は変わらない"
      content:
        application/problem+json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/Problem"
          examples:
            bookOnLoan:
              value:
                type: "https://library.example/problems/book-on-loan"
                title: "この書籍は貸出中のため貸し出せません"
                status: 409
                code: book_on_loan
                detail: "書籍 9e4a1c7b-3d5f-4a2e-8b6c-1f3e5a7c9b0d は貸出中です"
            notFirstInReservationQueue:
              value:
                type: "https://library.example/problems/not-first-in-reservation-queue"
                title: "この書籍は予約順 1 位の利用者にだけ貸し出せます"
                status: 409
                code: not_first_in_reservation_queue
                detail: "書籍 2c7f9b3e-6a1d-4c8e-9f2b-7d4a1e6c3b5f は予約待ちで、利用者 P-00000001 は予約順 1 位ではありません"
            patronNotRegistered:
              value:
                type: "https://library.example/problems/patron-not-registered"
                title: "登録されていない利用者には貸し出せません"
                status: 409
                code: patron_not_registered
                detail: "利用者番号 P-99999999 の利用者は登録されていません"
