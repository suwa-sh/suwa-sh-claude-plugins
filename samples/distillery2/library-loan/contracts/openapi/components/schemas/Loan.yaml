type: object
description: "貸出 (どの利用者にどの蔵書をいつ貸し出したか)。貸出登録の応答で、蔵書の状態と受取済みにした予約も返す。"
required:
  - loan_id
  - patron_number
  - copy_id
  - book_title
  - loaned_on
  - due_on
  - returned_on
  - status
  - copy_status
  - fulfilled_reservation_id
properties:
  loan_id:
    $ref: "../../openapi.yaml#/components/schemas/Id"
  patron_number:
    $ref: "../../openapi.yaml#/components/schemas/PatronNumber"
  copy_id:
    $ref: "../../openapi.yaml#/components/schemas/Id"
  book_title:
    type: string
    description: 貸し出した蔵書の書籍タイトル
  loaned_on:
    type: string
    format: date
    description: 貸出日
  due_on:
    type: string
    format: date
    description: "返却期限 (貸出日 + 貸出日時点で有効な貸出ルールの貸出期間)"
  returned_on:
    type:
      - string
      - "null"
    format: date
    description: "返却日 (未返却は null)"
  status:
    $ref: "../../openapi.yaml#/components/schemas/LoanStatus"
  copy_status:
    $ref: "../../openapi.yaml#/components/schemas/CopyStatus"
  fulfilled_reservation_id:
    description: "本人向けの取り置きを貸し出して受取済みにした予約の ID (該当しなければ null)"
    oneOf:
      - $ref: "../../openapi.yaml#/components/schemas/Id"
      - type: "null"
