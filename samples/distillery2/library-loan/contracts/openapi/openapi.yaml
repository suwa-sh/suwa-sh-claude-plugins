# basis: requirements@4422a431dd381e737d643e7055432ad4b2330c9d adr@090e13b71116c495162f84a620b4d303817fac08
# 入口ファイル。UC ごとの path item は d2-contract mode=uc が paths/ に分割して足す。
openapi: 3.1.0
info:
  title: 図書館蔵書管理システム API
  version: 0.1.0
  description: "backend-api が提供し、frontend と worker が利用する HTTP API (ADR 0001 / 0005 / 0006)。"
  x-basis: "requirements@4422a431dd381e737d643e7055432ad4b2330c9d adr@090e13b71116c495162f84a620b4d303817fac08"
servers:
  - url: /api
    description: "backend-api (ベースパス /api)"
security:
  - bearerAuth: []
tags:
  - name: catalog
    description: 蔵書 (書籍・蔵書)
  - name: patron
    description: "利用者 (利用者・司書・ログイン)"
  - name: circulation
    description: "貸出予約 (貸出・返却・予約)"
  - name: notification
    description: "通知 (worker が起動するジョブ API)"
  - name: analytics
    description: "蔵書分析 (在庫状況・人気ランキング・貸出統計)"
paths:
  /loans:
    $ref: "paths/loans.yaml"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "OIDC の認証基盤が発行したアクセストークン。backend-api が検証し、主体 ID を利用者または司書に対応づける (ADR 0006)。"
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 1 始まりのページ番号
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: size
      in: query
      required: false
      description: 1 ページの件数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: "入力が不正 (必須項目の欠落・形式エラー)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            validation:
              value:
                type: "https://library.example/problems/validation-error"
                title: 入力内容に誤りがあります
                status: 400
                errors:
                  - field: title
                    code: required
                    message: タイトルは必須です
    Unauthorized:
      description: 認証されていない (トークンが無い・無効)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unauthenticated:
              value:
                type: "https://library.example/problems/unauthenticated"
                title: ログインが必要です
                status: 401
    Forbidden:
      description: "権限が無い (利用者区分・本人所有の判定で拒否)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            forbidden:
              value:
                type: "https://library.example/problems/forbidden"
                title: この操作を行う権限がありません
                status: 403
    NotFound:
      description: 対象が存在しない
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            notFound:
              value:
                type: "https://library.example/problems/not-found"
                title: 対象が見つかりません
                status: 404
    Conflict:
      description: "業務ルールにより操作できない (状態による可否・重複)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            conflict:
              value:
                type: "https://library.example/problems/business-rule-violation"
                title: 現在の状態ではこの操作を行えません
                status: 409
                code: business_rule_violation
  schemas:
    CreateLoanRequest:
      $ref: "components/schemas/CreateLoanRequest.yaml"
    Loan:
      $ref: "components/schemas/Loan.yaml"
    Problem:
      type: object
      description: "エラー応答 (RFC 9457 Problem Details)。全 UC が 4xx/5xx で返す。"
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: 問題種別の URI
        title:
          type: string
          description: 利用者に見せる短い説明
        status:
          type: integer
          description: HTTP ステータス
        detail:
          type: string
          description: 発生事例の詳細
        instance:
          type: string
          description: 発生事例の識別子
        code:
          type: string
          description: "業務エラーの識別子 (例: loan_not_allowed)"
        errors:
          type: array
          description: 入力項目ごとの検証エラー
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: 項目名
        code:
          type: string
          description: "検証エラーの識別子 (例: required, format, duplicate)"
        message:
          type: string
          description: 利用者に見せるメッセージ
    PageMeta:
      type: object
      description: 一覧応答のページ情報
      required:
        - page
        - size
        - total
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    Id:
      type: string
      format: uuid
      description: システムが採番する内部 ID
    Isbn:
      type: string
      pattern: "^(97[89])?[0-9]{9}[0-9X]$"
      description: "ISBN (ハイフンなし 10 桁または 13 桁)"
    PatronNumber:
      type: string
      description: システムが一意に採番する利用者番号
    UserRole:
      type: string
      enum:
        - patron
        - librarian
      description: "利用者区分 (patron=利用者, librarian=司書)"
    Genre:
      type: string
      enum:
        - literature
        - history
        - social_science
        - natural_science
        - technology
        - arts
        - children
        - other
      description: "ジャンル (文学・歴史・社会科学・自然科学・技術・芸術・児童書・その他)"
    MediaType:
      type: string
      enum:
        - paper
        - electronic
      description: "媒体種別 (paper=紙, electronic=電子)。未指定時は paper"
    SearchConditionType:
      type: string
      enum:
        - keyword
        - title
        - author
        - isbn
        - genre
      description: 検索条件種別
    CopyStatus:
      type: string
      enum:
        - available
        - on_loan
        - on_hold
        - withdrawn
      description: "書籍の状態 (在庫あり・貸出中・取り置き中・除籍済み)"
    LoanStatus:
      type: string
      enum:
        - on_loan
        - overdue
        - returned
      description: "貸出の状態 (貸出中・延滞中・返却済み)"
    ReservationStatus:
      type: string
      enum:
        - waiting
        - on_hold
        - fulfilled
        - cancelled
      description: "予約の状態 (待機中・取り置き中・受取済み・取消済み)"
    NotificationType:
      type: string
      enum:
        - reservation_ready
        - due_reminder
        - overdue_notice
      description: "通知種別 (受取可能通知・返却期限リマインド・延滞督促)"
    NotificationStatus:
      type: string
      enum:
        - pending
        - sent
      description: "通知の状態 (送信待ち・送信済み)"
    InventoryCategory:
      type: string
      enum:
        - available
        - on_loan
        - waiting_reservation
      description: "在庫状況区分 (在庫あり・貸出中・予約待ち)"
    AggregationUnit:
      type: string
      enum:
        - day
        - month
        - year
      description: "集計期間単位 (日・月・年)"
    JobRunResult:
      type: object
      description: "worker が起動するジョブ API の実行結果。同じ実行日の再実行は冪等 (ADR 0001 / 0005)。"
      required:
        - job
        - run_date
        - processed
        - skipped
      properties:
        job:
          type: string
          description: ジョブ名
        run_date:
          type: string
          format: date
          description: 実行日
        processed:
          type: integer
          minimum: 0
          description: 処理した件数
        skipped:
          type: integer
          minimum: 0
          description: "重複などで処理しなかった件数"
