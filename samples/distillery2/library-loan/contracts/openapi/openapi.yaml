# basis: requirements@d1987660054f32fca4d1af3a7f36b312eb6e6518 adr@481506aca70dae9b5b64cefa6ea032e220651c7d
# 契約の正本 (分割 YAML の入口)。UC 個別の path は段階④ (d2-contract mode=uc) で足す。
openapi: 3.1.0
info:
  title: "図書館蔵書管理システム API"
  version: 0.1.0
  description: |
    図書館蔵書管理システムの backend-api が提供する API。
    consumers は frontend (利用者・司書の画面) と worker (日次期限チェック・通知送信ジョブの起動)。
    認証は OIDC 準拠の IdP が発行するアクセストークン (Bearer) で行う (ADR 0006)。
    エラーは RFC 9457 の application/problem+json で返す。
    更新系 API (貸出・返却・予約・登録) は Idempotency-Key ヘッダを受け取る (ADR 0005)。
servers:
  - url: "http://localhost:3000"
    description: "ローカル開発"
security:
  - bearerAuth: []
tags:
  - name: catalog
    description: "蔵書 (書籍の登録・編集・削除・検索)"
  - name: patron
    description: "利用者 (登録・編集・削除)"
  - name: loan
    description: "貸出・返却・貸出履歴"
  - name: reservation
    description: "予約・予約取消・予約状況"
  - name: notification
    description: "通知 (返却通知・リマインド・督促) とジョブ起動"
  - name: analytics
    description: "蔵書分析 (在庫状況・人気書籍ランキング・貸出統計)"
paths:
  /loans:
    $ref: "./paths/loans.yaml"
  /returns:
    $ref: "./paths/returns.yaml"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "OIDC IdP が発行するアクセストークン。ロール (librarian / patron) と利用者番号をクレームに持つ"
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "更新系 API の再送判定キー。同じキーの再送では副作用を重複させず、初回と同じ応答を返す"
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: "7c1e8a52-3f0d-4c1b-9d2e-6a4b5c3d2e1f"
    Limit:
      name: limit
      in: query
      required: false
      description: "1 ページの最大件数"
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: "先頭から読み飛ばす件数"
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: "入力が不正 (必須項目の欠落・形式違反)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            badRequest:
              value:
                type: "https://library.example/problems/validation-error"
                title: "入力内容に誤りがあります"
                status: 400
                code: validation_error
                errors:
                  - field: title
                    message: "タイトルは必須です"
    Unauthorized:
      description: "認証されていない (トークンが無い・無効)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unauthorized:
              value:
                type: "https://library.example/problems/unauthorized"
                title: "認証が必要です"
                status: 401
                code: unauthorized
    Forbidden:
      description: "権限が無い (ロール不一致・本人以外のデータ)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            forbidden:
              value:
                type: "https://library.example/problems/forbidden"
                title: "この操作を行う権限がありません"
                status: 403
                code: forbidden
    NotFound:
      description: "対象が存在しない (論理削除済みを含む)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            notFound:
              value:
                type: "https://library.example/problems/not-found"
                title: "対象が見つかりません"
                status: 404
                code: not_found
    Conflict:
      description: "業務ルールまたは状態により処理できない (貸出中の書籍の削除など)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            conflict:
              value:
                type: "https://library.example/problems/business-rule-violation"
                title: "現在の状態ではこの操作を行えません"
                status: 409
                code: business_rule_violation
                detail: "貸出中の書籍は削除できません"
  schemas:
    Problem:
      type: object
      description: "RFC 9457 Problem Details。code はクライアントが分岐に使う安定した識別子"
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
          description: "問題種別の URI"
        title:
          type: string
          description: "問題種別の要約 (利用者に表示できる文言)"
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: "HTTP ステータスコード"
        code:
          $ref: "#/components/schemas/ProblemCode"
        detail:
          type: string
          description: "この発生に固有の説明"
        instance:
          type: string
          description: "この発生を識別する URI 参照"
        errors:
          type: array
          description: "入力検証エラーの項目別内訳 (code が validation_error のとき)"
          items:
            $ref: "#/components/schemas/FieldError"
    ProblemCode:
      type: string
      description: "エラーの安定識別子。業務ルール違反の細分は UC で enum に足す"
      enum:
        - validation_error
        - unauthorized
        - forbidden
        - not_found
        - business_rule_violation
        - idempotency_key_conflict
        - internal_error
        # register-loan: 貸出可否条件の違反 (409)
        - book_on_loan
        - not_first_in_reservation_queue
        - patron_not_registered
        # register-return: 未返却の貸出が無い書籍の返却 (409)
        - no_active_loan
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: "エラーのある入力項目名"
        message:
          type: string
          description: "項目ごとのエラー文言"
    PageMeta:
      type: object
      description: "オフセット方式のページング情報。一覧応答は items と page を持つ"
      required:
        - total
        - limit
        - offset
      properties:
        total:
          type: integer
          minimum: 0
          description: "条件に一致する総件数"
        limit:
          type: integer
          minimum: 1
          description: "1 ページの最大件数"
        offset:
          type: integer
          minimum: 0
          description: "先頭から読み飛ばした件数"
    BookId:
      type: string
      format: uuid
      description: "書籍ID"
    PatronNumber:
      type: string
      minLength: 1
      maxLength: 32
      description: "利用者番号 (一意)"
    LoanId:
      type: string
      format: uuid
      description: "貸出ID"
    ReservationId:
      type: string
      format: uuid
      description: "予約ID"
    NotificationId:
      type: string
      format: uuid
      description: "通知ID"
    Role:
      type: string
      description: "アクターのロール (トークンのクレーム)"
      enum:
        - librarian
        - patron
    MediaType:
      type: string
      description: "媒体種別 (バリエーション)。paper=紙の書籍、ebook=電子書籍。将来追加できる区分"
      enum:
        - paper
        - ebook
    BookStatus:
      type: string
      description: "書籍状態。available=在庫あり、on_loan=貸出中、awaiting_pickup=予約待ち"
      enum:
        - available
        - on_loan
        - awaiting_pickup
    LoanStatus:
      type: string
      description: "貸出状態。on_loan=貸出中、returned=返却済、overdue=延滞"
      enum:
        - on_loan
        - returned
        - overdue
    ReservationStatus:
      type: string
      description: "予約状態。waiting=予約中、notified=通知済、completed=完了、cancelled=取消"
      enum:
        - waiting
        - notified
        - completed
        - cancelled
    NotificationType:
      type: string
      description: "通知種別 (バリエーション)。return_notice=返却通知、reminder=リマインド、overdue_notice=督促"
      enum:
        - return_notice
        - reminder
        - overdue_notice
    RegisterLoanRequest:
      type: object
      description: "貸出の登録要求。貸出日はサーバーの当日の日付で決まるため要求に含めない"
      additionalProperties: false
      required:
        - patronNumber
        - bookId
      properties:
        patronNumber:
          $ref: "#/components/schemas/PatronNumber"
        bookId:
          $ref: "#/components/schemas/BookId"
    Loan:
      type: object
      description: "貸出"
      required:
        - loanId
        - patronNumber
        - bookId
        - reservationId
        - loanedOn
        - dueDate
        - returnedOn
        - status
      properties:
        loanId:
          $ref: "#/components/schemas/LoanId"
        patronNumber:
          $ref: "#/components/schemas/PatronNumber"
        bookId:
          $ref: "#/components/schemas/BookId"
        reservationId:
          type:
            - string
            - "null"
          format: uuid
          description: "予約順 1 位の利用者への貸出のとき、完了にした予約の予約ID。それ以外は null"
        loanedOn:
          type: string
          format: date
          description: "貸出日"
        dueDate:
          type: string
          format: date
          description: "返却期限。貸出日に貸出期間を加えた日 (返却期限算出条件)"
        returnedOn:
          type:
            - string
            - "null"
          format: date
          description: "返却日。未返却なら null"
        status:
          $ref: "#/components/schemas/LoanStatus"
    LoanRegistration:
      type: object
      description: "貸出の登録結果。登録した貸出と、貸出後の書籍状態を返す"
      required:
        - loan
        - bookStatus
      properties:
        loan:
          $ref: "#/components/schemas/Loan"
        bookStatus:
          $ref: "#/components/schemas/BookStatus"
    RegisterReturnRequest:
      type: object
      description: "返却の登録要求。返却日はサーバーの当日の日付で決まるため要求に含めない。対象の貸出は書籍の未返却の貸出から決まる"
      additionalProperties: false
      required:
        - bookId
      properties:
        bookId:
          $ref: "#/components/schemas/BookId"
    ReturnRegistration:
      type: object
      description: "返却の登録結果。返却済にした貸出と、返却後の書籍状態 (available または awaiting_pickup) を返す"
      required:
        - loan
        - bookStatus
      properties:
        loan:
          $ref: "#/components/schemas/Loan"
        bookStatus:
          $ref: "#/components/schemas/BookStatus"
    ReportType:
      type: string
      description: "レポート種別 (バリエーション)。inventory_status=在庫状況レポート、popular_books=人気書籍ランキング、loan_statistics=貸出統計"
      enum:
        - inventory_status
        - popular_books
        - loan_statistics
