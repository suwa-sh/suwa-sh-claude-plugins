# basis: requirements@ca8f7fb28b2dc8ef6b6abfcee29c0898fa879a12 adr@2f9d373dc26f6467cf0f95c62a65831fce0f9659
# 契約の正本 (分割可)。paths は d2-contract mode=uc が UC 単位で追記する。
# 生成物 (generated/openapi.bundle.yaml) は compileContracts.js が作る。手で編集しない。
openapi: 3.1.0
info:
  title: 図書館蔵書管理システム API
  version: 0.1.0
  description: >-
    backend-api が提供し、frontend-patron (利用者向け) と frontend-staff (司書向け) が利用する API。
    認証は OIDC 準拠の外部 IdP が発行するアクセストークン (Bearer) で行う (ADR-0006)。
    認可はロール (司書 / 利用者) と本人確認 (利用者番号の一致) を usecase 層で判定する。
    エラーは RFC 9457 の Problem Details (application/problem+json) で返す。
servers:
  - url: /api/v1
    description: backend-api (フロントと同一オリジンから相対パスで呼ぶ)
security:
  - bearerAuth: []
paths:
  /loans:
    $ref: './paths/loans.yaml'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        OIDC IdP が発行するアクセストークン。利用者向けと司書向けは別の OIDC クライアントで発行する。
        トークンのクレームからロール (patron / staff) と利用者番号 (patron のみ) を取り出す。
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        利用者が行う更新系 API の再送重複を防ぐキー (ADR-0005)。
        同じキーの再送では副作用を重複させず、初回と同じ応答を返す。
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: 7f3c2a9e-5b1d-4c8e-9f0a-2d6b8e4c1a37
    Page:
      name: page
      in: query
      required: false
      description: 取得するページ番号 (1 始まり)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 1 ページの件数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    BookId:
      name: bookId
      in: path
      required: true
      description: 書籍ID
      schema:
        $ref: '#/components/schemas/BookId'
    PatronNumber:
      name: patronNumber
      in: path
      required: true
      description: 利用者番号
      schema:
        $ref: '#/components/schemas/PatronNumber'
    LoanId:
      name: loanId
      in: path
      required: true
      description: 貸出ID
      schema:
        $ref: '#/components/schemas/LoanId'
    ReservationId:
      name: reservationId
      in: path
      required: true
      description: 予約ID
      schema:
        $ref: '#/components/schemas/ReservationId'
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: 通知ID
      schema:
        $ref: '#/components/schemas/NotificationId'
  responses:
    BadRequest:
      description: 入力の形式が不正 (必須項目の欠落・型の不一致など)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            badRequest:
              value:
                type: https://library.example/problems/validation-error
                title: 入力内容に誤りがあります
                status: 400
                detail: 入力項目を確認してください
                errors:
                  - field: title
                    message: タイトルは必須です
    Unauthorized:
      description: アクセストークンが無い、または無効
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthorized:
              value:
                type: https://library.example/problems/unauthorized
                title: ログインが必要です
                status: 401
    Forbidden:
      description: ロールまたは本人確認の認可で拒否された
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            forbidden:
              value:
                type: https://library.example/problems/forbidden
                title: この操作を行う権限がありません
                status: 403
    NotFound:
      description: 対象が存在しない (削除済みを含む)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              value:
                type: https://library.example/problems/not-found
                title: 対象が見つかりません
                status: 404
    Conflict:
      description: 楽観ロックの版番号の不一致、または業務ルール (状態) により操作できない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            conflict:
              value:
                type: https://library.example/problems/conflict
                title: 他の操作と競合しました
                status: 409
                detail: 最新の状態を取得してからやり直してください
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details。全 API 共通のエラー型
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: 問題の種類を識別する URI
        title:
          type: string
          description: 問題の短い要約 (利用者に表示できる文言)
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP ステータスコード
        detail:
          type: string
          description: この発生に固有の説明
        instance:
          type: string
          description: この発生を識別する URI 参照
        code:
          type: string
          description: 業務エラーコード (例 book-on-loan, patron-has-active-loans)
    ValidationProblem:
      description: 入力検証エラー。項目ごとのエラーを持つ Problem
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - errors
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: エラーの入力項目名
        message:
          type: string
          description: エラーの説明
    PageMeta:
      type: object
      description: 一覧取得のページング情報
      required:
        - page
        - pageSize
        - totalCount
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalCount:
          type: integer
          minimum: 0
    Version:
      type: integer
      minimum: 1
      description: 楽観ロックの版番号 (書籍単位)。更新時に取得時の値を送る
    BookId:
      type: string
      format: uuid
      description: 書籍ID
    PatronNumber:
      type: string
      pattern: '^P[0-9]{6}$'
      description: 利用者番号
      examples:
        - P000123
    LoanId:
      type: string
      format: uuid
      description: 貸出ID
    ReservationId:
      type: string
      format: uuid
      description: 予約ID
    NotificationId:
      type: string
      format: uuid
      description: 通知ID
    Isbn:
      type: string
      pattern: '^(97[89])?[0-9]{9}[0-9X]$'
      description: ISBN (ハイフン無しの 10 桁または 13 桁)
    Genre:
      type: string
      description: >-
        ジャンル。literature=文学, history=歴史, natural_science=自然科学, social_science=社会科学,
        art=芸術, engineering=技術・工学, children=児童書, reference=参考図書
      enum:
        - literature
        - history
        - natural_science
        - social_science
        - art
        - engineering
        - children
        - reference
    MediaType:
      type: string
      description: 媒体種別。paper=紙, electronic=電子 (将来の電子書籍に備える)
      enum:
        - paper
        - electronic
    BookStatus:
      type: string
      description: 書籍状態。available=在庫あり, on_loan=貸出中, on_hold=予約待ち (取置), deleted=削除済み
      enum:
        - available
        - on_loan
        - on_hold
        - deleted
    PatronCategory:
      type: string
      description: 利用者区分。general=一般, child=児童, student=学生 (貸出期間の決定に使う)
      enum:
        - general
        - child
        - student
    PatronStatus:
      type: string
      description: 利用者状態。active=有効, deleted=削除済み
      enum:
        - active
        - deleted
    LoanPeriodDays:
      type: integer
      description: 貸出期間 (日数)
      enum:
        - 7
        - 14
        - 21
    LoanStatus:
      type: string
      description: 貸出状態。on_loan=貸出中, overdue=延滞, returned=返却済み
      enum:
        - on_loan
        - overdue
        - returned
    CreateLoanRequest:
      type: object
      description: 貸出登録の入力。貸出日は業務日付、貸出期間と返却期限はサーバが決める
      additionalProperties: false
      required:
        - patronNumber
        - bookId
      properties:
        patronNumber:
          $ref: '#/components/schemas/PatronNumber'
        bookId:
          $ref: '#/components/schemas/BookId'
    Loan:
      type: object
      description: 貸出
      required:
        - loanId
        - bookId
        - patronNumber
        - loanedOn
        - loanPeriodDays
        - dueOn
        - status
      properties:
        loanId:
          $ref: '#/components/schemas/LoanId'
        bookId:
          $ref: '#/components/schemas/BookId'
        patronNumber:
          $ref: '#/components/schemas/PatronNumber'
        loanedOn:
          type: string
          format: date
          description: 貸出日
        loanPeriodDays:
          $ref: '#/components/schemas/LoanPeriodDays'
        dueOn:
          type: string
          format: date
          description: 返却期限。貸出日に貸出期間の日数を加えた日付
        status:
          $ref: '#/components/schemas/LoanStatus'
        pickedUpReservationId:
          description: この貸出で受取済みにした予約の予約ID。取置中の予約に基づかない貸出では null
          oneOf:
            - $ref: '#/components/schemas/ReservationId'
            - type: 'null'
    ReservationStatus:
      type: string
      description: 予約状態。waiting=予約中, on_hold=取置中, picked_up=受取済み, cancelled=取消済み
      enum:
        - waiting
        - on_hold
        - picked_up
        - cancelled
    NotificationType:
      type: string
      description: 通知種別。hold_ready=取置通知, reminder=返却期限リマインド, overdue_notice=延滞督促
      enum:
        - hold_ready
        - reminder
        - overdue_notice
    NotificationStatus:
      type: string
      description: 通知状態。pending=送信待ち, sent=送信済み, failed=送信失敗
      enum:
        - pending
        - sent
        - failed
    ReminderTiming:
      type: string
      description: リマインド時期。three_days_before=返却期限の3日前, one_day_before=返却期限の1日前
      enum:
        - three_days_before
        - one_day_before
    ReportPeriod:
      type: string
      description: 集計期間。daily=日次, weekly=週次, monthly=月次, yearly=年次, custom=任意期間
      enum:
        - daily
        - weekly
        - monthly
        - yearly
        - custom
