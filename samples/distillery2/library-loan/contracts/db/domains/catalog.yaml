# basis: requirements@4422a431dd381e737d643e7055432ad4b2330c9d adr@090e13b71116c495162f84a620b4d303817fac08
subdomain_id: catalog
description: "蔵書 (書籍・蔵書)。書籍は論理削除のマスタ、蔵書は履歴+スナップショット (ADR 0004)。"
tables:
  - name: books
    description: "書籍 (書誌情報)。同じ ISBN の所蔵資料は copies に複数行で紐づく。削除は deleted_at による論理削除。"
    columns:
      - name: book_id
        type: uuid
        nullable: false
        description: 書籍 ID
      - name: isbn
        type: string
        nullable: true
        description: "ISBN (ハイフンなし)。登録済みの ISBN とは重複させない"
      - name: title
        type: string
        nullable: false
        description: "タイトル (必須)"
      - name: author
        type: string
        nullable: true
        description: 著者
      - name: publisher
        type: string
        nullable: true
        description: 出版社
      - name: genre
        type: string
        nullable: true
        enum: [literature, history, social_science, natural_science, technology, arts, children, other]
        description: "ジャンル (文学・歴史・社会科学・自然科学・技術・芸術・児童書・その他)"
      - name: media_type
        type: string
        nullable: false
        enum: [paper, electronic]
        description: "媒体種別 (紙・電子)。未指定時は paper を入れる"
      - name: registered_on
        type: date
        nullable: false
        description: 登録日
      - name: deleted_at
        type: datetime
        nullable: true
        description: "論理削除日時 (未削除は NULL)"
      - name: created_at
        type: datetime
        nullable: false
        description: 作成日時
      - name: updated_at
        type: datetime
        nullable: false
        description: 更新日時
    primary_key: [book_id]
    indexes:
      - name: books_isbn_key
        unique: true
        columns: [isbn]
      - name: books_title_idx
        unique: false
        columns: [title]
      - name: books_author_idx
        unique: false
        columns: [author]
      - name: books_genre_idx
        unique: false
        columns: [genre]
  - name: copies
    description: "蔵書 (所蔵資料 1 冊) の現在値スナップショット。状態変化は copy_events に追記し、同じトランザクションで本表を更新する。"
    columns:
      - name: copy_id
        type: uuid
        nullable: false
        description: 蔵書 ID
      - name: book_id
        type: uuid
        nullable: false
        description: 書籍 ID
      - name: status
        type: string
        nullable: false
        enum: [available, on_loan, on_hold, withdrawn]
        description: "書籍の状態 (在庫あり・貸出中・取り置き中・除籍済み)"
      - name: acquired_on
        type: date
        nullable: false
        description: 受入日
      - name: version
        type: integer
        nullable: false
        description: "最後に反映した copy_events の sequence (楽観ロックに使う)"
      - name: updated_at
        type: datetime
        nullable: false
        description: 更新日時
    primary_key: [copy_id]
    foreign_keys:
      - columns: [book_id]
        references:
          table: books
          columns: [book_id]
        on_delete: RESTRICT
    indexes:
      - name: copies_book_id_idx
        unique: false
        columns: [book_id]
      - name: copies_status_idx
        unique: false
        columns: [status]
  - name: copy_events
    description: "蔵書の状態変化の履歴 (追記のみ。更新・削除しない)。"
    columns:
      - name: event_id
        type: uuid
        nullable: false
        description: イベント ID
      - name: copy_id
        type: uuid
        nullable: false
        description: 蔵書 ID
      - name: sequence
        type: integer
        nullable: false
        description: "蔵書ごとの連番 (1 始まり)"
      - name: event_type
        type: string
        nullable: false
        enum: [registered, loaned, returned_to_shelf, held, withdrawn]
        description: "イベント種別 (登録・貸出・返却で在庫あり・返却で取り置き・除籍)"
      - name: from_status
        type: string
        nullable: true
        enum: [available, on_loan, on_hold, withdrawn]
        description: "遷移前の状態 (登録時は NULL)"
      - name: to_status
        type: string
        nullable: false
        enum: [available, on_loan, on_hold, withdrawn]
        description: 遷移後の状態
      - name: occurred_at
        type: datetime
        nullable: false
        description: 発生日時
      - name: actor_librarian_id
        type: uuid
        nullable: true
        description: "操作した司書 (システム起因は NULL)"
      - name: payload
        type: text
        nullable: true
        description: "付帯情報 (JSON 文字列)"
    primary_key: [event_id]
    foreign_keys:
      - columns: [copy_id]
        references:
          table: copies
          columns: [copy_id]
        on_delete: RESTRICT
      - columns: [actor_librarian_id]
        references:
          table: librarians
          columns: [librarian_id]
        on_delete: RESTRICT
    indexes:
      - name: copy_events_copy_sequence_key
        unique: true
        columns: [copy_id, sequence]
