# basis: requirements@d1987660054f32fca4d1af3a7f36b312eb6e6518 adr@481506aca70dae9b5b64cefa6ea032e220651c7d
# 蔵書コンテキスト。書籍は event_snapshot (ADR 0004): book_events へ追記し、books を同じトランザクションで更新する。
subdomain_id: catalog
tables:
  - name: books
    description: "書籍のスナップショット。書籍ID単位に書誌情報・媒体種別・書籍状態を持つ。削除は deleted_on による論理削除"
    columns:
      - name: book_id
        type: uuid
        nullable: false
        description: "書籍ID"
      - name: title
        type: string
        nullable: false
        description: "タイトル"
      - name: author
        type: string
        nullable: false
        description: "著者"
      - name: isbn
        type: string
        nullable: true
        description: "ISBN"
      - name: publisher
        type: string
        nullable: true
        description: "出版社"
      - name: genre
        type: string
        nullable: true
        description: "ジャンル"
      - name: media_type
        type: string
        nullable: false
        enum:
          - paper
          - ebook
        description: "媒体種別。paper=紙の書籍、ebook=電子書籍"
      - name: status
        type: string
        nullable: false
        enum:
          - available
          - on_loan
          - awaiting_pickup
        description: "書籍状態。available=在庫あり、on_loan=貸出中、awaiting_pickup=予約待ち"
      - name: registered_on
        type: date
        nullable: false
        description: "登録日"
      - name: deleted_on
        type: date
        nullable: true
        description: "削除日。値があれば論理削除済みで一覧と検索から除く"
      - name: version
        type: integer
        nullable: false
        description: "スナップショットの版。book_events の最新 sequence と一致する (楽観ロック)"
      - name: updated_at
        type: datetime
        nullable: false
        description: "スナップショットの最終更新日時"
    primary_key:
      - book_id
    indexes:
      - name: books_isbn_idx
        unique: false
        columns:
          - isbn
      - name: books_status_idx
        unique: false
        columns:
          - status
  - name: book_events
    description: "書籍の追記型イベント。物理更新・物理削除しない"
    columns:
      - name: event_id
        type: uuid
        nullable: false
        description: "イベントID"
      - name: book_id
        type: uuid
        nullable: false
        description: "対象の書籍ID"
      - name: sequence
        type: integer
        nullable: false
        description: "書籍ごとの連番 (1 始まり)"
      - name: event_type
        type: string
        nullable: false
        description: "イベント種別 (登録・編集・貸出・返却・削除など。値は UC で定める)"
      - name: payload
        type: text
        nullable: false
        description: "イベント内容 (JSON 文字列)"
      - name: actor_subject
        type: string
        nullable: true
        description: "操作した主体 (IdP の subject)。ジョブ起因なら null"
      - name: occurred_at
        type: datetime
        nullable: false
        description: "発生日時"
    primary_key:
      - event_id
    indexes:
      - name: book_events_book_sequence_uq
        unique: true
        columns:
          - book_id
          - sequence
    foreign_keys:
      - columns:
          - book_id
        references:
          table: books
          columns:
            - book_id
        on_delete: RESTRICT
