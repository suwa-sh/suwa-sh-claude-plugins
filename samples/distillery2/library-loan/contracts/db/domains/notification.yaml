# basis: requirements@d1987660054f32fca4d1af3a7f36b312eb6e6518 adr@481506aca70dae9b5b64cefa6ea032e220651c7d
# 通知コンテキスト。通知は event (登録後に変えない) で outbox を兼ねる (ADR 0004 / 0005)。送信結果は notification_attempts に追記する。
subdomain_id: notification
tables:
  - name: notifications
    description: "通知の送信依頼 (outbox)。業務の更新と同じトランザクションで記録し、登録後は変更しない"
    columns:
      - name: notification_id
        type: uuid
        nullable: false
        description: "通知ID"
      - name: patron_number
        type: string
        nullable: false
        description: "宛先利用者番号"
      - name: email_encrypted
        type: text
        nullable: false
        description: "宛先メールアドレスの暗号文 (依頼時点の連絡先)"
      - name: loan_id
        type: uuid
        nullable: true
        description: "対象貸出ID"
      - name: reservation_id
        type: uuid
        nullable: true
        description: "対象予約ID (返却通知のとき)"
      - name: notification_type
        type: string
        nullable: false
        enum:
          - return_notice
          - reminder
          - overdue_notice
        description: "通知種別。return_notice=返却通知、reminder=リマインド、overdue_notice=督促"
      - name: requested_at
        type: datetime
        nullable: false
        description: "送信依頼日時"
    primary_key:
      - notification_id
    indexes:
      - name: notifications_loan_type_uq
        unique: true
        columns:
          - loan_id
          - notification_type
      - name: notifications_patron_idx
        unique: false
        columns:
          - patron_number
    foreign_keys:
      - columns:
          - patron_number
        references:
          table: patrons
          columns:
            - patron_number
        on_delete: RESTRICT
      - columns:
          - loan_id
        references:
          table: loans
          columns:
            - loan_id
        on_delete: RESTRICT
      - columns:
          - reservation_id
        references:
          table: reservations
          columns:
            - reservation_id
        on_delete: RESTRICT
  - name: notification_attempts
    description: "通知の送信結果 (追記のみ)。送信日時は result=sent の行の attempted_at"
    columns:
      - name: notification_id
        type: uuid
        nullable: false
        description: "対象の通知ID"
      - name: attempt_no
        type: integer
        nullable: false
        description: "送信試行の連番 (1 始まり)"
      - name: result
        type: string
        nullable: false
        enum:
          - sent
          - failed
        description: "送信結果。sent=送信済、failed=失敗"
      - name: error_message
        type: text
        nullable: true
        description: "失敗時の理由 (メールアドレス等の個人情報を含めない)"
      - name: attempted_at
        type: datetime
        nullable: false
        description: "送信試行日時"
    primary_key:
      - notification_id
      - attempt_no
    foreign_keys:
      - columns:
          - notification_id
        references:
          table: notifications
          columns:
            - notification_id
        on_delete: RESTRICT
