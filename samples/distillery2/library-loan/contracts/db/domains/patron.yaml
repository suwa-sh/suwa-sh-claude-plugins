# basis: requirements@4422a431dd381e737d643e7055432ad4b2330c9d adr@090e13b71116c495162f84a620b4d303817fac08
subdomain_id: patron
description: "利用者 (利用者・司書)。論理削除のマスタ。利用者の氏名とメールアドレスは暗号化して保管する (ADR 0004 / 0006)。"
tables:
  - name: patrons
    description: "利用者。利用者区分は patron 固定。退会は deleted_at による論理削除。パスワードは保持しない (OIDC 認証基盤が持つ)。"
    columns:
      - name: patron_id
        type: uuid
        nullable: false
        description: 利用者の内部 ID
      - name: patron_number
        type: string
        nullable: false
        description: システムが一意に採番する利用者番号
      - name: name_encrypted
        type: text
        nullable: false
        description: "氏名 (暗号化済み)"
      - name: email_encrypted
        type: text
        nullable: false
        description: "メールアドレス (暗号化済み)"
      - name: login_id
        type: string
        nullable: false
        description: ログイン ID
      - name: idp_subject
        type: string
        nullable: true
        description: "認証基盤の主体 ID (アカウント作成前は NULL)"
      - name: registered_on
        type: date
        nullable: false
        description: 登録日
      - name: deleted_at
        type: datetime
        nullable: true
        description: "論理削除 (退会) 日時。未削除は NULL"
      - name: created_at
        type: datetime
        nullable: false
        description: 作成日時
      - name: updated_at
        type: datetime
        nullable: false
        description: 更新日時
    primary_key: [patron_id]
    indexes:
      - name: patrons_patron_number_key
        unique: true
        columns: [patron_number]
      - name: patrons_login_id_key
        unique: true
        columns: [login_id]
      - name: patrons_idp_subject_key
        unique: true
        columns: [idp_subject]
  - name: librarians
    description: "司書 (職員アカウント)。利用者区分は librarian 固定。"
    columns:
      - name: librarian_id
        type: uuid
        nullable: false
        description: 司書の内部 ID
      - name: staff_id
        type: string
        nullable: false
        description: 職員 ID
      - name: name
        type: string
        nullable: false
        description: 氏名
      - name: login_id
        type: string
        nullable: false
        description: ログイン ID
      - name: idp_subject
        type: string
        nullable: true
        description: "認証基盤の主体 ID (アカウント作成前は NULL)"
      - name: deleted_at
        type: datetime
        nullable: true
        description: "論理削除日時 (未削除は NULL)"
      - name: created_at
        type: datetime
        nullable: false
        description: 作成日時
      - name: updated_at
        type: datetime
        nullable: false
        description: 更新日時
    primary_key: [librarian_id]
    indexes:
      - name: librarians_staff_id_key
        unique: true
        columns: [staff_id]
      - name: librarians_login_id_key
        unique: true
        columns: [login_id]
      - name: librarians_idp_subject_key
        unique: true
        columns: [idp_subject]
