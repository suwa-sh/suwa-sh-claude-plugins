# basis: requirements@d1987660054f32fca4d1af3a7f36b312eb6e6518 adr@481506aca70dae9b5b64cefa6ea032e220651c7d
# 利用者コンテキスト。利用者は resource_mutable + 論理削除 (ADR 0004)。連絡先は暗号化して保管する。
subdomain_id: patron
tables:
  - name: patrons
    description: "利用者。一意の利用者番号単位に氏名と連絡先を持つ。削除は deleted_on による論理削除"
    columns:
      - name: patron_number
        type: string
        nullable: false
        description: "利用者番号"
      - name: idp_subject
        type: string
        nullable: true
        description: "IdP の主体 (subject)。アカウント発行前は null (ADR 0006)"
      - name: name
        type: string
        nullable: false
        description: "氏名"
      - name: email_encrypted
        type: text
        nullable: false
        description: "連絡先 (メールアドレス) の暗号文。平文は保管しない"
      - name: registered_on
        type: date
        nullable: false
        description: "登録日"
      - name: deleted_on
        type: date
        nullable: true
        description: "削除日。値があれば論理削除済み"
      - name: updated_at
        type: datetime
        nullable: false
        description: "最終更新日時"
    primary_key:
      - patron_number
    indexes:
      - name: patrons_idp_subject_uq
        unique: true
        columns:
          - idp_subject
