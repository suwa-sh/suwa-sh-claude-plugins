# RDRA コンテキスト: 利用者管理 / 情報: 利用者 / 状態モデル: 利用者状態
# 氏名・住所・電話番号・メールアドレスは保管時に暗号化する列に置く (ADR-0004, NFR E.6.1.1)
subdomain_id: patron
tables:
  - name: patrons
    description: 利用者の現在状態 (スナップショット)。削除は status=deleted への遷移で表し物理削除しない
    columns:
      - name: patron_number
        type: string
        nullable: false
        description: 利用者番号
      - name: idp_subject
        type: string
        nullable: true
        description: "OIDC IdP のアカウント識別子 (sub)。IdP 連携方法は未決 (ADR-0006 の残課題) のため null を許す"
      - name: full_name_encrypted
        type: text
        nullable: false
        description: 氏名 (アプリで暗号化した値)
      - name: email_encrypted
        type: text
        nullable: false
        description: 連絡先メールアドレス (アプリで暗号化した値)。通知の宛先
      - name: phone_encrypted
        type: text
        nullable: true
        description: 電話番号 (アプリで暗号化した値)
      - name: address_encrypted
        type: text
        nullable: true
        description: 住所 (アプリで暗号化した値)
      - name: category
        type: string
        nullable: false
        description: "利用者区分 (general=一般, child=児童, student=学生)。貸出期間の決定に使う"
        enum: [general, child, student]
      - name: status
        type: string
        nullable: false
        description: "利用者状態 (active=有効, deleted=削除済み)"
        enum: [active, deleted]
      - name: version
        type: integer
        nullable: false
        description: 楽観ロックの版番号
      - name: registered_on
        type: date
        nullable: false
        description: 登録日
      - name: updated_at
        type: datetime
        nullable: false
        description: 更新日時
    primary_key: [patron_number]
    indexes:
      - name: patrons_idp_subject_uq
        unique: true
        columns: [idp_subject]
      - name: patrons_status_idx
        unique: false
        columns: [status]
  - name: patron_events
    description: 利用者のイベント (追記のみ)。個人情報はペイロード内でも暗号化した値で持つ
    columns:
      - name: event_id
        type: uuid
        nullable: false
        description: イベントID
      - name: patron_number
        type: string
        nullable: false
        description: 対象の利用者番号
      - name: patron_version
        type: integer
        nullable: false
        description: このイベント適用後の利用者の版番号
      - name: event_type
        type: string
        nullable: false
        description: "イベント種別 (例 PatronRegistered, PatronUpdated, PatronDeleted)"
      - name: payload
        type: text
        nullable: false
        description: イベント内容 (JSON 文字列。個人情報は暗号化した値)
      - name: actor_id
        type: string
        nullable: false
        description: 操作者 (IdP の subject)
      - name: occurred_at
        type: datetime
        nullable: false
        description: 発生日時
    primary_key: [event_id]
    foreign_keys:
      - columns: [patron_number]
        references:
          table: patrons
          columns: [patron_number]
        on_delete: RESTRICT
    indexes:
      - name: patron_events_patron_version_uq
        unique: true
        columns: [patron_number, patron_version]
