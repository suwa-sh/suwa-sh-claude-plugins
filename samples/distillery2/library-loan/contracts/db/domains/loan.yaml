# RDRA コンテキスト: 貸出管理 / 情報: 貸出 / 状態モデル: 貸出状態
# 貸出統計・人気書籍ランキングはこのテーブルから要求時に集計する (ADR-0004)
subdomain_id: loan
tables:
  - name: loans
    description: 貸出の現在状態 (スナップショット)
    columns:
      - name: loan_id
        type: uuid
        nullable: false
        description: 貸出ID
      - name: book_id
        type: uuid
        nullable: false
        description: 書籍ID
      - name: patron_number
        type: string
        nullable: false
        description: 利用者番号
      - name: loaned_on
        type: date
        nullable: false
        description: 貸出日
      - name: loan_period_days
        type: integer
        nullable: false
        description: "貸出期間の日数 (7, 14, 21)。利用者区分から決まる"
      - name: due_on
        type: date
        nullable: false
        description: 返却期限。貸出日と貸出期間から算出する
      - name: returned_on
        type: date
        nullable: true
        description: 返却日。返却済みのときだけ値を持つ
      - name: status
        type: string
        nullable: false
        description: "貸出状態 (on_loan=貸出中, overdue=延滞, returned=返却済み)"
        enum: [on_loan, overdue, returned]
      - name: version
        type: integer
        nullable: false
        description: 版番号
      - name: created_at
        type: datetime
        nullable: false
        description: 作成日時
      - name: updated_at
        type: datetime
        nullable: false
        description: 更新日時
    primary_key: [loan_id]
    foreign_keys:
      - columns: [book_id]
        references:
          table: books
          columns: [book_id]
        on_delete: RESTRICT
      - columns: [patron_number]
        references:
          table: patrons
          columns: [patron_number]
        on_delete: RESTRICT
    indexes:
      - name: loans_status_due_on_idx
        unique: false
        columns: [status, due_on]
      - name: loans_patron_number_idx
        unique: false
        columns: [patron_number]
      - name: loans_book_id_idx
        unique: false
        columns: [book_id]
      - name: loans_loaned_on_idx
        unique: false
        columns: [loaned_on]
  - name: loan_events
    description: 貸出のイベント (追記のみ)
    columns:
      - name: event_id
        type: uuid
        nullable: false
        description: イベントID
      - name: loan_id
        type: uuid
        nullable: false
        description: 対象の貸出ID
      - name: loan_version
        type: integer
        nullable: false
        description: このイベント適用後の貸出の版番号
      - name: event_type
        type: string
        nullable: false
        description: "イベント種別 (例 LoanCreated, LoanOverdue, LoanReturned)"
      - name: payload
        type: text
        nullable: false
        description: イベント内容 (JSON 文字列)
      - name: actor_id
        type: string
        nullable: false
        description: 操作者 (IdP の subject、または worker のジョブ名)
      - name: occurred_at
        type: datetime
        nullable: false
        description: 発生日時
    primary_key: [event_id]
    foreign_keys:
      - columns: [loan_id]
        references:
          table: loans
          columns: [loan_id]
        on_delete: RESTRICT
    indexes:
      - name: loan_events_loan_version_uq
        unique: true
        columns: [loan_id, loan_version]
