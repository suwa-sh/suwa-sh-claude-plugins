# basis: requirements@d1987660054f32fca4d1af3a7f36b312eb6e6518 adr@481506aca70dae9b5b64cefa6ea032e220651c7d
# 貸出コンテキスト。貸出は event_snapshot (ADR 0004): loan_events へ追記し、loans を同じトランザクションで更新する。
subdomain_id: loan
tables:
  - name: loans
    description: "貸出のスナップショット。誰がどの書籍をいつまで借りているかと貸出状態を持つ"
    columns:
      - name: loan_id
        type: uuid
        nullable: false
        description: "貸出ID"
      - name: patron_number
        type: string
        nullable: false
        description: "借りた利用者の利用者番号"
      - name: book_id
        type: uuid
        nullable: false
        description: "貸し出した書籍ID"
      - name: reservation_id
        type: uuid
        nullable: true
        description: "予約者への貸出のとき、完了した予約の予約ID"
      - name: loaned_on
        type: date
        nullable: false
        description: "貸出日"
      - name: due_date
        type: date
        nullable: false
        description: "返却期限 (貸出日 + 貸出期間)"
      - name: returned_on
        type: date
        nullable: true
        description: "返却日。未返却なら null"
      - name: status
        type: string
        nullable: false
        enum:
          - on_loan
          - returned
          - overdue
        description: "貸出状態。on_loan=貸出中、returned=返却済、overdue=延滞"
      - name: version
        type: integer
        nullable: false
        description: "スナップショットの版。loan_events の最新 sequence と一致する (楽観ロック)"
      - name: updated_at
        type: datetime
        nullable: false
        description: "スナップショットの最終更新日時"
    primary_key:
      - loan_id
    indexes:
      - name: loans_patron_idx
        unique: false
        columns:
          - patron_number
      - name: loans_book_idx
        unique: false
        columns:
          - book_id
      - name: loans_status_due_idx
        unique: false
        columns:
          - status
          - due_date
    foreign_keys:
      - columns:
          - patron_number
        references:
          table: patrons
          columns:
            - patron_number
        on_delete: RESTRICT
      - columns:
          - book_id
        references:
          table: books
          columns:
            - book_id
        on_delete: RESTRICT
      - columns:
          - reservation_id
        references:
          table: reservations
          columns:
            - reservation_id
        on_delete: RESTRICT
  - name: loan_events
    description: "貸出の追記型イベント。物理更新・物理削除しない"
    columns:
      - name: event_id
        type: uuid
        nullable: false
        description: "イベントID"
      - name: loan_id
        type: uuid
        nullable: false
        description: "対象の貸出ID"
      - name: sequence
        type: integer
        nullable: false
        description: "貸出ごとの連番 (1 始まり)"
      - name: event_type
        type: string
        nullable: false
        description: "イベント種別 (貸出・返却・延滞など。値は UC で定める)"
      - name: payload
        type: text
        nullable: false
        description: "イベント内容 (JSON 文字列)"
      - name: actor_subject
        type: string
        nullable: true
        description: "操作した主体 (IdP の subject)。ジョブ起因なら null"
      - name: occurred_at
        type: datetime
        nullable: false
        description: "発生日時"
    primary_key:
      - event_id
    indexes:
      - name: loan_events_loan_sequence_uq
        unique: true
        columns:
          - loan_id
          - sequence
    foreign_keys:
      - columns:
          - loan_id
        references:
          table: loans
          columns:
            - loan_id
        on_delete: RESTRICT
