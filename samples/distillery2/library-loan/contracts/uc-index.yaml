# basis: requirements@d1987660054f32fca4d1af3a7f36b312eb6e6518 adr@481506aca70dae9b5b64cefa6ea032e220651c7d
# UC ごとに使う operation / message / table の索引。段階④ (d2-contract mode=uc) で UC を足す。
schema_version: distillery2.uc-index/v1
ucs:
  - slug: register-loan
    operations:
      - registerLoan
    messages: []
    tables:
      - loans
      - loan_events
      - books
      - book_events
      - patrons
      - reservations
      - reservation_events
      - idempotency_keys
  - slug: register-return
    operations:
      - registerReturn
    messages: []
    tables:
      - loans
      - loan_events
      - books
      - book_events
      - reservations
      - idempotency_keys
