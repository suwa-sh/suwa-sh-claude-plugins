datastore: rdb
tables:
  - columns:
      - description: 監査ログID
        name: audit_id
        nullable: false
        type: uuid
      - description: 操作した主体 (IdP の subject)
        name: actor_subject
        nullable: false
        type: string
      - description: 操作した主体のロール。librarian=司書、patron=利用者
        enum:
          - librarian
          - patron
        name: actor_role
        nullable: false
        type: string
      - description: 操作 (operationId など)
        name: action
        nullable: false
        type: string
      - description: 対象の種類 (patron など)
        name: target_type
        nullable: false
        type: string
      - description: 対象の識別子 (利用者番号など)
        name: target_id
        nullable: false
        type: string
      - description: 発生日時
        name: occurred_at
        nullable: false
        type: datetime
    description: 監査ログ (追記のみ)。利用者情報の登録・編集・削除と個人情報を返す参照を記録する
    indexes:
      - columns:
          - target_type
          - target_id
        name: audit_logs_target_idx
        unique: false
    name: audit_logs
    primary_key:
      - audit_id
  - columns:
      - description: イベントID
        name: event_id
        nullable: false
        type: uuid
      - description: 対象の書籍ID
        name: book_id
        nullable: false
        type: uuid
      - description: 書籍ごとの連番 (1 始まり)
        name: sequence
        nullable: false
        type: integer
      - description: イベント種別 (登録・編集・貸出・返却・削除など。値は UC で定める)
        name: event_type
        nullable: false
        type: string
      - description: イベント内容 (JSON 文字列)
        name: payload
        nullable: false
        type: text
      - description: 操作した主体 (IdP の subject)。ジョブ起因なら null
        name: actor_subject
        nullable: true
        type: string
      - description: 発生日時
        name: occurred_at
        nullable: false
        type: datetime
    description: 書籍の追記型イベント。物理更新・物理削除しない
    foreign_keys:
      - columns:
          - book_id
        on_delete: RESTRICT
        references:
          columns:
            - book_id
          table: books
    indexes:
      - columns:
          - book_id
          - sequence
        name: book_events_book_sequence_uq
        unique: true
    name: book_events
    primary_key:
      - event_id
  - columns:
      - description: 書籍ID
        name: book_id
        nullable: false
        type: uuid
      - description: タイトル
        name: title
        nullable: false
        type: string
      - description: 著者
        name: author
        nullable: false
        type: string
      - description: ISBN
        name: isbn
        nullable: true
        type: string
      - description: 出版社
        name: publisher
        nullable: true
        type: string
      - description: ジャンル
        name: genre
        nullable: true
        type: string
      - description: 媒体種別。paper=紙の書籍、ebook=電子書籍
        enum:
          - paper
          - ebook
        name: media_type
        nullable: false
        type: string
      - description: 書籍状態。available=在庫あり、on_loan=貸出中、awaiting_pickup=予約待ち
        enum:
          - available
          - on_loan
          - awaiting_pickup
        name: status
        nullable: false
        type: string
      - description: 登録日
        name: registered_on
        nullable: false
        type: date
      - description: 削除日。値があれば論理削除済みで一覧と検索から除く
        name: deleted_on
        nullable: true
        type: date
      - description: スナップショットの版。book_events の最新 sequence と一致する (楽観ロック)
        name: version
        nullable: false
        type: integer
      - description: スナップショットの最終更新日時
        name: updated_at
        nullable: false
        type: datetime
    description: 書籍のスナップショット。書籍ID単位に書誌情報・媒体種別・書籍状態を持つ。削除は deleted_on による論理削除
    indexes:
      - columns:
          - isbn
        name: books_isbn_idx
        unique: false
      - columns:
          - status
        name: books_status_idx
        unique: false
    name: books
    primary_key:
      - book_id
  - columns:
      - description: Idempotency-Key ヘッダの値
        name: idempotency_key
        nullable: false
        type: string
      - description: 要求した主体 (IdP の subject)
        name: principal_subject
        nullable: false
        type: string
      - description: OpenAPI の operationId
        name: operation_id
        nullable: false
        type: string
      - description: 要求本文のハッシュ。同じキーで本文が異なる再送を検出する
        name: request_hash
        nullable: false
        type: string
      - description: 初回応答の HTTP ステータス
        name: response_status
        nullable: false
        type: integer
      - description: 初回応答の本文 (JSON 文字列)
        name: response_body
        nullable: true
        type: text
      - description: 記録日時
        name: created_at
        nullable: false
        type: datetime
    description: 更新系 API の Idempotency-Key と初回応答。同じキーの再送に初回と同じ応答を返す
    name: idempotency_keys
    primary_key:
      - idempotency_key
      - principal_subject
      - operation_id
  - columns:
      - description: イベントID
        name: event_id
        nullable: false
        type: uuid
      - description: 対象の貸出ID
        name: loan_id
        nullable: false
        type: uuid
      - description: 貸出ごとの連番 (1 始まり)
        name: sequence
        nullable: false
        type: integer
      - description: イベント種別 (貸出・返却・延滞など。値は UC で定める)
        name: event_type
        nullable: false
        type: string
      - description: イベント内容 (JSON 文字列)
        name: payload
        nullable: false
        type: text
      - description: 操作した主体 (IdP の subject)。ジョブ起因なら null
        name: actor_subject
        nullable: true
        type: string
      - description: 発生日時
        name: occurred_at
        nullable: false
        type: datetime
    description: 貸出の追記型イベント。物理更新・物理削除しない
    foreign_keys:
      - columns:
          - loan_id
        on_delete: RESTRICT
        references:
          columns:
            - loan_id
          table: loans
    indexes:
      - columns:
          - loan_id
          - sequence
        name: loan_events_loan_sequence_uq
        unique: true
    name: loan_events
    primary_key:
      - event_id
  - columns:
      - description: 貸出ID
        name: loan_id
        nullable: false
        type: uuid
      - description: 借りた利用者の利用者番号
        name: patron_number
        nullable: false
        type: string
      - description: 貸し出した書籍ID
        name: book_id
        nullable: false
        type: uuid
      - description: 予約者への貸出のとき、完了した予約の予約ID
        name: reservation_id
        nullable: true
        type: uuid
      - description: 貸出日
        name: loaned_on
        nullable: false
        type: date
      - description: 返却期限 (貸出日 + 貸出期間)
        name: due_date
        nullable: false
        type: date
      - description: 返却日。未返却なら null
        name: returned_on
        nullable: true
        type: date
      - description: 貸出状態。on_loan=貸出中、returned=返却済、overdue=延滞
        enum:
          - on_loan
          - returned
          - overdue
        name: status
        nullable: false
        type: string
      - description: スナップショットの版。loan_events の最新 sequence と一致する (楽観ロック)
        name: version
        nullable: false
        type: integer
      - description: スナップショットの最終更新日時
        name: updated_at
        nullable: false
        type: datetime
    description: 貸出のスナップショット。誰がどの書籍をいつまで借りているかと貸出状態を持つ
    foreign_keys:
      - columns:
          - patron_number
        on_delete: RESTRICT
        references:
          columns:
            - patron_number
          table: patrons
      - columns:
          - book_id
        on_delete: RESTRICT
        references:
          columns:
            - book_id
          table: books
      - columns:
          - reservation_id
        on_delete: RESTRICT
        references:
          columns:
            - reservation_id
          table: reservations
    indexes:
      - columns:
          - patron_number
        name: loans_patron_idx
        unique: false
      - columns:
          - book_id
        name: loans_book_idx
        unique: false
      - columns:
          - status
          - due_date
        name: loans_status_due_idx
        unique: false
    name: loans
    primary_key:
      - loan_id
  - columns:
      - description: 対象の通知ID
        name: notification_id
        nullable: false
        type: uuid
      - description: 送信試行の連番 (1 始まり)
        name: attempt_no
        nullable: false
        type: integer
      - description: 送信結果。sent=送信済、failed=失敗
        enum:
          - sent
          - failed
        name: result
        nullable: false
        type: string
      - description: 失敗時の理由 (メールアドレス等の個人情報を含めない)
        name: error_message
        nullable: true
        type: text
      - description: 送信試行日時
        name: attempted_at
        nullable: false
        type: datetime
    description: 通知の送信結果 (追記のみ)。送信日時は result=sent の行の attempted_at
    foreign_keys:
      - columns:
          - notification_id
        on_delete: RESTRICT
        references:
          columns:
            - notification_id
          table: notifications
    name: notification_attempts
    primary_key:
      - notification_id
      - attempt_no
  - columns:
      - description: 通知ID
        name: notification_id
        nullable: false
        type: uuid
      - description: 宛先利用者番号
        name: patron_number
        nullable: false
        type: string
      - description: 宛先メールアドレスの暗号文 (依頼時点の連絡先)
        name: email_encrypted
        nullable: false
        type: text
      - description: 対象貸出ID
        name: loan_id
        nullable: true
        type: uuid
      - description: 対象予約ID (返却通知のとき)
        name: reservation_id
        nullable: true
        type: uuid
      - description: 通知種別。return_notice=返却通知、reminder=リマインド、overdue_notice=督促
        enum:
          - return_notice
          - reminder
          - overdue_notice
        name: notification_type
        nullable: false
        type: string
      - description: 送信依頼日時
        name: requested_at
        nullable: false
        type: datetime
    description: 通知の送信依頼 (outbox)。業務の更新と同じトランザクションで記録し、登録後は変更しない
    foreign_keys:
      - columns:
          - patron_number
        on_delete: RESTRICT
        references:
          columns:
            - patron_number
          table: patrons
      - columns:
          - loan_id
        on_delete: RESTRICT
        references:
          columns:
            - loan_id
          table: loans
      - columns:
          - reservation_id
        on_delete: RESTRICT
        references:
          columns:
            - reservation_id
          table: reservations
    indexes:
      - columns:
          - loan_id
          - notification_type
        name: notifications_loan_type_uq
        unique: true
      - columns:
          - patron_number
        name: notifications_patron_idx
        unique: false
    name: notifications
    primary_key:
      - notification_id
  - columns:
      - description: 利用者番号
        name: patron_number
        nullable: false
        type: string
      - description: IdP の主体 (subject)。アカウント発行前は null (ADR 0006)
        name: idp_subject
        nullable: true
        type: string
      - description: 氏名
        name: name
        nullable: false
        type: string
      - description: 連絡先 (メールアドレス) の暗号文。平文は保管しない
        name: email_encrypted
        nullable: false
        type: text
      - description: 登録日
        name: registered_on
        nullable: false
        type: date
      - description: 削除日。値があれば論理削除済み
        name: deleted_on
        nullable: true
        type: date
      - description: 最終更新日時
        name: updated_at
        nullable: false
        type: datetime
    description: 利用者。一意の利用者番号単位に氏名と連絡先を持つ。削除は deleted_on による論理削除
    indexes:
      - columns:
          - idp_subject
        name: patrons_idp_subject_uq
        unique: true
    name: patrons
    primary_key:
      - patron_number
  - columns:
      - description: イベントID
        name: event_id
        nullable: false
        type: uuid
      - description: 対象の予約ID
        name: reservation_id
        nullable: false
        type: uuid
      - description: 予約ごとの連番 (1 始まり)
        name: sequence
        nullable: false
        type: integer
      - description: イベント種別 (受付・通知・完了・取消・順位繰上げなど。値は UC で定める)
        name: event_type
        nullable: false
        type: string
      - description: イベント内容 (JSON 文字列)
        name: payload
        nullable: false
        type: text
      - description: 操作した主体 (IdP の subject)。ジョブ起因なら null
        name: actor_subject
        nullable: true
        type: string
      - description: 発生日時
        name: occurred_at
        nullable: false
        type: datetime
    description: 予約の追記型イベント。物理更新・物理削除しない
    foreign_keys:
      - columns:
          - reservation_id
        on_delete: RESTRICT
        references:
          columns:
            - reservation_id
          table: reservations
    indexes:
      - columns:
          - reservation_id
          - sequence
        name: reservation_events_reservation_sequence_uq
        unique: true
    name: reservation_events
    primary_key:
      - event_id
  - columns:
      - description: 予約ID
        name: reservation_id
        nullable: false
        type: uuid
      - description: 予約した利用者の利用者番号
        name: patron_number
        nullable: false
        type: string
      - description: 予約した書籍ID
        name: book_id
        nullable: false
        type: uuid
      - description: 受付日時
        name: received_at
        nullable: false
        type: datetime
      - description: 予約順位 (1 始まり)。完了・取消で予約順位の管理対象から外れたら null
        name: queue_position
        nullable: true
        type: integer
      - description: 予約状態。waiting=予約中、notified=通知済、completed=完了、cancelled=取消
        enum:
          - waiting
          - notified
          - completed
          - cancelled
        name: status
        nullable: false
        type: string
      - description: 通知日時
        name: notified_at
        nullable: true
        type: datetime
      - description: 完了日時
        name: completed_at
        nullable: true
        type: datetime
      - description: 取消日時
        name: cancelled_at
        nullable: true
        type: datetime
      - description: スナップショットの版。reservation_events の最新 sequence と一致する (楽観ロック)
        name: version
        nullable: false
        type: integer
      - description: スナップショットの最終更新日時
        name: updated_at
        nullable: false
        type: datetime
    description: 予約のスナップショット。貸出中の書籍の予約を受付順の予約順位と予約状態で持つ
    foreign_keys:
      - columns:
          - patron_number
        on_delete: RESTRICT
        references:
          columns:
            - patron_number
          table: patrons
      - columns:
          - book_id
        on_delete: RESTRICT
        references:
          columns:
            - book_id
          table: books
    indexes:
      - columns:
          - book_id
          - status
        name: reservations_book_status_idx
        unique: false
      - columns:
          - patron_number
        name: reservations_patron_idx
        unique: false
    name: reservations
    primary_key:
      - reservation_id
version: 0.1.0
