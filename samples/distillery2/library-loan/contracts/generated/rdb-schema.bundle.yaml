datastore: rdb
tables:
  - columns:
      - description: 書籍 ID
        name: book_id
        nullable: false
        type: uuid
      - description: ISBN (ハイフンなし)。登録済みの ISBN とは重複させない
        name: isbn
        nullable: true
        type: string
      - description: タイトル (必須)
        name: title
        nullable: false
        type: string
      - description: 著者
        name: author
        nullable: true
        type: string
      - description: 出版社
        name: publisher
        nullable: true
        type: string
      - description: ジャンル (文学・歴史・社会科学・自然科学・技術・芸術・児童書・その他)
        enum:
          - literature
          - history
          - social_science
          - natural_science
          - technology
          - arts
          - children
          - other
        name: genre
        nullable: true
        type: string
      - description: 媒体種別 (紙・電子)。未指定時は paper を入れる
        enum:
          - paper
          - electronic
        name: media_type
        nullable: false
        type: string
      - description: 登録日
        name: registered_on
        nullable: false
        type: date
      - description: 論理削除日時 (未削除は NULL)
        name: deleted_at
        nullable: true
        type: datetime
      - description: 作成日時
        name: created_at
        nullable: false
        type: datetime
      - description: 更新日時
        name: updated_at
        nullable: false
        type: datetime
    description: 書籍 (書誌情報)。同じ ISBN の所蔵資料は copies に複数行で紐づく。削除は deleted_at による論理削除。
    indexes:
      - columns:
          - isbn
        name: books_isbn_key
        unique: true
      - columns:
          - title
        name: books_title_idx
        unique: false
      - columns:
          - author
        name: books_author_idx
        unique: false
      - columns:
          - genre
        name: books_genre_idx
        unique: false
    name: books
    primary_key:
      - book_id
  - columns:
      - description: 蔵書 ID
        name: copy_id
        nullable: false
        type: uuid
      - description: 書籍 ID
        name: book_id
        nullable: false
        type: uuid
      - description: 書籍の状態 (在庫あり・貸出中・取り置き中・除籍済み)
        enum:
          - available
          - on_loan
          - on_hold
          - withdrawn
        name: status
        nullable: false
        type: string
      - description: 受入日
        name: acquired_on
        nullable: false
        type: date
      - description: 最後に反映した copy_events の sequence (楽観ロックに使う)
        name: version
        nullable: false
        type: integer
      - description: 更新日時
        name: updated_at
        nullable: false
        type: datetime
    description: 蔵書 (所蔵資料 1 冊) の現在値スナップショット。状態変化は copy_events に追記し、同じトランザクションで本表を更新する。
    foreign_keys:
      - columns:
          - book_id
        on_delete: RESTRICT
        references:
          columns:
            - book_id
          table: books
    indexes:
      - columns:
          - book_id
        name: copies_book_id_idx
        unique: false
      - columns:
          - status
        name: copies_status_idx
        unique: false
    name: copies
    primary_key:
      - copy_id
  - columns:
      - description: イベント ID
        name: event_id
        nullable: false
        type: uuid
      - description: 蔵書 ID
        name: copy_id
        nullable: false
        type: uuid
      - description: 蔵書ごとの連番 (1 始まり)
        name: sequence
        nullable: false
        type: integer
      - description: イベント種別 (登録・貸出・返却で在庫あり・返却で取り置き・除籍)
        enum:
          - registered
          - loaned
          - returned_to_shelf
          - held
          - withdrawn
        name: event_type
        nullable: false
        type: string
      - description: 遷移前の状態 (登録時は NULL)
        enum:
          - available
          - on_loan
          - on_hold
          - withdrawn
        name: from_status
        nullable: true
        type: string
      - description: 遷移後の状態
        enum:
          - available
          - on_loan
          - on_hold
          - withdrawn
        name: to_status
        nullable: false
        type: string
      - description: 発生日時
        name: occurred_at
        nullable: false
        type: datetime
      - description: 操作した司書 (システム起因は NULL)
        name: actor_librarian_id
        nullable: true
        type: uuid
      - description: 付帯情報 (JSON 文字列)
        name: payload
        nullable: true
        type: text
    description: 蔵書の状態変化の履歴 (追記のみ。更新・削除しない)。
    foreign_keys:
      - columns:
          - copy_id
        on_delete: RESTRICT
        references:
          columns:
            - copy_id
          table: copies
      - columns:
          - actor_librarian_id
        on_delete: RESTRICT
        references:
          columns:
            - librarian_id
          table: librarians
    indexes:
      - columns:
          - copy_id
          - sequence
        name: copy_events_copy_sequence_key
        unique: true
    name: copy_events
    primary_key:
      - event_id
  - columns:
      - description: 司書の内部 ID
        name: librarian_id
        nullable: false
        type: uuid
      - description: 職員 ID
        name: staff_id
        nullable: false
        type: string
      - description: 氏名
        name: name
        nullable: false
        type: string
      - description: ログイン ID
        name: login_id
        nullable: false
        type: string
      - description: 認証基盤の主体 ID (アカウント作成前は NULL)
        name: idp_subject
        nullable: true
        type: string
      - description: 論理削除日時 (未削除は NULL)
        name: deleted_at
        nullable: true
        type: datetime
      - description: 作成日時
        name: created_at
        nullable: false
        type: datetime
      - description: 更新日時
        name: updated_at
        nullable: false
        type: datetime
    description: 司書 (職員アカウント)。利用者区分は librarian 固定。
    indexes:
      - columns:
          - staff_id
        name: librarians_staff_id_key
        unique: true
      - columns:
          - login_id
        name: librarians_login_id_key
        unique: true
      - columns:
          - idp_subject
        name: librarians_idp_subject_key
        unique: true
    name: librarians
    primary_key:
      - librarian_id
  - columns:
      - description: イベント ID
        name: event_id
        nullable: false
        type: uuid
      - description: 貸出 ID
        name: loan_id
        nullable: false
        type: uuid
      - description: 貸出ごとの連番 (1 始まり)
        name: sequence
        nullable: false
        type: integer
      - description: イベント種別 (貸出・延滞判定・返却)
        enum:
          - loaned
          - marked_overdue
          - returned
        name: event_type
        nullable: false
        type: string
      - description: 遷移前の状態 (貸出時は NULL)
        enum:
          - on_loan
          - overdue
          - returned
        name: from_status
        nullable: true
        type: string
      - description: 遷移後の状態
        enum:
          - on_loan
          - overdue
          - returned
        name: to_status
        nullable: false
        type: string
      - description: 発生日時
        name: occurred_at
        nullable: false
        type: datetime
      - description: 操作した司書 (日次ジョブ起因は NULL)
        name: actor_librarian_id
        nullable: true
        type: uuid
      - description: 付帯情報 (JSON 文字列)
        name: payload
        nullable: true
        type: text
    description: 貸出の状態変化の履歴 (追記のみ。更新・削除しない)。
    foreign_keys:
      - columns:
          - loan_id
        on_delete: RESTRICT
        references:
          columns:
            - loan_id
          table: loans
      - columns:
          - actor_librarian_id
        on_delete: RESTRICT
        references:
          columns:
            - librarian_id
          table: librarians
    indexes:
      - columns:
          - loan_id
          - sequence
        name: loan_events_loan_sequence_key
        unique: true
    name: loan_events
    primary_key:
      - event_id
  - columns:
      - description: 貸出ルール ID
        name: loan_rule_id
        nullable: false
        type: uuid
      - description: 貸出期間 (日数)
        name: loan_period_days
        nullable: false
        type: integer
      - description: リマインド日数 (返却期限の何日前に送るか)
        name: reminder_days_before
        nullable: false
        type: integer
      - description: 適用開始日
        name: effective_from
        nullable: false
        type: date
      - description: 作成日時
        name: created_at
        nullable: false
        type: datetime
    description: 貸出ルールの世代。返却期限の算出には貸出日時点で有効な (適用開始日が貸出日以前で最新の) 世代を使う。行は更新しない。
    indexes:
      - columns:
          - effective_from
        name: loan_rules_effective_from_key
        unique: true
    name: loan_rules
    primary_key:
      - loan_rule_id
  - columns:
      - description: 貸出 ID
        name: loan_id
        nullable: false
        type: uuid
      - description: 借りた利用者
        name: patron_id
        nullable: false
        type: uuid
      - description: 貸し出した蔵書
        name: copy_id
        nullable: false
        type: uuid
      - description: 返却期限の算出に使った貸出ルールの世代
        name: loan_rule_id
        nullable: false
        type: uuid
      - description: 貸出日
        name: loaned_on
        nullable: false
        type: date
      - description: 返却期限 (貸出日 + 貸出期間)
        name: due_on
        nullable: false
        type: date
      - description: 返却日 (未返却は NULL)
        name: returned_on
        nullable: true
        type: date
      - description: 貸出の状態 (貸出中・延滞中・返却済み)
        enum:
          - on_loan
          - overdue
          - returned
        name: status
        nullable: false
        type: string
      - description: 貸出を登録した司書
        name: loaned_by_librarian_id
        nullable: false
        type: uuid
      - description: 返却を登録した司書 (未返却は NULL)
        name: returned_by_librarian_id
        nullable: true
        type: uuid
      - description: 最後に反映した loan_events の sequence (楽観ロックに使う)
        name: version
        nullable: false
        type: integer
      - description: 更新日時
        name: updated_at
        nullable: false
        type: datetime
    description: 貸出の現在値スナップショット。状態変化は loan_events に追記し、同じトランザクションで本表を更新する。
    foreign_keys:
      - columns:
          - patron_id
        on_delete: RESTRICT
        references:
          columns:
            - patron_id
          table: patrons
      - columns:
          - copy_id
        on_delete: RESTRICT
        references:
          columns:
            - copy_id
          table: copies
      - columns:
          - loan_rule_id
        on_delete: RESTRICT
        references:
          columns:
            - loan_rule_id
          table: loan_rules
      - columns:
          - loaned_by_librarian_id
        on_delete: RESTRICT
        references:
          columns:
            - librarian_id
          table: librarians
      - columns:
          - returned_by_librarian_id
        on_delete: RESTRICT
        references:
          columns:
            - librarian_id
          table: librarians
    indexes:
      - columns:
          - patron_id
        name: loans_patron_id_idx
        unique: false
      - columns:
          - copy_id
        name: loans_copy_id_idx
        unique: false
      - columns:
          - status
          - due_on
        name: loans_status_due_on_idx
        unique: false
    name: loans
    primary_key:
      - loan_id
  - columns:
      - description: イベント ID
        name: event_id
        nullable: false
        type: uuid
      - description: 通知 ID
        name: notification_id
        nullable: false
        type: uuid
      - description: 通知ごとの連番 (1 始まり)
        name: sequence
        nullable: false
        type: integer
      - description: イベント種別 (送信待ち登録・送信成功・送信失敗)
        enum:
          - queued
          - sent
          - send_failed
        name: event_type
        nullable: false
        type: string
      - description: 遷移前の状態 (登録時は NULL)
        enum:
          - pending
          - sent
        name: from_status
        nullable: true
        type: string
      - description: 遷移後の状態 (送信失敗時は pending のまま)
        enum:
          - pending
          - sent
        name: to_status
        nullable: false
        type: string
      - description: 発生日時
        name: occurred_at
        nullable: false
        type: datetime
      - description: 付帯情報 (JSON 文字列。失敗理由など)
        name: payload
        nullable: true
        type: text
    description: 通知の状態変化と送信試行の履歴 (追記のみ。更新・削除しない)。
    foreign_keys:
      - columns:
          - notification_id
        on_delete: RESTRICT
        references:
          columns:
            - notification_id
          table: notifications
    indexes:
      - columns:
          - notification_id
          - sequence
        name: notification_events_notification_sequence_key
        unique: true
    name: notification_events
    primary_key:
      - event_id
  - columns:
      - description: 通知 ID
        name: notification_id
        nullable: false
        type: uuid
      - description: 通知種別 (受取可能通知・返却期限リマインド・延滞督促)
        enum:
          - reservation_ready
          - due_reminder
          - overdue_notice
        name: notification_type
        nullable: false
        type: string
      - description: 対象の ID (reservation_ready は予約 ID、それ以外は貸出 ID)。重複抑止の一意キーに使う
        name: target_id
        nullable: false
        type: uuid
      - description: 対象の貸出 (due_reminder / overdue_notice のとき)
        name: loan_id
        nullable: true
        type: uuid
      - description: 対象の予約 (reservation_ready のとき)
        name: reservation_id
        nullable: true
        type: uuid
      - description: 宛先の利用者
        name: patron_id
        nullable: false
        type: uuid
      - description: 宛先メールアドレス (暗号化済み。記録時点の値)
        name: recipient_email_encrypted
        nullable: false
        type: text
      - description: 送信日 (同日の重複送信を抑止する単位)
        name: scheduled_on
        nullable: false
        type: date
      - description: 通知の状態 (送信待ち・送信済み)
        enum:
          - pending
          - sent
        name: status
        nullable: false
        type: string
      - description: 送信日時 (未送信は NULL)
        name: sent_at
        nullable: true
        type: datetime
      - description: 送信を試みた回数
        name: attempt_count
        nullable: false
        type: integer
      - description: 直近の送信失敗の内容 (失敗が無ければ NULL)
        name: last_error
        nullable: true
        type: text
      - description: 最後に反映した notification_events の sequence (楽観ロックに使う)
        name: version
        nullable: false
        type: integer
      - description: 作成日時
        name: created_at
        nullable: false
        type: datetime
      - description: 更新日時
        name: updated_at
        nullable: false
        type: datetime
    description: 通知の現在値スナップショット。業務更新と同じトランザクションで送信待ちとして記録し、worker 起動の送信ジョブが送信済みにする。通知種別・対象・送信日の組で一意。
    foreign_keys:
      - columns:
          - loan_id
        on_delete: RESTRICT
        references:
          columns:
            - loan_id
          table: loans
      - columns:
          - reservation_id
        on_delete: RESTRICT
        references:
          columns:
            - reservation_id
          table: reservations
      - columns:
          - patron_id
        on_delete: RESTRICT
        references:
          columns:
            - patron_id
          table: patrons
    indexes:
      - columns:
          - notification_type
          - target_id
          - scheduled_on
        name: notifications_dedup_key
        unique: true
      - columns:
          - status
        name: notifications_status_idx
        unique: false
    name: notifications
    primary_key:
      - notification_id
  - columns:
      - description: 利用者の内部 ID
        name: patron_id
        nullable: false
        type: uuid
      - description: システムが一意に採番する利用者番号
        name: patron_number
        nullable: false
        type: string
      - description: 氏名 (暗号化済み)
        name: name_encrypted
        nullable: false
        type: text
      - description: メールアドレス (暗号化済み)
        name: email_encrypted
        nullable: false
        type: text
      - description: ログイン ID
        name: login_id
        nullable: false
        type: string
      - description: 認証基盤の主体 ID (アカウント作成前は NULL)
        name: idp_subject
        nullable: true
        type: string
      - description: 登録日
        name: registered_on
        nullable: false
        type: date
      - description: 論理削除 (退会) 日時。未削除は NULL
        name: deleted_at
        nullable: true
        type: datetime
      - description: 作成日時
        name: created_at
        nullable: false
        type: datetime
      - description: 更新日時
        name: updated_at
        nullable: false
        type: datetime
    description: 利用者。利用者区分は patron 固定。退会は deleted_at による論理削除。パスワードは保持しない (OIDC 認証基盤が持つ)。
    indexes:
      - columns:
          - patron_number
        name: patrons_patron_number_key
        unique: true
      - columns:
          - login_id
        name: patrons_login_id_key
        unique: true
      - columns:
          - idp_subject
        name: patrons_idp_subject_key
        unique: true
    name: patrons
    primary_key:
      - patron_id
  - columns:
      - description: イベント ID
        name: event_id
        nullable: false
        type: uuid
      - description: 予約 ID
        name: reservation_id
        nullable: false
        type: uuid
      - description: 予約ごとの連番 (1 始まり)
        name: sequence
        nullable: false
        type: integer
      - description: イベント種別 (予約・順位繰り上げ・取り置き・受取・取消)
        enum:
          - reserved
          - position_advanced
          - held
          - fulfilled
          - cancelled
        name: event_type
        nullable: false
        type: string
      - description: 遷移前の状態 (予約時は NULL)
        enum:
          - waiting
          - on_hold
          - fulfilled
          - cancelled
        name: from_status
        nullable: true
        type: string
      - description: 遷移後の状態
        enum:
          - waiting
          - on_hold
          - fulfilled
          - cancelled
        name: to_status
        nullable: false
        type: string
      - description: 発生日時
        name: occurred_at
        nullable: false
        type: datetime
      - description: 操作した司書 (利用者本人やシステム起因は NULL)
        name: actor_librarian_id
        nullable: true
        type: uuid
      - description: 付帯情報 (JSON 文字列。順位の変化など)
        name: payload
        nullable: true
        type: text
    description: 予約の状態変化と予約順位の変化の履歴 (追記のみ。更新・削除しない)。
    foreign_keys:
      - columns:
          - reservation_id
        on_delete: RESTRICT
        references:
          columns:
            - reservation_id
          table: reservations
      - columns:
          - actor_librarian_id
        on_delete: RESTRICT
        references:
          columns:
            - librarian_id
          table: librarians
    indexes:
      - columns:
          - reservation_id
          - sequence
        name: reservation_events_reservation_sequence_key
        unique: true
    name: reservation_events
    primary_key:
      - event_id
  - columns:
      - description: 予約 ID
        name: reservation_id
        nullable: false
        type: uuid
      - description: 予約した利用者
        name: patron_id
        nullable: false
        type: uuid
      - description: 予約対象の書籍 (ISBN は books から引く)
        name: book_id
        nullable: false
        type: uuid
      - description: 取り置き対象の蔵書 (取り置き前は NULL)
        name: held_copy_id
        nullable: true
        type: uuid
      - description: 予約日時
        name: reserved_at
        nullable: false
        type: datetime
      - description: 予約順位 (待機中のみ。取り置き以降は NULL)
        name: queue_position
        nullable: true
        type: integer
      - description: 予約の状態 (待機中・取り置き中・受取済み・取消済み)
        enum:
          - waiting
          - on_hold
          - fulfilled
          - cancelled
        name: status
        nullable: false
        type: string
      - description: 取り置き開始日 (取り置き前は NULL)
        name: hold_started_on
        nullable: true
        type: date
      - description: 有効な予約 (待機中・取り置き中) のとき patron_id と book_id を連結した値、それ以外は NULL。同じ利用者・同じ書籍の有効な予約を 1 件に制限する (ADR 0005)
        name: active_key
        nullable: true
        type: string
      - description: 最後に反映した reservation_events の sequence (楽観ロックに使う)
        name: version
        nullable: false
        type: integer
      - description: 更新日時
        name: updated_at
        nullable: false
        type: datetime
    description: 予約の現在値スナップショット。状態変化と予約順位の繰り上げは reservation_events に追記し、同じトランザクションで本表を更新する。
    foreign_keys:
      - columns:
          - patron_id
        on_delete: RESTRICT
        references:
          columns:
            - patron_id
          table: patrons
      - columns:
          - book_id
        on_delete: RESTRICT
        references:
          columns:
            - book_id
          table: books
      - columns:
          - held_copy_id
        on_delete: RESTRICT
        references:
          columns:
            - copy_id
          table: copies
    indexes:
      - columns:
          - active_key
        name: reservations_active_key_key
        unique: true
      - columns:
          - book_id
          - status
          - queue_position
