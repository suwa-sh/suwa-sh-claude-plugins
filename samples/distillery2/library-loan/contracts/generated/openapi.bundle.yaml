components:
  parameters:
    BookId:
      description: 書籍ID
      in: path
      name: bookId
      required: true
      schema:
        $ref: "#/components/schemas/BookId"
    IdempotencyKey:
      description: 利用者が行う更新系 API の再送重複を防ぐキー (ADR-0005)。 同じキーの再送では副作用を重複させず、初回と同じ応答を返す。
      example: 7f3c2a9e-5b1d-4c8e-9f0a-2d6b8e4c1a37
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        minLength: 8
        type: string
    LoanId:
      description: 貸出ID
      in: path
      name: loanId
      required: true
      schema:
        $ref: "#/components/schemas/LoanId"
    NotificationId:
      description: 通知ID
      in: path
      name: notificationId
      required: true
      schema:
        $ref: "#/components/schemas/NotificationId"
    Page:
      description: 取得するページ番号 (1 始まり)
      in: query
      name: page
      required: false
      schema:
        default: 1
        minimum: 1
        type: integer
    PageSize:
      description: 1 ページの件数
      in: query
      name: pageSize
      required: false
      schema:
        default: 20
        maximum: 100
        minimum: 1
        type: integer
    PatronNumber:
      description: 利用者番号
      in: path
      name: patronNumber
      required: true
      schema:
        $ref: "#/components/schemas/PatronNumber"
    ReservationId:
      description: 予約ID
      in: path
      name: reservationId
      required: true
      schema:
        $ref: "#/components/schemas/ReservationId"
  responses:
    BadRequest:
      content:
        application/problem+json:
          examples:
            badRequest:
              value:
                detail: 入力項目を確認してください
                errors:
                  - field: title
                    message: タイトルは必須です
                status: 400
                title: 入力内容に誤りがあります
                type: "https://library.example/problems/validation-error"
          schema:
            $ref: "#/components/schemas/ValidationProblem"
      description: 入力の形式が不正 (必須項目の欠落・型の不一致など)
    Conflict:
      content:
        application/problem+json:
          examples:
            conflict:
              value:
                detail: 最新の状態を取得してからやり直してください
                status: 409
                title: 他の操作と競合しました
                type: "https://library.example/problems/conflict"
          schema:
            $ref: "#/components/schemas/Problem"
      description: 楽観ロックの版番号の不一致、または業務ルール (状態) により操作できない
    Forbidden:
      content:
        application/problem+json:
          examples:
            forbidden:
              value:
                status: 403
                title: この操作を行う権限がありません
                type: "https://library.example/problems/forbidden"
          schema:
            $ref: "#/components/schemas/Problem"
      description: ロールまたは本人確認の認可で拒否された
    NotFound:
      content:
        application/problem+json:
          examples:
            notFound:
              value:
                status: 404
                title: 対象が見つかりません
                type: "https://library.example/problems/not-found"
          schema:
            $ref: "#/components/schemas/Problem"
      description: 対象が存在しない (削除済みを含む)
    Unauthorized:
      content:
        application/problem+json:
          examples:
            unauthorized:
              value:
                status: 401
                title: ログインが必要です
                type: "https://library.example/problems/unauthorized"
          schema:
            $ref: "#/components/schemas/Problem"
      description: アクセストークンが無い、または無効
  schemas:
    BookId:
      description: 書籍ID
      format: uuid
      type: string
    BookStatus:
      description: 書籍状態。available=在庫あり, on_loan=貸出中, on_hold=予約待ち (取置), deleted=削除済み
      enum:
        - available
        - on_loan
        - on_hold
        - deleted
      type: string
    CreateLoanRequest:
      additionalProperties: false
      description: 貸出登録の入力。貸出日は業務日付、貸出期間と返却期限はサーバが決める
      properties:
        bookId:
          $ref: "#/components/schemas/BookId"
        patronNumber:
          $ref: "#/components/schemas/PatronNumber"
      required:
        - patronNumber
        - bookId
      type: object
    FieldError:
      properties:
        field:
          description: エラーの入力項目名
          type: string
        message:
          description: エラーの説明
          type: string
      required:
        - field
        - message
      type: object
    Genre:
      description: ジャンル。literature=文学, history=歴史, natural_science=自然科学, social_science=社会科学, art=芸術, engineering=技術・工学, children=児童書, reference=参考図書
      enum:
        - literature
        - history
        - natural_science
        - social_science
        - art
        - engineering
        - children
        - reference
      type: string
    Isbn:
      description: ISBN (ハイフン無しの 10 桁または 13 桁)
      pattern: "^(97[89])?[0-9]{9}[0-9X]$"
      type: string
    Loan:
      description: 貸出
      properties:
        bookId:
          $ref: "#/components/schemas/BookId"
        dueOn:
          description: 返却期限。貸出日に貸出期間の日数を加えた日付
          format: date
          type: string
        loanId:
          $ref: "#/components/schemas/LoanId"
        loanPeriodDays:
          $ref: "#/components/schemas/LoanPeriodDays"
        loanedOn:
          description: 貸出日
          format: date
          type: string
        patronNumber:
          $ref: "#/components/schemas/PatronNumber"
        pickedUpReservationId:
          description: この貸出で受取済みにした予約の予約ID。取置中の予約に基づかない貸出では null
          oneOf:
            - $ref: "#/components/schemas/ReservationId"
            - type: "null"
        status:
          $ref: "#/components/schemas/LoanStatus"
      required:
        - loanId
        - bookId
        - patronNumber
        - loanedOn
        - loanPeriodDays
        - dueOn
        - status
      type: object
    LoanId:
      description: 貸出ID
      format: uuid
      type: string
    LoanPeriodDays:
      description: 貸出期間 (日数)
      enum:
        - 7
        - 14
        - 21
      type: integer
    LoanStatus:
      description: 貸出状態。on_loan=貸出中, overdue=延滞, returned=返却済み
      enum:
        - on_loan
        - overdue
        - returned
      type: string
    MediaType:
      description: 媒体種別。paper=紙, electronic=電子 (将来の電子書籍に備える)
      enum:
        - paper
        - electronic
      type: string
    NotificationId:
      description: 通知ID
      format: uuid
      type: string
    NotificationStatus:
      description: 通知状態。pending=送信待ち, sent=送信済み, failed=送信失敗
      enum:
        - pending
        - sent
        - failed
      type: string
    NotificationType:
      description: 通知種別。hold_ready=取置通知, reminder=返却期限リマインド, overdue_notice=延滞督促
      enum:
        - hold_ready
        - reminder
        - overdue_notice
      type: string
    PageMeta:
      description: 一覧取得のページング情報
      properties:
        page:
          minimum: 1
          type: integer
        pageSize:
          minimum: 1
          type: integer
        totalCount:
          minimum: 0
          type: integer
      required:
        - page
        - pageSize
        - totalCount
      type: object
    PatronCategory:
      description: 利用者区分。general=一般, child=児童, student=学生 (貸出期間の決定に使う)
      enum:
        - general
        - child
        - student
      type: string
    PatronNumber:
      description: 利用者番号
      examples:
        - P000123
      pattern: "^P[0-9]{6}$"
      type: string
    PatronStatus:
      description: 利用者状態。active=有効, deleted=削除済み
      enum:
        - active
        - deleted
      type: string
    Problem:
      description: RFC 9457 Problem Details。全 API 共通のエラー型
      properties:
        code:
          description: 業務エラーコード (例 book-on-loan, patron-has-active-loans)
          type: string
        detail:
          description: この発生に固有の説明
          type: string
        instance:
          description: この発生を識別する URI 参照
          type: string
        status:
          description: HTTP ステータスコード
          maximum: 599
          minimum: 400
          type: integer
        title:
          description: 問題の短い要約 (利用者に表示できる文言)
          type: string
        type:
          description: 問題の種類を識別する URI
          format: uri
          type: string
      required:
        - type
        - title
        - status
      type: object
    ReminderTiming:
      description: リマインド時期。three_days_before=返却期限の3日前, one_day_before=返却期限の1日前
      enum:
        - three_days_before
        - one_day_before
      type: string
    ReportPeriod:
      description: 集計期間。daily=日次, weekly=週次, monthly=月次, yearly=年次, custom=任意期間
      enum:
        - daily
        - weekly
        - monthly
        - yearly
        - custom
      type: string
    ReservationId:
      description: 予約ID
      format: uuid
      type: string
    ReservationStatus:
      description: 予約状態。waiting=予約中, on_hold=取置中, picked_up=受取済み, cancelled=取消済み
      enum:
        - waiting
        - on_hold
        - picked_up
        - cancelled
      type: string
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - properties:
            errors:
              items:
                $ref: "#/components/schemas/FieldError"
              type: array
          required:
            - errors
          type: object
      description: 入力検証エラー。項目ごとのエラーを持つ Problem
    Version:
      description: 楽観ロックの版番号 (書籍単位)。更新時に取得時の値を送る
      minimum: 1
      type: integer
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: OIDC IdP が発行するアクセストークン。利用者向けと司書向けは別の OIDC クライアントで発行する。 トークンのクレームからロール (patron / staff) と利用者番号 (patron のみ) を取り出す。
      scheme: bearer
      type: http
info:
  description: backend-api が提供し、frontend-patron (利用者向け) と frontend-staff (司書向け) が利用する API。 認証は OIDC 準拠の外部 IdP が発行するアクセストークン (Bearer) で行う (ADR-0006)。 認可はロール (司書 / 利用者) と本人確認 (利用者番号の一致) を usecase 層で判定する。 エラーは RFC 9457 の Problem Details (application/problem+json) で返す。
  title: 図書館蔵書管理システム API
  version: 0.1.0
openapi: 3.1.0
paths:
  /loans:
    post:
      description: 司書が利用者番号と書籍IDを指定して貸出を登録する (司書ロールのみ)。 貸出可否条件 (書籍状態・取置中の予約・利用者状態・延滞中の貸出) を満たす場合だけ貸出を記録する。 返却期限は貸出日 (業務日付) に利用者区分と媒体種別から決まる貸出期間 (7・14・21 日) を加えて算出する。 書籍状態と貸出状態を貸出中にし、取置中の予約 (予約順 1 位) に基づく貸出では予約状態を受取済みにする。 同じ書籍への同時登録は書籍単位の楽観ロックで直列化し、競合時は 409 (code=version-conflict) を返す。 利用者区分ごとの貸出上限冊数は値が未決のため未定義 (.distillery/runs/register-loan/issues/20260924_120001_loan-limit-count.md)。
      operationId: createLoan
      requestBody:
        content:
          application/json:
            examples:
              badRequest:
                summary: 書籍IDが無い
                value:
                  patronNumber: P000123
              bookDeleted:
                summary: 削除済みの書籍を指定した
                value:
                  bookId: 44444444-4444-4444-8444-444444444444
                  patronNumber: P000123
              bookOnHoldForAnother:
                summary: 他の利用者のために取置中の書籍を指定した
                value:
                  bookId: 22222222-2222-4222-8222-222222222222
                  patronNumber: P000456
              bookOnLoan:
                summary: 他の利用者に貸出中の書籍を指定した
                value:
                  bookId: 33333333-3333-4333-8333-333333333333
                  patronNumber: P000123
              heldForPatron:
                summary: 取置中の予約を持つ予約順 1 位の利用者に取置の書籍を貸し出す
                value:
                  bookId: 22222222-2222-4222-8222-222222222222
                  patronNumber: P000123
              patronDeleted:
                summary: 削除済みの利用者を指定した
                value:
                  bookId: 11111111-1111-4111-8111-111111111111
                  patronNumber: P000999
              patronHasOverdueLoan:
                summary: 延滞中の貸出を持つ利用者を指定した
                value:
                  bookId: 11111111-1111-4111-8111-111111111111
                  patronNumber: P000456
              success:
                summary: 在庫ありの書籍を有効な利用者に貸し出す
                value:
                  bookId: 11111111-1111-4111-8111-111111111111
                  patronNumber: P000123
            schema:
              $ref: "#/components/schemas/CreateLoanRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              examples:
                heldForPatron:
                  value:
                    bookId: 22222222-2222-4222-8222-222222222222
                    dueOn: 2026-10-15
                    loanId: 6e3d8c2b-9f5a-4b4c-8d7e-2f3a4b5c6d7e
                    loanPeriodDays: 14
                    loanedOn: 2026-10-01
                    patronNumber: P000123
                    pickedUpReservationId: 7f4e9d3c-0a6b-4c5d-9e8f-3a4b5c6d7e8f
                    status: on_loan
                success:
                  value:
                    bookId: 11111111-1111-4111-8111-111111111111
                    dueOn: 2026-10-15
                    loanId: 5d2c7b1a-8e4f-4a3b-9c6d-1e2f3a4b5c6d
                    loanPeriodDays: 14
                    loanedOn: 2026-10-01
                    patronNumber: P000123
                    pickedUpReservationId: null
                    status: on_loan
              schema:
                $ref: "#/components/schemas/Loan"
          description: 貸出を登録した
        "400":
          content:
            application/problem+json:
              examples:
                badRequest:
                  value:
                    detail: 入力項目を確認してください
                    errors:
                      - field: bookId
                        message: 書籍IDは必須です
                    status: 400
                    title: 入力内容に誤りがあります
                    type: "https://library.example/problems/validation-error"
              schema:
                $ref: "#/components/schemas/ValidationProblem"
          description: 入力の形式が不正 (必須項目の欠落・型の不一致など)
        "401":
          description: アクセストークンが無い、または無効。本文は Problem (application/problem+json、共通の Unauthorized と同じ)。 認証はリクエスト本文で起こせないため契約テストの対象外とし、受入シナリオと実装側のテストで確かめる
        "403":
          description: 司書ロールでない (利用者ロールなど)。本文は Problem (application/problem+json、共通の Forbidden と同じ)。 認可はリクエスト本文で起こせないため契約テストの対象外とし、受入シナリオ「利用者は貸出を登録できない」で確かめる
        "404":
          content:
            application/problem+json:
              examples:
                bookDeleted:
                  value:
                    code: book-not-found
                    detail: 指定した書籍は削除済みのため貸し出せません
                    status: 404
                    title: 対象が見つかりません
                    type: "https://library.example/problems/not-found"
                patronDeleted:
                  value:
                    code: patron-not-found
                    detail: 指定した利用者は削除済みのため貸し出せません
                    status: 404
                    title: 対象が見つかりません
                    type: "https://library.example/problems/not-found"
              schema:
                $ref: "#/components/schemas/Problem"
          description: 指定した書籍または利用者が存在しない (削除済みを含む)
        "409":
          content:
            application/problem+json:
              examples:
                bookOnHoldForAnother:
                  value:
                    code: book-on-hold-for-another-patron
                    detail: 指定した書籍は他の利用者のために取置中です
                    status: 409
                    title: この書籍は貸し出せません
                    type: "https://library.example/problems/loan-not-allowed"
                bookOnLoan:
                  value:
                    code: book-on-loan
                    detail: 指定した書籍は貸出中です
                    status: 409
                    title: この書籍は貸し出せません
                    type: "https://library.example/problems/loan-not-allowed"
                patronHasOverdueLoan:
                  value:
                    code: patron-has-overdue-loan
                    detail: 延滞中の貸出があるため貸し出せません
                    status: 409
                    title: この利用者には貸し出せません
                    type: "https://library.example/problems/loan-not-allowed"
              schema:
                $ref: "#/components/schemas/Problem"
          description: 貸出可否条件を満たさない、または同じ書籍への同時登録と競合した。 code は book-on-loan / book-on-hold-for-another-patron / patron-has-overdue-loan / version-conflict
      summary: 貸出を登録する
      tags:
        - loans
security:
  - bearerAuth: []
servers:
  - description: backend-api (フロントと同一オリジンから相対パスで呼ぶ)
    url: /api/v1
