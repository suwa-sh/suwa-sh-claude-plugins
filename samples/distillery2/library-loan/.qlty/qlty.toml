# distillery2 genQlty.js が生成した qlty の設定 (土台: `qlty init` の提案)。
# 上乗せ: biome の版固定 / 生成物・vendored の除外 / `**/db/**` `**/config/**` は除外しない / lockfile は除外しない / features は test / radarlint は low。
# ゲートは commands.quality (.distillery/config.yaml)。整形は `qlty fmt --all`。`qlty check --fix` は使わない。
# 無視は [[ignore]] / [[triage]] で書く ([[exclude]] に rules は書けない)。仕様: https://docs.qlty.sh/cli/qlty-toml
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  "**/*.min.*",
  ".distillery/**",
  "packages/ui/**",
  "packages/contracts/**",
  "contracts/generated/**",
  "docs/design/storybook-app/**",
  "docs/design/screenshots/**",
  "**/test/contract/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
  "features/**",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "biome"
version = "2.2.5"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

[[plugin]]
name = "osv-scanner"
