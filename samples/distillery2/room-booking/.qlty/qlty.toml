# distillery2 genQlty.js が生成した qlty の設定 (土台: `qlty init` の提案)。
# 上乗せ: biome の版固定 / 生成物・vendored の除外 / `**/db/**` `**/config/**` は除外しない / lockfile は除外しない / features は test / radarlint は low。
# ゲートは commands.quality (.distillery/config.yaml)。整形は `qlty fmt --all`。`qlty check --fix` は使わない。
# 無視は [[ignore]] / [[triage]] で書く ([[exclude]] に rules は書けない)。仕様: https://docs.qlty.sh/cli/qlty-toml
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  "**/*.min.*",
]
# 生成物の除外はファイル末尾の [[exclude]] にある (trufflehog 以外に限る手書きの回避)

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
  "features/**",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "biome"
version = "2.2.5"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

[[plugin]]
name = "osv-scanner"

# 手で足した回避 (distillery2 の不具合の回避。genQlty.js は生成物を全プラグイン共通の exclude_patterns に入れるので、
# 秘密の検出 (trufflehog) まで生成物を見なくなる。ADR 0012 はリポ全体の秘密の検出を決めている)。
# 生成物の除外を trufflehog 以外のプラグインに限る。プラグインを足したらこの plugins にも足す。
# genQlty.js --refresh がプラグインを足すと exclude_patterns に生成物が戻るので、そのときはこのブロックに移し直す。
# トップレベルのキーより後 (ファイル末尾) に置く。前に置くと後続のキーがこの表に入ってしまう。
[[exclude]]
plugins = ["actionlint", "biome", "ripgrep", "zizmor", "osv-scanner"]
file_patterns = [
  ".distillery/**",
  "packages/ui/**",
  "packages/contracts/**",
  "contracts/generated/**",
  "docs/design/storybook-app/**",
  "docs/design/screenshots/**",
  "**/test/contract/**",
]
