asks:
  - id: idp-outage-status
    kind: choice
    question: "認証基盤に届かず鍵の一覧を取れないとき、空き状況の照会に何を返すか"
    options:
      - label: "500 のシステムのエラー"
        impact: "画面は時間をおいて試すよう示し、サインインのやり直しに進まない。gateway で鍵の一覧の取得の失敗だけを例外にする変更が要る"
      - label: "401 のまま"
        impact: "今の実装のまま。認証基盤の障害でも画面がサインインのやり直しに進む"
    recommended: "500 のシステムのエラー"
    reason: "ADR 0015 が 401 にするのはトークンの署名・発行者・宛先・期限が合わないときで、ADR 0023 は外部の失敗を含む想定外をシステムのエラーにする。障害を認証の失敗として返すと、利用者が直せない操作 (サインインのやり直し) を促す"
