    note: "直した後に回し直したゲート (gates.json started_at 2026-11-10T04:13:21Z、result pass・all_recorded: true) を読んだ。uc-bdd 14 シナリオ 89 step・acceptance-api 12 シナリオ 73 step がすべて passed で pending・skipped は無い。SPEC-001-01 の受入基準 12 件は feature の @acceptance:SPEC-001-01-1〜12 で 1 対 1 に覆われる。トレース 14 本の経路 (200 系は TokenVerifier.verify → rooms の SELECT → reservations の SELECT → execute → 200、422 系は DB を読まずに 422、書き込み無し) は前回の検証と同じ。今回の変更 (実装のレビュー round1 指摘 1 の修正) は httpApp.ts:53-66 の UNMATCHED_ROUTE_HANDLER と handlerOf の既定値だけで、契約にある経路の応答・検証の順・エラー文言は変わっていない。単体 unit.backend-api.json は 84 件 pass で、追加の 2 件 (httpApp.test.ts:131-147 契約に無い経路で始まりと終わりのログが unmatchedRoute を持ち 404、149-163 契約に無い経路で認証できないとき終わりのログが unmatchedRoute で 401) は実際の HTTP の要求と記録するロガーで確かめ、常に真の assert ではない。これで ADR 0011 (tier-backend.md:72 ログはハンドラの名前を必ず持つ) を契約に無い経路でも満たす。ただし契約の経路と大文字小文字・末尾のスラッシュだけが違う要求は Express が契約のハンドラで処理するのにログのハンドラ名が unmatchedRoute になる (V-001)。要求 ↔ 実装・契約 ↔ 実装・ルール ↔ 実装は前回の根拠 (timeRange.ts・roomAvailability.ts・repository・problem.ts・timeRangeRequest.ts・joseTokenVerifier.ts) から変わっていない。前提ファイルの target の行番号は httpApp.ts の編集でずれている (A-003 :110 → 実体 116-140、A-005 :85 → 93-96、A-014 :193 → 198-202、A-016 :144 → 148-156、A-018 :66 → 74-88)。下の evidence は今の行で書く。他 UC への波及: 該当なし (共有の候補はなし。uc-index に載る UC はこの UC だけ)。手順の注記: 書き直す前の findings ファイル (前回の検証) を読んだため、観点 1 の前に前回時点の前提の一覧を目にしている。前提ファイル自体は観点 1 の後に開き、変わったのが A-020 だけであることを確かめた。"
