      attempt 2 (backend-api だけ修正。frontend のコードは attempt 1 から変わらない: oidcTokenProvider.ts:85-148・AuthCallbackScreen.tsx・initialSlot.ts・showRoomAvailability.ts を読み、attempt 1 の findings の行番号と一致)。
      gates.json は 2026-11-10T04:07:56Z 開始で all_recorded: true、5 段 pass (frontend の contract は not a provider で skipped)。
      シナリオ: SPEC-001-01 の受入基準 12 件に @acceptance:SPEC-001-01-1〜12 が 1 対 1。uc-bdd は 14 scenarios (14 passed) / 89 steps、acceptance_api は 12 scenarios (12 passed) / 73 steps (gates.json の output_tail)。pending/skipped 無し。
      トレース: 14 本すべてに showRoomAvailability の call と http.out が各 1 つあり、画面の入口関数を通って API を呼んでいる。
      単体: unit.frontend.json は 63 件全 pass (failed 0・pending 0・todo 0)。
      認証基盤の障害で API が 500 を返す変更との整合: backend の httpApp.ts:120,179 は検証器の例外を sendProblem(INTERNAL_ERROR) で 500 にし、契約の slice も 500 を components.responses.InternalError (Problem) にしている。
      frontend は authorizedFetch.ts:16 で 401 のときだけ signIn を呼ぶので、500 ではサインインへ送らない。認証基盤が落ちていても、サインインへ送り続ける繰り返しにはならない。
      showRoomAvailability.ts:34 は 200 でない応答の本文の code (INTERNAL_ERROR) をそのまま画面のエラーの状態にし、packages/ui の errorMessages.ts:55 に INTERNAL_ERROR の理由の文がある (ADR 0008/0023「契約のエラー型の code に応じた理由の文を表示する」を満たす)。
      本文が無い 500 と通信の失敗も INTERNAL_ERROR になる (単体テスト「APIがcodeの無いエラーを返した場合_INTERNAL_ERRORを返すこと」「応答を受け取れなかった場合_INTERNAL_ERRORを返すこと」が pass)。frontend の扱いは backend の変更と合う。
      ルール: ADR 0014/0015/0019/0020/0021 のトークン・サインインの規則は oidcTokenProvider.ts:95-114 と authorizedFetch.ts:10-18 にある (attempt 1 と同じ)。
      契約: API は roomAvailabilityApi.ts の生成クライアントを通して呼び、fetch を直書きしていない。
      他 UC への波及: 該当なし (呼び出し側が渡した共有の候補は「なし」。frontend の変更は attempt 1 から無く、contracts/uc-index.yaml に載る UC はこの 1 件だけ)。
