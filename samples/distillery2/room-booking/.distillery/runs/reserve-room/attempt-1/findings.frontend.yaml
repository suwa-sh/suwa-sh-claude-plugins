    title: "予約の画面に会議室を読めない状態が無い"
    detail: "予約の画面の story と screens.yaml の variants に、会議室の一覧 (listRooms) を読めなかった状態が無い。会議室が未入力だと入力の部品が送信を止めるので、読み直しの操作が無いと画面を読み込み直すまで予約を続けられない (実装のレビューの指摘 2)。開発ルールは story に無い画面状態を実装で足すことを禁じ、戻し先 foundation の課題にすると決めている"
    evidence: "docs/rules/tier-frontend.md:7,15,16; packages/ui/stories/ReserveRoom.stories.tsx; docs/design/screens.yaml:31-58; reviews/implementation-frontend/1/round1.md 指摘 2; apps/frontend/src/screens/ReserveRoom/ReserveRoomScreen.tsx:178-189"
    recommended_fix: "ReserveRoom.stories.tsx に会議室を読めない variant (例 RoomsUnavailable。INTERNAL_ERROR の通知と画面部品 Button の『会議室の一覧を読み直す』を置く) を足し、screens.yaml#ReserveRoom の variants に載せる。足した後に frontend がその story どおりに組み直す"
    resume_from: implementation
