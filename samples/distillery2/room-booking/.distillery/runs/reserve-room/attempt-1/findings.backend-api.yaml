  - id: A-002
    tier: backend-api
    assumption: "予約の前にアプリで重なる予約を読んで確かめることはせず、30 分枠の占有の主キー (room_slot_occupancies_pkey) の違反 (SQLSTATE 23505) だけを repository が 'overlaps' の値で返す。ほかの一意制約の違反 (予約 ID の重複など) は重なりにせず、システムのエラーのまま投げる"
    target: "apps/backend-api/src/repository/reservationRepository.ts:140"
    category: persistence
    verified_category: persistence
    verdict: spec_absent
    finding_id: F-002
    evidence: "ADR 0003 は事前の確認だけに頼らず最後の砦を DB の一意制約にすること、ADR 0023 は一意制約の違反を repository が値で返すことを決めるが、事前の確認を省くことと、制約の名前で占有の違反を見分けることは決めていない"
  - id: A-003
    tier: backend-api
    assumption: "予約の応答の startAt・endAt を Asia/Tokyo の時差付きの RFC 3339 (例 2099-11-10T10:00:00+09:00) で返す。時差は固定の +09:00 でなく Intl のタイムゾーンの表から求める"
    target: "apps/backend-api/src/presentation/businessDateTime.ts:22"
    category: data_format
    verified_category: data_format
    verdict: consistent
    finding_id: F-003
    evidence: "契約の info に「日時は時差付きの RFC 3339 で受け渡し、日付と 30 分刻みの判定は業務のタイムゾーン (Asia/Tokyo) で行う」、DateTime の例が +09:00、200 の例 resent / resent_after_start は x-test-requests の expect に startAt を持ち +09:00 の表記を契約テストで確かめる。ADR 0003 が業務のタイムゾーンを Asia/Tokyo に決めている"
  - id: A-004
    tier: backend-api
    assumption: "予約 ID とイベント ID を composition root が node:crypto の randomUUID (uuid v4) で採番し、usecase と repository に採番の関数として渡す"
    target: "apps/backend-api/src/app.ts:58"
