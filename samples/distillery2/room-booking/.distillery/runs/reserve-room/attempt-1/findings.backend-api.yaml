    verified_category: data_format
    verdict: spec_absent
    finding_id: F-004
    evidence: "契約 ReservationId は format uuid だけで版を決めていない。rdb-slice の reservations.reservation_id・reservation_events.event_id に既定値の定めが無い。注入できる形にすることは ADR 0013 と固定指示の範囲"
  - id: A-005
    tier: backend-api
    assumption: "PAST_TIME_SLOT・ROOM_NOT_FOUND・SLOT_OVERLAPS の Problem に、利用者が直せる言葉の detail (例 この会議室のこの時間帯は予約済みです。別の時間帯か別の会議室を指定してください) を付ける。title は契約の例のとおり"
    target: "apps/backend-api/src/presentation/problem.ts:45"
