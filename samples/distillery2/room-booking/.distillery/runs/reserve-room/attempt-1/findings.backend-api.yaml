    evidence: "ADR 0011 は usecase が出す業務のイベントを予約した・取り消したと業務のエラーに決め、送り直しの扱いは決めていない。ログの項目は ADR 0011 の必須項目 (相関 ID・ハンドラ・社員 ID) と「予約した」のログと同じで、common.md の秘密と本文全体を出さない規則に反する項目は無い"
