  - id: D2
    topic: 予約が成立しない場合の Then
    choice: "受入基準の文に加えて「予約は記録されない」を確かめる (SPEC-002-03-2・03-3 と、取り消した自分の予約を開始後に送るシナリオにも同じく付ける)"
    reason: 失敗時に変わらない状態を具体的に書く規則に合わせる。前回の判断を引き継ぐ
  - id: D3
    topic: 既存の SPEC-002-01・02 のシナリオ
    choice: "直さない (受入基準 12 件の文面は変わっておらず、変わったのは仕様の文だけ)。機能の説明文にだけ送り直しの決まりと判定の順序を足した"
    reason: "requirements.yaml の受入基準の文と既存シナリオの前提・操作・結果を 1 件ずつ照らし合わせ、すべて一致した"
  - id: D4
    topic: 受入基準以外に足したシナリオ
    choice: "仕様の文にそのまま書かれている 2 件だけ足す (終了時刻を過ぎた後の送り直しは成立済みの予約を示す / 取り消した自分の予約と同じ内容で開始時刻を過ぎていれば過去の時間帯として断る)"
    reason: SPEC-002-03 の仕様の文と条件.tsv の予約時刻の妥当性・予約の重なり判定に明記されている。送り直しでない場合の過去と重なりの判定順は要求に無いので書かない
  - id: D5
    topic: 送り直しの結果の Then
    choice: "受入基準の文を切らずに使い、仕様の「すでに成立しているその予約を示す」から「示される予約は成立済みのその予約である」を足す。SPEC-002-03-5 の Then は文言を変えずに 3 つの step に分けた"
    reason: 観測できる結果 (示される予約が既存のものと同じ) で新しい予約が作られていないことを確かめる。分けた各 step は原文の文言のまま
  - id: D6
    topic: step 文のそろえ方
    choice: "既存の「会議室Aの … に社員Aの予約がある」「予約は成立せず、時間帯が既存の予約と重なることが示される」「その予約は予約済みになる」を再利用し、新しい文は送り直しの前提・操作・結果と取り消した自分の予約の前提だけにした"
    reason: 同じ意味の step は同じ文にする規則に合わせる
  - id: D7
    topic: "@browser"
    choice: "付けない (0 件)"
    reason: "ADR 0007 で受入と UC BDD は API ドライバで回す"
  - id: D8
    topic: 他 UC の振る舞い
    choice: "該当なし。17 件すべてこの UC のシナリオで対応づけた"
