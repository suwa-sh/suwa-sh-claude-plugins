schema_version: distillery2.handoff/v1
step: scenario
asks: []
upstream_issues: []
refutations:
  - finding: 指摘 1
    result: accepted
    reason: 条件.tsv の「予約の重なり判定」と SPEC-002-03 の仕様は、本人の有効な予約と会議室・日付・開始時刻・終了時刻がすべて同じことだけを送り直しの条件にしており、応答が届かなかったことは判定の条件ではなく背景 (「備え」) である。システムは応答が届いたかを知れないので、feature の説明が応答未達に限定して読めるのは要求と食い違う
    change: feature の説明を「応答が届いたかどうかに関わらず、自分の有効な予約とすべて同じ内容なら送り直し」に直し、節見出しを「自分の有効な予約と同じ内容の送り直し」に変え、応答を受け取った後 (応答未達の前提を付けない既存の予約) に同じ内容で送り直しても成立済みの予約が示されるシナリオを 1 件足した (受入基準タグ無しの補足シナリオ)。checkScenario は ok (25 シナリオ、受入基準 17 件すべて対応、missing 0)
decisions:
  - id: D1
    topic: 応答受領後の送り直しシナリオの前提の文
    choice: 既存の step「会議室Aの 2026-11-10 10:00-11:00 に社員Aの予約がある」を流用し、応答の届き方を前提に書かない
    reason: 同じ意味の step を同じ文に揃える規則に従い、応答の有無が判定に効かないことを前提の無さで示す
  - id: D2
    topic: 足したシナリオの受入基準タグ
    choice: "@acceptance タグを付けない補足シナリオにする"
    reason: SPEC-002-03 の受入基準 5 件はすでに対応済みで、足したのは条件.tsv の業務条件を網羅するための補足だから
