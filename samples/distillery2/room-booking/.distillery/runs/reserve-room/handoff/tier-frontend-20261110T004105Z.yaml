schema_version: distillery2.handoff/v1
step: tier
asks: []
upstream_issues: []
refutations: []
decisions:
  - id: D1
    topic: "予約の画面の入口関数"
    choice: "submitReservation(ReservationFormValue, ApiDeps) の形を保ち、要求は toDateTime で時差付きの開始と終了にし、201 は表示用の予約 (completed)、それ以外は契約の code (error) を返す"
    reason: "scaffold の red テストと UC BDD の申し送りがこの形を使う"
  - id: D2
    topic: "API 呼び出しの層"
    choice: "apps/frontend/src/api/reservationApi.ts に postReservation (reserveRoom) と fetchRooms (listRooms) を置き、authorizedFetch で包む。日時の変換は screens 側に置く"
    reason: "ADR 0013 / 0014 の層の分け方と、空き状況の roomAvailabilityApi.ts と同じ形にそろえる"
  - id: D3
    topic: "空き状況の画面からの予約の入口"
    choice: "照会した時間帯の開始が現在より前でなければ RoomAvailabilityList に onReserve を渡し、押すと URLSearchParams で roomId・date・startTime・endTime を付けて /reservations/new へ navigate する (A-001)"
    reason: "screens.yaml で RoomAvailability の uc_slugs に reserve-room があり、見本 Reservable / PastSlot がこの入口を決めている"
  - id: D4
    topic: "予約の画面の土台への載せ方"
    choice: "routes.tsx に /reservations/new の 1 行を足し、element の 2 つ目の引数の query を ReserveRoomScreen の初期値に渡す。土台 (App.tsx・vite.config.ts) は変えていない"
    reason: "ADR 0021 の結線が土台にすでにあり、それに載せるだけで足りる"
  - id: D5
    topic: "エラーのコードの取り出し"
    choice: "showRoomAvailability.ts の非公開の errorCodeOf を apps/frontend/src/screens/errorCodeOf.ts に移し、予約・会議室の一覧・空き状況で共有する"
    reason: "重複ロジックを作らない (common.md の推奨)"
  - id: D6
    topic: "二重の送信の防ぎ方"
    choice: "submitting で部品のボタンを押せなくするのに加え、useRef の送信中の印で描き直しの前の 2 回目の送信も止める"
    reason: "ADR 0005 のルール。単体テストで続けて 2 回送信しても予約の要求が 1 回であることを確かめた"
  - id: D7
    topic: "ゲートの整形"
    choice: "format_check で落ちた自分の新しいテスト 2 ファイルだけを、パスを指定して biome format --write で整形した"
    reason: "リポ全体の formatter は並列ティアの write-set を侵すため使わない"
