schema_version: distillery2.handoff/v1
step: requirements
asks: []
upstream_issues: []
refutations: []
decisions:
  - id: D1
    topic: "空き状況の照会で開始が終了より前でない・30 分刻みでない時間帯"
    choice: "照会を受け付けず、空き状況を表示せずに理由を示す (課題の推奨を採用。SPEC-001-01 に追記)"
    reason: "予約と同じ時間帯の入力部品を使うため、照会と予約で決まりをそろえるとティアと UC で食い違わない"
  - id: D2
    topic: "空き状況の照会で過去の時間帯を指定したとき"
    choice: "受け付けて、空き状況を表示する"
    reason: "見るだけなので害が無い (課題の推奨)"
  - id: D3
    topic: "RDRA の条件の持ち方"
    choice: "条件「予約時刻の妥当性」の名前は変えず、説明に「時間帯の形の検査は照会にも使い、過去の検査は予約だけに使う」と書き、照会の UC をこの条件につなぐ"
    reason: "条件を分けると ADR・画面部品・契約が参照する名前が変わる。説明で適用範囲を書けば後の UC も同じ条件を参照できる"
  - id: D4
    topic: "開始と終了が同じ時刻の照会"
    choice: "時間帯が正しくないとして受け付けない受入基準を明示した"
    reason: "「開始が終了より前でない」に同じ時刻が含まれることを実装者が取り違えないため"
  - id: D5
    topic: "受入基準でのエラーの書き方"
    choice: "コード名を書かず「時間帯が正しくないことが示される」「30 分刻みで指定することが示される」と振る舞いで書く"
    reason: "既存の予約の受入基準と同じ書き方。コードは ADR 0010 の INVALID_TIME_RANGE / NOT_ON_30_MINUTES が条件ごとに定義済みで、照会にもそのまま当てはまる"
  - id: D6
    topic: "空き状況画面の見本に 30 分刻みでない状態が無い"
    choice: "残った作業 (design) として、空き状況画面の見本に NotOn30Minutes の状態を足すよう返す"
    reason: "照会でも 30 分刻みでない時間帯を受け付けないと決めたため、画面に理由を出す状態が要る"
