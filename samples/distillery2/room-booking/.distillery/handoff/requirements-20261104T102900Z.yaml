schema_version: distillery2.handoff/v1
step: requirements
asks: []
upstream_issues: []
refutations:
  - finding: 指摘 1
    result: accepted
    reason: "取り消せる時期は前回の問い (cancel-deadline) で人が「開始時刻より前まで」と決めた。仕様は決定と一致しているが、確認材料に「(時期は仮)」が残っていた"
    change: "_review-summary.md の「取り消せる人と時期 (時期は仮)」から仮の表記を消し、決まったことの表を足した。SPEC-003-02 の仕様は決定どおりのため変えていない"
  - finding: 指摘 2
    result: accepted
    reason: "SPEC-002-01 の 30 分刻みと過去の時間帯の禁止が、RDRA の条件.tsv と予約の UC の説明に無かった"
    change: "条件.tsv に条件「予約時刻の妥当性」(開始が終了より前・30 分刻み・開始が現在より前でない・営業時間の制限なし) を足し、BUC.tsv で UC「会議室を予約する」に結び付け、UC の説明に両方の制約を書いた。SPEC-002-01 の affected_models にも同じ条件を足した。関連データ・ZeroOne・ビューを作り直し、lint と不整合チェックは 0 件"
  - finding: 指摘 3
    result: accepted
    reason: "予約が成立する基準に現在日時の Given が無く、2026-11-10 以降に実行すると過去の予約の禁止と衝突する"
    change: "SPEC-002-01 と SPEC-002-02 の全基準の Given に「現在が 2026-11-09 12:00 で」を足した。時刻に依存する SPEC-003-02 の取り消しの 2 基準も、現在を 2026-11-10 09:00 (開始前) と 10:30 (開始後) に固定した"
decisions:
  - id: D1
    topic: 過去の時間帯の判定の境目
    choice: "開始時刻が現在より前の予約を受け付けない (開始時刻が現在と同じかそれより後なら受け付ける)"
    reason: "決定は「過去は予約不可」で、利用中の時間帯の途中からの予約は要望に無い。取り消しの判定 (開始時刻より前まで) と同じ開始時刻を基準にそろえた"
  - id: D2
    topic: 受入基準の現在日時
    choice: "予約の基準は現在を 2026-11-09 12:00、取り消しの時刻に依存する基準は 2026-11-10 09:00 と 10:30 に固定した"
    reason: "実行する日によって期待結果が変わらないようにするため"
