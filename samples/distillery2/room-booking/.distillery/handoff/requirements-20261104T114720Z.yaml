schema_version: distillery2.handoff/v1
step: requirements
asks: []
upstream_issues: []
refutations: []
decisions:
  - id: D1
    topic: "外部システムの名前と群"
    choice: "外部システム群「社内基盤」に「社内の認証基盤」を置き、役割を社員のログインと本人の識別にした"
    reason: "課題の推奨の直し方どおりの名前と役割。群は 1 つしかないので社内の共通基盤としてまとめた"
  - id: D2
    topic: "UC と認証基盤のつなぎ方"
    choice: "4 つの UC それぞれに、イベント「社員の本人確認」を介して社内の認証基盤とつなぐ行を BUC.tsv に足した"
    reason: "RDRA の BUC 生成の決まりでは、外部システムはイベントを介して UC とつなぐ。どの UC も本人を識別してから使うため全 UC に付けた"
  - id: D3
    topic: "要求・仕様の影響モデル"
    choice: "各 UC の主な仕様 4 件の影響モデルに外部システム「社内の認証基盤」を足した。要求・仕様・受入基準の文は変えていない"
    reason: "RDRA と USDM の対応を揃えるため。ログインは外部に任せる前提で、このシステムの受入基準として確かめる振る舞いは増えない"
  - id: D4
    topic: "ログインの振る舞いを要求や UC に足すか"
    choice: "足さない。ログインの UC・受入基準は作らない"
    reason: "認証は社内の既存アカウントに OIDC で任せると決定の段で決めており、課題も外部システムの追加と関連付けだけを求めている。ログインしていない時の扱いは決定の段の全 API のトークン検証で決まっている"
