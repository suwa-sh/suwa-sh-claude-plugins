decisions:
  - id: D1
    topic: "応答が届かなかった予約の送り直しの扱い (課題に決定が無い)"
    choice: "自分の有効な予約と会議室・日付・開始時刻・終了時刻がすべて同じ送り直しは、新しい予約を作らず成立済みの予約を成立として示す"
    reason: "画面の再読み込み後でも効き、予約は増えないので二重予約の禁止と両立する。今のまま断る案は社員が予約できていないと誤解したまま"
  - id: D2
    topic: "一部だけ重なる自分の予約と、取り消した自分の予約と同じ内容の扱い"
    choice: "一部だけ重なる自分の予約はこれまでどおり重なるとして断る。取り消した自分の予約と同じ内容なら新しい予約として成立させる"
    reason: "送り直しとみなせるのは内容がまったく同じ有効な予約だけ。取消済みは有効な予約ではない"
  - id: D3
    topic: "送り直しの扱いを置く仕様"
    choice: "会議室の予約の要求に新しい仕様 SPEC-002-03 を足し、会議室を予約する UC の spec_ids に入れた。SPEC-002-02 には例外の一文を書き足した"
    reason: "1 つの UC で確かめられる単位に分けるため"
  - id: D4
    topic: "応答が届かなかったときの画面の文言"
    choice: "要求に足さない (今の表示のまま)。同じ内容で送り直せば成立済みかどうかが分かる"
    reason: "送り直しが安全になれば課題の誤解は解ける。文言の要求を足すと画面の見本の作り直しが要り、課題の範囲を超える"
