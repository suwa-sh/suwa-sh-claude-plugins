schema_version: distillery2.handoff/v1
step: requirements
asks: []
upstream_issues: []
refutations:
  - finding: "指摘 1"
    result: accepted
    reason: "予約者の名前を出さないことは決まっている (docs/adr/0006-authn-authz.md:27 と _review-summary.md の決まったこと) のに、空き状況の照会の仕様・受入基準・UC の説明に書かれていなかった"
    change: "requirements.yaml の SPEC-001-01 の仕様に予約者の名前を表示しないことを書き、社員Bが表示しても社員Aの名前が出ないことを確かめる受入基準を 1 件足した。BUC.tsv の UC「会議室の空き状況を照会する」の説明にも同じ文を足した"
  - finding: "指摘 2"
    result: accepted
    reason: "本人以外の取消の基準に現在時刻が無く、開始時刻後に確かめると期限切れで拒否されて基準を満たしてしまう。拒否理由も確かめていなかった"
    change: "SPEC-003-02 の本人以外の基準で現在を 2026-11-10 09:00 (開始前) に固定し、本人の予約ではないため取り消せないことが示されることを期待結果に足した。同じ穴がある取消済みの二重取消と開始後の取消の基準にも、現在時刻と拒否理由を足した"
decisions:
  - id: D1
    topic: "空き状況で予約者の名前を出さないことの書き方"
    choice: "仕様の文に「予約済みとだけ表示し、予約者の名前は表示しない」を足し、別の社員が表示しても予約者の名前が出ないことを確かめる受入基準を 1 件足した"
    reason: "レビューの直し方どおり。既存の「予約済み・空き」の基準は区分を確かめるもので、名前を出さないことは別の基準にした方が確かめやすい"
  - id: D2
    topic: "取り消しを受け付けない他の基準も直すか"
    choice: "指摘の本人以外の基準に加え、取消済みの二重取消と開始後の取消の基準にも現在時刻と拒否理由を足した"
    reason: "同じ穴 (別の理由で拒否されて基準を満たしてしまう) があり、3 つの拒否理由を互いに区別して確かめられるようにするため"
  - id: D3
    topic: "below-threshold の状態図の読み分け"
    choice: "直さない"
    reason: "閾値未満の low で、状態.tsv の遷移と説明は食い違っていない"
