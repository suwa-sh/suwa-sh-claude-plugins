schema_version: distillery2.handoff/v1
step: decide
asks: []
upstream_issues: []
refutations: []
decisions:
  - id: D1
    topic: "バックアップと復旧の決まりの置き場所"
    choice: "ADR 0003 を置き換えず、新しい ADR 0016 として足す"
    reason: "ADR 0003 はデータストアと二重予約の防止の決定で、バックアップを決めておらず、その決定は変わらないため"
  - id: D2
    topic: "障害の直前まで戻す方式"
    choice: "定期のフルバックアップに加え、更新の記録 (トランザクションログ) を絶えず別の保管場所へ残し、時点を指定して戻す"
    reason: "バックアップの間隔を縮めるだけでは消える予約が残り、二重予約の防止を守れないため"
  - id: D3
    topic: "復旧で二重予約を防ぐための追加の rules"
    choice: "応答は確定の後に返す・予約と占有の表を同じ時点へ戻す・再開前に占有が予約済みの枠と一致することを確かめる、の 3 つを rules に足す"
    reason: "知らせた予約が必ず復旧の範囲に入り、占有の表のずれで二重予約が起きないようにするため"
  - id: D4
    topic: "ADR 0016 の確信度"
    choice: "medium"
    reason: "目標復旧地点は人への確認の推奨で決定済みで、方式は PostgreSQL 互換の RDB の標準の仕組みで満たせるため"
