schema_version: distillery2.handoff/v1
step: requirements
asks: []
upstream_issues: []
refutations: []
decisions:
  - id: D1
    topic: "時間帯が日をまたげるか (課題に決定が無い)"
    choice: "課題の推奨の直し方で反映した。時間帯は指定した日付の中に収め、終了は翌日 0:00 まで可。日をまたぐ時間帯は照会も予約も受け付けない"
    reason: "情報「予約」が日付・開始時刻・終了時刻を同じ日の中で持つ形と合い、時間帯の検査を 1 か所で共有したまま照会・予約・取り消しにそろって効く"
  - id: D2
    topic: "翌日 0:00 の終了時刻の書き方"
    choice: "受入基準では「終了時刻 翌日 0:00 (24:00)」と書き、画面や契約での表し方は決めない"
    reason: "要求は振る舞いだけを決める。表し方は画面部品と契約の担当が決める"
  - id: D3
    topic: "課題の推奨の外の RDRA への反映"
    choice: "条件「予約時刻の妥当性」に加え、BUC.tsv の照会・予約の UC 説明と情報「予約」の説明にも同じ決まりを書いた"
    reason: "UC 説明が受け付けない場合を列挙しており、書かないと要求と食い違う"
  - id: D4
    topic: "取り消しと予約一覧の受入基準"
    choice: "変えない"
    reason: "どちらも時間帯を入力しない。既存の予約は予約時に検査済みのため日をまたがない"
  - id: D5
    topic: "画面の見本の終了時刻の選択肢"
    choice: "終了時刻に 24:00 (翌日 0:00) を選べるようにする作業を、残った作業 (design) として返す"
    reason: "見本の時刻の選択肢が 00:00-23:30 だけで、受け付けると決めた 23:30-翌日 0:00 を指定できない。書き込み範囲の外"
