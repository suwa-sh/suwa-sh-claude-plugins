schema_version: distillery2.handoff/v1
step: decide
asks: []
upstream_issues: []
refutations:
  - finding: "指摘 1"
    result: needs_info
    reason: "指摘は正しい (グレード表の A.4.1.1 は前日の最終バックアップまで、C.1.2.1 は日次のまま)。ただ直す場所は docs/nfr/ で、この派遣の書き込み範囲 (docs/adr/**) の外。グレード表を直す道が決定の差分に無い件は既にある課題 (docs/feedback/20261104_130354_decide_decide-refute-20261104T130111Z_nfr-external-idp.md) で扱うため二重に起票しない。直すときの値は ADR 0016 の影響の節に書いた (A.4.1.1 を障害の直前まで、C.1.2.1 に更新の記録を別の保管場所へ同期して残す)"
  - finding: "指摘 2"
    result: accepted
    reason: "指摘は正しい。rules は更新の記録を別の場所へ絶えず残すこととコミット後の応答だけを決めており、別の場所へ届く前に DB 本体を失うと成立を知らせた予約が戻せない"
    change: "ADR 0016 に、守る障害の範囲 (DB 本体のサーバと記憶装置の喪失) と許す損失 (無し) を書き、rules に「更新の記録を別の保管場所へ同期して書き、届いたことを確かめてから確定を完了とする。届かないときは予約の成立と取り消しを失敗で返す」を足した。応答の rule をこの確定の完了の後に返すように直し、却下した案に非同期の送り方を、影響に応答の遅れと別の保管場所が止まったときに予約できないことを足した。誤操作の取り消しで前の時点へ意図して戻す復旧は保証の範囲の外と明記した"
decisions:
  - id: D1
    topic: "ADR 0016 で守る障害の範囲と許す損失"
    choice: "DB 本体 (サーバと記憶装置) を失う障害を守る範囲とし、許す損失は無しにした。更新の記録を別の保管場所へ同期して書き、届いたことを確かめてから確定と応答をする"
    reason: "前の確認で目標復旧地点を障害の直前に決めており、二重予約の防止 (SPEC-002-02) は要望の中心。非同期では確定から送り終わるまでの間の予約が消える"
  - id: D2
    topic: "別の保管場所へ届かないときの扱い"
    choice: "予約の成立と取り消しを受け付けずに失敗を返す (空き状況の参照は続ける)"
    reason: "知らせた後に失う予約を作らないことを可用性より優先した。利用者は社内の数十人で、一時的に予約できないことの影響は小さい"
  - id: D3
    topic: "指摘 1 (グレード表の食い違い) の扱い"
    choice: "直さず、既にある課題 nfr-external-idp で扱うものとして refutations に書いた"
    reason: "docs/nfr/ は書き込み範囲の外で、グレード表を直す道が無い件は既に課題になっている"
