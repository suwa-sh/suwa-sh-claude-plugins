schema_version: distillery2.handoff/v1
step: requirements
asks: []
upstream_issues: []
refutations:
  - finding: "指摘 1"
    result: accepted
    reason: "送り直しの判定 (予約の重なり判定) と過去の時間帯の判定 (予約時刻の妥当性) の優先順位がどこにも書かれておらず、開始時刻後の送り直しの結果が実装の判定順で変わる。指摘どおり"
    change: "SPEC-002-03 に「送り直しの判定は過去の時間帯の判定より先に行い、開始時刻 (終了時刻) を過ぎていても成立済みの予約を示す。取消済みの自分の予約と同じ内容を開始後に送ったら新しい予約として扱い過去として断る」を書き、開始後 (現在 2026-11-10 10:30) の送り直しの受入基準を 1 件足した。SPEC-002-01 に同じ例外を書き足した。条件.tsv の「予約の重なり判定」「予約時刻の妥当性」と BUC.tsv の会議室を予約する UC の説明にも順番を書き、requirements.md・RDRA ビュー・関連データ・ZeroOne・確認材料を作り直した"
decisions:
  - id: D5
    topic: "同じ内容の送り直しの判定と過去の時間帯の判定の順番 (レビューの指摘 1)"
    choice: "送り直しの判定を先に行う。開始時刻を過ぎた後 (終了時刻を過ぎた後も含む) の送り直しも過去の時間帯として断らず、成立済みの予約を成立として示す"
    reason: "予約は成立しているので、断ると社員が未成立と誤解する。今回の送り直しの仕様が解こうとした問題が残らない。予約は増えないので二重予約の禁止とも両立する"
  - id: D6
    topic: "時間帯の形の検査 (開始が終了より前・30 分刻み・日付の中) と送り直しの判定の順番"
    choice: "時間帯の形の検査は送り直しの判定より前のままにする"
    reason: "成立済みの予約は形の検査を通っているので、形が正しくない送りは同じ内容の送り直しになり得ず、順番で結果は変わらない"
  - id: D7
    topic: "取り消した自分の予約と同じ内容を開始後に送ったときの扱い"
    choice: "新しい予約として扱い、過去の時間帯として断る"
    reason: "取消済みは有効な予約ではなく送り直しの対象にならない (D2 と同じ線)"
