# generated by d2-foundation genConfig.js — 生成物。config-schema.md が形の正本
schema_version: "2.0"
docs_root: docs
tiers:
  - id: frontend
    dir: apps/frontend
    kind: frontend
    lang: typescript
    provides: []
    consumes:
      - api
    commands:
      format_check: "npm run format:check -w apps/frontend"
      lint: npm run lint -w apps/frontend
      build: npm run build -w apps/frontend
      unit: "npm run test -w apps/frontend -- --run --reporter=json --outputFile={report}"
      security: (r=0; npm audit -w apps/frontend --audit-level=high --omit=dev || r=1; qlty check --no-fix --no-progress --no-upgrade-check --no-formatters --fail-level medium apps/frontend || r=1; exit $r)
  - id: backend-api
    dir: apps/backend-api
    kind: backend
    lang: typescript
    provides:
      - api
    consumes:
      - db
    commands:
      format_check: "npm run format:check -w apps/backend-api"
      lint: npm run lint -w apps/backend-api
      build: npm run build -w apps/backend-api
      unit: "npm run test -w apps/backend-api -- --run --reporter=json --outputFile={report}"
      security: (r=0; npm audit -w apps/backend-api --audit-level=high --omit=dev || r=1; qlty check --no-fix --no-progress --no-upgrade-check --no-formatters --fail-level medium apps/backend-api || r=1; exit $r)
      contract: "npm run test:contract -w apps/backend-api -- --run --reporter=json --outputFile={report}"
datastore_owner: backend-api
contracts:
  - id: api
    type: openapi
    source: openapi/openapi.yaml
    provider: backend-api
    consumers:
      - frontend
  - id: db
    type: rdb-schema
    source: db/rdb-schema.yaml
    provider: backend-api
    consumers: []
commands:
  arch_test: npx depcruise --config .dependency-cruiser.cjs --output-type err apps packages
  format: npx biome format .
  quality: qlty check --all --no-fix --no-progress --no-upgrade-check --no-formatters --fail-level medium
  secrets: qlty check --all --no-fix --no-progress --no-upgrade-check --no-formatters --fail-level medium --filter trufflehog
  uc_bdd: "npx cucumber-js --tags \"@uc:{slug}\" --format json:{report}"
  acceptance_api: "npx cucumber-js --tags \"@uc:{slug} and @acceptance and not @browser\" --format json:{report}"
  acceptance_browser: "npx cucumber-js --tags \"@uc:{slug} and @acceptance and @browser\" --format json:{report}"
capabilities:
  browser: false
  has_asyncapi: false
  has_kvs: false
  has_design_system: true
models:
  implementer: null
  verifier: opus