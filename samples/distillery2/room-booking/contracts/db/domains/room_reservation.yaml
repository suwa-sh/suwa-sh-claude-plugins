# basis: requirements@64517f420b568ea1a4536b71b9dbbb357bd66460 adr@ed9e1fbd3b234cada613ca9357dd6e5ae36271e8
# 会議室予約管理の表。日時は timestamptz (UTC で保存)。日付と 30 分刻みの判定は Asia/Tokyo で行う。
subdomain_id: room_reservation
tables:
  - name: rooms
    description: "会議室 (上書きのマスタ。5 部屋を migration の初期データで入れる。登録・変更の API は作らない)"
    columns:
      - name: room_id
        type: string
        nullable: false
        description: 会議室 ID
      - name: room_name
        type: string
        nullable: false
        description: 会議室名
      - name: display_order
        type: integer
        nullable: false
        description: 空き状況の一覧で並べる順
    primary_key: [room_id]
    indexes:
      - name: rooms_room_name_key
        unique: true
        columns: [room_name]

  - name: reservations
    description: "予約の今の状態 (予約済み / 取消済み)。イベントの追記と同じトランザクションで更新する。照会・一覧はこの表を読む"
    columns:
      - name: reservation_id
        type: uuid
        nullable: false
        description: 予約 ID
      - name: room_id
        type: string
        nullable: false
        description: 予約した会議室
      - name: start_at
        type: datetime
        nullable: false
        description: 開始時刻 (含む)。30 分刻み
      - name: end_at
        type: datetime
        nullable: false
        description: 終了時刻 (含まない)。30 分刻み。開始より後
      - name: reserved_by
        type: string
        nullable: false
        description: 予約者の社員 ID (トークンの sub)
      - name: status
        type: string
        nullable: false
        description: "予約状態。reserved = 予約済み / cancelled = 取消済み"
        enum: [reserved, cancelled]
    primary_key: [reservation_id]
    foreign_keys:
      - columns: [room_id]
        references:
          table: rooms
          columns: [room_id]
        on_delete: RESTRICT
    indexes:
      - name: reservations_reserved_by_start_at_idx
        unique: false
        columns: [reserved_by, start_at]
      - name: reservations_room_id_start_at_idx
        unique: false
        columns: [room_id, start_at]

  - name: reservation_events
    description: "予約のイベント (予約した・取り消した) の記録。追記だけで UPDATE と DELETE をしない"
    columns:
      - name: event_id
        type: uuid
        nullable: false
        description: イベント ID
      - name: reservation_id
        type: uuid
        nullable: false
        description: 対象の予約
      - name: event_type
        type: string
        nullable: false
        description: "イベントの種類。reserved = 予約した / cancelled = 取り消した"
        enum: [reserved, cancelled]
      - name: occurred_at
        type: datetime
        nullable: false
        description: 起きた時刻 (usecase が Clock から得た業務の時刻)
      - name: actor_employee_id
        type: string
        nullable: false
        description: 行為者の社員 ID (トークンの sub)
      - name: recorded_at
        type: datetime
        nullable: false
        description: "記録した時刻 (DB の既定値 now() で付ける。既定値は手書きの追加 migration で足す)"
    primary_key: [event_id]
    foreign_keys:
      - columns: [reservation_id]
        references:
          table: reservations
          columns: [reservation_id]
        on_delete: RESTRICT
    indexes:
      - name: reservation_events_reservation_id_event_type_key
        unique: true
        columns: [reservation_id, event_type]

  - name: room_slot_occupancies
    description: "会議室の 30 分枠の占有 (有効な予約から導く派生の表)。(会議室 ID, 枠の開始時刻) の主キーが二重予約を防ぐ。予約の成立と同じトランザクションで書き、取り消しで消す"
    columns:
      - name: room_id
        type: string
        nullable: false
        description: 会議室 ID
      - name: slot_start_at
        type: datetime
        nullable: false
        description: 30 分枠の開始時刻
      - name: reservation_id
        type: uuid
        nullable: false
        description: この枠を占める予約
    primary_key: [room_id, slot_start_at]
    foreign_keys:
      - columns: [room_id]
        references:
          table: rooms
          columns: [room_id]
        on_delete: RESTRICT
      - columns: [reservation_id]
        references:
          table: reservations
          columns: [reservation_id]
        on_delete: RESTRICT
    indexes:
      - name: room_slot_occupancies_reservation_id_idx
        unique: false
        columns: [reservation_id]
