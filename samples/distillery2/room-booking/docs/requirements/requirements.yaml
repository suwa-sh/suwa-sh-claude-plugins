system_name: "会議室予約システム"

requirements:
  - id: "REQ-001"
    requirement: "社員が、日付と時間帯を指定して、会議室ごとの空き状況を Web 画面で見られる"
    reason: "共有の表計算ファイルでは、会議室が空いているかが分かりにくい。取り消しも反映されないため、実際は空いている会議室が使えないことがある"
    priority: "must"
    specifications:
      - id: "SPEC-001-01"
        specification: "社員が日付と時間帯を指定すると、全会議室について、その時間帯が空きか予約済みかを会議室ごとに一覧で表示する。会議室は 会議室A・会議室B・会議室C・会議室D・会議室E の 5 部屋 (会議室ID は room-1〜room-5、表示順は 1〜5。名前は実際の会議室名が分かるまでの仮置き) とし、一覧には会議室名を表示順の昇順に並べる。予約済みの会議室には予約済みとだけ表示し、予約者の名前は表示しない。取り消された予約は予約済みとして扱わない。指定する時間帯は予約と同じ形の決まりに従う: 開始時刻が終了時刻より前でない (同じ時刻を含む) 場合と、時刻が 30 分刻みでない場合と、時間帯が指定した日付の中に収まらない (終了は翌日 0:00 まで可) 場合は照会を受け付けず、空き状況を表示せずに理由を示す。過去の時間帯の照会は受け付ける。空きは指定した時間帯に重なる有効な予約が無いことを示し、予約できることまでは示さない (過去の時間帯は空きと表示されても予約できない)"
        acceptance_criteria:
          - "Given 会議室が 5 部屋登録されている When 社員が日付と時間帯を指定して空き状況を表示する Then 5 部屋すべてが会議室ごとに表示される"
          - "Given 会議室A〜会議室E の 5 部屋が表示順 1〜5 で登録されている When 社員が日付と時間帯を指定して空き状況を表示する Then 会議室名が 会議室A・会議室B・会議室C・会議室D・会議室E の順に並んで表示される"
          - "Given 会議室Aの 2026-11-10 10:00-11:00 に予約がある When 社員が 2026-11-10 10:00-11:00 の空き状況を表示する Then 会議室Aは予約済み、予約の無い会議室は空きと表示される"
          - "Given 会議室Aの 2026-11-10 10:00-11:00 に社員Aの予約がある When 社員Bが 2026-11-10 10:00-11:00 の空き状況を表示する Then 会議室Aは予約済みとだけ表示され、予約者である社員Aの名前は表示されない"
          - "Given 会議室Aの 2026-11-10 10:00-11:00 に予約がある When 社員が 2026-11-10 11:00-12:00 の空き状況を表示する Then 会議室Aは空きと表示される"
          - "Given 会議室Aの 2026-11-10 10:00-11:00 の予約が取り消されている When 社員が同じ時間帯の空き状況を表示する Then 会議室Aは空きと表示される"
          - "Given 会議室が 5 部屋登録されている When 社員が 2026-11-10 の開始時刻 11:00・終了時刻 10:00 で空き状況を表示しようとする Then 空き状況は表示されず、時間帯が正しくないことが示される"
          - "Given 会議室が 5 部屋登録されている When 社員が 2026-11-10 の開始時刻 10:00・終了時刻 10:00 で空き状況を表示しようとする Then 空き状況は表示されず、時間帯が正しくないことが示される"
          - "Given 会議室が 5 部屋登録されている When 社員が 2026-11-10 の開始時刻 10:10・終了時刻 11:00 で空き状況を表示しようとする Then 空き状況は表示されず、時刻は 30 分刻みで指定することが示される"
          - "Given 会議室Aの 2026-11-10 23:30-翌日0:00 に予約がある When 社員が 2026-11-10 の開始時刻 23:30・終了時刻 翌日 0:00 (24:00) で空き状況を表示する Then 照会は受け付けられ、会議室Aは予約済み、予約の無い会議室は空きと表示される"
          - "Given 会議室が 5 部屋登録されている When 社員が 2026-11-10 の開始時刻 23:00・終了時刻 翌日 1:00 で空き状況を表示しようとする Then 空き状況は表示されず、時間帯が正しくないことが示される"
          - "Given 現在が 2026-11-10 12:00 で、会議室Aの 2026-11-10 10:00-11:00 に予約がある When 社員が 2026-11-10 10:00-11:00 の空き状況を表示する Then 照会は受け付けられ、会議室Aは予約済み、予約の無い会議室は空きと表示される"
        affected_models:
          - type: "actor"
            action: "add"
            target: "社員"
          - type: "information"
            action: "add"
            target: "会議室"
          - type: "information"
            action: "add"
            target: "予約"
          - type: "buc"
            action: "add"
            target: "会議室の空き状況を確認する"
          - type: "condition"
            action: "add"
            target: "予約の重なり判定"
          - type: "condition"
            action: "modify"
            target: "予約時刻の妥当性"
          - type: "external_system"
            action: "add"
            target: "社内の認証基盤"

  - id: "REQ-002"
    requirement: "社員が、空いている会議室を、日付と時間帯を指定して予約できる。同じ会議室の同じ時間帯に二重に予約できない"
    reason: "共有の表計算ファイルでは、同じ会議室の同じ時間に二重に書き込まれることが起きている"
    priority: "must"
    specifications:
      - id: "SPEC-002-01"
        specification: "社員が会議室・日付・開始時刻・終了時刻を指定して予約する。予約には予約した社員を記録する。開始時刻は終了時刻より前でなければならない。時刻は 30 分刻みで指定し、現在より前の時間帯は予約できない。時間帯は指定した日付の中に収め (終了は翌日 0:00 まで可)、日をまたぐ時間帯は予約できない。ただし、社員が自分の有効な予約とまったく同じ会議室・日付・時間帯で送り直したときは、現在より前の時間帯かどうかより先に送り直しとして扱い、過去の時間帯として断らない (応答が届かなかった予約の送り直しの扱い)。会議室・日付・開始時刻・終了時刻のどれかが未入力のときは、画面で予約を送らずに止め、未入力の項目ごとに入力を促す (時間帯の正しさ・30 分刻み・過去かどうか・重なりの判定は画面で先回りせず、これまでどおり予約を受け付ける側の判定に任せる)"
        acceptance_criteria:
          - "Given 現在が 2026-11-09 12:00 で、会議室Aの 2026-11-10 10:00-11:00 に予約が無い When 社員Aが会議室Aを 2026-11-10 10:00-11:00 で予約する Then 予約が成立し、予約者として社員Aが記録される"
          - "Given 現在が 2026-11-09 12:00 で、社員Aが 2026-11-10 の予約をしようとしている When 開始時刻 11:00・終了時刻 10:00 で予約する Then 予約は成立せず、時間帯が正しくないことが示される"
          - "Given 現在が 2026-11-09 12:00 で、社員Aが 2026-11-10 の予約をしようとしている When 開始時刻 10:00・終了時刻 10:00 で予約する Then 予約は成立せず、時間帯が正しくないことが示される"
          - "Given 現在が 2026-11-09 12:00 で、社員Aが 2026-11-10 の予約をしようとしている When 開始時刻 10:10・終了時刻 11:00 で予約する Then 予約は成立せず、時刻は 30 分刻みで指定することが示される"
          - "Given 現在が 2026-11-09 12:00 で、会議室Aの 2026-11-10 23:30-翌日0:00 に予約が無い When 社員Aが会議室Aを 2026-11-10 の開始時刻 23:30・終了時刻 翌日 0:00 (24:00) で予約する Then 予約が成立する"
          - "Given 現在が 2026-11-09 12:00 で、社員Aが 2026-11-10 の予約をしようとしている When 開始時刻 23:00・終了時刻 翌日 1:00 で予約する Then 予約は成立せず、時間帯が正しくないことが示される"
          - "Given 現在が 2026-11-10 12:00 である When 社員Aが会議室Aを 2026-11-10 10:00-11:00 で予約する Then 予約は成立せず、過去の時間帯は予約できないことが示される"
          - "Given 現在が 2026-11-09 12:00 で、社員Aが 2026-11-10 10:00-11:00 を選んでいる When 会議室を選ばずに予約する Then 予約は送られず成立せず、会議室を選ぶことが示される"
          - "Given 現在が 2026-11-09 12:00 で、社員Aが会議室Aを選んでいる When 日付・開始時刻・終了時刻を選ばずに予約する Then 予約は送られず成立せず、日付・開始時刻・終了時刻をそれぞれ選ぶことが示される"
        affected_models:
          - type: "actor"
            action: "add"
            target: "社員"
          - type: "information"
            action: "add"
            target: "予約"
          - type: "information"
            action: "add"
            target: "会議室"
          - type: "state"
            action: "add"
            target: "予約状態"
          - type: "condition"
            action: "add"
            target: "予約時刻の妥当性"
          - type: "buc"
            action: "add"
            target: "会議室を予約する"
          - type: "external_system"
            action: "add"
            target: "社内の認証基盤"
      - id: "SPEC-002-02"
        specification: "同じ会議室で、時間帯が一部でも重なる有効な予約がある場合は予約を受け付けない。時間帯の重なりは開始を含み終了を含まない区間で判定し、終了時刻と次の開始時刻が同じ予約は重ならないとみなす。取り消された予約は重なりの判定に含めない。同時に予約されても、成立するのは 1 件だけにする。ただし、社員が自分の有効な予約とまったく同じ会議室・日付・時間帯で送り直したときは、重なりとして断らず、成立済みの予約を示す (応答が届かなかった予約の送り直しの扱い)"
        acceptance_criteria:
          - "Given 現在が 2026-11-09 12:00 で、会議室Aの 2026-11-10 10:00-11:00 に社員Aの予約がある When 社員Bが会議室Aを 2026-11-10 10:30-11:30 で予約する Then 予約は成立せず、時間帯が既存の予約と重なることが示される"
          - "Given 現在が 2026-11-09 12:00 で、会議室Aの 2026-11-10 10:00-11:00 に社員Aの予約がある When 社員Bが会議室Aを 2026-11-10 11:00-12:00 で予約する Then 予約が成立する"
          - "Given 現在が 2026-11-09 12:00 で、会議室Aの 2026-11-10 10:00-11:00 に社員Aの予約がある When 社員Bが会議室Bを 2026-11-10 10:00-11:00 で予約する Then 予約が成立する"
          - "Given 現在が 2026-11-09 12:00 で、会議室Aの 2026-11-10 10:00-11:00 の予約が取り消されている When 社員Bが会議室Aを 2026-11-10 10:00-11:00 で予約する Then 予約が成立する"
          - "Given 現在が 2026-11-09 12:00 で、会議室Aの 2026-11-10 10:00-11:00 に予約が無い When 社員Aと社員Bが同時に会議室Aを 2026-11-10 10:00-11:00 で予約する Then 成立する予約は 1 件だけで、もう一方には時間帯が重なることが示される"
        affected_models:
          - type: "condition"
            action: "add"
            target: "予約の重なり判定"
          - type: "business_policy"
            action: "add"
            target: "同じ会議室の同じ時間帯は二重に予約できない"
          - type: "information"
            action: "add"
            target: "予約"
          - type: "buc"
            action: "add"
            target: "会議室を予約する"
      - id: "SPEC-002-03"
        specification: "予約が成立した後に応答が社員に届かなかった場合 (通信の切断など) に備え、社員が自分の有効な予約と会議室・日付・開始時刻・終了時刻がすべて同じ予約をもう一度送ったときは、新しい予約を作らず、すでに成立しているその予約を予約が成立した結果として示す。社員の有効な予約は 1 件のまま変わらない。時間帯が一部だけ重なる自分の予約や、他の社員の予約と重なる場合は、これまでどおり時間帯が重なるとして受け付けない。取り消した自分の予約と同じ内容で送ったときは、新しい予約として扱う。この送り直しの判定は、現在より前の時間帯は予約できないという判定より先に行う。送り直したときに現在がその予約の開始時刻を過ぎていても (終了時刻を過ぎていても)、過去の時間帯として断らず、成立済みの予約を示す。取り消した自分の予約と同じ内容で、現在が開始時刻を過ぎているときは、新しい予約として扱うので過去の時間帯として受け付けない"
        acceptance_criteria:
          - "Given 現在が 2026-11-09 12:00 で、社員Aの会議室Aの 2026-11-10 10:00-11:00 の予約が成立しているが応答が届かなかった When 社員Aが会議室Aを 2026-11-10 10:00-11:00 でもう一度予約する Then 新しい予約は作られず、予約が成立していることが示され、社員Aの有効な予約は 1 件のまま変わらない"
          - "Given 現在が 2026-11-09 12:00 で、会議室Aの 2026-11-10 10:00-11:00 に社員Aの予約がある When 社員Aが会議室Aを 2026-11-10 10:30-11:30 で予約する Then 予約は成立せず、時間帯が既存の予約と重なることが示される"
          - "Given 現在が 2026-11-09 12:00 で、会議室Aの 2026-11-10 10:00-11:00 に社員Aの予約がある When 社員Bが会議室Aを 2026-11-10 10:00-11:00 で予約する Then 予約は成立せず、時間帯が既存の予約と重なることが示される"
          - "Given 現在が 2026-11-09 12:00 で、社員Aの会議室Aの 2026-11-10 10:00-11:00 の予約が取り消されている When 社員Aが会議室Aを 2026-11-10 10:00-11:00 で予約する Then 新しい予約が成立する"
          - "Given 現在が 2026-11-10 10:30 で、社員Aの会議室Aの 2026-11-10 10:00-11:00 の予約が成立しているが応答が届かなかった When 社員Aが会議室Aを 2026-11-10 10:00-11:00 でもう一度予約する Then 過去の時間帯として断られず、新しい予約は作られず、予約が成立していることが示され、社員Aの有効な予約は 1 件のまま変わらない"
          - "Given 現在が 2026-11-10 11:30 で、社員Aの会議室Aの 2026-11-10 10:00-11:00 の予約が成立しているが応答が届かなかった When 社員Aが会議室Aを 2026-11-10 10:00-11:00 でもう一度予約する Then 過去の時間帯として断られず、新しい予約は作られず、予約が成立していることが示され、社員Aの有効な予約は 1 件のまま変わらない"
        affected_models:
          - type: "condition"
            action: "modify"
            target: "予約の重なり判定"
          - type: "condition"
            action: "modify"
            target: "予約時刻の妥当性"
          - type: "information"
            action: "modify"
            target: "予約"
          - type: "buc"
            action: "modify"
            target: "会議室を予約する"

  - id: "REQ-003"
    requirement: "予約した本人が、自分の予約を取り消せる"
    reason: "共有の表計算ファイルでは取り消しが反映されず、空いている会議室が予約済みに見える"
    priority: "must"
    specifications:
      - id: "SPEC-003-01"
        specification: "社員が、自分が予約した有効な予約の一覧を表示する。取り消す予約を選ぶ入口になる。一覧の各予約には会議室名・日付・開始時刻・終了時刻を表示し、複数の予約があっても取り消す予約を見分けられるようにする。他の社員の予約と取り消された予約は表示しない"
        acceptance_criteria:
          - "Given 社員Aの予約が 2 件、社員Bの予約が 1 件ある When 社員Aが自分の予約の一覧を表示する Then 社員Aの予約 2 件だけが表示される"
          - "Given 社員Aが会議室Aを 2026-11-10 10:00-11:00、会議室Bを 2026-11-11 14:00-15:00 で予約している When 社員Aが自分の予約の一覧を表示する Then 2 件の予約がそれぞれ 会議室A 2026-11-10 10:00-11:00 と 会議室B 2026-11-11 14:00-15:00 として見分けられるように表示される"
          - "Given 社員Aの予約のうち 1 件が取り消されている When 社員Aが自分の予約の一覧を表示する Then 取り消された予約は表示されない"
        affected_models:
          - type: "information"
            action: "add"
            target: "予約"
          - type: "buc"
            action: "add"
            target: "予約を取り消す"
          - type: "external_system"
            action: "add"
            target: "社内の認証基盤"
      - id: "SPEC-003-02"
        specification: "予約した本人だけが、開始時刻より前の自分の予約を取り消せる。取り消した予約は取消済みになり、有効な予約として扱わない"
        acceptance_criteria:
          - "Given 現在が 2026-11-10 09:00 で、社員Aが会議室Aを 2026-11-10 10:00-11:00 で予約している When 社員Aがその予約を取り消す Then 予約は取消済みになり、有効な予約ではなくなる"
          - "Given 現在が 2026-11-10 09:00 で、社員Aが会議室Aを 2026-11-10 10:00-11:00 で予約している When 社員Bがその予約を取り消そうとする Then 取り消しは受け付けられず、本人の予約ではないため取り消せないことが示され、予約は有効なまま残る"
          - "Given 現在が 2026-11-10 09:00 で、社員Aの会議室Aの 2026-11-10 10:00-11:00 の予約がすでに取り消されている When 社員Aが同じ予約をもう一度取り消そうとする Then 取り消しは受け付けられず、すでに取り消された予約であることが示される"
          - "Given 現在が 2026-11-10 10:30 で、社員Aが会議室Aを 2026-11-10 10:00-11:00 で予約している When 社員Aがその予約を取り消そうとする Then 取り消しは受け付けられず、開始時刻を過ぎた予約は取り消せないことが示され、予約は有効なまま残る"
          - "Given 現在が 2026-11-10 10:00 で、社員Aが会議室Aを 2026-11-10 10:00-11:00 で予約している When 社員Aがその予約を取り消そうとする Then 取り消しは受け付けられず、開始時刻を迎えた予約は取り消せないことが示され、予約は有効なまま残る"
        affected_models:
          - type: "state"
            action: "add"
            target: "予約状態"
          - type: "condition"
            action: "add"
            target: "予約の取消可否"
          - type: "business_policy"
            action: "add"
            target: "予約を取り消せるのは予約した本人だけ"
          - type: "buc"
            action: "add"
            target: "予約を取り消す"
          - type: "external_system"
            action: "add"
            target: "社内の認証基盤"
