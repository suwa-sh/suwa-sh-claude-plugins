findings:
  - id: F-001
    viewpoint: spec_conformance
    severity: minor
    target: "frontend/src/components/LoanConfirmationScreen.tsx:32-36"
    claim: >-
      tier-frontend.mdのコンポーネント設計表は「onLoan: () => Promise<void>」と定義しているが、実装の
      LoanConfirmationProps.onLoanは「() => Promise<LoanResponse>」でPropsのシグネチャが仕様と異なる。
    evidence: >-
      tier-frontend.md「コンポーネント設計 LoanConfirmation」Props表のonLoan行は「() => Promise<void>」。
      対してLoanConfirmationScreen.tsx:34は`onLoan: () => Promise<LoanResponse>`。状態表の
      loanResult(LoanResponse)を保持するために戻り値を変更したとdocs/impl/latest/19ec0182/issues/
      20260729103954_loanconfirmation-onloan-return-type-ambiguity.mdに起票済み(coding-rules.md
      rule 4「仕様の問題としてissues/に書き捨てる」に準拠した対応)。BDD 2 scenarios・単体テスト6件は
      この実装で独立再実行してpassを確認しており、挙動としての齟齬はない。字句レベルの仕様記載精度の
      問題であり、動作不良ではないためminorと判定する。
    suggested_fix: >-
      次回spec更新時にtier-frontend.mdのonLoan型を「() => Promise<LoanResponse>」に修正するか、
      loanResultをPropsとして親から渡す設計に明確化する(issues記載の提案どおり)。
  - id: F-002
    viewpoint: spec_conformance
    severity: minor
    target: "frontend/src/pages/LoanConfirmationPage.tsx:36-45, frontend/src/components/LoanConfirmationScreen.tsx:94-102"
    claim: >-
      tier-frontend.mdのUIロジック「ローディング: 書籍情報取得時はSkeleton UI、貸出申請時はボタン
      disabled+Spinner」に対し、実装はSkeleton/Spinnerコンポーネントを使わずプレーンテキスト
      (「読み込み中...」「処理中...」)で代替している。
    evidence: >-
      packages/ui/components配下にはBookCard/BookLoanStatusBadge/Badge/Buttonの4コンポーネントしか
      存在せず(ls確認)、Skeleton/Spinnerは未生成(packages/ui/.imported.yamlに設計システム生成不足として
      記録済み)。coding-rules.md rule 2「frontendのUIコンポーネントはpackages/ui/のみ使用。新規
      コンポーネントの自作は禁止」に従いテキスト代替とした判断はissues/20260729103955_
      skeleton-spinner-components-missing.mdに起票済みで妥当。ボタンのdisabled化自体はtier-frontend.md
      要件どおり実装されており(loanConfirmationScreen.test.tsx:164-181で確認)、視覚的な代替表現の
      粒度のみの差でありminorと判定する。
    suggested_fix: >-
      design(dist-design-system)側でSkeleton/Spinnerコンポーネントが生成され次第、テキスト代替箇所を
      置き換える(issues記載の提案どおり)。
  - id: F-003
    viewpoint: refactoring
    severity: minor
    target: "frontend/src/api/loanConfirmationApiClient.ts"
    claim: >-
      attempt-1 findings F-002(minor)の継続。packages/contracts/api-client/apis/DefaultApi.tsの
      構文エラー回避のため、getBook/createLoanのリクエスト内容を手書きで複製したクライアントが
      attempt-2でも変更なく残存しており、契約再生成時の手動追従が必要な保守負債である。
    evidence: >-
      frontend/src/api/loanConfirmationApiClient.tsはattempt-1から無変更(DefaultApi.tsのgetBook/
      createLoanと同一のpath/method/header/body変換を独立コードとして保持)。S4_tier-impl.
      tier-frontend.done.yaml(attempt-2)のfixed_findingsにも「対応は任意との指示のため...今回のスコープに
      含めていない」と明記されており、既存issues/20260729101416_defaultapi-generated-syntax-error.md
      への参照コメントも維持されている。今attemptでの対応見送りは指示どおりであり新規の問題ではないが、
      未解消のためfindings ledgerとして継続記録する。
    suggested_fix: >-
      契約側(openapi-generatorのenumPropertyNaming設定、またはx-enum-varnames付与)の修正後、
      LoanConfirmationApiClientを削除しpackages/contracts/api-clientのbarrelからDefaultApiを直接
      importする形に戻す(attempt-1 F-002 suggested_fixのまま)。
