findings:
  - id: F-001
    viewpoint: security
    severity: major
    target: "backend-api/src/http/server.ts:52, backend-api/src/http/loansController.ts:17-29"
    claim: >-
      attempt-1 findings F-002(blocker候補ではなくmajor)からの継続。tier-backend-api.md が要求する
      認証(OAuth2/OIDC、利用者ロール)が実装されておらず、クライアントが任意に指定した X-User-Id
      ヘッダの値をそのまま認証済み利用者IDとして信用している状態がattempt-2でも変わっていない。
    evidence: >-
      1) server.ts:52 `userId: firstHeaderValue(req.headers["x-user-id"]) ?? ""` はexpress化後も
      トークン検証を行わずヘッダ値をそのまま採用している(attempt-1からロジック不変、express化に伴う
      配線変更のみ)。
      2) nfr-grade.yaml E.5.2.1(827-834行) はロールベースアクセス制御(RBAC)をgrade 2で要求しているが、
      利用者/司書のロール区別は実装のどこにも存在しない(attempt-1から不変)。
      3) attempt-2での対応は issues/20260729_011215_auth_and_missing_header_gap.md への
      「OAuth2/OIDC要求との差分」表の追記と、server.ts/loansController.tsへのTODOコメント明示のみ
      (docs/impl/latest/19ec0182/stages/attempt-2/S4_tier-impl.tier-backend-api.done.yaml
      fixed_findings[1].fix 参照)。コード自体のなりすまし可能な挙動は修正されていない。
      4) issue起票済み・認証基盤tier未整備という制約は理解できるため severity を blocker には
      上げないが、S6以降で認証tierと接続するまではリスクとして追跡が必要。
    suggested_fix: >-
      認証基盤tierが用意され次第、OAuth2/OIDCのリソースサーバー検証ミドルウェアに差し替える。
      それまでの間はS6以降のバックログへの引き継ぎを運用上確実にする(issueは既に起票済み)。

  - id: F-002
    viewpoint: refactoring
    severity: minor
    target: "backend-api/src/repositories/reservationRepository.ts:18-23, backend-api/test/loan.test.ts, backend-api/test/createLoanUseCase.test.ts"
    claim: >-
      InMemoryReservationRepository.findActiveByBookId の cancelled 除外フィルタ(21行目
      `reservation.status !== "cancelled"`)を直接検証する単体テストが存在しない。
    evidence: >-
      1) test/loan.test.ts の canLend テストは activeReservations 引数に事前フィルタ済みの配列を
      直接渡しており、リポジトリのフィルタ条件は関与しない。
      2) test/createLoanUseCase.test.ts の予約シナリオ2件(89-140行)も reservationRepository.seed
      で status: "reserved" のみを投入しており、cancelled を含む配列を投入して除外されることを
      確認するケースが無い。
      3) `find backend-api/test backend-api/features -name "*.ts" | xargs grep -n cancelled` は
      コメント1件のみでテストコードには出現しない。
      4) 現状のロジックは単純な述語フィルタであり誤動作の兆候は無いため blocker/major には
      該当しないが、予約状態の解釈(F-001[attempt-1]で issues 起票済み)が今後変更される際の
      回帰検知に使えるテストが欠けている。
    suggested_fix: >-
      test/loan.test.ts か新規 test/reservationRepository.test.ts に、cancelled を含む複数状態の
      予約を seed し、findActiveByBookId が cancelled のみ除外して返すことを検証するケースを追加する。
