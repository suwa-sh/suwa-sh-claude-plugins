findings:
  - id: F-001
    viewpoint: spec_conformance
    severity: blocker
    target: "frontend/src/components/loanConfirmation.ts, frontend/ (screen not implemented)"
    claim: >-
      tier-frontend.md が要求する「貸出手続き画面」(route: /loans/new、BookCard/BookLoanStatusBadge/
      Button を用いた表示、コンポーネント設計「LoanConfirmation」Props: book/onLoan/isLoading、
      state: isCompleted/loanResult)が一切実装されていない。実装されているのは値変換関数と
      APIクライアントのみで、画面のレンダリング・ルーティングは存在しない。
    evidence: >-
      frontend/src 配下は components/loanConfirmation.ts(関数・クラスのみ、.tsx なし)と
      api/loanConfirmationApiClient.ts の2ファイルのみで、packages/ui の BookCard/
      BookLoanStatusBadge/Button を import・使用している箇所はゼロ(grep で確認)。
      tier-frontend.md「画面仕様」節はURL /loans/new・表示要素表(書籍情報カード/貸出状態バッジ/
      返却期限表示/貸出するボタン/戻るボタン)・「コンポーネント設計 LoanConfirmation」を明記。
      docs/dev-rules/tier-rules.md「frontend系」は『UIコンポーネントはpackages/ui/のみ使用』
      と規定し、packages/ui/.imported.yaml はこのUC(uc: 書籍を貸出する, route: /loans/new)向けの
      画面Story(stories/Pages/UserPortal/LoanCheckout.stories.tsx、variants: Default/Completed/
      Error/Loading)が既に実在・結線確認済みであることを記録している。にもかかわらず
      frontend実装はこのStoryやpackages/ui部品を一切参照していない。
      S4_tier-impl.tier-frontend.done.yaml の notes に「実行環境にreactがprovisionされていない
      (frontend/package.jsonのdevDependenciesにreact/react-dom/testing-libraryが無い)ため、
      JSXによる画面組み立てはせず...責務を限定した」と明記されているが、reactはpackages/ui自体が
      既に使用しているtier-rules.md指定の必須UIライブラリであり(BookCard.tsx等はReact.FCで実装
      済み)、frontend/package.jsonへの追加自体は妨げられていない。coding-rules.md rule 4
      「仕様を実装側で曲げない...仕様の問題として issues/ に書き捨てる」に反し、この画面実装の
      省略についてissues/への起票が一切行われていない(issues/配下7件はいずれも別件)。
      ゲート4(tier BDD)はpassしているが、features/steps/19ec0182.steps.ts の Then step は
      実際のDOM描画ではなく `state.bookCardProps?.title` 等の計算済みオブジェクトを検証して
      おり(gate_reexec で再実行し pass を確認済み)、画面が実在することの証拠にはならない。
    suggested_fix: >-
      frontend/package.json に react/react-dom(必要なら @types/react)を追加し、packages/ui の
      BookCard/BookLoanStatusBadge/Button と既存の LoanCheckout.stories.tsx を土台に、実際に
      /loans/new でレンダリングされる LoanConfirmation 画面コンポーネント(Props: book/onLoan/
      isLoading、state: isCompleted/loanResult)を実装する。既存の loanConfirmation.ts の
      値変換ロジックはそのまま画面コンポーネントから呼び出す形で再利用可能。react追加が本当に
      不可能な制約があるなら、その旨と影響範囲(スコープ縮小の判断)をissues/に起票し
      オーケストレータへ差し戻す。
  - id: F-002
    viewpoint: refactoring
    severity: minor
    target: "frontend/src/api/loanConfirmationApiClient.ts"
    claim: >-
      packages/contracts/api-client/apis/DefaultApi.ts の構文エラー回避のため、getBook/createLoan
      のリクエスト内容を手書きで複製したクライアントを実装している。契約が再生成された際に
      手動追従が必要な保守負債になる。
    evidence: >-
      DefaultApi.ts:1390 の SearchBooksGenreEnum 定義でプロパティ名が空になる構文エラーを
      esbuild実行で確認済み(genre enum値が日本語のためopenapi-generatorのサニタイズが
      失敗している)。これは真正の外部要因(契約生成物側の不具合)であり、迂回自体は
      coding-rules.md rule 1(契約型の直接編集禁止)に準拠した妥当な対応。ただし
      LoanConfirmationApiClient は DefaultApi.ts の getBook/createLoan と同一のpath/method/
      header/body変換を独立コードとして保持しており、契約変更時に同期漏れが起き得る。
      Implementer自身がissues/20260729101416で根本修正(契約側のenumPropertyNaming設定)と
      迂回コード削除を提案済み。
    suggested_fix: >-
      契約側(openapi-generatorのenumPropertyNaming設定、またはx-enum-varnames付与)の修正後、
      LoanConfirmationApiClient を削除し packages/contracts/api-client の barrel から
      DefaultApi を直接importする形に戻す(Implementer提案どおり)。
