findings:
  - id: F-001
    viewpoint: spec_conformance
    severity: minor
    target: "frontend/src/components/LoanConfirmationScreen.tsx:32-36"
    claim: >-
      tier-frontend.mdのコンポーネント設計表は「onLoan: () => Promise<void>」と定義しているが、実装の
      LoanConfirmationProps.onLoanは「() => Promise<LoanResponse>」でPropsのシグネチャが仕様と異なる。
    evidence: >-
      tier-frontend.md「コンポーネント設計 LoanConfirmation」Props表のonLoan行は「() => Promise<void>」。
      対してLoanConfirmationScreen.tsx:34は`onLoan: () => Promise<LoanResponse>`(attempt-3時点でも
      不変であることをRead再確認済み)。docs/impl/latest/19ec0182/issues/
      20260729103954_loanconfirmation-onloan-return-type-ambiguity.mdに起票済み。attempt-3で
      vitest 26件・cucumber-js 2 scenarios/10 stepsを独立再実行しいずれもpassを確認しており、
      挙動としての齟齬はない。attempt-2 F-001の継続(退行ではなく未解消の継続)。
    suggested_fix: >-
      次回spec更新時にtier-frontend.mdのonLoan型を「() => Promise<LoanResponse>」に修正するか、
      loanResultをPropsとして親から渡す設計に明確化する。
  - id: F-002
    viewpoint: spec_conformance
    severity: minor
    target: "frontend/src/pages/LoanConfirmationPage.tsx:36-45, frontend/src/components/LoanConfirmationScreen.tsx:94-102"
    claim: >-
      tier-frontend.mdのUIロジック「ローディング: 書籍情報取得時はSkeleton UI、貸出申請時はボタン
      disabled+Spinner」に対し、実装はSkeleton/Spinnerコンポーネントを使わずプレーンテキスト
      (「読み込み中...」「処理中...」)で代替している。
    evidence: >-
      packages/ui/components配下にSkeleton/Spinnerは未生成のまま(attempt-3時点でも変化なし)。
      coding-rules.md rule 2(frontendのUIコンポーネントはpackages/ui/のみ使用)に従いテキスト代替と
      した判断はdocs/impl/latest/19ec0182/issues/20260729103955_
      skeleton-spinner-components-missing.mdに起票済み。ボタンのdisabled化自体は
      loanConfirmationScreen.test.tsxで確認済みでattempt-2 F-002の継続。
    suggested_fix: >-
      design(dist-design-system)側でSkeleton/Spinnerコンポーネントが生成され次第、テキスト代替箇所を
      置き換える。
  - id: F-003
    viewpoint: refactoring
    severity: minor
    target: "frontend/src/api/loanConfirmationApiClient.ts"
    claim: >-
      attempt-1 F-002 / attempt-2 F-003の継続。packages/contracts/api-client/apis/DefaultApi.tsの
      構文エラー回避のため、getBook/createLoanのリクエスト内容を手書きで複製したクライアントが
      attempt-3でも変更なく残存しており、契約再生成時の手動追従が必要な保守負債である。
    evidence: >-
      frontend/src/api/loanConfirmationApiClient.tsはattempt-2から無変更(Read再確認済み)。
      backend-api attempt-3のbooksController.tsも同じDefaultApi.ts構文エラーを理由に
      models/BookResponseを直接importする同種の迂回を行っており(既存issue
      20260729_011213_api_types_defaultapi_syntax_error.md)、根本原因は契約生成側にあり
      frontend単独の対応では解消しない。
    suggested_fix: >-
      契約側(openapi-generatorのenumPropertyNaming設定、またはx-enum-varnames付与)の修正後、
      LoanConfirmationApiClientを削除しpackages/contracts/api-clientのbarrelからDefaultApiを直接
      importする形に戻す。
  - id: F-004
    viewpoint: security
    severity: major
    target: "frontend/src/api/loanConfirmationApiClient.ts"
    claim: >-
      LoanConfirmationApiClient(createLoan/getBook)がX-User-Idヘッダを送信しないため、backend-api
      attempt-3で実装された「予約確保済書籍の貸出」フロー(貸出成功後の予約完了更新・予約者本人判定)が
      UC統合BDDで成立せず、POST /api/v1/loansがHTTP 409になり「予約確保済書籍の貸出」シナリオが失敗する。
    evidence: >-
      backend-api attempt-3のS4_tier-impl.tier-backend-api.done.yaml(fixed_findings F-S6-b)が
      「frontendのLoanConfirmationApiClientはcreateLoan/getBookのいずれでもX-User-Idを送信しない」
      事実とその帰結を明示し、docs/impl/latest/19ec0182/issues/
      20260729_011215_auth_and_missing_header_gap.mdに「frontend契約にX-User-Idヘッダが無い事実
      (attempt-3 S6差し戻しで判明)」として追記した。Verifier自身でnpm run bdd:uc(check-only、
      integration writerのwrite-set外につき書き換えなし)を独立再実行し、4シナリオ中3シナリオpass・
      「予約確保済書籍の貸出」1シナリオのみが同じ理由(HTTP 409)で失敗することを確認した
      (backend-api attempt-3のsanity_check_uc_bddの報告と一致)。frontend/src/api/
      loanConfirmationApiClient.tsをRead確認した限り送信ヘッダはContent-Type/X-Idempotency-Key/
      (設定時のみ)Authorizationのみで、X-User-Idは送っていない。ただし_api-summary.yamlの
      CreateLoanRequestにX-User-Idの定義は無く、tier-frontend.mdにも認証ヘッダの記載が無いため、
      frontend自身が参照すべき契約(packages/contracts)には違反していない。tier-frontendの4ゲートは
      いずれもpassしており、tier単体のspec違反や動作不良ではない(よってblockerではなくmajor)。
      是正の必要箇所はfrontendのwrite-set(ヘッダ追加)またはintegration writer(S6)のwrite-set
      (テスト用認証コンテキスト注入)のいずれかであり、backend-api側は対応範囲外であることを
      backend-api attempt-3自身が明言している。
    suggested_fix: >-
      frontend/src/api/loanConfirmationApiClient.tsのcreateLoan/getBookリクエストに認証済み利用者IDを
      X-User-Idヘッダとして付与する(値の取得元は認証基盤tier実装待ちのため、暫定的にはS6
      integration writerがテスト用コンテキストを注入するか、_api-summary.yaml/tier-frontend.mdに
      X-User-Idヘッダ要件を明記した上でfrontendのwrite-setとして対応する)。
