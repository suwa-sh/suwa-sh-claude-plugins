notes: 'attempt-1 findings F-001(blocker)を是正: 実際に画面をレンダリングするコンポーネントを実装した。 react/react-dom
  はオーケストレータ提供済み(frontend/package.json)。既存の値変換ロジック (loanConfirmation.ts の toBookCardProps/isLoanButtonEnabled/formatCompletionMessage/
  mapLoanErrorMessage/calculateExpectedDueDate 等)はそのまま再利用し、画面コンポーネントから呼び出す 形にした(値変換ロジック自体は無変更)。jsdom
  は未導入のため、DOM検証はすべて react-dom/server の renderToStaticMarkup による HTML文字列検証で行った(クリック等のイベントシミュレーションは
  実施していない。貸出実行後の状態は明示的に構築して同じ描画関数で再描画し検証する設計とした)。 frontend/src/components/LoanConfirmationScreen.tsx
  と既存の frontend/src/components/loanConfirmation.ts は macOS の大文字小文字を区別しないファイルシステム上で衝突する可能性があった
  (当初 LoanConfirmation.tsx という名前にしたところ、自己参照的な import 誤解決が発生したため LoanConfirmationScreen.tsx
  に改名して回避)。tsconfig.json に jsx/lib(DOM)を追加したのは、 packages/ui の Button.tsx が HTMLButtonElement
  等の DOM 型を使用しており、ts-node(bdd gate)が 型チェックする際に必要だったため(frontend配下のみの変更で他tierに影響しない)。
  Skeleton/Spinner未生成、onLoanのProps型(Promise<void> vs 実装したPromise<LoanResponse>)、 アプリシェル/ルーター未生成の3件は仕様疑義としてissues/に起票し、それぞれ実装上の判断根拠を記載した。
  F-002は指示どおり対応を見送り、既存の起票済みissueへの参照コメントを維持するに留めた。 4ゲート全通過、attempt-1の既存15テストも退行なし。'
