  src/stories/ 配下も LoanCheckout.stories.tsx の 1 件のみ生成済み。design-event.yaml で
  宣言済みの残りのコンポーネント・Story(15 画面分)は design(dist-design-system)側の生成
  未完了であり、bootstrap の完了報告に「デザインシステム生成不足」として記載した。frontend
  tier の実装時、不足コンポーネント・Story は自作せず tier-rules.md の規約どおり design への
  変更要求を起票すること。
  結線照合: screens[] の "貸出手続き画面"(uc: 書籍を貸出する、route: /loans/new)は
  story: src/stories/Pages/UserPortal/LoanCheckout.stories.tsx / variants: Default,
  Completed, Error, Loading と宣言されており、取り込んだ LoanCheckout.stories.tsx の
  export(Default/Completed/Error/Loading)と一致する。実在確認済み。
