      source_model: "情報: 書籍（コンテキスト=蔵書管理）, 状態: 書籍状態, BUC: 蔵書を管理するフロー/書籍を検索するフロー, 条件: 蔵書削除可否条件/書籍検索条件/返却後状態決定条件"
