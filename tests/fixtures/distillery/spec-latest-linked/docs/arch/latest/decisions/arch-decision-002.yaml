title: "境界づけられたコンテキストを 6 BC + 外部 1 BC に分割"
status: "approved"
generated_at: "2026-09-02T14:11:27"
context: |
  BC 分割はドメイン判断（言語境界）とチーム境界（Conway の法則）の両方を含み、RDRA から機械的に確定できない。
  本システムの RDRA には次のシグナルがある。
  - 情報.tsv のコンテキスト列が 蔵書管理 / 利用者管理 / 貸出管理 / 予約管理 / 通知管理 / 分析管理 の 6 種
  - 状態モデルが 6 件で、それぞれ独立したライフサイクルを持つ
  - 外部システムはメール配信サービス 1 件
  一方で厳密な同名異義語（同一用語が異なる属性集合で複数登場）は検出されなかった
  （情報.tsv のエンティティ名 7 件はすべてユニーク）ため、分割根拠は間接的シグナルに留まる。
  チーム編成も未確定である。
decision: |
  BC-001 蔵書 / BC-002 利用者 / BC-003 貸出 / BC-004 予約 / BC-005 通知 / BC-006 蔵書分析 の 6 BC に加え、
  外部メール配信サービスの境界として BC-007 メール配信コンテキストを定義する（合計 7 BC）。
  BC 間の参照契約はコンテキストマップ 11 本（CM-001〜CM-011）で定義する。
  「書籍」「利用者」「通知」の 3 語は BC ごとに関心が異なるため、ubiquitous_language で意味を書き分けた。
  owned_entity_ids は BC からの単方向参照を唯一の正規参照とし、技術的派生エンティティも所有 BC を明示する
  （E-901 セッション情報 → BC-002、E-902 通知送信冪等キー → BC-005）。
  team_ownership は全 BC で null（未定）のまま進める。confidence は medium（BC 分割の仕様上の上限）。
consequences:
  positive:
    - "モジュラモノリス内のモジュール分割単位（BC-001〜006 の 6 モジュール）がそのまま定まる"
    - "将来のマイクロサービス分割・チーム分割の受け皿になる"
    - "個人情報を BC-002 に局所化でき、他 BC からは利用者番号での参照に限定できる（NFR E.6.1.1 / E.7.1.1）"
    - "全 9 エンティティが いずれかの BC に帰属し、クロスリファレンス整合が取れている（割当率 100%）"
  negative:
    - "BC 間の参照契約を 11 本定義・維持する必要がある"
    - "厳密な同名異義語が検出されていないため、分割が過剰である可能性が残る"
    - "team_ownership が null のため Conway の法則による検証ができていない"
alternatives_considered:
  - name: "Option B: 貸出と予約を 1 BC に統合し 5 BC とする"
    reason_rejected: "予約状態モデル（最も複雑）と貸出状態モデルが独立しており、統合すると集約の不変条件が 1 BC に集中して肥大化する"
  - name: "Option C: 情報.tsv のコンテキスト列を無視し、業務（7 業務）単位で BC を切る"
    reason_rejected: "利用照会業務が貸出・予約の両方を横断的に参照するだけの読み取り業務であり、独立した言語境界を持たない"
  - name: "team_ownership を仮置きで指定する"
    reason_rejected: "チーム編成が未確定であり、仮置きの値が後続スキルで誤った前提として使われるリスクがある"
