artifact_type: "decision_record"
skill_type: "architecture"
artifact_id: "arch-decision-005"
title: "BC : tier 対応形態にモジュラモノリスを採用し、バックエンド API を CaaS(k8s) で運用"
status: "approved"
generated_at: "2026-09-02T14:11:27"
context: |
  6 つの BC をどのデプロイ単位に写像するか（モノリス / モジュラモノリス / マイクロサービス）の判断が必要だった。
  制約は次のとおり。
  - NFR B.1.1.1 Lv1（同時アクセス〜100）/ B.2.1.2 Lv2（〜50 TPS）と小規模
  - NFR C.5.1.1 Lv1 / C.5.2.1 Lv2（1 次「図書館システム担当」+ 2 次「保守ベンダ（翌営業日）」）で運用体制が小さい
  - NFR F.2.2.1 Lv2（モジュラ構成の明示）
  - NFR A.2.1.1 Lv3（N+1 冗長）+ B.3.1.1 Lv2（スケールアウト）+ B.1.2.1 Lv2（ピーク 2 倍）
decision: |
  tier-backend-api の 1 ティア内を BC-001〜BC-006 の 6 モジュールに分割するモジュラモノリスを採用する（SP-014 / SR-014）。
  BC-007 メール配信は tier-external-gateway に実装し、唯一の ACL 境界とする。
  実行基盤は CaaS(k8s) を第一候補とし（FaaS を次点）、N+1 冗長とスケールアウトを標準機能で実現する。
  ワーカー（tier-worker）は CronJob(k8s) + MQ コンシューマとし、
  CronJob と MQ コンシューマは同一デプロイ成果物・別プロセスとしてハンドラのみ分離する（LR-017）。
  マイクロサービス分割・BFF ティア・専用検索エンジンティア・認可サービスティアはいずれも採用しない。
consequences:
  positive:
    - "単一デプロイで運用対象が最小になり、小規模な運用体制（NFR C.5.x）に見合う"
    - "NFR F.2.2.1 Lv2（モジュラ構成の明示）を BC = モジュールの対応で構造的に満たす"
    - "CaaS(k8s) により N+1 冗長（A.2.1.1 Lv3）とスケールアウト（B.3.1.1 Lv2）を標準機能で得られる"
    - "BC 境界が保たれていれば将来のマイクロサービス分割へ段階的に移行できる"
  negative:
    - "モジュール間の境界維持がコードレビュー頼みになり、依存の逆流を機械的に防げない"
    - "k8s の運用スキルが必要で、小規模チームにとって学習コストになる"
    - "日次バッチのピークが MQ コンシューマのリソースと同居する（Worker を同一成果物としたため）"
alternatives_considered:
  - name: "Option B: 単純モノリス（モジュール分割なし）"
    reason_rejected: "NFR F.2.2.1 Lv2（モジュラ構成の明示）を満たせず、6 BC の境界がコード上に現れない"
  - name: "Option C: BC ごとのマイクロサービス（6 サービス）"
    reason_rejected: "同時アクセス〜100・50 TPS の規模に対して運用対象・CI/CD・監視が 6 系統に増え、運用体制（C.5.1.1 Lv1）に見合わない"
  - name: "バックエンド API を FaaS で構成する"
    reason_rejected: "モジュラモノリスの単一デプロイ単位と相性が悪く、コールドスタートがレスポンスタイム 5 秒目標（B.2.1.1 Lv3）の余裕を削る。次点候補として保持する"
