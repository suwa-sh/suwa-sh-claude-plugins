uc: 貸出を登録する
business: 蔵書利用業務
buc: 書籍を貸し出すフロー
bounded_context_id: BC-003
aggregate_id: AG-003
models:
- name: 窓口貸出受付画面（BookCard / UserProfileCard / ToggleGroup / DueDateIndicator）
  tier: tier-frontend-staff
  layer: view
  type: view-model
  rdra_info: 貸出
- name: LoanRegistrationState
  tier: tier-frontend-staff
  layer: state
  type: state
  rdra_info: 貸出
- name: RegisterLoanCommand
  tier: tier-backend-api
  layer: usecase
  type: command
  rdra_info: 貸出
- name: Loan
  tier: tier-backend-api
  layer: domain
  type: entity
  rdra_info: 貸出
- name: DueDate
  tier: tier-backend-api
  layer: domain
  type: value-object
  rdra_info: 貸出
- name: Book
  tier: tier-backend-api
  layer: domain
  type: entity
  rdra_info: 書籍
- name: User
  tier: tier-backend-api
  layer: domain
  type: entity
  rdra_info: 利用者
- name: Reservation
  tier: tier-backend-api
  layer: domain
  type: entity
  rdra_info: 予約
tables:
- name: loans
  rdra_info: 貸出
  operations:
  - type: INSERT
    columns:
    - name: loan_id
      value: 採番した貸出ID
    - name: book_id
      value: 要求の book_id
    - name: user_no
      value: 要求の user_no
    - name: loan_date
      value: 貸出登録日（本日）
    - name: loan_period_type
      value: 要求のloan_period_type。適用可否はRDRA latest
    - name: due_date
      value: 'docs/rdra/latest/条件.tsv: 貸出管理/返却期限設定条件'
    - name: loan_status
      value: 'docs/rdra/latest/状態.tsv: 状態モデル=貸出状態; 遷移UC=貸出を登録する'
    - name: book_title
      value: 貸出時点の books の当該値のスナップショット
    - name: book_author
      value: 貸出時点の books の当該値のスナップショット
    - name: book_isbn
      value: 貸出時点の books の当該値のスナップショット
    - name: book_genre
      value: 貸出時点の books の当該値のスナップショット
    where: ''
  indexes_needed:
  - columns:
    - book_id
    - loan_status
    reason: 同一書籍に有効な貸出（貸出中/延滞）が重複しないことの確認と、返却時の対象貸出特定に使う
    access_pattern: 書籍IDと貸出状態で有効な貸出の存在確認
  - columns:
    - user_no
    - loan_status
    reason: 利用者ごとの進行中貸出の有無確認（利用者状態の遷移判定・利用者削除可否条件）に使う
    access_pattern: 利用者番号と貸出状態での絞り込み
- name: books
  rdra_info: 書籍
  operations:
  - type: SELECT
    columns: []
    where: book_id = :book_id FOR UPDATE
  - type: UPDATE
    columns:
    - name: book_status
      value: 'docs/rdra/latest/状態.tsv: 状態モデル=書籍状態; 遷移UC=貸出を登録する'
    - name: updated_at
      value: 貸出登録イベントの発生時刻
    where: ロック取得済み対象の主キー一致。適用可能な現状態はRDRA latestの該当遷移
  indexes_needed:
  - columns:
    - book_id
    reason: 貸出対象書籍の取得と更新。主キーで充足する
    access_pattern: 書籍IDによる 1 件取得・更新
- name: users
  rdra_info: 利用者
  operations:
  - type: SELECT
    columns: []
    where: user_no = :user_no
  - type: UPDATE
    columns:
    - name: user_status
      value: 'docs/rdra/latest/状態.tsv: 状態モデル=利用者状態; 遷移UC=貸出を登録する'
    - name: updated_at
      value: 貸出登録イベントの発生時刻
    where: ロック済みuser_no一致。登録済みは遷移し、取引進行中は同状態を維持
  indexes_needed:
  - columns:
    - user_no
    reason: 貸出先利用者の取得と更新。主キーで充足する
    access_pattern: 利用者番号による 1 件取得・更新
- name: reservations
  rdra_info: 予約
  operations:
  - type: SELECT
    columns: []
    where: book_id = :book_id AND reservation_status IN ('予約中', '取置き中') ORDER BY reservation_id
      ASC FOR UPDATE NOWAIT
  - type: UPDATE
    columns:
    - name: reservation_status
      value: 'docs/rdra/latest/状態.tsv: 状態モデル=予約状態; 遷移UC=貸出を登録する'
    - name: hold_expires_at
      value: NULL（取置きが成立して終了したため保持期限を残さない。reservation_status と同一 UPDATE 文で更新する）
    where: ロック取得済み対象の主キー一致。適用可能な現状態はRDRA latestの該当遷移
  - type: UPDATE
    columns:
    - name: priority
      value: 更新前のpriority - 1
    where: book_id = :book_id AND reservation_status IN ('予約中', '取置き中') AND priority
      > :completed_priority
  indexes_needed:
  - columns:
    - book_id
    - reservation_status
    - priority
    reason: 取置き中書籍貸出条件で対象書籍の取置き中予約を順位順に特定する
    access_pattern: 書籍ID + 予約状態で絞り込み、予約順位の昇順で先頭 1 件を取得
- name: idempotency_receipts
  operations:
  - type: INSERT
    columns:
    - name: scope
      value: 認証主体ID + operationId
    - name: idempotency_key
      value: 検証済みUUIDv7
    - name: request_hash
      value: 固定順要求JSONのSHA-256
    - name: response_status
      value: NULL（同一取引の最終UPDATEで確定応答を設定）
    - name: response_body
      value: NULL（同一取引の最終UPDATEで確定応答を設定）
    - name: response_location
      value: NULL（同一取引の最終UPDATEで確定応答を設定）
    - name: expires_at
      value: UUIDv7の発行時刻 + 24時間
    where: 業務更新と同一取引
  - type: UPDATE
    columns:
    - name: response_status
      value: '201'
    - name: response_body
      value: 確定LoanResponse JSON
    - name: response_location
      value: 確定貸出URI
    where: 同一取引でINSERTしたscopeとidempotency_key一致
  indexes_needed:
  - columns:
    - scope
    - idempotency_key
    reason: 同一操作の一意性と応答照合
    access_pattern: UNIQUE完全一致
kvs:
- name: loan-response-cache
  key: 認証主体ID + createLoan + UUIDv7
  value: RDB receiptの複製
  ttl: キーのexpires_atまで
object_storage: []
mutation_set: register-loan
