# 派生物。正本は design-event.yaml。編集しない
screens:
  - name: "蔵書検索画面"
    portal: "patron"
    route: "/search"
    uc: "書籍を検索する"
    components:
      - "PortalShell"
      - "BookSearchFilter"
      - "BookCard"
      - "Pagination"
      - "EmptyState"
      - "Skeleton"
    variants:
      - "Default"
      - "EmptyKeyword"
      - "Empty"
      - "SearchFailed"
    story: "Pages/利用者ポータル/蔵書検索画面"
  - name: "書籍詳細・在庫状況画面"
    portal: "patron"
    route: "/books/:bookId"
    uc: "書籍詳細と在庫状況を照会する"
    components:
      - "PortalShell"
      - "BookCard"
      - "BookStatusBadge"
      - "ReservationQueueTracker"
      - "Button"
      - "Alert"
    variants:
      - "Available"
      - "OnLoanWithReservation"
      - "Loading"
      - "NotFound"
    story: "Pages/利用者ポータル/書籍詳細・在庫状況画面"
  - name: "書籍予約申込画面"
    portal: "patron"
    route: "/books/:bookId/reserve"
    uc: "予約を登録する"
    components:
      - "PortalShell"
      - "BookCard"
      - "ReservationQueueTracker"
      - "Alert"
      - "Button"
      - "Modal"
    story: "Pages/利用者ポータル/書籍予約申込画面"
    variants:
      - "OnLoan"
      - "AlreadyAvailable"
      - "AlreadyReserved"
      - "Loading"
