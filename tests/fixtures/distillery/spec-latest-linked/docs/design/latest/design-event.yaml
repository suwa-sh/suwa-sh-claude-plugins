  framework: "@storybook/nextjs-vite (Storybook 10 / Next.js 16 / React 19 / Tailwind CSS v4)"
  addons:
    - "@storybook/addon-docs"
    - "@storybook/addon-a11y"
    - "@storybook/addon-vitest"
    - "@chromatic-com/storybook"
    - "@storybook/addon-mcp"
  categories:
    Common: "画面横断の共通コンポーネント 11 種 + フック 3 種（既存 UI/Domain の合成。新規視覚表現は LoadingState のみ）"
    Shell: "アプリシェルとルーティング所有権（AppShell / ルート表 41 件 / 遷移 API）"
    Pages: "全 41 UC のページ Story（利用者ポータル 16 画面 / 司書ポータル 25 画面）"
    Introduction: "デザインシステムの目的・ブランド・入力モデル"
    "Design Tokens": "primitive / semantic / component の 3 層トークン一覧"
    "Screen Mapping": "RDRA 画面 41 件 → ルート → コンポーネント"
    "State Mapping": "RDRA 状態モデル 6 種 → Badge / Color"
    Brand: "ロゴ 3 バリアント / アイコン 42 種"
    UI: "共通コンポーネント 13 種"
    Domain: "ドメイン特化コンポーネント 19 種"
  globals:
    portal: "patron | staff（data-portal 属性で切替）"
    theme: "light | dark（.dark クラスと prefers-color-scheme の両対応）"
