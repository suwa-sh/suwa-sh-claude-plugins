  common:
    - name: "PortalShell"
      description: "両ポータル共通のレイアウト骨格（サイドバー 16rem + ヘッダー + コンテンツ）。ナビは RDRA 業務 7 件 + 共通メニュー 2 件"
      path: "src/components/ui/PortalShell.tsx"
    - name: "stateMaps"
      description: "RDRA 状態モデル 6 種とバリエーション 9 種の定数・Badge マッピング。ここに無い状態を追加してはならない"
      path: "src/components/domain/stateMaps.ts"
    - name: "Icon"
      description: "Lucide 準拠のインライン SVG アイコン（42 種）。currentColor でトークン着色できる"
      path: "src/components/ui/Icon.tsx"
    - name: "PortalPageLayout"
      description: "全 41 UC が使う共通レイアウトシェル。PortalShell + Icon + Logo の合成。portal/title/breadcrumb/actions/width で画面差分を吸収し、画面側にポータル色・ナビ定義を書かせない。フッターと本文スキップリンクもここに集約する"
      path: "src/components/common/PortalPageLayout.tsx"
    - name: "AsyncSection"
      description: "一覧・詳細取得系画面の Skeleton / EmptyState / Alert(destructive) 3 状態を統一する（Skeleton + EmptyState + Alert の合成）"
      path: "src/components/common/AsyncSection.tsx"
    - name: "DataListSection"
      description: "「フィルター → 一覧 → ページ送り」の縦積みレイアウトと 20 件/頁の分割を統一する（Table/Domain テーブル + Pagination + AsyncSection の合成）"
      path: "src/components/common/DataListSection.tsx"
    - name: "FilterPanel"
      description: "単一/複数選択トグル + 検索語 + 実行ボタン + 結果件数の並びと詳細条件の折りたたみを統一する（ToggleGroup + Input + Button の合成）"
      path: "src/components/common/FilterPanel.tsx"
    - name: "EntityFormSection"
      description: "フォームのレイアウト・ラベル・エラー表示・送信中無効化を統一し、edit モードで現在値との差分サマリを出す（Card + Input + ToggleGroup + Alert + Button の合成）"
      path: "src/components/common/EntityFormSection.tsx"
    - name: "ConfirmActionModal"
      description: "確認ダイアログの文言構造（対象名再掲→影響明示→取消可否）とフォーカス制御を統一する（Modal + Button + Alert の合成）"
      path: "src/components/common/ConfirmActionModal.tsx"
    - name: "SubmitActionButton"
      description: "更新系 API の二重送信防止（冪等キー・aria-busy・disabled）を集約する（Button の合成）"
      path: "src/components/common/SubmitActionButton.tsx"
    - name: "PiiMaskedText"
      description: "連絡先など個人情報の既定マスクと明示操作による開示を集約する（pii トークン + Button(ghost) の合成）"
      path: "src/components/common/PiiMaskedText.tsx"
    - name: "NotificationLogSection"
      description: "通知 3 UC（取置き通知/リマインド/督促）共通の送信対象サマリ→送信実行→実績一覧→再送のテンプレート（NotificationLogTable + NotificationStatusBadge + Alert + SubmitActionButton の合成）"
      path: "src/components/common/NotificationLogSection.tsx"
    - name: "ReportSummarySection"
      description: "KPI行→推移チャート→明細テーブルの情報階層とレポート状態表現を統一する（ReportKpiCard + LoanTrendChart + ReportStatusBadge + Table + EmptyState の合成）"
      path: "src/components/common/ReportSummarySection.tsx"
    - name: "useListQueryState"
      description: "一覧の検索条件・ページをクエリパラメータ相当の状態と同期する（画面をまたぐ共有状態を持たない）"
      path: "src/components/common/hooks/useListQueryState.ts"
    - name: "useIdempotentMutation"
      description: "画面表示時に冪等キー（UUID）を発行し、送信・再送で同一キーを維持する"
      path: "src/components/common/hooks/useIdempotentMutation.ts"
    - name: "useApiErrorPresenter"
      description: "API エラーを4分類（通信/認可/業務ルール違反/競合）に正規化し、表示先と重篤度を決める"
      path: "src/components/common/hooks/useApiErrorPresenter.ts"
    - name: "LoadingState"
      description: "loading 表現の唯一の入口。kind で Skeleton / Spinner を出し分ける（list=SkeletonTable / card=SkeletonCard / detail=SkeletonDetail / line=Skeleton / action=Spinner(inline) / page=Spinner(overlay)）。同一領域で Skeleton と Spinner を併用せず、常に aria-busy と読み上げラベルを伴う。ちらつきが問題になる領域だけ delayMs（推奨 300ms）で遅延表示する。画面側で独自 loading UI を作ってはならない。画面実装は LoadingState だけを import し、Skeleton / Spinner を直接 import しない（実体は components.ui[].path = src/components/ui/Feedback.tsx に同居する）"
      path: "src/components/common/LoadingState.tsx"
    - name: "AppShell"
      description: "アプリのエントリポイント兼シェル（AppShell / AppShellByPath）。ルート id または URL からポータル・画面名・アクティブナビを解決し、404 とポータル外アクセスを判定する。デザインシステムが所有し、実装リポは onNavigate に router.push を注入して children にページ本体を渡すだけにする"
      path: "src/components/common/AppShell.tsx"
    - name: "appRoutes"
      description: "URL の正本となるルート表（41 件）。screens[].route と 1:1 で route id / path / portal / 画面 / UC / 業務 / nav / params を定義する。getRoute・buildPath・matchPath・routesOf を提供し、画面側の URL 文字列直書きを禁止する。RDRA の BUC / 画面に無いルートを追加してはならない"
      path: "src/components/common/routes.ts"
    - name: "useAppNavigation"
      description: "画面遷移の唯一の API。ルート id 指定で navigate / href を行い、AppShell の外で使うと例外にしてシェル未装着を早期検出する"
      path: "src/components/common/hooks/useAppNavigation.ts"

