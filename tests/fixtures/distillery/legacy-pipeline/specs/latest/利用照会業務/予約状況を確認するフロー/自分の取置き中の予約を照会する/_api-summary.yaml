# _api-summary.yaml
uc: "自分の取置き中の予約を照会する"
business: "利用照会業務"
buc: "予約状況を確認するフロー"
endpoints:
  - operation_id: "listMyHolds"
    method: "GET"
    path: "/api/v1/me/reservations/holds"
    summary: "本人の取置き中の予約を取置き期限の昇順で一覧取得する（期限当日件数つき）"
    response_schema: "MyHoldListResponse"
    tags: ["holds", "me"]
async_events: []
# cross-UC API 依存（他 UC 所有 operation の利用）。形式は
# _cross-cutting/api/uc-api-dependencies.md「記録場所と形式」を正本とする。
# 本 UC は自 UC 所有の listMyHolds だけで成立する
# （取置き受取案内画面・予約状況一覧画面へは画面遷移のみで、本画面から API を呼ばない）。
consumes: []
schemas:
  - name: "MyHoldListResponse"
    properties:
      - name: "items"
        type: "array<MyHoldItem>"
        required: true
      - name: "total"
        type: "integer"
        required: true
      - name: "expiring_today_count"
        type: "integer"
        required: true
      - name: "user_no"
        type: "string"
        required: true
  - name: "MyHoldItem"
    properties:
      - name: "reservation_id"
        type: "string"
        required: true
      - name: "book_id"
        type: "string"
        required: true
      - name: "book_title"
        type: "string"
        required: true
      - name: "book_author"
        type: "string"
        required: true
      - name: "book_genre"
        type: "string"
        required: true
      - name: "book_material_type"
        type: "string"
        required: true
      - name: "reservation_status"
        type: "string"
        required: true
      - name: "hold_started_at"
        type: "string(date-time)"
        required: false
      - name: "hold_expires_at"
        type: "string(date-time)"
        required: true
      - name: "days_remaining"
        type: "integer"
        required: true
