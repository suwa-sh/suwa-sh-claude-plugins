schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-002"
title: "通知メール送信とレポート集計だけを MQ 経由の非同期にし、at-least-once + 冪等消費 + DLQ 退避で受ける"
status: "approved"
generated_at: "2026-09-02T16:42:47+09:00"
context: |
  全 41 UC のうち、どの処理を同期 API 内で完結させ、どの処理を非同期メッセージングへ逃がすかの
  境界を確定する必要があった。判断材料は次のとおり。

  - **外部 I/O に依存し、レイテンシと失敗率が制御できない処理**が 2 系統ある。
    1. メール配信サービス連携（取置き案内 / 返却期限リマインド / 延滞督促）
    2. 全件走査を伴う統計集計（在庫状況の区分別集計 / 期間別貸出統計）
  - 通知は日次バッチ（返却期限接近判定・期限超過判定）と司書の再送操作の両方が契機となり、
    1 回の起動で多数の対象に対してまとめて送信要求が発生する。
  - レポートは司書が画面から集計を要求し、結果を後から参照する業務フローであり、
    集計完了まで画面を待たせる必要がない（統計レポート状態に「集計中」がある）。
  - 一方、貸出・返却・予約・取消・利用者管理は、操作者がその場で結果（可否判定・返却期限・
    予約順位）を確認する必要があり、業務ルール違反はその場で提示しなければならない。
  - アーキテクチャ設計でメッセージングティア（MQ、ベンダーニュートラル）と Worker ティアが
    確定しており、ブローカー製品はインフラ設計ステージで決める。
decision: |
  **同期・非同期の境界を「操作者がその場で結果を必要とするか」と「外部 I/O へ依存するか」で引く。**

  1. **同期（REST API 内で完結）**: 貸出可否判定・貸出登録・返却登録・返却後の書籍状態更新・
     予約登録・予約取消・予約順位照会・利用者管理・蔵書管理・各種照会。
     業務ルール違反は 409 で即時に返し、状態遷移は 1 トランザクション内で確定させる。
  2. **非同期（MQ 経由、Backend API が producer / Worker が consumer）**: 次の 2 系統のみ。
     - 通知送信要求 3 種: `notification.hold-notice.requested`（取置き案内）/
       `notification.remind.requested`（返却期限リマインド）/ `notification.dun.requested`（延滞督促）
     - レポート集計要求 1 種: `report.aggregation.requested`
       （在庫状況・期間別貸出統計の 2 メッセージ型を同一チャネルに載せる）
     API 側は「通知レコードを作成して publish する」「統計レポートを『集計中』で作成して publish する」
     までを同期で確定し、外部連携と重い集計は Worker へ委譲する。
  3. **配信保証は at-least-once とし、順序保証は要求しない**。重複は消費側の冪等制御で吸収する。
     冪等は 3 層で担保する。
     - 粗い層: `idem:mq:consumed:{message_id}`（KVS、TTL 24h）で同一メッセージの再処理を検知
     - 業務層: `idem:notification:loan:{通知種別}:{対象貸出ID}:{通知タイミング区分}:{基準日}`（TTL 7d）と
       `idem:notification:reservation:{通知種別}:{対象予約ID}`（TTL 24h）で、
       日次ジョブ再実行と MQ 再配信の双方に対して同じキーが立つよう決定的に生成する
     - 最終防御: RDB の `notification_idempotency_keys` テーブルに永続化し、KVS 消失時も重複送信を防ぐ
  4. **DLQ 方針**: チャネルごとに DLQ を 1 対 1 で併設する
     （`notification.hold-notice.dlq` / `notification.remind.dlq` / `notification.dun.dlq` /
     `report.aggregation.dlq`）。リトライ上限を超えたメッセージは Worker が DLQ へ publish し、
     - 通知系は対象の通知状態を「送信失敗」として記録し、アラートを上げる。
       司書は再送操作（`POST /api/v1/staff/notifications/{id}/resend` / `/retry`）で復旧できる。
     - レポート系は対象の統計レポートが「集計中」のまま滞留するため、運用監視の対象とする。
     DLQ からの再処理は自動化せず、**手順書に基づく手動操作**とする。
     自動再投入は、原因未修正のまま無限ループする恐れと、督促メールの誤再送が
     利用者影響を持つことを踏まえて採らない。
  5. **メッセージ本文に個人情報を載せない**。通知 ID・利用者番号・対象貸出 ID / 予約 ID の参照のみを
     格納し、氏名・メールアドレスの解決は Worker が RDB から行う。
     ブローカーの保持期間・DLQ 滞留・ログ出力を通じた個人情報の拡散を防ぐ。
consequences:
  positive:
    - "メール配信サービスの遅延・障害が、貸出／返却／予約などの窓口業務の応答時間へ波及しない"
    - "日次バッチが多数の通知対象を検出しても、送信要求をキューでバッファでき、外部サービスのレート制限に対してスループットを平準化できる"
    - "レポート集計が全件走査でも司書の画面を占有せず、「集計中」→「作成済み／実績なし」の状態遷移として観測できる"
    - "リトライ上限超過が DLQ 滞留とアラートという明示的な信号になり、通知の未達を運用が検知できる"
    - "冪等キーを KVS と RDB に二重化したため、KVS 消失時も督促・リマインドの重複送信を防げる"
    - "メッセージ本文から個人情報を排除したことで、ブローカーと DLQ が個人情報の保管先にならない"
  negative:
    - "MQ ティアと Worker ティアが可用性・監視の対象として増え、DLQ 滞留数・消費遅延の監視設計が必須になる"
    - "通知の送信結果が API のレスポンスで返らないため、司書は通知実績画面で事後確認する運用となり、UI に状態確認の導線が必要になる"
    - "at-least-once + 順序保証なしのため、消費側の冪等実装が正しさの前提になる。冪等キーの生成規則を誤ると重複送信または送信漏れが発生する"
    - "DLQ からの再処理を手動運用としたため、障害復旧に運用手順書と担当者の介在が必要で、平均復旧時間が延びる"
    - "Worker が宛先を RDB から解決するため、送信要求時点と実送信時点でメールアドレスが変わりうる（利用者情報編集との競合）"
alternatives_considered:
  - name: "通知メール送信も同期 API 内で外部メール配信サービスを直接呼ぶ"
    reason_rejected: |
      外部サービスのレイテンシと障害が、返却登録・予約取消などの窓口業務の応答へ直結する。
      日次バッチが多数の対象を検出した場合、1 リクエスト内での逐次送信がタイムアウトし、
      「一部だけ送信済み」という中途半端な状態が残る。再実行時の重複送信も避けられない。
  - name: "全 UC 間通信をイベント駆動にする（貸出・返却・予約も非同期化）"
    reason_rejected: |
      貸出可否判定・予約順位・返却期限は操作者がその場で確認する必要があり、
      結果整合性では窓口業務が成立しない。また業務ルール違反（貸出上限超過など）を
      同期の 409 で返せなくなり、エラー提示が非同期の通知経路に依存する。
      41 UC 規模に対して分散トランザクション（Saga）の補償設計コストが過大。
  - name: "MQ を使わず DB のジョブテーブルをポーリングするワーカー方式"
    reason_rejected: |
      アーキテクチャ設計でメッセージングティアが確定しており、DLQ・リトライ・可視性タイムアウトを
      自前実装することになる。ポーリング間隔が通知遅延の下限を決めてしまい、
      取置き案内の即時送信要件と噛み合わない。RDB への常時ポーリング負荷も増える。
  - name: "DLQ を単一の共通チャネルに集約する"
    reason_rejected: |
      通知種別ごとに復旧手順と業務影響が異なる（取置き案内は予約 1 件に 1 回、
      督促は日次で再判定される、レポートは集計の再実行で回復する）。
      共通 DLQ ではメッセージ型の判別と振り分けが再処理側の責務になり、
      滞留アラートも業務単位で切り分けられない。
  - name: "DLQ のメッセージを自動でリトライキューへ再投入する"
    reason_rejected: |
      原因が未修正の場合に再投入ループとなり、外部メール配信サービスへ負荷をかけ続ける。
      特に延滞督促メールの誤再送は利用者への直接的な不利益となるため、
      人の確認を挟む手動再処理を選んだ。
  - name: "メッセージ本文に宛先メールアドレスと氏名を含めて Worker の DB 参照をなくす"
    reason_rejected: |
      個人情報がブローカーの保持領域・DLQ・メッセージログへ複製され、
      個人情報参照可否条件（既定マスク・明示指定時のみ生値）と整合しない。
      DLQ に滞留したメッセージが長期間の個人情報保管先になる点も許容できない。
