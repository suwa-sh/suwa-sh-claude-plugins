      - uc: "返却対象の貸出を照会する"
        operations: ["SELECT"]
      - uc: "自分の返却済み貸出を照会する"
        operations: ["SELECT"]
      - uc: "自分の貸出内容と返却期限を照会する"
        operations: ["SELECT"]
      - uc: "自分の現在の貸出を照会する"
        operations: ["SELECT"]
      - uc: "自分の貸出履歴を照会する"
        operations: ["SELECT"]
      - uc: "利用者を削除する"
        operations: ["SELECT"]
      - uc: "利用者一覧を照会する"
        operations: ["SELECT"]
      - uc: "期間別貸出統計を集計する"
        operations: ["SELECT"]
      - uc: "期限超過の貸出を延滞にする"
        operations: ["SELECT", "UPDATE"]
      - uc: "延滞中の貸出を照会する"
        operations: ["SELECT"]
      - uc: "自分の延滞中の貸出を照会する"
        operations: ["SELECT"]
      - uc: "督促メールを送信する"
        operations: ["SELECT"]
      - uc: "リマインドメールを送信する"
