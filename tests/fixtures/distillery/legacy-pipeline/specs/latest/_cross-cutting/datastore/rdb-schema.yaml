  - name: "reservations"
    rdra_info: "予約"
    description: "貸出中の書籍に対する利用者の予約を表すスナップショットテーブル。arch E-005（model_type: event_snapshot）に対応する。申込順の予約順位と取置き状況を管理し、予約登録・取消・取置き遷移・貸出済み遷移の対象となる"
    columns:
      - name: "reservation_id"
        type: "string"
        nullable: false
        description: "予約ID。予約1件を一意に識別する主キー（RDRA 情報「予約」の予約ID）"
      - name: "book_id"
        type: "string"
        nullable: true
        description: "予約対象の書籍ID。books への参照。予約待ち行列の単位となる。書籍が物理削除されると SET NULL となる（削除可否条件により有効予約は残らないため、NULL になるのはキャンセル／貸出済みの履歴行のみ）"
      - name: "user_no"
        type: "string"
        nullable: true
        description: "予約申込者の利用者番号。users への参照。本人限定参照の絞り込み条件となる。利用者が物理削除されると SET NULL となる（匿名化方針。削除可否条件により有効予約は残らない）"
      - name: "applied_at"
        type: "datetime"
        nullable: false
        description: "予約申込日時。予約順位決定条件の昇順ソートキーであり、予約状況一覧の降順ソートキーでもある"
      - name: "priority"
        type: "integer"
        nullable: false
        description: "予約順位。同一書籍の有効予約件数＋1 で採番し、取消時は後続を繰り上げ再計算する"
      - name: "reservation_status"
        type: "string"
        nullable: false
        description: "予約状態。RDRA 状態モデル「予約状態」。値: 予約中, 取置き中, 貸出済み, キャンセル。有効な予約は 予約中／取置き中 を指す。遷移元・遷移先・同時更新列は本ファイルの state_transition_rules「予約状態遷移規則」が唯一の正本であり、UC 側で個別定義しない"
      - name: "hold_expires_at"
        type: "datetime"
        nullable: true
        description: "取置き期限。取置き遷移時に設定し、取置き期限切れの日次判定でインデックス検索するためスナップショットに保持する（arch のイミュータブル原則の明示的例外）。取置き中以外は NULL（貸出済み・キャンセルへの遷移時に同一トランザクションで NULL へ戻す。state_transition_rules「予約状態遷移規則」の invariants を参照）"
      - name: "hold_started_at"
        type: "datetime"
        nullable: true
        description: "取置き開始日時。取置き遷移時に設定する。取置き状況照会（取置き開始日時の表示）がこの値を参照する。取置きを経ていない予約は NULL"
    primary_key: ["reservation_id"]
    foreign_keys:
      - columns: ["book_id"]
        references:
          table: "books"
          columns: ["book_id"]
        on_delete: "SET NULL"
      - columns: ["user_no"]
        references:
          table: "users"
          columns: ["user_no"]
        on_delete: "SET NULL"
    indexes:
      - name: "uq_reservations_book_id_user_no_active"
        columns: ["book_id", "user_no"]
        unique: true
        partial_condition: "reservation_status IN ('予約中','取置き中')"
        reason: "ユニーク制約: 重複予約禁止ポリシー（同一利用者が同一書籍に有効な予約を二重に持てない）を部分インデックスで担保する"
        used_by: ["予約を登録する"]
      - name: "idx_reservations_book_id_reservation_status_priority"
        columns: ["book_id", "reservation_status", "priority"]
        unique: false
        reason: "書籍単位の有効予約を予約順位の昇順で走査する。予約順1位の抽出・取置き対象特定・順位繰り上げ・有効予約件数の集計を 1 本の索引で満たす（カーディナリティの高い book_id を先頭に置く）"
        used_by: ["予約順1位の利用者を特定する", "予約を取り消す", "予約を登録する", "書籍の貸出可否を判定する", "貸出を登録する", "返却後の書籍状態を更新する", "書籍詳細と在庫状況を照会する", "書籍を削除する", "自分の予約順位を照会する"]
      - name: "idx_reservations_user_no_reservation_status_applied_at"
        columns: ["user_no", "reservation_status", "applied_at"]
        unique: false
        reason: "本人限定参照の絞り込み＋予約状態フィルタ＋申込日時降順のページングを 1 本の索引で満たす。進行中予約件数の集計（利用者削除可否条件）でも先頭 2 列を利用する"
        used_by: ["自分の予約状況を照会する", "利用者を削除する", "利用者一覧を照会する", "返却を登録する"]
      - name: "idx_reservations_user_no_reservation_status_hold_expires_at"
        columns: ["user_no", "reservation_status", "hold_expires_at"]
        unique: false
        reason: "本人の取置き中予約を取置き期限の昇順で取得する"
        used_by: ["自分の取置き中の予約を照会する"]
    used_by:
      - uc: "予約を登録する"
        operations: ["SELECT", "INSERT"]
      - uc: "予約を取り消す"
        operations: ["SELECT", "UPDATE"]
      - uc: "自分の予約順位を照会する"
        operations: ["SELECT"]
      - uc: "自分の予約状況を照会する"
        operations: ["SELECT"]
      - uc: "自分の取置き中の予約を照会する"
        operations: ["SELECT"]
      - uc: "自分の取置き状況を照会する"
        operations: ["SELECT"]
      - uc: "予約順1位の利用者を特定する"
        operations: ["SELECT"]
      - uc: "取置き通知メールを送信する"
        operations: ["SELECT", "UPDATE"]
      - uc: "書籍詳細と在庫状況を照会する"
        operations: ["SELECT"]
      - uc: "書籍を削除する"
        operations: ["SELECT"]
      - uc: "書籍の貸出可否を判定する"
        operations: ["SELECT"]
      - uc: "貸出を登録する"
        operations: ["SELECT", "UPDATE"]
      - uc: "返却を登録する"
        operations: ["SELECT"]
      - uc: "返却後の書籍状態を更新する"
        operations: ["SELECT"]
      - uc: "利用者を削除する"
        operations: ["SELECT"]
      - uc: "利用者一覧を照会する"
        operations: ["SELECT"]

  - name: "notifications"
    rdra_info: "通知"
    description: "予約の取置き案内・返却期限リマインド・延滞督促のメール送信実績を表すスナップショットテーブル。arch E-006（model_type: event_snapshot）に対応する。送信条件が成立すると送信待ちで作成し、メール配信サービスとの連携結果で送信済み／送信失敗を記録する。重複送信の抑止と未達の追跡に使う"
    columns:
      - name: "notification_id"
        type: "string"
        nullable: false
        description: "通知ID。通知1件を一意に識別する主キー（RDRA 情報「通知」の通知ID）"
      - name: "notification_type"
        type: "string"
        nullable: false
        description: "通知種別。RDRA バリエーション「通知種別」。値: 取置き案内, 返却期限リマインド, 延滞督促"
      - name: "timing_type"
        type: "string"
        nullable: false
        description: "通知タイミング区分。RDRA バリエーション「通知タイミング区分」。値: 期限前リマインド, 期限当日, 期限超過督促。取置き案内では即時送信のため値の追加が必要（要確認）"
      - name: "recipient_user_no"
        type: "string"
        nullable: false
        description: "宛先利用者番号。送信時点の対象利用者を示す。利用者削除後も送信実績を追跡するため外部キー制約は張らない"
      - name: "recipient_email"
        type: "string"
        nullable: false
        description: "宛先メールアドレス。送信時点の値をコピーして保持し、利用者側の変更に追随させない。保管時暗号化の対象（NFR E.6.1.1）"
      - name: "target_loan_id"
        type: "string"
        nullable: true
        description: "対象貸出ID。返却期限リマインド・延滞督促のときに設定し、取置き案内では NULL"
      - name: "target_reservation_id"
        type: "string"
        nullable: true
        description: "対象予約ID。取置き案内のときに設定し、リマインド・督促では NULL"
      - name: "requested_at"
        type: "datetime"
        nullable: false
        default: "CURRENT_TIMESTAMP"
        description: "送信要求日時。送信実績一覧の日付絞り込みと直近督促1件の特定に使う。RDRA 情報「通知」の属性「送信日時」に対応する送信側の時刻。値の担保方法: 通知を INSERT する 3 UC（取置き通知メールを送信する／リマインドメールを送信する／督促メールを送信する）はいずれも本列を INSERT 列に挙げないため、DB 側の default CURRENT_TIMESTAMP で NOT NULL を担保する。arch E-006 の属性一覧には未記載のため要確認"
      - name: "send_result"
        type: "text"
        nullable: true
        description: "送信結果。メール配信サービスの応答コードとエラー内容を記録し未達追跡に使う。メールアドレスはマスクして格納する。送信前は NULL"
      - name: "sent_at"
        type: "datetime"
        nullable: true
        description: "送信日時。メール配信サービスの送信成功時に設定し、送信待ち・送信失敗の間は NULL。openapi.yaml NotificationLogItem.sent_at の唯一の供給元"
      - name: "notification_status"
        type: "string"
        nullable: false
        description: "通知状態。RDRA 状態モデル「通知状態」。値: 送信待ち, 送信済み, 送信失敗"
    primary_key: ["notification_id"]
    foreign_keys: []
    constraints:
      - name: "ck_notifications_target_exclusive"
        type: "check"
        expression: "(notification_type = '取置き案内' AND target_reservation_id IS NOT NULL AND target_loan_id IS NULL) OR (notification_type IN ('返却期限リマインド','延滞督促') AND target_loan_id IS NOT NULL AND target_reservation_id IS NULL)"
        reason: "通知種別と対象IDの排他関係（取置き案内は予約ID、リマインド・督促は貸出ID）を DB で担保する。どちらも NULL の行・どちらも埋まった行を拒否する"
    indexes:
      - name: "idx_notifications_type_status_requested_at"
        columns: ["notification_type", "notification_status", "requested_at"]
        unique: false
        reason: "司書の送信実績一覧を通知種別・通知状態・送信要求日で絞り込み、未達（送信失敗）件数を集計する"
        used_by: ["督促メールを送信する", "リマインドメールを送信する", "取置き通知メールを送信する"]
      - name: "idx_notifications_target_loan_id_type_requested_at"
        columns: ["target_loan_id", "notification_type", "requested_at"]
        unique: false
        reason: "対象貸出ごとの直近1件（target_loan_id IN (...) AND notification_type = '延滞督促' の requested_at 最新）を索引だけで解決する。重複送信抑止（arch SR-018）は timing_type を含む冪等キー（notification_idempotency_keys / KVS idem:notification:*）側で担保するため本索引には含めない"
        used_by: ["督促メールを送信する", "リマインドメールを送信する", "延滞中の貸出を照会する"]
      - name: "idx_notifications_target_reservation_id_type"
        columns: ["target_reservation_id", "notification_type"]
        unique: false
        reason: "同一予約への取置き案内の重複送信抑止（取置き通知対象条件）の存在確認に使う"
        used_by: ["取置き通知メールを送信する"]
    used_by:
      - uc: "取置き通知メールを送信する"
        operations: ["INSERT", "SELECT", "UPDATE"]
      - uc: "リマインドメールを送信する"
        operations: ["INSERT", "SELECT", "UPDATE"]
      - uc: "督促メールを送信する"
        operations: ["INSERT", "SELECT", "UPDATE"]
      - uc: "延滞中の貸出を照会する"
        operations: ["SELECT"]

  - name: "statistical_reports"
    rdra_info: "統計レポート"
    description: "在庫状況・人気書籍ランキング・期間別貸出統計を表すスナップショットテーブル。arch E-007（model_type: event_snapshot）に対応する。集計開始で集計中として作成し、実績があれば作成済み、実績がなければ実績なしとして司書へ案内する"
    columns:
      - name: "report_id"
        type: "string"
        nullable: false
        description: "レポートID。統計レポート1件を一意に識別する主キー（RDRA 情報「統計レポート」のレポートID）"
      - name: "report_type"
        type: "string"
        nullable: false
        description: "レポート種別。RDRA バリエーション「レポート種別」。値: 在庫状況, 人気書籍ランキング, 期間別貸出統計"
      - name: "period_type"
        type: "string"
        nullable: false
        description: "集計期間区分。RDRA バリエーション「集計期間区分」。値: 日次, 月次, 年次"
      - name: "period_start"
        type: "date"
        nullable: false
        description: "集計開始日。集計対象期間の下限"
      - name: "period_end"
        type: "date"
        nullable: false
        description: "集計終了日。集計対象期間の上限"
      - name: "aggregated_at"
        type: "datetime"
        nullable: false
        description: "集計日時。作成時は集計開始時刻、完了時は集計完了時刻で更新する。最新レポートと前回レポートの特定に使うソートキー"
      - name: "detail"
        type: "text"
        nullable: false
        description: "集計明細。書籍状態別件数・ジャンル別件数・稼働率・書籍別貸出回数・利用者区分別内訳などを構造化テキスト（JSON）で保持する導出データ。作成時は空の JSON オブジェクトで初期化する"
      - name: "report_status"
        type: "string"
        nullable: false
        description: "統計レポート状態。RDRA 状態モデル「統計レポート状態」。値: 集計中, 作成済み, 実績なし"
    primary_key: ["report_id"]
    foreign_keys: []
    indexes:
      - name: "idx_statistical_reports_report_type_aggregated_at"
        columns: ["report_type", "aggregated_at"]
        unique: false
        reason: "レポート種別ごとの最新1件の取得と、前回集計1件の取得（前期比の算出）を索引だけで解決する"
        used_by: ["在庫状況を区分別に集計する", "在庫状況レポートを参照する", "期間別貸出統計を集計する", "貸出統計レポートを参照する"]
      - name: "idx_statistical_reports_report_status"
        columns: ["report_status"]
        unique: false
        reason: "集計中レポートの滞留監視と重複消費の判定に使う"
        used_by: ["在庫状況を区分別に集計する"]
    used_by:
      - uc: "在庫状況を区分別に集計する"
        operations: ["INSERT", "SELECT", "UPDATE"]
      - uc: "在庫状況レポートを参照する"
        operations: ["SELECT"]
      - uc: "期間別貸出統計を集計する"
        operations: ["INSERT", "SELECT", "UPDATE"]
      - uc: "貸出統計レポートを参照する"
        operations: ["SELECT"]

  - name: "notification_idempotency_keys"
    rdra_info: "通知"
    description: "通知送信の冪等キーを保持するテーブル。arch E-902「通知送信冪等キー」（派生エンティティ）に対応する。MQ の at-least-once 配信による通知の重複生成を抑止する。KVS 側にも同じ判定キーを持ち、KVS 消失時の最終防御となる"
    columns:
      - name: "idempotency_key"
        type: "string"
        nullable: false
        description: "冪等キー。通知種別＋対象貸出ID／対象予約ID＋通知タイミング区分から決定的に生成する主キー"
      - name: "notification_id"
        type: "string"
        nullable: false
        description: "生成済みの通知ID。notifications への参照。重複要求に対して既存の通知IDを返すために保持する"
      - name: "requested_at"
        type: "datetime"
        nullable: false
        description: "送信要求日時。冪等キーが最初に登録された時刻"
      - name: "expires_at"
        type: "datetime"
        nullable: false
        description: "キー保持期限。期限切れのキーを定期削除して肥大化を防ぐ"
    primary_key: ["idempotency_key"]
    foreign_keys:
      - columns: ["notification_id"]
        references:
          table: "notifications"
          columns: ["notification_id"]
        on_delete: "CASCADE"
    indexes:
      - name: "idx_notification_idempotency_keys_expires_at"
        columns: ["expires_at"]
        unique: false
        reason: "保持期限切れの冪等キーを定期削除するバッチの走査に使う"
        used_by: ["取置き通知メールを送信する"]
    used_by:
      - uc: "取置き通知メールを送信する"
        operations: ["INSERT", "SELECT"]

  - name: "user_events"
    rdra_info: "利用者"
    description: "利用者に関するイミュータブルなイベントストリーム。設置根拠は『UC がスナップショットに残らない事実を必要とするか』であり、利用者は物理削除（匿名化）方式のため、退会後も残さなければならない監査証跡（登録・変更・退会の事実と変更項目）を users スナップショットだけでは保持できないことによる。UC「利用者を登録する／情報を編集する／削除する」が本テーブルへ追記する"
    columns:
      - name: "event_id"
        type: "uuid"
        nullable: false
        description: "イベントID。イベント1件を一意に識別する主キー"
      - name: "user_no"
        type: "string"
        nullable: false
        description: "対象の利用者番号。イベントストリームの集約キー。退会後も監査追跡のため保持するので外部キー制約は張らない"
      - name: "event_type"
        type: "string"
        nullable: false
        description: "イベント種別。値: USER_REGISTERED（登録）, USER_PROFILE_CHANGED（情報変更）, USER_WITHDRAWN（退会）"
      - name: "payload"
        type: "text"
        nullable: false
        description: "イベント内容。構造化テキスト（JSON）。個人情報（氏名・連絡先）は格納しない。登録・変更・退会のいずれでも、利用者区分・変更項目名・登録日時など識別性の無い項目のみを保持する。利用者は物理削除＋履歴の匿名化方式のため、payload に氏名・メールアドレスを残すと users 行を削除しても匿名化が成立しないことによる。個人情報を含まないため保管時暗号化（NFR E.6.1.1）の対象外とし、users.name / users.email の暗号化方針と保護水準の食い違いを生じさせない"
      - name: "occurred_at"
        type: "datetime"
        nullable: false
        description: "イベント発生時刻。スナップショットの registered_at / updated_at の射影元であり、時系列参照のソートキー"
    primary_key: ["event_id"]
    foreign_keys: []
    indexes:
      - name: "idx_user_events_user_no_occurred_at"
        columns: ["user_no", "occurred_at"]
        unique: false
        reason: "利用者ごとのイベント時系列取得（スナップショット再構築・監査追跡）に使う"
        used_by: ["利用者を登録する", "利用者情報を編集する", "利用者を削除する"]
    used_by:
      - uc: "利用者を登録する"
        operations: ["INSERT"]
      - uc: "利用者情報を編集する"
        operations: ["INSERT"]
      - uc: "利用者を削除する"
        operations: ["INSERT"]

state_transition_rules:
  - name: "予約状態遷移規則"
    table: "reservations"
    state_column: "reservation_status"
    description: |
      RDRA 状態モデル「予約状態」の遷移を、UC 仕様・_model-summary.yaml・DB 制約の
      唯一の正本としてここで定義する。各 UC は本表の遷移行をそのまま参照し、
      遷移元・遷移先・同時更新列を UC 側で個別に定義しない。
      同時更新列に挙げた列は、遷移と同一トランザクション内で必ず一緒に更新する
      （どれか 1 つでも欠けると参照先ごとに異なる状態が見えるため不整合となる）。
    transitions:
      - from: "（なし）"
        to: "予約中"
        trigger_uc: "予約を登録する"
        guard: "予約可否条件（対象書籍が貸出中）かつ重複予約でないこと"
        also_sets:
          - column: "priority"
            value: "同一書籍の有効予約件数 + 1（予約順位決定条件）"
          - column: "hold_expires_at"
            value: "NULL"
          - column: "hold_started_at"
            value: "NULL"
      - from: "予約中"
        to: "取置き中"
        trigger_uc: "取置き通知メールを送信する"
        guard: "取置き通知対象条件を満たし、取置き案内メールの送信が成功したこと"
        also_sets:
          - column: "hold_started_at"
            value: "送信実行日時"
          - column: "hold_expires_at"
            value: "送信実行日時 + 取置き保持日数（運用パラメータ）"
      - from: "取置き中"
        to: "貸出済み"
        trigger_uc: "貸出を登録する"
        guard: "取置き中書籍貸出条件（priority = 1 かつ予約者と貸出先が一致）"
        also_sets:
          - column: "hold_expires_at"
            value: "NULL（取置きは成立して終了したため保持期限を残さない）"
          - column: "hold_started_at"
            value: "変更しない（取置きの実績として保持する）"
      - from: "予約中 / 取置き中"
        to: "キャンセル"
        trigger_uc: "予約を取り消す"
        guard: "予約取消可否条件（本人の有効な予約であること）"
        also_sets:
          - column: "hold_expires_at"
            value: "NULL"
          - column: "hold_started_at"
            value: "変更しない"
    invariants:
      - "有効な予約は reservation_status IN ('予約中','取置き中') の行だけを指す"
      - "hold_expires_at が非 NULL になるのは reservation_status = '取置き中' の行だけとする（貸出済み・キャンセル・予約中では必ず NULL）"
      - "hold_started_at は取置きを 1 度でも経た予約で非 NULL となり、以後の遷移でクリアしない"
      - "終端状態（貸出済み / キャンセル）からの再遷移は行わない。再予約は新しい reservation_id を採番する"

er_diagram: |
  erDiagram
    users ||--o| user_accounts : "利用者アカウントを持つ"
    users ||--o{ loans : "貸出を行う"
    users ||--o{ reservations : "予約を行う"
    users ||--o{ user_events : "利用者イベントを蓄積する"
    books ||--o{ loans : "貸し出される"
    books ||--o{ reservations : "予約される"
    loans ||--o{ notifications : "リマインド・督促の宛先となる"
    reservations ||--o{ notifications : "取置き案内の宛先となる"
    users ||--o{ notifications : "通知を受け取る"
    notifications ||--o| notification_idempotency_keys : "冪等キーで重複生成を抑止する"
    books }o--o{ statistical_reports : "集計軸として参照される"
    loans }o--o{ statistical_reports : "実績が集計される"

_review_notes:
  - topic: "正規化レベル（3NF vs 非正規化許容）"
    note: "loans に book_title / book_author / book_isbn / book_genre の非正規化カラムを置いた。貸出当時の書誌を再現する意図（_model-summary「貸出を登録する」の INSERT 定義）だが、3NF を厳格に守るなら books を JOIN するか loan_events.payload だけに残す設計になる。方針の確定が必要"
  - topic: "books.isbn のユニーク制約"
    note: "ユニーク制約は不要と判断した。1 書籍ID＝蔵書1冊（複本は別の書籍IDで登録する）という RDRA 情報「書籍」の定義から、同一 ISBN の複数行が正常であるため。重複確認は登録時のアプリケーション側チェックに留める"
  - topic: "reservations の (reservation_id, user_no) インデックス"
    note: "複数 UC が本人限定参照のために要求していたが、reservation_id は主キーであり主キー1件取得＋user_no 判定で充足するため、冗長インデックスとして採用しなかった"
  - topic: "notifications の外部キー"
    note: "recipient_user_no / target_loan_id / target_reservation_id に外部キー制約を張らなかった。利用者削除・書籍削除の後も送信実績と未達追跡を保持する必要があるため。参照整合性はアプリケーション側で担保する"
  - topic: "loans.returned_at と notifications.requested_at"
    note: "いずれも UC の _model-summary が参照しているが arch の entities（E-004 / E-006）の属性一覧には無い。RDRA 情報「貸出」の属性「返却日」および「通知」の属性「送信日時」に対応するものとして追加した。arch へのフィードバックが必要"
  - topic: "notifications.timing_type の値域"
    note: "arch E-006 は nullable: false かつ値域を 期限前リマインド／期限当日／期限超過督促 とするが、取置き案内は即時送信のため該当値が無い。RDRA バリエーション「通知タイミング区分」への「即時通知」追加が必要（_model-summary「取置き通知メールを送信する」も同じ指摘を記録している）"
  - topic: "書籍削除と貸出・予約の参照整合性（S4-datastore-001）"
    note: "loans.book_id / reservations.book_id の on_delete を RESTRICT から SET NULL へ変更し、両列を nullable 化した。UC「書籍を削除する」は books を物理 DELETE し、可否条件は book_status = '在庫あり' のみを見るため、返却済み貸出・キャンセル済み予約が残る書籍で RESTRICT が UC を成立させなくなるため。書誌の表示は loans の非正規化スナップショット列（book_title / book_author / book_isbn / book_genre）で貸出当時の値を再現する（非正規化列の設置意図と一致）。reservations にはスナップショット列が無く、削除済み書籍の予約履歴は書誌を表示できない点は許容する（可否条件により有効予約は残らない）"
  - topic: "利用者削除の方針（S4-datastore-002）"
    note: "利用者は『物理削除＋履歴の匿名化』に統一した。RDRA 状態モデル「利用者状態」に退会済みの値が無く、論理削除は RDRA モデルの変更を伴うため採らない。loans.user_no / reservations.user_no は on_delete: SET NULL + nullable とし、users 行の物理削除で氏名・連絡先も消える。user_accounts.user_no の CASCADE は物理削除方針と整合するためそのまま維持する。notifications.recipient_user_no は元から外部キー無しで送信実績を保持する。影響: 削除後の貸出履歴は利用者区分別の統計内訳に集計できない（loans に利用者区分のスナップショット列が無い）。統計の内訳保持が必要なら loans への user_category スナップショット列追加を検討する"
  - topic: "loan_events / reservation_events の廃止（S4-datastore-003）"
    note: "書き手となる UC が 1 つも無く（全 UC の _model-summary で SELECT のみ）、行が生成されないため両テーブルを削除した。代替として、返却日は既に存在する loans.returned_at（UC「返却を登録する」の UPDATE で設定）から取得し、取置き開始日時は reservations に hold_started_at 列を新設して取置き遷移時に設定する。これに伴い UC「自分の貸出履歴を照会する」の『loans は返却日の列を持たない』という前提と、UC「自分の取置き状況を照会する」「自分の取置き中の予約を照会する」のイベント射影前提は無効となるため、各 _model-summary.yaml のデータアクセス定義を loans.returned_at / reservations.hold_started_at 参照へ更新する必要がある（本ファイル外の修正）"
  - topic: "イベントストリームの設置基準（S4-datastore-011）"
    note: "event テーブルを置く基準は arch の model_type: event_snapshot ではなく『UC がスナップショットに残らない事実を必要とするか』とする。books（E-001）・notifications（E-006）・statistical_reports（E-007）は同じ event_snapshot だが、(a) 参照する UC が全てスナップショット列で充足する、(b) 削除・失効後に残すべき監査証跡の要求が無い、ため event ストリームを置かない。残るのは user_events だけで、利用者の物理削除後も監査証跡を残す必要があることが根拠となる"
  - topic: "users の楽観ロック"
    note: "books は version カラムで楽観ロックするのに対し、users は updated_at を If-Match で比較する方式になっている。同一システム内で 2 方式が混在するため、users.version の追加による統一を検討する余地がある"
