# _model-summary.yaml
uc: "利用者を登録する"
business: "利用者管理業務"
buc: "利用者を管理するフロー"

bounded_context_id: "BC-002"
aggregate_id: "AG-002"

models:
  - name: "利用申込受付画面 / UserRegisterForm"
    tier: "tier-frontend-staff"
    layer: "view"
    type: "view-model"
    rdra_info: "利用者"
  - name: "UserRegisterState"
    tier: "tier-frontend-staff"
    layer: "state"
    type: "state"
    rdra_info: "利用者"
  - name: "CreateUserApiRequest"
    tier: "tier-frontend-staff"
    layer: "api-client"
    type: "request"
    rdra_info: "利用者"
  - name: "CreateUserRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "利用者"
  - name: "RegisterUserCommand"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "command"
    rdra_info: "利用者"
  - name: "User"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "利用者"
  - name: "UserCategory"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "利用者"
  - name: "UserRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "利用者"
  - name: "UserEventRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "利用者"

tables:
  - name: "user_events"
    rdra_info: "利用者"
    operations:
      - type: "INSERT"
        columns:
          - name: "event_id"
            value: "UUID"
          - name: "user_no"
            value: "採番された利用者番号"
          - name: "event_type"
            value: "USER_REGISTERED"
          - name: "payload"
            value: "利用者区分・登録日時（個人情報である氏名・連絡先は含めない。匿名化方針との整合）"
          - name: "occurred_at"
            value: "登録時刻"
        where: ""
    indexes_needed:
      - columns: ["user_no", "occurred_at"]
        reason: "利用者ごとのイベント時系列取得"
        access_pattern: "スナップショット再構築・監査追跡"
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "INSERT"
        columns:
          - name: "user_no"
            value: "採番された利用者番号"
          - name: "name"
            value: "入力された氏名（保管時暗号化）"
          - name: "email"
            value: "入力された連絡先（保管時暗号化）"
          - name: "user_category"
            value: "一般 / 学生 / 団体"
          - name: "user_status"
            value: "登録済み（固定）"
          - name: "registered_at"
            value: "登録イベントの occurred_at"
          - name: "updated_at"
            value: "登録イベントの occurred_at"
        where: ""
      - type: "SELECT"
        columns: []
        where: "email = :email（重複登録の検知）"
    indexes_needed:
      - columns: ["email"]
        reason: "連絡先の重複登録を一意制約で最終防御する（LP-007 の 4 層防御）"
        access_pattern: "登録前の重複チェックと INSERT 時の一意制約"

kvs:
  - key_pattern: "idem:api:createUser:{idempotency_key}"
    purpose: "idem"
    description: "冪等キー検証（二重登録の抑止）"
    value_type: "処理結果（user_no とレスポンス本文）"
    ttl: "24h"
    operations: ["GET", "SET"]

object_storage: []
