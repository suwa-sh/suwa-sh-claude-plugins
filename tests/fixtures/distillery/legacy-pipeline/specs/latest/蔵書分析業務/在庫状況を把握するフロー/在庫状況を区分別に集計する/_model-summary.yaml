tables:
  - name: "statistical_reports"
    rdra_info: "統計レポート"
    operations:
      - type: "INSERT"
        columns:
          - name: "report_id"
            value: "採番したレポートID"
          - name: "report_type"
            value: "在庫状況（固定）"
          - name: "period_type"
            value: "集計期間区分（日次/月次/年次）"
          - name: "period_start"
            value: "集計開始日"
          - name: "period_end"
            value: "集計終了日"
          - name: "aggregated_at"
            value: "集計開始日時"
          - name: "detail"
            value: "空の JSON オブジェクトで初期化"
          - name: "report_status"
            value: "集計中（固定）"
        where: ""
      - type: "SELECT"
        columns: []
        where: "report_id = :report_id（Worker が集計対象レポートを取得）"
      - type: "UPDATE"
        columns:
          - name: "detail"
            value: "total_books / status_counts / genre_counts / utilization_rate / books[] の JSON"
          - name: "report_status"
            value: "作成済み（蔵書1件以上）または実績なし（蔵書0件）"
          - name: "aggregated_at"
            value: "集計完了時刻"
        where: "report_id = :report_id AND report_status = '集計中'"
    indexes_needed:
      - columns: ["report_type", "aggregated_at"]
        reason: "レポート種別ごとに最新の統計レポートを取得するため"
        access_pattern: "report_type='在庫状況' で aggregated_at 降順に 1 件取得"
      - columns: ["report_status"]
        reason: "集計中のレポートの滞留監視と重複消費判定のため"
        access_pattern: "report_status='集計中' の抽出"
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "全件走査（book_id, title, author, genre, book_status を取得）"
    indexes_needed:
      - columns: ["book_status"]
        reason: "書籍状態ごとの件数集計と区分別書籍一覧の抽出のため"
        access_pattern: "book_status で GROUP BY / 絞り込み"
      - columns: ["genre"]
        reason: "ジャンル別蔵書件数の集計のため"
        access_pattern: "genre で GROUP BY"

kvs:
  - key_pattern: "idem:api:createInventoryReport:{idempotency_key}"
    purpose: "idem"
    value_type: "処理済みの report_id"
    ttl: "24h"
    operations: ["GET", "SET"]
  - key: "idem:mq:consumed:{message_id}"
    purpose: "idem"
    value_type: "消費済みマーカー"
    ttl: "24h"
    operations: ["GET", "SET"]
object_storage: []
