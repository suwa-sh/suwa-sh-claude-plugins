tables:
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = :book_id（書籍状態が予約待ちかの判定）"
    indexes_needed: []
  - name: "reservations"
    rdra_info: "予約"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id = :book_id AND reservation_status = '予約中' ORDER BY priority ASC LIMIT 1（取置き候補の抽出）"
      - type: "SELECT"
        columns: []
        where: "book_id = :book_id AND reservation_status = '予約中'（残件数の集計）"
    indexes_needed:
      - columns: ["book_id", "reservation_status", "priority"]
        reason: "取置き通知対象条件の予約順1位抽出を索引順走査の 1 行取得で完結させる"
        access_pattern: "書籍ID + 予約状態での priority 昇順 LIMIT 1"
  - name: "users"
    rdra_info: "利用者"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_no = :user_no（取置き対象者の氏名・利用者区分・宛先メールアドレスの取得）"
    indexes_needed: []

kvs: []
object_storage: []
