# _model-summary.yaml
uc: "自分の予約状況を照会する"
business: "利用照会業務"
buc: "予約状況を確認するフロー"

bounded_context_id: "BC-004"

models:
  - name: "予約状況一覧画面 / ReservationListView"
    tier: "tier-frontend-patron"
    layer: "view"
    type: "view-model"
    rdra_info: "予約"
  - name: "ListMyReservationsRequest"
    tier: "tier-frontend-patron"
    layer: "api-client"
    type: "request"
    rdra_info: "予約"
  - name: "ListMyReservationsRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "予約"
  - name: "ListMyReservationsQuery"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "query"
    rdra_info: "予約"
  - name: "予約(Reservation)"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "予約"
  - name: "書籍(Book)"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "書籍"
  - name: "ReservationRepository"
    tier: "tier-backend-api"
    layer: "repository"
    type: "entity"
    rdra_info: "予約"
  - name: "ReservationRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "予約"
  - name: "BookRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "書籍"

tables:
  - name: "reservations"
    rdra_info: "予約"
    operations:
      - type: "SELECT"
        columns: []
        where: "user_no = :認証利用者番号 [AND reservation_status = :status] ORDER BY applied_at DESC LIMIT :size OFFSET :offset"
    indexes_needed:
      - columns: ["user_no", "reservation_status", "applied_at"]
        reason: "本人限定参照の絞り込み・予約状態フィルター・申込日時降順のページングを 1 本の索引で満たす"
        access_pattern: "利用者番号 + 予約状態での申込日時降順ページング"
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "book_id IN (:book_ids)（一覧行の書籍属性を一括解決し N+1 を避ける）"
    indexes_needed: []

kvs: []
object_storage: []
