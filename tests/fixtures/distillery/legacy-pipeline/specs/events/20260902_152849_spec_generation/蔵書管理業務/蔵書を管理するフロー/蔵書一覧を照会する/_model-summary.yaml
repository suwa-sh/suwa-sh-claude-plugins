tables:
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "SELECT"
        columns: []
        where: "keyword の部分一致 / genre IN / material_type IN / book_status IN、ORDER BY updated_at DESC、LIMIT per_page OFFSET (page-1)*per_page"
    indexes_needed:
      - columns: ["genre"]
        reason: "ジャンル絞り込みが台帳の主要な絞り込み軸であるため"
        access_pattern: "WHERE genre IN (...)"
      - columns: ["book_status"]
        reason: "在庫あり／貸出中／予約待ちの区分表示と絞り込みに使うため"
        access_pattern: "WHERE book_status IN (...)"
      - columns: ["updated_at"]
        reason: "既定の並び順が最新更新順であるため"
        access_pattern: "ORDER BY updated_at DESC LIMIT 20 OFFSET n"

kvs: []
object_storage: []
