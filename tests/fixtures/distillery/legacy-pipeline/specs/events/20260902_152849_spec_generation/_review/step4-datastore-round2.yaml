      - "docs/specs/events/20260902_152849_spec_generation/_cross-cutting/datastore/kvs-schema.yaml#idem:notification:reservation"

  - id: S4-datastore-017
    artifact: "rdb-schema.yaml"
    file: "docs/specs/events/20260902_152849_spec_generation/_cross-cutting/datastore/rdb-schema.yaml"
    line: 750
    severity: minor
    viewpoint: 3
    claim: "er_diagram のカーディナリティが round1 の FK 変更（SET NULL + nullable 化）に追随していない。`users ||--o{ loans` / `users ||--o{ reservations` / `books ||--o{ loans` / `books ||--o{ reservations` はいずれも子側の参照が必須（||）を意味するが、loans.book_id / loans.user_no / reservations.book_id / reservations.user_no は nullable になった。また `users ||--o{ user_events` / `users ||--o{ notifications` は FK を張らない設計（_review_notes「notifications の外部キー」、user_events.user_no の description）なので、実体としては論理関連のみ。"
    fix: "nullable 化した参照は `|o--o{` に改め、FK を張らない関連（user_events / notifications）はラベルに「論理参照（FK なし）」を明記する。"
    source_refs:
