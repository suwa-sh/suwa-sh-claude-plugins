    artifact: "data-visualization.md"
    file: "docs/specs/events/20260902_152849_spec_generation/_cross-cutting/ux-ui/data-visualization.md"
    line: 17
    severity: major
    viewpoint: 5
    claim: "round1 の S4-ux-ui-002 修正で `LoanTrendChart` を「時系列専用」とし在庫状況レポート画面から外したが、design 正本は `LoanTrendChart` の screens に「貸出統計レポート画面」「在庫状況レポート画面」の 2 件を挙げ、`screens.yaml` の在庫状況レポート画面の components にも `LoanTrendChart` が含まれる。design が当該画面で使うと宣言したコンポーネントを spec 側が理由の明記なく不使用にしており（L17「`LoanTrendChart` は時系列専用のため使わない」・L78 「在庫状況レポートは第2層を持たない」）、design と spec が逆向きに食い違ったまま残っている。`common-components.md` の `ReportSummarySection`（利用 UC 2 件・合成元に `LoanTrendChart`）とも整合しない。"
    fix: "在庫状況レポート画面でも `LoanTrendChart` を使う用途（例: 集計日別の蔵書総数・貸出中件数の推移。design の screens 宣言に沿う時系列用途）を可視化対象表に 1 行追加し、L78 の「第2層を持たない」分岐を削除する。使わない判断を維持するなら「design の `LoanTrendChart.screens` から在庫状況レポート画面を外す差し戻しが必要」と本文に明記し、`ReportSummarySection` の chart スロットが貸出統計のみである旨も併記する。"
    source_refs:
      - "docs/design/latest/_digest/components.yaml#LoanTrendChart（screens: 貸出統計レポート画面 / 在庫状況レポート画面）"
      - "docs/design/latest/_digest/screens.yaml#在庫状況レポート画面（components に LoanTrendChart）"
      - "docs/specs/events/20260902_152849_spec_generation/_cross-cutting/ux-ui/common-components.md#ReportSummarySection"
