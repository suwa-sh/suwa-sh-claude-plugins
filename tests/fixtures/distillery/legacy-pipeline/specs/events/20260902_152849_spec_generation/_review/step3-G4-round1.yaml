    viewpoint: 3
    claim: "通知タイミング区分「期限前リマインド」の定義が tier 間で不一致。tier-worker は残日数 1〜remind_days を「期限前リマインド」、残日数 0 を「期限当日」と区分するのに、tier-backend-api は `0 <= (due_date - base_date) <= remind_days` として期限当日の貸出も期限前リマインドの一覧に含めてしまう。"
    fix: "ビジネスルールを `timing_type = 期限前リマインド` のとき `1 <= (due_date - base_date) <= remind_days`、`期限当日` のとき `due_date = base_date` と明記し、spec.md 計算ルール一覧「通知タイミング区分の決定」と揃える。"
