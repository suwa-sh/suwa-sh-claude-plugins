  - id: S3-G4-001
    uc: "貸出期限管理業務/返却期限をリマインドするフロー/リマインドメールを送信する"
    file: "docs/specs/events/20260902_152849_spec_generation/貸出期限管理業務/返却期限をリマインドするフロー/リマインドメールを送信する/spec.md"
    line: 119
    severity: major
    viewpoint: 1
    claim: "処理フローの alt が「貸出状態が『貸出中』または『延滞』」でリマインド送信を継続する分岐になっており、同ファイルの分岐条件一覧（送信時点で貸出状態が『貸出中』であること）および RDRA リマインド通知対象条件（貸出状態が『貸出中』であること）と矛盾する。"
    fix: "sequenceDiagram の else 分岐を「貸出状態が『貸出中』」に限定し、`else 貸出状態が「延滞」` を追加して「督促通知対象条件が扱うため送信を中止し INFO ログを出力」とする（貸出状態が『返却済み』の中止分岐と並列にする）。"
    source_refs:
      - "docs/rdra/latest/条件.tsv#リマインド通知対象条件"
      - "docs/specs/events/20260902_152849_spec_generation/貸出期限管理業務/返却期限をリマインドするフロー/リマインドメールを送信する/spec.md#分岐条件一覧"

  - id: S3-G4-002
    uc: "貸出期限管理業務/返却期限をリマインドするフロー/リマインドメールを送信する"
    file: "docs/specs/events/20260902_152849_spec_generation/貸出期限管理業務/返却期限をリマインドするフロー/リマインドメールを送信する/tier-worker.md"
    line: 23
    severity: major
    viewpoint: 3
    claim: "送信時点の再判定が「貸出状態が『返却済み』なら中止」だけで、貸出状態が『延滞』へ遷移した貸出にリマインドを送ってしまう。RDRA リマインド通知対象条件は貸出状態『貸出中』のみを対象とし、判定 UC（返却期限接近の貸出を判定する）も延滞を除外している。"
    fix: "処理フロー 4 とビジネスルールを「貸出状態が『貸出中』のときのみ送信し、『返却済み』『延滞』は送信を中止して ack する（延滞は督促通知対象条件が扱う）」に修正し、エラーハンドリング表の「対象貸出が返却済み」行を「対象貸出が返却済み / 延滞」に広げる。"
    source_refs:
      - "docs/rdra/latest/条件.tsv#リマインド通知対象条件"
      - "docs/specs/events/20260902_152849_spec_generation/貸出期限管理業務/返却期限をリマインドするフロー/返却期限接近の貸出を判定する/tier-worker.md#ビジネスルール"

  - id: S3-G4-003
    uc: "貸出期限管理業務/返却期限をリマインドするフロー/リマインドメールを送信する"
    file: "docs/specs/events/20260902_152849_spec_generation/貸出期限管理業務/返却期限をリマインドするフロー/リマインドメールを送信する/tier-worker.md"
    line: 22
    severity: major
    viewpoint: 3
    claim: "再送 API は既存通知（例 N-2001）を『送信失敗』→『送信待ち』へ更新したうえで、再送連番を含む新しい idempotency_key でメッセージを publish する（tier-backend-api.md の非同期イベント節）。しかし worker は冪等キーが未登録なら通知を新規 INSERT するため、再送のたびに通知レコードが増え、『送信待ち』に戻した元の通知が誰にも更新されずに残る。"
    fix: "入力メッセージ RemindNotificationRequested に `notification_id`（再送時のみ必須）を追加し、処理フロー 3・6 を「`notification_id` があれば既存通知を再利用して INSERT せず、通知状態のみ『送信待ち』→『送信済み / 送信失敗』へ更新する」と明記する。"
    source_refs:
      - "docs/specs/events/20260902_152849_spec_generation/貸出期限管理業務/返却期限をリマインドするフロー/リマインドメールを送信する/tier-backend-api.md#非同期イベント"
      - "docs/specs/events/20260902_152849_spec_generation/貸出期限管理業務/返却期限をリマインドするフロー/リマインドメールを送信する/_api-summary.yaml"

