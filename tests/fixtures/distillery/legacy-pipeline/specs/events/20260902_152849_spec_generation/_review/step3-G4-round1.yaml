  - id: S3-G4-005
    uc: "貸出期限管理業務/延滞を督促するフロー/期限超過の貸出を延滞にする"
    file: "docs/specs/events/20260902_152849_spec_generation/貸出期限管理業務/延滞を督促するフロー/期限超過の貸出を延滞にする/tier-backend-api.md"
    line: 83
    severity: major
    viewpoint: 3
    claim: "判定日に遷移した貸出を「貸出状態が『延滞』かつ返却期限 = base_date - 1 日」で逆算しているため、ジョブが停止・遅延した翌日にまとめて遷移した貸出（返却期限が base_date - 2 日以前）が transitioned_count と items から漏れ、司書の結果サマリが実際の遷移件数と一致しない。"
    fix: "遷移件数の正本を日次ジョブの実行結果（遷移件数・対象貸出ID、または loans に状態遷移日時カラム）に置き、`transitioned_count` / `items` はそれを参照して返す。spec.md 計算ルール一覧の「当日遷移件数の算出」と _model-summary.yaml の loans SELECT（`due_date = :base_date - 1 日`）も同じ定義に揃える。"
    source_refs:
      - "docs/specs/events/20260902_152849_spec_generation/貸出期限管理業務/延滞を督促するフロー/期限超過の貸出を延滞にする/spec.md#計算ルール一覧"
      - "docs/specs/events/20260902_152849_spec_generation/貸出期限管理業務/延滞を督促するフロー/期限超過の貸出を延滞にする/_model-summary.yaml"

