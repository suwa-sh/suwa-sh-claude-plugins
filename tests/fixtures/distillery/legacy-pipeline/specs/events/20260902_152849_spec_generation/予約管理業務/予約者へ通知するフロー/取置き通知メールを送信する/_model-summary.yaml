  - name: "送信対象 / 送信実績一覧"
    tier: "tier-frontend-staff"
    layer: "state"
    type: "state"
    rdra_info: "通知"
  - name: "SendHoldNoticeRequest"
    tier: "tier-frontend-staff"
    layer: "api-client"
    type: "request"
    rdra_info: "通知"
  - name: "SendHoldNoticeRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "通知"
  - name: "RequestHoldNoticeCommand"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "command"
    rdra_info: "通知"
  - name: "通知(Notification)"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "通知"
  - name: "NotificationRepository"
    tier: "tier-backend-api"
    layer: "repository"
    type: "entity"
    rdra_info: "通知"
  - name: "NotificationRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "通知"
  - name: "HoldNoticeRequested"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "value-object"
    rdra_info: "通知"
  - name: "HoldNoticeRequested"
    tier: "tier-worker"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "通知"
  - name: "SendHoldNoticeJob"
    tier: "tier-worker"
    layer: "usecase"
    type: "command"
    rdra_info: "通知"
  - name: "通知(Notification)"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "通知"
  - name: "予約(Reservation)"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "予約"
  - name: "NotificationRepository / ReservationRepository"
    tier: "tier-worker"
    layer: "repository"
    type: "entity"
