  - name: "NotificationRecord / ReservationRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "通知"

tables:
  - name: "notifications"
    rdra_info: "通知"
    operations:
      - type: "INSERT"
        columns:
          - name: "notification_id"
            value: "採番した通知ID"
          - name: "notification_type"
            value: "取置き案内"
          - name: "timing_type"
            value: "即時通知（arch E-006 の timing_type は nullable: false のため NULL 不可。RDRA バリエーション「通知タイミング区分」へ「即時通知」を追加する前提。要 arch フィードバック）"
          - name: "recipient_user_no"
            value: "対象予約の利用者番号"
          - name: "recipient_email"
            value: "送信時点の利用者の連絡先をコピー（保管時暗号化）"
          - name: "target_reservation_id"
            value: "対象予約ID"
          - name: "target_loan_id"
            value: "NULL"
          - name: "notification_status"
            value: "送信待ち"
        where: ""
      - type: "SELECT"
        columns: []
        where: "notification_type = :type AND notification_status = :status（送信実績一覧・未達件数）"
      - type: "UPDATE"
        columns:
          - name: "notification_status"
            value: "送信済み / 送信失敗（ワーカー） / 送信待ち（再送）"
          - name: "send_result"
            value: "メール配信サービスの応答コード・エラー内容"
          - name: "sent_at"
            value: "送信成功時の送信日時（送信失敗・再送受付時は NULL のまま）"
        where: "notification_id = :notification_id"
    indexes_needed:
      - columns: ["notification_type", "notification_status"]
        reason: "送信実績一覧の絞り込みと未達件数（送信失敗）の集計"
        access_pattern: "通知種別 + 通知状態での一覧・集計"
      - columns: ["target_reservation_id", "notification_type"]
        reason: "同一予約への取置き案内の重複送信抑止（取置き通知対象条件）"
        access_pattern: "対象予約ID + 通知種別の存在確認"
  - name: "notification_idempotency_keys"
    rdra_info: ""
    operations:
      - type: "INSERT"
        columns:
          - name: "idempotency_key"
            value: "'取置き案内' + 対象予約ID から決定的に生成"
          - name: "notification_id"
            value: "作成した通知ID"
          - name: "requested_at"
            value: "送信要求日時"
          - name: "expires_at"
            value: "キー保持期限（TTL 失効）"
        where: ""
      - type: "SELECT"
        columns: []
        where: "idempotency_key = :key（重複送信の判定）"
    indexes_needed: []
  - name: "reservations"
    rdra_info: "予約"
    operations:
      - type: "SELECT"
        columns: []
        where: "reservation_id = :reservation_id（取置き通知対象条件の再評価）"
      - type: "UPDATE"
        columns:
          - name: "reservation_status"
            value: "取置き中（送信成功時。ワーカーが予約コンテキスト経由で更新）"
          - name: "hold_expires_at"
            value: "送信実行日時を起点に算出した取置き期限（メール本文へ埋め込んだ値と同一。日数は運用パラメータ。要確認）"
        where: "reservation_id = :reservation_id AND reservation_status = '予約中'"
    indexes_needed: []

kvs:
  - key_pattern: "idem:notification:reservation:{notification_type}:{target_reservation_id}"
    purpose: "idem"
    description: "通知送信冪等キー E-902 の高速判定。RDB の冪等キーテーブルと二重に保持して MQ の at-least-once 配信に備える"
    value_type: "notification_id"
    ttl: "24h"
    operations: ["SET", "GET"]
  - key_pattern: "idem:api:sendHoldNotice:{idempotency_key}"
    purpose: "idem"
    description: "取置き案内メールの送信要求 API（POST /api/v1/staff/notifications/hold-notices）の二重送信防止。arch SR-002"
    value_type: "受付済み notification_id"
    ttl: "24h"
    operations: ["SET", "GET"]
  - key_pattern: "idem:api:resendNotification:{idempotency_key}"
    purpose: "idem"
    description: "司書操作の二重送信防止。arch SR-002"
    value_type: "受付済み notification_id"
    ttl: "24h"
    operations: ["SET", "GET"]

  - key_pattern: "cache:reservation:rank:{book_id}"
    purpose: "cache"
    description: "予約順位表示用の有効予約件数キャッシュ。予約状態を「取置き中」へ遷移させた時 に破棄する"
    value_type: "有効予約件数（integer）"
    ttl: "60s"
    operations: ["DEL"]

object_storage: []
