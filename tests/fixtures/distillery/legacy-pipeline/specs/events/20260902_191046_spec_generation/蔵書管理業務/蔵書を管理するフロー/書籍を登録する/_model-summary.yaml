uc: "書籍を登録する"
business: "蔵書管理業務"
buc: "蔵書を管理するフロー"

bounded_context_id: "BC-001"
aggregate_id: "AG-001"

models:
  - name: "書籍受入登録画面(BookIntakeForm)"
    tier: "tier-frontend-staff"
    layer: "view"
    type: "view-model"
    rdra_info: "書籍"
  - name: "BookIntakeFormState"
    tier: "tier-frontend-staff"
    layer: "state"
    type: "state"
    rdra_info: "書籍"
  - name: "CreateBookApiClient"
    tier: "tier-frontend-staff"
    layer: "api-client"
    type: "request"
    rdra_info: "書籍"
  - name: "CreateBookRequest"
    tier: "tier-backend-api"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "書籍"
  - name: "RegisterBookCommand"
    tier: "tier-backend-api"
    layer: "usecase"
    type: "command"
    rdra_info: "書籍"
  - name: "Book"
    tier: "tier-backend-api"
    layer: "domain"
    type: "entity"
    rdra_info: "書籍"
  - name: "MaterialType"
    tier: "tier-backend-api"
    layer: "domain"
    type: "value-object"
    rdra_info: "書籍"
  - name: "BookRepository"
    tier: "tier-backend-api"
    layer: "repository"
    type: "entity"
    rdra_info: "書籍"
  - name: "BookRecord"
    tier: "tier-backend-api"
    layer: "gateway"
    type: "record"
    rdra_info: "書籍"

tables:
  - name: "books"
    rdra_info: "書籍"
    operations:
      - type: "INSERT"
        columns:
          - name: "book_id"
            value: "ドメイン層で採番した一意の書籍ID"
          - name: "title"
            value: "リクエストの title"
          - name: "author"
            value: "リクエストの author"
          - name: "isbn"
            value: "リクエストの isbn（未指定は NULL）"
          - name: "publisher"
            value: "リクエストの publisher"
          - name: "genre"
            value: "リクエストの genre（バリエーション: ジャンル）"
          - name: "material_type"
            value: "リクエストの material_type（資料種別利用可否条件により『紙書籍』のみ受理、『電子書籍』は 422 で拒否）"
          - name: "book_status"
            value: "在庫あり（書籍状態の初期状態）"
          - name: "registered_at"
            value: "登録時刻"
          - name: "updated_at"
            value: "登録時刻"
          - name: "version"
            value: "1（楽観ロックの初期世代）"
        where: ""
    indexes_needed:
      - columns: ["isbn"]
        reason: "ISBN による重複確認と ISBN 検索に使うため"
        access_pattern: "WHERE isbn = ?"

kvs:
  - key_pattern: "idem:api:createBook:{idempotency_key}"
    purpose: "idem"
    description: "冪等キー検証（書籍登録の二重送信防止）"
    value_type: "前回処理結果（採番した書籍IDと201レスポンス本文）"
    ttl: "24h"
    operations: ["GET", "SET"]
object_storage: []
