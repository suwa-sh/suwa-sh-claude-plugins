round: 1
findings:
  - id: "S-001"
    viewpoint: "acceptance-criterion"
    severity: "major"
    target: "蔵書利用業務/書籍を検索するフロー/書籍を検索する/spec.md"
    claim: "受け入れ基準トレーサビリティ表の SPEC-001-03#1 行が 3 つの Scenario 名を ' / ' で連結した 1 セルになっており、Scenario 名の一字一句一致（機械的な一意選択）が成立しない。"
    evidence: "| SPEC-001-03#1 | 主担当 | キーワードで蔵書を検索する / 著者で蔵書を検索する / ISBNで蔵書を検索する |"
    suggested_fix: "traceability-matrix.md「UC 側の記法」の『1 つの Scenario が複数の基準を満たす場合は行を分ける』に倣い、SPEC-001-03#1 を 3 行に分割して 1 セル 1 Scenario 名にする。"
  - id: "S-002"
    viewpoint: "acceptance-criterion"
    severity: "minor"
    target: "_cross-cutting/traceability-matrix.md"
    claim: "「主担当を持たない UC は `| — | 補助専任 | （当該 UC の E2E シナリオ全件） |` と書く」という記法規則が、対象 21 UC 中の補助専任 UC 10 件すべてで守られておらず（実際は基準ごとの `補助` 行を列挙）、正本の記法と成果物が食い違っている。"
    evidence: "traceability-matrix.md:320「主担当を持たない UC は `| — | 補助専任 | …」/ 蔵書一覧を照会する spec.md「| SPEC-001-01#1 | 補助 | 登録済みの蔵書を一覧で確認する |」"
    suggested_fix: "補助専任 UC も対応表の補助割り当てを行単位で書く実態に合わせ、traceability-matrix.md の記法規則を「補助専任 UC は各基準を `補助` 行で列挙する（主担当行を持たない）」へ改める。"
  - id: "S-003"
    viewpoint: "handoff"
    severity: "minor"
    target: "蔵書管理業務/蔵書を管理するフロー/書籍を削除する/tier-frontend-staff.md"
    claim: "完了結果の型 `NoContent` は `_api-summary.yaml` の `response_schema` と同名だが、`_cross-cutting/api/openapi.yaml` に `NoContent` スキーマが存在せず（deleteBook は 204 本文なし）、`result: NoContent | null` を契約から解決できない。"
    evidence: "- ページが `result: NoContent | null` と `submitting: boolean` を保持し / openapi.yaml \"204\": description: \"削除完了（本文なし）\""
    suggested_fix: "`result: boolean`（除籍完了フラグ）等の契約に依存しない表現へ改めるか、openapi.yaml に空オブジェクトの `NoContent` スキーマを定義して 204 応答から参照する。"
  - id: "S-004"
    viewpoint: "loading"
    severity: "minor"
    target: "蔵書分析業務/在庫状況を把握するフロー/在庫状況レポートを参照する/tier-frontend-staff.md"
    claim: "チャート領域の待機表現に `kind=\"line\"` を割り当てているが、common-components.md「kind の選び方」では `line` は「1〜数行の部分取得（予約順位 / 返却期限の再計算）」であり、チャート領域は表に該当がない。"
    evidence: "| 集計中の表示 | ローディング | `LoadingState`（KPI 群は `kind=\"card\"`, チャートは `kind=\"line\"`, 明細表は `kind=\"list\"`）"
    suggested_fix: "common-components.md の「kind の選び方」表に「チャート・グラフ領域の取得 → `card`」の行を追加し、在庫状況／貸出統計レポート 2 UC のチャート領域の kind をそれに揃える。"
