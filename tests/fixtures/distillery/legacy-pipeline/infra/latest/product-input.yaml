title: "図書館蔵書管理システム ワークロード入力"
status: "draft"
generated_at: "2026-09-02T14:23:49"
source_refs:
  - "arch-design:20260902_133544_initial_arch"
  - "nfr-grade:20260902_132551_initial_nfr"
decision_refs: []
inputs_ref:
  - "foundation-context"
  - "shared-platform-context"

workload:
  name: "図書館蔵書管理システム"
  description: "図書館の蔵書と利用者を一元管理し、貸出・返却・予約を Web 画面から行えるようにするシステム。書籍情報と利用者情報を登録・編集・削除でき、キーワード・タイトル・著者・ISBN・ジャンルで蔵書を検索できる。貸出時に返却期限を自動設定し、期限接近のリマインド・期限超過の督促・予約書籍の取置き案内をメールで自動通知する。利用者は自分の貸出履歴と予約状況を Web 画面で照会でき、司書は在庫状況・人気書籍ランキング・期間別貸出統計をレポートとして把握できる。まずは 1 館での運用を想定する。"
  target_clouds:
    - "aws"

workload_type: "web_app"

availability_target:
  sla: "99%"
  failover: "warm_standby"

latency_sensitivity:
  category: "interactive"
  target_p99: "500ms"

data_sensitivity:
  classification: "restricted"
  pii: true
  encryption: "at_rest_and_in_transit"
  compliance: []
  data_residency: "japan"

traffic_pattern:
  type: "scheduled"
  baseline_rps: 10
  spike_multiplier: 3

consistency_needs:
  type: "strong"

recovery_target:
  rpo: "4h"
  rto: "2h"
  backup: "daily"

observability_needs:
  metrics:
    - "cpu"
    - "memory"
    - "disk"
    - "network"
    - "latency"
    - "error_rate"
    - "throughput"
  logs:
    - "access"
    - "audit"
    - "diagnostic"
    - "dependency"
  sli:
    - "availability"
    - "latency"
    - "error_rate"
    - "throughput"
  alerting:
    - "health_check"
    - "error_rate"
    - "latency_p99"

cost_posture:
  strategy: "balanced"

# arch-design.yaml の system_architecture.tiers / data_architecture.storage_mapping 由来の補足。
# MCL の element 生成のヒントとして渡す（ベンダーニュートラル表記）。
tiers:
  - id: "tier-frontend-patron"
    name: "利用者ポータル"
    technology_candidates: ["SPA", "CDN"]
    exposure: "internet"
  - id: "tier-frontend-staff"
    name: "司書ポータル"
    technology_candidates: ["SPA"]
    exposure: "internal_network_only"
  - id: "tier-api-gateway"
    name: "API Gateway"
    technology_candidates: ["API Gateway", "リバースプロキシ", "WAF"]
  - id: "tier-idp"
    name: "IdP"
    technology_candidates: ["IdP"]
    note: "マネージド IdP を第一候補（OAuth2/OIDC）"
  - id: "tier-backend-api"
    name: "バックエンド API"
    technology_candidates: ["CaaS(k8s)", "FaaS"]
    note: "モジュラモノリス。水平スケールアウト前提"
  - id: "tier-worker"
    name: "バックエンドワーカー"
    technology_candidates: ["CronJob(k8s)", "FaaS"]
    note: "日次タイマーバッチ + MQ コンシューマー（Competing Consumers）"
  - id: "tier-messaging"
    name: "メッセージング"
    technology_candidates: ["MQ"]
    note: "at-least-once 配信 + DLQ 併設"
  - id: "tier-datastore"
    name: "データストア"
    technology_candidates: ["RDB", "KVS", "Object Storage"]
  - id: "tier-external-gateway"
    name: "外部連携ゲートウェイ"
    technology_candidates: ["ACL アダプタ"]
    note: "メール配信サービス連携"

storage_elements:
  - category: "database"
    engine_preference: "PostgreSQL"
    reason: "storage_mapping の rdb 7 件（書籍/利用者/利用者アカウント/貸出/予約/通知/統計レポート）。強整合トランザクションとポイントインタイムリカバリが前提"
  - category: "cache"
    engine_preference: "Redis"
    reason: "storage_mapping の cache 3 件（書籍の Cache-Aside、セッション情報、通知送信冪等キー）。TTL 管理が前提"
  - category: "storage"
    engine_preference: "Object Storage"
    reason: "tier-datastore の technology_candidates に Object Storage（SPA 静的コンテンツ配信・バックアップ退避用途）"
