            - id: "LP-004"
              name: "トークン期限ログ"
              description: "受領したトークンの残存有効期間がしきい値（デフォルト 5 分）を下回った場合に WARN レベルの構造化ログを出力し、degradation_type / current_value / threshold を context に含める。しきい値は設定ファイルから読み込む"
