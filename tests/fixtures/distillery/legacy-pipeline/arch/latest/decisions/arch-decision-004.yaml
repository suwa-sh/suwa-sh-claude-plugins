schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "architecture"
artifact_id: "arch-decision-004"
title: "集約境界を 6 集約・不変条件 18 件の仮説として定義"
status: "approved"
generated_at: "2026-09-02T14:11:27"
context: |
  集約境界はトランザクション整合の単位であり、ドメイン判断（何を同時に守るか）を含むため RDRA から確定できない。
  RDRA からは情報.tsv 7 エンティティ・状態モデル 6 件・条件.tsv 17 件という材料しか得られず、
  実際の競合発生頻度やロック粒度は実装・運用フェーズでしか検証できない。
  特に予約（E-005）は「予約順位」という集約横断の一意性制約を持ち、境界の置き方に選択肢がある。
decision: |
  BC ごとに 1 集約の仮説（AG-001〜AG-006、合計 6 集約）を置き、条件.tsv の 17 条件を配分して
  不変条件 18 件を定義する。confidence は仕様上の上限である low で固定する。
  - AG-001 書籍集約（root: E-001）
  - AG-002 利用者集約（root: E-002、member: E-003 利用者アカウント。カーディナリティ 1:1）
  - AG-003 貸出集約（root: E-004）
  - AG-004 予約集約（root: E-005）— 予約 1 件を root とし、予約順位の一意性は集約外での整合（クエリ時の算出）に依存する
  - AG-005 通知集約（root: E-006）
  - AG-006 統計レポート集約（root: E-007）
  repository は集約と 1:1 で 6 件とし（LR-009）、状態モデルを持つ 5 エンティティにはバージョン列で楽観ロックを掛ける（LR-012）。
consequences:
  positive:
    - "集約と repository が 1:1 に対応し、レイヤー設計とデータ設計の整合が取りやすい"
    - "予約 1 件を root とすることで、予約の申込・取消が独立に処理でき競合が起きにくい"
    - "条件.tsv 17 件のほぼ全数を集約の不変条件として配分でき、業務ルールの置き場所が定まる"
  negative:
    - "これは戦略段階の仮説であり、最終確定は dist-spec または ddd-tactical-implementation で行う"
    - "予約順位の一意性が集約の不変条件で保証されず、クエリ時の算出と RDB 制約に依存する"
    - "粒度が粗く、貸出・返却・予約の登録が書籍状態・利用者状態・予約順位まで単一トランザクションになる（LP-005）"
alternatives_considered:
  - name: "Option B: 書籍を root とし予約を member に含める集約（予約待ち行列を書籍集約が所有）"
    reason_rejected: "人気書籍への予約集中時に書籍集約へロックが集中し、NFR B.2.1.2（〜50 TPS）とレスポンスタイム 5 秒目標を圧迫する"
  - name: "Option C: 集約を定義せず、後続の dist-spec まで判断を延期する"
    reason_rejected: "トランザクション境界（LP-005）と repository 分割（LR-009）がアプリケーションアーキテクチャの前提となるため、仮説であっても本ステージで置く必要がある"
