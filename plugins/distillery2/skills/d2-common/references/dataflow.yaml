      - "テストが import する入口の最小スタブ。**新規ファイルだけ**。既存ファイルの変更・削除は不可"
      - "完了条件の `--expect-red unit` が書く。単独の段なので競合しない"
  - id: implement.tier
    name: ティアの実装
    skill: d2-implement
    mode: tier
    stage: tier
    kind: subagent
    parallel: true
    template_row: "④ tier"
    write_set:
      - "`apps/<tier>/**`"
      - "`<run>/attempt-<n>/assumptions.<tier>.yaml`。例外: ゲートの `{report}` の置き換え先に使う OS の一時ファイル (`mktemp` か `node -e` で作る。リポの外。使い終えたら削除)"
