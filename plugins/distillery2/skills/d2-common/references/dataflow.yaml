  # ================= ④ UC =================
  - id: implement.scenario
    name: UC シナリオの執筆
    skill: d2-implement
    mode: scenario
    stage: scenario
    kind: subagent
    template_row: "④ scenario"
    write_set:
      - "`features/<業務>/<slug>.feature`"
      - "`features/acceptance/**`"
      - "`<run>/issues/**`"
    reads: [use-cases, req-usdm, req-rdra, rules, feature]
    writes: [feature, acceptance]
    allowed_writes: [feature, acceptance, issues]
  - id: contract.uc
    name: 契約の差分
    skill: d2-contract
    mode: uc
    stage: contract
    kind: subagent
    template_row: "④ contract"
    write_set:
      - "`contracts/**`"
      - "`apps/*/test/contract/**`"
      - "`apps/<datastore_owner>/migrations/**`"
      - "`packages/contracts/**`"
      - "`<run>/issues/**`"
    reads: [use-cases, feature, req-rdra, contracts-src]
    writes: [contracts-src, uc-index, contract-slice, contract-tests, migrations, contracts-code, issues]
    allowed_writes: [contracts-src, contract-tests, migrations, contracts-code, issues]
  - id: implement.scaffold
    name: テスト足場の生成
    skill: d2-implement
    mode: scaffold
    stage: scaffold
    kind: subagent
    template_row: "④ scaffold"
    write_set:
      - "`features/step_definitions/**`"
      - "`apps/<tier>/src/**/*.test.ts`"
      - "`apps/<tier>/src/**` (テストが import する入口の最小スタブ。**新規ファイルだけ**。既存ファイルの変更・削除は不可)"
      - "`<run>/reports/**` (完了条件の `--expect-red unit` が書く。単独の段なので競合しない)"
    reads: [feature, acceptance, steps, features-support, test-support, contract-slice, rules, config]
    writes: [steps, tier-src, reports]
    allowed_writes: [steps, tier-src, reports]
    scripts: [runGates.js]
    notes:
      - "テストが import する入口の最小スタブ。**新規ファイルだけ**。既存ファイルの変更・削除は不可"
      - "完了条件の `--expect-red unit` が書く。単独の段なので競合しない"
  - id: implement.tier
    name: ティアの実装
    skill: d2-implement
    mode: tier
    stage: tier
    kind: subagent
    parallel: true
    template_row: "④ tier"
    write_set:
      - "`apps/<tier>/**`"
      - "`<run>/attempt-<n>/assumptions.<tier>.yaml`"
      - "`<run>/issues/<ts>_<tier>_<slug>.md`。例外: ゲートの `{report}` の置き換え先に使う OS の一時ファイル (`mktemp` の結果。リポの外。使い終えたら削除)"
    reads: [rules, feature, contract-slice, contracts-code, use-cases, req-usdm, req-rdra, design, ui, tier-src, test-support, findings]
    writes: [tier-src, assumptions, issues-tier, migrations]
    allowed_writes: [tier-dir, assumptions, issues-tier]
    notes:
      - "例外: ゲートの `{report}` の置き換え先に使う OS の一時ファイル (`mktemp` の結果。リポの外。使い終えたら削除)"
  - id: implement.integrate
    name: 結合
    skill: d2-implement
    mode: integrate
    stage: integrate
    kind: subagent
    template_row: "④ integrate"
    write_set:
      - "`features/step_definitions/**`"
      - "`features/support/**`"
      - "`<run>/reports/**`"
      - "`<run>/traces/**` (完了条件の runGates が書く。integrate は単独の段なので競合しない)"
    reads: [feature, steps, features-support, test-support, contract-slice, tier-src, contracts-code, use-cases, config]
    writes: [steps, features-support, reports, traces]
    allowed_writes: [steps, features-support, reports, traces]
    scripts: [runGates.js]
    notes:
      - "完了条件の runGates が書く。integrate は単独の段なので競合しない"
  - id: verify
    name: 独立検証
    skill: d2-verify
    stage: verify
    kind: subagent
    parallel: true
    template_row: "④ verify"
    write_set:
      - "`<run>/attempt-<n>/findings.<tier>.yaml`"
    reads: [reports, traces, assumptions, feature, use-cases, req-usdm, req-rdra, rules, contract-slice, tier-src, uc-index, asbuilt-system, skill-docs]
    writes: [findings]
    allowed_writes: [findings]
  - id: asbuilt
    name: as-built の抽出と要約
    skill: d2-asbuilt
    stage: asbuilt
    kind: subagent
    template_row: "④ asbuilt"
    write_set:
      - "`docs/as-built/<業務>/<UC>/**`"
      - "`docs/as-built/_system/**` (スクリプトの生成物。LLM が手で書くのは index.md の要約ブロックの中だけ)"
      - "`<run>/reports/**` (depcruise の結果と抽出の集計)"
    reads: [config, use-cases, req-usdm, adr, reports, traces, assumptions, findings, run-events, issues, issues-tier, contract-slice, contracts-src, design, feature, asbuilt-uc, asbuilt-index, asbuilt-system, depcruise-config, tier-src]
    writes: [reports, asbuilt-uc, asbuilt-index, asbuilt-system, asbuilt-report]
    allowed_writes: [asbuilt-uc, asbuilt-system, reports]
    notes:
      - "スクリプトの生成物。LLM が手で書くのは index.md の要約ブロックの中だけ"
      - "depcruise の結果と抽出の集計"
  - id: asbuilt.depcruise
    name: 依存グラフの実態
    parent: asbuilt
    stage: asbuilt
    kind: script
    reads: [depcruise-config, tier-src]
    writes: [reports]
  - id: asbuilt.extract
    name: as-built の抽出
    parent: asbuilt
    stage: asbuilt
    kind: script
    scripts: [extractAsBuilt.js]
    reads: [config, use-cases, req-usdm, adr, reports, traces, assumptions, findings, run-events, issues, issues-tier, contract-slice, contracts-src, design, feature, asbuilt-uc, asbuilt-index, asbuilt-system]
    writes: [asbuilt-uc, asbuilt-index, asbuilt-system, asbuilt-report]
  - id: asbuilt.summarize
    name: 要約ブロックを埋める (LLM)
    parent: asbuilt
    stage: asbuilt
    kind: llm
    actor: d2-asbuilt
    reads: [asbuilt-index, assumptions, tier-src]
    writes: [asbuilt-index]
  - id: asbuilt.check
    name: 要約の書式の検査
    parent: asbuilt
    stage: asbuilt
    kind: script
    scripts: [checkAsBuilt.js]
    reads: [asbuilt-index]
    writes: []
  # ================= d2-run の直接作業 =================
  # run_table_row = d2-run SKILL「d2-run が直接読み書きするもの」の表の「処理」列 (その行の読む / 書くと照合する)
  # 親 (run.early / run.foundation / run.uc) は d2-run 自身が直接読み書きするものだけ。図では子 (スクリプト) を親に畳む
  - id: run.early
    name: d2-run (① ②)
    stage: decide
    kind: orchestrator
    actor: d2-run
    run_table_row: "① ② の確認ページ"
    reads: [req-review, adr-review]
    writes: []
  - id: run.req-diff
    name: 要求の差分の取り込み (課題ファイルの削除と feature の退避。残った作業を次の UC の carry_over に)
