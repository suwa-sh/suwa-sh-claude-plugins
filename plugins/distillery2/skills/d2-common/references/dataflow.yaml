    writes: [tier-src, assumptions, migrations]
    allowed_writes: [tier-dir, assumptions]
    notes:
      - "例外: ゲートの `{report}` の置き換え先に使う OS の一時ファイル (`mktemp` か `node -e` で作る。リポの外。使い終えたら削除)"
