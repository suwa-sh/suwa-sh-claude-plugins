    run_table_row: "起動時の genDocsReadme.js (移行)"
    reads: [config, req-rdra, req-usdm, use-cases, feature, acceptance, contracts-catalog, uc-index, design, asbuilt-system, asbuilt-uc, adr, nfr, rules, feedback-docs]
    writes: [docs-readme, feedback-index]
  # 0.1.x の途中で止まった還流のバッチ (0.2.0 で還流は廃止)。取り込み済みなら merge で後始末、それより前なら abandon で捨てる (課題ファイルは main に残る)
  - id: run.migrate-batch
    name: 途中で止まった還流のバッチの片付け (起動時の移行)
    stage: startup
    kind: script
    actor: d2-run
    scripts: [feedbackBatch.js]
    run_table_row: "起動時の feedbackBatch.js status・merge・abandon (移行)"
    reads: [feedback-batch, worktrees, feedback-docs]
    writes: [feedback-batch, worktrees]
  # ================= どの段でも (0.2.0。担当を受理するたびの引き継ぎファイルの処理・決めたことの記録・7 か所の縦横レビュー) =================
  # 引き継ぎファイルは派遣文の制約で「write-set に関わらず書いてよい」ので、各派遣の write_set / allowed_writes には入れず、ここで 1 つの書き手として持つ
  - id: handoff.write
    name: 引き継ぎファイルを書く (派遣したすべての担当。検証役は findings が代わり)
    stage: records
    kind: llm
    actor: 派遣した担当
    reads: [skill-docs]
    writes: [handoff-run, handoff-upstream]
  # 反証して直す: レビューした場所の担当を同じ write-set で派遣し直す。書くものはその担当の処理と同じなので、ここには読むものだけを持つ
  - id: refute
    name: レビューの指摘を反証して直す (レビューした場所の担当を派遣し直す)
    stage: records
    kind: subagent
    template_row: "反証して直す"
    write_set:
      - "レビューした場所の派遣の行と同じ (その行をそのまま貼る)"
    notes:
      - "レビューした場所の派遣の行と同じ (その行をそのまま貼る)"
    reads: [reviews-run, reviews-upstream]
    writes: []
    allowed_writes: []
  - id: run.handoff
    name: 引き継ぎファイルの検査・振り分け・課題の下書き
    stage: records
    kind: script
    actor: d2-run
    scripts: [handoff.js]
    run_table_row: "どの段でも handoff.js"
    reads: [handoff-run, handoff-upstream, findings]
    writes: [issues, feedback-docs]
  - id: run.decisions
    name: 決めたことの記録 (推奨で決めた答え・人の答え・規則で決めたこと)
    stage: records
    kind: script
    actor: d2-run
    scripts: [decisionLog.js]
    run_table_row: "どの段でも decisionLog.js"
    reads: [handoff-run, handoff-upstream, decisions-run, decisions-upstream, run-archive]
    writes: [decisions-run, decisions-upstream]
  - id: run.review-upstream
    name: 縦・横レビュー (上流の段: 要求・決定・基盤)
    stage: records
    kind: script
    actor: d2-run
    scripts: [reviewStep.js]
    run_table_row: "①②③ の reviewStep.js"
    reads: [skill-docs, req-usdm, req-rdra, use-cases, nfr, adr, rules, contracts-src, design, config, reviews-upstream]
    writes: [reviews-upstream]
  - id: run.review-run
    name: 縦・横レビュー (機能の中: シナリオ・契約・実装・as-built)
    stage: records
    kind: script
    actor: d2-run
    scripts: [reviewStep.js]
    run_table_row: "④ の reviewStep.js"
    reads: [skill-docs, feature, acceptance, contracts-src, tier-src, asbuilt-uc, asbuilt-system, reviews-run]
    writes: [reviews-run]
