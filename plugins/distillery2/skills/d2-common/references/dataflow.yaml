# distillery2 の処理と入出力の正本 (DFD)。
# 手順書 (派遣表の write-set、各スキルの read-set / 読むもの・書くもの、基盤の phase 表、d2-run の直接の読み書き) と
# tests/distillery2/integration/dataflow.test.js で照合する。図は scripts/genDataflow.js が dataflow.md に生成する。
#
# 置換変数: <slug> UC の slug / <tier> ティア ID / <n> attempt 番号 / <業務> <UC> 業務名・UC 名 /
#           <run> = .distillery/runs/<slug> (手順書の <run> と同じ)
# store_groups: 図でファイルをまとめる単位 (全体図と、ファイルの多い処理の図で使う)。stores[].group で所属を示す
# stores[].origin: external = 外部入力 / packaged = プラグイン同梱 (書き手を要求しない) / produced = 処理が生成
# stores[].terminal: true = 最終成果物 (読み手を要求しない)。進行の記録 (決めたことの記録・レビューの結果) も terminal にする (全体図の受け渡しに描かない)
# stores[].aliases: 手順書での略記 (照合に使う)
# stores[].scope_only: true = 許可範囲を表すためだけの store (allowed_writes 専用。書き手・読み手を要求しない)
# stores[].outside_repo: true = リポの外。手順書のパス照合から外す (0.1.26 で GitHub の PR / issue をやめ、いまは使っていない)
# processes[].kind: subagent (派遣の単位) / orchestrator (d2-run 自身) / script (スクリプト) / llm (サブエージェントの中の LLM の作業。内訳として持つ)
# processes[].phase: d2-foundation の phase。同じ phase を 2 回の派遣で回すとき (F7) は処理を 2 つ持ち、読み書きを同じにする (phase 表の 1 行と照合する)
# processes[].stage: stages の id。d2-run の ④ の直接作業は段階をまたぐので `uc`。どの段でも行う作業 (引き継ぎファイル・決めたことの記録・縦横レビュー・反証して直す) は `records` (全体図に描かず、処理ごとの図だけに描く)
# processes[].parent: 内訳の処理 (phase ごとのスクリプト、d2-run が回すスクリプト) の親。subagent の親は子の和を含む (派遣表の write-set と照合するため)
# processes[].scripts: 手順書の読む / 書くの節に出てくるスクリプト名 (パスとして照合しない)
# processes[].writes: 実際に書くもの / allowed_writes: 派遣文で許す範囲 (subagent のみ。writes を含む)
# processes[].notes: 派遣文の write-set にあるパスでない制約・例外の文言 (手順書と同じ文字列)
# processes[].write_set: 派遣文の write-set の文面そのもの (派遣表の「派遣ごとの write-set」の行を genDataflow.js が生成する。0.1.31)。
#   `、` で区切った断片の配列で、パスに付く注記はそのパスと同じ断片に書く。各パス表記は allowed_writes のどれかの store の表記 (path か aliases) に合い、
#   allowed_writes の各 store はどれかの表記に覆われ、notes の各文字列は文面に含まれる (dataflow.test.js (d))。写し (golden) との一致も見る
schema_version: distillery2.dataflow/v1

stages:
  - id: requirements
    name: ① 要求
  - id: decide
    name: ② 決定
  - id: foundation
    name: ③ 基盤
  - id: precheck
    name: ④ precheck (機能の最初の点検)
  - id: scenario
    name: ④ scenario
  - id: contract
    name: ④ contract
  - id: scaffold
    name: ④ scaffold
  - id: tier
    name: ④ tier
  - id: contract-gate
    name: ④ contract-gate
  - id: integrate
    name: ④ integrate
  - id: verify
    name: ④ verify
  - id: review
    name: ④ review
  - id: asbuilt
    name: ④ asbuilt
  - id: deliver
    name: ④ deliver
  - id: startup
    name: 起動時の移行 (UC の外。0.1.x の残りを片付ける)
  - id: records
    name: どの段でも (引き継ぎファイル・決めたことの記録・縦横レビュー)

store_groups:
  - id: input
    name: 要望 (外部入力)
  - id: packaged
    name: 同梱のひな形と手順書
  - id: requirements
    name: 要求
  - id: decisions
    name: 決定 (NFR・ADR)
  - id: settings
    name: 基盤の設定
  - id: test-infra
    name: テスト基盤
  - id: contracts
    name: 契約
  - id: design
    name: 画面
  - id: scenarios
    name: シナリオと step
  - id: code
    name: ティアの実装
  - id: run
    name: 実行の記録
  - id: asbuilt
    name: as-built
  - id: docs
    name: 文書の入口と課題ファイル
  - id: records
    name: 進行の記録 (引き継ぎ・決めたこと・レビュー)

stores:
  # ---- 外部入力・同梱 ----
  - id: request-text
    name: 要望テキスト
    group: input
    path: "<要望テキスト>"
    origin: external
  - id: rule-templates
    name: ルールのひな形 (同梱)
    group: packaged
    path: "<skills>/d2-foundation/references/rule-templates/**"
    origin: packaged
    aliases:
      - "references/rule-templates/"
  - id: support-templates
    name: テスト基盤のひな形 (同梱)
    group: packaged
    path: "<skills>/d2-foundation/templates/**"
    origin: packaged
    aliases:
      - "templates/test-support/"
      - "templates/features-support/"
      - "templates/cucumber.js"
      - "templates/tsx-register.js"
  - id: skill-docs
    name: スキルの手順書 (同梱)
    group: packaged
    path: "<skills>/**"
    origin: packaged
  # ---- ① 要求 ----
  - id: req-usdm
    name: 要求 (USDM)
    group: requirements
    path: "docs/requirements/requirements.yaml"
    origin: produced
    aliases:
      - "requirements.yaml"
      - "docs/requirements/requirements.md"
      - "requirements.md"
  - id: req-rdra
    name: RDRA モデル
    group: requirements
    path: "docs/requirements/rdra/**"
    origin: produced
    aliases:
      - "rdra/*.tsv"
      - "docs/requirements/rdra/*.tsv"
      - "docs/requirements/rdra/"
      - "条件.tsv"
      - "状態.tsv"
      - "情報.tsv"
      - "BUC.tsv"
  - id: use-cases
    name: UC 一覧
    group: requirements
    path: "docs/requirements/use-cases.yaml"
    origin: produced
    aliases:
      - "use-cases.yaml"
  - id: req-review
    name: 要求の確認材料
    group: requirements
    path: "docs/requirements/_review-summary.md"
    origin: produced
  - id: requirements-dir
    name: 要求のディレクトリ全体 (許可範囲)
    group: requirements
    path: "docs/requirements/**"
    origin: produced
    scope_only: true
  # ---- ② 決定 ----
  - id: nfr
    name: 非機能要求グレード表
    group: decisions
    path: "docs/nfr/**"
    origin: produced
    aliases:
      - "docs/nfr/nfr-grade.yaml"
      - "nfr-grade.md"
  - id: adr
    name: ADR
    group: decisions
    path: "docs/adr/*.md"
    origin: produced
    aliases:
      - "docs/adr/"
      - "docs/adr/NNNN-<slug>.md"
      - "docs/adr/index.md"
  - id: adr-architecture
    name: C4 図 (決定から)
    group: decisions
    path: "docs/adr/architecture.md"
    origin: produced
    terminal: true
  - id: adr-review
    name: 決定の確認材料
    group: decisions
    path: "docs/adr/_review-summary.md"
    origin: produced
  - id: adr-dir
    name: ADR のディレクトリ全体 (許可範囲)
    group: decisions
    path: "docs/adr/**"
    origin: produced
    scope_only: true
  # ---- ③ 基盤 ----
  - id: rules
    name: 開発ルール
    group: settings
    path: "docs/rules/**"
    origin: produced
    aliases:
      - "docs/rules/common.md"
      - "docs/rules/tier-<kind>.md"
      - "docs/rules/testing.md"
      - "docs/rules/index.md"
  - id: depcruise-config
    name: 依存方向の検査設定
    group: settings
    path: ".dependency-cruiser.cjs"
    origin: produced
  - id: test-support
    name: テスト基盤 (tracer・World)
    group: test-infra
    path: "packages/test-support/**"
    origin: produced
    aliases:
      - "packages/test-support/README.md"
  - id: features-support
    name: Cucumber の support
    group: test-infra
    path: "features/support/**"
    origin: produced
  - id: cucumber-config
    name: Cucumber 設定
    group: settings
    path: "cucumber.js"
    origin: produced
  - id: cucumber-loader
    name: Cucumber の ESM ローダ (cucumber.js が読む)
    group: settings
    path: "tsx-register.js"
    origin: produced
  - id: config
    name: 実行設定
    group: settings
    path: ".distillery/config.yaml"
    origin: produced
  - id: skeleton
    name: リポの骨格 (package.json・apps/*・packages/*)
    group: settings
    path: "package.json"
    origin: produced
    aliases:
      - "apps/*/"
      - "packages/*/"
      - "tsconfig.base.json"
      - ".gitignore"
      - "biome.json"
  - id: lockfile
    name: 依存の lockfile
    group: settings
    path: "package-lock.json"
    origin: produced
  - id: ci
    name: CI
    group: settings
    path: ".github/workflows/**"
    origin: produced
    terminal: true
    aliases:
      - ".github/workflows/ci.yml"
  - id: qlty-config
    name: qlty 設定
    group: settings
    path: ".qlty/qlty.toml"
    origin: produced
  - id: contracts-catalog
    name: 契約カタログ
    group: contracts
    path: "contracts/contracts.json"
    origin: produced
  - id: contracts-src
    name: 契約の分割ファイル
    group: contracts
    path: "contracts/**"
    origin: produced
  - id: uc-index
    name: UC ごとの契約の索引
    group: contracts
    path: "contracts/uc-index.yaml"
    origin: produced
  - id: contract-slice
    name: UC の契約 slice
    group: contracts
    path: "contracts/generated/slices/<slug>/**"
    origin: produced
    aliases:
      - "contracts/generated/slices/<slug>/contract-slice.json"
      - "rdb-slice.yaml"
  - id: contract-tests
    name: 契約テスト (生成物)
    group: contracts
    path: "apps/*/test/contract/**"
    origin: produced
  - id: migrations
    name: DB migration (datastore_owner のティア)
    group: contracts
    path: "apps/<tier>/migrations/**"
    origin: produced
    aliases:
      - "apps/<datastore_owner>/migrations/**"
      - "apps/<tier>/migrations/"
  - id: contracts-code
    name: 契約からの codegen
    group: contracts
    path: "packages/contracts/**"
    origin: produced
    aliases:
      - "packages/contracts/<id>/"
      - "packages/contracts/<id>/client.ts"
      - "packages/contracts/<id>/types.ts"
      - "server.ts"
  - id: design
    name: デザインシステム (Storybook アプリ)
    group: design
    path: "docs/design/**"
    origin: produced
    aliases:
      - "docs/design/screens.yaml"
  - id: ui
    name: 画面部品
    group: design
    path: "packages/ui/**"
    origin: produced
    aliases:
      - "packages/ui/"
  # ---- ④ UC ----
  - id: feature
    name: UC シナリオ
    group: scenarios
    path: "features/<業務>/<slug>.feature"
    origin: produced
    aliases:
      - "features/**/*.feature"
  - id: acceptance
    name: 受入シナリオ
    group: scenarios
    path: "features/acceptance/**"
    origin: produced
  - id: steps
    name: step 定義
    group: scenarios
    path: "features/step_definitions/**"
    origin: produced
    aliases:
      - "features/step_definitions/<slug>.steps.ts"
  - id: tier-src
    name: ティアの実装と単体テスト
    group: code
    path: "apps/<tier>/src/**"
    origin: produced
    aliases:
      - "apps/<tier>/src/**/*.test.ts"
      - "src/test-app.ts"
  - id: tier-dir
    name: ティアのディレクトリ全体 (許可範囲)
    group: code
    path: "apps/<tier>/**"
    origin: produced
    scope_only: true
  - id: run-events
    name: 実行の記録 (events / done / 退避した done)
    group: run
    path: "<run>/events.jsonl"
    origin: produced
    aliases:
      - "<run>/invalidated/**"
  - id: run-archive
    name: やり直した UC の前の run (runState.js reopen が移す。0.1.35)
    group: run
    path: ".distillery/archive/runs/<slug>/**"
    origin: produced
  - id: assumptions
    name: 実装者が補った前提
    group: run
    path: "<run>/attempt-<n>/assumptions.<tier>.yaml"
    origin: produced
  - id: findings
    name: Verifier の指摘
    group: run
    path: "<run>/attempt-<n>/findings.<tier>.yaml"
    origin: produced
    aliases:
      - "findings.<tier>.yaml"
  - id: issues
    name: 仕様起因の課題
    group: run
    path: "<run>/issues/**"
    origin: produced
  - id: issues-asbuilt
    name: as-built の要約役の課題
    group: run
    path: "<run>/issues/<ts>_asbuilt_<slug>.md"
    origin: produced
  - id: issues-consumed
    name: その場で巻き戻して直した課題の下書き (runState.js rewind が移す。課題ファイルにしない)
    group: run
    path: "<run>/issues/consumed/**"
    origin: produced
    terminal: true
  - id: decide-result
    name: 決定の差分の派遣の結果 (applied / blocked。gitignore)
    group: run
    path: ".distillery/logs/decide-<issue>.result.json"
    origin: produced
  - id: feedback-batch
    name: 0.1.x の還流のバッチの状態 (途中で止まったものを起動時に片付けるだけ。gitignore)
    group: run
    path: ".distillery/logs/feedback/<b>/**"
    origin: produced
  - id: worktrees
    name: 作業用の worktree (上流で止めるときの一時のもの。0.1.x の還流の worktree は片付けるだけ。gitignore)
    group: run
    path: ".distillery/worktrees/**"
    origin: produced
    terminal: true
    aliases:
      - ".distillery/worktrees/feedback"
      - ".distillery/worktrees/<slug>/<issue>"
  - id: reports
    name: ゲートの記録
    group: run
    path: "<run>/reports/**"
    origin: produced
    aliases:
      - "<run>/reports/gates.json"
      - "unit.<tier>.json"
      - "contract.<tier>.json"
      - "uc-bdd.json"
      - "acceptance-api.json"
  - id: asbuilt-report
    name: as-built の抽出の集計 (計装の有無)
    group: run
    path: "<run>/reports/asbuilt.json"
    origin: produced
  - id: traces
    name: 計装トレース
    group: run
    path: "<run>/traces/**"
    origin: produced
  - id: asbuilt-uc
    name: UC の as-built
    group: asbuilt
    path: "docs/as-built/<業務>/<UC>/**"
    origin: produced
  - id: asbuilt-index
    name: UC の as-built の index.md (要約ブロックを含む)
    group: asbuilt
    path: "docs/as-built/<業務>/<UC>/index.md"
    origin: produced
  - id: asbuilt-system
    name: システム横断の as-built
    group: asbuilt
    path: "docs/as-built/_system/**"
    origin: produced
    aliases:
      - "docs/as-built/_system/traceability-index.json"
  - id: docs-readme
    name: 文書の入口
    group: docs
    path: "docs/README.md"
    origin: produced
    terminal: true
  - id: feedback-docs
    name: 課題ファイルと一覧 (取り込む段階が反映したら削除する。一覧 README.md は genDocsReadme が生成)
    group: docs
    path: "docs/feedback/**"
    origin: produced
    aliases:
      - "docs/feedback/<issue>.md"
      - "docs/feedback/*.md"
  - id: feedback-index
    name: 課題の一覧 (genDocsReadme が課題ファイルから生成。0 件なら消す)
    group: docs
    path: "docs/feedback/README.md"
    origin: produced
    terminal: true
  # ---- 進行の記録 (0.2.0。機能の中は <run> の下で feature の commit に、上流の段は .distillery/ の下でその段の commit に入る。どれも追跡する) ----
  - id: handoff-run
    name: 引き継ぎファイル (機能の中。人に聞くこと・前のステップの課題・反証)
    group: records
    path: "<run>/handoff/**"
    origin: produced
  - id: handoff-upstream
    name: 引き継ぎファイル (上流の段: ①②③・上流の差分)
    group: records
    path: ".distillery/handoff/**"
    origin: produced
  - id: decisions-run
    name: 決めたことの記録 (機能の中)
    group: records
    path: "<run>/decisions.jsonl"
    origin: produced
    terminal: true
  - id: decisions-upstream
    name: 決めたことの記録 (上流の段)
    group: records
    path: ".distillery/decisions.jsonl"
    origin: produced
    terminal: true
  - id: reviews-run
    name: 縦・横レビューの依頼文と結果 (機能の中)
    group: records
    path: "<run>/reviews/**"
    origin: produced
    terminal: true
  - id: reviews-upstream
    name: 縦・横レビューの依頼文と結果 (上流の段)
    group: records
    path: ".distillery/reviews/**"
    origin: produced
    terminal: true
  # ---- 写し直し (0.3.0。上流で止めた機能を、上流を直した後の main の上で続ける) ----
  - id: resume-diffs
    name: 写し直しで統合できなかった機能側の差分 (担当が反映するか取り下げる)
    group: run
    path: "<run>/resume/**"
    origin: produced
  - id: resume-journal
    name: 写し直しの処理の記録 (gitignore。途中で止まったら続きから行う)
    group: run
    path: ".distillery/logs/resume-<slug>.json"
    origin: produced

processes:
  # ================= ① 要求 =================
  - id: requirements
    name: 要求の整理
    skill: d2-requirements
    stage: requirements
    kind: subagent
    template_row: "① 要求"
    write_set:
      - "`docs/requirements/**`"
    reads: [request-text, feedback-docs]
    writes: [req-usdm, req-rdra, use-cases, req-review]
    allowed_writes: [requirements-dir]
  # ================= ② 決定 =================
  - id: decide
    name: 品質特性と設計の決定
    skill: d2-decide
    stage: decide
    kind: subagent
    template_row: "② 決定"
    write_set:
      - "`docs/nfr/**`"
      - "`docs/adr/**`"
    reads: [req-usdm, req-rdra, use-cases]
    writes: [nfr, adr, adr-review]
    allowed_writes: [nfr, adr-dir]
  # ================= ③ 基盤 =================
  - id: foundation
    name: 基盤の生成 (F1→F2→F3→F5→F7)
    skill: d2-foundation
    stage: foundation
    kind: subagent
    template_row: "③ 基盤 (機械)"
    write_set:
      - "`docs/rules/**`"
      - "`.dependency-cruiser.cjs`"
      - "`packages/test-support/**`"
      - "`features/support/**`"
      - "`cucumber.js`"
      - "`tsx-register.js`"
      - "`.distillery/config.yaml`"
      - "`.github/workflows/**`"
      - "`.qlty/qlty.toml`"
      - "`apps/*/`"
      - "`packages/*/`"
      - "`package.json`"
      - "`tsconfig.base.json`"
      - "`.gitignore`"
      - "`biome.json`"
      - "`package-lock.json`。例外: `npm install` が作る `node_modules/**` (gitignore)"
    reads: [adr, rule-templates, support-templates, contracts-catalog, config, skeleton, lockfile, qlty-config]
    writes: [rules, depcruise-config, test-support, features-support, cucumber-config, cucumber-loader, config, skeleton, ci, qlty-config, lockfile]
    allowed_writes: [rules, depcruise-config, test-support, features-support, cucumber-config, cucumber-loader, config, skeleton, ci, qlty-config, lockfile]
    notes:
      - "例外: `npm install` が作る `node_modules/**` (gitignore)"
  - id: foundation.F1
    name: F1 ルール
    parent: foundation
    stage: foundation
    kind: script
    phase: F1
    reads: [adr, rule-templates]
    writes: [rules]
  - id: foundation.F2
    name: F2 依存方向の検査
    parent: foundation
    stage: foundation
    kind: script
    phase: F2
    reads: [adr]
    writes: [depcruise-config]
  - id: foundation.F3
    name: F3 テスト基盤
    parent: foundation
    stage: foundation
    kind: script
    phase: F3
    reads: [support-templates]
    writes: [test-support, features-support, cucumber-config, cucumber-loader]
  - id: foundation.F5
    name: F5 設定・骨格・CI・qlty
    parent: foundation
    stage: foundation
    kind: script
    phase: F5
    reads: [adr, contracts-catalog, config]
    writes: [config, skeleton, ci, qlty-config]
  - id: foundation.F7
    name: F7 依存の導入 (npm install・qlty の提案)
    parent: foundation
    stage: foundation
    kind: script
    phase: F7
    scripts: [genQlty.js]
    reads: [skeleton, lockfile, qlty-config]
    writes: [lockfile, qlty-config]
  - id: contract.skeleton
    name: 契約の骨格
    skill: d2-contract
    mode: skeleton
    stage: foundation
