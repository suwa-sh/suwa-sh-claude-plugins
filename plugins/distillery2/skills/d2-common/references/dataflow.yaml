    mode: precheck
    stage: precheck
    kind: subagent
    template_row: "④ precheck (ティアごと並列)"
    notes:
      - "なし (読むだけ。書くのは引き継ぎファイルだけ)"
    write_set:
      - "なし (読むだけ。書くのは引き継ぎファイルだけ)"
    reads: [config, use-cases, req-usdm, req-rdra, adr, rules, contracts-src, design, ui]
    writes: []
    allowed_writes: []
