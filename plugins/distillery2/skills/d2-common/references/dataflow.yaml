    stage: scaffold
    kind: subagent
    template_row: "④ scaffold"
    write_set:
      - "`features/step_definitions/**`"
      - "`apps/<tier>/src/**/*.test.ts`"
      - "`apps/<tier>/src/**` (テストが import する入口の最小スタブ。**新規ファイルだけ**。既存ファイルの変更・削除は不可)"
      - "`<run>/reports/**` (完了条件の `--expect-red unit` が書く。単独の段なので競合しない)"
