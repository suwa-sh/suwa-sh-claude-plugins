    writes: [feedback-docs, run-events]
  # ---- 起動時の移行 (0.1.28。配送済みなのに課題ファイルにしていない run の課題を、課題を数える前に課題ファイルにする) ----
  - id: run.migrate-issues
    name: 旧形式の run の課題を課題ファイルにする (起動時の移行)
    stage: feedback
    kind: script
    actor: d2-run
    scripts: [feedbackBatch.js]
    run_table_row: "起動時の feedbackBatch.js file-issues (移行)"
    reads: [issues, issues-tier, run-events]
    writes: [feedback-docs, run-events]
  - id: run.migrate-readme
    name: 文書の入口の更新 (起動時の移行)
    stage: feedback
    kind: script
    actor: d2-run
    scripts: [genDocsReadme.js]
    run_table_row: "起動時の genDocsReadme.js (移行)"
    reads: [config, req-rdra, req-usdm, use-cases, feature, acceptance, contracts-catalog, uc-index, design, asbuilt-system, asbuilt-uc, adr, nfr, rules, feedback-docs]
    writes: [docs-readme, feedback-index]
  # ================= 還流 (d2-run。UC の外。main から切った worktree 1 つで溜まった課題をまとめて直す) =================
  - id: run.feedback
    name: d2-run (還流)
    stage: feedback
    kind: orchestrator
    actor: d2-run
    run_table_row: "還流の進行・確認ページ"
    reads: [config, use-cases, uc-index, feedback-docs, feedback-batch, feedback-result]
    writes: [feedback-batch]
  - id: run.feedback.batch
    name: 還流の git の状態遷移 (切り出し・課題の commit・止める・仕上げ・組み直し・取り込み)
    parent: run.feedback
    stage: feedback
    kind: script
    actor: d2-run
    scripts: [feedbackBatch.js, genAdrIndex.js, genRules.js, genArchTests.js, compileContracts.js, compileRdbSchema.js, validateUcIndex.js, genContractTests.js, genRdbDdl.js, genDocsReadme.js, validateAdr.js]
    run_table_row: "還流の feedbackBatch.js"
    reads: [feedback-docs, adr, rule-templates, contracts-src, config, feedback-batch]
    writes: [worktrees, feedback-batch, feedback-failed, feedback-docs, adr, rules, depcruise-config, contracts-catalog, contract-slice, contract-tests, contracts-code, migrations, docs-readme, feedback-index]
  - id: run.feedback.gates
    name: 還流のゲート (課題ごとの static と最後のゲート)
    parent: run.feedback
    stage: feedback
    kind: script
    actor: d2-run
    scripts: [runGates.js]
    run_table_row: "還流の runGates.js"
    reads: [config, skeleton, lockfile, cucumber-config, cucumber-loader, qlty-config, tier-src, contract-tests, migrations, feature, acceptance, steps, features-support, depcruise-config, reports]
    writes: [reports, traces]
  # ---- 還流の受理 (d2-run が worktree で、課題の commit の前に回す。読むだけ) ----
  - id: run.feedback.validate-adr
    name: 還流の ADR の検証
    parent: run.feedback
    stage: feedback
    kind: script
    actor: d2-run
    scripts: [validateAdr.js]
    run_table_row: "還流の validateAdr.js (受理)"
    reads: [adr]
    writes: []
  - id: run.feedback.check-contract-tests
    name: 契約テストの鮮度 (--check)
    parent: run.feedback
    stage: feedback
    kind: script
    actor: d2-run
    scripts: [genContractTests.js]
    run_table_row: "還流の genContractTests.js --check (受理)"
    reads: [contracts-src, config, contract-tests, contracts-code]
    writes: []
  - id: run.feedback.check-rdb-ddl
    name: DB の生成物の鮮度 (--check)
    parent: run.feedback
    stage: feedback
    kind: script
    actor: d2-run
    scripts: [genRdbDdl.js]
    run_table_row: "還流の genRdbDdl.js --check (受理)"
    reads: [contracts-src, config, migrations, contract-tests, contracts-code]
    writes: []
  # ================= 還流の派遣 (d2-run が main から切った worktree .distillery/worktrees/feedback で派遣する。パスはそこからの相対) =================
  - id: decide.feedback
    name: 還流の ADR
    skill: d2-decide
    mode: feedback
    stage: feedback
    kind: subagent
    template_row: "還流 (ADR)"
    write_set:
      - "`docs/adr/**`"
      - "`.distillery/logs/feedback/<b>/<issue>.result.json`"
    reads: [feedback-docs, adr]
    writes: [adr, feedback-result]
    allowed_writes: [adr-dir, feedback-result]
    scripts: [validateAdr.js, genAdrIndex.js]
  - id: contract.feedback
    name: 還流の契約
    skill: d2-contract
    mode: feedback
    stage: feedback
    kind: subagent
    template_row: "還流 (契約)"
    write_set:
      - "`contracts/**`"
      - "`apps/*/test/contract/**`"
      - "`apps/<datastore_owner>/migrations/**`"
      - "`packages/contracts/**`"
      - "`.distillery/logs/feedback/<b>/<issue>.result.json`"
    reads: [feedback-docs, contracts-src, uc-index, config]
    writes: [contracts-src, contract-tests, migrations, contracts-code, feedback-result]
    allowed_writes: [contracts-src, contract-tests, migrations, contracts-code, feedback-result]
    scripts: [compileContracts.js, compileRdbSchema.js, validateUcIndex.js, genContractTests.js, genRdbDdl.js]
